 EU_single_europ_evro_desc: "The Madrid agreements launched an irreversible integration process. The abolition of internal barriers and preparations for the introduction of the euro stimulate a powerful influx of investment and simplify trade. However, the strict monetary requirements of the transition period limit economic sovereignty and tie the hands of our government."
 EU_single_evror: "Euro"
 USA_trade_deficit: "Trade Deficit"
 USA_trade_deficit_desc: "In the early 1980s, the US economy faced serious challenges that ultimately led to a record trade deficit in 1985. The background to this crisis lies in the combination of the tight monetary policy of Fed Chairman Paul Volcker and the fiscal policy of President Ronald Reagan. To combat double-digit inflation, Volcker raised interest rates to historic highs, which attracted foreign capital to the country and caused a sharp strengthening of the dollar. At the same time, Reagan cut taxes and increased military spending, creating a huge budget deficit that the government covered through borrowing, further fueling the growth of rates and the national currency. As a result, the dollar became incredibly expensive, American exports lost competitiveness, and imports, on the contrary, became extremely cheap. Goods from Japan and West Germany flooded the American market, which led to the formation of a gigantic debt hole and trade imbalance.\n\nTo overcome this trade deficit, the US needed a coordinated international devaluation of the dollar, since it was impossible to weaken the currency alone without retaliatory actions from trading partners. This is why in the game you must first hold an OECD summit, gathering key players at the negotiating table, and then propose they sign the 'Plaza Accord'. Historically, this 1985 agreement became a turning point: the US, Japan, West Germany, France and the UK agreed on a joint currency intervention, during which a massive sale of dollars began. This led to the dollar depreciating by about half against the yen and mark, making American goods competitive again on the world market, and imports more expensive for Americans. However, devaluation alone is not enough. To sustainably overcome the deficit, the US also needed to reduce its domestic budget deficit to ease pressure on interest rates, and force partners to open their markets to American exports."
