 USA_reaganomics_policy: "Reaganomics Policy"
 USA_reaganomics_policy_desc: "The background of 'Reaganomics' is the difficult 1970s: stagflation, when inflation, unemployment and zero growth went hand in hand. The Keynesian model, where the state stimulates demand through spending, stopped working and only accelerated prices. In 1980, Reagan came to power with a different logic — supply-side theory. The meaning is simple: stop strangling business with taxes and regulation, give it an incentive to invest in production, and growth and jobs will come by themselves. In game terms, this means sharply cutting taxes for corporations and the wealthy, loosening control over markets, and betting on private initiative.\n\nBut, as in reality, you will have to make contradictory decisions. To launch the mechanism, you need to cut social programs and at the same time inflate military spending. The first effect will be painful: a short recession, rising unemployment, and to fight inflation — a sharp increase in interest rates. It is this that will strengthen the dollar and lead to a trade deficit and the very 'Plaza Accord'.\n\nThe main difficulty is not to let the national debt explode. Tax cuts plus a growing defense budget create a huge deficit that will have to be covered by borrowing. After the initial impulse from tax cuts, you need to gradually cut spending in other areas or seek new revenues."
