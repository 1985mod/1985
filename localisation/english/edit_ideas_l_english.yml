 CRO_struggle_for_independence_desc: "When the bonds of the Yugoslav federation collapsed, the very idea of Croatian statehood was at stake. The centuries-old striving for a own country, suppressed for decades by unitary centralism, burst forth in the fire of the street barricades of Vukovar and the sieges of Dubrovnik. This war is not just a conflict over territory: it is an existential battle of a people who revived the red-and-white checkerboard as a symbol of their right to life."
