l_english:
 CZE_new_1985: "New 1985"
 CZE_new_1985_desc: "The year 1985 has arrived. Czechoslovakia is the showcase of socialism and commercial abundance in Europe. We must not lose this status!"
 CZE_west: "The West"
 CZE_west_desc: "The extraordinary party congress is revisiting its decision regarding Slovakia and the West in general. Now the CSSR must move toward friendship with Western Europe."
 CZE_army_reform: "New Doctrine of the CSSR"
 CZE_army_reform_desc: "The armed forces of the CSSR must be ready to deliver a crushing blow to NATO. Thus, the CSSR is changing its doctrine to a lightning strike."
 CZE_East: "The East"
 CZE_East_desc: "Husak spoke for the first time about the 'specifics of socialism in the CSSR,' which does not need reforms. As an argument, he used the assertion that the economy of the CSSR works better than the Polish one, and the standard of living is higher than in other socialist countries."
 CZE_prepare_the_stasi: "Echo of 68"
 CZE_prepare_the_stasi_desc: "The CSSR is not satisfied with the reforms that have begun in the USSR. Because of this, a decision has been made to interfere in KGB affairs on the territory of the CSSR. The leadership of the State Security Service has been given a verbal order to arrest KGB agents."
 CZE_change_of_courses_in_the_ussr: "Change of Course in the USSR"
 CZE_change_of_courses_in_the_ussr_desc: "The CSSR condemns the new vision of the USSR regarding the world. The leadership of the CPC is dissatisfied with the changes taking place in the Soviet Union, such as glasnost and the democratization of political life."
 CZE_new_department_in_dresden: "Negotiations with the Velvet Movement"
 CZE_new_department_in_dresden_desc: "The government of Czechoslovakia must hold negotiations with the demonstrators. This will be a sign of cooperation and discussion of reforms in the country. We must not repeat 1968."
 CZE_conflict_with_the_kgb: "Freedom for Czechoslovakia?"
 CZE_conflict_with_the_kgb_desc: "Political tension between the government of the CSSR and the leadership of the USSR arose mainly in connection with the processes of reform and changes initiated by the new leadership of the country. The CPC is discussing the full independence of the state and the country's withdrawal from the Warsaw Pact."
 CZE_german_reforms: "Full Market Socialist Reform"
 CZE_german_reforms_desc: "Due to instability in the USSR, East Germany began to experience a crisis. The Soviet Union insists on carrying out its perestroika reforms, but on the other hand, the people are rebelling. We must tighten the screws, but also promise the USSR about democracy."
 CZE_the_hunt_for_the_kgb: "President of Czechoslovakia"
 CZE_the_hunt_for_the_kgb_desc: "The government has decided on liberalization in order to preserve a united Czechoslovakia. In connection with this, the country requires free elections. The first step is the presidency."
 CZE_honecker_resignation: "Resignation of Gustav Husak"
 CZE_honecker_resignation_desc: "The reason for Gustav Husak's departure from the post of President was the sharp deterioration of the internal situation in the country, and health problems. The decision on resignation was made at a meeting of the party's politburo."
 CZE_own_perestroika: "Federalization of Czechoslovakia"
 CZE_own_perestroika_desc: "The new government of the CSSR is satisfied with the ideas of perestroika in the USSR. But Slovakia strives for greater autonomy, Moscow approves this step and we are forced to make a concession and create the Czech and Slovak Federal Republic."
 CZE_new_shipyards: "Development of the Military-Industrial Complex"
 CZE_new_shipyards_desc: "To repel aggression from NATO, the CSSR requires a large amount of weapons, therefore: a decision has been made to build new factories in Slovakia."
 CZE_the_fleet_is_prepared: "Exercises 'Friendship of Peoples'"
 CZE_the_fleet_is_prepared_desc: "The Czechoslovak People's Army will conduct a series of exercises to repel an airborne assault on the territory of the CSSR."
 CZE_aviation: "Air Force of the CSSR"
 CZE_aviation_desc: "The aviation of Czechoslovakia must be prepared for combat operations. Thus, we must conduct new recruitments into the ranks of pilots and deploy large-scale aviation exercises."
 CZE_the_best_artillery: "The Best Artillery"
 CZE_the_best_artillery_desc: "The artillery of Czechoslovakia must become the deadliest obstacle for the West."
 CZE_tanks: "Development of Tankograd"
 CZE_tanks_desc: "The CSSR requires large-scale production of its own tanks. We must invest in this industry to the maximum."
 CZE_the_best_infantry: "The Best Infantry"
 CZE_the_best_infantry_desc: "The infantry of Czechoslovakia must become the deadliest obstacle for the West."
 CZE_friendship_with_germany: "Peaceful Revolution"
 CZE_friendship_with_germany_desc: "The CSSR is revisiting its actions with its neighbors. First of all, we must resolve the issue with Slovakia. Perhaps we will soon have to make concessions and recognize their independence."
 CZE_invest_in_oil_refineries: "Investments in Oil Refineries"
 CZE_invest_in_oil_refineries_desc: "Czechia must invest in oil refineries. Due to the changes in the USSR, we can expect many things."
 CZE_new_oil_refineries: "New Oil Refineries"
 CZE_new_oil_refineries_desc: "The government is investing in the construction of oil refineries in several cities of our country."
 CZE_development_of_the_military_industrial_complex: "Development of the CSSR Military-Industrial Complex"
 CZE_development_of_the_military_industrial_complex_desc: "The CSSR urgently needs to invest in the military-industrial complex before it is too late. Czechoslovakia requires equipment and vehicles."
 CZE_investments_in_factories: "Investments in Factories"
 CZE_investments_in_factories_desc: "The party has decided to invest in the social development of goods and services. The people need new jobs and goods."
 CZE_government_support: "Support of the CSSR Government"
 CZE_government_support_desc: "The government supports the development of factory production."
 CZE_the_Industrial_fist: "The Industrial Fist"
 CZE_the_Industrial_fist_desc: "The CSSR directs all its resources toward the industrialization of its industry. The CSSR must become the first communist power in the world."
 CZE_exit_from_the_ats: "Czechoslovakia's Withdrawal from the Warsaw Pact"
 CZE_exit_from_the_ats_desc: "Popular unrest is taking place in the CSSR. The people demand an end to cooperation with the USSR and a transition to peaceful life. We must withdraw from the Warsaw Pact, this is the will of the people!"
 CZE_demolish_the_berlin_wall: "Velvet Revolution"
 CZE_demolish_the_berlin_wall_desc: "The people are dissatisfied with our policies. Mass demonstrations that began in Prague and spread throughout Czechoslovakia, the demonstrators demand the opening of borders and the sovereignty of Slovakia."
 CZE_changes_in_the_CZE: "Changes in the CSFR"
 CZE_changes_in_the_CZE_desc: "Despite the changes within the country, we remain loyal to the Soviet Union. We count on maintaining friendly relations with Moscow."
 CZE_change_of_course: "Change of Course"
 CZE_change_of_course_desc: "The CSSR faces important decisions. All 3 decisions will affect the fate of our country — globally. Do we remain loyal to socialism, dissolve the CSSR, or withdraw from the Warsaw Pact?"
 CZE_western_and_neutral_germany: "Neutral Czechia"
 CZE_western_and_neutral_germany_desc: "Czechia must withdraw from the Warsaw Pact and become a neutral country. But before that, the parliament must vote for the cessation of the existence of Czechoslovakia."
 CZE_accession_to_the_federal_republic_of_germany: "Czechia and Slovakia?"
 CZE_accession_to_the_federal_republic_of_germany_desc: "This event will mark the completion of the long unification of the two peoples and restore democratic justice."
 CZE_reunification_negotiations: "Negotiations with the USSR"
 CZE_reunification_negotiations_desc: "Before the dissolution of the CSSR, we must clarify a few points for ourselves..."
 CZE_demolition_of_the_wall: "Dismantling of Socialism"
 CZE_demolition_of_the_wall_desc: "For unification with the FRG and the establishment of a neutral Germany — we must demolish the main symbol of the Cold War. Namely: the Berlin Wall."
 CZE_the_destruction_of_communism: "Federalization — CSFR"
 CZE_the_destruction_of_communism_desc: "The CSSR begins the dismantling of the socialist system of governing the country. We must hold democratic elections and dissolve the Stasi. But before that: destroy secret documents."
 CZE_1: "Cooperation with the GDR and the USSR"
 CZE_1_desc: "Czechoslovakia begins cooperation in the military and industrial sphere with two fraternal countries. Our state needs the technologies of our neighbors."
 CZE_2: "Tightening of Legislation"
 CZE_2_desc: "The country's leadership cannot allow a repetition of the GDR's mistakes. In connection with this, a decision has been made on mass propaganda of socialism in the country. Free leaflets with Lenin are coming in!"
 CZE_3: "Views on Neighbors"
 CZE_3_desc: "The military leadership of the country sees danger in NATO. The leadership of East Germany could not hold on to power, we must not allow this here either."
 CZE_4: "We Are Waiting for Change!"
 CZE_4_desc: "Our state has become stable. There are no rebels, no enemies of the nation. Now our country is moving forward, on the path to a bright future."
 CZE_5: "Support for New Allies"
 CZE_5_desc: "The USA, Great Britain, France are ready to provide support to the new democratic state. We give permission for the purchase of our factories by the Americans."
 CZE_6: "Application to NATO"
 CZE_6_desc: "Czechia in its history has been part of several states. Now, when Czechia has finally gained true freedom — it requires protection. We submit an application to NATO and hope for its acceptance."
 CZE_7: "Collapse of Socialism"
 CZE_7_desc: "The socialist idea has suffered a collapse in our state. Now Czechia must follow the path of new democracy. Liberty, equality, fraternity!"
 CZE_8: "Propaganda, Reforms and Computers"
 CZE_8_desc: "Lenin, Marx — these are whom we must imitate! The CSFR must follow the path to communism! New reforms must develop the social sphere of the country and finally begin the development of the computer industry."
