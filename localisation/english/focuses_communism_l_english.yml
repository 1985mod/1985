l_english:
 CZE_new_1985: "New 1985"
 CZE_new_1985_desc: "The year 1985 has arrived. Czechoslovakia is the showcase of socialism and consumer abundance in Europe. We must not lose this status!"
 CZE_west: "West"
 CZE_west_desc: "The extraordinary party congress revisits its decision regarding Slovakia and the West in general. Now the ČSSR must move toward friendship with Western Europe."
 CZE_army_reform: "New Doctrine of the ČSSR"
 CZE_army_reform_desc: "The armed forces of the ČSSR must be ready to deliver a crushing blow to NATO. By doing so, the ČSSR changes its doctrine to a lightning strike."
 CZE_East: "East"
 CZE_East_desc: "For the first time, Husák spoke of the 'specifics of socialism in the ČSSR,' which does not need reforms. As an argument, he used the claim that the ČSSR economy works better than Poland's and the standard of living is higher than in other socialist countries."
 CZE_prepare_the_stasi: "Echo of '68"
 CZE_prepare_the_stasi_desc: "The ČSSR is not satisfied with the reforms that have begun in the USSR. Because of this, a decision was made to interfere in KGB affairs on ČSSR territory. The leadership of the StB has been given a verbal order to arrest KGB agents."
 CZE_change_of_courses_in_the_ussr: "Change of Course in the USSR"
 CZE_change_of_courses_in_the_ussr_desc: "The ČSSR condemns the USSR's new vision of the world. The KSČ leadership is displeased with the changes taking place in the Soviet Union, such as glasnost and the democratization of political life."
 CZE_new_department_in_dresden: "Negotiations with the Velvet Movement"
 CZE_new_department_in_dresden_desc: "The government of Czechoslovakia must negotiate with the demonstrators. This will be a sign of cooperation and discussion of reforms in the country. We must not repeat 1968."
 CZE_conflict_with_the_kgb: "Freedom for Czechoslovakia?"
 CZE_conflict_with_the_kgb_desc: "Political tension between the ČSSR government and the Soviet leadership arose mainly in connection with the reform processes and changes initiated by the country's new leadership. The KSČ is discussing the complete independence of the state and the country's withdrawal from the Warsaw Pact."
 CZE_german_reforms: "Full Market Socialist Reform"
 CZE_german_reforms_desc: "Due to instability in the USSR, East Germany has begun to experience a crisis. The Soviet Union insists on carrying out its perestroika reforms, but on the other hand, the people are rebelling. We must tighten the screws, but also promise the USSR democracy."
 CZE_the_hunt_for_the_kgb: "President of Czechoslovakia"
 CZE_the_hunt_for_the_kgb_desc: "The government has decided on liberalization in order to preserve a united Czechoslovakia. In this connection, the country needs free elections. The first step is the presidency."
 CZE_honecker_resignation: "Resignation of Gustáv Husák"
 CZE_honecker_resignation_desc: "The reason for President Gustáv Husák's departure from office was the sharp deterioration of the domestic situation in the country and health problems. The resignation decision was made at a meeting of the party's Politburo."
 CZE_own_perestroika: "Federalization of Czechoslovakia"
 CZE_own_perestroika_desc: "The new ČSSR government is satisfied with the ideas of perestroika in the USSR. But Slovakia strives for greater autonomy; Moscow approves this step, and we are forced to make a concession and create the Czech and Slovak Federative Republic."
 CZE_new_shipyards: "Development of the Defense Industry"
 CZE_new_shipyards_desc: "To repel aggression from NATO, the ČSSR requires a large amount of weapons; therefore, a decision was made to build new factories in Slovakia."
 CZE_the_fleet_is_prepared: "Exercise 'Friendship of Peoples'"
 CZE_the_fleet_is_prepared_desc: "The Czechoslovak People's Army will conduct a series of exercises to repel an airborne landing on ČSSR territory."
 CZE_aviation: "ČSSR Air Force"
 CZE_aviation_desc: "Czechoslovak aviation must be prepared for combat operations. By doing so, we must conduct new recruitment into the ranks of pilots and launch large-scale aviation exercises."
 CZE_the_best_artillery: "The Best Artillery"
 CZE_the_best_artillery_desc: "Czechoslovak artillery must become the deadliest obstacle for the West."
 CZE_tanks: "Development of Tankograd"
 CZE_tanks_desc: "The ČSSR requires large-scale production of its own tanks. We must invest in this sector to the maximum."
 CZE_the_best_infantry: "The Best Infantry"
 CZE_the_best_infantry_desc: "Czechoslovak infantry must become the deadliest obstacle for the West."
 CZE_friendship_with_germany: "Velvet Revolution"
 CZE_friendship_with_germany_desc: "The ČSSR is revising its actions with its neighbors. First of all, we must resolve the issue with Slovakia. Perhaps we will soon have to make concessions and recognize their independence."
 CZE_invest_in_oil_refineries: "Investments in Oil Refineries"
 CZE_invest_in_oil_refineries_desc: "Czechia must invest in oil refineries. Due to the changes in the USSR, we can expect a lot."
 CZE_new_oil_refineries: "New Oil Refineries"
 CZE_new_oil_refineries_desc: "The government is investing in the construction of oil refineries in several cities of our country."
 CZE_development_of_the_military_industrial_complex: "Development of the ČSSR Defense Industry"
 CZE_development_of_the_military_industrial_complex_desc: "The ČSSR urgently needs to invest in the military-industrial complex before it is too late. Czechoslovakia requires equipment and vehicles."
 CZE_investments_in_factories: "Investments in Factories"
 CZE_investments_in_factories_desc: "The party has decided to invest in the social development of goods and services. The people need new jobs and goods."
 CZE_government_support: "Support for the ČSSR Government"
 CZE_government_support_desc: "The government supports the development of factory production."
 CZE_the_Industrial_fist: "Industrial Fist"
 CZE_the_Industrial_fist_desc: "The ČSSR directs all its resources toward the industrialization of its industry. The ČSSR must become the world's first communist power."
 CZE_exit_from_the_ats: "Czechoslovakia's Withdrawal from the Warsaw Pact"
 CZE_exit_from_the_ats_desc: "Popular unrest is occurring in the ČSSR. The people demand an end to cooperation with the USSR and a transition to peaceful life. We must withdraw from the Warsaw Pact; this is the will of the people!"
 CZE_demolish_the_berlin_wall: "Velvet Revolution"
 CZE_demolish_the_berlin_wall_desc: "The people are dissatisfied with our policies. Mass demonstrations that began in Prague and spread throughout Czechoslovakia; the demonstrators demand the opening of borders and sovereignty for Slovakia."
 CZE_changes_in_the_CZE: "Changes in the ČSFR"
 CZE_changes_in_the_CZE_desc: "Despite the changes within the country, we remain loyal to the Soviet Union. We count on preserving friendly relations with Moscow."
 CZE_change_of_course: "Change of Course"
 CZE_change_of_course_desc: "The ČSSR faces important decisions. All 3 decisions will affect the fate of our country globally. Do we remain loyal to socialism, dissolve the ČSSR, or withdraw from the Warsaw Pact?"
 CZE_western_and_neutral_germany: "Neutral Czechia"
 CZE_western_and_neutral_germany_desc: "Czechia must withdraw from the Warsaw Pact and become a neutral country. But before that, parliament must vote for the termination of the existence of Czechoslovakia."
 CZE_accession_to_the_federal_republic_of_germany: "Czechia and Slovakia?"
 CZE_accession_to_the_federal_republic_of_germany_desc: "This event will mark the completion of the long unification of the two peoples and restore democratic justice."
 CZE_reunification_negotiations: "Negotiations with the USSR"
 CZE_reunification_negotiations_desc: "Before the dissolution of the ČSSR, we must clarify several points for ourselves..."
 CZE_demolition_of_the_wall: "Dismantling of Socialism"
 CZE_demolition_of_the_wall_desc: "To unite with the FRG and become a neutral Germany, we must tear down the main symbol of the Cold War. Namely: the Berlin Wall."
 CZE_the_destruction_of_communism: "Federalization - ČSFR"
 CZE_the_destruction_of_communism_desc: "The ČSSR is beginning the dismantling of the socialist system of governing the country. We must hold democratic elections and dissolve the Stasi. But before that: destroy secret documents."
 CZE_1: "Cooperation with the GDR and the USSR"
 CZE_1_desc: "Czechoslovakia is beginning cooperation in the military and industrial sphere with two brotherly countries. Our state needs the technologies of our neighbors."
 CZE_2: "Tightening Legislation"
 CZE_2_desc: "The country's leadership cannot allow a repetition of the GDR's mistakes. In this connection, a decision has been made for mass propaganda of socialism in the country. Free leaflets with Lenin are coming in!"
 CZE_3: "Views on Neighbors"
 CZE_3_desc: "The country's military leadership sees danger in NATO. The leadership of East Germany failed to hold on to power; we must not allow this to happen here."
 CZE_4: "We Are Waiting for Change!"
 CZE_4_desc: "Our state has become stable. There are no rebels or enemies of the nation. Now our country is moving forward on the path to a bright future."
 CZE_5: "Support for New Allies"
 CZE_5_desc: "The USA, Great Britain, and France are ready to provide support to the new democratic state. We give permission for Americans to buy our factories."
 CZE_6: "Application to NATO"
 CZE_6_desc: "Over its history, Czechia has been part of several states. Now, when Czechia has finally gained true freedom, it needs protection. We submit an application to NATO and hope it will be accepted."
 CZE_7: "Collapse of Socialism"
 CZE_7_desc: "The socialist idea has suffered a collapse in our state. Now Czechia must follow the path of new democracy. Freedom, equality, brotherhood!"
 CZE_8: "Propaganda, Reforms, and Computers"
 CZE_8_desc: "Lenin, Marx - these are the ones we must imitate! The ČSFR must follow the path toward communism! New reforms must develop the country's social sphere and finally begin the development of the computer industry."
