l_english:
 CZE_new_1985: "New 1985"
 CZE_new_1985_desc: "The year 1985 has arrived. Czechoslovakia is a showcase of socialism and trade abundance in Europe. We must not lose this status!"
 CZE_west: "The West"
 CZE_west_desc: "An extraordinary party congress reconsiders its decision regarding Slovakia and the West in general. Now the ČSSR must move toward friendship with Western Europe."
 CZE_army_reform: "New ČSSR Doctrine"
 CZE_army_reform_desc: "The ČSSR Armed Forces must be ready to deliver a crushing blow to NATO. Thereby, the ČSSR changes its doctrine to a lightning strike."
 CZE_East: "The East"
 CZE_East_desc: "Husák spoke for the first time about the 'specifics of socialism in the ČSSR', which needs no reforms. As an argument, he used the claim that the Czechoslovak economy works better than the Polish one, and the standard of living is higher than in other socialist countries."
 CZE_prepare_the_stasi: "Echo of '68"
 CZE_prepare_the_stasi_desc: "The ČSSR is not satisfied with the reforms that have begun in the USSR. Because of this, a decision has been made to interfere with KGB affairs on ČSSR territory. The leadership of the StB has been given an oral order to arrest KGB agents."
 CZE_change_of_courses_in_the_ussr: "Change of Course in the USSR"
 CZE_change_of_courses_in_the_ussr_desc: "The ČSSR condemns the USSR's new vision of the world. The leadership of the Communist Party of Czechoslovakia is displeased with the changes taking place in the Soviet Union, such as glasnost and democratization of political life."
 CZE_new_department_in_dresden: "Negotiations with the Velvet Movement"
 CZE_new_department_in_dresden_desc: "The Czechoslovak government must hold negotiations with the demonstrators. This will be a sign of cooperation and discussion of reforms in the country. We must not repeat 1968."
 CZE_conflict_with_the_kgb: "Freedom for Czechoslovakia?"
 CZE_conflict_with_the_kgb_desc: "Political tension between the ČSSR government and the USSR leadership arose mainly in connection with the reform processes and changes initiated by the country's new leadership. The Communist Party of Czechoslovakia discusses full independence and withdrawal from the Warsaw Pact."
 CZE_german_reforms: "Full Market Socialist Reform"
 CZE_german_reforms_desc: "Due to instability in the USSR, East Germany has begun to experience a crisis. The Soviet Union insists on carrying out its perestroika reforms, but on the other hand, the people are rioting. We must tighten the screws, but also promise democracy to the USSR."
 CZE_the_hunt_for_the_kgb: "President of Czechoslovakia"
 CZE_the_hunt_for_the_kgb_desc: "The government has decided to liberalize in order to preserve a united Czechoslovakia. In this regard, the country needs free elections. The first step – presidency."
 CZE_honecker_resignation: "Resignation of Gustáv Husák"
 CZE_honecker_resignation_desc: "The reason for President Gustáv Husák's resignation was a sharp deterioration of the internal situation in the country and health problems. The decision to resign was made at a meeting of the party politburo."
 CZE_own_perestroika: "Federation of Czechoslovakia"
 CZE_own_perestroika_desc: "The new government of the ČSSR supports the ideas of perestroika in the USSR. But Slovakia seeks greater autonomy; Moscow approves this step, and we are forced to make a concession and create the Czech and Slovak Federative Republic."
 CZE_new_shipyards: "Development of the Military-Industrial Complex"
 CZE_new_shipyards_desc: "To repel aggression from NATO, the ČSSR requires a large amount of weapons. Therefore, a decision has been made to build new factories in Slovakia."
 CZE_the_fleet_is_prepared: "Exercise 'Friendship of Peoples'"
 CZE_the_fleet_is_prepared_desc: "The Czechoslovak People's Army will conduct a series of exercises to repel an airborne landing on ČSSR territory."
 CZE_aviation: "Czechoslovak Air Force"
 CZE_aviation_desc: "Czechoslovak aviation must be prepared for combat operations. Therefore, we must conduct new recruitments of pilots and launch large-scale air exercises."
 CZE_the_best_artillery: "The Best Artillery"
 CZE_the_best_artillery_desc: "Czechoslovak artillery must become the most deadly obstacle for the West."
 CZE_tanks: "Development of Tankograd"
 CZE_tanks_desc: "The ČSSR requires large-scale production of its own tanks. We must invest in this industry as much as possible."
 CZE_the_best_infantry: "The Best Infantry"
 CZE_the_best_infantry_desc: "Czechoslovak infantry must become the most deadly obstacle for the West."
 CZE_friendship_with_germany: "Peaceful Revolution"
 CZE_friendship_with_germany_desc: "The ČSSR is reviewing its actions with neighbors. First of all, we must resolve the issue with Slovakia. Perhaps we will soon have to make concessions and recognize their independence."
 CZE_invest_in_oil_refineries: "Investments in Refineries"
 CZE_invest_in_oil_refineries_desc: "Czechia must invest in oil refineries. Due to changes in the USSR, we can expect many things."
 CZE_new_oil_refineries: "New Refineries"
 CZE_new_oil_refineries_desc: "The government invests in the construction of oil refineries in several cities of our country."
 CZE_development_of_the_military_industrial_complex: "Development of the Czechoslovak Military-Industrial Complex"
 CZE_development_of_the_military_industrial_complex_desc: "The ČSSR urgently needs to invest in the military-industrial complex before it's too late. Czechoslovakia requires equipment and machinery."
 CZE_investments_in_factories: "Investments in Factories"
 CZE_investments_in_factories_desc: "The party has decided to invest in the social development of goods and services. The people need new jobs and goods."
 CZE_government_support: "Support of the Czechoslovak Government"
 CZE_government_support_desc: "The government supports the development of factory production."
 CZE_the_Industrial_fist: "Industrial Fist"
 CZE_the_Industrial_fist_desc: "The ČSSR directs all its resources to the industrialization of its industry. The ČSSR must become the world's first communist power."
 CZE_exit_from_the_ats: "Czechoslovakia's Exit from the Warsaw Pact"
 CZE_exit_from_the_ats_desc: "Popular unrest is taking place in the ČSSR. The people demand an end to cooperation with the USSR and a transition to peaceful life. We must leave the Warsaw Pact – this is the will of the people!"
 CZE_demolish_the_berlin_wall: "Velvet Revolution"
 CZE_demolish_the_berlin_wall_desc: "The people are dissatisfied with our policy. Mass demonstrations that started in Prague and spread throughout Czechoslovakia – demonstrators demand the opening of borders and sovereignty for Slovakia."
 CZE_changes_in_the_CZE: "Changes in the CSFR"
 CZE_changes_in_the_CZE_desc: "Despite internal changes, we remain loyal to the Soviet Union. We count on maintaining friendly relations with Moscow."
 CZE_change_of_course: "Change of Course"
 CZE_change_of_course_desc: "Important decisions face the ČSSR. All 3 decisions will globally affect the fate of our country. Do we remain faithful to socialism, dissolve Czechoslovakia, or leave the Warsaw Pact?"
 CZE_western_and_neutral_germany: "Neutral Czechia"
 CZE_western_and_neutral_germany_desc: "Czechia must leave the Warsaw Pact and become a neutral country. But before that, parliament must vote for the dissolution of Czechoslovakia."
 CZE_accession_to_the_federal_republic_of_germany: "Czechia and Slovakia?"
 CZE_accession_to_the_federal_republic_of_germany_desc: "This event will mark the completion of the long unification of the two nations and restore democratic justice."
 CZE_reunification_negotiations: "Negotiations with the USSR"
 CZE_reunification_negotiations_desc: "Before the dissolution of the ČSSR, we must clarify a few points…"
 CZE_demolition_of_the_wall: "Dismantling of Socialism"
 CZE_demolition_of_the_wall_desc: "For unification with the FRG and becoming a neutral Germany, we must demolish the main symbol of the Cold War – namely, the Berlin Wall."
 CZE_the_destruction_of_communism: "Federation – CSFR"
 CZE_the_destruction_of_communism_desc: "The ČSSR begins dismantling the socialist system of governing the country. We must hold democratic elections, dissolve the StB. But before that – destroy secret documents."
 CZE_1: "Cooperation with the GDR and USSR"
 CZE_1_desc: "Czechoslovakia begins military and industrial cooperation with the two fraternal countries. Our state needs the technologies of our neighbors."
 CZE_2: "Tightening of Legislation"
 CZE_2_desc: "The country's leadership cannot allow the mistakes of the GDR to be repeated. In this regard, a decision has been made on mass propaganda of socialism in the country. Free leaflets with Lenin are being distributed!"
 CZE_3: "Views on Neighbors"
 CZE_3_desc: "The country's military leadership sees danger in NATO. The leadership of East Germany could not hold onto power – we must not allow this to happen in our country."
 CZE_4: "We Await Change!"
 CZE_4_desc: "Our state has become stable. There are no rebels or enemies of the nation. Now our country moves forward on the path to a bright future."
 CZE_5: "Support of New Allies"
 CZE_5_desc: "The USA, Great Britain, France are ready to support the new democratic state. We give permission for Americans to buy our factories."
 CZE_6: "Application to NATO"
 CZE_6_desc: "Czechia has been part of several states throughout its history. Now that Czechia has finally gained true freedom, it needs protection. We submit an application to NATO and hope for its acceptance."
 CZE_7: "Collapse of Socialism"
 CZE_7_desc: "The socialist idea has failed in our state. Now Czechia must follow the path of new democracy. Liberty, equality, fraternity!"
 CZE_8: "Propaganda, Reforms, and Computers"
 CZE_8_desc: "Lenin, Marx – these are the ones we must emulate! The CSFR must follow the path to communism! New reforms should develop the country's social sphere and finally begin the development of the computer industry."
