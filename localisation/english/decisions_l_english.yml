 SOV_discontent_of_the_republics: "Discontent of the Union Republics"
 SOV_discontent_of_the_republics_desc: "The creation of the Union of Sovereign States saved the country from immediate collapse, but this diplomatic triumph turned out to be fragile. Our Union is still extremely unstable. Local elites and national movements in the republics constantly test the strength of the central government. To prevent a large-scale uprising and the final parade of sovereignties, we are forced to constantly manoeuvre. We must satisfy the economic and political demands of the republics, making difficult compromises. Any mistake or excessive harshness could become a spark that destroys the USS once and for all.\n\nDiscontent of Republics: [GetDiscontentRepublicName]"
