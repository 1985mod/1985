 USA_preparation_for_invasion_in_iraq: "Preparation for invasion of Iraq"
 USA_preparation_for_invasion_in_iraq_desc: "Saddam Hussein's brazen seizure of Kuwait became a direct threat to stability throughout the world and a challenge to our national security. In response to this unprovoked aggression, we immediately imposed harsh economic sanctions against Iraq, hoping to strangle the Baghdad regime through diplomacy. However, Saddam ignored the ultimatums, and the embargo we imposed only hardened his dictatorship. The time for half-measures has passed. The breakdown of diplomatic channels and the failure of sanctions pressure left our administration no choice: for the sake of peace in the region and the protection of our allies, we made the final decision on a full-scale military invasion of Iraq. We must crush the aggressor.\n\nUN support: §Y[?USA.un_support]%§!"
