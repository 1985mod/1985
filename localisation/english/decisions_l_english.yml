 ETH_defeat_italy_category: "Second Italo-Ethiopian War"
 ETH_defeat_italy_category_desc: "Italy is once again trying to turn Ethiopia into a wretched colony. We have already defeated these invaders before and will do so again – the main thing is to drive them away from our borders for good!"
 seize_some_trains_woo: "Seize Civilian Trains"
 seize_some_trains_woo_desc: "Our infrastructure is occupied by civilian railway companies. Now that war is approaching, we have every right to requisition their equipment for state needs."
