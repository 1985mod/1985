 USA_preparation_for_invasion_in_iraq_desc: "Saddam Hussein’s regime has long been more than a regional threat. It is a regime responsible for the destruction of its own people. Reports from intelligence agencies and human rights organizations describe the use of chemical weapons against Kurds in Halabja, mass executions of Shiites in the south, and torture in Abu Ghraib prison.\n\nIraq is the cradle of an ancient civilization, a country with a rich culture and a hardworking population that the dictator has plunged into poverty and fear. We cannot turn a blind eye. It is our duty to end tyranny and help the Iraqi people build a secular democratic state in which human rights are protected by law.\n\nHowever, we must not act alone or repeat the mistakes of the past. For this mission to succeed, we need the support of the international community, approval from Congress, and preparations for a military operation. The whole world is watching us.\n\nUN support: §Y[?USA.un_support]%§!"
