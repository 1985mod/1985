 removed_when_cancelled_war_prop: "Propaganda campaigns have been stopped."
 war_propaganda_casualties: "Cultivate Heroism"
 war_propaganda_casualties_desc: "Although the death toll is rising, our people must understand that heroes are born only in battle."
 war_propaganda_convoys: "Encourage Saving"
 war_propaganda_convoys_desc: "Even ordinary people can help win the war, because every saved gram of steel can be used for military action."
 war_propaganda_bombing: "Boost Morale"
 war_propaganda_bombing_desc: "Although bombs are falling around us, our brave workers continue to work. It is thanks to their unyielding spirit that we will win."
 war_support_during_war: "War Support"
 CHI_occupation_actions: "Anti-Occupation Measures"
 CHI_breach_the_yellow_river: "Breach the Yellow River Dams"
 CHI_breach_the_yellow_river_desc: "The Yellow River nourishes all surrounding regions, but it lies in the path of the impending invasion. As a last resort, it has been proposed to blow up the complex system of dams and dikes to slow the enemy army's advance.\n\nIt is impossible to assess the effectiveness of such an action, but the consequences will certainly be severe."
 yellow_river_blown: "Severe Flooding"
 yellow_river_blown_desc: "This region is heavily flooded due to the destruction of dams and dikes on the Yellow River."
