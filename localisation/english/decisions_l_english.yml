 SOV_discontent_of_the_republics_desc: "The creation of the Union of Sovereign States saved the country from immediate collapse, but this diplomatic triumph proved fragile. Our Union is still extremely unstable. Local elites and national movements in the republics test the strength of central power every minute. To prevent a large-scale uprising and a final parade of sovereignties, we are forced to constantly maneuver. We must satisfy the economic and political demands of the republics, making difficult compromises. Any mistake or excessive harshness could become the spark that destroys the USS once and for all.\n\nDiscontent of the republics: [GetDiscontentRepublicName]"
