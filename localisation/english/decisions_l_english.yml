 USA_stabilization_of_the_regime_in_iraq: "Stabilize the new Iraqi government"
 USA_stabilization_of_the_regime_in_iraq_desc: "Military operations are over, but the struggle for Iraq is only beginning. We have overthrown Saddam Hussein’s regime, but the country is left with damaged infrastructure and a power vacuum. In a country ruled by fear for decades, democracy will not take root on its own.\n\nEvery day of delay benefits the insurgents. Former Ba’athists, radical Islamists, and criminal groups are already trying to fill the vacuum by attacking our convoys and terrorizing the local population. If the new Iraqi government is to survive, we must act quickly and consistently.\n\nWe need to work on three fronts. First, restore electricity, water supplies, and jobs to win the support of the population. Second, strengthen security by training the local police and army. Third, establish political dialogue among Shiites, Sunnis, Kurds, and other groups; otherwise, the country may fall apart.\n\nEvery decision will require money and political effort. We promised to help Iraq build a democratic state — now we must deliver on that promise.\n\n§RResistance in§! §YIraq§!: §R[?USA.resistance_baathist]%§!"
