 russia.15.t: "Referendum on the Sovereignty of Tatarstan"
 russia.15.desc: "The federal center never signed a treaty with Kazan before autumn. Against the backdrop of a political deadlock, a referendum was held in the republic. The majority of the population voted 'FOR' full state independence. What shall we do?"
 russia.15.a: "We are forced to recognize their independence..."
 russia.15.b: "This is illegal! We will restore order there by force!"
 russia.16.t: "Crisis in the North Caucasus"
 russia.16.desc: "While the attention of the whole country is riveted on events in Tatarstan, the southern borders of Russia have found themselves on the brink of catastrophe. Taking advantage of the weakness of the federal center and the diversion of the main army forces to the Volga region, the Chechen leadership headed by Dzhokhar Dudayev sharply intensified its actions.\n\nIntelligence reports a mass transfer of weapons and radical-minded volunteers to neighboring republics — Dagestan, North Ossetia and Kabardino-Balkaria. Explosions thunder on the roads, raids are carried out on military warehouses, and the local police are demoralized and do not control the situation. Separatists are openly preparing an armed coup throughout the North Caucasus. If we do not take urgent measures, the south of the country will be completely lost."
 russia.16.a: "We need to do something urgently."
 russia.17.t: "Russia proposes territorial concessions"
 russia.17.desc: "Finding itself on the brink of a crushing war on two fronts, the Russian leadership has made unprecedented and humiliating concessions. An official government delegation from Moscow urgently arrived in Grozny with a confidential proposal.\n\nIn order to preserve peace on its southern borders, the Kremlin is ready to completely withdraw federal troops and, without a single shot, transfer the entire territory of North Ossetia under the control of the Chechen Republic of Ichkeria. In exchange, the Russian side demands the immediate cessation of border terrorist clashes, the disarmament of sabotage detachments in Dagestan, and the signing of a long-term non-aggression pact.\n\nBefore us stands a fateful choice: to take a strategically important region by peaceful means and fix a geopolitical victory, or to reject the compromise and raise the entire North Caucasus for a total war against a weakened Russia."
 russia.17.a: "This suits us. Peace."
 russia.17.b: "No! This is not enough for us. We need Dagestan as well."
 russia.18.t: "Chechnya agreed to our terms"
 russia.18.desc: "Official news has come from Grozny: Dzhokhar Dudayev accepted our proposal and agreed to limit his claims. Realizing that a direct war with Russia could turn into a catastrophe for Ichkeria.\n\nIn accordance with the agreements, Russian regular units and internal troops leave the territory of North Ossetia, transferring control to local Chechen formations. In exchange, Grozny officially stopped supporting sabotage groups in the Caucasus, withdrew militants from Dagestan, and signed a long-term non-aggression pact with us.\n\nIn Moscow and the army, many call this decision a shameful retreat and weakness. However, strategically the Kremlin achieved the main thing: the southern borders are temporarily stabilized, and the threat of war on two fronts has been eliminated. Now the entire might of our army can be thrown into suppressing the rebellion in the Volga region."
 russia.18.a: "Excellent."
 russia.19.t: "Chechnya demands Dagestan as well"
 russia.19.desc: "The appetites of Grozny have grown to the limit. Feeling the weakness of the federal center, shackled by heavy fighting in the Volga region, Dzhokhar Dudayev decided to go all-in. An official and uncompromising ultimatum from the Chechen Republic of Ichkeria has arrived in Moscow.\n\nThe Chechen leadership declares that for the sake of 'ensuring security and stability in the Caucasus' not only North Ossetia but also the strategically important Dagestan with its access to the Caspian Sea must be immediately and completely transferred under the control of Grozny. Dudayev's diplomats openly declare: either Russian troops voluntarily and without a fight leave both regions within forty-eight hours, or the army of the ChRI and thousands of Caucasian volunteers go over to a full-scale offensive along the entire southern front.\n\nBefore us stands a catastrophic choice: to go for colossal territorial humiliation and in fact give up the Caucasus without a fight, or to reject the arrogant ultimatum and get involved in a protracted, bloody war on two fronts."
 russia.19.a: "No. We cannot fight on two fronts now. We give up the territories."
 russia.19.b: "Have they completely lost their minds? No way!"
 russia.20.t: "Russia agreed to our terms"
 russia.20.desc: "Incredibly, but our bold diplomatic bluff has been crowned with absolute historical success. Finding itself in the grip of a severe crisis in the Volga region and panically afraid of opening a full-fledged southern front, the government in Moscow has completely capitulated to our demands.\n\nAn official reply signed by the Russian leadership has come from the Kremlin: Russia agrees to peace on all of Grozny's terms. Federal troops, police and internal troops of the Russian Federation hastily leave the territories of North Ossetia and Dagestan, abandoning heavy equipment and weapons depots. Advanced detachments of the Armed Forces of Ichkeria are already entering Makhachkala and Vladikavkaz amid the jubilation of local supporters.\n\nDzhokhar Dudayev has inscribed his name in history: without a single major battle, Chechnya not only defended its freedom but also expanded to the Caspian Sea, becoming the main force throughout the North Caucasus. The entire Caucasian geopolitics has changed forever."
 russia.20.a: "Allahu Akbar!"
 russia.21.t: "Russia refused."
 russia.21.desc: "Our calculation of panic in Moscow did not come true. The Russian leadership flatly refused to sign a capitulation and give up Dagestan and North Ossetia. Instead of an order to withdraw troops, a harsh and uncompromising reply came from the Kremlin: the federal center will not yield a single meter of land to separatists and is ready to defend the integrity of the state by force of arms.\n\nEmergency news is coming through all communication channels — Russian aviation has been put into the air, and armored columns of federal forces have begun moving toward the borders of Ichkeria. In the border regions of Dagestan and Ossetia, our sabotage groups have already entered the first heavy battles with regular units of the Russian army.\n\nThe masks are off. Russia has chosen war on two fronts, which means we have no way back. It is time for Dzhokhar Dudayev to give the order to begin the general offensive and raise the whole Caucasus for a holy war for freedom."
 russia.21.a: "Allahu Akbar! Let us stand up for our interests!"
 russia.22.t: "Parade of Sovereignties: Secession of Yakutia"
 russia.22.desc: "Economic chaos and the protracted war on the Volga have dealt a mortal blow to our authority. Seeing that we are losing control over the country, the Supreme Council of the Republic of Sakha (Yakutia) announced full state independence.\n\nLocal authorities in Yakutsk have subordinated to themselves all diamond-mining and gold-mining enterprises, stopping contributions to the federal budget. Our attempts to contact the region failed — Yakutia officially goes into free floating. Our stability is undermined, and the treasury is emptying."
 russia.22.a: "We are losing control over Siberia..."
 russia.23.t: "Domino Effect: Complete Collapse"
 russia.23.desc: "The catastrophe is growing like a snowball. A whole series of regions followed Yakutia's example, finally severing ties with the crumbling metropolis.\n\nIn Petrozavodsk they announced the sovereignty of Karelia and the beginning of negotiations with Helsinki. In the south of Siberia, Tuva proclaimed the restoration of independent Tannu-Tuva. If the Caucasian front has not yet swallowed Dagestan, then local elites in Makhachkala, saving themselves from chaos, also announced secession from Russia. The state is literally melting before our eyes, and the army is demoralized."
 russia.23.a: "Russia is crumbling to pieces..."
 russia.24.t: "The 'Pamyat' Coup in Moscow"
 russia.24.desc: "Moscow, autumn 1993. The country is falling apart before our eyes. Tatarstan declared independence back in 1992, followed by Chechnya, Tuva and Karelia. In Chechnya there is no longer Russian power — Dudayev drove out everyone who represented Moscow. In Kazan, Kyzyl and Petrozavodsk there are their own governments, which report to neither the Kremlin nor anyone else. The army is falling apart, officers have not received pay for months, soldiers are deserting.\n\nThe economy is in ruins, the ruble is falling, regions are introducing ration cards and closing borders. Yeltsin rushes between concessions and threats, but no one believes anymore that he is capable of holding the country together. At this moment Alexander Lebed comes onto the scene. Lieutenant General, who went through Afghanistan and Transnistria, commanded the 14th Army. He is known as a man who is not afraid to tell the truth and does not make promises he cannot keep. Behind him is the officer corps, tired of humiliations, and part of the army that is still capable of fighting. There are rumors that Lebed is preparing a 'combined company' from those who 'have not yet fought enough,' and that in his circle they are discussing a forceful solution to the crisis.\n\nThe situation explodes overnight. Tank units loyal to Lebed block the center of Moscow. Key buildings are occupied without shots. Yeltsin is cut off at his dacha, communication with him is unstable. Lebed speaks on television: he talks about 'saving the country,' about 'restoring order,' and that 'one cannot live like this any longer.' He does not call himself a dictator, but he does not hide that he is taking power into his own hands. First of all he promises to return Chechnya, Tatarstan, Tuva and Karelia — by force, if necessary."
 russia.24.a: "Death to separatists!"
 russia.25.t: "Emergence of the anti-Dudayev opposition"
 russia.25.desc: "A split is maturing in Chechnya. Since 1992 Dudayev has ruled without parliament and without law: the opposition is dispersed, rallies are dispersed, dissenters are squeezed out of Grozny. But there are more and more dissatisfied. Former supporters — field commanders, yesterday's allies, district heads — increasingly say that Dudayev is leading the republic into a dead end. The economy is ruined, oil goes to no one knows where, there are more weapons in hand than work. In the Nadterechny district they are already openly assembling detachments that do not obey Grozny. At the head are Labazanov, a former officer, and Umarov, a man with a reputation but without much strength.\n\nWe are watching this with interest. The anti-Dudayev opposition is a chance to return Chechnya under control without a big war. But if it is supported, it may become a problem: these people fought against Russia and are not going to lay down their arms. If not supported, Dudayev will crush them himself, and then in the republic there will remain no one except him. In Grozny they already say that the opposition are Kremlin proteges, and this is not far from the truth."
 russia.25.a: "No one should know about this."
 russia.26.t: "Failure of the opposition's storming of Grozny"
 russia.26.desc: "Today the opposition went to Grozny. Columns of tanks and armored personnel carriers moved toward the city center, counting on a quick capture — according to intelligence, Dudayev has few forces and will not hold out. The calculation did not come true. On the streets the columns fell into ambushes, tanks burned one after another, there was no communication between detachments, commanders acted on their own. By evening, dozens of burned vehicles and prisoners remained from the assault. Dudayev declared this a victory and proof that Moscow is fighting against Chechnya with someone else's hands.\n\nFor Russia this is a failure that is difficult to hide. Officially Moscow has nothing to do with it, but the prisoners admit that they served in the Russian army, and the equipment is army equipment. Dudayev got a reason to talk about Russian aggression, and the opposition lost almost everything it had. In Grozny now no one believes that Moscow is capable of solving the Chechen question with someone else's hands. There remains either to admit failure and retreat, or to go for direct intervention."
 russia.26.a: "Bad. We will have to send in troops."
 russia.27.t: "First Chechen War"
 russia.27.desc: "December 11, 1994. Columns of the Russian army crossed the administrative border of Chechnya from three directions — from Dagestan, Ingushetia and North Ossetia. Officially this is called 'restoring constitutional order.' In fact — the beginning of a full-scale war. The operation involves army units, internal troops, special forces, aviation. The command promises a quick and victorious campaign: Grozny will be taken in a few days, Dudayev will be removed, order will be restored.\n\nReality turned out differently from the very first day. Columns stretched for tens of kilometers, communication between units is unstable, intelligence gave incorrect data on enemy forces. Already near Kizlyar and Mozdok the first clashes began. In Grozny they expected an assault, but no one really prepared for it. In the rear there is discontent: in Ingushetia and Dagestan the local population meets the columns without enthusiasm, and in places hostilely. In the West they are already preparing statements condemning. Inside Russia no one explained why this is needed and for how long."
 russia.27.a: "We will take Grozny with two airborne regiments in two hours."
 russia.28.t: "Nuclear Legacy"
 russia.28.desc: "The USSR has collapsed, but thousands of nuclear warheads remain on the territory of Ukraine, Kazakhstan, and Belarus. The West demands that the nuclear weapons be either destroyed or placed under Moscow's control. Our generals are opposed - they believe that only a nuclear shield will save us from disintegration."
 russia.28.a: "We must deal with this!"
 russia.29.t: "Prosperous Russia"
 russia.29.desc: "The country that was on its knees just yesterday has now squared its shoulders. On the streets of Russian cities, from Kaliningrad to Vladivostok, there is unprecedented activity. Store shelves, which had recently terrified with their emptiness, are filled with goods. Barter chains, which seemed like madness to Western economists, actually saved our industry from collapse. Factories in the Urals and Siberia are working in three shifts, and trains with coal, timber, and oil flow continuously.\n\nIn the military towns there is pride. The army, which had recently been demoralized and abandoned to its fate, has again become a formidable force. New tanks rumble at the proving grounds, and strategic bombers patrol the vastness of the country. Our nuclear shield again inspires fear in Washington and NATO. The Western sanctions we were threatened with turned out to be merely a mosquito bite. We have endured and proved to the whole world: Russia cannot be brought to its knees.\n\nThe people, tired of the chaos and lawlessness of the 90s, have finally found a firm hand. Alexander Lebed has become a symbol of national revival. His portraits hang in officials' offices and factories. People believe that the general has brought them peace and order, restored the greatness of a great power. There is a sense of victory in the air. It seems to us that the darkest times are behind us, and ahead lies only a bright future and a new era of prosperity."
 russia.29.a: "Glory to Russia!"
 thanks_for_the_game_in_1985_or_maybe_not: "§RThank you for the game in 1985, or maybe not yet..?§!"
 russia.30.t: "Shots in the Kremlin"
 russia.30.desc: "The morning began with emergency news broadcasts that interrupted all programming. In the center of Moscow, at the exit from the Kremlin, the motorcade of President Alexander Lebed was fired upon with automatic weapons. The snipers worked professionally and cold-bloodedly. When the armored limousine stopped, the guards found that the head of state had received two grievous wounds - in the chest and in the heart. Doctors pronounced death on the spot.\n\nA state of emergency was immediately introduced in the city. The capital is paralyzed. Crowds of people gather in squares in shock and tears - just yesterday the country was celebrating economic revival and military power, and today it has again found itself on the edge of the abyss. The investigation has already put forward the main version: the murder was committed by radical nationalists from the "Pamyat" society. They considered the general a traitor who did not "cleanse" the country harshly enough and hesitated in resolving the national question.\n\nHowever, another, more terrible truth hangs in the air. In the haste and chaos, no one can guarantee that these were not people from Lebed's inner circle who decided to remove him for their own power. The army has blocked television centers and government buildings. In the corridors of the Kremlin, a fierce struggle for the empty throne has begun. The country froze in anticipation: who will take control into their hands, and will Russia slide into the abyss of a new, even more bloody civil war?"
 russia.30.a: "Do nothing for now."
 russia.30.b: "Better to hold elections."
 russia.31.t: "Storming of the Kremlin by \"Pamyat\""
 russia.31.desc: "Moscow has plunged into a bloody meat grinder. Taking advantage of the paralysis of power and the death of the president, radical nationalists from the "Pamyat" society moved to decisive action. Led by Dmitry Vasilyev, supported by army units dissatisfied with the \"godless\" government, their detachments, the so-called "Black Hundreds," went on the assault.\n\nFirst, the television center in Ostankino fell. Then, breaking the resistance of the few guards, the militants burst into the Kremlin. The black-yellow-white imperial flag was raised over the government building. Shots and the sound of broken shop windows can be heard in the city. The militants have begun mass roundups of liberals, democrats, and "aliens," accusing them of ruining the country and killing the general.\n\nVasilyev's address is broadcast on all state channels. He announces the creation of a "National Salvation Committee," the abolition of the constitution, and the establishment of "Russian Order." Orthodoxy is proclaimed the state religion. Russia is cut off from the outside world by a new Iron Curtain. The world watches in horror as the darkest forces, promising to cleanse the nation with fire and sword, have come to power in a country that was just trying to become a democracy."
 russia.31.a: "Start the "White Terror"!"
 russia.32.t: "Election Results"
 russia.32.desc: "The country held its breath waiting for the results. After the bloody events in Moscow and the suppression of the "Pamyat" mutiny, the Central Election Commission announced the final results of the early presidential elections. The people, mortally tired of poverty, banditry, and the fear of civil war, made their choice.\n\nVladimir Volfovich Zhirinovsky won by a landslide. His populist rhetoric, loud promises to "restore the empire," "wash the boots of the Russian soldier in the Indian Ocean," and restore order with an iron fist resonated in the hearts of millions. While some politicians spoke of complex economic reforms and others called for bloody slaughter, Zhirinovsky offered simple and understandable solutions.\n\nIn his inaugural address, the new president promised that the era of chaos was over. He announced the creation of a "Government of National Salvation," threatened the West with nuclear weapons in case of intervention, and vowed to restore Russia's status as a superpower. However, behind the facade of triumph, the country remained split. Liberals are horrified, communists have lain low, and the generals look with suspicion at the new civilian leader. An era of \"show politics\" with a nuclear briefcase in hand begins."
 russia.32.a: "Bring back the "empire" right now!"
 tatarstan.1.t: "Power crisis in Kazan"
 tatarstan.1.desc: "The beginning of the war with Russia split the republic. The moderate government lost control over the situation. On the streets of Kazan the fate of the state is being decided: radical nationalists and cohesive detachments of veterans are rushing to power."
 tatarstan.1.a: "Transfer power to Fauziya Bayramova! Mobilize the national guard!"
 tatarstan.1.b: "Form a Military Council! Afghan veterans take command!"
 iraq.1.t: "Iraq proposes peace on its own terms"
 iraq.1.d: "Five years have passed since the beginning of the war. Iraq, having captured several of our cities, proposed peace — but on its own terms. Saddam's demands are simple: Khuzestan goes to Iraq, and all resources of the region come under his full control. In fact this is capitulation disguised as a peace treaty.\n\nFor us this means the loss of the richest province, oil fields and access to the Persian Gulf. To accept such terms means to admit defeat and give up what we fought for for five years. To refuse means to continue the war, which has already exhausted our army and economy."
 iraq.1.a: "We agree, capitulation"
 iraq.1.b: "Never!"
 iraq.2.t: "Should we invade Kuwait?"
 iraq.2.d: "August 1990. Eight years of war with Iran have left us in debt — tens of billions, half to the West, half to the Arab monarchies of the Gulf. The economy has not recovered, oil prices are low, and Kuwait and the UAE are producing above OPEC quotas, collapsing the market. We accuse Kuwait of economic war: it is pumping oil from the border Rumaila field using slant drilling and refuses to write off debts. Diplomacy does not work.\n\nIn Baghdad they are saying ever louder that Kuwait is weak, its army is ineffective, and the West is busy with the fall of the Berlin Wall and is unlikely to get involved. The Arab world, perhaps, will limit itself to condemnation. The capture of Kuwait would solve financial problems with one blow: oil, ports, access to the Gulf. But this is open aggression against a neighbor, and the US reaction is unknown. American diplomats hinted that Washington has no obligations to defend Kuwait, but relying on this is risky.\n\nWe need to invade and annex Kuwait, or limit ourselves to pressure and diplomacy, or occupy the disputed border areas and oil fields without going for full occupation. The invasion will be quick, but the consequences may be catastrophic. Diplomacy is safer, but Kuwait does not yield. A limited operation gives leverage, but may grow into a big war."
 iraq.2.a: "Yes, return, 19th province!"
 iraq.2.b: "No, better to postpone the invasion."
 iraq.3.t: "Our capitulation"
 iraq.3.d: "Operation Desert Storm lasted forty-three days. Coalition aviation destroyed infrastructure, bridges, power plants and communications. The ground phase of the coalition was successful: our army in Kuwait was defeated, Republican Guard divisions were smashed, thousands of tanks abandoned in the desert. The retreat from Kuwait turned into a massacre on the highway near Basra.\n\nThe terms are heavy. We withdraw troops from Kuwait, recognize its sovereignty and pay reparations. Around our territory there are no-fly zones in the north and south, where our aviation has no access. Economic sanctions remain, oil can hardly be sold. The Republican Guard survived, but lost equipment and reputation. In the south the Shiites are raising an uprising, in the north the Kurds are taking up arms. The army is demoralized, but still holds Baghdad.\n\nInside the country discontent is growing: some blame the regime for the adventure, some for betrayal. Officers whisper about a coup. Neighbors watch. The US makes it clear that they do not intend to finish us off if we hold power and do not touch the Kurds and Shiites."
 iraq.3.a: "Yes, this will be better for everyone."
 iraq.4.t: "Iran agrees"
 iraq.4.d: "Tehran has surrendered. After five years of war, after our divisions held Iranian cities and reached Ahvaz, the Iranian delegation in Vienna signed peace on our terms. Khomeini called it a bitter cup, but he had no choice: the army is defeated, the economy is in ruins, there are not enough people at the front. Iran recognizes our sovereignty over Khuzestan and transfers to us control over the oil fields of the region. Shatt al-Arab comes under our control.\n\nFor us this is a victory that a year ago no one dared to dream of. But victory does not cancel problems. Khuzestan must be held: not all Arabs there awaited us, and the Shiite population may raise an uprising. The army is at its peak, but tired. The economy rests on oil, but the war cost tens of billions. In Baghdad they are already arguing: to consolidate peace and engage in reconstruction, or to demand more while Iran is weak."
 iraq.4.a: "Allahu Akbar!"
 iraq.5.t: "Iran refuses"
 iraq.5.d: "Tehran rejected our terms. Khomeini called them capitulation and declared that he would fight to the last. The Iranian delegation left Vienna without signing anything. At the front it is quiet again, but this is the lull before the battle: both sides are using the pause to bring up reserves. Our divisions stand in Khuzestan, but holding the province without peace is harder — the local population is hostile, and supply lines are stretched. The Iranians are already preparing a new offensive, this time with emphasis on human waves and strikes on our oil terminals.\n\nIn Baghdad irritation is growing. Some demand to advance further while Iran has not recovered, some propose to sit down at the table again and remove part of the demands. The economy is cracking: the war costs billions, oil sells poorly, debts press. The army is tired, but still holds. Iran is also exhausted, but refuses to recognize reality."
 iraq.5.a: "Bad, very bad..."
 iraq.6.t: "Great Iraq"
 iraq.6.d: "Smoke from the parade formations mixed with the hot haze of the Baghdad midday. Standing on a high tribune in his immaculate military tunic, Saddam Hussein lazily took a drag on an expensive cigar, following with his gaze the Soviet MiGs flying over the square. His face remained impassive, but triumph burned in his eyes. Just a few months ago the whole world predicted Iraq's collapse, and today his generals report complete success.\n\nSaddam shifted his gaze to the map, mentally brought to life in his head. Kuwait — this nineteenth province, artificially torn away by British colonizers — has finally returned to its native harbor together with its ports. Khuzestan — the centuries-old wound on the body of the Arab nation, languishing under Persian oppression — is now completely cleared and gives Baghdad control over the colossal oil reserves of Abadan. The entire Persian Gulf has frozen in fear and respect before the might of Iraqi weapons.\n\nFlicking away the cigarette butt, Saddam approached the microphone. The noise of hundreds of thousands of voices instantly died down. He remembered Nebuchadnezzar, remembered the glory of ancient Babylon. History chose precisely him to correct the mistakes of the past and unite the split Arab world. Drawing hot air into his lungs, he firmly pronounced the words that would forever change the geopolitical map of the world. Great Iraq is born today, and no one will dare stand in its way."
 iraq.6.a: "Allahu Akbar! Glory to Saddam Hussein!"
