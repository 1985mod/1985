l_english:
 MINIMIZE_EVENT: "§GClick§! to minimize. The event will be placed in the §HEvents and Decisions§! section."
 usa.1.t: "New President — Old Problems"
 usa.1.desc: "At noon on January 20, 1989, it was cold and windy on the steps of the Capitol. Before a crowd of thousands, George Herbert Walker Bush took the oath of office, becoming the 41st President of the United States. The former Vice President, former CIA director, and now master of the White House.\nHis speech was in the spirit of Reagan but with his own accent. Bush called on the nation to light 'a thousand points of light' — not to wait for government help, but to build strong communities and develop volunteerism themselves. In international affairs, he extended a hand to Moscow, calling the current moment a 'window of opportunity for peace'. Gorbachev breathed a sigh of relief.\nHowever, the presidential chair did not come to Bush at the best of times. Domestically, the budget deficit was growing, and overseas, in Eastern Europe, changes were brewing that would soon redraw the map of the world. It wouldn't be boring."
 usa.1.a: "Hooray!"
 usa.2.t: "Democrats Win!"
 usa.2.desc: "Today, in the 1988 US elections, the Democratic Party of the United States of America won, led by Michael Dukakis, a well-known political figure and technocrat."
 usa.2.a: "Hooray!"
 usa.3.t: "Gorbachev's Proposal"
 usa.3.d: "Diplomatic and economic sanctions imposed on us by the United States are clearly just the beginning of a serious confrontation. The presence of the American Pacific Fleet in Pearl Harbor, Hawaii, means the Americans intend to maintain their presence in the region and support our enemies. By striking their base now, we will use the element of surprise."
 usa.3.a: "Perhaps we will agree."
 usa.4.t: "Aid from the USA"
 usa.4.d: "The USA has taken an anti-German stance and now intends to help Britain strengthen itself against the German threat. At the same time, they are interested in maintaining their presence in the Atlantic. In exchange for several of our naval bases, they are ready to provide us with destroyers. These ships are taken from reserve, but agreeing would mean strengthening military ties between our countries. Perhaps this is a wise decision."
 usa.4.a: "This is a unique opportunity."
 usa.4.a.tt: "We will receive 43 American destroyers.\nCanada will receive 7 American destroyers."
 usa.4.b: "This offer is clearly more beneficial to the US, so it is unacceptable to us."
 usa.5.t: "[FROM.GetNameDef] agreed."
 usa.5.d: "Despite all our preparation and good intentions, Great Britain refused to accept the old destroyers in exchange for naval bases."
 usa.5.a: "We are winning the Cold War!"
 usa.6.t: "[FROM.GetNameDef] refused."
 usa.6.d: "The day of the presidential election has come. The incumbent president, Franklin Delano Roosevelt, has already implemented several programs, collectively known as the New Deal, designed to lift the country out of the Great Depression.\n\nMany measures were successful, but plans to further expand the role and powers of the government drew criticism from his opponent, Republican Alf Landon. Landon, who entered politics from the oil business, advocates for expanding economic freedoms, while Roosevelt and the Democratic Party stand for social security and economic stability. The elections may show a balance of power or bring a convincing victory to the Democrats."
 usa.6.a: "Their loss."
 usa.6.b: "Republicans. We must preserve American ideals."
 usa.7.t: "The USA offers to join the anti-Iraq coalition"
 usa.7.d: "Since the institution of the presidency appeared in the United States, no president has held office for three consecutive terms. Nevertheless, due to the instability of world politics and current events, President Roosevelt decided to break this tradition and run for a third term. Republican Lewis Wendell Willkie, called a dark horse candidate with good industrial experience and almost none in politics, criticizes both Roosevelt's economic policies and his intention to run for a third term.\n\nThe candidates share much in common on international policy, and Willkie aims to preserve several provisions of the New Deal. Many believe these elections will determine the future of American democracy."
 usa.7.a: "Yes, of course."
 usa.7.b: "No, we still need our soldiers."
 usa.8.t: "[FROM.GetNameDef] agreed."
 usa.8.d: "President Landon put an end to the New Deal reforms carried out by the Democrats four years ago and chose to rely on industrial companies like those he personally founded before becoming president. Roosevelt's campaign was based on continuing the course he set during his first term, and now he intends to run again. He is popular, but Landon criticizes him for seeking to concentrate power in the hands of the president, as he himself pursues a different policy.\n\nThe external threat targeting both our country and others remains a reality, and both candidates are aware of it. The question is who will lead the leading democratic power in these difficult times."
 usa.8.a: "Excellent!"
 usa.9.t: "[FROM.GetNameDef] refused."
 usa.9.d: "Franklin Delano Roosevelt was in many ways an unusual president. Despite declining health and an extraordinarily long tenure, he intends to lead our country during the war. The Republicans found themselves limited in their choice of candidates, as many of them are now in the military, and chose Governor Thomas Dewey as their representative.\n\nRoosevelt still enjoys popular support, but many fear he will not live to see the end of his term. Will that be enough to bring Dewey victory over the man under whose leadership we have come so far?"
 usa.9.a: "Fine, whatever."
 usa.10.t: "Operation Desert Storm Begins"
 usa.10.d: "Although in many ways [Root.GetLeader] intends to stick to the New Deal, Roosevelt still sees an opportunity to implement his original program. Despite his deteriorating health, he remains popular and is again the Democratic candidate.\n\n[Root.GetLeader] claims that in the current situation, changing leadership in America would be an irresponsible step, and there is irony in this, as the same was said before he defeated Roosevelt last time. Although, perhaps, he is right."
 usa.10.a: "Get ready, Iraq!"
 usa.11.t: "Roosevelt vs. MacArthur"
 usa.11.d: "Given the constant threat of the US being drawn into war, both Democrats and Republicans are trying to nominate candidates who will satisfy the military. General Douglas MacArthur, taking time away from his army duties, began a Republican campaign when peace was established and our country emerged victorious. He challenges Roosevelt and runs as a conservative.\n\nRoosevelt retains his popularity, but MacArthur's charisma and sense of duty do not leave voters indifferent. Perhaps the military would do better?"
 usa.11.a: "Roosevelt and Truman will get their way."
 usa.11.b: "MacArthur knows how to build peace, not just fight wars."
 usa.12.t: "Douglas MacArthur's Campaign"
 usa.12.d: "To challenge Roosevelt, who held the presidential chair for a record term, the Republicans decided to choose a candidate from among the army command who had been through the war. General Douglas MacArthur was popular among conservatives, but he was very busy with his direct duties and did not want to be distracted from them for a presidential campaign.\n\nNevertheless, he remains one of the most attractive candidates for conservatives. Perhaps he could be persuaded to make certain sacrifices so that a moderate Republican does not become our president?"
 usa.12.a: "MacArthur is needed more at the front than in the White House."
 usa.12.b: "We need him to challenge Roosevelt."
 usa.13.t: "Death of Roosevelt"
 usa.13.d: "Although President Roosevelt's health had been deteriorating for some time, the confidently conducted presidential campaign convinced many that he still had many years ahead. Nevertheless, no one ruled out the possibility of FDR dying in office, and today he died of a heart attack. Vice President Harry Truman took the oath and asked the American people to pray and support him. The cabinet remains the same, and Truman promised to keep his predecessor's policies unchanged."
 usa.13.a: "One era has ended, another has begun."
 usa.19.t: "Recording of the Charity Single 'We Are the World' by 'USA for Africa'"
 usa.19.d: "On January 28, 1985, at A&M Studios in Los Angeles, immediately after the American Music Awards ceremony, more than 45 of America's greatest music stars gathered. Michael Jackson and Lionel Richie wrote the song, and Quincy Jones took on producing this ambitious project. The goal was to raise funds to fight the famine raging in Ethiopia."
 usa.19.a: "We are the world."
 usa.21.t: "USS Coral Sea Carrier Accident"
 usa.21.d: "The US Navy aircraft carrier USS Coral Sea (CV-43), returning after a massive $200 million overhaul, collided with the Ecuadorian tanker 'Napo' during exercises in the Caribbean Sea, near the US base at Guantanamo Bay, Cuba. The incident occurred in clear weather with visibility of 11 kilometers."
 usa.21.a: "It was the civilian vessel's fault. Our fleet is not to blame."
 news.1.t: "Reykjavik Summit"
 news.1.d: "The second personal meeting between General Secretary of the CPSU Central Committee Mikhail Gorbachev and US President Ronald Reagan took place on October 11–12, 1986, in Reykjavik, halfway between Moscow and Washington. Despite the meeting ending without signing any documents, it is considered an important milestone in the Soviet-American negotiating process on strategic offensive arms and the first step towards ending the Cold War era."
 news.1.a: "A major breakthrough!"
 news.2.t: "Death of Konstantin Chernenko"
 news.2.d: "Today, Konstantin Chernenko died."
 news.2.a: "Hooray, humanity!"
 news.3.t: "Iraq Invades Kuwait!"
 news.3.desc: "Tonight, at 2:00 AM local time, Iraqi troops crossed the border. 100,000 soldiers and 300 Republican Guard tanks are invading Kuwait in three columns, meeting fierce but unequal resistance. At dawn, Iraqi special forces stormed the Dasman Palace in Kuwait City. The Emir, Sheikh Jaber al-Ahmad al-Sabah, managed to escape to Saudi Arabia with his family. A few hours later, the capital fell. Baghdad radio announced the overthrow of the 'corrupt regime' and the end of the 'American conspiracy' against Iraq."
 news.3.a: "Vultures tearing at the corpse..."
 news.4.t: "Chernobyl Nuclear Accident"
 news.4.desc: "On April 26, 1986, at 1:23 AM, a powerful explosion occurred at the fourth reactor of the Chernobyl Nuclear Power Plant during testing of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest technogenic releases of radioactive substances in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 were released into the atmosphere. Thousands of people took part in the liquidation of the consequences, many of whom received serious doses of radiation. This disaster was a blow to the stability of the Soviet Union, intensifying tensions in society and exacerbating the political situation in the USSR."
 news.4.a: "Eternal memory to the heroes!"
 news.5.t: "Yugoslav Wars Begin"
 news.5.desc: "Today, war began on Yugoslav territories, which mainly included a series of inter-ethnic conflicts between Serbs on one side, and Slovenes, Croats, Bosniaks, and Albanians on the other, as well as the Croatian-Bosnian conflict, the conflict between the Republic of Western Bosnia (initially supported by Croats and then by Serbs) and the central Muslim authorities led by Alija Izetbegović in the Republic of Bosnia and Herzegovina, and the conflict between Albanians and Macedonians in North Macedonia, caused by religious and ethnic contradictions."
 news.5.a: "Another protracted war..."
 news.6.t: "Elections to the Supreme Soviet of the RSFSR"
 news.6.desc: "Today, uncontested elections to the Supreme Soviet of the RSFSR of the 11th convocation were held. \n\ \n\ The elections to the 9th convocation of the Supreme Soviet of the RSFSR were held in accordance with the Regulations on Elections to the Supreme Soviet of the RSFSR, approved by the decree of the Presidium of the Supreme Soviet of the RSFSR of August 8, 1978. 101,058,205 people took part in the elections (turnout — 99.97%). 100,989,507 people voted for the candidates (99.93%)."
 news..a: "Will this be the start of a new war in Asia?"
 news.7.t: "Steve Jobs Visits Moscow"
 news.7.desc: "In the summer of 1985, one of the founders of the California computer company Apple, Steve Jobs, along with lawyer Albert Eisenstat, arrived in Soviet Moscow. They planned to establish cooperation with the Soviet leadership and open production of their computers in the country."
 news.7.a: "Will this be the start of a new war in Asia?"
 news.7.t: "Steve Jobs Visits Moscow"
 news.7.b: "What a disgrace..."
 news.8.t: "Operation Desert Storm"
 news.8.desc: "Today, at 00:00 GMT, US President George H. W. Bush ordered the start of Operation Desert Storm. The goal: the liberation of Kuwait and the restoration of legitimate power. An unprecedented coalition of 42 countries, including the US, UK, France, Saudi Arabia, Syria, Egypt, and even former allies of the USSR from the socialist camp, began massive strikes on Iraq's military infrastructure. The first targets were air defense control centers, command posts, and communication nodes. F-117A stealth aircraft and Tomahawk cruise missiles took to the skies, heralding the onset of the era of precision-guided weapons in real time."
 news.8.a: "Let's go liberate Kuwait!"
 news.9.t: "Republican Victory in the USA"
 news.9.desc: "Today at noon, George Herbert Walker Bush officially became the 41st President of the United States. The oath was taken on the steps of the Capitol before a crowd of thousands.\n\nIn his speech, the new head of the White House called on the nation for 'a thousand points of light' — the development of volunteerism and local communities. Bush also promised to continue the course of cooperation with the Soviet Union, calling it a 'window of opportunity for peace'.\n\nThe former Vice President under Reagan succeeded his predecessor amid growing budget deficits and global changes in Eastern Europe."
 news.9.a: "The cowards have fled!"
 news.10.t: "Democratic Victory in the USA"
 news.10.d: "Withdrawing troops to the Romanian border, [SOV.GetNameDef] issued an ultimatum to official Bucharest for the immediate transfer of Bessarabia under its control, which had previously been part of the Russian Empire.\n\nRomania stated it had no choice but to accept Soviet demands, and Romanian troops left Bessarabia."
 news.10.a: "Interesting."
 news.10.b: "Bessarabia belongs to us by right."
 news.10.c: "We had no choice..."
 news.10.e: "Rejoice, Moscow, but this is a temporary victory."

 nuke_dropped.1.t: "Atomic Bombing of [From.From.GetName]"
 nuke_dropped.1.d: "For the first and hopefully last time in history, a nuclear bomb has been detonated in [From.From.GetName] as part of international warfare conducted by [?global.nukecountry.GetNameDef]. The unprecedented destruction stands as a testament to the devastating power of this new weapon, which is feared not only for what it can do to its targets, but what implications it has for the one who deploys it and for humanity itself.\n\nThe world holds its breath waiting for what will come next. Will this force [From.From.Owner.GetNameDef] to surrender to avoid further terror, or will it only strengthen their resolve to strike back against those who would resort to such measures?"
 nuke_dropped.1.a: "The Atomic Era has truly begun."
 nuke_dropped.1.b: "We will do whatever is necessary to protect the [ROOT.GetAdjective] people."
 nuke_dropped.2.t: "Atomic Bombing of Hiroshima"
 nuke_dropped.2.d: ""The streets were like a scene from hell."\n - Kuniyoshi Aikawa\n\nToday, a nuclear bomb was detonated over the city of Hiroshima at an altitude of 580 meters, launched by [?global.nukecountry.GetNameDef]. More than two thirds of the city were instantly destroyed. Despite the city being built to withstand earthquakes, only a few sturdy structures survived the blast.\n\nWhile the power of the atomic bomb has been played up in the public mind, the human cost of the weapon has been played down. Neither side wants to contemplate the horror of the event, but its legacy will be one of lives lost in the blink of an eye and lasting fallout."
 nuke_dropped.2.a: "How many more will fall before this war ends?"
 nuke_dropped.2.b: "We must act quickly to aid the victims."
 nuke_dropped.3.t: "Atomic Bombing of Nagasaki"
 nuke_dropped.3.d: "A nuclear bomb, originally intended for Kokura, was detonated today over the Nagasaki. Weather conditions forced the planes to divert their mission, a combination of smoke, clouds and technical difficulties being deciding factors in an event that may well change history.\n\nThe effects of the bomb were contained somewhat by the city's location in a valley, but the damage is still severe. Some military installations were struck, but the catastrophic civilian losses overshadow them by far. It may take decades before we know the long-term effects of this weapon with certainty. The threat posed by [?global.nukecountry.GetNameDef] knows no bounds."
 nuke_dropped.3.a: "Will this lead to [From.From.Owner.GetAdjective] surrender?"
 nuke_dropped.3.b: "We had hoped Nagasaki would be spared."
 nuke_dropped.4.t: "Atomic Bombing of Berlin"
 nuke_dropped.4.d: "Today, at [GetDateText], the German capital of Berlin was struck by a nuclear explosion, launched by [?global.nukecountry.GetNameDef]. The city has suffered several attacks, in this war and the last, but all else pale in comparison to this. Not since the Thirty Years' War has Berlin seen comparable devastation - considering its growth, this was seen as an impossibility.\n\nThe Führerbunker appears to have survived the blast at least partially due to the bomb detonating away from its planned epicenter, and [From.From.Owner.GetLeader] is rumored to still be alive, if outraged. How [From.From.Owner.GetAdjective] leaders should be evacuated and if they can be protected from the fallout is another matter, however."
 nuke_dropped.4.a: "Today, I am relieved not to be a Berliner."
 nuke_dropped.4.b: "Our enemies have struck at the heart of the nation!"
 nuke_dropped.5.t: "Atomic Bombing of London"
 nuke_dropped.5.d: "A nuclear explosion has devastated the city of London today. Despite the city's anti-air defenses, [From.From.Owner.GetNameDef] was not prepared for this attack initiated by [?global.nukecountry.GetNameDef]. At [GetDateText], Big Ben chimed for the last time, having been melted by the blast. Early reports suggest Buckingham Palace has been completely leveled and the whereabouts of the royal family are currently unknown.\n\n[From.From.Owner.GetLeader] has nevertheless been confirmed to have survived and is preparing a rousing speech for the radio later today. With morale at an all-time low, the British people is in dire need of this - or a very eloquent surrender."
 nuke_dropped.5.a: "It's difficult to maintain a stiff upper lip in the face of a nuclear blast wave."
 nuke_dropped.5.b: "God save the King!"
 nuke_dropped.6.t: "Atomic Bombing of Kyoto"
 nuke_dropped.6.d: "The city of Kyoto, a prominent [From.From.Owner.GetAdjective] industrial center, was struck today by a nuclear bomb launched by [?global.nukecountry.GetNameDef]. It is speculated that the city was chosen as a target because it has been regarded as an intellectual center.\n\nThe beauty and historical significance of the Kyoto led many to assume it would be spared from the bomb, but it appears the terror of raining destruction on such a place has rather been seen as a benefit, increasing the psychological impact of the attack. The city's location in the valley somewhat limited the blast, but the old Imperial Palace and many industrial buildings have been completely destroyed."
 nuke_dropped.6.a: "Legacy and beauty mean nothing in a war like this."
 nuke_dropped.6.b: "If they destroy the old, we will build the new."
 nuke_dropped.7.t: "Atomic Bombing of Tokyo"
 nuke_dropped.7.d: "Today, a nuclear strike was directed at the heart of the Japanese Empire by [?global.nukecountry.GetNameDef]. The capital of Tokyo, although expected to be the target of firebombing, was never assumed to be a prioritized target of this new weapon. Yet ultimately, perhaps due to the significance of the new capital and Imperial Palace which has now been destroyed, an even more all-consuming fire has fallen on the city.\n\nAlthough [From.From.Owner.GetLeader] is reported to have survived, the event has raised questions about how far Japan's enemies are willing to go. If the war does not end with this, what targets remain? What is left to threaten with?"
 nuke_dropped.7.a: "Does this mean the end of the Japanese Empire?"
 nuke_dropped.7.b: "As long as [From.From.Owner.GetLeader] lives, so does the Empire."
 nuke_dropped.8.t: "Atomic Bombing of Washington D.C."
 nuke_dropped.8.d: "A nuclear bomb was detonated today over the capital of the United States. In an attack clearly directed at the political center and historical legacy of the US, the White House, the Capitol and a number of monuments and memorials were wiped off the face of the Earth by their enemy, [?global.nukecountry.GetNameDef]. Even the Burning of Washington over a century ago pales in comparison to the destruction visited upon the city by this devastating weapon.\n\nAlthough President [From.From.Owner.GetLeader] has been brought to safety, the nation has been shaken to its core. No doubt, the US hoped to be the first and only country to wield such a weapon. Those hopes have now been shattered in the worst possible way."
 nuke_dropped.8.a: "One nation, indivisible, versus one atom, divisible."
 nuke_dropped.8.b: "The eagle will rise from the ashes like a phoenix."
 nuke_dropped.9.t: "Atomic Bombing of Rome"
 nuke_dropped.9.d: "A nuclear explosion struck the city of Rome today, shocking people around the world, in an unprecedented attack by [?global.nukecountry.GetNameDef]. Due to its historical and artistic treasures, many had never thought the ancient city would be the target of such indiscriminate destruction. With the Vatican City also partially destroyed and the whereabouts of the Pope unknown, the event has horrified not only Italians, but Catholics around the world.\n\nRome's rapid growth in the past decade has been nearly completely undone by the attack. For a while, it looked like the city could aid the nation's recovery after the war was over. Those hopes have now been turned to dust, along with many people."
 nuke_dropped.9.a: "Bomba Iacta Est!"
 nuke_dropped.9.b: "Rome won't be rebuilt in one day..."
 nuke_dropped.10.t: "Atomic Bombing of Paris"
 nuke_dropped.10.d: "Today, a nuclear device launched by [?global.nukecountry.GetNameDef] was detonated over the city of Paris, causing widespread destruction and countless casualties. France was in shock as its capital suffered what may be the most devastating attack it ever experienced, despite centuries of wars and revolutions. The Parisians had perhaps expected conquest, but not utter, brutal desolation.\n\nAny victory parades at Champs-Élysées past the remains of the Arc de Triomphe seem unlikely in the city's current state. Perhaps the coming decades will see the birth of a new Paris, but Paris in the public mind, the city built in the Belle Époque, is gone forever."
 nuke_dropped.10.a: "The city of light has burned out."
 nuke_dropped.10.b: "Only yesterday, it seemed like we'd always have Paris."
 nuke_dropped.11.t: "Atomic Bombing of Moscow"
 nuke_dropped.11.d: "A city many have tried and failed to conquer, Moscow was the target of a nuclear attack by [?global.nukecountry.GetNameDef] today. The explosion was directed at the heart of [From.From.Owner.GetAdjective] leadership, the Kremlin having been nearly completely destroyed by the blast.\n[From.From.Owner.GetLeader], having grown more aware and fearful of all possible and impossible threats recently, evacuated in time and survived. However, even the vastness of [From.From.Owner.GetName] may not be enough to escape such a ruthless enemy. Indeed, if this continues, the nation will soon consist only of two kinds of wastelands: Those which were there in the first place, and those created by its enemies."
 nuke_dropped.11.a: "Won't a nuclear winter only make Moscow a more difficult target?"
 nuke_dropped.11.b: "They may burn every city we have, but they will never take them."