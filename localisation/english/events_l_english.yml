 corruption.1.t: "Mayor Appointed a Friend to Head the Utility Service"
 corruption.1.desc: "The mayor of the capital carried out a \"planned rotation\" and put an old friend at the head of the utility service, a man who had never worked a single day in housing and utilities. At first glance this is a local appointment, but the capital's utility service controls heat, water, and power supply for millions of people and the country's largest contracts. It soon turns out that the new head is connected to a contractors' cartel, and his firms had received contracts without tender for years. A parliamentary commission demands explanations, the opposition speaks of \"systemic corruption at the very top,\" and we are forced to justify ourselves before foreign investors. Formally this is the mayor's personnel decision, but what is being discussed is no longer the mayor, but who in the country actually distributes the money."
 corruption.1.a: "We need to get to the bottom of this!"
 corruption.1.b: "Better to hush up the matter."
 corruption.2.t: "Offshore Scandal"
 corruption.2.desc: "Investigative journalists have discovered that the country's largest industrial concern transferred billions of dollars to offshore zones to hide profits from the tax service. Our citizens are furious."
 corruption.2.a: "Issue a record fine!"
 corruption.2.b: "We cannot touch the national champion."
 corruption.3.t: "Suspicious Privatization"
 corruption.3.desc: "A government official responsible for selling assets was spotted on the yacht of an oligarch who won a tender to buy a state factory at a price 10 times below market value."
 corruption.3.a: "The auction results must be annulled."
 corruption.3.b: "It's just business."
 corruption.4.t: "Shadow Workshop"
 corruption.4.desc: "The director of a large factory was caught organizing an underground production line. He used state raw materials and labor to produce scarce goods, which he then sold on the black market. He split the profits with the local party leadership."
 corruption.4.a: "Carry out a public execution!"
 corruption.4.b: "The party does not betray its own!"
 corruption.5.t: "Shortages and Queues"
 corruption.5.desc: "The food situation in the capital has worsened. However, it turned out that the best products go to closed special distribution centers for the nomenklatura and are sold on the black market at speculative prices. The working class is outraged."
 corruption.5.a: "Dismantle the special distribution centers!"
 corruption.5.b: "These are temporary difficulties."
