wgr.23.t: "CDU victory!"
wgr.23.desc: "Voters once again entrusted the ruling CDU/CSU and FDP coalition with forming the government. Despite sharp criticism from the opposition and the growing influence of the Greens, our bloc retained a confident majority in the Bundestag. Johannes Rau, our main rival from the SPD, admitted defeat, although his party managed to hold its positions.\n\nHowever, within our own coalition the results caused mixed feelings. We lost some votes compared to 1983, and many of our deputies are concerned about the growing demand for social reforms and environmental policy. Helmut Kohl, our chancellor, called the results a “clear mandate” to continue the course, but warned that the coming years would require greater flexibility.\n\n"
wgr.23.a: "Long live the CDU!"
wgr.24.t: "SPD victory!"
wgr.24.desc: "The federal elections of 1987 brought the long-awaited victory of the Social Democratic Party of Germany.\n\nJohannes Rau, our candidate and Minister-President of North Rhine-Westphalia, managed to convince the German electorate of the need for change. Tired of the long rule of the conservative coalition, voters believed in our program of social justice, ecological modernization, and peace-loving foreign policy.\n\nWe achieved a convincing majority, leaving behind the CDU/CSU and their partners. The Greens, although they strengthened their positions, remained a junior partner in the opposition. Now broad opportunities are opening before us for carrying out reforms that were postponed for so long.\n\nHowever, victory does not mean an easy life. The economy needs stimulation, unemployment remains high, and tension between East and West requires a balanced position from us. In addition, the American allies look warily at our coming to power - Washington fears that we will move too far from NATO's course."
wgr.24.a: "Long live the SPD!"
