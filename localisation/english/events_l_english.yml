 MINIMIZE_EVENT: "§GClick§! to minimize. The event will be placed in the §HEvents and Decisions§! section of the event area."
 usa.1.t: "Republicans Win!"
 usa.1.desc: "Elections were held in the United States a week ago, and the Republican Party, led by George H. W. Bush, emerged victorious."
 usa.1.a: "Hooray!"
 usa.2.t: "Democrats Win!"
 usa.2.desc: "Elections were held in the United States a week ago, and the Democratic Party, led by Michael Dukakis, emerged victorious."
 usa.2.a: "Hooray!"
 usa.3.t: "Gorbachev's Proposal"
 usa.3.d: "The diplomatic and economic sanctions imposed on us by the United States are clearly just the beginning of a serious confrontation. The presence of the American Pacific Fleet at Pearl Harbor in Hawaii means that the Americans intend to maintain their presence in the region and provide assistance to our enemies. By striking their base now, we will use the element of surprise."
 usa.3.a: "Perhaps we will agree"
 usa.4.t: "Aid from the United States"
 usa.4.d: "The United States has taken an anti-German stance and now intends to help Great Britain strengthen itself in the face of the German threat. At the same time, they are interested in maintaining their presence in the Atlantic. In exchange for several of our naval bases, they are ready to provide us with destroyers. These ships are taken from reserve, but agreeing would mean strengthening military ties between our countries. Perhaps this is a wise decision."
 usa.4.a: "This is a unique opportunity."
 usa.4.a.tt: "We will receive 43 American destroyers.\nCanada will receive 7 American destroyers."
 usa.4.b: "This offer is clearly more beneficial to the United States, so it is unacceptable to us."
 usa.5.t: "[FROM.GetNameDef] Agreed"
 usa.5.d: "Despite all our preparation and good intentions, Great Britain refused to accept the old destroyers in exchange for naval bases."
 usa.5.a: "We are winning the Cold War!"
 usa.6.t: "[FROM.GetNameDef] Refused."
 usa.6.d: "Presidential Election Day has arrived. Incumbent President Franklin Delano Roosevelt has already implemented several programs, collectively known as the New Deal, aimed at lifting the country out of the Great Depression.\n\nMany measures have been successful, but plans to further expand the role and powers of government have drawn criticism from his opponent, Republican Alf Landon. Landon, who entered politics from the oil business, advocates for expanding economic freedoms, while Roosevelt and the Democratic Party stand for social security and economic stability. The election may show a balance of power or bring a convincing victory to the Democrats."
 usa.6.a: "Their loss."
 usa.6.b: "Republicans. We must preserve American ideals."
 usa.7.t: "Roosevelt vs. Willkie"
 usa.7.d: "Since the institution of the presidency appeared in the United States, no president has held office for three consecutive terms. Nevertheless, given the instability of world politics and current events, President Roosevelt decided to break this tradition and run for a third term. Republican Wendell Willkie, called a dark-horse candidate with a good background in industry and almost none in politics, criticizes both Roosevelt's economic policies and his intention to run for a third term.\n\nThe candidates share many views on international politics, and Willkie aims to preserve several provisions of the New Deal. Many believe that this election will determine the future of American democracy."
 usa.7.a: "Democrats. We need Roosevelt."
 usa.7.b: "Republicans. We want Willkie!"
 usa.8.t: "Landon vs. Roosevelt"
 usa.8.d: "President Landon put an end to the New Deal reforms carried out by the Democrats four years ago and chose to rely on industrial companies like those he personally founded before becoming president. The core of Roosevelt's campaign is the continuation of the course he set during his first term, and he now intends to run again. He is popular, but Landon criticizes him for seeking to concentrate power in the hands of the president, as he himself pursues a different policy.\n\nThe external threat, aimed at both our country and others, remains a reality, and both candidates are aware of it. The question is who will lead the leading democratic power in these difficult times."
 usa.8.a: "Republicans. Landon upholds our values."
 usa.8.b: "Democrats. Roosevelt is ready to do whatever it takes."
 usa.9.t: "Roosevelt vs. Dewey"
 usa.9.d: "Franklin Delano Roosevelt was an unusual president in many ways. Despite deteriorating health and an unusually long tenure, he intends to lead our country during the war. The Republicans have been limited in their choice of candidates, as many are now in the military, and have chosen Governor Thomas Dewey as their representative.\n\nRoosevelt still enjoys popular support, but many fear he will not live to see the end of his term. Will that be enough to bring Dewey victory over the man under whose leadership we have come so far?"
 usa.9.a: "Roosevelt defeats Dewey."
 usa.9.b: "Dewey defeats Roosevelt."
 usa.10.t: "[Root.GetLeader] vs. Roosevelt"
 usa.10.d: "Although in many respects [Root.GetLeader] intends to adhere to the New Deal, Roosevelt still sees an opportunity to implement his original program. Despite his failing health, he remains popular and is again the Democratic candidate.\n\n[Root.GetLeader] argues that changing America's leadership in the current situation would be an irresponsible step, and there is irony in that, since the same was said before he defeated Roosevelt last time. Perhaps he is right."
 usa.10.a: "[Root.GetLeader] has proven to be a worthy leader."
 usa.10.b: "America is ready for a new 'New Deal'."
 usa.11.t: "Roosevelt vs. MacArthur"
 usa.11.d: "Given the constant threat of the United States being drawn into war, both Democrats and Republicans are trying to choose candidates who will satisfy the military. General Douglas MacArthur, taking time away from his military duties, began a Republican campaign after peace was established and our country emerged victorious. He challenges Roosevelt and runs as a conservative.\n\nRoosevelt retains popularity, but MacArthur's charisma and sense of duty do not leave voters indifferent. Perhaps the military would do better?"
 usa.11.a: "Roosevelt and Truman will get their way."
 usa.11.b: "MacArthur knows how to build peace, not just wage war."
 usa.12.t: "Douglas MacArthur's Campaign"
 usa.12.d: "To challenge Roosevelt, who has held the presidency for a record time, the Republicans decided to choose a candidate from among the military command who had been through the war. General Douglas MacArthur was popular with conservatives, but he was very busy with his direct duties and did not want to take time away from them for a presidential campaign.\n\nNevertheless, he remains one of the most attractive candidates for conservatives. Perhaps he can be persuaded to make certain sacrifices so that our president does not become a moderate Republican?"
 usa.12.a: "MacArthur is needed more at the front than in the White House."
 usa.12.b: "We need him to challenge Roosevelt."
 usa.13.t: "Death of Roosevelt"
 usa.13.d: "Although President Roosevelt's health had been deteriorating for some time, the confidently run presidential campaign convinced many that he had many years ahead of him. Nevertheless, no one ruled out the possibility of FDR dying in office, and today he died of a heart attack. Vice President Harry Truman took the oath and asked the American people to pray and support him. The cabinet remains the same, and Truman promised to keep his predecessor's policies unchanged."
 usa.13.a: "One era has ended, another has begun."
 news.1.t: "Reykjavik Summit"
 news.1.d: "The second personal meeting between General Secretary of the CPSU Central Committee Mikhail Gorbachev and US President Ronald Reagan took place on October 11-12, 1986, in Reykjavik, halfway between Moscow and Washington. Despite the fact that the meeting broke up without signing any documents, it is considered an important milestone in the Soviet-American negotiation process on strategic offensive arms and the first step toward ending the Cold War."
 news.1.a: "A major breakthrough!"
 news.2.t: "Death of Konstantin Chernenko"
 news.2.d: "Konstantin Chernenko died today."
 news.2.a: "Hooray, humanity!"
 news.3.t: "Iraq Invades Kuwait!"
 news.3.d: "Iraq invades Kuwait."
 news.3.a: "Vultures feasting on a corpse..."
 news.4.t: "Chernobyl Nuclear Accident"
 news.4.desc: "On April 26, 1986, at 1:23 AM, a powerful explosion occurred at the fourth reactor of the Chernobyl Nuclear Power Plant during testing of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest man-made releases of radioactive substances in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 entered the atmosphere. Thousands of people participated in the liquidation of the consequences, many of whom received serious doses of radiation. This disaster was a blow to the stability of the Soviet Union, increasing tension in society and exacerbating the political situation in the USSR."
 news.4.a: "Eternal memory to the heroes!"
 news.5.t: "Yugoslav Wars Begin"
 news.5.desc: "Today, war began in Yugoslav territories, which mainly included a series of interethnic conflicts between Serbs on one side and Slovenes, Croats, Bosniaks, and Albanians on the other, as well as the Croat-Bosniak conflict and the conflict between the Republic of Western Bosnia (initially supported by Croats, then by Serbs) and the central Muslim authorities led by Alija Izetbegović in the Republic of Bosnia and Herzegovina, and the conflict between Albanians and Macedonians in North Macedonia, caused by religious and ethnic contradictions."
 news.5.a: "Another protracted war..."
 news.6.t: "Elections to the Supreme Soviet of the RSFSR"
 news.6.desc: "Today, non-alternative elections to the Supreme Soviet of the RSFSR of the 11th convocation took place.\n\nElections to the 9th convocation of the Supreme Soviet of the RSFSR were held according to the Regulations on Elections to the Supreme Soviet of the RSFSR, approved by the Decree of the Presidium of the Supreme Soviet of the RSFSR of August 8, 1978. 101,058,205 people took part in the elections (turnout — 99.97%). 100,989,507 people voted for the candidates (99.93%)."
 news.6.a: "Will this become the beginning of a new war in Asia?"  # Note: original key "news..a" appears to be a typo, left as is.
 news.7.t: "Steve Jobs' Visit to Moscow"
 news.7.desc: "In the summer of 1985, Steve Jobs, one of the founders of the California computer company Apple, along with lawyer Albert Eisenstat, arrived in Soviet Moscow. Their plans were to establish cooperation with the Soviet leadership and open production of their computers in the country."
 news.7.a: "Will this become the beginning of a new war in Asia?"  # Duplicate description in original, preserved.
 news.7.b: "What a disgrace..."
 news.7.c: "We showed the whole world what we are worth."
 news.8.d: "A serious incident recently occurred between Soviet and Japanese troops on the Manchurian border.\n\nAccording to reports from the scene, the Japanese put the Russians in a vise when they attacked them across the border and forced the survivors to retreat in panic.\n\nWill Moscow be forced to increase its military presence in the Soviet Far East?"
 news.8.b: "For the Emperor!"
 news.8.c: "We must weigh the pros and cons..."
 news.9.t: "Soviet Retreat"
 news.9.d: "With Japanese troops massing in Manchuria, the Soviet Union unexpectedly withdrew its units stationed on the border.\n\nPerhaps Moscow is thus trying to avoid a new confrontation with Tokyo, because one of the most painful memories for the Russians is the defeat in the Russo-Japanese War."
 news.9.a: "Let us hope this serves the cause of peace."
 news.9.b: "The cowards have fled!"
 news.9.c: "A tactical retreat. Nothing more."
 news.10.t: "Soviet Union Demands Bessarabia"
 news.10.d: "Having withdrawn troops to the Romanian border, [SOV.GetNameDef] issued an ultimatum to official Bucharest to immediately transfer Bessarabia, which had previously been part of the Russian Empire, under its control.\n\nRomania stated that it had no choice but to accept the Soviets' demands, and Romanian troops left Bessarabia."
 news.10.a: "Curious."
 news.10.b: "Bessarabia is rightfully ours."
 news.10.c: "We had no choice..."
 news.10.e: "Rejoice, Moscow, but this is a temporary victory."