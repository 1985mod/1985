usa.20.d: ""
usa.20.a: "Sad."
usa.21.t: "Accident of the aircraft carrier USS Coral Sea"
usa.21.d: "The US Navy aircraft carrier USS Coral Sea (CV-43), returning after a major $200 million refit, collided with the Ecuadorian tanker Napo during exercises in the Caribbean Sea, near the US base at Guantanamo, Cuba. The incident occurred in clear weather with 11 kilometers visibility."
usa.21.a: "It was the fault of the civilian vessel. Our fleet is not to blame."
usa.22.t: "41 Tornadoes swept across the USA"
usa.22.d: ""
usa.22.a: "Oh God..."
