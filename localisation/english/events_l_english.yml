 usa.35.d: ""
 usa.35.a: "That is worse for them."
 usa.36.t: "At the budget summit"
 usa.36.d: "That is worse for them."
 usa.36.a: "Very good."
 add_2_billion_to_treasury_tt: "§G2 billion dollars§! will be added to the §Y[Root.GetAdjective]§! treasury"
 usa.37.t: "The USA proposes signing CHB - I"
 usa.37.d: "A government delegation has arrived from Washington with an unexpected and ambitious draft agreement, codenamed CHB - I. The American side proposes fixing the current balance of forces and establishing strict frameworks for strategic cooperation and arms control. \n\nFierce debates have erupted in the People’s Commissariat for Foreign Affairs. Supporters of the agreement argue that signing the CHB - I treaty will ease international tensions, give our industry a breather, and open access to valuable technologies. Skeptics, however, warn: this could prove to be a cunning diplomatic trap by the capitalists, designed to tie the Soviet Union’s hands before the coming storm. The final decision remains with the Kremlin."
 usa.37.a: "Very well, we will sign."
 usa.37.b: "Never!"
 usa.38.t: "The USSR refused"
 usa.38.d: ""
 usa.38.a: "That is worse for them, a new race."
 usa.38.b: ""
 usa.39.t: "The USSR agreed to the meeting"
 usa.39.d: ""
 usa.39.a: "Hello, Mr. Gorbachev."
 usa.40.t: "The USSR officially refused the meeting."
 usa.40.d: ""
 usa.40.a: "This is an escalation of the Cold War!"
 usa.41.t: "Economic aid from the USA"
 usa.41.d: "Within the framework of Washington’s new foreign policy doctrine, our government has received an official proposal from the US State Department. The American administration is ready to include our country in a large-scale program of financial and technical assistance. We are offered major dollar grants for infrastructure development, preferential loans for business, and supplies of advanced equipment. The opposition warns of the risk of losing economic sovereignty, but the Ministry of Finance insists: this money will save our budget."
 usa.41.a: "Thank you, America!"
 usa.41.b: "No ties with America!"
 usa.42.t: "Mutual assistance proposal from the USA"
 usa.42.d: "A high-ranking delegation from Washington has arrived at the office of the head of our state with an official proposal to conclude a Mutual Assistance Treaty. The Americans offer us an unprecedented support package: direct supplies of heavy weapons, grants for modernizing ports and airfields, and access to the latest military doctrines. However, this pact has its price. The White House demands that the American armed forces be granted rights to transit troops, refuel fleets, and organize permanent bases on our territory. The generals see this as a unique chance to strengthen the army, but diplomats warn - this will finally tie our foreign policy course to Washington’s will."
 usa.42.a: "We definitely agree."
 usa.42.b: "Never! America sucks."
 usa.43.t: "Iran accepted our proposal"
 usa.43.d: ""
 usa.43.a: "Good."
 usa.44.t: "Iran refused"
 usa.44.d: ""
 usa.44.a: "That is worse for them."
 usa.45.t: "The USA is conducting bombings on our territory!"
 usa.45.d: ""
 usa.45.a: "This is illegal! We will declare a diplomatic protest."
 usa.46.t: "The USA proposes holding exercises"
 usa.46.d: "Washington has officially requested from our government permission and logistical support for holding the largest military maneuvers of the decade - “Reforger-88.” The USA plans to rapidly transfer a hundred-thousand-strong group of troops across the ocean to practice a scenario of total war against the Warsaw Pact. Our General Staff supports this initiative. However, the Ministry of Foreign Affairs warns: tanks on our streets will provoke a harsh response from Moscow. Panic is growing in society, pacifists are already taking to protest marches. What is our decision?"
 usa.46.a: "We agree. In our time this is necessary."
 usa.46.b: "We would rather refuse"
 usa.47.t: "The USA proposes that we sign the INF Treaty"
 usa.47.d: "A final draft of the INF Treaty has arrived from Washington through official communication channels. Ronald Reagan’s administration proposes an unprecedented step: the complete elimination of an entire class of nuclear weapons. However, the US conditions are extremely harsh. They demand not merely parity reductions, which would force us to dispose of almost twice as many missiles as the Americans destroy. The Politburo is split. Economists insist that this is the only chance to stop the arms race and save the budget of Perestroika. The military, led by the General Staff, declare that agreeing to American conditions is unilateral disarmament and a betrayal of national interests. Our answer will determine the fate of the socialist bloc..."
 usa.47.a: "We definitely agree."
 usa.47.b: "No deals with capitalists!"
 usa.48.t: "The USSR agreed to sign the INF Treaty"
 usa.48.d: "Incredible news from the Kremlin! Mikhail Gorbachev has officially accepted our “double zero option.” The Soviet Union agrees to completely eliminate not only its SS-20 intermediate-range missiles, but also shorter-range systems, including the newest Oka system, which formally did not even fall under the restrictions. Under the terms of the agreement, the USSR will destroy almost twice as many missiles in its arsenal as the United States. This is an unconditional triumph of our “peace through strength” strategy."
 usa.48.a: "Excellent, everything is going according to plan!"
 usa.49.t: "The USSR refused to sign the INF Treaty"
 usa.49.d: "The worst fears of the Pentagon and the CIA have been confirmed: Mikhail Gorbachev at the last moment denounced the draft agreement and refused to sign the INF Treaty. The Soviet delegation stated that US demands for the elimination of the newest Oka systems and total inspection control infringe on the sovereignty and security of the USSR. The détente process is officially dead. Soviet “Pioneers” (SS-20s) remain on combat duty, aimed at the capitals of Western Europe. NATO publics are in panic, and hawks in the Senate demand an immediate and harsh response from President Reagan."
 usa.49.a: "To hell with them!"
 usa.50.t: "The INF Treaty enters into force"
 usa.50.d: "Today in Moscow, Mikhail Gorbachev and Ronald Reagan exchanged instruments of ratification. The historic treaty has officially entered into force. Across the country, from Kapustin Yar to Saryozek, the controlled destruction of intermediate- and shorter-range missiles begins. For the Soviet Union this is a step toward “New Political Thinking” and détente, but part of the generals in the Stavka express deep concern about the weakening of the nuclear shield in Europe..."
 usa.50.a: "Excellent!"
 usa.51.t: "Bush’s second term"
 usa.51.desc: "Contrary to pollsters’ forecasts and strong voter dissatisfaction due to economic stagnation, George H. W. Bush managed to turn the tide of the election race in late 1992.\n\nHis experience in foreign policy and image as a reliable leader helped him defeat Bill Clinton. America remains under Republican Party rule.\n\nThe Cold War is over, but old problems await the country. Unemployment is rising, the budget deficit frightens Congress, and the world around continues to change. The president will have to make difficult decisions to preserve the USA’s status as a global superpower."
 usa.51.a: "Republicans. Four more years!"
 usa.52.t: "Should a demilitarized zone be established?"
 usa.52.desc: "After the crushing success of Operation Desert Storm, Saddam Hussein’s regime backed down, but the threat to regional stability in the Middle East remains. A fierce debate has erupted in the White House over how to consolidate victory.\n\nAdvisers propose establishing a permanent demilitarized zone (DMZ) along Iraq’s borders to completely deprive Baghdad of the ability to attack its neighbors."
 usa.52.a: "This definitely must be done, it is not even up for discussion."
 usa.52.b: "Better not, this will lead to escalation of the conflict."
 usa.53.t: "The no-fly zone question"
 usa.53.desc: "Despite the end of active combat operations, the situation inside Iraq remains critical. Saddam Hussein’s regime has begun brutally suppressing internal uprisings, using ground-attack aircraft and combat helicopters against rebels.\n\nIn the US National Security Council, opinions are divided. Humanitarian organizations and allies demand the immediate introduction of a no-fly zone to protect civilians and weaken Baghdad’s dictatorship. On the other hand, permanent patrolling of Iraqi skies by US Air Force forces is a direct threat to the lives of American pilots and a colossal burden on the defense budget."
 usa.53.a: "We will establish it."
 usa.53.b: "We will refuse this."
 usa.54.t: "Recognition of defeat in Iraq"
 usa.54.desc: "What was conceived as a demonstration of American military power and an affirmation of the New World Order turned into a geopolitical nightmare. Protracted patrolling, constant air clashes, and ineffective sanctions led to resource exhaustion. The final straw was coordinated Iraqi strikes on allied bases and several downed American aircraft, to which we found no decisive response due to harsh pressure from Congress and protests within the country."
 usa.54.a: "Shame..."
 usa.55.t: "George Bush’s address"
 usa.55.desc: "Today President George H. W. Bush addressed the nation, effectively admitting that the USA is winding down its military presence in the region and lifting the blockade. Saddam Hussein celebrates triumph, and our allies in the Middle East feel betrayed. We capitulated to circumstances, and this is a colossal blow to the prestige of the only superpower."
 usa.55.a: "This is a catastrophe..."
 usa.56.t: "Mass protests"
 usa.56.desc: "The fall of Bonn and Brussels, the collapse of West Germany, and the shameful Copenhagen armistice plunged American society into shock. The administration of [USA.GetLeader] came under a hail of devastating criticism: while Soviet tanks of [SOV.GetLeader] redrew the map of Europe and took revenge in Korea, the White House did not dare use nuclear weapons and effectively surrendered its NATO allies.\n\nToday the streets of Washington, New York, and Chicago are filled with millions of protesters. Left-wing radicals demand immediate demilitarization and an end to “imperialist adventures,” while right-wing hawks and nationalists accuse our government of national betrayal and cowardice. The economy is feverish from the loss of European markets, and the air smells of a new civil war. The nation is split, and the USA’s status as a superpower hangs by a thread."
 usa.56.a: "Something must be done!"
 usa.57.t: "Communism is gaining popularity"
 usa.57.desc: "The USSR’s successes in the Third World War destroyed the myth of capitalism’s invincibility. Against the backdrop of the harshest economic crisis and the betrayal of European allies, the American labor movement is experiencing an unprecedented upsurge. The Communist Party USA (CPUSA), for years underground and marginalized, suddenly became the main force in the streets.\nWorkers are seizing factories in Detroit, Oakland dockworkers refuse to load warships, and in Chicago thousands-strong marches pass under red banners and portraits of Lenin. The protesters’ slogan is simple: “The USSR managed to feed and protect its own, while [USA.GetLeader] protects only bankers!” Disillusioned Korean War veterans are joining “Red Guard” units en masse. We are losing control over entire states."
 usa.57.a: "Not this!"
 usa.58.t: "Middle-class strikes"
 usa.58.desc: "If the protests of the proletariat and radicals in the USA were expected, then the middle-class strike struck our administration a crushing blow in the back. The devaluation of the dollar, the freezing of bank deposits for the needs of the military-industrial complex, and the loss of the European market led to mass bankruptcies of small businesses. Office clerks, bank employees, engineers, teachers, and doctors suddenly realized that their “American Dream” was dead."
 usa.58.a: "Hard..."
 usa.59.t: "Popular discontent is growing"
 usa.59.desc: "The situation in the United States has completely spiraled out of our control. Neither harsh police measures nor attempts to court unions and the middle class could stop the avalanche. Bread lines, empty store shelves, and funeral notices from Korea finally buried citizens’ faith in their government. Protests have grown into a nationwide revolt."
 usa.59.a: "Bad."
 usa.60.t: "Secession of California"
 usa.60.desc: "The official recognition of the independence of the State of California launched an irreversible process of disintegration of the United States of America. Seeing how Sacramento unpunishedly took the Pacific coast, other states hurried to follow this example. The federal center in Washington is no longer perceived as legitimate authority - for governors and local elites, the time has come to save their own skins and capital."
 usa.60.a: "No!"
 usa.61.t: "Texas secedes"
 usa.61.desc: "The last and most powerful bastion of conservative America has fallen under the weight of chaos. Seeing that Washington surrendered to left-wing radicals, and California unpunishedly took the western coast, the governor and legislature of Texas took an extreme step. Citing the federal center’s violation of the Constitution and inability to protect private property, Austin officially proclaimed the restoration of the independent Republic of Texas.\n\nLocal oil magnates, right-wing politicians, and National Guard command instantly sealed the state’s borders. All federal military bases, including Fort Hood and Houston’s most important oil refineries, came under the control of Texas authorities. Worse, army units fleeing the zone of unrest in the North are massing under the banner of the “Lone Star.” Texas is not simply seceding - it openly declares that it will become the base for a future crusade against the “red plague” in Washington."
 usa.61.a: "We will not invade, this will escalate the situation in America."
 usa.62.t: "Secession of the West"
 usa.62.desc: "The chain reaction launched by the secession of California and Texas finally tore us apart. Realizing that Washington is no longer able to project power beyond the Mississippi, and that a communist dictatorship is about to establish itself on the East Coast, the states of the Wild West and Rocky Mountains began massly saving themselves from imminent catastrophe. The central government has lost control over millions of square kilometers of territory.\n\nIn the harsh Northwest, loggers, environmentalists, and port workers of Seattle and Portland united with local liberal elites, proclaiming the independent Republic of Cascadia - a stronghold of social democracy seeking to hide from the world war behind the Canadian border. To the south, in Salt Lake City, the leadership of the Church of Jesus Christ of Latter-day Saints took power into its own hands: Nevada and Utah united into the theocratic Republic of Utah, announcing the creation of a “land of order and faith amid red chaos.”\n\nIn the south, along the Mexican border, the political landscape turned out different. In the Federation of Arizona and New Mexico, power passed into the hands of moderate liberals and classical Democrats who had fled Washington. Historically loyal to the ideals of freedom and constitutional rights, they refused to recognize both the right-wing radicalism of Texas and the communism advancing from the east. Local liberal elites are hastily forming a coalition, trying to build an island of “true American democracy and capitalism” in the Southwest, but they catastrophically lack heavy weapons to defend their long and vulnerable borders. There is no one left to defend the frontiers in the West - the federal front has collapsed."
 usa.62.a: "Everything is bad..."
 usa.63.t: "Secession of the South"
 usa.63.desc: "While Western America was fragmenting into isolated republics, Dixieland plunged into its own deep chaos. Ideological split and the White House’s inability to contain the communist march on Washington finally destroyed the southern states. The huge and once monolithic region split into warring factions, each seeing the South’s future in its own way.\n\nIn Richmond, right-wing hawks, radical conservatives, and veterans of Vietnam and Korea raised the old Confederate banner, proclaiming the creation of the Confederate States of America (CSA). Lieutenant Colonel Oliver North stood at its head - a charismatic officer known for his harsh anti-communist position, who immediately declared total mobilization for a “crusade against Washington and the Soviet threat.” However, Southern unity did not happen. In Little Rock, young and ambitious Governor Bill Clinton announced the secession of the State of Arkansas, condemning North’s radicalism and trying to preserve a centrist, moderately liberal platform. To the south, in Baton Rouge, charismatic reformer Buddy Roemer proclaimed the independence of Louisiana, blocking the mouth of the Mississippi to protect the local economy from ruin. Finally, in the far southeast, Governor Bob Martinez withdrew Florida from the Union, declaring the peninsula a “zone of democratic order,” and is hastily pulling National Guard forces to Miami to save the state from anarchy. The united South is dead, and in its place a powder keg has ignited."
 usa.63.a: "Tolerable..."
 usa.64.t: "Secession of the North"
 usa.64.desc: "The last stronghold of the old Federal Republic has ceased to exist. With the loss of the South and paralysis of power in Washington, the US Northeast - the financial, industrial, and historical core of the nation - found itself in complete isolation. Against the backdrop of ongoing strikes by workers of the “Rust Belt” and panic on the exchanges, local political and financial elites decided to sever ties with the sinking White House in order to save their states from imminent anarchy and the advancing wave of communism.\n\nIn Albany, the mayor of New York and the state governor, relying on Wall Street support and remnants of loyal police, proclaimed the independence of the State of New York. The planet’s largest financial center barricaded itself, declared a state of emergency, and is hastily hiring private military companies to guard bank vaults from hungry riots. At the same time, six states east of the Hudson - Maine, Vermont, New Hampshire, Massachusetts, Connecticut, and Rhode Island - united, proclaiming the creation of the sovereign Republic of New England. The moderate liberals and conservatives who led it declared New England the “legitimate successor to American ideals of freedom.” They have already opened their borders to Canadian troops and are requesting protectorate status from Ottawa and the surviving remnants of NATO. Our administration is finally losing control over the Atlantic coast."
 usa.64.a: "Perhaps a forced union will be worth it..?"
 usa.65.t: "The emergence of the Great Lakes"
 usa.65.desc: "The territorial collapse of our country reached its apogee, tearing apart the central part. The internal states left without contact with Washington and the powerful industrial core around the Great Lakes chose diametrically opposite paths of salvation. America finally ceased to exist as a single landmass.\n\nIn the vast expanses of the Wild West and Great Plains - in the states of Colorado, Montana, Wyoming, North Dakota, South Dakota, Nebraska, Kansas, and Oklahoma - the military bases of Space Command (AFSPC) and Strategic Air Command united under harsh Pentagon control. Four-star General John Piotrowski announced the creation of a junta called the “Northern Military Command.” Locking down hundreds of Minuteman nuclear missile silos, Piotrowski imposed total militarization and harsh censorship, promising to shoot any striker and deserter.\n\nAt the same time, in the very industrial heart of America, a flame erupted that the Kremlin had fanned for so long. Cut off from southern oil and western raw materials, the working class of Illinois, Michigan, Minnesota, and Wisconsin, as well as other states, rose in general revolt. Trade unions and CPUSA cells proclaimed the creation of the Democratic Union of the Great Lakes. The long-time leader of American communists, Gus Hall, stood at the head of the new socialist state. Under his leadership, the “Rust Belt” instantly turned into the “Red Belt”: Detroit factories and Gary steelworks switched to producing armored vehicles for the proletariat, and Hall himself is already coordinating his actions directly with the head of the USSR. We have lost our main factories and arsenals."
 usa.65.a: "Communism has come to America..."
 usa.66.t: "Greece Announces Withdrawal from NATO"
 usa.66.desc: "Seeing the colossal concentration of Warsaw Pact troops on the border of the FRG and Turkey, Athens made a statement that changes the entire strategic map of the Mediterranean. The Greek government announced its withdrawal from NATO, stating that it does not intend to become a 'bargaining chip' in someone else's war and a nuclear testing ground for superpowers.\n\nThis is a catastrophic blow to the southern flank of the alliance. We are losing critically important air bases and ports, including Souda Bay, which were key for the US Sixth Fleet. Greek generals are hastily withdrawing their divisions from NATO positions, leaving the Turkish border open. At the same time, Turkey, now surrounded on two sides, demands immediate security guarantees and additional arms supplies from Washington.\n\nA gloomy atmosphere reigns in the White House and the Pentagon. The loss of Greece means that the Soviet fleet may gain access to the Aegean Sea, and NATO loses control over the eastern part of the Mediterranean. We need to urgently decide how to respond to this demarche before the chain of allies begins to crumble further."
 usa.66.a: "Pressure Greece."
 usa.66.b: "Bet on Ankara"
 usa.67.t: "Greece Backs Down"
 usa.67.desc: "Athens has backed down. After intensive consultations with our diplomats and receiving additional security guarantees, the Greek government withdrew its statement of withdrawal from NATO. The alliance is preserved, but the price turned out to be high.\n\nGreece announced a 'strategic retreat.' Greek divisions are being withdrawn from the front line on the border with Turkey and Bulgaria, yielding place to American and Turkish units. Athens declares that it is moving to a 'blind defense' of its islands and will not participate in offensive operations of the bloc. In addition, the Greeks demand the withdrawal of American nuclear weapons from their territory.\n\nThe Pentagon has mixed feelings. We preserved key bases and prevented a split in NATO, but our southern flank now rests on the Turks. Greece remains in the alliance only formally, turning into a passive observer."
 usa.67.a: "That's how it should be."
 usa.68.t: "The US is Pressuring Us"
 usa.68.desc: "The American ultimatum has cornered us, but Athens still has a trump card that the White House does not know about. Tonight the Soviet ambassador secretly delivered a message from the Kremlin. Moscow, observing our conflict with Washington, offers Greece not just neutrality, but full-scale accession to the Warsaw Pact. In exchange for leaving NATO and hosting Soviet military bases, the USSR promises us security guarantees from Turkey, the latest air defense systems, and preferential energy prices.\n\nThis proposal balances on the edge of madness and genius. By accepting it, we will forever break with the West, but we will get the most powerful army in the Mediterranean and protection from any encroachments by Ankara. Within the country, the army is hesitant: the generals fear popular protests, but nationalist officers see in this a chance to finally resolve the centuries-old dispute with the Turks with Moscow's hands.\n\nLeaving NATO and passing under the red banner is a point of no return. If we take this step, the Balkans and the entire Eastern Mediterranean will be on the threshold of a new world war. But are we ready to exchange American dictate for Soviet tutelage?"
 usa.68.a: "We will retreat."
 usa.68.b: "We are applying to the Warsaw Pact!"
 usa.69.t: "Greece's Application to the Warsaw Pact"
 usa.69.desc: "Athens today officially submitted an application to join the Warsaw Pact. The reason is obvious: Washington overplayed its hand. After the Greeks tried to withdraw troops from the border with Turkey, the US threatened them with a full economic blockade, refusal of protection from the Turkish army, and the loss of all bases. In response to this imperialist dictate, the Greek government broke off relations with NATO and requested protection from Moscow.\n\nWe are witnessing an open conflict between Greece and the US. The American Sixth Fleet is already heading to the Aegean Sea, and the US embassy in Athens is hastily burning documents. Washington states that it will not tolerate Soviet bases on Greek islands and demands that we not interfere.\n\nGrigory Romanov has already made it clear that we will not retreat. Greece is the key to the Mediterranean. If we accept them, we will strike a crushing blow to the southern flank of NATO. If we refuse, we will lose face and leave the Greeks to be torn apart by the Americans."
 usa.69.a: "We will accept them, even though they are capitalists."
 usa.69.b: "We don't need capitalists here!"
 usa.70.t: "Dissolution of NATO"
 usa.70.desc: "Our crushing defeat in the European theater of war and the forced signing of the Copenhagen Armistice put an end to the concept of transatlantic security. Conducting the previous policy of containment became physically impossible: the North Atlantic Alliance has lost its geopolitical meaning. The main allies on which the entire defense structure in Europe rested - the FRG and the Benelux countries - have effectively ceased to exist, and the Soviet military machine has already firmly entrenched itself in their former territories.\n\nWithin the United States itself, the situation is heated to the limit. A wave of mass anti-war protests and strikes swept across the country. Citizens, shaken by colossal losses and the economic crisis, furiously demand that Washington stop spending resources on a lost foreign war and immediately switch all attention to domestic policy and the protection of its own borders. We have no choice. NATO is useless. We are leaving Europe."
 usa.70.a: "The world as we knew it has collapsed..."
 usa.71.t: "Victory in Iraq"
 usa.71.desc: "Today, as dawn rises over Baghdad once again, we can proudly announce to the whole world: the tyrant has fallen. The evil and cruel dictatorship of Saddam Hussein, which for decades oppressed and ruthlessly exterminated its beautiful people, has finally been overthrown. We have seen the horrors of mass graves, we knew of the gas attacks against the Kurds and of how the dictator stifled the freedom of the Shiites, turning a once prosperous country into a giant prison.\n\nBut we came. American soldiers and our loyal coalition allies have wiped out this darkness. We brought to the great Iraqi land what they had tried to destroy for years — democracy, so necessary and at the same time so simple. We gave this ancient people the right to vote, hope for justice and freedom from fear.\n\nToday the Iraqi people can freely take to the streets, build their future and not fear repression. The American flag and the flag of the international coalition now symbolize here not occupation, but liberation. We have fulfilled our moral duty to humanity. But our work is not yet finished. Now we must help the Iraqis heal their wounds and build a new, peaceful state where human rights are not an empty phrase but an inviolable law."
 solutions_for_stabilizing_iraq_are_being_unlocked: "§RSolutions§! for the §Ystabilization§! of §RIraq§! are being unlocked!"
 usa.71.a: "We will maintain order there."
 usa.72.t: "Oil Pipeline Sabotage"
 usa.72.desc: "Bad news. The economy of the new Iraq is under attack again. Last night, a insurgent sabotage team planted explosives under the main export pipeline connecting the oil fields to the port of Basra. The fire has been raging for two days and cannot be put out. Oil supplies to the world market have been suspended, and this hits our allies' pockets. Rebuilding the infrastructure will take weeks, and the insurgents are already celebrating victory. If we do not protect the pipelines, Iraq's economy will collapse, and with it, our influence."
 usa.72.a: "Assign troops to guard them."
 usa.72.b: "We will ignore the problem."
 usa.73.t: "Explosions in Baghdad"
 usa.73.desc: "The capital has plunged into chaos. In the center of Baghdad, right next to the local police building, a suicide bomber detonated a car bomb. Dozens of people were killed, including civilians and new recruits of the Iraqi army. This attack is a direct attempt to derail the power transfer process. The insurgents are using terror tactics to intimidate Iraqis and turn them away from the coalition. The press is already calling it \"the second Vietnam.\" We need to decide how to respond to this challenge so as not to lose public trust in the United States itself."
 usa.73.a: "Impose a curfew."
 usa.73.b: "Accelerate the transfer of authority!"
 usa.74.t: "Raid on a Coalition Depot"
 usa.74.desc: "The Pentagon reports a daring attack on one of our major logistics centers. A group of insurgents disguised in new Iraqi army uniforms managed to bypass the guard posts and penetrate the depot grounds. They planted explosives on several fuel tankers and drove off trucks loaded with a significant quantity of small arms and ammunition. The fire at the depot raged all night; we lost fuel stocks intended for our armored units. Moreover, the weapons we were delivering for the Iraqi army are now being used to shoot at our own soldiers. This is an intelligence failure and a serious blow to our logistics."
 usa.74.a: "Introduce the strictest control at all depots!"
 usa.74.b: "Blame the local commanders."
 ddr.1.t: "XI Congress of the SED"
 ddr.1.desc: "In Berlin, in the huge hall of the Palace of the Republic, thousands of delegates from all over Germany gather. The XI Congress of the SED takes place under the sign of historic accomplishments. The party sums up the decade, noting unprecedented industrial growth and strengthening of the country’s defense capacity.\nThe central report, read by the General Secretary, states that the German Democratic Republic has finally embarked on the path of building a developed socialist society. The new party program emphasizes the need for further tightening of party ranks, struggle against bourgeois ideology, and strengthening the state’s role in the economy. The congress proceeds in a single impulse, without a single reservation."
 ddr.1.a: "Hooray!"
 ddr.2.t: "Honecker’s visit to Bonn"
 ddr.2.desc: "For the first time in history, the Chairman of the State Council of the GDR sets foot on West German soil on an official visit. Erich Honecker meets with the Federal Chancellor of the FRG surrounded by journalists and diplomats from around the world. Protocol is observed down to the smallest detail: military orchestra, raising of flags, smiles for the press."
 ddr.2.a: "Long live the FRG!"
 ddr.3.t: "Unification with dissenters"
 ddr.3.desc: "In the huge hall, where previously only approving ovations to the Politburo were heard, dissidents, intellectuals, and party functionaries now sit. The future of the nation is being discussed: multi-party system, market elements in the economy, and the fate of the Stasi. This is not capitulation, it is an attempt to save the state by giving it a breath of fresh air. For the first time in many years, Germans are talking to each other not through barbed wire, but face to face."
 ddr.3.a: "We will carry out broad reforms"
 ddr.3.b: "Harsh suppression - no concessions"
 ddr.4.t: "Election falsification"
 ddr.4.desc: "Local elections in GDR districts took place with “record turnout” and an overwhelming majority of votes for National Front candidates. However, the very next day rumors began to spread through the city - independent observers and Western media report mass ballot stuffing, falsification of protocols, and intimidation of voters. Within the SED itself a scandal flares up: several party members demand a recount, and trade unions threaten strikes."
 ddr.4.a: "The West is to blame for everything!"
 ddr.5.t: "Conspiracy"
 ddr.5.desc: "In the walls of the old SED Central Committee building, it smells of sulfur. In recent weeks, the General Secretary notices that his usual instructions are carried out with delay, and some members of the Politburo gather too often for “informal lunches” without his knowledge. Stasi agents report secret contacts between several high-ranking party members and representatives of the military command."
 ddr.5.a: "I see."
 ddr.6.t: "Modrow’s government"
 ddr.6.desc: "After Honecker’s resignation and Krenz’s short rule, the party found itself in the deepest crisis. The streets demand change, the economy is falling apart, and Moscow under Gorbachev refuses former support. Under these conditions, the Politburo nominates Hans Modrow for the post of prime minister - a man with a reputation as a pragmatist and supporter of dialogue."
 ddr.6.a: "Course toward unification with the FRG"
 ddr.7.t: "Free elections in the GDR"
 ddr.7.desc: "For the first time in forty years, residents of the German Democratic Republic go to the polls to make a truly free choice. Dozens of parties participate in the election race - from the post-communist PDS to liberals and greens. The main intrigue: will reformed socialists be able to retain power, or will the people vote for immediate unification with the FRG?"
 ddr.7.a: "The CDU alliance won"
 ddr.8.t: "Order 101: Do not shoot"
 ddr.8.desc: "The night of November 9-10, 1989. The Berlin Wall, the symbol of Germany’s division, becomes the epicenter of drama. At the Bornholmer Strasse checkpoint and other crossings, tens of thousands of people gather, demanding free exit. Border guards are confused - their instructions prescribe opening fire in case of an attempted breakthrough, but the Politburo has just transmitted an ambiguous “Order 101” through closed channels."
 ddr.8.a: "Completely cancel the shoot order."
 ddr.9.t: "Gerontocracy in the SED"
 ddr.9.desc: "Quiet discontent has been brewing within the SED for several years. The party leadership consists of people whose average age has passed seventy. They still remember the war, Stalinism, the construction of the Wall, but they completely fail to understand new trends - computerization, environmental movements, the demands of youth. At the last Politburo meeting, one of the ideology secretaries, already over eighty, fell asleep right during a report on perestroika."
 ddr.9.a: "We will preserve the status quo"
 ddr.9.b: "We will rejuvenate our party, forward with the SED!"
 ddr.10.t: "Resignation of Erich Honecker"
 ddr.10.desc: "The streets of East German cities have been humming for several weeks - tens of thousands of people demand change, freedom of speech, and the right to travel. Erich Honecker, the unchanging leader of the GDR for almost twenty years, looks broken. He is 77, ill, tired, and has lost his main ally - Mikhail Gorbachev, who openly stated that Moscow will not “defend those who are against perestroika.”"
 ddr.10.a: "Honorable resignation - transfer of power to Krenz"
 ddr.11.t: "Socialism on the brink of bankruptcy"
 ddr.11.desc: "The East German economy is falling apart. The country’s foreign debt has exceeded 20 billion West German marks, and interest payments devour almost the entire export potential. Factories operate at three-quarters capacity, many unprofitable enterprises are kept afloat only by state subsidies. Store shelves are empty: butter, meat, coffee, and citrus fruits have disappeared from free sale."
 ddr.11.a: "Centralized belt-tightening - planned autarky"
 ddr.12.t: "MiG-29 deliveries"
 ddr.12.desc: "The newest Soviet MiG-29 fighters - fourth-generation machines whose flight characteristics surpass most of NATO’s fleet - are beginning to arrive at military airfields in East Germany. The National People’s Army of the GDR receives more than twenty units of these formidable machines - “swallows” capable of patrolling airspace and participating in exercises on equal terms with any Western adversary."
 ddr.12.a: "Accept the full batch - we will strengthen our air force!"
 ddr.13.t: "Independent GDR"
 ddr.13.desc: "September 1990 will go down in history as the moment of the final collapse of the Eastern Bloc. Amid the rapid unification of Germany and the collapse of the communist regime, the leadership in East Berlin officially announced the withdrawal of the German Democratic Republic from the Warsaw Pact.\nThis step, agreed within the framework of the “Two Plus Four” arrangements, marks the actual liquidation of the East German army (NVA) and the end of four decades of Moscow’s military presence in the heart of Europe. Soviet troops are preparing for evacuation, and West German structures are already taking control of the borders. The banners of the Eastern Bloc are lowered - the banks of the Elbe no longer divide two irreconcilable systems."
 ddr.13.a: "For our independent Germany!"
 ddr.14.t: "The GDR withdrew from the Warsaw Pact"
 ddr.14.desc: "September 1990 will go down in history as the moment of the final collapse of the Eastern Bloc. Amid the rapid unification of Germany and the collapse of the communist regime, the leadership in East Berlin officially announced the withdrawal of the German Democratic Republic from the Warsaw Pact.\nThis step, agreed within the framework of the “Two Plus Four” arrangements, marks the actual liquidation of the East German army (NVA) and the end of four decades of Moscow’s military presence in the heart of Europe. Soviet troops are preparing for evacuation, and West German structures are already taking control of the borders. The banners of the Eastern Bloc are lowered - the banks of the Elbe no longer divide two irreconcilable systems."
 ddr.14.a: "Everything has collapsed..."
 ddr.15.t: "At the Plenum of the Central Committee"
 ddr.15.desc: "1985, East Berlin. Another plenum of the SED Central Committee takes place against the backdrop of growing debt to the West, falling production rates and mute discontent within the party. Erich Honecker reports on 'stability and successes,' but in the corridors the voices of those who believe the course is exhausted are growing louder. The conservatives led by Honecker and Mittag demand changing nothing: a hard line, control over society, no concessions. The reformists group around Egon Krenz — they speak of a 'change of generations,' limited economic experiments and dialogue with Moscow, without questioning the party's power.\n\nThe outcome depends on influence within the party. A conservative victory will preserve the old course, but deepen isolation and economic stagnation. A Krenz victory will give the GDR a chance for managed reform — with the risk of splitting the party and losing control of the street. In the end, the winners were..."
 ddr.15.a: "The Conservatives!"
 ddr.15.b: "The Reformists!"
 ddr.16.t: "The Question of Erich Honecker"
 ddr.16.desc: "East Berlin. The Central Committee plenum is over: the reformists led by Egon Krenz have prevailed, and Honecker is no longer General Secretary. But the old leader is alive, and something must be done with him. Some in the new leadership demand a trial and a show execution — for dogmatism, for ruining the economy, for bringing the country to a dead end. Others insist on a quiet retirement: let him retire, disappear from sight, and the party will avoid a bloody scandal that would split it for good. Honecker waits for the decision in his apartment in Wandlitz, under guard, but not yet in prison."
 ddr.16.a: "Let him retire — no one needs him."
 ddr.16.b: "Execute him! Nothing else is up for discussion!"
 ddr.17.t: "The GDR Asks Us for Money"
 ddr.17.desc: "The new leadership in East Berlin, trying to carry out 'perestroika in an East German way,' has inherited an empty treasury and mountains of debt from the old guard. Egon Krenz has approached us with a confidential request for a large loan. In exchange, he is ready for unprecedented steps: de facto recognition of open borders, the creation of joint ventures and a transition to a convertible mark.\n\nThis is a dangerous but unique chance. If we give them the money, we effectively buy their loyalty and tie East Germany to our economy, making an independent GDR unviable in the long term. On the other hand, if Krenz's reforms fail, we will simply throw billions of marks to the wind, and anarchy will begin on the streets of Leipzig and Dresden."
 ddr.17.a: "We will grant the loan. We are buying freedom for the people"
 ddr.17.b: "Refuse. Let the communists sort out their own economy"
 ddr.18.t: "Money from the Enemy"
 ddr.18.desc: "The long-awaited tranche from West Germany has finally arrived in the accounts of the State Bank of the GDR. Currency reserves are replenished, and the reformist wing led by Egon Krenz has a real chance to prevent economic collapse.\n\nHowever, the joy in the corridors of the SED Central Committee is mixed with fury. The old guard, including Honecker's supporters and the economic dogmatist Günter Mittag, openly calls this deal a 'disgrace' and a 'sale of sovereignty.' The Stasi is already reporting a rise in anti-communist sentiment among young people, who hope for imminent Western abundance."
 ddr.18.a: "That doesn't worry us. The main thing is they gave us the money."
 ddr.19.t: "The West's Refusal"
 ddr.19.desc: "The federal government in Bonn has officially refused us the loan. The reasons given are 'lack of political guarantees' and 'budgetary constraints.' For our economy, this means one thing — the currency treasury is empty, and purchases of critically important raw materials and technologies in the West are cancelled.\n\nIn the corridors of the SED Central Committee there is an ominous silence, broken only by the whispers of conservatives. Günter Mittag and the old guard are triumphant: 'We told you the capitalists would never extend a hand to us!' The authority of Egon Krenz and his course toward 'perestroika' is undermined. The Stasi reports a sharp rise in tension in queues and at enterprises. The people waited for the promised abundance, but got empty shelves."
 ddr.19.a: "Let's shift the blame onto the West, it's all their fault!"
 ddr.20.t: "A New Constitution"
 ddr.20.desc: "Today is a historic day. After weeks of tense debates at the 'Round Table' and within the reformist faction, the new Constitution of the German Democratic Republic has been officially ratified.\n\nArticle 1, which enshrined the leading role of the SED, has been struck out forever. In its place is written: 'The GDR is a sovereign socialist state based on the principles of democracy, the rule of law and social justice.' Citizens are guaranteed freedom of speech, assembly and the creation of independent political parties."
 ddr.20.a: "So be it."
 ddr.21.t: "Treaty on the Basis of Relations"
 ddr.21.desc: "A draft 'Treaty on the Basis of Relations,' prepared by the new GDR leadership, has been delivered to the Federal Chancellery. This is not just another paper on the status of borders. Egon Krenz and his team of reformers propose something more: the creation of a 'community of responsibility' with a single economic space, recognition of dual citizenship and renunciation of the use of force.\n\nEast Berlin clearly hopes that this treaty will become a lifeline for their sinking economy and strengthen their legitimacy on the world stage. However, a split is brewing within our coalition. Intelligence warns: by signing this document, we de facto recognize the legitimacy of the socialist state and give Krenz a political breathing space. On the other hand, supporters of the 'new eastern policy' insist that this is our chance to peacefully draw East Germany into the Western orbit and avoid bloody chaos on the borders."
 ddr.21.a: "Sign the treaty. We build bridges, not walls"
 ddr.21.b: "No treaty without free elections."
 ddr.22.t: "Bonn Has Signed"
 ddr.22.desc: "It has happened. The federal government in Bonn has officially ratified the 'Treaty on the Basis of Relations.'\n\nFor us this is not just an economic breather — it is a political triumph. Egon Krenz has proven that 'perestroika in an East German way' works. On the streets of East Berlin and Leipzig people discuss the news with cautious optimism, and in the queues for the first time in a long while one hears talk of the future, not the past."
 ddr.22.a: "Hooray!"
 ddr.23.t: "Turned Away at the Door"
 ddr.23.desc: "The GDR delegation has returned from Bonn empty-handed. The federal government refused to sign the 'Treaty on the Basis of Relations,' putting forward humiliating ultimatums and citing 'non-compliance with democratic standards.'\n\nThis news instantly spread through East Berlin. Egon Krenz and his team of reformers have suffered a crushing defeat. We promised the people change, loans and an improvement in life, but the West has slammed the door in our face."
 ddr.23.a: "We'll tighten our belts."
 ddr.24.t: "A Plan from East Berlin"
 ddr.24.desc: "An unprecedented proposal from the GDR government has arrived in Bonn through diplomatic channels. The reformers from East Berlin propose starting the process of creating a German Confederation.\n\nIn their vision, this is not simply the absorption of the East by the West, but the creation of a union of two equal states with a common economic space, a single currency and a joint parliament. Krenz hopes to preserve the social gains of the GDR, its cultural identity and, possibly, even remnants of autonomy within the new union. In exchange, they promise full democratization and abandonment of socialist isolation."
 ddr.24.a: "Accept the proposal. We will build a confederation!"
 ddr.24.b: "Reject it. Only full unification."
 ddr.25.t: "Tanks on Unter den Linden"
 ddr.25.desc: "While Krenz celebrates victory over the dogmatists, the old guard strikes. Defense Minister Heinz Kessler and Stasi chief Erich Mielke declare Krenz's government 'treacherous' and take control of the NVA barracks and the MGB building. Units loyal to Krenz are blocked."
 ddr.25.a: "Resist the illegal coup!"
 ddr.25.b: "Surrender to the junta, reforms in the GDR are impossible."
 ddr.26.t: "The GDR Demands West Berlin"
 ddr.26.desc: "The morning in Bonn began with emergency reports. East German radio, now controlled by Kessler's junta, broadcast an ultimatum: the German Socialist Republic demands the full transfer of West Berlin under its control. The statement says the enclave is an 'unhealing wound on the body of the German nation' and must be integrated into the GDR. Simultaneously, intelligence reports the movement of tank columns of the National People's Army toward the city's borders.\n\nWest Berlin is again under blockade. Although the third air corridor is still open, ground routes are blocked. In the city itself there is panic: people are buying up food, and American and British garrisons are on full combat alert. Our government is trapped. To yield means to bury the dream of unification and lose face before the allies, who are already declaring their readiness to defend the city.\n\nThe GDR is not bluffing. The GDR army is fully mobilized, and the rhetoric leaves no doubt: they are ready to fight. Washington requests emergency communication, Paris and London hesitate, and before you stands the hardest choice in post-war German history — accept the demands of the East or stand to the end, risking unleashing a Third World War."
 ddr.26.a: "We are not ready. We will give up Berlin."
 ddr.26.b: "Never!"
 ddr.27.t: "Press Conference on Schönhauser Allee"
 ddr.27.desc: "This afternoon a press conference was held in East Berlin on the new travel law. Millions of citizens awaited clarification. However, when a journalist asked Politburo member Günter Schabowski when the law would come into force, he, leafing through papers, answered uncertainly: 'As far as I know, this is happening... immediately, without delay.'\n\nSilence fell in the hall, and then reporters rushed to their phones. Within an hour, thousands of people began to stream toward the checkpoints. The border guards on Schönhauser Allee are confused: there is no order to shoot, but they are not ready to open the barriers either. The crowd grows with every minute, people demand to be let through to the West."
 ddr.27.a: "Open the barriers!"
 wgr.1.t: "The FRG's Course"
 wgr.1.desc: "1985 became for the FRG a year of pivotal party decisions, unexpected triumphs and painful defeats. On the stage are three main political forces, each experiencing its own drama."
 wgr.1.a: "CDU - our choice!"
 wgr.1.b: "SPD - for an independent Germany!"
 wgr.1.c: "FDP - for freedom!"
 wgr.2.t: "Determining the Economic Course"
 wgr.2.desc: "1985 became for the FRG a year of hard choice over economic strategy. The Kohl government and the Bundesbank found themselves in a dilemma: continue the policy of fiscal restraint that had brought a record trade surplus and low inflation, or succumb to pressure from allies and launch large-scale stimuli for domestic demand?"
 wgr.2.a: "Let's give migrants at least something."
 wgr.2.b: "Germany above all!"
 wgr.3.t: "The Era of Tension"
 wgr.3.desc: "In 1985, West Germany was not just a European country, but the main battlefield between the blocs. Here, on the fault line, every gesture carried weight.\n\nGorbachev's arrival in the Kremlin in March promised change, but did not relieve the old tension. Moscow still considered Bonn aggressive. And in the summer a diplomatic scandal erupted — German youth delegations left a festival in Moscow because of humiliating treatment of West Berlin.\n\nThe real shock came on August 19: the head of the FRG's counterintelligence defected to the GDR. It was not just a betrayal, but a blow to the entire security system of the West. And against this background — the daily game with East Berlin: spy exchanges, passage of refugees, political manipulation.\n\nThe FRG of 1985 lived under the bell jar of the Cold War. Allies pressed, the East threatened, and the country learned to survive in this tension — and to find its own path."
 wgr.3.a: "We are obliged to endure."
 wgr.4.t: "Germany - European Leader"
 wgr.4.desc: "The figures of 1985 spoke for themselves. The FRG possessed the world's largest currency reserves — $44 billion** at the end of 1984. The country demonstrated a healthy positive trade balance of **$30 billion. Projected GDP growth of 3% was the best indicator since 1979 and one of the highest in Western Europe. The export-oriented economy of the FRG was more closely integrated with Western Europe than with any other part of the world."
 wgr.4.a: "We are strong!"
 add_europeanism_5_percent: "Will add §R5%§! of §Yeuropeanism§!"
 wgr.5.t: "The End of the Cold War"
 wgr.5.desc: ""
 wgr.5.a: "Finally it's over"
 wgr.6.t: "Germany Facing Change"
 wgr.6.desc: ""
 wgr.6.a: "Change!"
 wgr.7.t: "The Eastern Bloc Is Tottering"
 wgr.7.desc: ""
 wgr.7.a: ""
 wgr.8.t: "The FRG Supports the Protests in the GDR"
 wgr.8.desc: "West German television channels broadcast live from Leipzig and Berlin, the 'New Forums' and church groups receive moral and organizational support from the FRG, and thousands of GDR citizens demanding to leave are gathering in West German embassies in Prague and Budapest. Bonn officially declares the Germans' right to self-determination and promises citizenship to all who leave the republic."
 wgr.8.a: "Hard..."
 wgr.9.t: "Demonstrations in Leipzig"
 wgr.9.desc: "Leipzig. After the evening service at St. Nicholas Church, tens of thousands of people take to the streets. Columns move toward the city center with slogans 'We are the people' and 'Freedom.' The demonstration is unsanctioned, but it grows before one's eyes: workers, students, ordinary citizens join it. Police forces and units of the National People's Army are concentrated in the city, ready to disperse it. In Berlin, Erich Honecker demands a harsh response, but local leaders hesitate: an order to shoot could turn into bloodshed that the country will not forget.\n\nBy evening it becomes clear: the security forces do not intervene. The column passes through the center of Leipzig and disperses. For the first time in forty years, the authorities retreated before the crowd. This day changes everything: if the regime did not use force now, can it use it later? And what will remain of the GDR if the street feels it has nothing left to fear?"
 wgr.9.a: "It will be hard..."
 wgr.10.t: "Germany Proposes Economic Cooperation"
 wgr.10.desc: ""
 wgr.10.a: "We agree."
 wgr.10.b: "No"
 wgr.11.t: "[From.GetNameDefCap] Refuses Cooperation"
 wgr.11.desc: ""
 wgr.11.a: "So much the worse for them."
 wgr.12.t: "[From.GetNameDefCap] Agrees to Cooperation"
 wgr.12.desc: ""
 wgr.12.a: "Excellent!"
 wgr.13.t: "Treaty signed"
 wgr.13.desc: "We have signed a historic treaty with the victors of World War II. Now we need time for ratification and the withdrawal of Soviet troops."
 wgr.13.a: "Awaiting unification."
 wgr.14.t: "2+4 Negotiations"
 wgr.14.desc: "The 'two plus four' formula has been launched: the foreign ministers of the FRG and the GDR sit down at the table with the four victorious powers — the USSR, the USA, Great Britain and France. The question is one: what will be the foreign policy status of a united Germany. Positions diverge. Washington insists on full membership of a united Germany in NATO. Moscow demands neutrality or at least no spread of NATO infrastructure to the former GDR. London and Paris fear excessive strengthening of the Germans and want guarantees. Bonn is rushing events. There are several months left until the signing of the treaty in Moscow in September.\n\nOn the table are two paths. Agree to further negotiations and seek a compromise on the status of Germany, borders and military presence. Or refuse to participate, declaring that our interests are not being taken into account, and leave the process without us."
 wgr.14.a: "We agree to negotiations."
 wgr.14.b: "The unification of Germany is not up for discussion."
 wgr.15.t: "Dialogue with the East"
 wgr.15.desc: ""
 wgr.15.a: ""
 wgr.16.t: "A United Germany"
 wgr.16.desc: "Midnight. Berlin. A black-red-gold flag is raised over the Reichstag. The GDR ceases to exist, five eastern states join the FRG under Article 23 of the Basic Law. The countries signed the '2+4' treaty and renounced the rights of the victors. For the first time since 1945, Germany is again a single sovereign state.\n\nBut the celebration is mixed with anxiety. The eastern economy is collapsing, factories are closing, millions are losing their jobs. The Treuhand takes control of thousands of enterprises. Soviet troops have not yet left — their withdrawal will stretch until 1994. Berlin is again the capital, but the government will move there only in a few years. One question hangs in the air: will unity withstand the first blow of reality?"
 wgr.16.a: "Hooray!"
 wgr.16.b: "We are united again!"
 wgr.17.t: "First Round of Negotiations"
 wgr.17.desc: "In the hall of the Auswärtiges Amt, the first round of negotiations on the 'two plus four' formula opened — the foreign ministers of the FRG and the GDR sat down at one table with representatives of the four victorious powers: the USA, the USSR, Great Britain and France. The meeting began in an atmosphere that participants described as 'historic' and 'imbued with mutual trust': all six sides formally recognized the Germans' right to unification and agreed on the agenda for further negotiations.\n\nHowever, behind the facade of agreement, deep disagreements immediately emerged. The head of the Soviet delegation, Eduard Shevardnadze, unexpectedly proposed to 'separate' the internal aspects of unification from its external conditions, and, most importantly, stated that membership of a united Germany in NATO was 'unacceptable' for Moscow. The Western allies, on the contrary, insisted on keeping Germany in the alliance, although they did not put this forward as an ultimatum at the first stage. France and Great Britain took a more cautious position, fearing excessive strengthening of their neighbor, but did not block the process.\n\nAs a result, the first round did not resolve any of the key questions — on NATO, on the status of Berlin, on borders and on the timing of troop withdrawal. The sides only approved the regulations and outlined the following meetings: in June in Berlin, in July in Paris and in September in Moscow. Separately, it was decided to invite Poland to the Paris round, where the Oder-Neisse line was to be finally fixed. The negotiations continued, but it became clear that a compromise on the main issue — the military-political status of a united Germany — would be achieved not at the first session, but in the course of long bargaining."
 wgr.17.a: "Excellent."
 wgr.18.t: "[FROM.GetNameDef] Refused Negotiations"
 wgr.18.desc: "The delegation of [FROM.GetNameDef] leaves the negotiations. They declare that the 'two plus four' formula no longer takes their interests into account, and refuse to sign documents that cement the unification of Germany on someone else's terms. A pause hangs in the hall. We tried to bring them back to the negotiations, but they are already gathering their papers. The process will continue without them.\n\nWithin the country, the refusal is met differently. The hard line receives support among the security forces and conservatives, but economic departments and diplomats understand: isolation will cost more than compromise. The '2+4' negotiations continue without us, and now we will have to either return with lost positions, or live with a result we did not influence."
 wgr.18.a: "Sad."
 wgr.19.t: "Second Round of Negotiations"
 wgr.19.desc: "The second round of 'two plus four' negotiations takes place in East Berlin, at Schönhausen Palace. The date was chosen not by chance: it is the 49th anniversary of Germany's attack on the Soviet Union, and the symbolism of the day is felt by everyone. Before the session begins, six ministers participate in the dismantling of Checkpoint Charlie, where American and Soviet tanks once stood facing each other in 1961. The confrontation is over, but the negotiations promise to be tough.\n\nShevardnadze presents a surprise: at the beginning of the conference he presents a document, 'Basic Principles for the Final Settlement with Respect to Germany.' According to it, a united Germany would receive full external sovereignty only several years after internal unity, and the existing military blocs would be preserved during this transition period. Genscher calls this a 'cold shower.' Baker objects sharply: 'Restricting Germany's sovereignty is not up for discussion!' The Western allies unanimously reject the Soviet plan.\n\nDespite the failure of the Soviet initiative, the ministers adopt the expert document 'Principles of Borders' and a framework plan for the elements of the final settlement. The four powers welcome the resolutions of both German parliaments on the Polish western border, and Dumas calls on Bonn and East Berlin to immediately begin negotiations with Warsaw on a treaty. Shevardnadze, finding himself on the defensive, admits that his proposal was only a 'starting point' and calls on NATO at the London summit to make a step toward Moscow."
 wgr.19.a: "Excellent."
 wgr.20.t: "Third Round"
 wgr.20.desc: "Paris. The third round of 'two plus four' negotiations opens in a completely different atmosphere than the previous ones. A week before the meeting, on July 15-16, Helmut Kohl and Eduard Shevardnadze met with Gorbachev in Arkhyz, and the Soviet side gave fundamental consent that a united Germany would decide the question of its alliance status itself. In London two weeks earlier, NATO adopted a declaration intended to make the alliance more acceptable to Moscow. The ice had broken, and the ministers arrive in Paris no longer to argue about principles, but to formalize a compromise.\n\nThe main item on the agenda is the border. For the first time, the Foreign Minister of Poland, Krzysztof Skubiszewski, is invited to the negotiating table. The question of the Oder-Neisse line remained the last serious obstacle: Warsaw demanded firm guarantees that a united Germany would not dispute the western borders. By the end of the session, agreement was reached: the future Germany would consist of the FRG, the GDR and Berlin, and immediately after gaining sovereignty, Warsaw and Berlin would sign a separate treaty confirming the border. Instead of a peace treaty, it was decided to prepare a single international legal document that would close all remaining questions.\n\nThe key political result of the round: the question of NATO no longer blocks the process. The Soviet delegation, which in June had demanded a transition period and neutrality, now agrees that a united Germany will remain in the alliance. This removes the main contradiction that could have derailed the negotiations. Two months remain until the final meeting in Moscow in September, and it is now clear that the path to signing the treaty is open."
 wgr.20.a: "Excellent."
 wgr.21.t: "Fourth Round"
 wgr.21.desc: "Moscow. The fourth and final round of 'two plus four' negotiations opens at the President Hotel. At the table are the foreign ministers of the FRG, the GDR, the USSR, the USA, Great Britain and France. This time the atmosphere leaves no doubt: everything is decided. The sides have gathered not to argue, but to sign. By the morning of September 12, one question remains — the interpretation of Article 5 of the future treaty concerning the military status of the territory of the former GDR. The ministers hold a closed session and agree on a compromise wording: there will be no foreign troops or nuclear weapons in eastern Germany, and Soviet units will leave the country by 1994. The financial side of the question was closed the day before in a telephone conversation between Gorbachev and Kohl: Bonn pays Moscow 12 billion marks for the withdrawal of troops and the settlement of returning soldiers. The size of the united army is limited to 370 thousand people. By noon the document is ready. The ministers gather in the hall and in a solemn atmosphere sign the 'Treaty on the Final Settlement with Respect to Germany.' From this moment the four victorious powers renounce their rights with respect to Germany and Berlin, and the united country receives full sovereignty. Shevardnadze calls what happened 'the completion of a long path,' Baker speaks of a 'new era,' and Genscher thanks all participants for their trust. The '2+4' negotiations are complete. Three weeks remain until the official unification of Germany."
 wgr.21.a: "Excellent."
 wgr.22.t: "Fifth Round of '2+4' Negotiations"
 wgr.22.desc: "The treaty on the final settlement was signed in Moscow, but its ratification is stuck. The Supreme Soviet of the USSR refuses to vote for the document until the details of the troop withdrawal and guarantees for Soviet servicemen returning from Germany are clarified. In Bonn, irritation is growing: unification already took place on October 3, but the legal basis is still not closed. Washington and London pressure Moscow, demanding not to derail the process. Paris proposes to gather once more — not for negotiations, but to resolve the last crisis.\n\nIn mid-October, the foreign ministers of six countries again sit down at the table, this time in Geneva. On the agenda are three questions: the schedule for the withdrawal of Soviet troops (Moscow demands an extension to 1995), financing the construction of housing for officers (Bonn agrees, but bargains over the amount) and the status of Soviet military facilities on the territory of the former GDR after 1994. None of these questions changes the essence of the treaty, but without their resolution ratification is impossible.\n\nBy the evening of the second day, a compromise is found: the withdrawal is extended to August 1994, Bonn allocates an additional 1.5 billion marks for housing, and Soviet facilities are closed or transferred to the German side. The treaty is ready for ratification. The fifth round ends without ceremony, but with clarity: the process is complete."
 wgr.22.a: "Excellent!"
 wgr.23.t: "Victory for the CDU!"
 wgr.23.desc: "Voters have again entrusted the ruling CDU/CSU and FDP coalition with forming the government. Despite sharp criticism from the opposition and the growing influence of the Greens, our bloc retained a confident majority in the Bundestag. Johannes Rau, our main rival from the SPD, conceded defeat, although his party managed to hold its positions.\n\nHowever, within our own coalition the results caused mixed feelings. We lost some votes compared to 1983, and many of our deputies are concerned about the growing demand for social reforms and environmental policy. Helmut Kohl, our chancellor, called the results a 'clear mandate' to continue the course, but warned that the coming years will require greater flexibility."
 wgr.23.a: "Long live the CDU!"
 wgr.24.t: "Victory for the SPD!"
 wgr.24.desc: "The 1987 federal elections brought a long-awaited victory for the Social Democratic Party of Germany.\n\nJohannes Rau, our candidate and Minister-President of North Rhine-Westphalia, managed to convince the German electorate of the need for change. Tired of the long rule of the conservative coalition, voters believed in our program of social justice, ecological modernization and peaceful foreign policy.\n\nWe achieved a convincing majority, leaving behind the CDU/CSU and their partners. The Greens, although they strengthened their positions, remained a junior partner in the opposition. Now broad opportunities are opening before us to carry out the reforms that were postponed for so long.\n\nHowever, victory does not mean an easy life. The economy needs stimulation, unemployment remains high, and the tension between East and West requires a balanced position from us. In addition, the American allies look warily at our coming to power — Washington fears that we will move too far from NATO's course."
 wgr.24.a: "Long live the SPD!"
 wgr.25.t: "Start of the 1987 Election Campaign"
 wgr.25.desc: "West Germany enters the election campaign — the Bundestag elections are scheduled for January 25, 1987. The Christian-liberal coalition led by Helmut Kohl (CDU/CSU and FDP) goes to the elections with a baggage of economic successes: the majority of voters rate the economic situation as good. However, unemployment remains the main and painful topic: 70% of respondents consider the situation on the labor market bad. For the Social Democrats this is a window of opportunity — their candidate, Minister-President of North Rhine-Westphalia Johannes Rau, is known as an emotional and popular politician capable of speaking about social justice.\n\nSeveral mines are hidden within the campaign itself. Kohl is personally vulnerable: his rating as a candidate for chancellor is low even among his own supporters, and within the party they fear that he will lose to Rau in the sympathies of voters. In addition, after Chernobyl there has been a clear shift in society toward abandoning nuclear energy, and the majority of voters now support a phased exit from nuclear power. The opposition also points to disarmament and environmental protection as its strengths. The Free Democrats, in turn, bet on the authority of their leader, Foreign Minister Hans-Dietrich Genscher, around whom internal disputes with the CSU are raging over the course toward the USSR and South Africa.\n\nPolls so far predict victory for the ruling coalition, but with a much smaller margin than in 1983. The Greens party after Chernobyl and environmental protests may strengthen and complicate the formation of a government. The SPD, in turn, is torn between internal factions and competition with the Greens for the left electorate. The campaign promises to be not so much a dispute about the future as a test of the strength of the current chancellor and his coalition."
 wgr.25.a: "Well then, let's begin."
 election_campaign_in_germany_1987: "1987 Election Campaign"
 wgr.26.t: "Formation of a New Government"
 wgr.26.desc: "The Bundestag re-elects Helmut Kohl as chancellor — 253 votes against 225. A day later, on March 12, Kohl's third cabinet is sworn in. The CDU/CSU and FDP coalition retained power, but the victory came out pale: 44.3% for the union — the worst result since 1949, and only 9.1% for the Free Democrats pulled the majority through.\n\nKohl forms the government in a narrow circle. Franz Josef Strauss, the Bavarian premier and chief critic of Genscher, refuses to enter the cabinet — his influence is falling. But the FDP, which won back votes from the CDU, receives a fourth ministry: Jürgen Möllemann takes the chair of Minister of Education. Dorothea Wilms, the former Minister of Education, moves to the sensitive post of Minister for Intra-German Relations. Genscher remains vice-chancellor and foreign minister — his course toward detente with Moscow does not change.\n\nKohl comes out to the press with a tired smile. He says the mandate has been received, but within the party they whisper: the result is weaker than expected, and Strauss, who is blamed for the losses, retreats into the shadows. Ahead lie four years, Chernobyl, the Gulf crisis and the question of whether this majority will be enough to hold the course."
 wgr.26.a: "That's how it should be."
 wgr.27.t: "Versöhnen statt spalten"
 wgr.27.desc: "The election campaign for the Bundestag is gaining momentum, and the positions of our government led by Helmut Kohl are being seriously tested. The Social Democrats (SPD) under the leadership of Johannes Rau have launched a powerful campaign under the slogan 'Versöhnen statt spalten' ('Reconcile instead of divide'). Against the backdrop of environmental protests and economic reforms, this call for national accord finds a strong response among voters tired of polarization.\n\nThis 'reconciliation' strategy strikes directly at our centrist electorate. The SPD successfully portrays CDU policy as excessively harsh and divisive. Polls show an alarming rise in the popularity of the center-left. If we do not take countermeasures, the balance of power in Bonn may swing not in our favor."
 wgr.27.a: "Damn it!"
 wgr.28.t: "The SPD Attracts the Working Class"
 wgr.28.desc: "Johannes Rau's election campaign deals a heavy blow to the positions of our government in the very heart of German industry. Industrial decline, the closure of unprofitable mines and the restructuring of steel giants have generated among German workers a deep fear of unemployment and uncertainty. The Social Democrats skillfully present the reforms of Helmut Kohl's cabinet as a soulless, nation-dividing capitalism, contrasting it with the idea of solidarity and social protection.\n\nPowerful trade unions, historically close to the left, have launched unprecedented mobilization in the Ruhr Basin, the Saarland and the port cities of the North. Workers who were unsure in previous elections now stand as a monolithic wall behind the SPD. For the CDU this is a critical threat: without the votes of the moderate working class it will be impossible to retain a right-wing majority in the Bundestag. We urgently need to decide how to respond to the fact that the industrial heart of Germany is rapidly turning red."
 wgr.28.a: "We need to do something!"
 wgr.29.t: "Formation of the Franco-German Brigade"
 wgr.29.desc: "Today in Böblingen, the defense ministers of the FRG and France put their signatures to a historic agreement. A joint Franco-German Brigade has been created — for the first time since the Second World War, our soldiers will serve in the same barracks and under a single command.\n\nHowever, a split is brewing within the cabinet itself. Some ministers speak of a unified EU army, others clutch their heads, foreseeing a collapse in relations with Washington. Added to this are hysterical newspaper articles about a 'Fourth Reich' and yet another note of protest from the Soviet embassy."
 wgr.29.a: "We don't care about others' opinions."
 wgr.30.t: "Aid from the FRG"
 wgr.30.desc: "Comrade General Secretary, the FRG ambassador has just delivered an official proposal from Chancellor Kohl. Bonn is ready to allocate us an emergency loan of billions of West German marks. The republic's economy is bursting at the seams, factories are stopping, and empty store shelves no longer save us from the anger of the workers. This financial injection is the only chance to postpone collapse and keep the situation under control in the coming months.\n\nBut there is no such thing as a free lunch. The West Germans do not hide their conditions: in exchange for the loan, they demand real steps toward liberalization from us. No more bows toward Moscow, free travel for all who wish it, and access for West German concerns to our enterprises. In essence, they are offering to buy our own survival at the price of economic sovereignty.\n\nDebates have already begun in the Politburo. To accept the money means admitting that we cannot survive without the capitalists and finally subordinating East Berlin to Bonn. To refuse means risking plunging the country into chaos by spring."
 wgr.30.a: "We will accept Bonn's loan."
 wgr.30.b: "We will probably refuse the money."
 wgr.31.t: "East Berlin Agreed"
 wgr.31.desc: "The embassy in East Berlin reports success. The Politburo has accepted our terms. A loan of billions of marks will be allocated, and in return Krenz's regime promises to lift restrictions on travel and to allow our concerns access to East German industry. This is a clean victory for the Western economy: the mark has proven stronger than their ideology.\n\nHowever, it is too early to rejoice. We have just poured huge amounts of money into their dying system. Now we will have to carefully monitor that these funds do not go toward strengthening the Stasi or paying Soviet advisers. In addition, discontent is growing in Bonn itself: the opposition demands guarantees that the money will reach ordinary workers and not settle in the pockets of the party elite."
 wgr.31.a: "We will keep up the pressure."
 wgr.32.t: "Refusal of the Loan"
 wgr.32.desc: "The negotiations have failed. East Berlin, in the person of Egon Krenz, has refused our loan. In an official statement they called our conditions 'economic dictate' and 'an attempt at absorption.' It seems the Politburo has become afraid of Moscow's anger or has decided it can handle the crisis on its own.\n\nThis is a spit in the face of our economy, but at the same time an alarming signal. If they are not taking the money, it means the situation inside the GDR has either stabilized or they are preparing to tighten the screws to the limit. One thing is obvious: the worse their economy becomes, the more people will flee across the border. We need to prepare for a new wave of refugees."
 wgr.32.a: "Let them rot."
 wgr.33.t: "The Berlin Wall Has Fallen"
 wgr.33.desc: "Mr. Chancellor, turn on the television. What we are seeing seems like a dream. Hundreds of thousands of people are right now crossing the border into West Berlin. They are climbing onto the Wall, embracing our citizens, drinking champagne and demolishing concrete blocks with sledgehammers. The GDR border guards have simply stepped aside.\n\nIn Bonn there is chaos of jubilant officials, and the Soviet embassy is silent, although Gorbachev, apparently, is not going to intervene. The whole world is glued to the screens. A historic window of opportunity is opening before us."
 wgr.33.a: "Wind of change!"
 wgr.34.t: "Helmut Kohl's Speech in the Bundestag"
 wgr.34.desc: "The Bundestag chamber is packed to capacity. You have just stepped onto the rostrum without prior coordination of your speech with Washington, London and Paris. Tension hangs in the air. You announce to the deputies and the whole country the 'Ten-Point Plan' — a phased path to overcoming the division of Germany and creating a confederation.\n\nThe reaction of the hall is mixed. Your coalition applauds standing, appreciating the courage to seize the initiative from East Berlin. The opposition demands to explain who will pay for this project and whether it will undermine security in Europe. But the main thing now is not them. In the corridors they are already whispering that Thatcher is furious that we did not consult with the allies, and Mitterrand fears the revival of a too-strong Germany.\n\nYour speech has just launched an irreversible process. Now we need to keep this political flywheel spinning without quarreling with the West and without provoking Moscow."
 wgr.34.a: "Push straight ahead!"
 wgr.35.t: "German Revolt"
 wgr.35.desc: "The Rau government has thrown out our missiles and is openly flirting with the Kremlin. If we allow Bonn to slip from our control, a chain reaction will begin across Europe. The Pentagon proposes an ultimatum, the State Department - economic sanctions."
 wgr.35.a: "Send an ultimatum to the FRG."
 wgr.35.b: "Impose sanctions!"
 wgr.36.t: "Ultimatum from Washington"
 wgr.36.desc: "The American ambassador delivered a note: either we return the missiles and remain within NATO, or the US withdraws its troops and expels us from the alliance. Panic inside the country: without the American nuclear umbrella we are defenseless before the Warsaw Pact."
 wgr.36.a: "We submit."
 wgr.36.b: "We go all the way!"
 wgr.37.t: "Sanctions from the USA"
 wgr.37.desc: "Washington's response to our refusal to deploy the Pershings and our rapprochement with Moscow was not long in coming. The White House announced the introduction of a package of economic sanctions. For our export-oriented economy, this is like a punch to the gut.\n\nSupplies of high-tech equipment and components for aircraft manufacturing fall under the ban. In addition, the Pentagon has frozen several joint defense projects, and American banks have begun revising the credit terms for our concerns. Panic in the corridors of Bonn: industrialists demand immediate concessions to the US, while trade unions fear mass layoffs. Washington makes it clear that this is only the first step if we continue to play the 'third way'.\n\nNow we need to decide how to react to this economic blow without losing either face or the remnants of social stability."
 wgr.37.a: "We submit, we are too weak."
 wgr.37.b: "We will use the sanctions to our advantage!"
 wgr.38.t: "Revolt in Bonn"
 wgr.38.desc: "Bonn has rejected our ultimatum. The SPD government led by Rau has officially refused to return the Pershings and continues its course toward rapprochement with Moscow. This is not just a diplomatic prank, but a direct undermining of NATO's architecture. Germany is our key bridgehead in Europe, and if we lose them, the entire system of containing the USSR will collapse.\n\nFury reigns in the Pentagon. The generals demand the immediate withdrawal of our tactical nuclear weapons from their bases and the transfer of part of the troops to the UK. The State Department warns: if we simply leave, the French and British will panic, and Moscow will consider it their victory. On the other hand, if we leave everything as it is, it will look like our defeat and tacit consent to Germany's neutrality.\n\nRepublicans in Congress are already demanding tough economic sanctions against German concerns. We need to decide how to punish the recalcitrant ally without losing control over Europe."
 wgr.38.a: "Expel from NATO!"
 wgr.38.b: "Withdraw troops and nuclear weapons."
 wgr.39.t: "The Mark Dispute"
 wgr.39.desc: "Lafontaine and the Bundesbank are horrified by Kohl's plan to exchange the eastern marks at 1:1. This will ruin our banks and destroy eastern industry. We propose a rate of 2:1 for wages and 3:1 for debts, in order to preserve their factories and prevent mass unemployment."
 wgr.39.a: "We follow our own course."
 wgr.39.b: "Exchange according to Kohl's plan."
 news.1.t: "Reykjavik Summit"
 news.1.d: "The second personal meeting of General Secretary of the CPSU Central Committee Mikhail Gorbachev and US President Ronald Reagan took place on October 11-12, 1986, in Reykjavik, halfway between Moscow and Washington. Although the meeting ended without signing any documents, it is considered an important milestone in the Soviet-American negotiation process on strategic offensive arms and the first step toward ending the Cold War era."
 news.1.a: "A big breakthrough!"
 news.2.t: "Death of Konstantin Chernenko"
 news.2.desc: "On March 10, 1985, at 19:20, General Secretary of the CPSU Central Committee Konstantin Ustinovich Chernenko died. He was 73 years old. The official medical conclusion named cardiac arrest against the background of emphysema, heart failure, and cirrhosis of the liver as the cause of death. He was in power for only 13 months - the shortest rule since Stalin."
 news.2.a: "What is going on..."
 news.3.t: "Iraq invades Kuwait!"
 news.3.desc: "On August 2, 1990, at 2:00 a.m., Iraqi troops crossed the border of Kuwait, beginning a full-scale invasion. Three Republican Guard divisions, supported by tanks and helicopters, quickly suppressed resistance by the Kuwaiti army. Emir of Kuwait Jaber al-Sabah fled to Saudi Arabia, and his brother Fahd was killed while defending the palace. By the end of the day, Iraqi troops had fully occupied Kuwait, establishing control over oil fields and government buildings."
 news.3.a: "Vultures tearing at a corpse..."
 news.4.t: "Chernobyl Nuclear Power Plant accident"
 news.4.desc: "On April 26, 1986, at 1:23 a.m., a powerful explosion occurred at the fourth power unit of the Chernobyl Nuclear Power Plant during testing of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest man-made releases of radioactive substances in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 entered the atmosphere. Thousands of people took part in eliminating the consequences, many of whom received serious doses of radiation. This catastrophe struck the stability of the Soviet Union, increasing tension in society and exacerbating the political situation in the USSR."
 news.4.a: "Eternal memory to the heroes!"
 news.5.t: "The Yugoslav Wars have begun"
 news.5.desc: "Today war has begun in Yugoslav territories, mainly including a series of interethnic conflicts between Serbs on one side and Slovenes, Croats, Bosniaks, and Albanians on the other, as well as the Croat-Bosniak conflict and the conflict between the Republic of Western Bosnia, supported first by Croats and then by Serbs, and the central authorities of Muslims led by Alija Izetbegović in the Republic of Bosnia and Herzegovina, and the conflict between Albanians and Macedonians in North Macedonia, caused by religious and ethnic contradictions."
 news.5.a: "Another protracted war..."
 news.6.t: "Elections to the Supreme Soviet of the RSFSR"
 news.6.desc: "Today non-alternative elections to the Supreme Soviet of the RSFSR of the XI convocation were held. \n\ \n\ Elections to the IX convocation of the Supreme Soviet of the RSFSR were held according to the Regulations on elections to the Supreme Soviet of the RSFSR, approved by decree of the Presidium of the Supreme Soviet of the RSFSR of August 8, 1978. 101,058,205 people took part in the elections (turnout - 99.97%). 100,989,507 people voted for the candidates (99.93%)."
 news..a: "Quite interesting."
 news.7.t: "Steve Jobs’ visit to Moscow"
 news.7.desc: "In the summer of 1985, one of the founders of the California computer company Apple, Steve Jobs, together with lawyer Albert Eisenstat, arrived in Soviet Moscow. Their plans were to establish cooperation with the Soviet leadership and open production of their computers in the country."
 news.7.a: "We hope everything will be fine."
 news.8.t: "Operation Desert Storm"
 news.8.desc: "On January 17, 1991, a coalition of 35 countries led by the USA began Operation Desert Storm against Iraq, which had occupied Kuwait. The airstrikes were preceded by a salvo of more than 100 Tomahawk cruise missiles from ships in the Persian Gulf and Red Sea. Over 42 days, coalition aviation struck Iraqi command posts, air defense systems, Scud missile positions, and oil infrastructure."
 news.8.a: "Let us go liberate Kuwait!"
 news.9.t: "Republican victory in the USA"
 news.9.desc: "On November 8, 1988, incumbent Vice President George H. W. Bush won a convincing victory in the presidential elections, receiving 426 electoral votes against 111 for Democrat Michael Dukakis. Bush received 53.4% of the popular vote - the best result for Republicans since 1924. Bush’s campaign was built on the promise to continue Reagan’s policies and the famous phrase: “Read my lips: no new taxes.”"
 news.9.a: "Let us hope this serves the cause of peace."
 news.10.t: "Democratic victory in the USA"
 news.10.desc: "On November 8, 1988, Democratic Party candidate Michael Dukakis won a sensational victory in the presidential elections, receiving 370 electoral votes against 168 for incumbent Vice President George H. W. Bush. Dukakis received 52.3% of the popular vote, confidently winning in key states of the Midwest and East Coast."
 news.10.a: "Curious."
 news.11.t: "Iraq won the Iran-Iraq War"
 news.11.desc: "Today the Iran-Iraq War ended with Iraq’s victory. Iraqi troops not only liberated occupied territories, but also captured the Iranian province of Khuzestan with rich oil fields. Iran, exhausted by war and isolation, requested peace on Baghdad’s terms. Ayatollah Khomeini called this “the greatest humiliation in the history of the revolution.” Under the peace treaty, Iran recognizes defeat, pays reparations, and renounces territorial claims. Saddam Hussein declared himself “the sword of the Arab nation.” Iraq became a regional superpower, but the price of victory is enormous: hundreds of thousands dead and the use of chemical weapons."
 news.11.a: "Curious."
 news.12.t: "Iran won the Iran-Iraq War"
 news.12.desc: ""
 news.12.a: "Curious."
 news.13.t: "Accident of the aircraft carrier USS Coral Sea"
 news.13.desc: "The US Navy aircraft carrier USS Coral Sea (CV-43), returning after a major overhaul costing 200 million dollars, collided with the Ecuadorian tanker Napo during exercises in the Caribbean Sea, not far from the American base at Guantanamo, Cuba. The incident occurred in clear weather with 11 kilometers of visibility."
 news.13.a: "Curious."
 news.14.t: "Geneva Meeting"
 news.14.desc: "On November 19-21, 1985, the first meeting in six years of the leaders of the USSR and the USA - Mikhail Gorbachev and Ronald Reagan - took place in Geneva. By the mid-1980s, relations between the two superpowers had reached a record low: Reagan called the USSR an “evil empire,” the USA deployed Pershing-2 missiles in Europe, and Soviet troops continued to fight in Afghanistan.\nNo concrete agreements were reached - Gorbachev demanded abandoning the SDI program in exchange for missile reductions, Reagan stood his ground. However, the very fact of dialogue was a breakthrough. The leaders signed a joint statement that “a nuclear war cannot be won and must never be fought.” The meeting laid the foundations for future agreements."
 news.14.a: "Very good!"
 news.15.t: "Michael Dukakis supports the policy of Perestroika"
 news.15.desc: "Dukakis made a programmatic statement, announcing full support for perestroika and glasnost in the Soviet Union. The president declared: “We welcome the changes in the USSR. Perestroika is a chance for the whole world to put an end to decades of confrontation.” The Dukakis administration announced readiness to revise its foreign policy course: reduction of nuclear arsenals, joint space programs, and expansion of economic ties with the Soviet Union are proposed."
 news.15.a: "Very good!"
 news.16.t: "Michael Dukakis calls for ratification of the INF Treaty"
 news.16.desc: "Today Michael Dukakis said that ratification of the INF Treaty should take place before Reagan’s meeting with Gorbachev in Moscow at the end of May 1988. The president should not go to the USSR “empty-handed” - Senate approval will become a powerful signal of the unity of American policy and readiness for further steps on reducing strategic arms."
 news.16.a: "Curious."
 news.17.t: "Challenger shuttle disaster"
 news.17.desc: "On January 28, 1986, the shuttle Challenger exploded 73 seconds after launch from Cape Canaveral. Seven astronauts died on board, including teacher Christa McAuliffe - millions of schoolchildren watched the broadcast live.\nThe investigation showed that the cause was the destruction of rubber O-rings due to low temperatures. Morton Thiokol engineers warned of the danger, but NASA management ignored them. The Rogers Commission identified systemic problems in the agency’s safety culture. The Space Shuttle program was suspended for 32 months. The tragedy called into question the expediency of crewed flights."
 news.17.a: "Oh, humanity!"
 news.18.t: "Halley’s Comet"
 news.18.desc: "The whole world was preparing for a celestial spectacle. Newspapers were full of headlines about a “tail half the sky long,” astronomers aimed their telescopes, and ordinary people awaited the end of the world or a miracle. However, the Universe decided to joke. In February 1986, Earth and Halley’s Comet ended up on opposite sides of the Sun, and the moment of greatest brightness passed by observers - the comet simply “hid” behind the luminary. Moreover, over the past 76 years cities had grown so much that light pollution turned the night sky into a murky haze. As a result, 99% of the planet’s inhabitants never saw the legendary comet. The triumph of astronomy turned into a farce."
 news.18.a: "Curious."
 news.19.t: "Iran-Contra affair"
 news.19.desc: "In May 1985, through Israeli mediation, a mechanism was developed for supplying American weapons to Iran. On the Israeli side, Prime Minister Shimon Peres, Foreign Minister David Kimche, and arms dealers Schwimmer and Nimrodi took part. On the US side, the operation was overseen by Michael Ledeen and Oliver North. Israel received a guarantee of “compensation” for each tranche. On August 20, 1985, in London, Ledeen gave Kimche a secret communication code.\nToday the data is unknown."
 news.19.a: "Very interesting..."
 news.19.b: "They weren’t supposed to find out about this..."
 news.20.t: "Assassination of Olof Palme"
 news.20.desc: "On February 28, 1986, at 23:21 in central Stockholm, at the intersection of Sveavägen and Tunnelgatan, Swedish Prime Minister Olof Palme was fatally wounded. He was returning from the Grand cinema with his wife Lisbeth without security - Palme principledly did not use bodyguards. The killer fired twice from a .357 Magnum revolver: the first bullet hit the prime minister in the back, the second wounded his wife. Palme died on the way to the hospital."
 news.20.a: "What is going on..."
 news.21.t: "Tiananmen Square Incident"
 news.21.desc: "Multi-day protests by students and workers in Beijing have reached a critical point. The demonstrators, demanding democratic reforms and the fight against corruption, have completely paralyzed the center of the capital. Following sharp debate within the party leadership, a radical decision was made.\n\nThe introduction of army units and armored vehicles turned the square into a war zone. Despite barricades and resistance, the counter-revolutionary rebellion was brutally crushed by the army. While the government claims that order has been restored, the international community remains in shock. This day will forever change the state's internal and external course."
 news.21.a: "This is a terrible tragedy..."
 news.21.b: "But nothing happened there..?"
 news.22.t: "Proclamation of Greater Iraq"
 news.22.desc: "Soon after the fall of Kuwait and the suppression of resistance in Kurdistan and Khuzestan, Baghdad announced the creation of Greater Iraq, redrawing the British borders. Saddam Hussein was proclaimed “Guardian of the Arab Tiger,” and the inclusion of new territories gave Iraq control over a fifth of the world’s oil reserves. Now the regime faces the task of holding together heterogeneous regions, uniting their resources to ensure economic and military growth."
 news.22.a: "The world has changed forever..."
 news.22.b: "Allahu Akbar! Glory to Iraq and Saddam Hussein himself!"
 news.23.t: "Yemeni unification"
 news.23.desc: "The Yemen Arab Republic (North Yemen) and the People’s Democratic Republic of Yemen (South Yemen) officially united into a single Republic of Yemen. Two states with completely different political systems - the Islamic North and the Marxist South - after decades of border wars and splits lasting more than 250 years, finally moved toward peaceful merger.\n\nThis process became possible thanks to long negotiations that lasted about 25 years and ended with the signing of the Aden Agreement on November 30, 1989. A year earlier, in May 1988, the sides created a demilitarized zone along the border, and now they reached a final agreement."
 news.23.a: "Everything will be fine... right..?"
 news.23.b: "Now we are a single state!"
 news.24.t: "Hezbollah uprising"
 news.24.desc: "On February 16, 1985, the Lebanese Shia group, which had previously operated underground, officially announced its existence.\n\nAt the al-Uzai mosque in West Beirut, organization representative Sheikh Ibrahim al-Amin read out a manifesto entitled “The Hezbollah Program - an open letter to all the oppressed in Lebanon and throughout the world.” The text of the manifesto was simultaneously published in Lebanon’s largest newspaper, as-Safir."
 news.24.a: "Let us wish Lebanon luck."
 news.25.t: "Mujahideen won the Afghan War"
 news.25.desc: "The Afghan War, which became one of the longest and bloodiest in modern history, formally ended with the withdrawal of Soviet troops on February 15, 1989. However, the struggle continued: for another three years, Mohammad Najibullah’s government, with USSR support, held power. With the collapse of the Soviet Union, military and economic aid completely ceased. A month ago, Mujahideen detachments entered Kabul and overthrew the last pro-communist government. The result of the decade-long confrontation was the victory of the Afghan Mujahideen."
 news.25.a: "Interesting..."
 news.25.b: "Finally."
 news.26.t: "Afghanistan won the Afghan War"
 news.26.desc: "Operation Magistral put an end to the protracted confrontation. The blockade of Pakistani passes, strikes on militant camps, and a policy of reconciliation split the opposition. Kabul was reliably held, field commanders either sided with the government or were pushed back into the mountains.\nThe General Staff reports: organized resistance in the DRA has ceased. Afghanistan is becoming a friendly buffer covering Central Asian borders from extremism and drug trafficking. Over 15 thousand servicemen have been awarded, and military equipment has gained invaluable experience for modernization.\nThe southern flank is reliably protected. The Union is emerging from the war with strengthened positions."
 news.26.a: "Very interesting..."
 news.26.b: "Hooray!"
 news.27.t: "Withdrawal of Soviet troops from Afghanistan"
 news.27.desc: "February 15, 1989, 10:00, the last column of the 40th Army crossed the Friendship Bridge, completing a 9-year campaign in which 620,000 Soviet servicemen participated. Losses: 15,052 killed, 53,753 wounded, 417 missing. 800,000 tons of ammunition expended, 118 aircraft, 333 helicopters, 147 tanks destroyed.\nThis was the first major scaling back of Soviet presence outside the Warsaw Pact. The operation exposed economic exhaustion, intensified criticism of perestroika, and gave impetus to national movements in Central Asia. The world saw that the USSR could no longer dictate terms on its southern borders, and disappointment grew within the country."
 news.27.a: "We have all waited so long for this!"
 news.27.b: "Farewell, mountains!"
 news.28.t: "German reunification"
 news.28.desc: "On October 3, 1990, at midnight, the GDR ceased to exist. Five states and Berlin joined the FRG - unification by absorption of the eastern neighbor, without creating a new state.\nA negotiating marathon: the Unification Treaty, the “Two Plus Four” Treaty. The four powers confirmed Germany’s sovereignty, obliging Soviet troops to withdraw by the end of 1994, and the Bundeswehr to be reduced from 500 to 370 thousand.\nUnification became a geopolitical earthquake: it exposed the economic gulf between East and West, increased migration, put an end to the socialist experiment in Europe, and changed the balance of forces. Moscow, agreeing to the West’s terms, conceded positions, opening the way for NATO expansion eastward."
 news.28.a: "The German people are united again."
 news.28.b: "We are united again, as in the good old days!"
 news.29.t: "Agacher War"
 news.29.desc: "On December 25, Christmas Day, the Malian army launched an offensive in the Agacher Strip. Burkina Faso’s army transferred soldiers to the region and began counterattacks. However, Malian troops proved better prepared and carried out several successful attacks, capturing a number of villages. Burkina Faso soldiers counterattacked but suffered heavy losses. The Libyan government has already announced an attempt to negotiate a ceasefire between the sides on December 26."
 news.29.a: "Curious."
 news.30.t: "Operation Canyon El Dorado"
 news.30.desc: "Washington’s patience has overflowed. After the recent bloody terrorist attack at a discotheque in West Berlin, which claimed the lives of American soldiers, the White House points its finger directly at Tripoli. President Reagan publicly called Muammar Gaddafi “the mad dog of the Middle East” and ordered immediate retaliation.\n\nF-111 bombers together with carrier aviation of the Sixth Fleet delivered a crushing strike on military facilities and training camps in Tripoli and Benghazi. The sky over Libya was lit by bursts of anti-aircraft shells. The air operation is complete."
 news.30.a: "Curious."
 news.31.t: "First Palestinian Intifada"
 news.31.desc: "An uprising of Palestinians has occurred in Israel, whose goal was proclaimed “the struggle against the Israeli occupation.” Events are unfolding very rapidly; perhaps this will grow into a civil war.\nIn the months preceding the start of the First Intifada, many events occurred that increased hostility between Palestinians and Israelis. In September, four Israelis were killed. These incidents led to hostility between Israelis and Palestinians and unrest in all territories, which intensified every day and reached especially wide scale in the Gaza Strip."
 news.31.a: "Curious."
 news.32.t: "Belovezha Accords"
 news.32.desc: "The Belovezha Accords, signed on December 8 by the heads of the Republic of Belarus, the RSFSR, and Ukraine, became a turning point in the history of the USSR. The Agreement stated the termination of the existence of the USSR as a “subject of international law and geopolitical reality” and announced the creation of the Commonwealth of Independent States. The Agreement was signed by senior officials and heads of government of the three union republics: Stanislav Shushkevich and Vyacheslav Kebich - from the Republic of Belarus, Boris Yeltsin and Gennady Burbulis - from the RSFSR, Leonid Kravchuk and Vitold Fokin - from Ukraine."
 news.32.a: "The world has changed forever..."
 news.33.t: "Toyota War"
 news.33.desc: "The Chadian-Libyan conflict has entered an active phase of hostilities. By the beginning of 1987, the Libyan expeditionary corps still represented an impressive force numbering 8,000 soldiers, 300 tanks, multiple rocket launch systems and conventional artillery, Mi-24 helicopters, and sixty combat aircraft. These forces did not have unified command, but were divided into the Southern Operational Group, operating in the Tibesti area and numbering 2,500 people, and the Eastern Operational Group centered in Faya-Largeau. The Libyans were preparing for a war in which they were to provide their Chadian allies with support from land and air."
 news.33.a: "Quite interesting."
 news.34.t: "Yellow Revolution in the Philippines"
 news.34.desc: "The long-standing authoritarian regime of Ferdinand Marcos in the Philippines fell under the onslaught of peaceful protest. Millions of citizens with yellow ribbons took to the streets of the capital after mass election fraud. When the army refused to carry out the dictator’s orders and sided with the people, the regime’s fate was sealed. Marcos fled the country, and Corazon Aquino came to power, promising to return freedom and democracy to the Philippines."
 news.34.a: "Freedom for the Philippines!"
 news.35.t: "CDU victory in the 1987 elections"
 news.35.desc: "On January 25, 1987, elections to the Bundestag were held in West Germany. Despite sharp criticism from the opposition and the growing popularity of the Greens, the center-right CDU/CSU bloc under incumbent Chancellor Helmut Kohl won a confident victory, gaining 44.3% of the vote.\n\nTogether with its long-time partners from the FDP, the conservatives formed a stable coalition government. This triumph strengthens Kohl’s position on the international stage and guarantees the continuation of the FRG’s harsh pro-Western course in the Cold War. It seems the political landscape of West Germany will remain unchanged in the coming years."
 news.35.a: "Understood."
 news.36.t: "SPD victory in the 1987 elections"
 news.36.desc: "On January 25, 1987, the political landscape of West Germany trembled. Contrary to all forecasts, the Social Democratic Party (SPD) under the charismatic Johannes Rau won a triumphant victory in the Bundestag elections. Voters, tired of Kohl’s conservative course and frightened by the escalation of the Cold War, voted en masse for the center-left.\n\nRau has already announced the formation of a coalition with the strengthened Greens. The new government is taking a course toward de-escalation of relations with the Eastern Bloc."
 news.36.a: "Understood."
 news.37.t: "War in Bosnia and Herzegovina"
 news.37.desc: "Ethnic and political tension in the Balkans has finally grown into a full-scale civil war. Following the declaration of independence of Bosnia and Herzegovina, the situation in the region instantly spiraled out of control. Bosnian Serbs, with Belgrade’s support, began a large-scale offensive, and Sarajevo found itself in a tight siege ring. Fierce clashes between Bosniaks, Serbs, and Croats erupted throughout the country, threatening to turn into a severe humanitarian catastrophe."
 news.37.a: "Another war..."
 news.38.t: "Velvet Divorce"
 news.38.desc: "The Czechoslovak Republic officially ceased to exist. After long political debates, the leaders of Czechia and Slovakia reached an agreement on the peaceful division of the country. Unlike many other multinational states, this dissolution took place without a single shot and in an atmosphere of complete calm. From today, state property and the army are being divided between Prague and Bratislava, and two new sovereign states officially appear on the map of Europe."
 news.38.a: "The end of an era."
 news.39.t: "Death of Enver Hoxha"
 news.39.desc: "Today Albania lost its long-time leader. Enver Hoxha died after a prolonged illness at the age of 76. For decades Hoxha remained the central figure of Albanian politics, pursuing a harsh course to preserve the socialist system and the country’s independence. Under his rule, Albania became almost completely isolated from the outside world, and the cult of personality of the First Secretary became an integral part of the state system."
 news.39.a: "The era of Enver Hoxha has come to an end."
 news.40.t: "8888 Uprising"
 news.40.desc: "Rangoon, August 8, 1988 Burma found itself engulfed in mass protests. Today thousands of students and ordinary citizens took to the streets of Rangoon, demanding political change and an end to years of military rule. The protests, which began in previous months, rapidly grew into a nationwide movement. Strikes are paralyzing the work of state institutions, and demonstrations are taking place in the country’s largest cities. The authorities are trying to restore order, but the scale of the demonstrations continues to grow. Burma’s future now depends on whether the government can retain control over the country."
 news.40.a: "“8888” became a symbol of the uprising — and, perhaps, the beginning of a new era for Burma."
 news.40.a: "The beginning of a new era for Burma."
 news.41.t: "Donald Trump’s arrival in the USSR"
 news.41.desc: "July 4, 1987, was marked by an unexpected and intriguing event in the history of the Cold War. At the personal invitation of the Soviet leadership, the famous American billionaire and real estate magnate Donald Trump arrived in Moscow.\n\nAt the Kremlin, Trump was received by General Secretary of the CPSU Central Committee Mikhail Gorbachev. During the meeting, held in the atmosphere of “perestroika” and “glasnost,” ambitious projects were discussed: from building luxury hotels in the very center of the Soviet capital to the prospects of normalizing relations between the two superpowers.\n\n"
 news.41.a: "We hope everything works out."
 news.41.b: "Nothing worked out."
 news.42.t: "Mathias Rust’s flight"
 news.42.desc: "On May 28, 1987, right on Border Guard Day, a light Cessna-172 aircraft piloted by 18-year-old German amateur pilot Mathias Rust landed on Red Square in Moscow. The young man overcame more than a thousand kilometers over USSR territory without much difficulty, but Soviet air defense troops, shackled by bureaucracy and fear of responsibility, never dared to shoot down the violator. This incredible event instantly destroyed the myth of the inviolability of Soviet borders. While stunned Muscovites take autographs from Rust, a storm rages in the Kremlin."
 news.42.a: "Why did he do it?"
 news.42.b: "Immediately dismiss all senior command!"
 news.43.t: "Mathias Rust incident"
 news.43.desc: "On May 28, 1987, duty air defense assets of the USSR recorded a violation of the country’s airspace. A light Cessna-172 aircraft, piloted by 19-year-old FRG citizen Mathias Rust, crossed the border from Finland.\nUnder the leadership of General Secretary Grigory Romanov, the Soviet Armed Forces showed decisiveness. Instead of endless coordination and bureaucracy, the air defense of the Leningrad and Moscow districts worked lightning-fast. After ignoring orders to land, the violator was intercepted and forced to land at a military airfield by fighter aviation."
 news.43.a: "The Russians will shoot you down..."
 news.43.b: "Excellent."
 news.44.t: "Erich Honecker’s visit to Bonn"
 news.44.desc: "Bonn, September 7, 1987 Today General Secretary of the SED Central Committee and Chairman of the State Council of the GDR Erich Honecker arrived in Bonn. This is the first official visit of the East German leader to the Federal Republic of Germany. The meeting with Federal Chancellor Helmut Kohl became an important event in relations between the two German states. Despite continuing political disagreements, the sides discussed the development of relations, economic cooperation, and humanitarian issues. Flags of both Germanys fluttered in the streets of Bonn. Honecker’s visit is regarded as a new step toward normalization of relations between East and West."
 news.44.a: "What will happen next?"
 news.45.t: "Resignation of Margaret Thatcher"
 news.45.desc: "Margaret Thatcher has been in power for eleven years. The poll tax caused mass riots, the Conservatives' rating is falling, and dissatisfaction with her tough course on Europe is growing within the party. Former Defence Minister Michael Heseltine challenges her in the leadership race.\n\nFirst round of voting: Thatcher gets 204 votes, Heseltine — 152. Not enough for victory, and the cabinet ministers one after another refuse her support. She declares she will fight in the second round, but by evening it becomes clear: the party wants a different leader. Today Thatcher announced her resignation."
 news.45.a: "An era has passed."
 news.46.t: "Velvet Revolution in Bulgaria"
 news.46.desc: "On November 10, 1989, Todor Zhivkov was removed from the post of General Secretary of the Central Committee of the Bulgarian Communist Party after 35 years of rule. The reasons for the fall of his regime were the economic crisis, growing public discontent, and perestroika in the USSR. New party leader Petar Mladenov announced the beginning of reforms, but citizens demanded full democratic transformations and civil freedoms, which marked the end of the previous political system."
 news.46.a: "The quiet change of power in Sofia may be the beginning of the end of the communist era in Bulgaria."
 news.46.b: "Finally Zhivkov is gone!"
 news.47.t: "Velvet Revolution"
 news.47.desc: "Large-scale anti-government protests have begun in Czechoslovakia. The violent dispersal of a student demonstration in Prague caused a wave of outrage that swept the entire country. Workers and intellectuals joined the movement led by dissident Václav Havel. Under pressure from mass actions and a general strike, the communist regime was forced to make concessions, losing its monopoly on power."
 news.47.a: "Interesting"
 news.47.b: "Finally we are free! No fear, down with the party monopoly!"
 news.48.t: "Solidarity Revolution"
 news.48.desc: "In Poland’s first partially free elections, the opposition trade union Solidarity won a convincing victory. The movement, created in 1980, had withstood martial law and persecution, retaining mass support. The election results and the decisions of the Round Table Talks forced the Polish United Workers’ Party to renounce its monopoly on power and begin forming a new government."
 news.48.a: "The West admired the courage of the workers, while Soviet citizens secretly hoped for change."
 news.48.b: "The voice of the people sounded louder than party slogans."
 news.49.t: "Hungary’s transition to democracy"
 news.49.desc: "Hungary officially changed the status of the Hungarian People’s Republic, proclaiming itself an independent democratic republic. The transition to parliamentary democracy and multi-party system was the result of negotiations between the ruling party and the opposition, facilitated by the economic crisis and the weakening of Soviet control. The new leadership began preparing free elections, economic reform, and rapprochement with the West."
 news.49.a: "The red star gives way to democratic change"
 news.49.b: "Borders are open, we are in Europe again!"
 news.50.t: "Romanian Revolution"
 news.50.desc: "A revolution has begun in Romania: protests from Timișoara grew into a general uprising against the dictatorship of Nicolae Ceaușescu. After violent clashes, the army sided with the people, and Ceaușescu and his wife fled Bucharest. Protesters occupied the Central Committee building, and power passed to the opposition, which announced democratic transformations."
 news.50.a: "The Ceaușescu era is coming to a bloody end."
 news.50.b: "Justice has been done, the dictator is no more!"
 european_union.2.a: "Historical background of the EU"
 european_union.2.d: "After World War II, European countries sought to prevent new conflicts and restore the economy through cooperation. In 1951, six states - France, the FRG, Italy, Belgium, the Netherlands, and Luxembourg - created the European Coal and Steel Community, laying the foundation for European integration.\nIn 1957, the Treaties of Rome were signed, establishing the European Economic Community (EEC) and Euratom. The main goal was the formation of a common market, free movement of goods, services, capital, and labor.\nIn the 1970s, the community expanded: the United Kingdom, Ireland, and Denmark joined, later Greece.\n In 1985, the EEC became an important force in Europe. During this period, preparations began for the creation of a single internal market"
 european_union.2.c: "Toward the future!"
 european_union.3.a: "Signing of the Single European Act"
 european_union.3.d: "After long negotiations, the states of the European Community agreed on the provisions of the Single European Act. The new treaty should accelerate the creation of a single internal market, strengthen economic cooperation, and expand the powers of common European institutions. Supporters of integration call this moment the beginning of a new era of European unity, while critics fear the gradual loss of national sovereignty for the sake of a future united Europe."
 european_union.3.c: "Excellent!"
 european_union.4.a: "Hanover Summit"
 european_union.4.d: "At the Hanover Summit, the leaders of the European Community agreed that further European integration was impossible without closer monetary and economic cooperation. Following the negotiations, the Jacques Delors Commission was tasked with preparing a concrete plan for creating an Economic and Monetary Union."
 european_union.4.c: "Europe must become a single economic space!!"
 plaza_accord.1.t: "OECD Summit"
 plaza_accord.1.desc: "In April 1985, another meeting of the Organisation for Economic Co-operation and Development (OECD) opened in Paris. On the agenda are the most important issues of the world economy: coordination of macroeconomic policies of Western countries, overcoming the consequences of recent structural crises, and discussion of the growing influence of new industrial countries of Asia. Against the backdrop of the technological boom and digitalization, leaders of developed powers must develop a common strategy that will determine the contours of the global market for years to come."
 plaza_accord.1.a: "Curious."
 plaza_accord.2.t: "The USA proposes signing the “Plaza Accord”"
 plaza_accord.2.desc: "The US delegation made a harsh and uncompromising economic proposal known as the “Plaza Accord.” Washington is seriously concerned about its huge trade deficit and the excessively high dollar exchange rate, which is strangling American industry. The White House demands that we carry out coordinated intervention in currency markets to devalue the dollar. For our country, this means a strong blow to exports and a threat to long-term stability. Refusal may shake relations with the Americans, but agreement will cost our economy too dearly."
 plaza_accord.2.a: "We will go through with this."
 plaza_accord.2.b: "We will not sacrifice our economy!"
 plaza_accord.3.t: "[FROM.GetNameDef] agreed"
 plaza_accord.3.desc: "Our harsh diplomatic and economic pressure at the OECD summit has borne its first fruits: a key economic partner agreed to sign the “Plaza Accord.” Despite initial resistance and fears for its own exports, the foreign delegation yielded to our country’s demands in order to preserve strong allied relations. Their central bank is already preparing for coordinated intervention to revalue its currency, which will help lower the dollar and restore the competitiveness of our goods. We are celebrating an important tactical victory in the negotiations."
 this_country_agreed_to_sign_the_plaza_accord: "§YThis country will sign the “Plaza Accord” in the future§!"
 plaza_accord.3.a: "Excellent!"
 plaza_accord.4.t: "[FROM.GetNameDef] refused"
 plaza_accord.4.desc: "Despite all our political and economic pressure at the OECD summit, a key economic partner flatly refused to sign the “Plaza Accord.” The foreign delegation took an uncompromising position, stating that it did not intend to sacrifice its own exports and currency stability to solve the internal problems of our industry. This open demarche threatens our entire plan for coordinated devaluation of the dollar. Deep disappointment with allies is growing in the White House and Congress, and the industrial lobby is already demanding immediate punitive measures and the introduction of harsh protectionist tariffs."
 plaza_accord.4.a: "It will be hard..."
 plaza_accord.5.t: "“Plaza Accord” signed"
 plaza_accord.5.desc: "We have officially signed the historic “Plaza Accord.” According to the document, central banks are beginning large-scale coordinated intervention in currency markets. The main goal of the plan is a radical reduction of the US dollar against the Japanese yen and German mark. For the United States, this victory means saving domestic industry and reducing the trade deficit. At the same time, for their key partners an era of severe trials begins: the sharp rise in national currencies will deal a powerful blow to exports and force governments to seek new, often risky methods of maintaining economic stability. The global financial order has changed forever."
 plaza_accord.5.a: "Hooray! Devaluation is coming!"
 plaza_accord.6.t: "Failure of the “Plaza Accord”"
 plaza_accord.6.desc: "Our diplomatic efforts suffered a crushing collapse. Despite all economic and political pressure from Washington, key allies flatly refused to sign the “Plaza Accord.” Japan and the European powers preferred to protect their own exports, leaving the American economy alone with its problems. The dollar remains critically high, and the trade deficit continues to strangle our production. Discontent is growing in Congress over the White House’s inability to defend national interests, and American industrialists demand the introduction of harsh protectionist tariffs in response to betrayal by partners."
 plaza_accord.6.a: "The trade deficit will become even larger..."
 plaza_accord.7.t: "[FROM.GetNameDef] refused to sign the agreement"
 plaza_accord.7.desc: ""
 plaza_accord.7.a: "We finally support the USA."
 plaza_accord.7.b: "We refuse to sign the agreement."
 plaza_accord.8.t: "[FROM.GetNameDef] supported us"
 plaza_accord.8.desc: ""
 plaza_accord.8.a: "Excellent!"
 plaza_accord.9.t: "[FROM.GetNameDef] refused to support us."
 plaza_accord.9.desc: ""
 plaza_accord.9.a: "There will be no devaluation..."
 france.1.t: "1988 elections"
 france.1.desc: "France, 1986–1988. For the first time in the Fifth Republic, the president and prime minister are from opposite camps. Socialist Mitterrand, after the left’s defeat in the 1986 elections, appoints Gaullist Jacques Chirac as prime minister. Right-wing parliament, left-wing president, and neither yields.\n\nMitterrand is an old-school politician, in power since 1981. Chirac is sixteen years younger, mayor of Paris, nicknamed “Bulldozer.” He is a Gaullist, a supporter of the market, carrying out privatization and deregulation. Mitterrand is patient and cunning, knows how to wait, and secretly supports protests against Chirac’s reforms.\n\nThe constitution is vague: the president is responsible for defense and foreign policy, the prime minister for domestic policy. Chirac tries to reclaim foreign policy too, but Mitterrand firmly puts him in his place."
 france.1.a: "François Mitterrand!"
 france.1.b: "Jacques Chirac!"
 britain.1.t: "1987 elections"
 britain.1.desc: "Margaret Thatcher, leader of the Conservative Party and prime minister since 1979, by 1987 had already served two terms and enjoyed a reputation as a tough but effective politician. Her economic reforms, including mass privatization and limiting the power of trade unions, produced results: inflation fell to 4%, and unemployment dropped below three million for the first time in years. In the election she staked her campaign on strong defense and a hard position on nuclear disarmament.\n\nNeil Kinnock, Labour leader since 1983, a Welsh politician, had done serious work on mistakes: he purged the far-left wing from the party, changed its symbols, and tried to present Labour as a moderate and modern force. His 1987 campaign was recognized as the party’s best in a decade. But his main vulnerability remained support for unilateral nuclear disarmament, which most voters did not share. Thatcher actively used this, accusing him of wanting to “leave us weaker and defenseless.”\n\nDavid Steel, leader of the Liberal Party since 1976, served as one of two co-chairs of the centrist Alliance together with Social Democrat David Owen. This tandem proved ineffective: “dual leadership” was mocked, and disagreements reigned within the Alliance. After the election Steel called for the creation of a single party, which led to the merger of Liberals and Social Democrats into the Liberal Democrats in 1988."
 britain.1.a: "Margaret Thatcher!"
 britain.1.b: "Neil Kinnock!"
 britain.1.c: "David Steel!"
 britain.2.t: "1992 elections"
 britain.2.desc: "April 9, 1992. John Major, who replaced Thatcher in November 1990, leads the Conservatives into their fourth consecutive election. The country is in deep recession. Major is not Thatcher: he speaks more quietly, promises “less class, more opportunity,” and travels with a soapbox. He looks ridiculous, but it works.\n\nNeil Kinnock, Labour leader since 1983, cleaned up the party, abandoned unilateral nuclear disarmament, and changed the red flag for a rose. Polls give Labour a chance for the first time since 1979. But a week before the vote Kinnock holds a rally in Sheffield - helicopter, anthems, the cry “We’re all right!” in an arena with ten thousand people. The hall rejoices, TV viewers wince. This show would later be called one of the reasons for the failure.\n\nPaddy Ashdown, leader of the Lib Dems, hears predictions of a hung parliament throughout the campaign. He rejects any deals, but his rating grows."
 britain.2.a: "John Major!"
 britain.2.b: "Neil Kinnock!"
 britain.2.c: "Paddy Ashdown!"
 britain.3.t: "Thatcher’s resignation"
 britain.3.desc: "November 1990. Thatcher has been in power for eleven years. The poll tax caused riots, Conservative ratings are falling, and discontent with her course on Europe is growing in the party. Michael Heseltine challenges her. First round: Thatcher - 204, Heseltine - 152. She lacks votes for victory. She says she will fight, but the cabinet one by one refuses to support her. On November 22 she announces her departure. John Major wins the second round and becomes prime minister. Eleven years ended in a week."
 britain.3.a: "It is time for her to resign."
 britain.4.t: "Creation of the United European Front"
 britain.4.desc: "The official dissolution of NATO by the United States dealt a crushing blow to Western collective security, but Britain does not intend to meekly await its fate. The Americans' retreat into isolation leaves Europe alone with the Soviet Empire, whose tank divisions already stand in the Benelux and on the ruins of the FRG. We have exactly 120 days of the Copenhagen Truce to accomplish the impossible.\n\nToday we announce the creation of a new military coalition — the "United European Front." Our goal is clear and uncompromising: to contain the further advance of communism westward and prevent its expansion into other hemispheres. We take upon ourselves the burden of leadership and immediately send official invitations to France, Italy, and the surviving Portugal and Spain. We will turn Europe into an impregnable fortress. May God help us."
 britain.4.a: "We will become the shield of free Europe!"
 israel.1.t: "Uprisings in Gaza"
 israel.1.d: ""
 israel.1.a: "Something must be done!"
 israel.2.t: "Declaration of Palestinian independence"
 israel.2.d: ""
 israel.2.a: "Not this!"
 israel.3.t: "First Palestinian Intifada"
 israel.3.d: ""
 israel.3.a: "Free the Jews!"
 israel.4.t: "Hezbollah uprising"
 israel.4.d: ""
 israel.4.a: "We will quickly suppress them."
 israel.5.t: "1988 elections"
 israel.5.desc: ""
 israel.5.a: "Yitzhak Shamir!"
 israel.6.t: "1992 elections"
 israel.6.desc: ""
 israel.6.a: "Yitzhak Rabin!"
 nuke_dropped.1.t: "[From.From.GetName] is subjected to atomic bombing"
 nuke_dropped.1.d: "For the first and, one hopes, last time in history, a nuclear bomb was detonated during military operations. It was used by the state of [?global.nukecountry.GetNameDef], and the target of the bombing is [From.From.GetName]. The enormous scale of destruction speaks to the power of the new weapon, which inspires fear not only by what it can do, but also by the consequences it carries both for those who use it and for all humanity.\n\nThe world holds its breath awaiting developments. Will [From.From.Owner.GetNameDef] agree to capitulate in order to avoid further aggression, or will this only strengthen fighting spirit and the desire to strike back?"
 nuke_dropped.1.a: "The atomic era has truly begun."
 nuke_dropped.1.b: "We will do everything in our power to protect the [Root.GetAdjective] people."
 nuke_dropped.2.t: "Atomic bombing of Hiroshima"
 nuke_dropped.2.d: "“Hell is happening in the streets.”\n - Kuniyoshi Aikawa\n\nToday a nuclear bomb dropped from an aircraft of [?global.nukecountry.GetNameRuGen] exploded over Hiroshima at an altitude of 580 meters. More than two-thirds of the city were instantly destroyed. Although buildings here were constructed with frequent earthquakes in mind, only a few structures survived.\n\nPublic consciousness tends to exaggerate the power of the atomic bomb and diminish its price - the price in human lives. Neither side wants to think about the horrors of atomic bombing, but this event will enter history with thousands and millions of lives evaporated in an instant or extinguished on poisoned land."
 nuke_dropped.2.a: "How many more people must die before the war finally ends?"
 nuke_dropped.2.b: "We must act quickly to help the victims."
 nuke_dropped.3.t: "Atomic bombing of Nagasaki"
 nuke_dropped.3.d: "The nuclear bomb originally intended for Kokura exploded today over Nagasaki. Weather conditions forced the aircraft to deviate from course, and a combination of smoke, clouds, and technical malfunctions became the factor that may have changed the course of history.\n\nBecause the city is located in a valley, the bomb’s effect was limited to its territory, but the destructive effect is still enormous. Several military facilities were affected, but this is nothing compared to the human casualties. Decades will pass before we fully understand the long-term effects of this weapon. The threat from [?global.nukecountry.GetNameRuGen] knows no bounds."
 nuke_dropped.3.a: "Will this lead to the capitulation of the [From.From.Owner.GetAdjective] leader?"
 nuke_dropped.3.b: "We hoped Nagasaki would not be affected."
 nuke_dropped.4.t: "Atomic bombing of Berlin"
 nuke_dropped.4.d: "Today, on [GetDateText], the armed forces of [?global.nukecountry.GetNameRuGen] delivered a nuclear strike on the capital of Germany, Berlin. The city survived several bombings both in this war and the previous one, but this is beyond comparison with what has now happened. Since the Thirty Years’ War, Berlin has not known such global destruction - given the size of the city, this was considered impossible.\n\nThe Führer’s bunker is said to have survived the explosion, at least partially, since the bomb detonated far from the planned epicenter, and it is claimed that [From.From.Owner.GetLeader] is still alive and furious. How to evacuate [From.From.Owner.GetAdjective] leaders and whether they can be protected from radiation is another question."
 nuke_dropped.4.a: "Today one wants to rejoice that you are not a resident of Berlin."
 nuke_dropped.4.b: "Our enemies have struck at the very heart of the nation!"
 nuke_dropped.5.t: "Atomic bombing of London"
 nuke_dropped.5.d: "Today London was destroyed by a nuclear explosion. Despite a powerful air defense system, the country of [From.From.Owner.GetNameDef] could not prevent the strike delivered by the armed forces of [?global.nukecountry.GetNameRuGen]. On [GetDateText], Big Ben struck the time for the last time and melted from the heat of the explosion. According to initial reports, Buckingham Palace was completely destroyed, and the whereabouts of the royal family are unknown.\n\nIt is confirmed that [From.From.Owner.GetLeader] survived and intends to speak on the radio. The British, utterly demoralized, desperately need their will to resist returned - or a convincing call to capitulate."
 nuke_dropped.5.a: "It is hard to maintain aristocratic calm before a blast wave."
 nuke_dropped.5.b: "God save the King!"
 nuke_dropped.6.t: "Atomic bombing of Kyoto"
 nuke_dropped.6.d: "The city of Kyoto, the leading [From.From.Owner.GetAdjective] industrial center of Japan, was subjected today to a nuclear strike by [?global.nukecountry.GetNameRuGen]. There are suspicions that the city was chosen as a target also because it is the intellectual center of the country.\n\nThe beauty and historical significance of Kyoto made many think it would survive, but the enemy probably considered that destroying such a place would have additional psychological impact. The city is located in a lowland, so the effect of the explosion was limited territorially, but the old imperial palace and many industrial buildings were completely destroyed."
 nuke_dropped.6.a: "History and beauty are worth nothing in war."
 nuke_dropped.6.b: "Let them destroy the old, we will build the new."
 nuke_dropped.7.t: "Atomic bombing of Tokyo"
 nuke_dropped.7.d: "Today the armed forces of [?global.nukecountry.GetNameRuGen] delivered a nuclear strike at the heart of the Japanese Empire. Although the staff allowed for the possibility of conventional bombing of Tokyo, no one could have imagined that the capital would become the main target for the new deadly weapon. However, in the end, due to the political significance of the new capital and the proximity of the imperial palace, which was destroyed to its foundations, all-devouring fire still fell from the sky.\n\nAlthough it is claimed that [From.From.Owner.GetLeader] is alive, the question arises of how far Japan’s enemies are prepared to go. If the war does not end now, what targets remain? What else can threaten them?"
 nuke_dropped.7.a: "Is this the end of the Japanese Empire?"
 nuke_dropped.7.b: "As long as [From.From.Owner.GetLeader] lives, the Empire lives."
 nuke_dropped.8.t: "Atomic bombing of Washington"
 nuke_dropped.8.d: "A nuclear bomb was detonated today over the capital of the United States. This strike was delivered simultaneously against the political center and the historical heritage of the USA. The White House, the Capitol, and a number of other significant buildings and monuments were wiped off the face of the earth by the crushing strike of the hostile [?global.nukecountry.GetNameRuGen]. Even the Washington fire of a century ago cannot compare in destructive power with what this new weapon did to the city.\n\nAlthough President [From.From.Owner.GetLeader] was safe, what happened deeply shocked the nation. Undoubtedly, the USA hoped to remain the first and only country possessing such a weapon. These dreams were shattered in the most tragic way."
 nuke_dropped.8.a: "One nation, indivisible, against one atom - divisible."
 nuke_dropped.8.b: "The eagle will rise from the ashes like a phoenix."
 nuke_dropped.9.t: "Atomic bombing of Rome"
 nuke_dropped.9.d: "In today’s unprecedented attack by the state of [?global.nukecountry.GetNameDef], a nuclear explosion thundered over the ancient city of Rome. Many believed that due to its historical and cultural heritage this ancient city would never become a target for such destructive weapons. The Vatican was also partially destroyed, the whereabouts of the Pope remain unknown, so this explosion horrified not only all Italians but all Catholics.\n\nIn the last ten years Rome developed rapidly, and for a time it still seemed that the city could help the nation revive after the war ended. Alas, these dreams turned to dust along with thousands of people."
 nuke_dropped.9.a: "The bomb has been dropped!"
 nuke_dropped.9.b: "Rome was not built in a day, nor will it rise in one..."
 nuke_dropped.10.t: "Atomic bombing of Paris"
 nuke_dropped.10.d: "Today a nuclear bomb dropped from an aircraft belonging to the state of [?global.nukecountry.GetNameDef] exploded over Paris, causing countless casualties and destruction. France is in shock after its capital suffered the largest attack in its entire history, which included wars and revolutions. Parisians might still have expected the city to be captured, but no one believed it would be so decisively and mercilessly destroyed.\n\nThere will be no more victory parades on the Champs-Élysées at the Arc de Triomphe. Perhaps in the coming decades a new Paris will be reborn, but the city that was so dear to us all no longer exists."
 nuke_dropped.10.a: "The City of Light burned to the ground."
 nuke_dropped.10.b: "Only yesterday it might have seemed that Paris was eternal."
 nuke_dropped.11.t: "Atomic bombing of Moscow"
 nuke_dropped.11.d: "Moscow, the city that many tried in vain to conquer, today became the target of a nuclear strike by [?global.nukecountry.GetNameRuGen]. The explosion was aimed at the Kremlin, where the [From.From.Owner.GetAdjective] government sits, and the heart of the city was almost completely destroyed.\n\n[From.From.Owner.GetLeader] managed to evacuate in time and survived thanks to having recently been prepared for any threat, from any possible and impossible direction. But from such a merciless enemy it will not be easy to hide even in the boundless expanses. If things continue this way, soon the entire country will represent only two types of wasteland: those that were here before and those created by explosions."
 nuke_dropped.11.a: "Wouldn’t a nuclear winter make Moscow an even more unassailable target?"
 nuke_dropped.11.b: "Let them burn all our cities to the last, but they will not take them."
 yugoslavia.2.t: "Independence of Croatia"
 yugoslavia.2.desc: "Today Croatia, following Slovenia, declares its withdrawal from Yugoslavia. The Sabor adopts a declaration of independence, Franjo Tuđman declares that Croatia will no longer be part of the “communist prison of nations.” Zagreb rejoices, we remain silent. The federal army (JNA) receives orders not to intervene - for now.\n\nBut 600,000 Serbs live on the territory of Croatia, and they do not intend to remain in an independent state where they are called a minority. In the Knin Krajina, local Serbs have already blocked roads and announced the creation of the “Serbian Autonomous Oblast.” Both sides have enough weapons: in 1990 the JNA distributed part of its arsenals to local Serbian detachments, while Croats bought weapons in Hungary and on the black market.\n\nThe war has not yet begun, but it is already inevitable. The only question is who will shoot first and who will support whom."
 yugoslavia.2.a: "This is illegal!"
 yugoslavia.2.b: "Let us defend Croatia’s honor!"
 yugoslavia.5.t: "Bosnia declares independence"
 yugoslavia.5.desc: "Today the results of the referendum were announced in Sarajevo: 99.4% voted for independence with a turnout of 63.4%. Serbs boycotted the referendum - for them it was a vote on leaving Yugoslavia, in which they want to remain. Alija Izetbegović speaks of a sovereign Bosnia and Herzegovina, Radovan Karadžić already declares that Serbs will not recognize the result and will create their own state. Belgrade is silent, but the JNA still controls barracks throughout the republic.\n\nBosnia is not Slovenia or Croatia. There is no monoethnic majority here: Muslims, Serbs, and Croats live intermixed, and each community has its own armed detachments. Slovenia and Croatia have already received Western recognition, Macedonia is next. Bosnia is next, and that means a war on three sides."
 yugoslavia.5.a: "To arms!"
 yugoslavia.5.b: "For an independent Bosnia!"
 yugoslavia.10.t: "Should we propose a truce with Croatia?"
 yugoslavia.10.desc: "End of 1991. The war in Croatia has been going on for six months. Vukovar fell in November, but our army got bogged down in urban fighting and lost momentum. In the south the siege of Dubrovnik continues - formally on Bosnian territory, which has already caused an international scandal. Serbian forces control about a third of Croatia, but the front is stretched and reserves are exhausted.\n\nThe main threat is Bosnia. If the war spreads there, we will get a second front, and Zagreb will get new allies. Vance, the UN envoy, has been shuttling between Belgrade and Zagreb for a week, demanding a ceasefire as a condition for introducing peacekeepers. Without a truce there will be no peacekeepers, no lifting of sanctions, no international recognition. The agreement signed in Geneva on November 23 has already failed - the fourteenth attempt. Both sides accuse each other of violations. But Vance does not leave."
 yugoslavia.10.a: "We will sign the agreement. Let us get to work!"
 yugoslavia.10.b: "No deals with separatists!"
 yugoslavia.11.t: "Yugoslavia proposes a truce"
 yugoslavia.11.desc: "End of 1991. Vukovar has fallen, Dubrovnik is under shelling, Serbian forces control about a third of Croatia. The JNA proposes a truce mediated by the UN - the Vance Plan. Conditions: ceasefire, introduction of peacekeepers, withdrawal of the Yugoslav People’s Army from Croatia. For Zagreb this is a chance to stop the war and fix borders. But a truce means freezing the front, and therefore preserving Krajina under Serbian control. Peacekeepers will not return territories, but only cement the division. Refusal means continuation of war, new destruction, and the risk of losing even more. But signing also looks like admitting that Krajina could not be returned by force. The question is not whether the truce is advantageous. The question is what will happen if it is not signed. Continuing the war means further exhaustion of the army, new casualties, and the risk of losing everything. A truce means a pause, preserving what remains, and time to regroup. But it is also an admission that there will be no quick victory, and the first step toward Krajina remaining outside Croatia."
 yugoslavia.11.a: "Let us sign the agreement. We have nothing to lose."
 yugoslavia.11.b: "Never!"
 yugoslavia.12.t: "Croatia agreed"
 yugoslavia.12.desc: "Zagreb accepted the Vance Plan. Today a truce was signed in Sarajevo. Conditions: ceasefire, introduction of UN peacekeepers, withdrawal of the Yugoslav People’s Army from Croatia. For Belgrade this is a pause, not peace: Krajina remains under Serbian control, the front is frozen. Sanctions are not lifted, Bosnia remains the main threat. Croatia receives a breather and a path to international recognition."
 yugoslavia.12.a: "This is a good chance for us."
 yugoslavia.13.t: "Croatia refused the truce"
 yugoslavia.13.desc: "Zagreb rejected the Vance Plan. Tuđman stated that he would not sign a truce that cements Serbian control over Krajina. Croatia is counting on Western recognition, aid from Germany and Austria, and that time works against Belgrade. The war continues. The front near Vukovar and Dubrovnik is unstable, but our army cannot advance without reinforcements. UN sanctions remain, Bosnia is on the brink. For us this means: there will be no quick victory, and every new month of war increases isolation."
 yugoslavia.13.a: "They did this to themselves."
 yugoslavia.14.t: "Should we attack Slovenia?"
 yugoslavia.14.desc: "The war with Croatia is over. Krajina is under control, the army has withdrawn, the truce holds. Now the agenda includes Slovenia. It left Yugoslavia back in June 1991, and then everything was limited to a ten-day war: federal forces tried to hold the borders and Ljubljana airport, but after several clashes and dozens killed on both sides the Brioni Agreement was signed, and the army left. Since then Slovenia has been independent, recognized by the West, and lives peacefully.\n\nFrom a military point of view, an attack is pointless. There is no Serbian minority in Slovenia that needs to be “protected.” It is ethnically homogeneous - almost 90% Slovenes. There are no territorial claims to it. It is far from Belgrade, on the border with Austria and Italy, and any invasion means direct conflict with the West.\n\nFrom a political point of view - likewise. Slovenia does not interfere. It does not threaten Serbs in Krajina and does not support Croatia. Returning it by force will give neither resources nor strategic advantages - only new sanctions and a new front. The army is already exhausted after Croatia, the economy is in ruins, Bosnia is on the brink."
 yugoslavia.14.a: "We must restore Yugoslavia!"
 yugoslavia.14.b: "Now is definitely not the time."
 yugoslavia.15.t: "Should we attack Macedonia?"
 yugoslavia.15.desc: "After Croatia and Slovenia, Macedonia declared independence in September 1991. Then it passed without war: our army left the republic calmly, without battles or losses. President Kiro Gligorov chose a peaceful path and gave no reason for conflict. Since then Macedonia has been independent, also recognized by the West, and lives quietly."
 yugoslavia.15.a: "We must restore Yugoslavia completely!"
 yugoslavia.15.b: "Now is definitely not the time."
 yugoslavia.20.t: "Proclamation of the Federal Republic of Yugoslavia"
 yugoslavia.20.desc: "Today, as the smoke of fires over the Balkans finally begins to clear, we have gathered here to announce the birth of a new state. The war, which claimed tens of thousands of lives, left deep scars, destroyed cities and the economy, but could not destroy the very idea of a commonwealth of peoples. We have gathered the fragments of what was once called Yugoslavia and united them into a new entity — the Federal Republic of Yugoslavia.\n\nOur country will no longer be ruled from a single center with an iron fist. From now on it is a union of equal republics, where the rights of every people, language, and faith will be respected. We renounce the legacy of party dogmas, but preserve the main thing — the brotherhood and unity that bound our lands for centuries. The Republican Army and new democratic institutions are meant to guarantee that no people will be oppressed.\n\nBut the road ahead is still long. Rebuilding what was destroyed, returning refugees, finding common ground between yesterday's enemies — this is a task not for one year. The world looks upon us with distrust, and radicals thirsting for revenge are still strong within the country. But today we have taken the first step."
 yugoslavia.20.a: "Establish a strong central authority."
 finland.1.t: "1988 elections"
 finland.1.desc: "On January 31 and February 1, 1988, Finland for the first time held presidential elections under a new two-round system: voters voted directly for a candidate and at the same time elected 301 members of the electoral college. President Mauno Koivisto, in power since 1982, was running for a second term against the backdrop of economic recovery and a reputation as the architect of the “Finnish miracle” - a careful balance between East and West.\n\nPolls promised him 60–70%, but reality turned out different. Koivisto received only 47.9% - a few percent short of direct re-election. His rivals strengthened in the final weeks: Paavo Väyrynen of the Centre - 20.1%, Prime Minister Harri Holkeri of the National Coalition - 18.1%, Kalevi Kivistö of the “Movement 88” - 10.4%. Now everything was decided by the electoral college.\n\nOn February 15 the electors gathered. Koivisto had 144 votes - seven short of a majority. Holkeri, whose 63 electors were decisive, called on them to support the president. In the second round Koivisto received 189 votes and was re-elected. Väyrynen had to settle for 68, Kivistö - 26. Holkeri left the game, but his alliance with Koivisto changed the alignment: the “red-blue” coalition of prime minister and president retained power."
 finland.1.a: "Mauno Koivisto!"
 finland.1.b: "Harri Holkeri!"
 finland.1.c: "Paavo Väyrynen!"
 greece.1.t: "1989 elections"
 greece.1.desc: "Greece votes amid the loudest political scandal of the decade - the Koskotas affair. Prime Minister Andreas Papandreou, leading PASOK since 1981, is accused of corruption and taking bribes. The country is tired of the socialists, and polls predict victory for the right-wing New Democracy (ND) party under Konstantinos Mitsotakis. However, shortly before the elections PASOK changes the electoral law, introducing an enhanced proportional system. This step is meant to prevent the winner from obtaining an absolute majority and to preserve socialist influence in parliament.\n\nThe results confirm the forecasts. ND receives 44.28% of the vote and 145 seats, PASOK - 39.13% and 125 seats. The left-wing Synaspismos (coalition of communists and leftists) gains 13.13% and 28 mandates. No party has 151 seats needed to form a government. The country enters a period of political deadlock. To overcome the crisis, ND and Synaspismos agree to create a temporary coalition government of “catharsis” (purification). Its task is to investigate corruption scandals of the outgoing PASOK government. A compromise candidate, Tzannis Tzannetakis, becomes prime minister.\n\nThis government is short-lived: it must resign after completing the investigations. However, its creation has already changed Greece’s political landscape. For the first time in the country’s history, communists entered the government, and Papandreou is preparing to face a special court. Greece stands on the threshold of a new political crisis: if the temporary government fails, the country will face snap elections as early as November."
 greece.1.a: "Let us support the “catharsis” coalition."
 greece.2.t: ""
 greece.2.desc: "1992. The government of Mitsotakis, barely holding on to power, faces two problems that could bring it down. The first is economic. The harsh austerity policy introduced to reduce the budget deficit causes rising unemployment and mass discontent. The country is on the brink of social explosion. The second is foreign policy. The collapse of Yugoslavia puts Greece before a difficult choice. Mitsotakis took a hard position on recognizing neighboring Macedonia, insisting that it change its name, since “Macedonia” is a historical Greek region. This line finds support in society, but isolates Greece on the international stage and threatens conflict with the European Community. The pretext for crisis becomes an additional election in Athens (District B), scheduled after the deprivation of mandate of a former socialist minister. The opposition turns it into a referendum on confidence in the government. New Democracy decides to boycott the vote to avoid a humiliating defeat. But this only confirms the weakness of the authorities. PASOK socialists win by a huge margin, which increases pressure on Mitsotakis and raises the question of a vote of no confidence in parliament."
 greece.2.a: "A new era."
 iceland.1.t: "1987 elections"
 iceland.1.desc: "Iceland votes against the backdrop of growing inflation and a huge state debt. The ruling coalition of the Independence Party and Progressive Party loses its majority: together they receive 31 seats out of 63 instead of 37. The Independence Party, led by Thorsteinn Pálsson, Minister of Finance, suffers its worst defeat in history - 27.2% and 18 seats. The reason is a split: Albert Guðmundsson, expelled from the party, creates the populist Citizens’ Party, which takes 10.9% and 7 seats.\n\nThe main surprise is the Women’s Alliance, doubling its representation to 6 seats with 10.1% of the vote. Social Democrats strengthen to 10 seats, the People’s Alliance loses two. The traditional four-party system is cracking, and long coalition negotiations begin. Only on July 8 does Thorsteinn Pálsson become prime minister at the head of a three-party coalition - the Independence Party, Progressive Party, and Social Democratic Party."
 iceland.1.a: "Form a three-party coalition with the Social Democrats."
 iceland.2.t: "1988 elections"
 iceland.2.desc: "Thorsteinn Pálsson’s coalition fell apart. The economy is in a difficult state - inflation, growing debt, and most importantly, a dispute over expanding the aluminum plant at Straumsvík, which split the government and society. Steingrímur Hermannsson, leader of the Progressive Party, shows composure and initiates negotiations to form a new cabinet. He negotiates with the left and achieves agreement on building the plant, which resolves the key dispute.\nThe new government is sworn in. It includes the Progressive Party, Social Democratic Party, and People’s Alliance - for the first time communists received ministerial portfolios, including Ólafur Ragnar Grímsson as Minister of Finance. Hermannsson again becomes prime minister, and his cabinet promises economic stabilization and continued expansion of the aluminum industry."
 iceland.2.a: "Let us support the coalition."
 iceland.3.t: "1991 elections"
 iceland.3.desc: "April 20, 1991. Iceland votes after three years of unstable coalitions. The Independence Party under new leader Davíð Oddsson, mayor of Reykjavík, regains lost positions: 38.6% of the vote and 26 seats out of 63 - its best result in a decade. Progressives receive 13 seats, Social Democrats - 10, People’s Alliance - 9, Women’s List - 5, Citizens’ Party loses everything. Turnout - 87.6%.\n\nOddsson, sworn in on April 30, forms a coalition with the Social Democrats - 36 seats in parliament. His goal is clear: liberalization of the economy, privatization of unprofitable enterprises, tax cuts, and using the proceeds to pay down state debt. He preserves the fishing quota system and strengthens the pension system. The economy, recently suffering from inflation and austerity, begins to grow."
 iceland.3.a: "Support the coalition with the Social Democrats."
 soviet_union.1.t: "Konstantin Chernenko died..."
 soviet_union.1.desc: "Leonid Brezhnev symbolized stagnation and ignoring pressing problems that only accumulated over these decades. Brezhnev died, then Andropov, now Chernenko. We must decide the further fate of the Soviet Union."
 soviet_union.1.a: "Something must be done!" # Gorbachev
 soviet_union.2.t: "Election of a new General Secretary"
 soviet_union.2.desc: "Leonid Brezhnev symbolized stagnation and ignoring pressing problems that only accumulated over these decades. Brezhnev died, then Andropov, now Chernenko. We must decide the further fate of the Soviet Union. Before us is a choice between the liberal Gorbachev and the Stalinist Romanov. Who is now destined to rule the USSR?"
 soviet_union.2.a: "We need liberal reforms! For Gorbachev!" # Gorbachev
 soviet_union.2.b: "No to Gorbachev! We need Romanov!"
 soviet_union.3.t: "Events in Vilnius"
 soviet_union.3.desc: "On the night of January 12-13, 1991, after the tragic events in Vilnius, where Soviet special units supported by armored vehicles occupied the television center, killing 14 people, a mass protest movement began in Riga. On January 13, about half a million people gathered on the Daugava embankment for a rally of the Popular Front, after which residents began building barricades in Old Riga and other districts of the city. Defensive structures were built around the Supreme Council building, television, bridges, and other strategic objects. The culmination of the confrontation came on January 20, when the Riga OMON, which remained loyal to the Union oath, attempted to storm the building of the Ministry of Internal Affairs of Latvia. During the shootout in central Riga, five people died: schoolboy Edijs Riekstiņš, two internal affairs officers - Vladimir Gomonovich and Sergey Kononenko, as well as Riga Film Studio cameramen Andris Slapiņš and Gvido Zvaigzne. The barricades stood until January 27, becoming a symbol of the Latvian people’s resistance and the most important stage on the path to restoring the republic’s independence."
 soviet_union.3.a: "I see."
 soviet_union.4.t: "Referendum on preserving the USSR"
 soviet_union.4.desc: "On March 17, 1991, the All-Union referendum on preserving the renewed Union of Soviet Socialist Republics as a federation of equal republics was held in the Soviet Union. The ballot contained a single question: “Do you consider it necessary to preserve the Union of Soviet Socialist Republics as a renewed federation of equal sovereign republics, in which the rights and freedoms of a person of any nationality will be fully guaranteed?”"
 soviet_union.4.a: "The new Union will exist!"
 soviet_union.5.t: "III Congress of People’s Deputies of the RSFSR"
 soviet_union.5.desc: "At the height of the confrontation between the union center and Russian authorities, the Third (Extraordinary) Congress of People’s Deputies of the RSFSR opens. The Kremlin initiated its convocation - the task was clear: using Yeltsin’s opponents, who made up to 80% of the deputy corps, to remove him from the post of Chairman of the Supreme Soviet. However, even before the congress opened, mass agitation in support of Yeltsin unfolded across the country.\n\nA few days before work began, our authorities tried to take the situation under control. On March 25, the USSR Cabinet of Ministers banned any rallies and demonstrations in Moscow until April 15. And on March 26, Mikhail Gorbachev issued a decree removing the Moscow police from the jurisdiction of the RSFSR, directly subordinating it to the union Ministry of Internal Affairs. On the opening day of the congress, central Moscow was flooded with military equipment, police, and OMON.\n\nThe congress responded instantly: a resolution was adopted suspending both documents as violating the USSR Constitution and the Declaration of State Sovereignty of Russia. The congress interrupted its work until March 29, and then continued - with increasing pressure on the Kremlin."
 soviet_union.5.a: "Hooray!"
 soviet_union.6.t: "Troops in Moscow"
 soviet_union.6.desc: "On the eve of the opening of the III Extraordinary Congress of People’s Deputies of the RSFSR, the union leadership took unprecedented measures. On March 25, 1991, the USSR Cabinet of Ministers banned any rallies and demonstrations in Moscow until April 15. On March 26, Mikhail Gorbachev issued a decree resubordinating the Moscow police directly to the union Ministry of Internal Affairs. And on March 27, at the insistence of the KGB, the president approved the deployment of army units into Moscow. This was done for the first time in all the years of perestroika."
 soviet_union.6.a: "Oh God..."
 soviet_union.7.t: "Meeting in Geneva"
 soviet_union.7.desc: "The November morning over Lake Geneva was foggy. M. S. Gorbachev arrived at the Palace of Nations to meet with the US president - for the first time in many years we will sit down at the negotiating table without the usual rhetoric of the “Cold War.” Behind us is an exhausting arms race that drains the economy, and “Star Wars” (SDI), which threatens to make our nuclear arsenal obsolete."
 soviet_union.7.a: "Any concessions for peace."
 soviet_union.8.t: "Chernobyl Nuclear Power Plant accident"
 soviet_union.8.desc: "Today, April 26, 1986, at 1:23 a.m., a powerful explosion occurred at the fourth power unit of the Chernobyl Nuclear Power Plant during testing of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest man-made releases of radioactive substances in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 entered the atmosphere. Thousands of people took part in eliminating the consequences, many of whom received serious doses of radiation."
 soviet_union.8.a: "Eternal memory to our heroes!"
 soviet_union.9.t: "Shevardnadze - new Minister of Foreign Affairs"
 soviet_union.9.desc: "Summer 1985. You sit in your Kremlin office, sorting through dossiers of candidates for the post of Minister of Foreign Affairs. Andrei Andreyevich Gromyko - “Mr. Nyet,” a legend of Soviet diplomacy, a man who outlived eight general secretaries - agrees to give up the chair in exchange for the honorary post of Chairman of the Presidium of the Supreme Soviet. But whom to put in his place? Your gaze falls on a folder marked “Tbilisi.” Eduard Shevardnadze. First Secretary of the Central Committee of the Communist Party of Georgia. A man you have known since Komsomol times - then you walked together along the Black Sea shore and talked about how “we cannot live like this any longer.” He is not a diplomat. He does not know foreign languages. He has never been abroad. Gromyko, horrified, proposes replacing him with the most experienced ambassador to the USA, Anatoly Dobrynin."
 soviet_union.9.a: "An ideal candidate"
 soviet_union.10.t: "Anti-alcohol campaign"
 soviet_union.10.desc: "In 1985, the fight against drunkenness becomes our priority. The CPSU Central Committee resolution “On overcoming drunkenness and alcoholism” envisages a radical reduction in the production and sale of alcohol, closure of wine shops, repurposing of factories, and the creation of mass temperance societies. The success of the campaign will strengthen the nation’s health, but will hit the budget (loss of excise taxes) and cause growing discontent among the population, but this is a forced measure. In the long term - lower mortality and higher birth rates, but in the short term - the risk of social tension and a flourishing of moonshining."
 soviet_union.10.a: "It was a forced measure"
 soviet_union.11.t: "Gorbachev - President of the USSR"
 soviet_union.11.desc: "March 1990. Our country is suffocating in the grip of economic crisis, nationalist movements are shaking the union republics, and the old party-Soviet system of governance is cracking. Under these conditions, the Extraordinary III Congress of People’s Deputies of the USSR adopts a fateful decision - to establish the post of President of the Soviet Union and elect the first head of state."
 soviet_union.11.a: "Let us support Gorbachev. Let him become president!"
 soviet_union.12.t: "Unrest in the union republics"
 soviet_union.12.desc: "“1990 enters the history of the USSR as the year of the ‘parade of sovereignties.’ One after another, union republics adopt Declarations of State Sovereignty, declaring the supremacy of their laws over all-union laws. The Baltics demand the immediate withdrawal of troops, Armenia and Azerbaijan have been living for several years in a state of frozen conflict over Nagorno-Karabakh, Georgia boycotts referendums, and Moldova balances on the brink of civil war between Moldovans and Gagauz. \nRallies and strikes sweep across the country. In Tbilisi demonstrators demand independence, in Dushanbe - the resignation of local leadership, in Kyiv - the revival of the Ukrainian Autocephalous Church. Central authorities are losing control of the situation, and the economy, already weakened by crisis, is falling apart due to the rupture of economic ties between republics."
 soviet_union.12.a: "The Union must be indivisible"
 soviet_union.13.t: "Declaration of State Sovereignty of the RSFSR"
 soviet_union.13.desc: "June 12, 1990. At the height of the “parade of sovereignties,” when the Baltic republics had already declared withdrawal from the Union, and Ukraine was preparing its own Declaration, the First Congress of People’s Deputies of the RSFSR adopts a historic document - the Declaration of State Sovereignty of the Russian Soviet Federative Socialist Republic."
 soviet_union.13.a: "Let Russia be the center of the renewed federation"
 soviet_union.14.t: "XXVII Congress of the CPSU"
 soviet_union.14.desc: "On February 25, 1986, the XXVII Congress of the Communist Party of the Soviet Union opens in the Kremlin Palace of Congresses. This is the first party forum after Mikhail Gorbachev came to power, and it immediately becomes an arena of sharp political struggle between conservatives and supporters of reform."
 soviet_union.14.a: "Let us give way to Perestroika!"
 soviet_union.15.t: "Visit to Hungary"
 soviet_union.15.desc: "June 8, 1986. An Il-62 aircraft with tail number CCCP-86494 lands at Budapest Ferihegy Airport. Mikhail Sergeyevich Gorbachev, General Secretary of the CPSU Central Committee, arrives on his first foreign visit to a socialist country after the Chernobyl disaster - and chooses Hungary for it, the most liberal of the Warsaw Pact countries. The meeting with the Hungarian leadership will last about four days, including participation in a meeting of the Political Consultative Committee of the Warsaw Pact member states."
 soviet_union.15.a: "Let us support reforms in Hungary"
 soviet_union.16.t: "Crash of Aeroflot Flight 2306 in the Komi ASSR"
 soviet_union.16.desc: "On July 2, 1986, 75 kilometers from Syktyvkar, in the dense forests of the Sysolsky district, a Tu-134AK operating flight No. 2306 on the route Vorkuta - Syktyvkar - Moscow crashed. Thirty-two minutes after departure from Syktyvkar, at an altitude of 5,600 meters, a “Smoke in the rear baggage compartment” alarm triggered. The flight engineer confirmed the fire, and the crew commander decided on an emergency landing. But the airliner did not reach the airfield - the fire rapidly destroyed the aircraft, and it crashed into a forest area 9.5 kilometers from the village of Kopsa.\n\nOf the 92 people on board (86 passengers, including 19 children, and 6 crew members), only 38 survived. 54 people died - some burned alive, others suffocated in the smoke before the plane touched the ground. Survivors waited for help for hours: a rescue helicopter arrived only after three hours, and full evacuation began after seven.\n\nThe investigation established that the cause of the fire was most likely a disassembled Ural chainsaw that two Bulgarian citizens carried in their hand luggage. A fuel tank with remaining fuel was found at the crash site in the rear baggage compartment area. Baggage screening at Vorkuta airport was not carried out."
 soviet_union.16.a: "Rest in peace..."
 soviet_union.17.t: "Sinking of the steamship Admiral Nakhimov in the Black Sea"
 soviet_union.17.desc: "On August 31, 1986, at 23:12, the cruise steamship Admiral Nakhimov, with 1,243 people on board, collided with the cargo ship Pyotr Vasev in Tsemes Bay near Novorossiysk. The impact struck the starboard side of the steamship, creating a hole 10 meters high and more than 8 meters long - about 90 square meters. Water rushed into the open portholes, and after seven to eight minutes the vessel sank four kilometers from shore. 836 people were saved, 423 died - 359 passengers and 64 crew members. The largest catastrophe in the history of the domestic passenger fleet occurred at the height of perestroika, in direct sight of the shore, in clear weather and with navigation equipment. Both captains were subsequently given suspended sentences."
 soviet_union.17.a: "Rest in peace..."
 soviet_union.18.t: "“Song marches” in the Baltics"
 soviet_union.18.desc: "Second half of the 1980s. The policy of glasnost opens the floodgates for long-suppressed historical memory. In Estonia, Latvia, and Lithuania, mass events dedicated to the victims of Stalinist repressions and deportations take place one after another. What began as cultural actions - song festivals, concerts, patriotic evenings - rapidly acquires political meaning. \nIn 1987, the first open rallies dedicated to the anniversaries of the mass deportations of 1941 and 1949 take place in Tallinn and Riga. People take to the streets with flowers and photographs of relatives who died in camps. In Lithuania, the Sąjūdis movement organizes tens of thousands-strong gatherings where songs about deportations and calls to restore justice are heard. \nThe culmination of this process is the Baltic Way on August 23, 1989 - the 50th anniversary of the signing of the Molotov-Ribbentrop Pact. About two million people, holding hands, form a living chain almost 670 kilometers long, connecting Tallinn, Riga, and Vilnius."
 soviet_union.18.a: "We will limit ourselves to introducing a garrison for observation"
 soviet_union.19.t: "Decree “On the establishment of the State Committee for Nature Protection”"
 soviet_union.19.desc: "A decree has been signed on the creation of the State Committee for Environmental Protection. After decades of reckless industrialization, the country has faced a terrifying ecological situation. Rivers poisoned by industrial waste, dying forests, the aftermath of Chernobyl and the dried-up Aral Sea — all this can no longer be hushed up. People are tired of breathing the exhaust of metallurgical plants and drinking water with heavy metal impurities.\n\nThe creation of the committee is not only an attempt to save nature, but also an important political step. The Republic is taking control over ecology from the union ministries, demonstrating its independence. However, creating an agency on paper is easy — it is much harder to give it real powers. Ahead lies a hard struggle with the industrial lobby, which demands not closing factories for the sake of saving rare animal species. If we want this committee to become a real force and not a decorative facade, we will have to take unpopular measures."
 soviet_union.19.a: "Correct!"
 soviet_union.20.t: "Gorbachev’s visit to Czechoslovakia"
 soviet_union.20.desc: "Gorbachev’s visit to Czechoslovakia"
 soviet_union.20.a: "Long live Gorbachev!"
 soviet_union.21.t: "Election of Dmitry Yazov"
 soviet_union.21.desc: "Election of Dmitry Yazov"
 soviet_union.21.a: "Hooray!"
 soviet_union.22.t: "Rally of “Democratic Russia” on Manezhnaya Square in Moscow"
 soviet_union.22.desc: "Early 1990s. Manezhnaya Square in Moscow is filled with tens of thousands of people. Above the crowd are tricolor flags and banners of reformers. Speakers replace one another, the square hums with applause and shouts. The atmosphere is electrified: the country demands change, and this rally becomes visible proof that the old era is passing. This is a battle for a new history."
 soviet_union.22.a: "For democratic Russia!"
 soviet_union.23.t: "Mikhail Gorbachev’s authority is falling"
 soviet_union.23.desc: "Late 1980s. Only yesterday Mikhail Gorbachev was the idol of millions - a symbol of renewal and hope. But today his ratings are rapidly falling. Reforms that are too slow disappoint liberals, too radical ones frighten conservatives. In lines and in kitchens the same thing is increasingly heard: “He can’t cope.”\n\nThe press, which not long ago praised the general secretary, is now full of critical articles. Discontent is growing in the regions, and a conspiracy is brewing in the party elite. Gorbachev’s authority is melting by the day - the country is tired of waiting, and he rushes between two fires, losing control of the situation."
 soviet_union.23.a: "Down with Gorbachev!"
 soviet_union.24.t: "XIX All-Union Conference of the CPSU"
 soviet_union.24.desc: "The XIX All-Union Conference of the CPSU has begun in Moscow, becoming the most important milestone in the history of Perestroika. Delegates gathered in the Kremlin Palace of Congresses faced an unprecedented level of openness and sharpness of discussions for the Soviet era. The main topic on the agenda was a fundamental reform of the USSR political system, aimed at breathing new life into stagnating state institutions and delineating the functions of party bodies and Soviets. From the conference tribune, Mikhail Gorbachev proclaimed a course toward transferring power from party committees to elected Soviets of People’s Deputies, creating a new Congress of People’s Deputies, and introducing alternative elections. During heated debates, delegates openly discussed the growing crisis of interethnic relations in the republics, problems of glasnost, the fight against bureaucratism, and the need to prepare a new Union Treaty. The main event of the conference was a harsh political clash when Boris Yeltsin sharply criticized the slow pace of reforms and party privileges, and the leader of the conservative wing, Yegor Ligachev, threw back the historic “Boris, you are wrong!” defending the foundations of the Soviet system."
 soviet_union.24.a: "OK"
 soviet_union.25.t: "Gorbachev’s visit to China"
 soviet_union.25.desc: ""
 soviet_union.25.a: "Hooray!"
 soviet_union.26.t: "Elections of People’s Deputies of the USSR"
 soviet_union.26.desc: ""
 soviet_union.26.a: "OK"
 soviet_union.27.t: "III Congress of People’s Deputies of the USSR"
 soviet_union.27.desc: "On March 12, the III Congress of People’s Deputies of the USSR was held in Moscow. The main issues were: the introduction of the post of President of the USSR and his election, elections of the Chairman of the Supreme Soviet of the USSR, and amendments to the Constitution abolishing the one-party system in the USSR and the leading role of the CPSU. From Article 6 of the USSR Constitution, mention of the leading role of the CPSU was officially removed. According to the changes and additions adopted to the Constitution, the President of the USSR is elected by USSR citizens on the basis of universal, equal, and direct suffrage by secret ballot for a term of 5 years. On March 14, a plenum of the CPSU Central Committee was held, nominating Gorbachev as a presidential candidate. The candidacies of Premier Nikolai Ryzhkov and Minister of Internal Affairs Vadim Bakatin were also nominated, but they declined their candidacies and the elections turned out non-alternative. On March 15, 1990, M. S. Gorbachev was elected first President of the USSR by non-alternative vote at the Congress. Of 2,245 deputies (five seats of which were vacant), 2,000 participated in the congress. 1,329 votes were cast for Gorbachev (59.2%), and 495 against. 54 ballots were spoiled. And 122 deputies refused to vote."
 soviet_union.27.a: "Hooray!"
 soviet_union.28.t: "XXVIII Congress of the CPSU"
 soviet_union.28.desc: ""
 soviet_union.28.a: "OK"
 soviet_union.29.t: "Plenum of the CPSU Central Committee"
 soviet_union.29.desc: ""
 soviet_union.29.a: "OK"
 soviet_union.30.t: "Gorbachev’s visit to the FRG"
 soviet_union.30.desc: ""
 soviet_union.30.a: "OK"
 soviet_union.31.t: "Gorbachev’s visit to Paris"
 soviet_union.31.desc: ""
 soviet_union.31.a: "OK"
 soviet_union.32.t: "IV Congress of People’s Deputies of the USSR"
 soviet_union.32.desc: "In December the IV Congress of People’s Deputies of the USSR was held, one of the main issues of which was the preservation of the USSR as a union state. The USSR Presidential Council was abolished. The Cabinet of Ministers was subordinated to the President. Gorbachev’s constitutional reform was adopted, and by decisions of the congress its name was preserved, and it was announced that a referendum would be held on preserving the state itself as a “renewed federation of equal sovereign republics.” For this purpose a law on nationwide voting in the USSR was adopted. The congress established the post of vice president, to which Gennady Yanayev was elected. Veniamin Yakovlev was elected chairman of the Supreme Arbitration Court, Nikolai Trubin was confirmed as Prosecutor General of the USSR."
 soviet_union.32.a: "OK"
 soviet_union.33.t: "IV Congress of People’s Deputies of the RSFSR"
 soviet_union.33.desc: ""
 soviet_union.33.a: "OK"
 soviet_union.34.t: "Final meeting at Novo-Ogaryovo"
 soviet_union.34.desc: ""
 soviet_union.34.a: "OK"
 soviet_union.35.t: "Death of Viktor Tsoi"
 soviet_union.35.desc: "The tragic news swept through all 15 republics like an icy wind: Viktor Tsoi died in a car accident at the 35th kilometer of the Sloka - Talsi highway. For millions of Soviet citizens, tired of endless lines, party rhetoric, and an uncertain future, his Moskvich became the final point of an era of hope. The voice of an entire generation fell silent forever, leaving behind only an echo on broken staircases."
 soviet_union.35.a: "Rest in peace, legend..."
 soviet_union.36.t: "Election of the President of the RSFSR"
 soviet_union.36.desc: ""
 soviet_union.36.a: "We choose Yeltsin!"
 soviet_union.37.t: "OK"
 soviet_union.37.desc: "OK"
 soviet_union.37.a: "OK"
 soviet_union.38.t: "Belovezha Accords"
 soviet_union.38.desc: ""
 soviet_union.38.a: "We will not let the USSR collapse completely!"
 soviet_union.38.b: "The USSR can no longer be saved."
 soviet_union.39.t: "State Committee for the State of Emergency"
 soviet_union.39.desc: "The crisis in the Union leadership has reached its peak. In an attempt to stop decentralization and the collapse of the state, security officials and the conservative wing of the party take power into their own hands. A state of emergency is declared, troops are brought into Moscow. Members of the GKChP declare that the policy of Perestroika has reached a dead end and take responsibility for the country’s future."
 soviet_union.39.a: "We will not let the USSR collapse!"
 soviet_union.40.t: "Yeltsin’s speech on the tank"
 soviet_union.40.desc: "Boris Yeltsin led the resistance to the coup in Moscow. Climbing onto a tank in front of the White House, he sharply condemned the GKChP, calling their actions illegal. This step caused a powerful wave of civil protest, demoralized the conspirators, and forced some military units to side with the defenders of the White House, sharply changing the balance of forces in our country."
 soviet_union.40.a: "Everything is under control."
 soviet_union.41.t: "Swan Lake on all channels..."
 soviet_union.41.desc: "The morning began with a strange silence. Instead of the usual morning news, cheerful programs, and entertainment shows, TV screens across the country are looping a broadcast of the ballet Swan Lake. Attempts to switch channels lead nowhere - little swans dance everywhere. Radio stations are also silent or play classical music.\n\nThe experience of past years suggests to citizens that ballet on screens never appears for no reason - usually it means the death of a general secretary or the deepest crisis at the top of power. Telephones work intermittently, and alarming rumors reach us from the capital about columns of armored vehicles. Perhaps a coup is being prepared in our country..?"
 soviet_union.41.a: "What is happening..?"
 something_is_definitely_wrong: "§RSomething is definitely wrong...§!"
 soviet_union.42.t: "Disbandment of the GKChP"
 soviet_union.42.desc: "The August coup suffered a crushing defeat. The inability of the Committee members to decide on storming the White House, mass protests by citizens, and the transfer of key army units to the side of democracy’s defenders completely demoralized the conspirators.\n\nThe attempt to preserve the old order by force failed within just a few days. Vice President Yanayev signed a decree dissolving the State Committee for the State of Emergency, and all its participants were immediately arrested on charges of treason against the Motherland. Power finally passes into the hands of the victors, but the fate of the Union itself now hangs by a thread."
 soviet_union.42.a: "We cannot be broken!"
 soviet_union.43.t: "December 25, 1991"
 soviet_union.43.desc: "“Dear compatriots! Fellow citizens! Due to the current situation with the formation of the Commonwealth of Independent States, I am ceasing my activity as President of the USSR. I take this decision on principle.\n\nI firmly advocated the sovereignty of the republics, but at the same time for preserving the union state. Events took a different course. The line toward dismembering the country prevailed, with which I cannot agree. Now the main thing is to do everything so that this process does not turn into a fratricidal war.\n\nWe now live in a new world. The Cold War is over, the insane militarization of the country has been stopped. The threat of world war has been removed. We opened ourselves to the world, and the world responded with trust and respect. Peoples and nations received real freedom of choice.\n\nHowever, the changes took place in a sharp struggle. The old system collapsed before the new one could begin to work, and the crisis of society intensified even more. I know that because of enormous difficulties I am subjected to severe criticism. But what has been done has yet to be assessed.\n\nI leave my post with anxiety, but also with hope, with faith in your wisdom and strength of spirit. There were probably mistakes. But I am sure: sooner or later our common efforts will bear fruit. I wish all of you the very best.”"
 soviet_union.43.a: "Farewell forever, last love..."
 soviet_union.44.t: "Compromise with Yeltsin"
 soviet_union.44.desc: ""
 soviet_union.44.a: "We had better keep Yanayev"
 soviet_union.44.b: "We will stay on Yeltsin’s side"
 soviet_union.45.t: "New Union Treaty"
 soviet_union.45.desc: "The long crisis of the party structure and the growing desire of the republics for independence have brought us to a historic crossroads. The old union model has outlived itself. In the halls of the Kremlin, after exhausting debates and difficult compromises, a new Union Treaty was signed. Rigid centralization is replaced by a Union of Sovereign States.\n\nFrom now on the sovereign republics voluntarily delegate to us only issues of foreign policy, strategic defense, and security, while preserving full internal autonomy and the right to their own economic reforms. The old Soviet monolith is transforming into a flexible but powerful confederation. Will we be able to withstand external threats and internal contradictions, or will this step become the beginning of the end of a great power? The future will show."
 soviet_union.45.a: "Long live the renewed Union!"
 soviet_union.46.t: "Death of Boris Yeltsin"
 soviet_union.46.desc: ""
 soviet_union.46.a: ""
 soviet_union.47.t: "December events in Alma-Ata"
 soviet_union.47.desc: "On December 17, 1986, mass demonstrations by students and youth begin on Brezhnev Square in Alma-Ata against the appointment of Gennady Kolbin as First Secretary of the Communist Party of Kazakhstan. This becomes the first major national protest in the USSR during perestroika, exposing acute contradictions between the union center and republican elites."
 soviet_union.47.a: "We had better begin an investigation"
 soviet_union.47.b: "Harshly suppress the rebellion. Order at any cost."
 soviet_union.48.t: "Plan “Blizzard-1986”"
 soviet_union.48.desc: "Today, the USSR law enforcement agencies have begun implementing a special operational plan codenamed 'Metel-1986' (Blizzard-1986). Developed by the USSR Ministry of Internal Affairs even before the protests began, this plan provided for the suppression of demonstrations by Kazakh youth in Alma-Ata with the involvement of three combined detachments reinforced by armored personnel carriers and fire trucks. The first dispersal of the demonstration was attempted on December 17 around 6:00 PM using batons, but the main forces were deployed the following day. Cadets of the border patrol academy and internal troops wielded entrenching shovels, shields, and batons. Dozens, perhaps even hundreds of young people were left lying in the square, many of them covered in blood. Subsequently, historians classified this operation as a military-political venture of a nationwide scale, and the fundamental documents of the plan were destroyed."
 soviet_union.48.a:	"Excellent."
 soviet_union.49.t:	"Events in Novy Uzen"
 soviet_union.49.desc:	"On June 16, 1989, at the dance floor of the 'Stroitel' club in the oil-producing city of Novy Uzen, a fight broke out between local Kazakhs and people from the Caucasus. The conflict, which arose from a mundane domestic dispute, rapidly escalated into mass interethnic clashes that engulfed the entire city and adjacent areas of the Mangyshlak Peninsula."
 soviet_union.49.a:	"We'd better send in the troops. It will be better for everyone."
 soviet_union.49.b:	"We will do nothing. The conflict will resolve itself."
 soviet_union.50.t:	"Deployment of Soviet Troops"
 soviet_union.50.desc:	"On June 20, 1989, additional units of the USSR Ministry of Internal Affairs' internal troops and army units stationed in the Central Asian Military District were deployed to the oil city of Novy Uzen (Mangyshlak Region of the Kazakh SSR). The decision was made the day after the start of mass interethnic clashes between local Kazakhs and people from the Caucasus. A curfew has been established in the city, the movement of citizens at night is prohibited, and street patrolling has been intensified using armored vehicles and all-terrain vehicles. Troops are blocking entry and exit points of the city, conducting identity checks, and confiscating weapons from the population."
 soviet_union.50.a:	"Acknowledged!"
 soviet_union.51.t:	"Protests Intensify"
 soviet_union.51.desc:	"The conflict, which arose from a mundane domestic dispute, rapidly escalated into mass interethnic clashes that engulfed the entire city and adjacent areas of the Mangyshlak Peninsula."
 soviet_union.51.a:	"We need to do something!"
 soviet_union.52.t:	"Protests Subside"
 soviet_union.52.desc:	"The conflict, which arose from a mundane domestic dispute and rapidly escalated into mass interethnic clashes engulfing the entire city and adjacent areas of the Mangyshlak Peninsula, is, fortunately for us, subsiding."
 soviet_union.52.a:	"Very good."
 soviet_union.53.t:	"Fergana Pogroms"
 soviet_union.53.desc:	"Today, in the city of Kuvasay, Fergana Region of the Uzbek SSR, a fight broke out between Uzbek and Meskhetian Turk youth, marking the beginning of the largest interethnic conflict in the USSR since the era of deportations. The trigger was a mundane dispute at a marketplace—a Turkish customer knocked over a plate of strawberries belonging to an Uzbek saleswoman, which sparked an altercation that escalated into a mass clash."
 soviet_union.53.a:	"Oh, my god..."
 soviet_union.54.t:	"Deployment of Militia to Kuvasay"
 soviet_union.54.desc:	"On May 23, 1989, additional militia forces of over 300 personnel, redeployed from neighboring districts, entered the city of Kuvasay in the Fergana Region of the Uzbek SSR to suppress the renewed mass clashes between Uzbek and Meskhetian Turk youth. Earlier, on May 16–18, fights between the youth of the two nationalities had already occurred in the city, but on May 23, the conflict flared up with renewed vigor and escalated into major clashes that lasted for two days. In addition to the militia, more than 9,000 servicemen of the USSR Ministry of Internal Affairs' internal troops were sent to the Fergana Region to normalize the situation and maintain public order. During the clashes, 103 people were killed, more than a thousand were injured, and 110 militia workers were wounded, one of whom passed away."
 soviet_union.54.a:	"Acknowledged."
 soviet_union.55.t:	"Pogroms Intensify"
 soviet_union.55.desc:	"The scale of the clashes in the Fergana Region of the Uzbek SSR has reached a critical point. Following Kuvasay, the pogroms spread to Fergana, Margilan, Kokand, and dozens of suburban villages, turning into uncontrollable interethnic cleansing. Crowds numbering up to several thousand people blocked streets, set residential neighborhoods on fire, and ransacked enterprises and institutions. Militia detachments proved unable to contain the rampaging crowd—in 2 days, more than 300 attacks on the homes of Meskhetian Turks were registered, and 80 percent of the housing stock in some microdistricts was destroyed by fire. The threat of violence forced thousands of families to flee their homes in panic; many took refuge at railway stations and in military units. In response to the escalation, a curfew was introduced in the region on June 1, and additional units of the internal troops began clearing the streets using armored vehicles."
 soviet_union.55.a:	"Heavy..."
 soviet_union.56.t:	"Mass Riots in Dushanbe"
 soviet_union.56.desc:	"On February 10, 1990, mass riots began in Dushanbe, the capital of the Tajik SSR, lasting for four days and becoming one of the bloodiest interethnic conflicts on the territory of the USSR during the Perestroika period. The trigger for thousands of people taking to the streets was a rumor that the republic's authorities would allocate apartments out of turn to several thousand Armenian refugees from Baku, who had fled the pogroms—at a time when the city was experiencing an acute housing shortage. In reality, only about 50 people had arrived in the capital of Tajikistan. On February 11, about 4,000 people gathered near the Central Committee of the Communist Party of Tajikistan building chanting 'Down with Armenians!', and after the Armenian families hastily left the city, the crowd began demanding the resignation of the republic's leadership."
 soviet_union.56.a:	"What is this again..."
 soviet_union.57.t:	"Osh Events"
 soviet_union.57.desc:	"In late May 1990, one of the bloodiest interethnic conflicts in the history of the USSR—the Osh Massacre—began in the south of the Kirghiz SSR, in the densely populated Fergana Valley. The trigger was a land dispute: low-income young Kyrgyz demanded that they be provided with plots for housing construction on the lands of the Lenin collective farm near Osh. The authorities agreed to satisfy this demand, but the Uzbek population, who constituted the majority in the city, perceived this as an infringement on their rights."
 soviet_union.57.a:	"Geez"
 soviet_union.58.t:	"NKAO Status"
 soviet_union.58.desc:	""
 soviet_union.58.a:	"NKAO is Armenia!"
 soviet_union.58.b:	"NKAO is historically Azerbaijani territory!"
 soviet_union.59.t:	"Affairs of the Union Republics"
 soviet_union.59.desc:	""
 soviet_union.59.a:	"The Union must be indivisible."
 soviet_union.60.t: "Replacement of Old Tikhonov"
 soviet_union.60.desc: "1985. Nikolai Tikhonov is 80 years old, hopelessly ill and unable to cope with the duties of Chairman of the Council of Ministers. Grigory Romanov, who recently became General Secretary, understands: Tikhonov cannot be left as premier — the economy is stagnating, the apparatus is sabotaging decisions, and discontent is brewing in the Politburo. A new head of government is needed who will carry out Romanov's course and at the same time satisfy the key factions in the Central Committee.\n\nThree candidates are under consideration. Lev Zaikov — a Leningrad protege, Romanov's man, a supporter of strict discipline and the fight against corruption. Vladimir Dolgikh — a heavyweight from heavy industry, a conservative enjoying the support of the old guard, but not inclined toward reforms. Oleg Baklanov — Central Committee secretary for the defense industry, a hardline supporter of military spending and the priority of the military-industrial complex over everything else."
 soviet_union.60.a: "Lev Zaikov — an excellent candidate."
 soviet_union.60.b: "Vladimir Dolgikh — we need a strong military-industrial complex."
 soviet_union.60.c: "Oleg Baklanov — mechanical engineering, everything for the people!"
 soviet_union.61.t: "Romanov's Visit to Volgograd"
 soviet_union.61.desc: "Grigory Romanov, who recently became General Secretary, makes his first tour of the country — to Volgograd. A hero city, a symbol of the Stalingrad victory, but now a major industrial center where the state of affairs is far from exemplary. At the Volgograd Tractor Plant the plan is being missed, at Red October there is theft and drunkenness, and the local obkom, according to KGB data, is mired in corruption. Romanov visits factories, meets with workers and party activists, and everywhere hears the same thing: discipline has collapsed, directors think only of personal enrichment, and the obkom covers for them."
 soviet_union.61.a: "We had a different opinion..."
 soviet_union.62.t: "The Afghanistan Question"
 soviet_union.62.desc: "The Afghan war is in its sixth year. The Politburo once again discusses Afghanistan: the DRA army cannot hold the country on its own, the mujahideen receive weapons from Pakistan and the USA, and Soviet troops are suffering losses. Romanov receives two reports. The General Staff proposes a major special operation: strikes by special forces and airborne troops against bases and caravan routes, elimination of field commanders, blockade of the border with Pakistan. The Foreign Ministry and part of the Politburo insist on a phased withdrawal of troops under the Geneva agreements, before the war becomes definitively unpopular."
 soviet_union.62.a:	"We will withdraw the troops; it is a humane decision."
 soviet_union.62.b:	"We will conduct a special operation; we are fighting terrorism!"
 soviet_union.63.t:	"Party Infighting"
 soviet_union.63.desc:	""
 soviet_union.64.a:	"It's clear."
 soviet_union.64.t:	"Romanov's Visit to China"
 soviet_union.64.desc:	""
 soviet_union.64.a:	"Greetings, Chinese comrades."
 soviet_union.65.t:	"Confrontation with China"
 soviet_union.65.desc:	""
 soviet_union.65.a:	"They are not communists!"
 soviet_union.66.t:	"USS Offers Cooperation"
 soviet_union.66.desc:	""
 soviet_union.66.b:	"We will politely decline"
 soviet_union.67.t:	"[FROM.GetNameDef] Agreed"
 soviet_union.67.desc:	""
 soviet_union.67.a:	"Excellent!"
 soviet_union.68.t:	"[FROM.GetNameDef] Declined"
 soviet_union.68.desc:	""
 soviet_union.68.a:	"Worse for them."
 soviet_union.69.t:	"USS Allows National Guard"
 soviet_union.69.desc:	""
 soviet_union.69.a:	"Hooray!"
 soviet_union.70.t:	"Yeltsin's Victory in the USS"
 soviet_union.70.desc:	""
 soviet_union.70.a:	"Hello, Boris Nikolayevich."
 soviet_union.71.t:	"Nazarbayev's Victory in the USS"
 soviet_union.71.desc:	""
 soviet_union.71.a:	"Hello, Comrade Nazarbayev."
 soviet_union.72.t:	"Strong and Independent"
 soviet_union.72.desc:	""
 soviet_union.72.a:	"Hooray!"
 soviet_union.73.t:	"In Beijing"
 soviet_union.73.desc:	"A rare silence for diplomatic meetings hung in the spacious hall of the Great Hall of the People in Beijing. Across the long table sat the men in whose hands lay the fate of the socialist camp. Gennady Yanayev, Chairman of the Supreme Soviet of the USSR, who had held the country back from the edge of the abyss after the turbulent events of the early nineties, looked intently into the face of Deng Xiaoping. The architect of Chinese reforms looked calm, but his penetrating gaze betrayed intense mental effort. Old grievances from the times of Khrushchev and Brezhnev, the Damansky Island border conflict, and ideological disputes had divided the two great powers for far too long.\n\nYanayev spoke first, emphasizing that the renewed Union had learned lessons from past mistakes and was ready to respect China's distinct path combining socialism with a market economy. Deng Xiaoping nodded slowly, pausing. Beijing needed a stable, predictable northern neighbor, not chaos at its borders, as well as a reliable partner in confronting Western hegemony. Pragmatism triumphed over former dogmas.\n\nAs the leaders stood up for the final handshake, it became clear: the Sino-Soviet split had come to an end. The two giants of Eurasia resolutely stepped toward each other, ready to rewrite the balance of power on the world stage."
 soviet_union.73.a:	"Comrade Deng Xiaoping."
 soviet_union.74.t:	"XXX Congress of the CPSU"
 soviet_union.74.desc:	"The vast hall of the Kremlin Palace of Congresses drowned in applause. Stepping up to the podium, Gennady Yanayev, General Secretary of the Central Committee of the CPSU, scanned the thousands of delegates who had arrived from all corners of the Soviet Union, which had withstood the storms. Left behind were the chaos of the early nineties, economic uncertainty, and the threat of collapse. This congress, receiving the thirtieth, milestone anniversary number, was meant to officially secure the contours of 'renewed socialism.'\n\nIn his report, Yanayev stressed that the party had managed to purge its ranks and learn lessons from the past mistakes of Perestroika. The new program proclaimed a pragmatic balance: maintaining a tight state vertical and planned control over strategic industries, while simultaneously legalizing regulated market elements in light industry.\n\nThe delegates faced the task of not just voting for routine five-year plans, but approving a new ideological doctrine. The Communist Party had finally transformed from a clumsy bureaucratic machine into the vanguard of sovereign modernization in Eurasia. The flashes of cameras captured this moment for history: the party, which the world had already managed to bury, is starting its new countdown."
 soviet_union.74.a:	"Hooray! The USSR is still alive!"
 soviet_union.75.t:	"USSR Offers an Armistice"
 soviet_union.75.desc:	"The Red Storm, driven by the fanatical will of General Secretary Grigory Romanov, has temporarily subsided, leaving Western Europe in ruins. The onslaught of the renewed, ruthless Red Army proved unstoppable for NATO forces: Soviet tank wedges ground to a halt only upon reaching the English Channel and completely locking down the Baltic Sea.\n\nThe President and the Joint Chiefs of Staff, shocked by the rapid fall of our key European allies, were forced to enter into a humiliating deal in Copenhagen to save the remnants of the free world from total destruction on the continent.\n\nThe terms of the Soviet ultimatum sound like a death sentence for American geopolitics: the Red Army officially occupies and integrates the territories of West Germany (FRG), the Benelux countries, and Denmark into its sphere. In return, the United States receives 120 days of ceasefire. Throughout Washington, it is openly admitted—this is not peace. This is merely a breathing room before the inevitable finale.\n\nWhile Soviet commissars establish their order on the banks of the Rhine, the Pentagon has exactly four months to regroup the fleet, mobilize industry, and prepare millions of recruits. The clock is ticking. The armistice will expire, and the world will drown in the final phase of the Third World War..."
 soviet_union.75.a:	"Yes, we need an armistice right now."
 soviet_union.75.b:	"No way!"
 soviet_union.76.t:	"USA Agreed to Peace"
 soviet_union.76.desc:	"American imperialism has retreated before the crushing might of Soviet weapons! News that the entire socialist bloc had been waiting for arrived from Washington: the White House has officially accepted the terms of our ultimatum. The Red Storm, unleashed by the iron will of Comrade Grigory Romanov, broke through NATO's defense, and the glorious Red Army crushed the capitalist regimes, reaching the shores of the English Channel.\n\nAccording to the Copenhagen Protocol, the entire territory of West Germany (FRG), the Benelux, and Denmark passes under the full control of the Soviet Union. The vaunted NATO bloc has effectively ceased to exist in continental Europe, and the Baltic Sea has turned into an internal lake of the USSR. In return, the United States received 120 days of ceasefire.\n\nExultation reigns in the Kremlin and on the streets of Moscow, but the General Secretary and the Stavka understand: this is not a final peace. The capitalists are merely trying to buy time to regroup their forces overseas. The Red Army has exactly four months to entrench itself on the new frontiers, restructure European industry for the needs of the front, and prepare the final blow against the stronghold of capitalism!"
 soviet_union.76.a:	"Excellent, American comrades."
 soviet_union.77.t:	"USA Rejected Our Terms"
 soviet_union.77.desc:	"The imperialist predators in Washington have made their choice—they chose total destruction. An official rejection of the peace terms of the Copenhagen Protocol came from the White House. The American leadership blindly believes it can hold the continent and refused to recognize the transfer of West Germany (FRG), the Benelux, and Denmark to our control.\n\nGeneral Secretary Grigory Romanov's reaction was instant and merciless. There will be no armistice. The Red Army no longer has any reason to restrain its onslaught. Across the entire front line—from the Baltic straits to the banks of the Rhine—thousands of artillery guns roared. The deployed tank divisions and motorized rifle corps received a laconic order from the Stavka: crush any remnants of NATO forces in Western Europe and throw the American troops back into the Atlantic.\n\nThe masks are off. The war will not stop for a single day. We will go to the very end, even if it means turning Washington into radioactive ash!"
 soviet_union.77.a:	"We knew it! Damn capitalists!"
 soviet_union.78.t:	"Dissolution of the Warsaw Pact"
 soviet_union.78.desc:	"In Prague's Czernin Palace, representatives of the USSR, Bulgaria, Hungary, Poland, Romania, and Czechoslovakia put their signatures to the protocol on the complete termination of the Warsaw Pact. Mikhail Gorbachev called this decision 'a step toward pan-European security,' but behind the scenes of the Kremlin offices, the weight of the loss is clearly felt. The Red Shield over Eastern Europe has been lowered for good. The buffer zone is lost, and yesterday's allies are looking to the West in search of new guarantees."
 soviet_union.78.a:	"Then it must be so."
 soviet_union.79.t: "Uprising in Ukraine"
 soviet_union.79.desc: "While Soviet divisions are bogged down in a full-scale war in Afghanistan, something the KGB had long feared has erupted in the western regions of Ukraine. OUN cells have become active. Taking advantage of the fact that internal troops garrisons have been transferred to the south, the nationalists have moved from underground propaganda to direct action. Leaflets calling for a boycott of the spring conscription are being distributed in the cities. Local party organs report panic, and the head of the regional KGB directorate demands the immediate introduction of a curfew. The Afghan adventure has drained resources, and it will not be possible to hold the region with little bloodshed alone. This is not ordinary hooliganism, but an organized rebellion against Soviet power."
 soviet_union.79.a: "Send in the troops!"
 soviet_union.80.t: "Uprising in the Baltics"
 soviet_union.80.desc: "While the best divisions are thrown into Afghanistan, mass unrest has erupted in the Baltics.\n\nIn Vilnius, Riga and Tallinn, tens of thousands of people have taken to the streets under nationalist slogans. Local authorities are paralyzed: the police cannot cope, and part of the party apparatus of the republics openly sympathizes with the separatists. The situation is heating up. Spontaneous strikes demanding withdrawal from the USSR are beginning at factories. The 'Interfronts' — pro-Russian workers' detachments ready to disperse the nationalists by force — have become more active, but they have no weapons. Moscow demands the immediate restoration of constitutional order. However, according to the General Staff, transferring even one motorized rifle division from near Kabul to the Baltics will weaken the Afghan grouping and cause discontent among the generals. The district headquarters awaits the order."
 soviet_union.80.a: "Once again, send in the troops!"
 soviet_union.81.t: "Crazy Prices"
 soviet_union.81.desc: "The state has let prices go. And in one night the familiar world collapsed. If yesterday a loaf of bread cost twenty kopecks, today it already costs several rubles. People storm the shops, trying to spend their devaluing money on anything at all. Savings accumulated over decades have turned to dust. Panic is growing in society, and people are beginning to ask themselves: is this really what we wanted?"
 soviet_union.81.a: "We must stay the course."
 soviet_union.81.b: "Introduce temporary price regulation on essential goods."
 soviet_union.82.t: "Miners' Strikes"
 soviet_union.82.desc: "The reforms have hit industry hard. After shock therapy, the miners of Kuzbass and Donbass began to boycott and refuse to go to work. A mass strike has begun: the mines are stopped, railway lines are blocked. They demand payment of wages and pay raises. If we do not resolve the issue now, workers from other sectors will join them, and the country will come to a final standstill."
 soviet_union.82.a: "We need to print money for the payments!"
 soviet_union.82.b: "Threaten them with force."
 soviet_union.82.c: "Pay them with shares in the enterprises."
 soviet_union.83.t: "The Birth of the Oligarchs"
 soviet_union.83.desc: "Against the backdrop of universal poverty and the collapse of industry, privatization has begun. While ordinary citizens receive vouchers and do not know what to do with them, enterprising dealers and former party functionaries buy them up for next to nothing. Plants, factories, and natural resources pass under the control of a narrow group of individuals. The newspapers write about the first 'new Russians' - the nouveau riche who in a couple of months have made fortunes on the ruins of the Soviet Union."
 soviet_union.83.a: "We must definitely support them."
 soviet_union.83.b: "Start an anti-corruption investigation right now!"
 soviet_union.83.c: "Let us bet on medium-sized business."
 soviet_union.84.t: "Brain Drain"
 soviet_union.84.desc: "While the economy is falling, an exodus of the intelligentsia from the country has begun. Scientists, engineers, doctors, and teachers, who for years carried the country on their shoulders, now receive salaries below the subsistence minimum. Western universities and corporations offer them contracts. Over the past month, embassies have issued thousands of visas. If we lose the intellectual elite, we will have nothing to rebuild technology with."
 soviet_union.84.a: "Give them freedom."
 soviet_union.84.b: "Create closed science cities."
 soviet_union.85.t: "IMF Demands"
 soviet_union.85.desc: "The International Monetary Fund is ready to provide Russia with a loan of several billion dollars to save the economy. But the conditions are harsh: a complete cut in social programs, raising the retirement age, and cutting military spending. Our Western partners demand that we go all the way in the reforms. In the Kremlin they understand: without this money we will not close the holes in the budget, but with it we will lose the support of the army and the elderly."
 soviet_union.85.a: "We agree to the IMF conditions. We have nothing to lose."
 soviet_union.85.b: "We will politely refuse the loan."
 soviet_union.86.t: "The Voice of the People"
 soviet_union.86.desc: "The results of the referendums in Lithuania, Latvia, and Estonia have finally been counted, and this is a historic victory for the entire Union. Despite the furious agitation of local nationalists and pressure from the West, the majority of the inhabitants of the republics voted to join the renewed Union of Sovereign States with the rights of broad autonomy.\n\nThe Central Election Commission reports that turnout was record-high. The position of the Russian-speaking population and the workers of large industrial enterprises, who were afraid of losing their jobs and social guarantees if they left the Union, played a huge role. In addition, the investments promised by the Kremlin and the preservation of preferential prices for energy resources did their job - people chose stability, not the vague promises of the West.\n\nIn Vilnius, Riga, and Tallinn things are uneasy now: nationalist leaders accuse Moscow of bribery and falsification, but legally the process is complete. The Baltics remain part of the USS, preserving their flags, laws, and governments, but returning to a single defense and economic space. We have proved that we can preserve the union not with tanks, but with diplomacy and mutual benefit."
 soviet_union.86.a: "We are in the union!"
 soviet_union.87.t: "The Loss of the Baltics"
 soviet_union.87.desc: "The referendums in the Baltics have failed. Despite all the efforts of our propaganda, economic concessions, and support for Russian-speaking movements, the majority of the inhabitants of Lithuania, Latvia, and Estonia voted for full independence from the Union.\n\nThese results are a heavy blow to our strategy of preserving a unified state. In Vilnius, Riga, and Tallinn crowds are now rejoicing with national flags, and local governments have already announced the beginning of international recognition. Western countries did not wait: Washington and Brussels have already congratulated the Balts on 'gaining freedom' and promised them loans. Our propaganda machine turned out to be powerless against the centuries-old striving of these peoples for independence.\n\nNow the Baltic region is a 'black hole' for our Union. We are losing vital ice-free ports, industrial enterprises, and strategic frontiers in the west. A gloomy atmosphere reigns inside the USS: hardliners demand the immediate introduction of troops and the return of the republics by force, while diplomats warn that this will lead to complete isolation and a new cold war."
 soviet_union.87.a: "We recognize their independence."
 soviet_union.88.t: "Diplomatic Failure in Tbilisi"
 soviet_union.88.desc: "The diplomatic mission in Georgia has officially failed. The government in Tbilisi has refused any negotiations on a peaceful settlement and return to the Union. Moreover, Georgian armed formations have blocked strategic roads and taken control of key infrastructure facilities.\n\nEduard Shevardnadze, who is in Tbilisi trying to keep the country from final chaos, sends us urgent requests for help. He does not control the army and cannot resist the radicals, demanding the introduction of union troops to restore order. On Georgia's northern borders the conflict is already in full flame: Abkhazia and South Ossetia have announced mobilization, preparing for a full-scale war.\n\nThe situation is a stalemate. If we do nothing, Georgia will finally turn into a hostile state on the southern frontiers, and the Caucasus will become a zone of chaos. If we send in troops, we take upon ourselves the responsibility for bloodshed in the mountains and complete international isolation. The General Staff awaits orders."
 soviet_union.88.a: "We declare war!"
 soviet_union.88.b: "We refuse to invade."
 soviet_union.89.t: "War in Georgia"
 soviet_union.89.desc: "The situation in Transcaucasia has spun out of control and turned into a bloody meat grinder. Our troops entered Tbilisi to put an end to Zviad Gamsakhurdia's adventure. His nationalist rhetoric and openly anti-union policy threatened to finally destabilize the southern borders. Gamsakhurdia's regime has fallen, he himself has fled or is hiding in the underground, and we have put the pragmatic Eduard Shevardnadze at the head of Georgia, promising to restore order and return the republic to the USS. It seemed the operation went brilliantly.\n\nHowever, we made a fatal mistake by underestimating the scale of national conflicts. Taking advantage of the chaos in Tbilisi, Abkhazia and South Ossetia declared their independence. Moreover, they began military operations against the remnants of the Georgian army loyal to Gamsakhurdia. Now our peacekeeping forces find themselves between a hammer and an anvil. On one side are Georgian nationalists who have declared us occupiers, on the other are Abkhaz and Ossetian militiamen who demand that we protect them and accept them directly into the Union.\n\nThe North Caucasus is in flames. The supply of our troops is disrupted by the fighting in the mountains. Shevardnadze begs us to help him hold Tbilisi and suppress the separatists, but if we start shooting at Abkhazians and Ossetians, we will forever lose their trust and get a guerrilla war across the entire Caucasus. We are mired in a conflict that has no simple solutions."
 soviet_union.89.a: "We will support Shevardnadze!"
 soviet_union.89.b: "We will support the autonomies!"
 SOV_chernobyl.1.t:	"Chernobyl NPP Accident"
 SOV_chernobyl.1.desc:	"On April 26, 1986, at 1:23 AM, a powerful explosion occurred at the fourth power unit of the Chernobyl Nuclear Power Plant during tests of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest man-made releases of radioactive substances in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 were released into the atmosphere. Thousands of people took part in the liquidation of the consequences, many of whom received severe doses of radiation. This disaster struck a blow to the stability of the Soviet Union, increasing tension in society and aggravating the political situation in the USSR."
 SOV_chernobyl.1.a:	"Eternal memory to the heroes!"
 dra.1.t:	"Victory in Afghanistan"
 dra.1.desc: "Comrade General Secretary, this is victory. The last major rebel stronghold on the border has been destroyed, and supply channels from Pakistan have been finally cut. After years of the hardest fighting in the gorges of the Hindu Kush, the contingent of Soviet troops together with the government army of the DRA has established full control over the entire territory of the country.\n\nThe sophisticated tactics of night raids by GRU special forces, the massive use of attack aviation and the merciless strikes of the Mi-24 «Crocodiles» have broken the back of the dushman resistance. Western military analysts who predicted a «second Vietnam» for Moscow are disgraced. US President Ronald Reagan is furious — the CIA operation «Cyclone» has failed, billions of dollars of American taxpayers have turned to ashes.\n\nToday columns of victors march through the streets of Kabul and Moscow under red banners. The Democratic Republic of Afghanistan has firmly entrenched itself in the socialist camp. Direct roads to the Middle East and to the Indian Ocean are open before us. The whole world has seen: we never retreat."
 dra.1.a: "Hooray! Glory to the USSR Armed Forces!"
 dra.2.t: "Replacement of Babrak Karmal"
 dra.2.desc: "May 4, 1986 entered the history of the Democratic Republic of Afghanistan as a day of fundamental political turning point. At the 18th plenum of the PDPA Central Committee, Babrak Karmal, who had led the country since the entry of Soviet troops, was officially relieved of the duties of General Secretary. The official wording — «for health reasons» — however the true reasons lie in the corridors of the Kremlin.\n\nDespite the decisive military victory over the mujahideen, Karmal could not unite the split party and overcome the enmity between the «Khalq» and «Parcham» factions. In conditions of the onset of peace, Moscow needs a strong pragmatist capable of putting Afghanistan on the rails of peaceful socialist construction.\n\nThe new leader of the DRA was 39-year-old Dr. Mohammad Najibullah, who had previously headed the formidable state security service KHAD. Najibullah is a young, energetic and tough leader, enjoying the absolute trust of the KGB of the USSR and the new Soviet leader Mikhail Gorbachev. Having secured the support of the victorious Red Army, the new General Secretary proclaims a course toward consolidation of Afghan society. The time of factional struggle and weakness has passed. The era of Dr. Najib begins."
 dra.2.a: "Good."
 DDR_unification.1.t: "The Eastern Bloc has fallen"
 DDR_unification.1.desc: "The Warsaw Pact no longer exists... In connection with this, the question of German unification arises in the FRG and the GDR, and in fact, of the liquidation of the GDR. Shall we let Germany become united again or fight for its right to exist?"
 DDR_unification.1.a: "We agree! The time of the GDR has long passed."
 DDR_unification.1.b: "The FRG is encroaching on us. Let us stand up for the communist system!"
 DDR_unification.2.t: "The GDR refused unification with us"
 DDR_unification.2.desc: "In the GDR there are more and more mass demonstrations and demands for the resignation of the government. But they have clung to power with their teeth. What shall we do?"
 DDR_unification.2.a: "Now is not the time for unification!"
 DDR_unification.2.b: "If the GDR does not come to us, then we go to them. With weapons."
 CZE_Czechoslovakia_kgb.1.t: "Memory of the Prague Spring"
 CZE_Czechoslovakia_kgb.1.desc: "Seventeen years have passed since Warsaw Pact tanks entered Prague, and the CSSR is not satisfied with the reforms that have begun in the USSR. Because of this, a decision has been made: the leadership of the State Security Service has been given a verbal order to arrest KGB agents."
 CZE_Czechoslovakia_kgb.1.a: "Yes, begin the arrests"
 CZE_Czechoslovakia_kgb.1.b: "No, do not begin"
 CZE_Czechoslovakia_lenders.1.t: "Military cooperation"
 CZE_Czechoslovakia_lenders.1.desc: "We have agreed with the USSR that military factories will be built on our territory in exchange for loyalty to Moscow."
 CZE_Czechoslovakia_lenders.1.a: "Excellent!"
 CZE_Czechoslovakia_perepro.1.t: "Negotiations"
 CZE_Czechoslovakia_perepro.1.desc: "In order to retain control, the country's leadership held negotiations with the demonstrators, promising partial reforms and more freedom of speech. This decision gave the government time, but at the same time undermined its authority — the people have already felt their strength."
 CZE_Czechoslovakia_perepro.1.a: "Endure"
 CZE_Czechoslovakia_perepro.1.b: "Send them packing"
 CZE_global_ralal.1.t: "Collapse of Czechoslovakia"
 CZE_global_ralal.1.d: "Czechoslovakia no longer exists; after a long years-long crisis the government of Czechoslovakia could not hold out."
 CZE_global_ralal.1.a: "Yes!"
 CZE_global_ralal.1.b: "Meh"
 CZE_global_ralal.1.s: "Don't care"
 CZE_Czechoslovakia_papy.1.t: "Report on 1985"
 CZE_Czechoslovakia_papy.1.desc: "A new year, 1985, has arrived. 1. The USSR is weakening from internal contradictions. 2. The opposition in the country is growing stronger. 3. The economy is experiencing times of stagnation.\nIt depends on you, the player."

 british_black_wednesday.1.t: "Clouds over the pound"
 british_black_wednesday.1.desc: "The pound sterling is pressing ever harder against the lower limit of the European Exchange Rate Mechanism. High German rates after German unification, doubts around Maastricht, and currency traders' confidence that the pound is overvalued turn the defense of the exchange rate into a political battle for the prestige of John Major's government. The Bank of England can spend reserves and raise rates, but the market is already testing whether London has the determination to keep sterling in the ERM."
 british_black_wednesday.1.a: "Defend the pound at any cost."
 warsaw_pact_countries.2.t: "The 'Gentle Revolution' in Bulgaria"
 warsaw_pact_countries.2.desc: "November 10, 1989. Todor Zhivkov — the man who ruled Bulgaria for 35 years — was removed from the post of General Secretary of the Central Committee of the Bulgarian Communist Party. The conspiracy had matured within the party itself: Foreign Minister Petar Mladenov back in October sent an open letter to the Central Committee, accusing Zhivkov of isolating the country from the whole world, including the USSR. Gorbachev had long considered Zhivkov a brake on reforms and supported the opposition within the BCP.\n\nUnlike Romania, the Bulgarian revolution passed without blood — it is called 'gentle.' In the streets of Sofia there are demands for democracy and a multi-party system. On December 7, thirteen opposition organizations unite into the Union of Democratic Forces. Bulgaria begins a slow but irreversible path to free elections."
 warsaw_pact_countries.2.a: "Zhivkov has fallen. Bulgaria goes its own way!"
 warsaw_pact_countries.3.t: "The Negotiated Revolution in Hungary"
 warsaw_pact_countries.3.desc: "Summer 1989. Hungary goes its own way — without barricades and blood. The ruling Hungarian Socialist Workers' Party itself sits down at the negotiating table with the opposition. On June 13, the National Round Table opens in Budapest: communists, the Hungarian Democratic Forum, the Alliance of Free Democrats, the young Fidesz and other forces discuss a peaceful transition to democracy.\n\nOn October 23, 1989 — on the anniversary of the 1956 revolution — the Hungarian People's Republic is officially renamed the Hungarian Republic. The HSWP transforms into the Hungarian Socialist Party and recognizes its historical defeat. In March 1990 the first free elections are held — victory is won by the center-right Hungarian Democratic Forum led by József Antall. The Iron Curtain has fallen — Hungary opened its border with Austria back in May."
 warsaw_pact_countries.3.a: "Hungary proved: freedom can be won with a word."
 warsaw_pact_countries.4.t: "The 'Solidarity' Revolution in Poland"
 warsaw_pact_countries.4.desc: "February 6, 1989. The legendary Round Table opens in Warsaw — negotiations between the ruling Polish United Workers' Party and the banned trade union 'Solidarity' led by Lech Wałęsa. The economy is agonizing, strikes do not cease, and the PZPR has no other way out except dialogue.\n\nOn April 4 an agreement is signed: 'Solidarity' is legalized, the post of president and a freely elected Senate are established. On June 4, in the elections, 'Solidarity' wins 99 out of 100 seats in the Senate — the defeat of the communists is complete. On August 24, Tadeusz Mazowiecki becomes prime minister — the first non-communist head of government in the post-war history of Poland. In December all mentions of socialism are removed from the constitution. Poland started the avalanche of changes throughout the Eastern Bloc."
 warsaw_pact_countries.4.a: "'Solidarity' has won. Poland is free!"

