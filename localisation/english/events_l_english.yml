usa.13.t: "Bill Clinton's victory in the 1992 election"
usa.13.desc: "Bill Clinton, a state governor whom no one took seriously, did the impossible. He crushed incumbent President Bush, turning the election into a referendum on America's future. His campaign was built on a truth as simple as a brick: “It's the economy, stupid!” The country was tired of foreign wars and budget deficits - people want jobs, affordable healthcare, and peace."
usa.13.a: "One era has ended, another has begun."
usa.14.t: "Ronald Reagan proposes holding a meeting."
