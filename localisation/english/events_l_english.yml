 usa.1.t: "New President – Old Problems"
 usa.1.desc: "At noon on January 20, 1989, it was cold and windy on the steps of the Capitol. Before a crowd of thousands, George Herbert Walker Bush took the oath and became the 41st President of the United States. A former vice president, former CIA director, and now the master of the White House.\nHis speech was in the spirit of Reagan but with his own accent. Bush called on the nation to light 'a thousand points of light' – not to wait for government help, but to build strong communities and develop volunteerism. In international affairs, he extended a hand to Moscow, calling the current moment a 'window of opportunity for peace.' Gorbachev breathed a sigh of relief.\nHowever, the presidency did not come to Bush at the best time. Domestically, the budget deficit was growing, and overseas, in Eastern Europe, changes were brewing that would soon reshape the map of the world. It would not be boring."
 usa.1.a: "Hooray!"
 usa.2.t: "Democrats Win!"
 usa.2.desc: "Today in the 1988 US elections, the Democratic Party won, led by Michael Dukakis, a well-known political figure and technocrat."
 usa.2.a: "Hooray!"
 usa.3.t: "Gorbachev's Proposal"
 usa.3.d: "The diplomatic and economic sanctions imposed on us by the United States are obviously only the beginning of a serious confrontation. The presence of the US Pacific Fleet in Pearl Harbor, Hawaii, means that the Americans intend to maintain their presence in the region and support our enemies. By striking their base now, we will use the element of surprise."
 usa.3.a: "We might agree"
 usa.4.t: "Aid from the USA"
 usa.4.d: "The USA has taken an anti-German stance and now intends to help Great Britain strengthen itself against the German threat. At the same time, they are interested in maintaining their presence in the Atlantic. In exchange for several of our naval bases, they are ready to provide us with destroyers. These ships are taken from reserve, but agreeing would mean strengthening military ties between our countries. Perhaps this is a wise decision."
 usa.4.a: "This is a unique opportunity."
 usa.4.a.tt: "We will receive 43 American destroyers.\nCanada will receive 7 American destroyers."
 usa.4.b: "This offer is clearly more beneficial to the USA, so it is unacceptable to us."
 usa.5.t: "[FROM.GetNameDef] agreed"
 usa.5.d: "Despite all our preparations and good intentions, Great Britain refused to accept the old destroyers in exchange for naval bases."
 usa.5.a: "We are winning the Cold War!"
 usa.6.t: "[FROM.GetNameDef] refused."
 usa.6.d: "Presidential election day has arrived. Incumbent President Franklin Delano Roosevelt has already implemented several programs collectively called the New Deal, aimed at lifting the country out of the Great Depression.\n\nMany measures were successful, but plans to further expand the role and powers of the government drew criticism from his opponent, Republican Alf Landon. Landon, who entered politics from the oil business, advocates expanding economic freedoms, while Roosevelt and the Democratic Party stand for social security and economic stability. The election may show the balance of power or bring a decisive victory for the Democrats."
 usa.6.a: "Too bad for them."
 usa.6.b: "Republicans. We must preserve American ideals."
 usa.7.t: "USA offers to join the anti-Iraq coalition"
 usa.7.d: "Since the presidency was established in the United States, no president has served three consecutive terms. However, due to the instability of world politics and current events, President Roosevelt decided to break this tradition and run for a third term. Republican Wendell Willkie, called a dark-horse candidate with good experience in industry and almost none in politics, criticizes both Roosevelt's economic policies and his intention to run for a third term.\n\nThe candidates share many views on international policy, and Willkie aims to preserve many provisions of the New Deal. Many believe these elections will determine the future of American democracy."
 usa.7.a: "Yes, of course."
 usa.7.b: "No, we still need our soldiers."
 usa.8.t: "[FROM.GetNameDef] agreed"
 usa.8.d: "President Landon put an end to the New Deal reforms carried out by the Democrats four years ago and chose to rely on industrial companies like the ones he personally founded before becoming president. Roosevelt's campaign was based on continuing the course he set during his first term, and he now intends to run again. He is popular, but Landon criticizes him for seeking to concentrate power in the hands of the president, since he himself is pursuing a different policy.\n\nThe external threat, aimed at both our country and others, remains a reality, and both candidates realize this. The question is who will lead the leading democratic power in these difficult times."
 usa.8.a: "Great!"
 usa.9.t: "[FROM.GetNameDef] refused"
 usa.9.d: "Franklin Delano Roosevelt was in many ways an unusual president. Despite deteriorating health and an unusually long term, he intends to lead our country during the war. The Republicans have been limited in their choice of candidates, as many are now in the military, and they have chosen Governor Thomas Dewey as their nominee.\n\nRoosevelt still enjoys popular support, but many fear he will not live to the end of his term. Will that be enough to bring Dewey victory over the man under whose leadership we have come so far?"
 usa.9.a: "So be it."
 usa.10.t: "Operation Desert Storm Begins"
 usa.10.d: "Although in many respects [Root.GetLeader] intends to adhere to the New Deal, Roosevelt still sees the opportunity to implement his original program. Despite deteriorating health, he remains popular and is once again the Democratic candidate.\n\n[Root.GetLeader] claims that in the current situation, a change of leadership in America would be irresponsible, and one can see the irony, since the same was said before he defeated Roosevelt last time. Although perhaps he is right."
 usa.10.a: "Get ready, Iraq!"
 usa.11.t: "Roosevelt vs. MacArthur"
 usa.11.d: "Given the ongoing threat of the US being drawn into the war, both Democrats and Republicans are trying to find candidates who will satisfy the military. General Douglas MacArthur, taking time away from his army duties, launched a campaign for the Republicans after peace was established and our country achieved victory. He challenges Roosevelt and runs as a conservative.\n\nRoosevelt remains popular, but MacArthur's charisma and sense of duty resonate with voters. Perhaps the military will do better?"
 usa.11.a: "Roosevelt and Truman will get their way."
 usa.11.b: "MacArthur knows how to build peace, not just wage war."
 usa.12.t: "Douglas MacArthur's Campaign"
 usa.12.d: "To challenge Roosevelt, the record‑holder for the longest time in the presidency, the Republicans decided to choose a candidate from the army command who had been through the war. General Douglas MacArthur was popular with conservatives, but he was very busy with his direct duties and did not want to take time away from them for a presidential campaign.\n\nNevertheless, he remains one of the most attractive conservative candidates. Perhaps he can be persuaded to make certain sacrifices so that our president is not a moderate Republican?"
 usa.12.a: "MacArthur is needed at the front, not in the White House."
 usa.12.b: "We need him to challenge Roosevelt."
 usa.13.t: "Roosevelt's Death"
 usa.13.d: "Although President Roosevelt’s health had been failing for some time, the confident presidential campaign convinced many that he still had many years ahead. Nevertheless, no one ruled out the possibility of FDR dying in office, and today he died of a heart attack. Vice President Harry Truman took the oath and asked the American people to pray and support him. The cabinet remains the same, and Truman promised to keep his predecessor's policies unchanged."
 usa.13.a: "One era has ended, another has begun."
 news.1.t: "Reykjavík Summit"
 news.1.d: "The second personal meeting between General Secretary of the CPSU Central Committee Mikhail Gorbachev and US President Ronald Reagan took place on October 11–12, 1986, in Reykjavík, halfway between Moscow and Washington. Although the meeting broke up without signing any documents, it is considered an important milestone in the Soviet-American negotiation process on strategic offensive arms and the first step toward ending the Cold War era."
 news.1.a: "Big breakthrough!"
 news.2.t: "Death of Konstantin Chernenko"
 news.2.d: "today Konstantin Chernenko died."
 news.2.a: "Hooray, humanity!"
 news.3.t: "Iraq Invades Kuwait!"
 news.3.desc: "Tonight at 2:00 AM local time, Iraqi troops crossed the border. 100,000 soldiers and 300 tanks of the Republican Guard invade Kuwait in three columns, meeting fierce but unequal resistance. At dawn, Iraqi special forces storm Dasman Palace in Kuwait City. The Emir, Sheikh Jaber Al-Ahmad Al-Jaber Al-Sabah, and his family manage to flee to Saudi Arabia. Within hours, the capital falls. Baghdad radio announces the overthrow of the 'corrupt regime' and the end of the 'American conspiracy' against Iraq."
 news.3.a: "Vultures tearing at the carcass..."
 news.4.t: "Chernobyl Nuclear Accident"
 news.4.desc: "On April 26, 1986, at 1:23 AM, a powerful explosion occurred at the fourth reactor of the Chernobyl Nuclear Power Plant during tests of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest technogenic releases of radioactive substances in history. Uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 isotopes entered the atmosphere. Thousands of people took part in the liquidation of the consequences, many of whom received serious doses of radiation. This disaster dealt a blow to the stability of the Soviet Union, increasing social tension and exacerbating the political situation in the USSR."
 news.4.a: "Eternal memory to the heroes!"
 news.5.t: "Yugoslav Wars Begin"
 news.5.desc: "Today, war has begun on Yugoslav territories, which mainly included a series of interethnic conflicts between Serbs on one side, and Slovenes, Croats, Bosniaks, and Albanians on the other, as well as the Croat-Bosniak conflict and the conflict between the Republic of West Bosnia (initially supported by Croats, then by Serbs) and the central Muslim authorities led by Alija Izetbegović in the Republic of Bosnia and Herzegovina, and the conflict between Albanians and Macedonians in North Macedonia, caused by religious and ethnic contradictions."
 news.5.a: "Another protracted war..."
 news.6.t: "Elections to the Supreme Soviet of the RSFSR"
 news.6.desc: "Today, non-alternative elections were held for the 11th convocation of the Supreme Soviet of the RSFSR.\n\nElections for the 9th convocation of the Supreme Soviet of the RSFSR were held according to the Regulations on Elections to the Supreme Soviet of the RSFSR, approved by a decree of the Presidium of the Supreme Soviet of the RSFSR on August 8, 1978. 101,058,205 people took part in the elections (turnout — 99.97%). 100,989,507 people voted for the candidates (99.93%)."
 news..a: "Will this be the start of a new war in Asia?"  # Note: original key is malformed; kept as is.
 news.7.t: "Steve Jobs' Visit to Moscow"
 news.7.desc: "In the summer of 1985, Steve Jobs, one of the founders of the California computer company Apple, together with lawyer Albert Eisenstat, arrived in Soviet Moscow. Their plans were to establish cooperation with the Soviet leadership and open computer production in the country."
 news.7.a: "Will this be the start of a new war in Asia?"  # Duplicate key? Kept as per original.
 news.7.b: "What a shame..."
 news.8.t: "Operation Desert Storm"
 news.8.desc: "Today at 00:00 GMT, US President George H. W. Bush ordered the start of Operation Desert Storm. The goal — to liberate Kuwait and restore legitimate authority. An unprecedented coalition of 42 countries, including the USA, Great Britain, France, Saudi Arabia, Syria, Egypt, and even former Soviet allies from the socialist camp, launched massive strikes on Iraq's military infrastructure.\nThe first targets were air defense control centers, command posts, and communication nodes. Stealth F-117A aircraft and Tomahawk cruise missiles took to the air, heralding the arrival of an era of high-precision real-time weaponry."
 news.8.a: "Let's go liberate Kuwait!"
 news.9.t: "Republican Victory in the USA"
 news.9.desc: "Today at noon, George Herbert Walker Bush officially became the 41st President of the United States. The oath was taken on the steps of the Capitol before a crowd of thousands.\n\nIn his speech, the new White House chief called on the nation to create 'a thousand points of light' — developing volunteerism and local communities. Bush also promised to continue the course of cooperation with the Soviet Union, calling it a 'window of opportunity for peace'.\n\nThe former vice president under Reagan succeeded his predecessor amid a growing budget deficit and global changes in Eastern Europe."
 news.9.a: "Cowards have fled!"
 news.10.t: "Democratic Victory in the USA"
 news.10.d: "Having withdrawn troops to the Romanian border, [SOV.GetNameDef] issued an ultimatum to official Bucharest to immediately transfer Bessarabia, which had previously been part of the Russian Empire, to its control.\n\nRomania stated that it had no choice but to accept Soviet demands, and Romanian troops left Bessarabia."
 news.10.a: "Interesting."
 news.10.b: "Bessarabia belongs to us by right."
 news.10.c: "We had no choice..."
 news.10.e: "Rejoice, Moscow, but this is a temporary victory."