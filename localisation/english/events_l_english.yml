 usa.1.t: "Republicans won!"
 usa.1.desc: "A week ago elections were held in the USA, and the Republican Party of the USA won, led by George Bush Sr."
 usa.1.a: "Hooray!"
 usa.2.t: "Democrats won!"
 usa.2.desc: "A week ago elections were held in the USA, and the Democratic Party of the USA won, led by Michael Dukakis."
 usa.2.a: "Hooray!"
 usa.3.t: "Gorbachev’s proposal"
 usa.3.d: ""
 usa.3.a: "Perhaps we will agree"
 usa.4.t: "Aid from the USA"
 usa.4.d: ""
 usa.4.a: "This is a unique opportunity."
 usa.4.a.tt: "We will receive 43 American destroyers.\nCanada will receive 7 American destroyers."
 usa.4.b: "This proposal is clearly more advantageous for the USA, so it is unacceptable to us."
 usa.5.t: "[FROM.GetNameDef] agreed"
 usa.5.d: "Despite all our preparations and good intentions, Great Britain refused to accept the old destroyers in exchange for naval bases."
 usa.5.a: "We are winning the Cold War!"
 usa.6.t: "[FROM.GetNameDef] refused."
 usa.6.d: ""
 usa.6.a: "That is worse for them."
 usa.7.t: "The USA proposes that we participate in Operation Desert Storm"
 usa.7.d: ""
 usa.7.a: "We must take part against Iraqi aggression."
 usa.7.b: "We still need our soldiers."
 usa.8.t: "[FROM.GetNameDef] agreed to participate in the operation"
 usa.8.d: ""
 usa.8.a: "Hooray!"
 usa.9.t: "[FROM.GetNameDef] refused to participate in the operation"
 usa.9.d: ""
 usa.9.a: "All right."
 usa.9.b: "Dewey defeats Roosevelt."
 usa.10.t: "Operation Desert Storm."
 usa.10.d: ""
 usa.10.a: "Let us go liberate Kuwait!"
 usa.10.b: "America is ready for a new “New Deal.”"
 usa.11.t: "Malta Summit"
 usa.11.d: ""
 usa.11.a: "Let us see what happens."
 usa.12.t: "The economic crisis is catching up"
 usa.12.d: ""
 usa.12.a: "This is very bad.."
 usa.13.t: "Bill Clinton’s victory in the 1992 election"
 usa.13.desc: "Bill Clinton, a state governor whom no one took seriously, did the impossible. He crushed incumbent President Bush, turning the election into a referendum on America’s future. His campaign was built on a truth as simple as a brick: “It’s the economy, stupid!” The country was tired of foreign wars and budget deficits - people wanted jobs, affordable healthcare, and peace."
 usa.13.a: "One era ended, another began."
 usa.14.t: "Ronald Reagan proposes holding a meeting."
 usa.14.d: ""
 usa.14.a: "We will agree."
 usa.14.b: "No talks with capitalists."
 usa.15.t: "The Ronald Reagan Doctrine"
 usa.15.d: ""
 usa.15.a: "Hooray!"
 usa.16.t: "The USSR agrees to sign CHB - I"
 usa.16.d: ""
 usa.16.a: "Very good."
 usa.17.t: "Confirmation of Thomas Clarence as associate justice"
 usa.17.d: ""
 usa.17.a: "This is good."
 usa.18.t: "Meeting with Yeltsin"
 usa.18.d: ""
 usa.18.a: "Hooray!"
 usa.19.t: "Recording of the charity single “We Are the World” by “USA for Africa”"
 usa.19.d: "January 28, 1985. At A&M Studios in Los Angeles, immediately after the American Music Awards ceremony, more than 45 of America’s greatest music stars gathered. Michael Jackson and Lionel Richie wrote the song, and Quincy Jones took on producing this ambitious project. The goal was to raise funds to fight famine in Ethiopia, where a terrible famine was raging."
 usa.19.a: "We are the world."
 usa.20.t: "Assassination of Enrique Camarena"
 usa.20.d: ""
 usa.20.a: "Sad."
 usa.21.t: "Accident of the aircraft carrier USS Coral Sea"
 usa.21.d: "The US Navy aircraft carrier USS Coral Sea (CV-43), returning after a major overhaul costing 200 million dollars, collided with the Ecuadorian tanker Napo during exercises in the Caribbean Sea, not far from the American base at Guantanamo, Cuba. The incident occurred in clear weather with 11 kilometers of visibility."
 usa.21.a: "It was the fault of a civilian vessel. Our fleet is not to blame."
 usa.22.t: "41 Tornadoes swept across the USA"
 usa.22.d: ""
 usa.22.a: "Oh God..."
 usa.23.t: "Los Angeles Lakers win the NBA championship"
 usa.23.d: ""
 usa.23.a: "Hooray!"
 usa.24.t: "The NES game console is released in the USA"
 usa.24.d: ""
 usa.24.a: "Hooray!"
 usa.25.t: "The US Senate allows televised broadcasts of its debates"
 usa.25.d: ""
 usa.25.a: "Good."
 usa.26.t: "State of the Armed Forces"
 usa.26.d: "1985. The 'Peace through Strength' doctrine is bearing fruit. The American military machine is undergoing the largest modernization since World War II. The defense budget has exceeded $300 billion, and the Pentagon has received carte blanche to develop and procure the newest weapon systems.\n\nOn land, the Army is transitioning to new M1 Abrams tanks with powerful 120-mm guns and Bradley IFVs. At sea, the Navy is implementing Admiral Lehman's ambitious program to create a 600-ship fleet, increasing the number of carrier strike groups and commissioning Aegis-equipped destroyers. In the air — new B-1B strategic bombers and F-15/F-16 fighters, while stealth technologies are being developed in deep secrecy. At the same time, the Strategic Defense Initiative (SDI) is gaining momentum, promising to take the arms race into space.\n\nHowever, behind the façade of this incredible power lie serious problems. Record military spending has led to a huge federal budget deficit. The troops themselves lack spare parts: F-16 fighters sit idle on the ground, and the combat readiness of some units raises questions among the command. The Soviet Union responds in kind, building up its nuclear arsenal and navy."
 usa.26.a: "Accepted."
 usa.27.t: "Ronald Reagan undergoes prostate surgery"
 usa.27.d: ""
 usa.27.a: "We hope everything will be fine"
 usa.28.t: "Iraqi Exocets hit the destroyer USS Stark"
 usa.28.d: ""
 usa.28.a: "They will pay for this"
 usa.29.t: "“Black Monday”: global stock market crash"
 usa.29.d: ""
 usa.29.a: "Not this..."
 usa.30.t: "The USA proposes a trade agreement"
 usa.30.d: ""
 usa.30.a: "We agree"
 usa.30.b: "We would rather refuse"
 usa.31.t: "[FROM.GetNameDef] agreed"
 usa.31.d: ""
 usa.31.a: "Hooray!"
 usa.32.t: "[FROM.GetNameDef] refused"
 usa.32.d: ""
 usa.32.a: "That is worse for them."
 usa.33.t: "[FROM.GetNameDef] proposes economic aid to us"
 usa.33.d: ""
 usa.33.a: "We agree"
 usa.33.b: "We would rather refuse"
 usa.34.t: "[FROM.GetNameDef] agreed"
 usa.34.d: ""
 usa.34.a: "Long live American-Soviet relations!"
