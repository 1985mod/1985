 ddr.1.t: "XI Congress of the SED"
 ddr.1.desc: "In Berlin, in the vast hall of the Palace of the Republic, thousands of delegates from all over Germany are gathering. The XI Congress of the SED is taking place under the sign of historic achievements. The party is summarizing the decade, noting unprecedented industrial growth and the strengthening of the country's defense capabilities.\nThe central report, read by the General Secretary, states that the German Democratic Republic has finally embarked on the path of building a developed socialist society. The new party program emphasizes the need for further tightening of party ranks, the fight against bourgeois ideology, and strengthening the role of the state in the economy. The congress proceeds in a single impulse, without a single reservation."
 ddr.1.a: "Hooray!"
 ddr.2.t: "Honecker's Visit to Bonn"
 ddr.2.desc: "For the first time in history, the Chairman of the GDR State Council sets foot on West German soil for an official visit. Erich Honecker meets with the Federal Chancellor of the FRG surrounded by journalists and diplomats from around the world. Protocol is observed to the smallest detail: a military band, flag-raising, smiles for the press."
 ddr.2.a: "Long live the FRG!"
 ddr.3.t: "Unification with Dissidents"
 ddr.3.desc: "In the vast hall where only approving ovations for the Politburo used to be heard, dissidents, intellectuals, and party functionaries now sit. The future of the nation is being discussed: multi-party system, market elements in the economy, and the fate of the Stasi. This is not a capitulation, it is an attempt to save the state by giving it a breath of fresh air. For the first time in many years, Germans are speaking to each other not through barbed wire, but face to face."
 ddr.3.a: "We will carry out broad reforms"
 ddr.3.b: "Harsh suppression - no concessions"
 ddr.4.t: "Electoral Fraud"
 ddr.4.desc: "Local elections in the districts of the GDR took place with 'record turnout' and an overwhelming majority of votes for National Front candidates. However, the very next day rumors spread throughout the city - independent observers and Western media report mass ballot stuffing, tampering with protocols, and voter intimidation. Within the SED itself, a scandal erupts: several party members demand a recount, and trade unions threaten strikes."
 ddr.4.a: "The West is to blame for everything!"
 ddr.5.t: "Conspiracy"
 ddr.5.desc: "Within the walls of the old SED Central Committee building, there is a smell of sulfur. In recent weeks, the General Secretary has noticed that his usual directives are being executed with delay, and some Politburo members are gathering too often for 'informal lunches' without his knowledge. Stasi agents report secret contacts between several high-ranking party members and representatives of the military command."
 ddr.5.a: "I see."
 ddr.6.t: "The Modrow Government"
 ddr.6.desc: "After Honecker's resignation and Krenz's short rule, the party found itself in a deep crisis. The streets demand change, the economy is cracking at the seams, and Moscow, under Gorbachev's leadership, is refusing its former support. Under these conditions, the Politburo nominates Hans Modrow for the post of Prime Minister - a man with a reputation as a pragmatist and supporter of dialogue."
 ddr.6.a: "Course towards unification with the FRG"
 ddr.7.t: "Free Elections in the GDR"
 ddr.7.desc: "For the first time in forty years, the residents of the German Democratic Republic go to the polls to make a truly free choice. Dozens of parties are participating in the election race - from the post-communist PDS to liberals and greens. The main intrigue: will the reformed socialists be able to hold onto power, or will the people vote for immediate unification with the FRG?"
 ddr.7.a: "The CDU alliance won victory"
 ddr.8.t: "Order 101: Do Not Shoot"
 ddr.8.desc: "The night of November 9-10, 1989. The Berlin Wall, symbolizing the division of Germany, becomes the epicenter of drama. At the 'Bornholmer Strasse' checkpoint and other crossings, tens of thousands of people gather, demanding free exit. The border guards are confused - their instructions dictate opening fire in case of a breakout attempt, but the Politburo has just transmitted an ambiguous 'Order 101' through closed channels."
 ddr.8.a: "Completely cancel the order to shoot."
 ddr.9.t: "Gerontocracy in the SED"
 ddr.9.desc: "For several years, quiet discontent has been brewing within the SED. The party leadership consists of people whose average age is over seventy. They still remember the war, Stalinism, the building of the Wall, but completely do not understand new trends - computerization, environmental movements, the demands of youth. At the last Politburo meeting, one of the secretaries for ideology, who is already over eighty, fell asleep right during the report on perestroika."
 ddr.9.a: "Let's maintain the status quo"
 ddr.10.t: "Resignation of Erich Honecker"
 ddr.10.desc: "The streets of East German cities have been humming for several weeks - tens of thousands of people demand change, freedom of speech, and the right to emigrate. Erich Honecker, the unshakeable leader of the GDR for nearly twenty years, looks broken. He is 77 years old, ill, tired, and has lost his main ally - Mikhail Gorbachev, who openly stated that Moscow will not 'defend those who are against perestroika'."
 ddr.10.a: "Honorary resignation - transfer of power to Krenz"
 ddr.11.t: "Socialism on the Verge of Bankruptcy"
 ddr.11.desc: "The East German economy is cracking at the seams. The country's foreign debt has exceeded 20 billion West German marks, and interest payments consume almost the entire export potential. Factories operate at three-quarters capacity, many unprofitable enterprises are kept afloat only by state subsidies. Store shelves are empty: butter, meat, coffee, and citrus fruits have disappeared from free sale."
 ddr.11.a: "Centralized belt-tightening - planned autarky"
 ddr.12.t: "MiG-29 Deliveries"
 ddr.12.desc: "The latest Soviet MiG-29 fighter jets begin arriving at East German military airfields - fourth-generation machines that in terms of flight performance surpass a large part of the NATO fleet. The GDR's National People's Army receives more than twenty of these formidable machines - 'swallows' capable of patrolling the airspace and participating in exercises on equal terms with any Western adversary."
 ddr.12.a: "Accept the full shipment - let's strengthen our Air Force!"
 ddr.13.t: "Independent GDR"
 ddr.13.desc: "September 1990 will go down in history as the moment of the final collapse of the Eastern Bloc. Amidst the rapid unification of Germany and the collapse of the communist regime, the leadership in East Berlin officially announced the withdrawal of the German Democratic Republic from the Warsaw Pact Organization.\nThis step, agreed upon within the framework of the 'Two Plus Four' agreements, marks the actual liquidation of the East German army (NVA) and the end of four decades of Moscow's military presence in the heart of Europe. Soviet troops are preparing for evacuation, and West German structures are already taking control of the borders. The flags of the Eastern Bloc are lowered - the banks of the Elbe no longer separate two irreconcilable systems."
 ddr.13.a: "For our independent Germany!"
 ddr.14.t: "The GDR Withdrew from the Warsaw Pact"
 ddr.14.desc: "September 1990 will go down in history as the moment of the final collapse of the Eastern Bloc. Amidst the rapid unification of Germany and the collapse of the communist regime, the leadership in East Berlin officially announced the withdrawal of the German Democratic Republic from the Warsaw Pact Organization.\nThis step, agreed upon within the framework of the 'Two Plus Four' agreements, marks the actual liquidation of the East German army (NVA) and the end of four decades of Moscow's military presence in the heart of Europe. Soviet troops are preparing for evacuation, and West German structures are already taking control of the borders. The flags of the Eastern Bloc are lowered - the banks of the Elbe no longer separate two irreconcilable systems."
 ddr.14.a: "Everything has fallen apart..."
 news.1.t: "The Reykjavík Summit"
 news.1.d: "The second personal meeting between General Secretary of the CPSU Central Committee Mikhail Gorbachev and US President Ronald Reagan took place on October 11-12, 1986, in Reykjavík, halfway between Moscow and Washington. Despite the meeting breaking up without signing any documents, it is considered an important milestone in the Soviet-American negotiating process on strategic offensive arms and the first step towards ending the Cold War era."
 news.1.a: "A major breakthrough!"
 news.2.t: "Death of Konstantin Chernenko"
 news.2.desc: "On March 10, 1985, at 19:20, General Secretary of the CPSU Central Committee Konstantin Ustinovich Chernenko passed away. He was 73 years old. The official medical report cited cardiac arrest due to pulmonary emphysema, heart failure, and liver cirrhosis as the cause of death. He was in power for only 13 months - the shortest rule since Stalin."
 news.2.a: "What is happening in the world..."
 news.3.t: "Iraq Invades Kuwait!"
 news.3.desc: "On August 2, 1990, at 2:00 AM, Iraqi troops crossed the Kuwaiti border, beginning a full-scale invasion. Three Republican Guard divisions, supported by tanks and helicopters, quickly suppressed the resistance of the Kuwaiti army. Kuwait's Emir Jaber Al-Sabah fled to Saudi Arabia, and his brother Fahd was killed defending the palace. By the end of the day, Iraqi forces had fully occupied Kuwait, establishing control over oil fields and government buildings."
 news.3.a: "Vultures tearing at the corpse..."
 news.4.t: "The Chernobyl Nuclear Accident"
 news.4.desc: "On April 26, 1986, at 1:23 AM, a powerful explosion occurred at the fourth reactor unit of the Chernobyl Nuclear Power Plant during tests of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest radioactive releases in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 were released into the atmosphere. Thousands of people participated in the liquidation of the consequences, many of whom received serious doses of radiation. This catastrophe was a blow to the stability of the Soviet Union, intensifying social tension and exacerbating the political situation in the USSR."
 news.4.a: "Eternal memory to the heroes!"
 news.5.t: "The Yugoslav Wars Began"
 news.5.desc: "Today, war began on Yugoslav territories, which mainly involved a series of inter-ethnic conflicts between Serbs on one side, and Slovenes, Croats, Bosniaks, and Albanians on the other, as well as the Croatian-Bosniak conflict and the conflict between the Republic of Western Bosnia, initially supported by Croats and then by Serbs, and the central Muslim authorities led by Alija Izetbegović in the Republic of Bosnia and Herzegovina, and the conflict between Albanians and Macedonians in North Macedonia, caused by religious and ethnic contradictions."
 news.5.a: "Another protracted war..."
 news.6.t: "Elections to the Supreme Soviet of the RSFSR"
 news.6.desc: "Today, non-alternative elections were held for the Supreme Soviet of the RSFSR of the XI convocation.\n\nThe elections for the IX convocation of the Supreme Soviet of the RSFSR were held according to the Regulations on Elections to the Supreme Soviet of the RSFSR, approved by the decree of the Presidium of the Supreme Soviet of the RSFSR of August 8, 1978. 101,058,205 people took part in the elections (turnout - 99.97%). 100,989,507 people voted for the candidates (99.93%)."
 news..a: "Quite interesting."
 news.7.t: "Steve Jobs' Visit to Moscow"
 news.7.desc: "In the summer of 1985, one of the founders of the California computer company Apple, Steve Jobs, along with lawyer Albert Eisenstat, arrived in Soviet Moscow. Their plans included establishing cooperation with the Soviet leadership and opening computer production in the country."
 news.7.a: "We hope everything will be fine."
 news.8.t: "Operation Desert Storm"
 news.8.desc: "On January 17, 1991, a coalition of 35 countries led by the United States launched Operation Desert Storm against Iraq, which had occupied Kuwait. The airstrikes were preceded by a salvo of over 100 Tomahawk cruise missiles from ships in the Persian Gulf and the Red Sea. For 42 days, coalition aviation struck Iraqi command posts, air defense systems, Scud missile positions, and oil infrastructure."
 news.8.a: "Let's go liberate Kuwait!"
 news.9.t: "Republican Victory in the US"
 news.9.desc: "On November 8, 1988, incumbent Vice President George H. W. Bush won a decisive victory in the presidential election, receiving 426 electoral votes against 111 for Democrat Michael Dukakis. Bush received 53.4% of the popular vote - the best result for Republicans since 1924. Bush's campaign was built on a promise to continue Reagan's policies and his famous phrase: 'Read my lips: no new taxes.'"
 news.9.a: "Let us hope this will serve the cause of peace."
 news.10.t: "Democratic Victory in the US"
 news.10.desc: "On November 8, 1988, Democratic Party candidate Michael Dukakis won a sensational victory in the presidential election, receiving 370 electoral votes against 168 for incumbent Vice President George H. W. Bush. Dukakis received 52.3% of the popular vote, confidently winning in key states of the Midwest and East Coast."
 news.10.a: "Interesting."
 news.11.t: "Iraq Won the Iran-Iraq War"
 news.11.desc: "Today, the Iran-Iraq war ended with Iraq's victory. Iraqi troops not only liberated occupied territories but also captured the Iranian province of Khuzestan with its rich oil fields. Iran, exhausted by war and isolation, sued for peace on Baghdad's terms. Ayatollah Khomeini called it 'the greatest humiliation in the history of the revolution.' Under the peace treaty, Iran acknowledges defeat, pays reparations, and renounces territorial claims. Saddam Hussein declared himself the 'sword of the Arab nation.' Iraq became a regional superpower, but the price of victory is enormous: hundreds of thousands dead and the use of chemical weapons."
 news.11.a: "Interesting."
 news.12.t: "Iran Won the Iran-Iraq War"
 news.12.desc: ""
 news.12.a: "Interesting."
 news.13.t: "The USS Coral Sea Carrier Accident"
 news.13.desc: "The US Navy aircraft carrier USS Coral Sea (CV-43), returning after a major $200 million overhaul, collided with the Ecuadorian tanker 'Napo' during exercises in the Caribbean Sea, near the US base at Guantanamo, Cuba. The incident occurred in clear weather with visibility of 11 kilometers."
 news.13.a: "Interesting."
 news.14.t: "The Geneva Meeting"
 news.14.desc: "On November 19-21, 1985, the first meeting in six years between the leaders of the USSR and the USA - Mikhail Gorbachev and Ronald Reagan - took place in Geneva. By the mid-1980s, relations between the two superpowers were at a record low: Reagan called the USSR the 'evil empire,' the US deployed Pershing-2 missiles in Europe, and Soviet troops continued to fight in Afghanistan.\nNo concrete agreements were reached - Gorbachev demanded abandonment of the SDI program in exchange for missile reductions, Reagan stood his ground. However, the very fact of dialogue was a breakthrough. The leaders signed a joint statement that 'nuclear war cannot be won and must never be fought.' The meeting laid the foundations for future agreements."
 news.14.a: "Very good!"
 news.15.t: "Michael Dukakis Supports Perestroika Policy"
 news.15.desc: "Dukakis made a policy statement, announcing full support for perestroika and glasnost in the Soviet Union. The President stated: 'We welcome change in the USSR. Perestroika is a chance for the whole world to end decades of confrontation.' The Dukakis administration announced its readiness to revise its foreign policy course: nuclear arsenal reductions, joint space programs, and expanded economic ties with the Soviet Union were proposed."
 news.15.a: "Very good!"
 news.16.t: "Michael Dukakis Calls for Ratification of the INF Treaty"
 news.16.desc: "Today, Michael Dukakis said that ratification of the INF Treaty should take place before Reagan's meeting with Gorbachev in Moscow in late May 1988. The President should not go to the USSR 'empty-handed' - Senate approval would be a powerful signal of unity in American policy and readiness for further steps on strategic arms reduction."
 news.16.a: "Interesting."
 news.17.t: "Space Shuttle Challenger Disaster"
 news.17.desc: "On January 28, 1986, the Space Shuttle Challenger exploded 73 seconds after liftoff from Cape Canaveral. Seven astronauts died on board, including teacher Christa McAuliffe - millions of schoolchildren watched the broadcast live.\nThe investigation showed that the cause was the failure of rubber O-rings due to low temperatures. Morton Thiokol engineers had warned of the danger, but NASA management ignored them. The Rogers Commission revealed systemic problems in the agency's safety culture. The Space Shuttle program was suspended for 32 months. The tragedy called into question the viability of manned spaceflight."
 news.17.a: "Oh, humanity!"
 news.18.t: "Halley's Comet"
 news.18.desc: "The whole world was preparing for a celestial spectacle. Newspapers were full of headlines about a 'tail half the size of the sky,' astronomers aimed telescopes, and ordinary people awaited the end of the world or a miracle. However, the Universe decided to play a joke. In February 1986, the Earth and Halley's Comet ended up on opposite sides of the Sun, and the moment of peak brightness passed by observers - the comet simply 'hid' behind the star. Moreover, over the past 76 years, cities had grown so much that light pollution turned the night sky into a murky haze. In the end, 99% of the planet's inhabitants never saw the legendary comet. The triumph of astronomy turned into a farce."
 news.18.a: "Interesting."
 news.19.t: "The Iran-Contra Affair"
 news.19.desc: "In May 1985, through Israeli mediation, a mechanism for supplying American weapons to Iran was developed. On the Israeli side, Prime Minister Shimon Peres, Foreign Minister David Kimche, and arms dealers Schwimmer and Nimrodi participated. On the US side, the operation was overseen by Michael Ledeen and Oliver North. Israel received a guarantee of 'compensation' for each tranche. On August 20, 1985, in London, Ledeen handed Kimche a secret code for communication.\nToday the data is unknown."
 news.19.a: "Very interesting..."
 news.20.t: "The Murder of Olof Palme"
 news.20.desc: "On February 28, 1986, at 23:21 in the center of Stockholm, at the intersection of Sveavägen and Tunnelgatan, Swedish Prime Minister Olof Palme was mortally wounded. He was returning from the Grand cinema with his wife Lisbeth without any protection—Palme made it a matter of principle not to use bodyguards. The killer fired twice from a .357 Magnum revolver: the first bullet struck the Prime Minister in the back, while the second wounded his wife. Palme passed away on the way to the hospital."
 news.20.a: "What is the world coming to..."
 news.21.t: "The Tiananmen Square Incident"
 news.21.desc: "Many days of protests by students and workers in Beijing have reached a critical point. The demonstrators, demanding democratic reforms and an end to corruption, have completely paralyzed the center of the capital. Following sharp debates within the party leadership, a radical decision was made.\nThe deployment of army units and armored vehicles turned the square into a war zone. Despite barricades and resistance, the 'counter-revolutionary rebellion' was brutally suppressed by military forces. While the government claims order has been restored, the international community remains in shock. This day will forever alter the nation's domestic and foreign course."
 news.21.a: "This is a terrible tragedy..."
 news.21.b: "But surely nothing happened there..?"