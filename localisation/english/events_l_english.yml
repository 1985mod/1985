wgr.25.desc: ""
wgr.25.a: "Well, let's begin."
election_campaign_in_germany_1987: "1987 election campaign in Germany"
wgr.26.t: "Formation of a new government"
wgr.26.desc: ""
wgr.26.a: "Excellent!"
wgr.27.t: "Reconcile instead of divide"
wgr.27.desc: "The election campaign for the Bundestag is gaining momentum, and the positions of our government led by Helmut Kohl are being seriously tested. The Social Democrats (SPD) under Johannes Rau have launched a powerful campaign under the slogan “Versöhnen statt spalten” (“Reconcile instead of divide”). Against the backdrop of environmental protests and economic reforms, this call for national accord finds a strong response among voters tired of polarization.\n\nThis strategy of “reconciliation” strikes directly at our centrist electorate. The SPD successfully portrays CDU policy as excessively harsh and dividing society. Polls show an alarming rise in popularity of the center-left. If we do not take countermeasures, the balance of power in Bonn may swing not in our favor."
wgr.27.a: "Damn it!"
wgr.28.t: "The SPD attracts the working class"
wgr.28.desc: "Johannes Rau's election campaign is dealing a heavy blow to our government's positions in the very heart of German industry. Industrial decline, the closure of unprofitable mines, and the restructuring of steel giants have generated deep fear of unemployment and uncertainty among German workers. The Social Democrats skillfully portray the reforms of Helmut Kohl's cabinet as soulless capitalism that divides the nation, contrasting it with the idea of solidarity and social protection.\n\nPowerful trade unions, historically close to the left, have launched unprecedented mobilization in the Ruhr basin, the Saar, and the port cities of the North. Workers who were uncertain in the previous election now stand as a monolithic wall behind the SPD. For the CDU this is a critical threat: without the votes of the moderate working class, it will be impossible to retain a right-wing majority in the Bundestag. We need to urgently decide how to respond to the fact that the industrial heart of Germany is rapidly turning red."
wgr.28.a: "We need to do something!"
news.1.t: "Reykjavik Summit"
news.1.d: "The second personal meeting of General Secretary of the CPSU Central Committee Mikhail Gorbachev and US President Ronald Reagan took place, held on October 11–12, 1986 in Reykjavik, halfway between Moscow and Washington. Despite the fact that the meeting ended without signing any documents, it is considered an important milestone in the Soviet-American negotiation process on strategic offensive arms and the first step toward ending the Cold War era."
news.1.a: "A big breakthrough!"
news.2.t: "Death of Konstantin Chernenko"
news.2.desc: "On March 10, 1985, at 19:20, General Secretary of the CPSU Central Committee Konstantin Ustinovich Chernenko died. He was 73. The official medical conclusion named cardiac arrest against the background of emphysema, heart failure, and cirrhosis of the liver as the cause of death. He was in power for only 13 months — the shortest rule since Stalin."
news.2.a: "What is going on..."
news.3.t: "Iraq invades Kuwait!"
news.3.desc: "On August 2, 1990, at 2:00 a.m., Iraqi troops crossed the border of Kuwait, beginning a full-scale invasion. Three divisions of the Republican Guard, supported by tanks and helicopters, quickly suppressed the resistance of the Kuwaiti army. The Emir of Kuwait, Jaber al-Sabah, fled to Saudi Arabia, and his brother Fahd was killed while defending the palace. By the end of the day, Iraqi troops had completely occupied Kuwait, establishing control over oil fields and government buildings."
news.3.a: "Vultures tearing at a corpse..."
news.4.t: "Chernobyl Nuclear Power Plant accident"
news.4.desc: "On April 26, 1986, at 1:23 a.m., a powerful explosion occurred at the fourth power unit of the Chernobyl Nuclear Power Plant during tests of the eighth turbogenerator. The explosion completely destroyed the reactor, causing one of the largest man-made releases of radioactive substances in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137, and strontium-90 entered the atmosphere. Thousands of people took part in eliminating the consequences, many of whom received serious doses of radiation. This catastrophe became a blow to the stability of the Soviet Union, increasing tension in society and exacerbating the political situation in the USSR."
news.4.a: "Eternal memory to the heroes!"
news.5.t: "Yugoslav wars began"
news.5.desc: "Today war began in Yugoslav territories, which mainly included a series of interethnic conflicts between Serbs, on the one hand, and Slovenes, Croats, Bosniaks, and Albanians on the other, as well as the Croat-Bosniak conflict and the conflict between the Republic of Western Bosnia, supported first by Croats and then by Serbs, and the central authorities of Muslims led by Alija Izetbegović in the Republic of Bosnia and Herzegovina, and the conflict between Albanians and Macedonians in North Macedonia, caused by religious and ethnic contradictions."
news.5.a: "Another protracted war..."
news.6.t: "Elections to the Supreme Soviet of the RSFSR"
news.6.desc: "Today, uncontested elections to the Supreme Soviet of the RSFSR of the XI convocation were held. \n\ \n\ Elections to the IX convocation of the Supreme Soviet of the RSFSR were held according to the Regulations on Elections to the Supreme Soviet of the RSFSR, approved by decree of the Presidium of the Supreme Soviet of the RSFSR of August 8, 1978. 101,058,205 people took part in the elections (turnout — 99.97%). 100,989,507 people voted for the candidates (99.93%)."
news..a: "Quite interesting."
news.7.t: "Steve Jobs's visit to Moscow"
news.7.desc: "In the summer of 1985, one of the founders of the California computer company Apple, Steve Jobs, together with lawyer Albert Eisenstat, arrived in Soviet Moscow. Their plans were to establish cooperation with the Soviet leadership and open production of their computers in the country."
news.7.a: "We hope everything will be fine."
news.8.t: "Operation Desert Storm"
news.8.desc: "On January 17, 1991, a coalition of 35 countries led by the USA began Operation Desert Storm against Iraq, which had occupied Kuwait. The airstrikes were preceded by a salvo of more than 100 Tomahawk cruise missiles from ships in the Persian Gulf and the Red Sea. Over 42 days, coalition aviation struck Iraqi command posts, air defense systems, Scud missile positions, and oil infrastructure."
news.8.a: "Let's go liberate Kuwait!"
news.9.t: "Republican victory in the USA"
news.9.desc: "On November 8, 1988, incumbent Vice President George Bush Sr. won a convincing victory in the presidential election, receiving 426 electoral votes against 111 for Democrat Michael Dukakis. Bush received 53.4% of the popular vote — the best result for Republicans since 1924. Bush's campaign was built on the promise to continue Reagan's policies and the famous phrase: “Read my lips: no new taxes.”"
news.9.a: "Let's hope this serves the cause of peace."
news.10.t: "Democratic victory in the USA"
news.10.desc: "On November 8, 1988, Democratic Party candidate Michael Dukakis won a sensational victory in the presidential election, receiving 370 electoral votes against 168 for incumbent Vice President George Bush Sr. Dukakis received 52.3% of the popular vote, confidently winning in key states of the Midwest and East Coast."
news.10.a: "Curious."
news.11.t: "Iraq won the Iran-Iraq War"
news.11.desc: "Today the Iran-Iraq War ended with an Iraqi victory. Iraqi troops not only liberated occupied territories, but also captured the Iranian province of Khuzestan with rich oil fields. Iran, exhausted by war and isolation, requested peace on Baghdad's terms. Ayatollah Khomeini called this “the greatest humiliation in the history of the revolution.” Under the peace treaty, Iran recognizes defeat, pays reparations, and renounces territorial claims. Saddam Hussein declared himself “the sword of the Arab nation.” Iraq became a regional superpower, but the price of victory is enormous: hundreds of thousands dead and the use of chemical weapons."
news.11.a: "Curious."
news.12.t: "Iran won the Iran-Iraq War"
news.12.desc: ""
news.12.a: "Curious."
news.13.t: "Accident of the aircraft carrier USS Coral Sea"
news.13.desc: "The US Navy aircraft carrier USS Coral Sea (CV-43), returning after a major $200 million refit, collided with the Ecuadorian tanker Napo during exercises in the Caribbean Sea, near the US base at Guantanamo, Cuba. The incident occurred in clear weather with 11 kilometers visibility."
news.13.a: "Curious."
news.14.t: "Geneva Summit"
news.14.desc: "On November 19–21, 1985, in Geneva, the first meeting in six years of the leaders of the USSR and the USA took place — Mikhail Gorbachev and Ronald Reagan. By the mid-1980s, relations between the two superpowers had reached a record low: Reagan called the USSR an “evil empire,” the USA deployed Pershing-2 missiles in Europe, and Soviet troops continued to fight in Afghanistan.\nNo concrete agreements could be reached - Gorbachev demanded abandoning the SDI program in exchange for missile reductions, Reagan stood his ground. However, the very fact of dialogue became a breakthrough. The leaders signed a joint statement that “nuclear war cannot be won and must never be fought.” The meeting laid the foundations for future agreements."
news.14.a: "Very good!"
news.15.t: "Michael Dukakis supports Perestroika policy"
news.15.desc: "Dukakis made a programmatic statement, announcing full support for perestroika and glasnost in the Soviet Union. The president stated: “We welcome the changes in the USSR. Perestroika is a chance for the whole world to end decades of confrontation.” The Dukakis administration announced readiness to revise its foreign policy course: reduction of nuclear arsenals, joint space programs, and expansion of economic ties with the Soviet Union are proposed."
news.15.a: "Very good!"
news.16.t: "Michael Dukakis calls for ratification of the INF Treaty"
news.16.desc: "Today Michael Dukakis said that ratification of the INF Treaty should take place before Reagan's meeting with Gorbachev in Moscow at the end of May 1988. The president should not go to the USSR “empty-handed” — Senate approval will become a powerful signal of the unity of American policy and readiness for further steps to reduce strategic arms."
news.16.a: "Curious."
news.17.t: "Challenger shuttle disaster"
news.17.desc: "On January 28, 1986, the shuttle Challenger exploded 73 seconds after launch from Cape Canaveral. Seven astronauts died on board, including teacher Christa McAuliffe — millions of schoolchildren watched the broadcast live.\nThe investigation showed that the cause was the destruction of rubber O-rings due to low temperatures. Morton Thiokol engineers warned of the danger, but NASA management ignored them. The Rogers Commission identified systemic problems in the agency's safety culture. The Space Shuttle program was suspended for 32 months. The tragedy called into question the expediency of crewed flights."
news.17.a: "Oh, humanity!"
news.18.t: "Halley's Comet"
news.18.desc: "The whole world was preparing for a celestial spectacle. Newspapers were full of headlines about a “tail half the sky long,” astronomers pointed their telescopes, and ordinary people awaited the end of the world or a miracle. However, the Universe decided to joke. In February 1986, the Earth and Halley's Comet ended up on opposite sides of the Sun, and the moment of greatest brightness passed by observers — the comet simply “hid” behind the luminary. Moreover, over the past 76 years cities had grown so much that light pollution turned the night sky into a murky haze. As a result, 99% of the planet's inhabitants never saw the legendary comet. The triumph of astronomy turned into a farce."
news.18.a: "Curious."
news.19.t: "Iran-Contra affair"
news.19.desc: "In May 1985, through Israeli mediation, a mechanism was developed for supplying American weapons to Iran. On the Israeli side, Prime Minister Shimon Peres, Foreign Minister David Kimche, and arms dealers Schwimmer and Nimrodi took part. On the US side, the operation was supervised by Michael Ledeen and Oliver North. Israel received a guarantee of “compensation” for each tranche. On August 20, 1985, in London, Ledeen handed Kimche a secret communication code.\nToday the data is unknown."
news.19.a: "Very interesting..."
news.20.t: "Assassination of Olof Palme"
news.20.desc: "On February 28, 1986, at 23:21, in central Stockholm, at the intersection of Sveavägen and Tunnelgatan, Swedish Prime Minister Olof Palme was fatally wounded. He was returning from the Grand cinema with his wife Lisbet without security - Palme fundamentally did not use bodyguards. The killer fired twice from a .357 Magnum revolver: the first bullet hit the prime minister in the back, the second wounded his wife. Palme died on the way to the hospital."
news.20.a: "What is going on..."
news.21.t: "Tiananmen Square Incident"
news.21.desc: "Multi-day protests by students and workers in Beijing have reached a critical point. The demonstrators, demanding democratic reforms and an end to corruption, have completely paralyzed the center of the capital. After intense debates within the party leadership, a radical decision was made.The deployment of army units and armored vehicles has turned the square into a war zone. Despite barricades and resistance, the counter-revolutionary riot was brutally suppressed by the military. While the government claims that order has been restored, the global community remains in shock. This day will forever change the internal and external course of the state."
news.21.a: "This is a horrible tragedy..."
news.21.b: "But nothing happened there, did it..?"
news.22.t: "Proclamation of Greater Iraq"
news.22.desc: "Soon after the fall of Kuwait and the suppression of resistance in Kurdistan and Khuzestan, Baghdad announced the creation of Greater Iraq, redrawing the British borders. Saddam Hussein was proclaimed “Guardian of the Arab Tiger,” and the inclusion of new territories gave Iraq control over a fifth of the world's oil reserves. Now the regime faces the task of holding together disparate regions, uniting their resources to ensure economic and military growth."
news.22.a: "The world has changed forever..."
news.22.b: "Allahu Akbar! Glory to Iraq and Saddam Hussein himself!"
news.23.t: "Yemeni unification"
news.23.desc: "The Yemen Arab Republic (North Yemen) and the People's Democratic Republic of Yemen (South Yemen) officially united into a single Republic of Yemen. Two states with completely different political systems - the Islamic North and the Marxist South - after decades of border wars and splits lasting more than 250 years, finally moved toward peaceful merger.\n\nThis process became possible thanks to long negotiations that lasted about 25 years and ended with the signing of the Aden Agreement on November 30, 1989. A year before, in May 1988, the sides created a demilitarized zone along the border, and now they reached a final agreement."
news.23.a: "Everything will be fine... right..?"
news.23.b: "Now we are a single state!"
news.24.t: "Hezbollah uprising"
news.24.desc: "On February 16, 1985, the Lebanese Shiite group, which had previously operated underground, officially announced its existence.\n\nAt the al-Ouzai mosque in western Beirut, the organization's representative Sheikh Ibrahim al-Amin read out a manifesto entitled “The Hezbollah Program — an open letter to all the oppressed in Lebanon and throughout the world.” The text of the manifesto was simultaneously published in Lebanon's largest newspaper, as-Safir."
news.24.a: "Let's wish Lebanon luck."
news.25.t: "Mujahideen won the Afghan War"
news.25.desc: "The Afghan War, which became one of the longest and bloodiest in modern history, formally ended with the withdrawal of Soviet troops on February 15, 1989. However, the struggle continued: for another three years, Mohammad Najibullah's government, with USSR support, held power. With the collapse of the Soviet Union, military and economic aid completely stopped. A month ago, mujahideen detachments entered Kabul and overthrew the last pro-communist government. The result of the decade-long confrontation was the victory of the Afghan mujahideen."
news.25.a: "Interesting..."
news.25.b: "Finally."
news.26.t: "Afghanistan won the Afghan War"
news.26.desc: "Operation Magistral put an end to the protracted confrontation. The blockade of Pakistani passes, strikes on militant camps, and the policy of reconciliation split the opposition. Kabul was reliably held, field commanders either went over to the government's side or were driven back into the mountains.\nThe General Staff reports: organized resistance in the DRA has ceased. Afghanistan is becoming a friendly buffer covering the Central Asian borders from extremism and drug trafficking. Over 15,000 servicemen have been awarded, and military equipment has received invaluable experience for modernization.\nThe southern flank is reliably protected. The Union emerges from the war with strengthened positions."
news.26.a: "Very interesting..."
news.26.b: "Hurray!"
news.27.t: "Withdrawal of Soviet troops from Afghanistan"
news.27.desc: "February 15, 1989, 10:00, the last column of the 40th Army crossed the Friendship Bridge, completing a 9-year campaign in which 620,000 Soviet servicemen participated. Losses: 15,052 killed, 53,753 wounded, 417 missing in action. 800,000 tons of ammunition expended, 118 aircraft, 333 helicopters, 147 tanks destroyed.\nThis was the first major curtailment of Soviet presence outside the Warsaw Pact. The operation exposed economic exhaustion, intensified criticism of perestroika, and gave impetus to national movements in Central Asia. The world saw that the USSR could no longer dictate terms on its southern borders, and disappointment grew within the country."
news.27.a: "We have all waited so long for this!"
news.27.b: "Farewell, mountains!"
news.28.t: "Unification of Germany"
news.28.desc: "On October 3, 1990, at midnight, the GDR ceased to exist. Five states and Berlin joined the FRG - unification by absorption of the eastern neighbor, without creating a new state.\nThe negotiation marathon: the Unification Treaty, the “Two Plus Four” Treaty. The four powers confirmed Germany's sovereignty, pledging to withdraw Soviet troops by the end of 1994, and to reduce the Bundeswehr from 500 to 370 thousand.\nUnification became a geopolitical earthquake: it exposed the economic gulf between East and West, increased migration, put an end to the socialist experiment in Europe, and changed the balance of power. Moscow, having agreed to the West's conditions, yielded positions, opening the way for NATO expansion to the east."
news.28.a: "The German people are united again."
news.28.b: "We are united again, like in the good old days!"
news.29.t: "Agacher War"
news.29.desc: "On December 25, Christmas Day, the Malian army launched an offensive in the Agacher Strip. The army of Burkina Faso transferred soldiers to the region and began counterattacks. However, Malian troops turned out to be better prepared and carried out several successful attacks, capturing a number of villages. Burkina Faso's soldiers counterattacked but suffered heavy losses. The Libyan government has already announced an attempt to negotiate a ceasefire between the sides on December 26."
news.29.a: "Curious."
news.30.t: "Operation El Dorado Canyon"
news.30.desc: "Washington's patience has overflowed. After the recent bloody terrorist attack at a disco in West Berlin, which took the lives of American soldiers, the White House points its finger directly at Tripoli. President Reagan publicly called Muammar Gaddafi “the mad dog of the Middle East” and ordered immediate retaliation.\n\nF-111 bombers together with carrier aviation of the Sixth Fleet delivered a crushing strike on military facilities and training camps in Tripoli and Benghazi. The sky over Libya was lit up by bursts of anti-aircraft shells. The air operation is complete."
news.30.a: "Curious."
news.31.t: "First Palestinian Intifada"
news.31.desc: "In Israel, a Palestinian uprising occurred, the goal of which was proclaimed “the struggle against the Israeli occupation.” Events are developing very rapidly; possibly this will grow into a civil war.\nDuring the several months preceding the start of the first intifada, many events occurred that increased hostility between Palestinians and Israelis. In September, four Israelis were killed. These incidents led to hostility between Israelis and Palestinians and unrest in all territories, which intensified every day and reached especially wide scale in the Gaza Strip."
news.31.a: "Curious."
news.32.t: "Belovezha Accords"
news.32.desc: "The Belovezha Accords, signed on December 8 by the heads of the Republic of Belarus, the RSFSR, and Ukraine, became a turning point in the history of the USSR. The Agreement stated the termination of the existence of the USSR as a “subject of international law and geopolitical reality” and announced the creation of the Commonwealth of Independent States. The Agreement was signed by senior officials and heads of government of the three union republics: Stanislav Shushkevich and Vyacheslav Kebich — from the Republic of Belarus, Boris Yeltsin and Gennady Burbulis — from the RSFSR, Leonid Kravchuk and Vitold Fokin — from Ukraine."
news.32.a: "The world has changed forever..."
news.33.t: "Toyota War"
news.33.desc: "The Chadian-Libyan conflict has entered an active phase of hostilities. By the beginning of 1987, the Libyan expeditionary corps still represented an impressive force, numbering 8,000 soldiers, 300 tanks, multiple launch rocket systems and conventional artillery, Mi-24 helicopters, and sixty combat aircraft. These forces did not have a unified command, but were divided into the Southern Operational Group, operating in the Tibesti area and numbering 2,500 people, and the Eastern Operational Group centered in Faya-Largeau. The Libyans were preparing for a war in which they were supposed to provide their Chadian allies with support from land and air."
news.33.a: "Quite interesting."
news.34.t: "Yellow Revolution in the Philippines"
news.34.desc: "The long-standing authoritarian regime of Ferdinand Marcos in the Philippines fell under the pressure of peaceful protest. Millions of citizens with yellow ribbons took to the streets of the capital after mass election fraud. When the army refused to carry out the dictator's orders and went over to the side of the people, the fate of the regime was sealed. Marcos fled the country, and Corazon Aquino came to power, promising to return freedom and democracy to the Philippines."
news.34.a: "Freedom for the Philippines!"
news.35.t: "CDU victory in the 1987 elections"
news.35.desc: "On January 25, 1987, elections to the Bundestag were held in West Germany. Despite sharp criticism from the opposition and the growing popularity of the Greens, the center-right CDU/CSU bloc under incumbent Chancellor Helmut Kohl won a confident victory, gaining 44.3% of the vote.\n\nTogether with their long-time FDP partners, the conservatives formed a stable coalition government. This triumph strengthens Kohl's position on the international stage and guarantees the continuation of the FRG's hard pro-Western course in the Cold War. It seems the political landscape of West Germany will remain unchanged in the coming years."
news.35.a: "Understood."
news.36.t: "SPD victory in the 1987 elections"
news.36.desc: "On January 25, 1987, the political landscape of West Germany shuddered. Against all forecasts, the Social Democratic Party (SPD) under the charismatic Johannes Rau won a triumphal victory in the Bundestag elections. Voters, tired of Kohl's conservative course and frightened by the escalation of the Cold War, voted en masse for the center-left.\n\nRau has already announced the formation of a coalition with the strengthened Greens. The new government is taking a course toward de-escalation of relations with the Eastern Bloc."
news.36.a: "Understood."
news.37.t: "War in Bosnia and Herzegovina"
news.37.desc: "Ethnic and political tension in the Balkans has finally grown into a full-scale civil war. Following the declaration of independence of Bosnia and Herzegovina, the situation in the region instantly spun out of control. Bosnian Serbs, with Belgrade's support, began a large-scale offensive, and Sarajevo found itself in a tight siege ring. Fierce clashes between Bosniaks, Serbs, and Croats broke out across the country, threatening to turn into a severe humanitarian catastrophe."
news.37.a: "Another war..."
news.38.t: "Velvet Divorce"
news.38.desc: "The Czechoslovak Republic officially ceased to exist. After long political debates, the leaders of Czechia and Slovakia reached an agreement on the peaceful division of the country. Unlike many other multinational states, this dissolution took place without a single shot and in an atmosphere of complete calm. From today, state property and the army are being divided between Prague and Bratislava, and two new sovereign states officially appear on the map of Europe."
news.38.a: "The end of an era."
news.39.t: "Death of Enver Hoxha"
news.39.desc: "Today Albania lost its long-time leader. Enver Hoxha died after a long illness at the age of 76. For decades, Hoxha remained the central figure of Albanian politics, pursuing a hard line to preserve the socialist system and the country's independence. Under his rule, Albania became almost completely isolated from the outside world, and the cult of personality of the First Secretary became an integral part of the state system."
news.39.a: "The era of Enver Hoxha has come to an end."
news.40.t: "8888 Uprising"
news.40.desc: "Rangoon, August 8, 1988 Burma found itself engulfed in mass protests. Today thousands of students and ordinary citizens took to the streets of Rangoon, demanding political change and an end to many years of military rule. The protests, which had begun in previous months, rapidly grew into a nationwide movement. Strikes are paralyzing the work of state institutions, and demonstrations are taking place in the country's largest cities. The authorities are trying to restore order, but the scale of the demonstrations continues to grow. Burma's future now depends on whether the government can maintain control over the country."
news.40.a: "The beginning of a new era for Burma."
european_union.2.a: "Historical background of the EU"
european_union.2.d: "After World War II, European countries sought to prevent new conflicts and restore the economy through cooperation. In 1951, six states — France, the FRG, Italy, Belgium, the Netherlands, and Luxembourg — created the European Coal and Steel Community, laying the foundation for European integration.\nIn 1957, the Treaties of Rome were signed, establishing the European Economic Community (EEC) and Euratom. The main goal was the formation of a common market, free movement of goods, services, capital, and labor.\nIn the 1970s, the community expanded: the United Kingdom, Ireland, and Denmark joined, later — Greece. \n In 1985, the EEC became an important force in Europe. During this period, preparations began for the creation of a single internal market"
european_union.2.c: "To the future!"
european_union.3.a: "Signing of the Single European Act"
european_union.3.d: "After long negotiations, the states of the European Community agreed on the provisions of the Single European Act. The new treaty is to accelerate the creation of a single internal market, strengthen economic cooperation, and expand the powers of pan-European institutions. Supporters of integration call this moment the beginning of a new era of European unity, while critics fear the gradual loss of national sovereignty for the sake of the future of a united Europe."
european_union.3.c: "Excellent!"
european_union.4.a: "Hanover Summit"
european_union.4.d: "At the Hanover Summit, the leaders of the European Community agreed that further integration of Europe is impossible without closer monetary and economic cooperation. Following the negotiations, Jacques Delors's commission was tasked with preparing a concrete plan for the creation of an Economic and Monetary Union."
european_union.4.c: "Europe must become a single economic space!!"
nuke_dropped.1.t: "[From.From.GetName] is subjected to atomic bombing"
nuke_dropped.1.d: "For the first and, one would hope, last time in history, a nuclear bomb was detonated during military operations. It was used by the state of [?global.nukecountry.GetNameDef], and the target of the bombing is [From.From.GetName]. The enormous scale of destruction speaks to the power of the new weapon, which inspires fear not only by what it can do, but also by the consequences it carries for those who use it and for all humanity.\n\nThe world holds its breath awaiting the development of events. Will [From.From.Owner.GetNameDef] agree to capitulate in order to avoid further aggression, or will this only strengthen fighting spirit and the desire to strike back?"
nuke_dropped.1.a: "The atomic era has truly begun."
nuke_dropped.1.b: "We will do everything in our power to protect the [Root.GetAdjective] people."
nuke_dropped.2.t: "Atomic bombing of Hiroshima"
nuke_dropped.2.d: "“Hell is on the streets.”\n — Kuniyoshi Aikawa\n\nToday a nuclear bomb dropped from an aircraft of [?global.nukecountry.GetNameRuGen] exploded over Hiroshima at an altitude of 580 meters. More than two-thirds of the city were instantly destroyed. Although buildings here were constructed with frequent earthquakes in mind, only a few structures survived.\n\nPublic consciousness tends to exaggerate the power of the atomic bomb and diminish its price — the price in human lives. Neither side wishes to think about the horrors of atomic bombing, but this event will enter history with thousands and millions of lives evaporated in an instant or extinguished on poisoned ground."
nuke_dropped.2.a: "How many more people must die before the war finally ends?"
nuke_dropped.2.b: "We must act quickly to help the victims."
nuke_dropped.3.t: "Atomic bombing of Nagasaki"
nuke_dropped.3.d: "The nuclear bomb originally intended for Kokura exploded today over Nagasaki. Weather conditions forced the aircraft to deviate from course, and the combination of smoke, clouds, and technical malfunctions became the factor that may have changed the course of history.\n\nBecause the city is located in a valley, the effect of the bomb was limited to its territory, but the destructive effect is still enormous. Several military facilities were affected, but this is nothing compared to the human casualties. Decades will pass before we fully understand the long-term effect of this weapon. The threat from [?global.nukecountry.GetNameRuGen] knows no bounds."
nuke_dropped.3.a: "Will this lead to the capitulation of the [From.From.Owner.GetAdjective] leader?"
nuke_dropped.3.b: "We hoped Nagasaki would not be affected."
nuke_dropped.4.t: "Atomic bombing of Berlin"
nuke_dropped.4.d: "Today, on [GetDateText], the armed forces of [?global.nukecountry.GetNameRuGen] delivered a nuclear strike on the capital of Germany, Berlin. The city survived several bombings both in this war and in the previous one, but this does not compare with what happened now. Since the Thirty Years' War, Berlin has not known such global destruction — given the size of the city, this was considered impossible.\n\nThe Führer's bunker, it is claimed, survived the explosion, at least partially, since the bomb detonated far from the planned epicenter, and it is claimed that [From.From.Owner.GetLeader] is still alive and furious. How to evacuate the [From.From.Owner.GetAdjective] leaders and whether they can be protected from radiation — that is another question."
nuke_dropped.4.a: "Today one wants to be glad you are not a resident of Berlin."
nuke_dropped.4.b: "Our enemies struck at the very heart of the nation!"
nuke_dropped.5.t: "Atomic bombing of London"
nuke_dropped.5.d: "Today London was destroyed by a nuclear explosion. Despite a powerful air defense system, the country of [From.From.Owner.GetNameDef] could not prevent the strike delivered by the armed forces of [?global.nukecountry.GetNameRuGen]. On [GetDateText], Big Ben tolled the time for the last time and melted from the heat of the explosion. According to initial reports, Buckingham Palace was completely destroyed, and the whereabouts of the royal family are unknown.\n\nIt is confirmed that [From.From.Owner.GetLeader] survived and intends to speak on radio. The British, utterly demoralized, urgently need to restore their will to resist — or convincingly call for capitulation."
nuke_dropped.5.a: "It is hard to maintain aristocratic calm before a blast wave."
nuke_dropped.5.b: "God save the King!"
nuke_dropped.6.t: "Atomic bombing of Kyoto"
nuke_dropped.6.d: "The city of Kyoto, the leading [From.From.Owner.GetAdjective] industrial center of Japan, was subjected to a nuclear strike today by [?global.nukecountry.GetNameRuGen]. There are suspicions that the city was chosen as a target also because it is the intellectual center of the country.\n\nThe beauty and historical significance of Kyoto made many think it would survive, but the enemy probably considered that destroying precisely such a place would have an additional psychological effect. The city is located in a lowland, so the impact of the explosion was limited territorially, but the old imperial palace and many industrial buildings were completely destroyed."
nuke_dropped.6.a: "History and beauty are worth nothing in war."
nuke_dropped.6.b: "Let them destroy the old, we will build the new."
nuke_dropped.7.t: "Atomic bombing of Tokyo"
nuke_dropped.7.d: "Today the armed forces of [?global.nukecountry.GetNameRuGen] delivered a nuclear strike at the heart of the Japanese Empire. Although the headquarters allowed for the possibility of conventional bombings of Tokyo, no one could have imagined that the capital would become the main target for the new deadly weapon. However, in the end, because of the political significance of the new capital and the proximity of the imperial palace, which was destroyed to its foundation, all-consuming fire still fell from the sky.\n\nAlthough it is claimed that [From.From.Owner.GetLeader] is alive, the question arises of how far Japan's enemies are prepared to go. If the war does not end now, what targets remain? What else can threaten them?"
nuke_dropped.7.a: "Is this the end of the Japanese Empire?"
nuke_dropped.7.b: "As long as [From.From.Owner.GetLeader] lives, the Empire lives too."
nuke_dropped.8.t: "Atomic bombing of Washington"
nuke_dropped.8.d: "A nuclear bomb was detonated today over the capital of the United States. This strike was delivered simultaneously against the political center and the historical heritage of the USA. The White House, the Capitol, and a number of other significant buildings and monuments were wiped from the face of the earth by the crushing strike of the hostile [?global.nukecountry.GetNameRuGen]. Even the Washington fire of a century ago cannot compare in destructive force with what this new weapon did to the city.\n\nAlthough President [From.From.Owner.GetLeader] was in safety, what happened deeply shocked the nation. Without doubt, the USA hoped to remain the first and only country possessing such a weapon. These dreams were shattered in the most tragic manner."
nuke_dropped.8.a: "One nation, indivisible, against one atom — divisible."
nuke_dropped.8.b: "The eagle will rise from the ashes like a phoenix."
nuke_dropped.9.t: "Atomic bombing of Rome"
nuke_dropped.9.d: "In today's unprecedented attack carried out by the state of [?global.nukecountry.GetNameDef], a nuclear explosion thundered over the ancient city of Rome. Many believed that thanks to its historical and cultural heritage this ancient city would never become a target for such destructive weapons. The Vatican was also partially destroyed, the whereabouts of the Pope remain unknown, so this explosion terrified not only all Italians but all Catholics.\n\nIn the last ten years Rome developed rapidly, and for some time it still seemed that the city could help the nation revive after the war. Alas, these dreams turned to dust along with thousands of people."
nuke_dropped.9.a: "The bomb has been dropped!"
nuke_dropped.9.b: "Rome was not built in a day..."
nuke_dropped.10.t: "Atomic bombing of Paris"
nuke_dropped.10.d: "Today a nuclear bomb dropped from an aircraft belonging to the state of [?global.nukecountry.GetNameDef] exploded over Paris, causing countless casualties and destruction. France is in shock after its capital was subjected to the largest attack in its entire history, which included wars and revolutions. Parisians might still have expected the city to be captured, but no one believed it would be so decisively and mercilessly destroyed.\n\nThere will no longer be victory parades on the Champs-Élysées at the Arc de Triomphe. Perhaps in coming decades a new Paris will be reborn, but the city that was so dear to us all no longer exists."
nuke_dropped.10.a: "The City of Light burned to the ground."
nuke_dropped.10.b: "Only yesterday it might have seemed Paris was eternal."
nuke_dropped.11.t: "Atomic bombing of Moscow"
nuke_dropped.11.d: "Moscow, a city many tried in vain to conquer, today became the target of a nuclear strike by [?global.nukecountry.GetNameRuGen]. The explosion was aimed at the Kremlin, where the [From.From.Owner.GetAdjective] government sits, and the heart of the city was almost completely destroyed.\n\n[From.From.Owner.GetLeader] managed to evacuate in time and survived thanks to having recently been prepared for any threat, from any possible and impossible direction. But from such a merciless enemy it will not be easy to hide even in the boundless expanses. If things continue this way, soon the whole country will be only two kinds of wastelands: those that were here before and those created by explosions."
nuke_dropped.11.a: "And won't nuclear winter make Moscow an even more unassailable target?"
nuke_dropped.11.b: "Let them burn all our cities to the last one, but they will not be able to take them."