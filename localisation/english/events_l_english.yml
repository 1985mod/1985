 iraq.10.t: "UN Troops in Basra"
 iraq.10.d: "Comrades, listen to Radio Baghdad! Today at dawn, the interventionists, hiding behind fake UN mandates, began landing in the port of Basra. This so-called 'peacekeeping contingent' is nothing but a gathering of imperialist mercenaries and Zionist lackeys whose goal is to seize our oil wealth and destroy sovereign Iraq.\n\nThe world is watching us, but the world community is blinded by Washington's lies. Saddam Hussein is the greatest leader of the Arab nation, who built schools and hospitals for us and gave the Iraqi people light and water while Western countries plundered our region for decades. We are absolutely innocent of nothing! We did not occupy Kuwait — we were liberating our historical lands and defending our brothers from the oil magnates of the Gulf. All accusations of using chemical weapons against the Kurds are a vile slander fabricated by the CIA and the Iranian mullahs.\n\nBasra will become a grave for anyone who dares to set foot on Iraqi soil with weapons. The Ba'ath Party calls on all patriots to rise up in holy war against the aggressor. We will fight in the streets, in the deserts and in the marshes until the last occupier leaves our land!"
 iraq.10.a: "Let us stand up for an independent Iraq! Allah Akbar!"
 iraq.11.t: "First Free Elections"
 iraq.11.d: "The historic day has come. After decades of bloody dictatorship, wars, and foreign occupation, the Iraqi people for the first time in their history have won the right to choose their government. Polling stations opened across the country, and despite insurgent threats to blow them up, thousands of people lined up with purple ink-stained fingers - a symbol that their voice was heard.\n\nHowever, the euphoria quickly gives way to harsh reality. The country is split, the economy lies in ruins, and the insurgents have not laid down their arms. We have three main candidates, each offering their own path for the new Iraq. Who leads the country now will determine whether it can survive as a single democratic state or slide back into the abyss of civil war."
 iraq.11.a: "Ahmed Chalabi!"
 iraq.11.b: "Iyad Allawi!"
 iraq.11.c: "Masoud Barzani!"
 iran.1.t: "Ceasefire with Iraq"
 iran.1.d: "August 20, 1988. Eight years of war are over. Not with peace, not with victory — simply a ceasefire. Iraqi troops stopped at the border, ours too. UN Security Council Resolution 598, which we rejected a year ago, is now accepted. Khomeini called it 'drinking the poisoned chalice' — and did not exaggerate. At the front there is fatigue, in the rear bitterness. Hundreds of thousands killed, millions wounded, cities in ruins, the economy at the bottom. We achieved neither the overthrow of Saddam, nor reparations, nor punishment of the aggressor.\n\nWhy now? Because the Iraqi offensive in July-August could not be stopped. They used chemical weapons near Basra and on the islands, our human waves broke against their defense. The Revolutionary Guard lost its best, volunteers ran out, weapons were lacking. Moscow, which supported us, pressured us to accept the resolution, and the West threatened new sanctions. There was no choice left."
 iran.1.a: "Finally this war is over"
 iran.2.t: "Victory"
 iran.2.d: "Basra has fallen. After months of fighting, after our human waves time and again broke against Iraqi defense, we found a weak spot — in the south, near Shatt al-Arab. The Iraqis could not hold. Divisions of the Republican Guard retreated north, leaving the city. In our hands is the entire south of Iraq: Basra, ports, oil fields, access to the Persian Gulf. Saddam lost his second capital and main seaport. His army is demoralized, his allies are in panic, Kuwait and Saudi Arabia are silent.\n\nThis is a victory that a year ago no one dared to dream of. We not only stopped the aggressor — we took what he wanted to take from us. Khuzestan is liberated, Basra is under our control, the border has been pushed back. But the war is not over. Saddam sits in Baghdad and does not intend to surrender. He threatens new offensives, uses chemical weapons, seeks support from Moscow and Paris. Our losses are enormous, the economy is destroyed, but the army is on the rise. Now or never."
 iran.2.a: "Hooray!"
 iran.3.t: "Iraq refused our demands"
 iran.3.d: "Baghdad rejected everything. We demanded recognition of Basra and southern Iraq as part of our control zone, reparations of tens of billions, punishment of Saddam as a war criminal. Saddam replied that he would not give up a single inch of land, and Basra 'will return to the bosom of Iraq' — by force or not. His propaganda shouts about 'Persian occupation,' Kuwait and Saudi Arabia secretly finance his army, Moscow and Paris continue to supply weapons. Our divisions stand in Basra, but holding it without peace is difficult: the city is in ruins, the population is hostile, supply lines are stretched, and the Iraqis are already preparing a counteroffensive.\n\nIn Tehran irritation is growing. The military say that it is necessary to go to Baghdad while Saddam has not recovered. Politicians propose to remove part of the demands and sit down at the table again — but this will look like a retreat after victory. Khomeini hesitates: he does not want either to give up what has been conquered or to get involved in a new war. The economy will not withstand another year of fighting, and volunteers ran out back in 1984."
 iran.3.a: "Let's finish off the dictator!"
 iran.4.t: "Iran proposes peace on its own terms"
 iran.4.d: "Tehran has sent terms. We recognize Basra and the southern regions as Iranian territory, pay reparations, guarantee the security of Khuzestan. In fact — capitulation under the guise of peace. Saddam is furious, but the generals are silent: the army is exsanguinated, the Republican Guard has lost half its equipment, the economy rests only on credits from Kuwait and Saudi Arabia."
 iran.4.a: "We agree."
 iran.4.b: "We will never agree!"
 iran.5.t: "Change of government in Iraq"
 iran.5.d: "Baghdad has fallen. Saddam fled or was killed — no one knows exactly, but he is no more. Power in Iraq has passed to Muhammad Baqir al-Hakim, leader of the Supreme Council for the Islamic Revolution in Iraq, who spent twenty years in Tehran. The new authority declares Iraq an Islamic Republic. The Baath Party is dissolved, its leaders arrested or executed. Iraq becomes the second Shiite Islamic state after Iran — and the first that owes its existence to our victory.\n\nFor us this is a triumph. Saddam, who for eight years bombed our cities, used chemical weapons and invaded Khuzestan, is gone. In his place is an ally who owes us everything. It is too early to rejoice: Iraq is not only Shiites. Sunnis, Kurds and former Baathists are not going to silently watch as we put our man in Baghdad."
 iran.5.a: "Support al-Hakim, that's the way!"
 iran.6.t: "Saddam Hussein found"
 iran.6.d: "He was found in the basement of a house near Tikrit. A week after the fall of Baghdad, when the new authority had already declared the Islamic Republic of Iraq, and we were celebrating victory. Saddam was hiding with two bodyguards, without communication, without guards, with a suitcase of money and documents. Now he is in our hands.\n\nSaddam Hussein is not just a war criminal. He is a traitor to Islam. He attacked a Muslim country, unleashed an eight-year war against Iran, used chemical weapons against Muslims, killed Shiites in Karbala and Najaf, poisoned Kurds in Halabja. He called himself a defender of Arabs, but served only his own power. He received weapons from infidels, money from the Gulf monarchies, and killed Muslims with the hands of Muslims. There is no forgiveness for such a one.\n\nHis execution must be public. Not secret, not in a prison cell, not under cover of night. The whole world must see what happens to those who go against the will of Allah and shed the blood of the faithful. Let Sunnis, Shiites and Kurds see: justice has been done. Let Kuwait, Saudi Arabia and the West remember: Iran does not forgive enemies of Islam. Let his death become a lesson for all tyrants.\n\nWe will execute him on a square in Basra or in front of the mosque in Karbala. Publicly, with a crowd present, with television broadcast. This is not revenge — this is the verdict of the ummah. Saddam will die not as a soldier, but as a traitor. And his name will be cursed in history, not sung in legends."
 iran.6.a: "Islam does not forgive such people."
 amn.1.t: "Peshawar Accords"
 amn.1.desc: ""
 amn.1.a: "Allahu Akbar! We still drove out the communists!"
 amn.2.t: "Replacement of our leader"
 amn.2.desc: ""
 amn.2.a: "Good."
 amn.3.t: "Osama bin Laden provided us with weapons"
 amn.3.desc: "Tonight a caravan arrived in Peshawar. Not an ordinary caravan with food or medicine — it was a shipment of weapons. Osama bin Laden, a Saudi sheikh who has long helped our cause, personally organized this delivery. Crates with rifles, machine guns and even several MANPADS were unloaded under cover of darkness. His people say this is only the beginning. Bin Laden believes in our struggle and is ready to help further."
 amn.3.a: "Excellent!"
 amn.4.t: "Osama bin Laden had no weapons"
 amn.4.desc: "We were waiting for a caravan with weapons. Bin Laden's people promised rifles, cartridges and even several machine guns. But the caravan never came. The envoys returned empty-handed: the sheikh had no weapons. His warehouses are empty, and the money he collected in Saudi Arabia went to other needs. Bin Laden apologizes and promises to help later, but for now we are left with nothing. The mujahideen are grumbling. What shall we do?"
 amn.4.a: "We will treat this with understanding."
 amn.4.b: "This is unacceptable!"
 albania.1.t: "Death of Enver Hoxha"
 albania.1.desc: "April 11, 1985. Enver Hoxha died. The man who ruled our country for forty years is gone. He outlived Stalin, Mao, Brezhnev and Chernenko, broke with Moscow, then with Beijing, built hundreds of thousands of bunkers and left the country in complete isolation. Now he is gone.\n\nIn Tirana there is silence. The party is silent, the army waits, the people watch. Hoxha left behind not only bunkers, but also a system where everything rested on him alone. His name was everywhere: in schools, in factories, in barracks. Now this name is the past. Who will take power? Ramiz Alia, a loyal student, has long been considered the heir."
 albania.1.a: "Tragedy..."
 albania.2.t: "Fall of the communist system"
 albania.2.desc: "December 1990. Albania can no longer remain in isolation. Five years ago Hoxha died, and Ramiz Alia tried to cautiously reform the system, but time had already passed. In neighboring countries communism has collapsed: in Bucharest Ceaușescu was shot, in Poland and Hungary non-communists came to power. In Tirana they see this on television — those who managed to buy one.\n\nOur economy is in ruins. Factories are standing, products are rationed, there is no gasoline. In December students of Tirana take to the streets — first for better conditions in dormitories, then with demands for free elections and the abolition of the party's monopoly. Workers and intellectuals join them. The police first disperse, but the forces are no longer the same. Alia hesitates between force and concessions.\n\nThe party tries to buy time: it announces 'democratization,' permits the creation of independent organizations. In December 1990 the Democratic Party appears — the first opposition force in forty years. Alia agrees to free elections. They will be held in March 1991, and the communists will even win thanks to the rural electorate, but this no longer decides anything. The regime has fallen. Albania enters a new era — without Hoxha, without monopoly, without walls. What will happen next, no one knows."
 albania.2.a: "Sali Berisha!"
 angola.1.t: "Proclamation of the People's Republic of Angola"
 angola.1.desc: "The war is over. UNITA is defeated — Savimbi went underground, his detachments are scattered across the savanna, external support dried up after the fall of the apartheid regime in South Africa. Government forces control the entire territory. In Luanda they are preparing for celebrations.\n\nThe People's Republic of Angola was proclaimed back in 1975, but then it was a declaration in a besieged city: the country was being divided, war went on from the first day. Now this is reality. The MPLA is the only party, the state is socialist, the course is toward building socialism.\n\nBut peace does not come by itself. The economy is destroyed by sixteen years of war: oil is pumped, but revenues go to the army and debts. Young people grew up with weapons in their hands and do not know another life. In the provinces power rests on military committees, not party organs. The Cubans have left, Soviet advisers are also winding down — the country is left alone with its victory."
 angola.1.a: "Glory to Angola!"
 austria.1.t: "Results of the 1986 snap elections"
 austria.1.desc: "On November 23, 1986, snap parliamentary elections were held in Austria. Chancellor Fred Sinowatz resigned, and was replaced by Franz Vranitzky, who broke the coalition with the FPÖ after Jörg Haider's rise. This led to the dissolution of parliament."
 austria.1.a: "Franz Vranitzky!"
 belgian.1.t: "1987 elections"
 belgian.1.desc: "Today Belgium votes early — the government of Wilfried Martens fell in October over the crisis around the commune of Voeren, where Flemish and Walloon demands clashed in open conflict. Parliament is dissolved, elections are scheduled two years ahead of time.\nThe government coalition of Christian Democrats and Liberals loses its majority. Martens resigns. The King assigns Jean-Luc Dehaene the role of informateur. Dehaene asks for one hundred days. The negotiations drag on for 106 days — longer than the government itself lasted. In the end Martens returns for the eighth time, but now at the head of a center-left coalition: Christian Democrats, Socialists and Volksunie.\nThe country is split along linguistic lines, and the elections only confirm this. Flanders votes for CVP and PVV, Wallonia for PS. The far right enters parliament for the first time. Belgium enters a new era — without a stable majority, with growing nationalism and a government that rests on three parties instead of two."
 belgian.1.a: "Wilfried Martens!"
 belgian.2.t: "1991 parliamentary elections"
 belgian.2.desc: "November 24, 1991. Belgium votes early — the government of Wilfried Martens fell in October due to a conflict between Flemish and Walloon parties. Martens has been in power almost continuously since 1979, and the country is tired of his coalitions.\nMartens's coalition collapses. King Baudouin assigns three politicians in turn to form a government — two liberals and a Christian Democrat fail. The crisis lasts 103 days. Only on March 6, 1992, Jean-Luc Dehaene, a Flemish Christian Democrat nicknamed 'Bulldozer,' agrees to head the coalition. On March 7 he is sworn in. The government includes the same four parties as before: CVP, PS, SP and PSC. They have 120 seats out of 212 — a minimal majority.\nDehaene inherits a heavy legacy. Budget deficit, public debt, reform of the state structure, the Brussels problem, immigration. And a parliament where the far right sits for the first time. Belgium enters a new era — without Martens, with a fragile majority and the question of how long this coalition will last."
 belgian.2.a: "A new era."
 bosnia.1.t: "Gaining independence"
 bosnia.1.desc: "March 1, 1992. In Sarajevo the results of the referendum are announced: 99.4% with a turnout of 63.4% voted for independence. Serbs boycotted the referendum — for them it was a vote on leaving Yugoslavia, in which they want to remain. Alija Izetbegović speaks of a sovereign Bosnia and Herzegovina. Radovan Karadžić is already declaring that the Serbs will not recognize the result and will create their own state.\n\nWe are not Slovenia or Croatia. We do not have a monoethnic majority: Muslims, Serbs and Croats live mixed together, and each community has its own armed detachments. Slovenia and Croatia have already received recognition from the West, Macedonia is next. We are next, and this means a war on three sides.\nBelgrade is silent, but the army still controls barracks throughout the republic. In Sarajevo they are preparing for the worst: barricades in the streets, shooting in the city. Independence has been proclaimed, but it has not brought peace."
 bosnia.1.a: "Mobilize troops!"
 burkina_faso.1.t: "Coup d'état"
 burkina_faso.1.desc: "October 15, 1987. Four years ago we took power to build a new society — without colonial legacy, without corruption, without dependence on the West. We renamed the country Burkina Faso, 'land of honest people.' We wanted the peasant and the worker to become masters of their own destiny.\n\nBut the revolution devours its children. Within the National Council a split is maturing. Some demand to continue the course — nationalization, asceticism, break with Paris. Others are tired of isolation and poverty, want to open to the world and negotiate with the West. At the head of the dissatisfied is Blaise Compaoré, our old comrade, a man who was with us from the very beginning.\n\nTonight he made his choice. Units loyal to him entered Ouagadougou. Thomas Sankara was killed together with twelve supporters. The National Council is dissolved, power passes to the Popular Front. Compaoré declares that the revolution continues, but 'without mistakes and excesses.' What this means is not yet clear.\n\nWe have received power that we did not ask for. The question is what to do with it: preserve the revolutionary course, but without Sankara, or curtail it and try to survive differently. There is no way back — blood has already been spilled."
 burkina_faso.1.a: "Hard..."
 burma.1.t: "Coup d'état"
 burma.1.desc: "August 1988 did not end. The '8888' protests were dispersed, but the streets did not calm down. The government of Maung Maung does not control the country, the party is falling apart, irritation is growing in the army. On September 18 our generals led by Saw Maung take power into their own hands. The constitution is abolished, parliament dissolved, martial law introduced. The State Law and Order Restoration Council is created.\n\nWe promise order and elections, but first — order. Troops take to the streets, curfew, arrests. Aung San Suu Kyi is already making speeches before crowds. The country freezes and waits for what will happen next."
 burma.1.a: "This is illegal!"
 burma.2.t: "Union of Myanmar"
 burma.2.desc: "June 18, 1989. A year ago we took power to stop chaos. Now it is time to rename the country. The State Law and Order Restoration Council announces: Burma becomes the Union of Myanmar. Rangoon becomes Yangon. The old names are the colonial legacy, say the generals. The new ones are common to all peoples living in the Union.\n\nFor the outside world this is a symbol. The West sees an attempt to escape sanctions and forget the dispersed demonstrations of 1988. The opposition inside the country sees an attempt to change the sign without changing the essence. For us this is a question of identity: Burma is a colony, Myanmar is an independent state. Thus we separate ourselves from the past.\n\nBut a name does not solve problems. The economy is in ruins, sanctions press, the opposition is dispersed, and the mountains are restless. The question is not what to call the country. The question is what will stand behind this name."
 burma.2.a: "Union of Myanmar..."
 chad.1.t: "Toyota War"
 chad.1.desc: "Our troops for the first time in years of conflict crossed the 16th parallel and moved north. The Libyans sit at bases, they have tanks, aviation and artillery. We have none of this. But we have four hundred Toyota Hilux pickup trucks transferred by the French, and Milan anti-tank missiles on their beds.\n\nThe calculation is simple: do not engage in battle where the enemy is strong, but strike where he is not. The desert is huge, Libyan garrisons are scattered, between them are hundreds of kilometers. Our detachments on pickups can cover these kilometers in a day, strike and leave before reinforcements arrive. In December we already took Fada, destroying the garrison. Now the target is the Wadi Doum base in the north, where five thousand Libyans sit.\n\nThe French cover us from the air, but do not get involved in ground battles. Neighbors in the region watch silently. Gaddafi declared that Chad is his territory and will not just leave.\n\nThe question is whether to continue the offensive north or consolidate what has been achieved. Further is Libya, and there a completely different war may begin."
 chad.1.a: "Let's go!"
 communist_china.1.t: "The Integration of Tibet"
 communist_china.1.desc: "The long shadows over Lhasa are finally giving way to red banners. Comrade Deng Xiaoping has made it clear: the PRC can no longer afford to have a 'buffer zone' on its southwestern frontiers. Tibet must cease to be a mere autonomous appendage and become a true 'core'—a solid, monolithic shield of the republic, its resource base, and a military fortress permanently fused into the body of China.\nTraditional ways of life are yielding to forced modernization, the construction of roads across mountain ranges, and strict administrative control. The Dalai Lama is in exile, and here, at an altitude of four thousand meters, Beijing's iron will is encasing the region in concrete and steel. We are integrating Tibet irrevocably. This will provoke fury in the West, yet it will secure our strategic dominance in Asia forever."
 communist_china.1.a: "Welcome."
 communist_china.2.t: "The Tibetan Uprising"
 communist_china.2.desc: "The attempt at forced integration and the transformation of Tibet into an integral territory of the PRC has led to an inevitable explosion. Resentful of the destruction of their centuries-old way of life, the confiscation of monastic lands, and the dominance of party officials, the Tibetans have taken up arms. Detachments of the 'Chushi Gangdruk' insurgents have paralyzed traffic on strategic high-altitude highways, while the streets of Lhasa have turned into barricades.\nThe Western press is already trumpeting a 'struggle for freedom,' and Indian border guards are turning a blind eye to the smuggling of weapons through the mountain passes. For Deng Xiaoping, this is a personal challenge: if weakness is shown now, the entire PRC will unravel at the seams. Elite PLA units have been dispatched to pacify the region. We must decide how far we are willing to go to hold onto this shield of the republic."
 communist_china.2.a: "We will crush them in 3 days."
 croatia.1.t: "Gaining independence"
 croatia.1.d: "Today is a holiday for our country, we have declared withdrawal from Yugoslavia. The Sabor adopts the declaration of independence, Franjo Tuđman declares that Croatia will no longer be part of the 'communist prison of nations.' In Zagreb people are rejoicing.\n\nBut on the territory of Croatia live 600 thousand Serbs, and they are not going to remain in an independent state where they are called a minority. In the Krajina region local Serbs have already blocked roads and announced the creation of the 'Serbian Autonomous Oblast.' Both sides have plenty of weapons: we bought weapons in Hungary and on the black market.\n\nThe war has not yet begun, but it is already inevitable. The only question is who will shoot first and who will support whom."
 croatia.1.a: "For our just cause!"
 cyprus.1.t: "1988 presidential elections"
 cyprus.1.desc: "February 14, 1988. Cyprus votes. President Spyros Kyprianou is running for a third term, but the country is tired of his hard line in negotiations with Turkish Cypriots. The negotiations have been dead for more than two years, and Kyprianou refuses to resume them until Turkish troops leave the north.\n\nThe first round gives an unexpected result. The main oppositionist, leader of the right-wing DISY party Glafcos Clerides, gains 33.3%. Independent businessman George Vassiliou, supported by the communist AKEL, — 30.1%. Kyprianou loses badly, receiving only 27.3%. Socialist Lyssarides — 9.2%.\n\nKyprianou refuses further struggle. Clerides and Vassiliou go to the second round. Both promise flexibility in negotiations, which Kyprianou did not have. Clerides calls all into government, including Kyprianou's party. Vassiliou says the people are tired of parties and want an independent leader. Both are ready for dialogue with Denktash without preconditions.\n\nOn February 21 Vassiliou wins with 51.6% against 48.4% for Clerides — a margin of ten thousand votes. Kyprianou leaves after eleven years in power, and with him — the era of Makarios. The new president is a man without a party, but with a mandate for change. The era of Vassiliou begins."
 cyprus.1.a: "Truly a new era."
 Czechoslovakia.1.t: "Husák's resignation"
 Czechoslovakia.1.desc: "Husák is 76, he is ill and almost never appears in public. The party has already abolished the monopoly, there are strikes and rallies across the country, Civic Forum demands free elections. Husák resigns from the post of president, not waiting for them to remove him."
 Czechoslovakia.1.a: "We accept the resignation. Free elections!"
 Czechoslovakia.2.t: "Velvet Revolution"
 Czechoslovakia.2.desc: "A student demonstration in Prague on National Street is dispersed, there are beaten people. By evening rumors of a dead student raise the city. The next day theaters strike, factories join them. In Slovakia there is its own wave, 'Public Against Violence.' The party tries to explain that everything is under control, but no one believes it anymore. By the end of November the strike is general.\nVáclav Havel's Civic Forum and the city of Bratislava demand the abolition of the party's monopoly and free elections. On November 24 the Politburo headed by Jakeš leaves. On the 27th the country stops for two hours — workers, doctors, actors. On the 29th the Federal Assembly strikes out from the constitution the article on the leading role of the CPC. The regime is still in power, but already without support."
 Czechoslovakia.2.a: "What is happening?"
 Czechoslovakia.3.t: "Federalization of Czechoslovakia"
 Czechoslovakia.3.desc: "1968. The Prague Spring is still breathing, but Moscow is pressing. Alexander Dubček seeks a compromise: to preserve reforms and not lose control. One of the steps is to turn unitary Czechoslovakia into a federation of two equal republics: Czech and Slovak. Slovaks have long demanded equality, and this is a chance to keep them in the common country. On October 28 the National Assembly adopts the constitutional law on federation, entering into force on January 1, 1969.\n\nFor Prague this is a concession to Bratislava. For Moscow — a way to show that socialism can be different. For Slovaks — the end of twenty years of centralism, when everything was decided in Prague. But federation is not only rights, it is also responsibility: two republics, two parliaments, two governments, and all this in one country that is already cracking at the seams."
 Czechoslovakia.3.a: "A real federation"
 Czechoslovakia.4.t: "Disintegration of Czechoslovakia"
 Czechoslovakia.4.desc: "July 17, 1992. The Slovak parliament adopts a declaration of sovereignty. Mečiar and Klaus have been arguing for a month about whether there should be a common country, and cannot find an answer. The Czechs want rapid reforms and a federation with a strong center, the Slovaks want a confederation where Bratislava has its own taxes, army and foreign policy. Neither is compatible with the other. On November 25 the Federal Assembly votes for dissolution. From January 1, 1993, Czechoslovakia will no longer exist.\n\nFor Prague this is the end of illusions that reforms can be carried out together. For Bratislava — a chance for its own path. For the world — a calm, 'velvet' divorce, without a single shot. But it is also the end of a country that existed for seventy-four years. Everything will have to be divided: the army, gold, debts, even archives and collections. The dispute over gold will drag on for years."
 Czechoslovakia.4.a: "We accept the division."
 ethiopia.1.t: "Proclamation of the PDRE"
 ethiopia.1.desc: "September 1987. For thirteen years we ruled as the Provisional Military Administrative Council — the Derg. The revolution has won, but the enemies have not disappeared: Eritrea is fighting, Tigray is fighting, famine kills hundreds of thousands. Now we change the sign. A new constitution has been adopted, the Derg is dissolved, the Workers' Party of Ethiopia is created. The country becomes the People's Democratic Republic. Mengistu remains in power, but now not as a general, but as party leader and president.\n\nFor the world this is an attempt to show: Ethiopia is not a military junta, but a socialist state with a parliament and constitution. For us — a way to hold power when the army is tired and the economy is in ruins. For the rebels — it does not matter: they are fighting not against the Derg, but against Mengistu.\n\nNow the question is what to do with this new republic. One can rule harshly, as before, only under a different name. One can try reforms and peace negotiations with Eritrea. One can seek support from Moscow, which already doubts whether to feed us further."
 ethiopia.1.a: "Hooray!"
 ireland.1.t: "Pre-Christmas elections"
 ireland.1.desc: "The government of Fine Gael and the Labour Party is cracking at the seams. Labour refuses to support the harsh budget proposed by Finance Minister John Bruton: cuts in health care and social payments are unacceptable to them. Four Labour ministers resign, and Prime Minister Garret FitzGerald announces the dissolution of the Dáil. Elections are scheduled for February 17."
 ireland.1.a: "Charles Haughey!"
 ireland.2.t: "1992 elections"
 ireland.1.a: "Charles Haughey!"
 ireland.2.t: "1992 elections"
 ireland.2.desc: "Ireland votes early after the collapse of the coalition of Fianna Fáil and the Progressive Democrats — the government of Albert Reynolds fell due to the scandal around the 'Beef Tribunal.' The main theme of the campaign is unemployment: every fifth Irishman is without work, 300 thousand people. Fine Gael leader John Bruton calls Reynolds 'the main bully in the schoolyard' and demands an answer for record unemployment and high credit rates."
 ireland.2.a: "Albert Reynolds!"
 italya.1.t: "1987 elections"
 italya.1.desc: ""
 italya.1.a: "Amintore Fanfani!"
 italya.2.t: "1987 elections"
 italya.2.desc: ""
 italya.2.a: "Giovanni Goria!"
 italya.3.t: "1988 elections"
 italya.3.desc: ""
 italya.3.a: "Ciriaco De Mita!"
 italya.4.t: "1989 elections"
 italya.4.desc: ""
 italya.4.a: "Giulio Andreotti!"
 italya.5.t: "1992 elections"
 italya.5.desc: ""
 italya.5.a: "Giuliano Amato!"
 italya.6.t: "1993 elections"
 italya.6.desc: ""
 italya.6.a: "Carlo Azeglio Ciampi!"
 mali.1.t: "Agacher War"
 mali.1.desc: ""
 mali.1.a: "Let's go!"
 north_korea.1.t: ""
 north_korea.1.desc: "While Soviet divisions of Romanov rush to the Rhine, and the FRG is on the brink of capitulation, Pyongyang sends an ultimatum. The DPRK demands the immediate reunification of Korea under the red banner — not negotiations, not a federation, but the complete submission of Seoul. In case of refusal, Pyongyang threatens invasion and declares that the 'brothers in the North' are waiting only for the order.\n\nFor us this is the worst moment. American troops in Korea will not receive reinforcements: Washington is busy with Europe and cannot open a second front. Japan is in panic, China is silent, and the Soviet Far East has already been put on heightened alert. Seoul has only hours to decide: surrender, fight, or seek a third force."
 north_korea.1.a: "We will accept this ultimatum."
 north_korea.1.b: "We will fight to the end!"
 norway.1.t: "1985 elections"
 norway.1.desc: "On September 8 and 9, 1985, regular elections to the Storting were held in Norway. The ruling three-party coalition led by Prime Minister Kåre Willoch lost its majority, but managed to retain power thanks to the support of Fremskrittspartiet. Høyre received 30.4% and 50 seats, losing three mandates, while Arbeiderpartiet under Gro Harlem Brundtland gained 40.8% and 71 seats. Despite this, the left could not form a government due to a split with SV. The main sensation was the disappearance of Venstre from the Storting for the first time in a hundred years — the party did not pass the threshold."
 norway.1.a: "Gro Harlem Brundtland!"
 norway.1.b: "Erling Norvik!"
 norway.2.t: "1989 elections"
 norway.2.desc: "On September 10 and 11, 1989, regular elections to the Storting were held in Norway. Against the backdrop of falling world oil prices and economic difficulties, voters turned away from mainstream parties — both left and right. The main sensation was the Progress Party led by the charismatic Carl I. Hagen, which gained 13.0% of the vote and increased its representation by 20 mandates, becoming the third largest force in parliament. The Socialist Left Party also achieved success, receiving 10.1% and 17 seats. The ruling Labour Party, led by Gro Harlem Brundtland, although remaining the largest with 34.3% of the vote, suffered its worst defeat in 40 years, losing 8 seats. The Conservative Party also experienced a serious decline, losing 13 mandates and falling to 22.2%."
 norway.2.a: "Jan P. Syse!"
 norway.2.b: "Gro Harlem Brundtland!"
 philippines.1.t: "Yellow Revolution"
 philippines.1.desc: "February 1986. After falsified snap elections in which Marcos was declared the winner, millions of Filipinos took to the streets. On February 22, Defense Minister Juan Ponce Enrile and Deputy Chief of Staff Fidel Ramos announced their break with the regime and took refuge in Camp Crame and Camp Aguinaldo. Cardinal Jaime Sin spoke on Radio Veritas, calling on the people to come out to EDSA and stand between the tanks and the mutinous military. A crowd of more than a million people, armed with food, flowers and rosaries, blocked government troops, who refused to shoot civilians. On February 24 the rebels seized the state television station, and Air Force helicopters went over to the opposition. In Washington the White House stated that Marcos's continued stay in power was 'useless' and offered him asylum. On the night of February 25, Marcos with his family and entourage left Malacañang on American helicopters and went into exile in Hawaii. On the same day Corazon Aquino was sworn in as the new president of the Philippines."
 philippines.1.a: "Hooray! Freedom!"
 portugal.1.t: "1985 elections"
 portugal.1.desc: "Elections were called early after the ruling coalition 'Central Bloc' fell apart. The new leader of the PSD, Aníbal Cavaco Silva, elected in May 1985, was a categorical opponent of this union and in June withdrew his party from the government, which led to the resignation of the cabinet and the dissolution of parliament.\n\nThe main sensation was the appearance of the 'Party of Democratic Renewal' (PRD), created with the support of President Ramalho Eanes. The new party immediately gained 17.9% of the vote and elected 45 deputies, becoming the third force in the Assembly. The Socialists led by Almeida Santos suffered a crushing defeat, losing 44 mandates (from 101 to 57), while the PSD of Cavaco Silva won, receiving 88 seats, but without an absolute majority.\n\nCavaco Silva formed a minority government that depended on the situational support of the PRD. This union turned out to be fragile and lasted until 1987, when Eanes's party withdrew its support, which led to a new government crisis."
 portugal.1.a: "Conservatives!"
 ren.1.t: "Proclamation of the Republic of Mozambique"
 ren.1.desc: "The war is over. FRELIMO has fallen. After sixteen years of civil war, after RENAMO took Maputo with the support of South Africa and Rhodesia, President Chissano fled or was killed — no one knows exactly. Secular Africa, the last stronghold of Marxism in Southern Africa, has collapsed. RENAMO announces the creation of the Republic of Mozambique — without 'people's,' without socialism, without a one-party system.\n\nFor us this is victory. We fought against FRELIMO from the very beginning, helped RENAMO with weapons, money and people. Now Maputo is ours. But it is too early to rejoice: the country is in ruins, the economy is destroyed, millions of refugees, famine. RENAMO are partisans, not a government, and they do not know how to govern. South Africa demands a share in oil and ports, Rhodesia — its own conditions, the West expects us to become their ally. And FRELIMO has not disappeared — its supporters went underground and to the northern provinces.!"
 uni.1.a: "Hooray!"
 somalia.1.t: "Peace with Ethiopia"
 somalia.1.desc: "April 1988. After ten years of war and mutual support of rebels, we sit down at the table with Mengistu. Ethiopia and Somalia sign an agreement: ceasefire, withdrawal of troops from the border, refusal to support insurgents. For us this is a chance to untie our hands in the north, where the SNM is already capturing cities, and to stop the senseless war for the Ogaden, which we lost back in 1978.\n\nBut peace with Ethiopia is not only a breather. This is recognition that the Ogaden remains with Addis Ababa, and we renounce the dream of Greater Somalia. The army, clans and veterans will not forgive this. But Mengistu promises to close SNM bases on his territory, and this gives us a chance to hold the north before it is too late."
 somalia.1.a: "Finally."
 somalia.2.t: "Civil war"
 somalia.2.desc: "April 1989. After peace with Ethiopia we threw the army north against the SNM, but this only strengthened resistance. The Somali National Movement captures cities in Isaaq, government troops respond with artillery and aviation, but to little effect. In the south the United Somali Congress and the Somali Patriotic Movement raise the Hawiye and Darod clans. The economy has collapsed, the army is falling apart, the US is cutting aid due to human rights violations. Barre clings to power, but the clans are arming themselves, and the country is creeping apart."
 somalia.2.a: "We will introduce a state of emergency."
 somalia.3.t: "Uprising of the Somali Patriotic Front"
 somalia.3.desc: "The south is rising. The Somali Patriotic Front, created by Ogadeni officers, declares war on the Barre regime. Its detachments are already operating in Gedo and Lower Juba, capturing cities, cutting roads to Kismayo. They are joined by army deserters, the Darod and Rahanweyn clans. This is not just another mutiny — it is a front that can reach Mogadishu."
 somalia.3.a: "Everything is terrible..."
 spla.1.t: "Proclamation of the Republic of Sudan"
 spla.1.desc: "The Nimeiry regime introduces Sharia throughout the country, including the Christian and animist South. In response to the uprising in Bor, Colonel John Garang deserts from the army and on July 31 publishes the manifesto of a new movement — the Sudan People's Liberation Movement and its military wing, the SPLA. The manifesto calls not for the separation of the South, but for the construction of a 'New Sudan' — a united, democratic and secular state where all citizens are equal regardless of religion and origin."
 spla.1.a: "Hooray!"
 sudan.1.t: "Military coup"
 sudan.1.desc: "April 1985. The regime of Jaafar Nimeiry is collapsing before his eyes. After he, at the demand of the IMF, canceled subsidies on bread and fuel, Khartoum was engulfed by demonstrations and a general strike. Trade unions, doctors and lawyers united against the president, whom neither a state of emergency nor promises save. Nimeiry at this moment is not in the country — he went to Washington for loans and returns only to Cairo, where Mubarak offers him asylum.\n\nWhile the president is on the way, the army acts. On April 6 a group of senior officers led by Defense Minister Abdel Rahman Swar al-Dahab — a man Nimeiry himself appointed to this post — carries out a bloodless coup. The constitution is suspended, the airport closed, borders sealed, ministers arrested. Swar al-Dahab announces on the radio that the army 'stood on the side of the people to avoid bloodshed.' A Transitional Military Council of 15 generals is created, and power is promised to be returned to civilians within a year."
 sudan.1.a: "We will hold military power."
 sudan.2.t: "Resumption of civil war"
 sudan.2.desc: "After two years of Sadiq al-Mahdi's rule, peace negotiations with the SPLA reached a dead end. The government refuses to freeze Sharia, Garang refuses to lay down arms. Instead of compromise — an offensive. The SPLA goes on the attack in the south, captures Torit, Kapoeta, cuts roads to Juba. Government garrisons flee or surrender, the army is demoralized, clan militias go over to the side of the rebels. Juba is under siege, the south is effectively lost.\n\nFor Khartoum this is a catastrophe. Islamists demand to continue the war to the end, the army demands money and weapons, southerners in the government demand the abolition of Sharia. The US and Egypt pressure, demanding negotiations. Ethiopia openly supports the SPLA. The question is what to do: throw the last forces to the south, begin negotiations with Garang, or seek external help."
 sudan.2.a: "Counteroffensive!"
 sweden.1.t: "1985 elections"
 sweden.1.desc: "Today Sweden held regular elections to the Riksdag. Olof Palme and the Social Democrats were going for a third consecutive term, but the economy was stalling, unemployment was growing, and environmental issues sounded loudly on the agenda for the first time. The main sensation of the campaign was Bengt Westerberg and his People's Party: the liberals doubled their support, taking votes from the Moderates and the Center Party. Ulf Adelsohn and Thorbjörn Fälldin were losing ground, and the Left Communists led by Lars Werner retained a modest but stable representation. Turnout exceeded 89%. In the end won..."
 sweden.1.a: "Olof Palme!"
 sweden.1.b: "Ulf Adelsohn!"
 sweden.1.c: "Bengt Westerberg!"
 sweden.2.t: "1988 elections"
 sweden.2.desc: "Today Sweden held regular elections to the Riksdag. The campaign began against the backdrop of an economic upswing — unemployment only 2.3%, a balanced budget. But in June a scandal erupted around the Ebbe Carlsson affair, connected with the investigation into the murder of Olof Palme: Minister of Justice Anna-Greta Leijon resigned, and the government lost part of its trust. Closer to autumn environmental issues came to the fore — algae blooms in the Baltic, mass death of seals, closed beaches. This played into the hands of the Green Party, which for the first time passed the four-percent threshold and entered the Riksdag. The Moderates of Carl Bildt and the People's Party of Bengt Westerberg were losing ground, while the Center Party of Olof Johansson, on the contrary, strengthened. Won candidate..."
 sweden.2.a: "Ingvar Carlsson!"
 sweden.2.b: "Carl Bildt!"
 sweden.2.c: "Bengt Westerberg!"
 sweden.3.t: "1991 elections"
 sweden.3.desc: "Today Sweden held regular elections to the Riksdag. The campaign took place against the backdrop of a deep economic crisis: unemployment was growing, the budget deficit reached record levels, and the banking crisis was just beginning. The Social Democrats of Ingvar Carlsson, in power since 1982, went to the elections with a promise to protect the 'Swedish model,' but voters were tired of high taxes and growing expenses. The main sensation of the campaign was the appearance of two new parties: the Christian Democrats for the first time passed the four-percent threshold, and the populist 'New Democracy' of Ian Wachtmeister, created just seven months before the elections, immediately received seats in parliament. The Green Party, on the contrary, lost everything, failing to pass the threshold. The Moderates of Carl Bildt and the liberals of Bengt Westerberg promised a 'new start' — tax cuts, privatization and reduction of government spending. Won..."
 sweden.3.a: "Carl Bildt!"
 sweden.3.b: "Ingvar Carlsson!"
 sweden.3.c: "Bengt Westerberg!"
 taiwan.1.t: "Death of Chiang Ching-kuo"
 taiwan.1.desc: "A heart attack cut short the life of the man who had stood at the helm of the island for almost a decade. The last direct heir of the Chiang dynasty has died. A year ago, on his initiative, the long-standing martial law was lifted, the opposition legalized, and doors opened for dialogue with the outside world. But along with this, his departure leaves Taiwan at a crossroads: the old guard of the Kuomintang clings to former orders, society demands full democratization, and across the Taiwan Strait they carefully watch for any signs of weakness."
 taiwan.1.a: "This is a tragedy..."
 turkey.1.t: "Evren's departure"
 turkey.1.desc: "Kenan Evren leaves the post of President of Turkey, completing a seven-year term that began after the coup of September 12, 1980. A former Chief of the General Staff who led the military junta, he ruled the country first as head of state, and from 1982 as elected president. His rule is remembered for mass repressions: criminal cases were opened against 230 thousand people, hundreds died under torture, dozens were executed. Democracy returned in 1983, but with restrictions — only parties approved by the military were allowed to participate in elections. Evren goes into the shadows, leaving behind a split society and an army that will long consider itself the guarantor of stability."
 turkey.1.a: "Farewell!"
 uni.1.t: "Proclamation of the Republic of Angola"
 uni.1.desc: "The war is over. The MPLA has fallen. After sixteen years of civil war, after UNITA took Luanda with the support of South Africa and the USA, President José Eduardo dos Santos fled or was killed — no one knows exactly. Cuban troops have been withdrawn, Soviet advisers evacuated, oil rigs stand idle. Jonas Savimbi announces the creation of the Republic of Angola — without socialism, without a one-party system, without Soviet friends.\n\nFor us this is victory. We fought against the MPLA since 1975, helped UNITA with weapons, money and people. Now Luanda is ours. But it is too early to rejoice: the country is in ruins, the economy is destroyed, millions of refugees, famine. UNITA are partisans, not a government, and they do not know how to govern. South Africa demands a share in diamonds, the USA — oil, the West expects us to become their ally. And the MPLA has not disappeared — its supporters went underground and to the northern provinces."
 yemen.1.t: "Proclamation of the Republic of Angola"
 yemen.1.desc: "South Yemen is in deep crisis: the economy is collapsing, the communist regime is losing control, in Aden there is a struggle for power between Ali Nasir Muhammad and Abd al-Fattah Ismail. North Yemen, led by Ali Abdullah Saleh, watches this with growing interest. In Sanaa they have long been talking about the 'reunification of the homeland,' but on what terms is an open question. The southerners propose an equal union of two states, the northerners are ready to accept the South into the YAR on their terms. In November 1989 the negotiations in Aden reach a dead end. Saleh orders the army to prepare for two scenarios: either peaceful annexation through a treaty, or support for anti-communist forces in South Yemen so that they take power and ask to join the YAR."
 yemen.1.a: "We annex the south."
 yemen.1.b: "Let's start a second civil war!"
