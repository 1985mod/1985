usa.37.t: "The USA proposes signing CHB - I"
usa.37.d: "A government delegation has arrived from Washington with an unexpected and ambitious draft agreement, given the code designation CHB - I. The American side proposes fixing the current balance of forces and establishing strict frameworks for strategic cooperation and arms control. \n\nFierce disputes have erupted in the People's Commissariat for Foreign Affairs. Supporters of the agreement argue that signing the CHB - I treaty will ease international tensions, give our industry a breather, and open access to valuable technologies. However, skeptics warn: this could turn out to be a cunning diplomatic trap of the capitalists, designed to tie the Soviet Union's hands before the coming storm. The final decision remains with the Kremlin."
usa.37.a: "Fine, we will sign."
usa.37.b: "Never!"
usa.38.t: "The USSR refused"
usa.38.d: ""
usa.38.a: "So much the worse for them, a new race."
usa.38.b: ""
usa.39.t: "The USSR agreed to the meeting"
usa.39.d: ""
usa.39.a: "Hello, Mr. Gorbachev."
usa.40.t: "The USSR officially refused the meeting."
usa.40.d: ""
usa.40.a: "This is an escalation of the Cold War!"
usa.41.t: "Economic aid from the USA"
usa.41.d: "Within the framework of Washington's new foreign policy doctrine, our government has received an official proposal from the US State Department. The American administration is ready to include our country in a large-scale program of financial and technical assistance. We are offered large dollar grants for infrastructure development, preferential loans for business, and supplies of advanced equipment. The opposition warns of the risk of losing economic sovereignty, but the ministry of finance insists: this money will save our budget."
usa.41.a: "Thank you, America!"
usa.41.b: "No ties with America!"
usa.42.t: "Mutual assistance proposal from the USA"
usa.42.d: "A high-ranking delegation from Washington has arrived at the office of the head of our state with an official proposal to conclude a Mutual Assistance Treaty. The Americans offer us an unprecedented support package: direct supplies of heavy weapons, grants for modernizing ports and airfields, and access to the latest military doctrines. However, this pact has its price. The White House demands that the American armed forces be granted rights for troop transit, fleet refueling, and the organization of permanent bases on our territory. The generals see this as a unique chance to strengthen the army, but diplomats warn — this will finally tie our foreign policy course to Washington's will."
usa.42.a: "We definitely agree."
usa.42.b: "Never! America sucks."
usa.43.t: "Iran accepted our proposal"
usa.43.d: ""
usa.43.a: "Good."
usa.44.t: "Iran refused"
usa.44.d: ""
usa.44.a: "So much the worse for them."
usa.45.t: "The USA is conducting bombings on our territory!"
usa.45.d: ""
usa.45.a: "This is illegal! We will declare a diplomatic protest."
usa.46.t: "The USA proposes holding exercises"
usa.46.d: "Washington has officially requested from our government permission and logistical support for holding the largest military maneuvers of the decade — “Reforger-88.” The USA plans to rapidly transfer a hundred-thousand-strong group of troops across the ocean to practice a scenario of total war against the Warsaw Pact. Our General Staff supports this initiative. However, the Ministry of Foreign Affairs warns: tanks on our streets will provoke a harsh response from Moscow. Panic is growing in society, pacifists are already taking to protest marches. What is our decision?"
usa.46.a: "We agree. In our time this is necessary."
usa.46.b: "Perhaps we will refuse"
usa.47.t: "The USA proposes that we sign the INF Treaty"
usa.47.d: "The final draft of the INF Treaty has arrived from Washington through official communication channels. Ronald Reagan's administration proposes an unprecedented step: the complete elimination of an entire class of nuclear weapons. However, the US conditions are extremely harsh. They demand not merely parity reductions, which would force us to dispose of almost twice as many missiles as the Americans will destroy. The Politburo is split. Economists insist that this is the only chance to stop the arms race and save the Perestroika budget. The military, led by the General Staff, declare that agreeing to American conditions is unilateral disarmament and a betrayal of national interests. Our answer will determine the fate of the socialist bloc..."
usa.47.a: "We definitely agree."
usa.47.b: "No deals with capitalists!"
usa.48.t: "The USSR agreed to sign the INF Treaty"
usa.48.d: "Incredible news from the Kremlin! Mikhail Gorbachev has officially accepted our “double zero option.” The Soviet Union agrees to completely eliminate not only its SS-20 intermediate-range missiles, but also shorter-range systems, including the newest Oka system, which formally was not even covered by the restrictions. Under the terms of the agreement, the USSR will destroy almost twice as large a missile arsenal as the United States. This is an unconditional triumph of our “peace through strength” strategy."
usa.48.a: "Excellent, everything is going according to plan!"
usa.49.t: "The USSR refused to sign the INF Treaty"
usa.49.d: "The worst fears of the Pentagon and CIA have been confirmed: Mikhail Gorbachev at the last moment denounced the draft agreement and refused to sign the INF Treaty. The Soviet delegation stated that US demands for the elimination of the newest Oka systems and total inspection control infringe upon the sovereignty and security of the USSR. The détente process is officially dead. Soviet “Pioneers” (SS-20) remain on combat duty, aimed at the capitals of Western Europe. NATO public is in panic, and hawks in the Senate demand an immediate and harsh response from President Reagan."
usa.49.a: "To hell with them!"
usa.50.t: "The INF Treaty entered into force"
usa.50.d: "Today in Moscow, Mikhail Gorbachev and Ronald Reagan exchanged instruments of ratification. The historic treaty has officially entered into force. Across the country, from Kapustin Yar to Saryozek, controlled destruction of intermediate- and shorter-range missiles begins. For the Soviet Union, this is a step toward “New Political Thinking” and détente, but part of the generals at Headquarters express deep concern about the weakening of the nuclear shield in Europe..."
usa.50.a: "Excellent!"
ddr.1.t: "XI Congress of the SED"
ddr.1.desc: "In Berlin, in the huge hall of the Palace of the Republic, thousands of delegates from all over Germany are gathering. The XI Congress of the SED is taking place under the sign of historic achievements. The party summarizes the decade, noting unprecedented growth in industry and strengthening of the country's defense capability.\nThe Central Report, read by the General Secretary, states that the German Democratic Republic has finally embarked on the path of building a developed socialist society. The new party program emphasizes the need for further tightening of party ranks, struggle against bourgeois ideology, and strengthening the role of the state in the economy. The congress proceeds in a single impulse, without a single reservation."
ddr.1.a: "Hurray!"
ddr.2.t: "Honecker's visit to Bonn"
ddr.2.desc: "For the first time in history, the Chairman of the State Council of the GDR sets foot on West German soil on an official visit. Erich Honecker meets with the Federal Chancellor of the FRG surrounded by journalists and diplomats from all over the world. The protocol is observed down to the smallest detail: a military band, raising of flags, smiles for the press."
ddr.2.a: "Long live the FRG!"
ddr.3.t: "Unification with the dissenters"
ddr.3.desc: "In the huge hall, where previously only approving ovations toward the Politburo were heard, now sit dissidents, intellectuals, and party functionaries. The future of the nation is being discussed: multi-party system, market elements in the economy, and the fate of the Stasi. This is not capitulation; it is an attempt to save the state by giving it a breath of fresh air. For the first time in many years, Germans are talking to each other not through barbed wire, but face to face."
ddr.3.a: "We will carry out broad reforms"
ddr.3.b: "Harsh suppression - no concessions"
ddr.4.t: "Election falsification"
ddr.4.desc: "Local elections in the GDR districts took place with a “record turnout” and an overwhelming majority of votes for National Front candidates. However, the very next day rumors began to spread through the city — independent observers and Western media report mass ballot stuffing, falsification of protocols, and intimidation of voters. Within the SED itself a scandal is flaring up: several party members demand a recount, and trade unions threaten strikes."
ddr.4.a: "The West is to blame for everything!"
ddr.5.t: "Conspiracy"
ddr.5.desc: "In the walls of the old SED Central Committee building there is a smell of sulfur. In recent weeks, the General Secretary notices that his usual instructions are carried out with delay, and some members of the Politburo gather too often for “informal lunches” without his knowledge. Stasi agents report secret contacts between several high-ranking party members and representatives of the military command."
ddr.5.a: "I see."
ddr.6.t: "Modrow's government"
ddr.6.desc: "After Honecker's resignation and Krenz's short rule, the party found itself in a deep crisis. The streets demand change, the economy is creaking at the seams, and Moscow under Gorbachev refuses the former support. Under these conditions, the Politburo nominates Hans Modrow for the post of prime minister — a man with a reputation as a pragmatist and supporter of dialogue."
ddr.6.a: "Course toward unification with the FRG"
ddr.7.t: "Free elections in the GDR"
ddr.7.desc: "For the first time in forty years, the inhabitants of the German Democratic Republic are going to polling stations to make a truly free choice. Dozens of parties are participating in the election race — from the post-communist PDS to liberals and greens. The main intrigue: will the reformed socialists be able to retain power, or will the people vote for immediate unification with the FRG?"
ddr.7.a: "The CDU alliance won"
ddr.8.t: "Order 101: Do not shoot"
ddr.8.desc: "The night of November 9 to 10, 1989. The Berlin Wall, the embodiment of Germany's division, becomes the epicenter of drama. At the Bornholmer Strasse checkpoint and other crossings, tens of thousands of people are gathering, demanding free exit. Border guards are confused — their instructions prescribe opening fire in case of an attempted breakthrough, but the Politburo has just transmitted an ambiguous “Order 101” through closed channels."
ddr.8.a: "Completely cancel the order to shoot."
ddr.9.t: "Gerontocracy in the SED"
ddr.9.desc: "Within the SED, quiet discontent has been maturing for several years. The party leadership consists of people whose average age has passed seventy. They still remember the war, Stalinism, the building of the Wall, but they completely fail to understand new trends — computerization, environmental movements, the demands of youth. At the last Politburo meeting, one of the ideology secretaries, already over eighty, fell asleep right during a report on perestroika."
ddr.9.a: "We will preserve the status quo"
ddr.9.b: "We will rejuvenate our party, forward with the SED!"
ddr.10.t: "Resignation of Erich Honecker"
ddr.10.desc: "The streets of East German cities have been buzzing for several weeks - tens of thousands of people demand change, freedom of speech, and the right to travel abroad. Erich Honecker, the unchanging leader of the GDR for almost twenty years, looks broken. He is 77, ill, tired, and has lost his main ally — Mikhail Gorbachev, who openly stated that Moscow would not “defend those who are against perestroika.”"
ddr.10.a: "Honorable resignation - transfer of power to Krenz"
ddr.11.t: "Socialism on the brink of bankruptcy"
ddr.11.desc: "The East German economy is creaking at the seams. The country's foreign debt has exceeded 20 billion West German marks, and interest payments are eating up almost its entire export potential. Factories are operating at three-quarters capacity, and many unprofitable enterprises are kept afloat only by state subsidies. Store shelves are empty: butter, meat, coffee, and citrus fruits have disappeared from free sale."
ddr.11.a: "Centralized belt-tightening - planned autarky"
ddr.12.t: "MiG-29 deliveries"
ddr.12.desc: "The newest Soviet MiG-29 fighters — fourth-generation machines that in their flight characteristics surpass most of NATO's fleet — are beginning to arrive at military airfields in East Germany. The National People's Army of the GDR receives more than twenty units of these formidable machines — “swallows” capable of patrolling airspace and participating in exercises on equal terms with any Western adversary."
ddr.12.a: "Accept the full batch - we will strengthen our air force!"
ddr.13.t: "Independent GDR"
ddr.13.desc: "September 1990 will go down in history as the moment of the final collapse of the Eastern Bloc. Amid the rapid unification of Germany and the collapse of the communist regime, the leadership in East Berlin officially announced the withdrawal of the German Democratic Republic from the Warsaw Pact Organization. \nThis step, agreed within the framework of the “Two Plus Four” arrangements, marks the actual liquidation of the East German army (NVA) and the end of four decades of Moscow's military presence in the heart of Europe. Soviet troops are preparing for evacuation, and West German structures are already taking control of the borders. The flags of the Eastern Bloc are lowered - the banks of the Elbe no longer divide two irreconcilable systems."
ddr.13.a: "For our independent Germany!"
ddr.14.t: "The GDR left the Warsaw Pact"
ddr.14.desc: "September 1990 will go down in history as the moment of the final collapse of the Eastern Bloc. Amid the rapid unification of Germany and the collapse of the communist regime, the leadership in East Berlin officially announced the withdrawal of the German Democratic Republic from the Warsaw Pact Organization. \nThis step, agreed within the framework of the “Two Plus Four” arrangements, marks the actual liquidation of the East German army (NVA) and the end of four decades of Moscow's military presence in the heart of Europe. Soviet troops are preparing for evacuation, and West German structures are already taking control of the borders. The flags of the Eastern Bloc are lowered - the banks of the Elbe no longer divide two irreconcilable systems."
ddr.14.a: "Everything has collapsed..."
wgr.1.t: "Course of the FRG"
wgr.1.desc: "1985 became for the FRG a year of turning-point party decisions, unexpected triumphs, and painful defeats. On stage are three main political forces, each experiencing its own drama."
wgr.1.a: "CDU - our choice!"
wgr.1.b: "SPD - for an independent Germany!"
wgr.1.c: "FDP - for freedom!"
wgr.2.t: "Determining the economic course"
wgr.2.desc: "1985 became for the FRG a year of a harsh choice of economic strategy. Kohl's government and the Bundesbank faced a dilemma: continue the policy of fiscal restraint, which brought a record trade surplus and low inflation, or yield to pressure from allies and launch large-scale stimuli for domestic demand?"
wgr.2.a: "Let's give migrants at least something."
wgr.2.b: "Germany above all!"
wgr.3.t: "An era of tension"
wgr.3.desc: "In 1985, West Germany was not simply a European country, but the main battlefield between the blocs. Here, on the fault line, every gesture had weight.\n\nGorbachev's arrival in the Kremlin in March promised change, but did not remove the old tension. Moscow still considered Bonn aggressive. And in the summer a diplomatic scandal erupted — German youth delegations left a festival in Moscow because of humiliating treatment of West Berlin.\n\nBut the real shock came on August 19: the head of the FRG counterintelligence defected to the GDR. This was not simply betrayal, but a blow to the entire security system of the West. And against this background - the daily game with East Berlin: exchanging spies, allowing refugees through, political manipulation.\n\nThe FRG of 1985 lived under the hood of the Cold War. Allies pressured, the East threatened, and the country learned to survive in this tension - and to find its own path."
wgr.3.a: "We must endure."
wgr.4.t: "Germany - European leader"
wgr.4.desc: "The figures of 1985 spoke for themselves. The FRG possessed the world's largest currency reserves — $44 billion** at the end of 1984. The country demonstrated a healthy positive trade balance of **$30 billion. Projected GDP growth of 3% was the best figure since 1979 and one of the highest in Western Europe. The export-oriented economy of the FRG was more closely integrated with Western Europe than with any other part of the world."
wgr.4.a: "We are strong!"
