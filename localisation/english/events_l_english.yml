usa.19.t: "Recording of the charity single “We Are the World” by “USA for Africa”"
usa.19.d: "January 28, 1985. At A&M Studios in Los Angeles, immediately after the American Music Awards ceremony, more than 45 of America's greatest music stars gathered. Michael Jackson and Lionel Richie wrote the song, and Quincy Jones took on producing this ambitious project. The goal is to raise funds to fight famine in Ethiopia, where a terrible famine is raging."
usa.19.a: "We are the world."
