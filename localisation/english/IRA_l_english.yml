l_english:
 ira_conflict_category: "The Irish Crisis"
 ira_conflict_category_desc: "The Irish Republican Army (IRA) is a paramilitary organization seeking to detach Northern Ireland from the United Kingdom and unite it with the Republic of Ireland. This organization poses a direct threat to our territorial integrity and must be eliminated. Northern Ireland has been, is, and will forever remain an integral part of our Kingdom."
 
 ira_give_up_to_IRA: "Concede to the IRA"
 ira_give_up_to_IRA_desc: "The prolonged conflict has exhausted our resources. We are forced to admit that a military solution is beyond our reach. The only way out is to persuade the Irish government to influence the IRA and offer Northern Ireland broad autonomy within the Kingdom. This is a difficult but necessary step toward peace."
 
 ira_military_operation: "Launch Military Operation in Ulster"
 ira_military_operation_desc: "His Majesty's Government has run out of patience. The separatists have crossed every line. The time has come for decisive and ruthless action. We will deploy all necessary forces to dismantle the IRA's terrorist network, hunting them down wherever they hide. Let them condemn us — preserving the integrity of the Kingdom matters more. Northern Ireland is forever part of Great Britain."
 
 northern_ireland_ira_activity: "IRA Activity"