l_english:
 sp_event_world_war_three: "World War III"
 sp_event_world_war_three_REMARK: "It has begun..."
 sp_event_world_war_three_QUOTE: "I do not know with what weapons World War III will be fought, but World War IV will be fought with sticks and stones.\n- Albert Einstein"
 sp_event_operation_desert_storm: "Operation Desert Storm"
 sp_event_operation_desert_storm_REMARK: "Democracy..."
 sp_event_operation_desert_storm_QUOTE: "The mother of all wars has begun!\n- Saddam Hussein"
 sp_super_reunification_of_germany_storm: "Reunification of Germany"
 sp_super_reunification_of_germany_REMARK: "Hooray!"
 sp_super_reunification_of_germany_QUOTE: "The division of Germany was contrary to the nature of things. It was unnatural, artificial, and therefore could not exist for long. Our goal remains unchanged: the unity of our nation in conditions of freedom.\n- Helmut Kohl"
 sp_super_event_formation_uss: "Formation of the Union of Sovereign States"
 sp_super_event_formation_uss_REMARK: "Hooray!"
 sp_super_event_formation_uss_QUOTE: "Reforms should be completed by the one who started them. And I was the one who started them!\n- Mikhail Gorbachev"
 sp_super_event_military_coup_detat: "Military Coup in Russia"
 sp_super_event_military_coup_detat_REMARK: "Surprising..."
 sp_super_event_military_coup_detat_QUOTE: "Our normal state is to crawl and crawl out. It is a unique ability of Russia to crawl out of abysses with broken bones, sometimes on its teeth, if there are no teeth — on its gums.\n- Alexander Lebed"
 sp_super_event_first_chechen_war: "First Chechen War"
 sp_super_event_first_chechen_war_REMARK: "Interesting."
 sp_super_event_first_chechen_war_QUOTE: "We will take Grozny with two airborne regiments.\n- Pavel Grachev"
 sp_super_event_collapse_of_america: "Collapse of the USA"
 sp_super_event_collapse_of_america_REMARK: "Oh God..."
 sp_super_event_collapse_of_america_QUOTE: "Government is like a baby: an alimentary canal with a big appetite at one end and no sense of responsibility at the other.\n- Ronald Reagan"
 sp_super_event_two_korean_war: "Second Korean War"
 sp_super_event_two_korean_war_REMARK: "Again..."
 sp_super_event_two_korean_war_QUOTE: "The duty of a revolutionary is to go into the thick of the popular masses carrying out the revolution.\n- Kim Il-sung"
 sp_event_start_sec: "Start of the GKChP"
 sp_event_start_sec_REMARK: "Chaos in the USSR - nothing unusual"
 sp_event_start_sec_QUOTE: "It is not by chance that I speak of the need to restore former might. Otherwise they will not let us survive!\n- Vladimir Kryuchkov"
 sp_civil_war_in_somalia: "Civil War in Somalia"
 sp_civil_war_in_somalia_REMARK: "Revolution devours its children..."
 sp_civil_war_in_somalia_QUOTE: "In short, who is a teacher? He can truly be considered a father or mother, just as we call our homeland mother. There is nothing more respected.\n- Mohamed Siad Barre"
 sp_sov_world_war_three_victory: "Victory of the USSR in World War III"
 sp_sov_world_war_three_victory_REMARK: "Communism has overcome Europe..."
 sp_sov_world_war_three_victory_flag_QUOTE: "The victory of communism is inevitable. Victory will be its.\n- Vladimir Lenin"
 sp_nato_world_war_three_victory: "Victory of NATO in World War III"
 sp_nato_world_war_three_victory_REMARK: "Capitalism is now in the USSR..."
 sp_nato_world_war_three_victory_QUOTE: "Socialists shout 'Power to the people!' and raise a clenched fist. We all know what that really means: 'Power over the people. Power to the State'.\n- Margaret Thatcher"
 sp_rus_black_october_october: "Black October"
 sp_rus_black_october_october_REMARK: "Oh God..."
 sp_rus_black_october_october_QUOTE: "The Russian state, which has chosen democracy and freedom, will never be an empire, nor an elder, nor a younger brother; it will be equal among equals.\n- Boris Yeltsin"
 
 
 
 
 
 
 

