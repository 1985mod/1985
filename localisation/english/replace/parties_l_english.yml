l_english:
 communism: "Totalitarian Socialism"
 communism_noun: "Totalitarian Socialism"
 communism_desc: "Socialist State"
 marxism: "Marxism"
 marxism_desc: "Marxism is a system of philosophical, economic and socio-political views asserting that history is driven by class struggle, and that capitalism will inevitably be replaced by communism through the liberation of the working class and the abolition of private property."
 leninism: "Leninism"
 leninism_desc: "Leninism is a Marxism-based ideology whose main tenets are the construction of a socialist state under the leadership of a vanguard party and world revolution aimed at overthrowing capitalist society. Within the party itself, before final decisions are made, debate and disagreement are possible."
 chinese_socialism: "Chinese Socialism"
 chinese_socialism_desc: "Socialism with Chinese characteristics is the socio-economic model officially adopted in the PRC, combining long-term political dominance of the Communist Party (a vanguard party) with market economy mechanisms and mixed ownership. This ideology prioritises national stability and technological modernisation over the classical Marxist demand for immediate abolition of private property, viewing the current stage as the 'primary stage of socialism' necessary for building a powerful sovereign state."
 communist_perestroika: "Communist Perestroika"
 communist_perestroika_desc: "Communist Perestroika is an ideological concept of large-scale reform of the Soviet system, envisioning a 'purification' of Marxism-Leninism from Stalinist accretions and a transition to 'socialism with a human face' through mechanisms of glasnost and democratisation. Unlike the Chinese path, this model relied on political freedoms and decentralisation of governance as necessary conditions for overcoming economic stagnation. The process was based on the belief that in conditions of openness and honest debate, the party would maintain leadership, and the socialist system would gain a second wind."
 authoritarian_socialism: "Authoritarian Socialism"
 authoritarian_socialism_desc: "Authoritarian socialism is a political-economic model that postulates the construction of a classless society through the establishment of absolute state control over all spheres of life and the suppression of any opposition. Within this system, centralised planning and state ownership of the means of production are viewed as tools for achieving social justice, and the interests of the individual are completely subordinated to the interests of the collective or the state."
 democratic_socialism: "Democratic Socialism"
 democratic_socialism_desc: "Democratic socialism is a political ideology that asserts that social justice and economic equality must be achieved exclusively within a democratic multi-party system, with full respect for all civil rights and freedoms. Unlike authoritarian models, this concept rejects dictatorship and revolutionary violence, believing that the transition to socialism is possible only through parliamentary struggle, popular will, and evolutionary reforms."

 socialism: "Social Democracy"
 socialism_noun: "Social Democracy"
 socialism_desc: "Social Democratic State"
 nordic_model: "Nordic Model"
 nordic_model_desc: "The Nordic model is a socio-economic system combining a free market economy and a high level of personal freedom with a developed welfare state and collective labour market regulation. This model is based on social partnership between workers, employers and the state, ensuring a high degree of equality and social security while maintaining high capital competitiveness."
 the_third_way: "Third Way"
 the_third_way_desc: "The Third Way is a political-economic concept representing an attempt to synthesise centre-right economic policy and centre-left social programme. Within this model, both traditional state socialism with its excessive regulation and radical neoliberalism with its laissez-faire are rejected, instead proposing the adaptation of social-democratic values to the conditions of a globalised free market."
 classical_social_democracy: "Classical Social Democracy"
 classical_social_democracy_desc: "Classical social democracy is a political movement and ideology that emerged from the evolution of Marxism, aiming at the gradual reform of capitalist society into a socialist one through democratic institutions. Unlike revolutionary communism, this model holds that social justice, elimination of exploitation, and equality of opportunity are achievable through parliamentary reforms, active state regulation, and strengthening trade union rights."
 eco_social_democracy: "Eco-Social Democracy"
 eco_social_democracy_desc: "Eco-social democracy is a modern political concept that combines classical principles of social protection with demands for environmental sustainability. Within this framework, fighting inequality is seen as an integral part of fighting the climate crisis, which implies a radical transformation of the economy through 'green' state control, abandoning the priority of unconditional GDP growth in favour of ecological well-being, and redistributing resources to support the most vulnerable populations during the energy transition."
 liberal_social_democracy: "Liberal Social Democracy"
 liberal_social_democracy_desc: "Liberal social democracy is an ideological synthesis that emphasises individual rights, market freedoms, and the social responsibility of the state. Unlike more radical left-wing currents, this model views the market economy not as a temporary compromise but as the most efficient tool for producing goods, which requires state intervention only to correct 'market failures', ensure equal opportunities, and prevent excessive concentration of capital."
 
 liberalism: "Liberalism"
 liberalism_noun: "Liberalism"
 liberalism_desc: "Liberal State"
 classic_liberalism: "Classical Liberalism"
 classic_liberalism_desc: "Classical liberalism is a political and economic ideology that elevates individual freedom to the highest value and limits the role of the state to protecting private property, maintaining law and order, and upholding constitutional rights. Formed in the 18th–19th centuries, this doctrine holds that the spontaneous order arising from free market exchange and personal initiative is the most effective mechanism for social development and general welfare."
 neoliberalism: "Neoliberalism"
 neoliberalism_desc: "Neoliberalism is a modern interpretation of classical liberalism aimed at decentralising the economy through privatisation, deregulation, and radical cuts in government spending. Under this model, the free market is seen not only as the most efficient economic mechanism but also as a universal way of organising human activity, where competition is the main driver of innovation, and state intervention is recognised as the main obstacle to economic growth and personal initiative."
 social_liberalism: "Social Liberalism"
 social_liberalism_desc: "Social liberalism is a political doctrine asserting that true individual freedom is impossible without the state ensuring a certain level of material well-being and equal opportunities. Unlike neoliberalism, this concept holds that the state must actively correct market mechanisms to combat poverty, monopolies, and social injustice, because only a protected and educated citizen can fully exercise their liberal rights."
 
 conservatism: "Conservatism"
 conservatism_noun: "Conservatism"
 conservatism_desc: "Conservative State"
 classic_conservatism: "Classical Conservatism"
 classic_conservatism_desc: "Classical conservatism is a political philosophy based on recognition of the value of historical continuity, hierarchy, and the organic unity of society. Unlike liberalism, this model views man not as an isolated individual but as part of a complex system of traditions, religion, and national institutions, asserting that radical change is dangerous, and reforms must be cautious and grounded in the experience of past generations."
 reactionism: "Reactionism"
 reactionism_desc: "Reactionism is a radical-conservative stance aimed not merely at preserving the current order but at a full return to the political and social structure of the past. Ideologically, reactionism rejects the outcomes of major revolutions and modernisation shifts, considering them degradation, and calls for the restoration of lost institutions such as absolute monarchy, class divisions, or the dominant role of the church in state affairs."
 liberal_conservatism: "Liberal Conservatism"
 liberal_conservatism_desc: "Liberal conservatism is a moderate current that combines commitment to traditional institutions and the rule of law with defence of liberal economic principles and individual freedoms. Within this model, conservatism manifests in the protection of constitutional stability and moral foundations, while in economics it supports free markets, low taxes, and minimal state intervention, making it close to classical liberalism in business matters."
 social_conservatism: "Social Conservatism"
 social_conservatism_desc: "Social conservatism is an ideological direction that emphasises the protection of traditional moral values, family foundations, and religious dogmas as the basis of a stable society. Unlike purely political forms of conservatism, the main focus here is on preserving the 'moral climate': opposing secularisation, defending the traditional definition of marriage, and restricting abortion, often with state programmes that strengthen social cohesion and community ties."
 national_conservatism: "National Conservatism"
 national_conservatism_desc: "National conservatism is a variant of conservatism in which the protection of national identity, state sovereignty, and cultural uniqueness is placed above global economic or liberal interests. This ideology advocates strict immigration control, economic protectionism, and the preservation of the traditional way of life of the titular nation, often showing scepticism towards international organisations and globalisation processes."

 neutrality: "Authoritarianism"
 neutrality_noun: "Authoritarianism"
 neutrality_desc: "Authoritarian State"
 authoritarian_democracy: "Authoritarian Democracy"
 authoritarian_democracy_desc: "Authoritarian democracy is a political system in which democratic institutions (elections, parliament, constitution) are formally preserved, but real power is concentrated in the hands of a single leader or narrow group, who use administrative resources to suppress genuine opposition. Within this model, the expression of popular will is often used to legitimise harsh centralised rule, where civil liberties are restricted to ensure state stability and 'national unity'."
 autocracy: "Autocracy"
 autocracy_desc: "Autocracy is a form of government in which supreme state power belongs unrestrictedly and uncontrolled to a single person (monarch, dictator). Unlike authoritarian democracy, autocracy may not simulate democratic processes, relying solely on the security apparatus, personal loyalty of elites, and a cult of leadership, where law is the will of the ruler rather than an external limitation on his powers."
 oligarchism: "Oligarchism"
 oligarchism_desc: "Oligarchism is a political regime in which real power in the state belongs to a small group of the wealthiest and most influential individuals, who use state institutions to protect and increase private economic interests. Under oligarchism, officials are often merely formal executors of the will of shadow interest groups, and access to social mobility and resources is closed to the majority of the population, leading to the merger of business and politics."
 military_regimes: "Military Dictatorship"
 military_regimes_desc: "Military dictatorship is a form of government in which all political power is concentrated in the hands of the highest command of the armed forces or a special body ('junta'), which usually comes to power through a coup d'état. Under this model, civilian legislation is either suspended or subordinated to the orders of military leadership, and the regime's legitimacy is justified by the need to 'restore order', combat corruption, or eliminate external threats."

 fascism: "Nationalism"
 fascism_noun: "Nationalism"
 fascism_desc: "Nationalist State"
 baathism: "Ba'athism"
 baathism_desc: "Ba'athism is an ideology of Arab nationalism that aims to create a unified Arab state."
 ethnic_nationalism: "Ethnic Nationalism"
 ethnic_nationalism_desc: "Ethnic nationalism is a form of national identity in which belonging to a nation is determined exclusively by common origin, 'blood', language, and inherited cultural traditions. Within this model, the nation is seen as an extended family or biological community, making it impossible for representatives of other ethnic groups to fully join it, regardless of their loyalty to the state or knowledge of the language."
 civil_nationalism: "Civic Nationalism"
 civil_nationalism_desc: "Civic nationalism is a political concept that defines the nation as a community of citizens united by loyalty to common political institutions, values, and legal norms (the Constitution). This model is inclusive: it allows any individual, regardless of ethnic origin, to become a full member of the nation by accepting its civic obligations and following state laws."
 extreme_nationalism: "Extreme Nationalism"
 extreme_nationalism_desc: "Extreme nationalism is a radical ideology that postulates the absolute superiority of one's own nation over others and justifies aggressive methods of defending its interests, including violence, discrimination, and expansion. In this system, national egoism is elevated to a cult, individual rights are completely suppressed for the sake of 'national greatness', and international norms are ignored in favour of domination and suppression of perceived or real enemies."

