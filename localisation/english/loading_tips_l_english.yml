l_english:
 LOADING_TIP_0: "«It's better to work tomorrow than today!»\n- Mikhail Gorbachev"
 LOADING_TIP_1: "«A recession is when your neighbour loses his job. A depression is when you lose yours. A recovery is when Jimmy Carter loses his.»\n- Ronald Reagan (In those years, Jimmy Carter was president)"
 LOADING_TIP_2: "«There are plenty of jokes going around that Russia is the homeland of elephants, but it actually is the homeland.»\n- Mikhail Gorbachev"
 LOADING_TIP_3: "«They say that politics is the second oldest profession. But I have come to realise that it has much more in common with the first.»\n- Ronald Reagan"
 LOADING_TIP_4: "«You should have heard how Gromyko once said about this man: \"Yes, I made a mistake when I proposed Gorbachev for the post of head of the CPSU. He turned out to be a traitor.\"»\n- Dmitry Yazov"
 LOADING_TIP_5: "«My fellow Americans, I am pleased to tell you today that I have signed an order outlawing Russia forever. Bombing will begin in five minutes.»\n- Ronald Reagan"
 LOADING_TIP_6: "«The crisis was perhaps the most acute and dangerous episode of the Cold War, when Soviet-American relations reached a critical point. The sides stood on the brink of general nuclear missile war, and Cuba found itself at the very epicentre of those events.»\n- Dmitry Yazov"
 LOADING_TIP_7: "«Marks & Spencer defeated Karl Marx and Engels.»\n- Margaret Thatcher"
 LOADING_TIP_8: "«General Secretary Gorbachev, if you seek peace, if you seek prosperity for the Soviet Union and Eastern Europe, if you seek liberalisation, come here to this gate, Mr. Gorbachev, open this gate. Mr. Gorbachev, tear down this wall!»\n- Ronald Reagan"
 LOADING_TIP_9: "«The problem with socialism is that eventually you run out of other people's money.»\n- Margaret Thatcher"
 LOADING_TIP_10: "«He is a most intelligent man, an African Karl Marx, a Libyan Garibaldi, and he had a huge amount of money.»\n- Vladimir Zhirinovsky (About Muammar Gaddafi)"
 LOADING_TIP_11: "«Faith that has seized the mind and soul is stronger than scientific thought.»\n- François Mitterrand"
 LOADING_TIP_12: "«Even God made mistakes sometimes. I do not.»\n- François Mitterrand"
 LOADING_TIP_13: "«The fight against injustice is one of the most beautiful battles. It defined my political choice, and I still believe I was right...»\n- François Mitterrand"
 LOADING_TIP_14: "«Neither ox nor donkey can stop the progress of socialism.»\n- Erich Honecker"
 LOADING_TIP_15: "«The Wall will stand for another 50 and even 100 years, if the reasons for it are not eliminated.»\n- Erich Honecker"
 LOADING_TIP_16: "«I only have two flaws: a bad memory and... something else.»\n- Дэн Сяопин"
 LOADING_TIP_17: "«Even the densest forest consists of individual trees.»\n- Kim Il-sung"
 LOADING_TIP_18: "«To become a revolutionary, parental influence is important, but one's own subjective efforts are even more important.»\n- Kim Il-sung"
 LOADING_TIP_19: "«If you want to control the world, you must control oil, and for that, one of the main conditions is to break Iraq.»\n- Saddam Hussein"
 LOADING_TIP_20: "«You Americans, you treat the Third World approximately the way an Iraqi peasant treats his bride: three days of honeymoon, and then — off to the fields.»\n- Saddam Hussein"
 LOADING_TIP_21: "«We must try to change Japan's industrial structure so that it does not harm other countries. Otherwise, Japan may vanish from the face of the earth overnight, like Carthage. Can we continue to live with a surplus of 30-40 billion dollars a year? It's like playing mahjong — if you keep winning, no one wants to play with you anymore.»\n- Yasuhiro Nakasone"
 LOADING_TIP_22: "«That's quite a small amount! If Gorbachev had said: give us a hundred billion and you get the GDR — we would have done just that. What are a hundred billion for the Eastern lands when their annual budget is five hundred billion? We got the GDR for the price of a sandwich!»\n- Helmut Kohl"
 LOADING_TIP_23: "«Germany is our fatherland, a united Europe is our future.»\n- Helmut Kohl"
 LOADING_TIP_24: "«Iraq has no weapons of mass destruction, none at all. Such weapons are not pills that you can hide. It is easy to tell whether Iraq has them or not.»\n- Saddam Hussein"
 LOADING_TIP_25: "«Take as much sovereignty as you can swallow.»\n- Boris Yeltsin"
 LOADING_TIP_26: "«If prices become uncontrollable, exceeding three to four times, I will lie down on the railway tracks myself.»\n- Boris Yeltsin"
 LOADING_TIP_27: "«There will be no devaluation. I state this firmly and clearly.»\n- Boris Yeltsin"
 LOADING_TIP_28: "«I am leaving. I have done everything I could...»\n- Boris Yeltsin"
 LOADING_TIP_29: "«It is not the people who are heading towards catastrophe, but certain individuals.»\n- János Kádár"
 LOADING_TIP_30: "«It is not true that power corrupts; in fact, there are politicians who corrupt power.»\n- Felipe González"
 LOADING_TIP_31: "«I was engaged in a kind of 'improvement' of Japan's structure. For 110 years, since the Meiji Restoration, Japan had been striving to catch up with America and Britain. In the 1970s, we did it. But after that, [state] regulation only hindered economic growth. If state officials have too much power, the private sector will not develop. We needed to change the system.»\n- Yasuhiro Nakasone"
 LOADING_TIP_32: "«My dream is a strong Europe and a developing Asia-Pacific region, united by mutual prosperity and working together for the common good of all peoples.»\n- Yasuhiro Nakasone"
 LOADING_TIP_33: "«No matter how good a system is, it is useless if the people do not accept it. I believe that the internal function of politics is to implement the will of the people — at least on a temporary basis — and to ensure it works effectively.»\n- Chun Doo-hwan"
 LOADING_TIP_34: "«Pakistan has nuclear weapons but no security. On the other hand, we do not have nuclear weapons, but we are a safe country, we have security. Therefore, the production of nuclear weapons is declared haram based on the fatwa of Ayatollah Khamenei and is not subject to revision.»\n- Ali Khamenei"
 LOADING_TIP_35: "«An uncompromising struggle must be waged against crime and offences, regardless of persons or ranks...»\n- Boris Pugo"
 LOADING_TIP_36: "«Equidistance in Russia's foreign policy, following its national interests — this is the optimal path for the foreign policy of the Russian state.»\n- Vladimir Kryuchkov"
 LOADING_TIP_37: "«We must fight against the falsifiers of history...»\n- Dmitry Yazov"
 LOADING_TIP_38: "«It is a great happiness to be born in India and to be the heir to its great civilisation. We have much that we need to preserve for our people, and we have much to give to the world.»\n- Rajiv Gandhi"
 LOADING_TIP_39: "«Democracy carries within itself the seed of its own destruction; democracy must occasionally be bathed in blood in order to remain democracy.»\n- Augusto Pinochet"
 LOADING_TIP_40: "«I am not a dictator. I just have an angry face.»\n- Augusto Pinochet"
