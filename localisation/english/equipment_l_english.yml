 anti_air_equipment_1:0 "Towed Anti-Air"
 anti_air_equipment_1_short:0 "Anti-Air"
 anti_air_equipment_1_desc:0 "Anti-air artillery is primarily designed to shoot down hostile planes, although the rapid fire cannons can also be effective against ground targets."
 anti_air_equipment_4:0 "50' Anti-Air"
 anti_air_equipment_4_desc:0 "By using smaller but higher-velocity cannons, even the modern jet cannot hope to outrun the anti-aircraft cannon."
 anti_air_equipment_5:0 "60' Anti-Air"
 anti_air_equipment_5_desc:0 "One of the limitations of anti-aircraft artillery is the need for the gun barrel to cool down. By using multiple barrels, rotating the assembly and firing out of one at a time, a much higher rate of fire can be achieved. Such weapons will carve a line through the sky, tearing aircraft to shreds."
 anti_air_equipment_6:0 "70' SAM"
 anti_air_equipment_6_desc:0 "The SAM - surface-to-air missile - is a system which uses automatically-guided missiles, fitted with an explosive charge, to shoot down planes instead of simple cannons."
 anti_air_equipment_7:0 "80' SAM"
 anti_air_equipment_7_desc:0 "By further integrating radar into the SAM launcher, as well as using more advanced tracking circuits, the accuracy of the missiles can be greatly improved."
 anti_air_equipment_8:0 "90' SAM"
 anti_air_equipment_8_desc:0 "As flare and chaff countermeasures result in SAMs missing their target, redundant systems and tighter tolerances result in a missile which will down any plane at any distance."

 TUR_anti_air_equipment_4:0 "MIM-14 Nike"
 TUR_anti_air_equipment_4_desc:0 "By using smaller but higher-velocity cannons, even the modern jet cannot hope to outrun the anti-aircraft cannon."
 TUR_anti_air_equipment_5:0 "MIM-23 HAWK"
 TUR_anti_air_equipment_5_desc:0 "One of the limitations of anti-aircraft artillery is the need for the gun barrel to cool down. By using multiple barrels, rotating the assembly and firing out of one at a time, a much higher rate of fire can be achieved. Such weapons will carve a line through the sky, tearing aircraft to shreds."
 TUR_anti_air_equipment_6:0 "Rapier"

 artillery_equipment_2:0 "Improved Artillery"
 artillery_equipment_2_desc:0 "New howitzer designs, taking advantage of new hydraulic recoil devices and longer barrels."
 artillery_equipment_3:0 "Advanced Artillery"
 artillery_equipment_3_desc:0 "Light-weight artillery capable of being broken down for transport, making it possible to bring artillery support to areas previously difficult to reach."
 artillery_equipment_4:0 "50' Artillery"
 artillery_equipment_4_desc:0 "New drop-breech designs, as well as improved carriages and modular assemblies, result in a mobile artillery piece which hits hard and far."
 artillery_equipment_5:0 "60' Artillery"
 artillery_equipment_5_desc:0 "Artillery guns can always be improved, with computer simulations and radio integration resulting in a better field gun."
 artillery_equipment_6:0 "70' Artillery"
 artillery_equipment_6_desc:0 "Between the tank, jet, helicopter and more, artillery is still one of the deadliest arms of the modern army. These new models have greater range, and are more accurate."
 artillery_equipment_7:0 "80' Artillery"
 artillery_equipment_7_desc:0 "The first artillery guns have been developed which have computers to help in aiming and firing."
 artillery_equipment_8:0 "90' Artillery"
 artillery_equipment_8_desc:0 "Developing more accurate artillery guns means that we can level a single building from 25 kilometers away without harming anyone standing next to it."

