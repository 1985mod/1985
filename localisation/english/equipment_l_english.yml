##GENERIC TREE##

 infantry_equipment_0:0 "AKM"
 infantry_equipment_desc:0 "The AKM is a 7.62x39 mm Soviet assault rifle introduced in 1959 as a lighter, more modern successor to the AK-47. Designed by Mikhail Kalashnikov, it became the most widely produced variant of the Kalashnikov series, serving as the standard service rifle of the Soviet Army and Warsaw Pact states."
 infantry_equipment_1:0 "AK74"
 infantry_equipment_1_desc:0 "The AK-74 is an assault rifle designed by small arms designer Mikhail Kalashnikov in 1974 as a successor to the AKM. It is chambered for the 5.45×39mm cartridge, which replaced the 7.62×39mm cartridge of Kalashnikov's earlier automatic weapons for the Soviet Armed Forces."
 infantry_equipment_2:0 "AKS-74U"
 infantry_equipment_2_desc:0 "The AKS-74U is the compact carbine variant of the Soviet AK-74 rifle. The carbine fulfills the same role as similarly sized submachine guns."
 infantry_equipment_3:0 "AK74M"
 infantry_equipment_3_desc:0 "The AK-74M is a modernized, standard-issue 5.45×39mm assault rifle. Introduced in 1991, it features a side-folding polymer stock, a reinforced dust cover, and a dovetail side rail for mounting optics."
 
