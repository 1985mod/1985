 mechanized_equipment_1:0 "BTR-80"
 mechanized_equipment_1_desc:0 "The BTR-80 is an 8×8 wheeled amphibious APC designed in the Soviet Union. It was adopted in 1985 and replaced the previous vehicles, the BTR-60 and BTR-70, in the Soviet Army. It was first deployed during the Soviet–Afghan War."
 mechanized_equipment_2:0 "BTR-82"
 mechanized_equipment_2_desc:0 "The BTR-82 armored personnel carrier is the latest version of the BTR-80 family."
 mechanized_equipment_3:0 "BTR-D"
 mechanized_equipment_3_desc:0 "The BTR-D is a airborne multi-purpose tracked armoured personnel carrier. It is based on the BMD-1 airborne IFV."

