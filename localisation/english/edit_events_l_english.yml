l_english:
 SOV_important_choice.1.t: "Konstantin Chernenko died..."
 SOV_important_choice.1.desc: "Leonid Brezhnev symbolized stagnation and ignoring the pressing problems that had only been accumulating all these decades. Brezhnev is dead, followed by Andropov, now Chernenko. We have to decide the future fate of the Soviet Union. We face a choice between the liberal Gorbachev, the Stalinist Shenin and the fascist Dugin. Who is now destined to rule the USSR?"
 SOV_important_choice.1.a: "We need liberal reforms! For Gorbachev!" # Gorbachev
 SOV_important_choice.1.b: "Let's stand up for the Fatherland and for Stalin! For Shenin!" # Shenin
 SOV_important_choice.1.c: "For Russia! For victory! Dugin is our candidate!" # Dugin

 SOV_chernobyl.1.t: "Accident at Chernobyl Nuclear Power Plant"
 SOV_chernobyl.1.desc: "On April 26, 1986, at 1:23 a.m., a powerful explosion occurred at Unit 4 of the Chernobyl nuclear power plant during testing of the eighth turbine generator. The explosion completely destroyed the reactor, causing one of the largest man-made releases of radioactive substances in history. Isotopes of uranium, plutonium, iodine-131, cesium-134, cesium-137 and strontium-90 were released into the atmosphere. Thousands of people participated in the cleanup, many of whom received serious doses of radiation. The disaster was a blow to the stability of the Soviet Union, increasing tensions in society and exacerbating the political situation in the USSR."
 SOV_chernobyl.1.a: "Eternal memory to the heroes!"

 DDR_unification.1.t: "The Eastern Bloc has fallen"
 DDR_unification.1.desc: "The Warsaw Pact no longer exists... As a result, in both the FRG and the GDR the question of German unification arises, or more precisely, the liquidation of the GDR. Shall we let Germany become unified again or fight for our right to exist?"
 DDR_unification.1.a: "We agree! The time of the GDR has long passed."
 DDR_unification.1.b: "The FRG is encroaching on us. Let's defend the communist system!"

 DDR_unification.2.t: "The GDR refused to unify with us"
 DDR_unification.2.desc: "There are more and more mass demonstrations and demands for the government’s resignation in the GDR. But they are holding on to power with their teeth. What shall we do?"
 DDR_unification.2.a: "Now is not the time for unification!"
 DDR_unification.2.b: "If the GDR won't come to us, then we will go to them. With weapons."