l_english:
 BM_HISTORY_TITLE: "Brief History"
 GATHERING_STORM_NAME: "Era of Crisis"
 GATHERING_STORM_DESC: "The world is frozen at the zenith of a great confrontation. The planet has become a global testing ground, divided into two irreconcilable camps. Decades of the arms race have turned state borders into steel-bristling frontiers, where ideologies gnaw at each other's throats. The air carries the heavy smell of diesel and gun lubricant, and in the silence of laboratories, the ozone trace of a new, digital war is already maturing."
 HITTING_FAN_NAME: "And So It Begins"
 HITTING_FAN_DESC: "Yes, that's right! The umbrella collection might come in handy today."
 SOV_GATHERING_STORM_DESC: "The USSR is in a state of anxious calm and deep stagnation. The country is frozen in anticipation of imminent changes, while the old guard is fading in the Kremlin: General Secretary Konstantin Chernenko is seriously ill, and his rare public appearances only underscore the crisis of the system. The economy runs on inertia, facing shortages of goods and technological lag behind the West. Externally, the Union still retains the status of a superpower, but the Cold War is draining its last resources. The exhausting war in Afghanistan continues."
 USA_GATHERING_STORM_DESC: "The USA is at the zenith of its self-assertion. After Reagan's triumphal election victory, the country finally shakes off the depression of the 70s and lives under the slogan 'Morning in America'. This is a moment of absolute faith in capitalism, the power of the dollar, and technological superiority. In foreign policy, America takes the position of 'peace through strength'. In relations with the USSR, the icy peak of the Cold War reigns: in Moscow, the old regime is living out its days, while Washington is fully deploying the 'Star Wars' program. The country feels like a 'Shining City on a Hill', which not only defends itself from the world vortex but actively dictates its own rules of the game."
 DDR_GATHERING_STORM_DESC: "The GDR is in a state of deceptive stability, remaining the 'showcase of socialism' and Moscow's most loyal ally in Eastern Europe. Under the leadership of Erich Honecker, the country demonstrates the best economic indicators in the socialist camp, but behind this facade lies deep internal tension. Externally, the GDR is an impregnable fortress on the front line of the Cold War. The Berlin Wall seems eternal, and the Stasi controls almost every aspect of citizens' lives. Colossal military forces are concentrated on the border with the FRG, and the country lives in constant anticipation of a possible conflict."
 WGR_GATHERING_STORM_DESC: "The FRG is in a state of economic prosperity and political calm. Under the leadership of Chancellor Helmut Kohl, the country has finally secured its status as Europe's economic locomotive and the key pillar of NATO on the continent. West Germany at this moment is a society of high consumption and technological progress. There is confidence in the future here: German cars and household appliances conquer the world, and the quality of life is considered one of the highest on the planet."
 OTHER_GATHERING_STORM_DESC: "Other countries, large and small, are not ready to wait idly, holding their breath, to see how the new world conflict will end. The past war largely redrew the atlas of the world, changing the balance of power, and now the major players are ready to repeat it. Everyone will have to make difficult decisions and seek a balance between their ideals and cold pragmatism in order to influence what the world will become in the future."
 PRC_GATHERING_STORM_DESC: "In 1985, the People's Republic of China continued its path of reforms under the auspices of the CCP: economic liberalizations combined with political control. The country maintained its status as a major regional player in Asia and on the world stage, focusing on modernizing the economy, expanding external ties, and gradually reducing ideological pressure within the framework of party policy.."
 PRK_GATHERING_STORM_DESC: "As of 1985, the DPRK retained the status of an authoritarian socialist state with a one-party system led by the Workers' Party of Korea. The country functioned under conditions of strong state control, ideological education of the population, and limited economic freedom. Foreign policy was oriented toward independence, defense, and maintaining confrontation with external opponents, while maintaining close alliances with selected partners and blocs."
 CZE_GATHERING_STORM_DESC: "In 1948, the Communist Party of Czechoslovakia came to power after the events known as the '1948 pact' and established a one-party socialist state within the Eastern Bloc. In the post-war period, the Czechoslovak economy adopted a planned and centralized form of management. In the 1960s-1970s, the country experienced a period of 'socialism with a human face' and reforms, but after the suppression of the Prague Spring in 1968, the political system returned to more rigid authoritarian forms."
