l_english:
  communism: "Socialism"
  communism_noun: "Socialism"
  communism_desc: "Socialist State"
  marxism_leninism: "Marxism-Leninism"
  marxism_leninism_desc: "Marxism-Leninism is a left-wing political ideology and the official doctrine of the communist movement, combining Karl Marx's economic theory of class struggle and Vladimir Lenin's concept of a revolutionary party of a new type. Within this model, the capitalist system is recognized as unjust and subject to elimination through socialist revolution, after which the dictatorship of the proletariat is established, private ownership of the means of production is abolished, and the economy comes under strict centralized state control for the subsequent construction of a classless communist society."
  stalinism: "Stalinism"
  stalinism_desc: "Stalinism is a political system, ideology and form of totalitarian rule that took shape in the USSR during the leadership of Joseph Stalin. Within this model, Marxism-Leninism was transformed into a rigid state dogma involving forced modernization ('building socialism in one separate country') through super-centralization of the economy, the elimination of market institutions and forced collectivization, while all power was concentrated in the hands of the party apparatus and the leader, relying on a personality cult, mass political repressions and total ideological control over society."
  chinese_socialism: "Socialism with Chinese Characteristics"
  chinese_socialism_desc: "Socialism with Chinese characteristics is a socio-economic model officially adopted in the PRC, combining the long-term political dominance of the Communist Party (a vanguard party) with mechanisms of a market economy and mixed ownership. This ideology places national stability and technological modernization above the classical Marxist demand for the immediate abolition of private property, viewing the current stage as the 'initial stage of socialism' necessary for building a powerful sovereign state."
  communist_perestroika: "Communist Perestroika"
  communist_perestroika_desc: "Communist Perestroika is an ideological concept of large-scale reform of the Soviet system, involving the 'purification' of Marxism-Leninism from Stalinist layers and a transition to 'socialism with a human face' through the mechanisms of glasnost and democratization. Unlike the Chinese path, this model relied on political freedoms and decentralization of governance as necessary conditions for overcoming economic stagnation. The process was based on the belief that under conditions of openness and honest discussion, the party would retain its leading role, and the socialist system would gain a second wind."
  authoritarian_socialism: "Authoritarian Socialism"
  authoritarian_socialism_desc: "Authoritarian socialism is a political-economic model postulating the construction of a classless society through the establishment of absolute state control over all spheres of life and the suppression of any opposition. Within this system, centralized planning and state ownership of the means of production are viewed as instruments for achieving social justice, while the interests of the individual are fully subordinated to the interests of the collective or the state."
  democratic_socialism: "Democratic Socialism"
  democratic_socialism_desc: "Democratic socialism is a political ideology asserting that social justice and economic equality must be achieved exclusively within a democratic multi-party system with full observance of all civil rights and freedoms. Unlike authoritarian models, this concept rejects dictatorship and revolutionary violence, believing that the transition to socialism is possible only through parliamentary struggle, popular will and evolutionary reforms."
  left_wing_nationalism: "Left-Wing Nationalism"
  left_wing_nationalism_desc: "Left-wing nationalism is a political ideology combining the principles of left-wing politics with the idea of national self-determination and sovereignty. Within this model, the nation is understood not as an isolated ethnic group, but as an organic and cultural-political unity of working people fighting against external oppression, colonialism or global capitalism. The expression of popular will here is aimed at protecting national wealth and the domestic market from foreign influence, while civic solidarity is built around the idea of the common good, where patriotism serves as an instrument of social mobilization and the construction of a just society."

  socialism: "Social Democracy"
  socialism_noun: "Social Democracy"
  socialism_desc: "Social Democratic State"
  nordic_model: "Nordic Model"
  nordic_model_desc: "The Nordic model is a socio-economic system combining a free market economy and a high level of personal freedom with a developed welfare state and collective regulation of the labor market. This model is based on social partnership between workers, employers and the state, ensuring a high degree of equality and social security while maintaining high competitiveness of capital."
  the_third_way: "The Third Way"
  the_third_way_desc: "The Third Way is a political-economic concept representing an attempt to synthesize center-right economic policy and a center-left social program. Within this model, both traditional state socialism with its excessive regulation and radical neoliberalism with its non-intervention are rejected; instead, an adaptation of social democratic values to the conditions of a globalized free market is proposed."
  classical_social_democracy: "Classical Social Democracy"
  classical_social_democracy_desc: "Classical social democracy is a political movement and ideology that emerged from the evolution of Marxism and aims at the gradual transformation of capitalist society into a socialist one through democratic institutions. Unlike revolutionary communism, this model asserts that social justice, the elimination of exploitation and equality of opportunity are achievable through parliamentary reforms, active state regulation and the strengthening of trade union rights."
  eco_social_democracy: "Eco-Social Democracy"
  eco_social_democracy_desc: "Eco-social democracy is a modern political concept combining the classical principles of social protection with the requirements of ecological sustainability. Within this framework, the fight against inequality is seen as an integral part of the fight against the climate crisis, which presupposes a radical transformation of the economy through 'green' state control, the abandonment of the priority of unconditional GDP growth in favor of ecological well-being and the redistribution of resources to support the most vulnerable segments of the population during the energy transition."
  liberal_social_democracy: "Liberal Social Democracy"
  liberal_social_democracy_desc: "Liberal social democracy is an ideological synthesis emphasizing individual rights, market freedoms and the social responsibility of the state. Unlike more radical left-wing currents, this model views the market economy not as a temporary compromise, but as the most effective instrument for producing goods, requiring state intervention only to correct 'market failures,' ensure equal opportunities and prevent excessive concentration of capital."

  liberalism: "Liberalism"
  liberalism_noun: "Liberalism"
  liberalism_desc: "Liberal State"
  classic_liberalism: "Classical Liberalism"
  classic_liberalism_desc: "Classical liberalism is a political and economic ideology elevating individual freedom to the highest value and limiting the role of the state to the protection of private property, the maintenance of law and order and the observance of constitutional rights. Formed in the 18th-19th centuries, this doctrine asserts that the spontaneous order arising from free market exchange and personal initiative is the most effective mechanism for social development and general welfare."
  neoliberalism: "Neoliberalism"
  neoliberalism_desc: "Neoliberalism is a modern interpretation of classical liberalism aimed at decentralizing the economy through privatization, deregulation and a radical reduction of government spending. Within this model, the free market is viewed not only as the most effective economic mechanism, but also as a universal way of organizing human activity, where competition is the main driving force of innovation, and state intervention is recognized as the main obstacle to economic growth and personal initiative."
  social_liberalism: "Social Liberalism"
  social_liberalism_desc: "Social liberalism is a political doctrine asserting that true individual freedom is impossible without the state ensuring a certain level of material well-being and equal opportunities. Unlike neoliberalism, this concept believes that the state must actively correct market mechanisms to combat poverty, monopolies and social injustice, since only a protected and educated citizen can fully realize their liberal rights."

  conservatism: "Conservatism"
  conservatism_noun: "Conservatism"
  conservatism_desc: "Conservative State"
  classic_conservatism: "Classical Conservatism"
  classic_conservatism_desc: "Classical conservatism is a political philosophy based on the recognition of the value of historical continuity, hierarchy and the organic unity of society. Unlike liberalism, this model views man not as an isolated individual, but as part of a complex system of traditions, religion and national institutions, asserting that radical change is dangerous and reforms must be cautious and rely on the experience of past generations."
  reactionism: "Reactionism"
  reactionism_desc: "Reactionism is a radical-conservative position aimed not simply at preserving the current order, but at a complete return to the political and social structure of the past. Ideologically, reactionism rejects the results of major revolutions and modernization shifts, considering them degradation, and calls for the restoration of lost institutions, such as absolute monarchy, class divisions or the dominant role of the church in state affairs."
  liberal_conservatism: "Liberal Conservatism"
  liberal_conservatism_desc: "Liberal conservatism is a moderate current combining adherence to traditional institutions and the rule of law with the protection of liberal economic principles and individual freedoms. Within this model, conservatism manifests itself in the defense of constitutional stability and moral foundations, while in the economy free markets, low taxes and minimal state intervention are supported, which makes it close to classical liberalism in business matters."
  social_conservatism: "Social Conservatism"
  social_conservatism_desc: "Social conservatism is an ideological trend emphasizing the protection of traditional moral values, family foundations and religious dogmas as the basis of a stable society. Unlike purely political forms of conservatism, the main emphasis here is on preserving the 'moral climate': countering secularization, protecting the traditional definition of marriage and restricting abortion, often through state programs that strengthen social cohesion and community ties."
  national_conservatism: "National Conservatism"
  national_conservatism_desc: "National conservatism is a variant of conservatism in which the protection of national identity, state sovereignty and cultural distinctiveness is placed above global economic or liberal interests. This ideology advocates strict immigration control, economic protectionism and the preservation of the traditional way of life of the titular nation, often showing skepticism toward international organizations and globalization processes."

  neutrality: "Authoritarianism"
  neutrality_noun: "Authoritarianism"
  neutrality_desc: "Authoritarian State"
  authoritarian_democracy: "Authoritarian Democracy"
  authoritarian_democracy_desc: "Authoritarian democracy is a political system in which democratic institutions (elections, parliament, constitution) are formally preserved, but real power is concentrated in the hands of one leader or a narrow group using administrative resources to suppress genuine opposition. Within this model, the expression of popular will is often used to legitimize rigid centralized rule, in which civil liberties are restricted for the sake of ensuring state stability and 'national unity.'"
  autocracy: "Autocracy"
  autocracy_desc: "Autocracy is a form of government in which supreme state power belongs indivisibly and uncontrollably to one person (monarch, dictator). Unlike authoritarian democracy, autocracy may not imitate democratic processes, relying exclusively on the coercive apparatus, personal loyalty of elites and a cult of leadership, where the law is the will of the ruler and not an external limitation of his powers."
  oligarchism: "Oligarchism"
  oligarchism_desc: "Oligarchism is a political regime in which real power in the state belongs to a small group of the wealthiest and most influential individuals who use state institutions to protect and multiply private economic interests. Under oligarchism, officials are often merely formal executors of the will of shadow interest groups, and access to social mobility and resources is closed to the majority of the population, which leads to the merging of business and politics."
  military_regimes: "Military Dictatorship"
  military_regimes_desc: "Military dictatorship is a form of government in which all political power is concentrated in the hands of the high command of the armed forces or a special body ('junta'), usually coming to power as a result of a coup d'état. Within this model, civil legislation is either suspended or subordinated to the orders of the military leadership, and the legitimacy of the regime is justified by the need to 'restore order,' fight corruption or eliminate external threats."
  absolute_monarchy: "Absolute Monarchy"
  absolute_monarchy_desc: "Absolute monarchy is a form of government in which the entirety of state, legislative, executive and judicial power belongs indivisibly to one person — the monarch. Within this model, the will of the ruler is recognized as the supreme law, excluding the existence of any bodies of government independent of him, constitutional restrictions or legal opposition, while the stability of the regime relies on the principle of the divine origin of the monarch's power and his personal control over the state apparatus and army."
  constitutional_monarchy: "Constitutional Monarchy"
  constitutional_monarchy_desc: "A form of government in which the power of the monarch is formally or actually limited by the fundamental law of the state and the supreme legislative body — the parliament. Within this model, the ruler acts as a symbol of national unity and historical continuity, while the real functions of governing the state, forming the government and passing laws pass to elected institutions, which allows combining monarchical traditions with democratic principles and the rule of law."
  Salafism: "Salafism"
  Salafism_desc: "Salafism is a fundamentalist trend in Sunni Islam calling for the purification of religion from any historical innovations and a return to the way of life and faith of the 'righteous predecessors' — the first generations of Muslims. Within this model, any philosophical and cultural layers that arose after the era of the Prophet Muhammad are rejected, and the main source of truth is recognized exclusively as the literal understanding of the Quran and Sunnah. In the political context, Salafism is heterogeneous: it ranges from apolitical puritanism to active participation in parliamentary struggle and radical 'jihadism' seeking to restructure society and create a global caliphate by violent means."
  Political_Islam: "Political Islam"
  Political_Islam_desc: "Political Islam (Islamism) is a political ideology and movement in which the religious norms of Islam (Sharia) are used as the basis for state structure, the legal system and the regulation of public life. Within this model, religious identity prevails over national identity, and state institutions are restructured to subordinate all spheres of human activity to divine law, which often leads to the restriction of secular freedoms and pluralism for the sake of achieving spiritual and social unity."

  fascism: "Nationalism"
  fascism_noun: "Nationalism"
  fascism_desc: "Nationalist State"
  baathism: "Ba'athism"
  baathism_desc: "Ba'athism is an ideology of Arab nationalism whose goal is the creation of a single Arab state."
  ethnic_nationalism: "Ethnic Nationalism"
  ethnic_nationalism_desc: "Ethnic nationalism is a form of national identity in which belonging to the nation is determined exclusively by common origin, 'blood,' language and inherited cultural traditions. Within this model, the nation is viewed as an extended family or biological community, which makes it impossible for representatives of other ethnic groups to fully join it, regardless of their loyalty to the state or knowledge of the language."
  civil_nationalism: "Civic Nationalism"
  civil_nationalism_desc: "Civic nationalism is a political concept defining the nation as a community of citizens united by loyalty to common political institutions, values and legal norms (the Constitution). This model is inclusive: it allows any person, regardless of ethnic origin, to become a full member of the nation by accepting its civic duties and observing state laws."
  extreme_nationalism: "Extreme Nationalism"
  extreme_nationalism_desc: "Extreme nationalism is a radical ideology postulating the absolute superiority of one's own nation over others and justifying aggressive methods of protecting its interests, including violence, discrimination and expansion. In this system, national egoism is elevated to a cult, individual rights are completely suppressed for the sake of 'national greatness,' and international norms are ignored in favor of domination and suppression of imaginary or real enemies."

