RCP_ideological_fanaticism:0 "Ideological Fanaticism"
RCP_ideological_fanaticism_desc:0 "Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."
RCP_spread_freedom:0 "Spread Freedom"
RCP_spread_freedom_desc:0 "We will spread freedom and democracy, whether they like it or not."
RCP_army_effort:0 "Army Effort"
RCP_army_effort_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
RCP_militarism:0 "Militarism"
RCP_militarism_desc:0 "Those who view the military as a necessary evil are doomed to hesitate in the face of war. We will ingrain militarism into our culture to become a people of soldiers."
RCP_world_police_force:0 "World Police Force"
RCP_world_police_force_desc:0 "Why should we let people have fun when we can just guarantee them?"
RCP_successful_economy:0 "Successful Economy"
RCP_successful_economy_desc:0 "CHANGE TO SWAP IDEAS"
RCP_technology_sharing:0 "Technology Sharing"
RCP_technology_sharing_desc:0 "By sharing technological advances with our allies, our whole faction will be able to conduct wartime R&D more efficiently."
RCP_military_youth:0 "Military Youth"
RCP_military_youth_desc:0 "Organizations to promote discipline and political education of young people in our nation will foster loyalty and self-sacrifice early."
RCP_why_we_fight:0 "Why We Fight"
RCP_why_we_fight_desc:0 "The world is growing increasingly unsafe. Our people need to see the atrocities being committed by those who crave power. It is time we rally the people to our cause and ensure everyone is ready to fight for our freedom."
RCP_extra_research_slot_ii:0 "Extra Research Slot II"
RCP_extra_research_slot_ii_desc:0 "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."
RCP_bicycle_effort:0 "Bicycle Effort"
RCP_bicycle_effort_desc:0 ""
RCP_fighter_focus:0 "Fighter Focus"
RCP_fighter_focus_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
RCP_construction_effort_iii:0 "Construction Effort III"
RCP_construction_effort_iii_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
RCP_civilian_industry:0 "Civilian Industry"
RCP_civilian_industry_desc:0 ""
RCP_secret_weapons:0 "Secret Weapons"
RCP_secret_weapons_desc:0 "It is tempting to expend all extra resources into developing tanks and planes, but the secret to winning wars lies in whole new fields of science; electronics, rocketry and nuclear research."
RCP_synthetic_oil__rubber:0 "Synthetic OIl & Rubber"
RCP_synthetic_oil__rubber_desc:0 ""
RCP_bomber_focus:0 "Bomber Focus"
RCP_bomber_focus_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
RCP_the_marines:0 "The Marines"
RCP_the_marines_desc:0 ""
RCP_natural_oil:0 "Natural Oil"
RCP_natural_oil_desc:0 "oil/rubber"
RCP_extra_research_slot:0 "Extra Research Slot"
RCP_extra_research_slot_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
RCP_nuclear_effort:0 "Nuclear Effort"
RCP_nuclear_effort_desc:0 "Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth."
RCP_naval_invasions:0 "Naval Invasions"
RCP_naval_invasions_desc:0 ""
RCP_rocket_effort:0 "Rocket Effort"
RCP_rocket_effort_desc:0 "Rocket and jet engines allow for unprecedented speeds for unmanned and manned vessels alike. Pioneering these technologies will allow us to take the enemy by surprise."
RCP_deterrence:0 "Deterrence"
RCP_deterrence_desc:0 "Standing alone, we rarely benefit from war. Fortunately, we know that the best defense is one so well-known you never have to put it to use."
RCP_volunteer_corps:0 "Volunteer Corps"
RCP_volunteer_corps_desc:0 "Forcing our people to die for ideals of freedom would be an exercise in irony, but establishing means for those who wish to aid people abroad is not."
RCP_intensify_exctraction:0 "Intensify Exctraction"
RCP_intensify_exctraction_desc:0 "buff to other"
RCP_construction_effort_ii:0 "Construction Effort II"
RCP_construction_effort_ii_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
RCP_naval_effort_ii:0 "Naval Effort II"
RCP_naval_effort_ii_desc:0 "SAME thing as naval"
RCP_aviation_effort_iii:0 "Aviation Effort III"
RCP_aviation_effort_iii_desc:0 ""
RCP_armor_effort:0 "Armor Effort"
RCP_armor_effort_desc:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
RCP_neutrality_focus:0 "Neutrality Focus"
RCP_neutrality_focus_desc:0 "While others may claim it takes bravery and wisdom to take sides in a global conflict, we know it takes more to refuse."
RCP_special_forces:0 "Special Forces"
RCP_special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
RCP_armament_effort_iii:0 "Armament Effort III"
RCP_armament_effort_iii_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
RCP_infrastructure_effort_ii:0 "Infrastructure Effort II"
RCP_infrastructure_effort_ii_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
RCP_capital_ship_effort:0 "Capital Ship Effort"
RCP_capital_ship_effort_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
RCP_rare_metals_excavation:0 "Rare Metals Excavation"
RCP_rare_metals_excavation_desc:0 ""
RCP_destroyer_effort:0 "Destroyer Effort"
RCP_destroyer_effort_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
RCP_nav_effort:0 "NAV Effort"
RCP_nav_effort_desc:0 "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
RCP_cas_effort:0 "CAS Effort"
RCP_cas_effort_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
RCP_equipment_effort_iii:0 "Equipment Effort III"
RCP_equipment_effort_iii_desc:0 "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
RCP_mechanization_effort:0 "Mechanization Effort"
RCP_mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
RCP_leftwing_politics:0 "Left-Wing Politics"
RCP_leftwing_politics_desc:0 "Ideology knows no borders. Another nation may call itself sovereign, but our convictions are above such claims."
RCP_war_propoganda:0 "War Propaganda"
RCP_war_propoganda_desc:0 ""
RCP_armament_effort_ii:0 "Armament Effort II"
RCP_armament_effort_ii_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
RCP_metal_excavation:0 "Metal Excavation"
RCP_metal_excavation_desc:0 "random state add steel"
RCP_construction_effort:0 "Construction Effort"
RCP_construction_effort_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
RCP_cruiser_effort:0 "Cruiser Effort"
RCP_cruiser_effort_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
RCP_submarine_effort:0 "Submarine Effort"
RCP_submarine_effort_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
RCP_equipment_effort:0 "Equipment Effort"
RCP_equipment_effort_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
RCP_aviation_effort_ii:0 "Aviation Effort II"
RCP_aviation_effort_ii_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
RCP_doctrine_effort_ii:0 "Doctrine Effort II"
RCP_doctrine_effort_ii_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
RCP_equipment_effort_ii:0 "Equipment Effort II"
RCP_equipment_effort_ii_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
RCP_motorization_effort:0 "Motorization Effort"
RCP_motorization_effort_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
RCP_a_useful_puppet:0 "A Useful Puppet"
RCP_a_useful_puppet_desc:0 "weekly manpower bonus IF puppet"
RCP_armament_effort:0 "Armament Effort"
RCP_armament_effort_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
RCP_resource_excavation:0 "Resource Excavation"
RCP_resource_excavation_desc:0 ""
RCP_infrastructure_effort:0 "Infrastructure Effort"
RCP_infrastructure_effort_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions."
RCP_large_navy:0 "Large Navy"
RCP_large_navy_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
RCP_flexible_navy:0 "Flexible Navy"
RCP_flexible_navy_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
RCP_industrial_effort:0 "Industrial Effort"
RCP_industrial_effort_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
RCP_doctrine_effort:0 "Doctrine Effort"
RCP_doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
RCP_naval_effort:0 "Naval Effort"
RCP_naval_effort_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
RCP_aviation_effort:0 "Aviation Effort"
RCP_aviation_effort_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
