 Real_GDP_Tooltip:0 "§HReal GDP§!\nThe total value of all goods and services produced by the nation, adjusted for inflation.\n\nOur economic output is directly tied to our industrial capacity. Each active §YCivilian Factory§! contributes §G$15.0B§! to the economy, while each §YMilitary Factory§! and §YNaval Dockyard§! generates §G$10.0B§! in output respectively.\n\n§HGDP Structure:§!\nCivilian Production: [?civ_of_gdp|%0]\nMilitary Industry: [?mil_of_gdp|%0]\nNaval Sector & Dockyards: [?naval_of_gdp|%0]"
 GDP_Per_Capita_Tooltip:0 "§HGDP per Capita§!\nMeasures the §Yreal economic output§! generated per citizen.\n\nA higher §YGDP per Capita§! expands the tax base and unlocks higher §Goptimal tax rates§!, but significantly increases §Rstate bureaucracy maintenance§! and public expenditure.\n\nAs national wealth grows, the §Ytarget unemployment bracket§! narrows and shifts downward.\n\nMaintain a balanced §Ymonetary policy§! and monitor your economic indicators closely—or face widespread §Rcivil unrest§!."
 Nominal_GDP_Tooltip:0 "§HNominal GDP§!\nThe total market value of the national economy measured at current prices.\n\n§HCalculation Formula:§!\n§YNominal GDP = Money Supply × Velocity of Money§!\n\n§YMoney Supply:§! The total volume of currency in circulation. It §Gexpands through spending§! and §Rcontracts through taxation§!.\n§YVelocity of Money:§! The speed at which currency changes hands. This pace is heavily dictated by the §YKey Interest Rate§!.\n\n§HMacroeconomic Impact:§!\nNominal GDP directly defines your country's §Ytax base§!.\n\nIf Nominal GDP rises too high relative to Real GDP, §Rhyperinflation§! is guaranteed.\nIf Nominal GDP drops too low relative to Real GDP, the economy falls into §Rdeflation§!.\n\n§WBalance the economic scales by adjusting interest rates, fine-tuning expenditure, and modifying taxes when possible.§!"
 GDP_Growth_Tooltip:0 "§HGDP Growth§!\nTracks the short-term trajectory of the national economy over the last quarter.\n\n§YEconomic Health:§! The faster your economy grows, the better... §HThanks, Captain Obvious!§!\n§YThe Risk of Overheating:§! Rapid growth paired with a low §YKey Interest Rate§! severely increases the danger of an asset bubble.\n\n§RMonitor indicators, tighten monetary policy when necessary, and prevent a financial collapse to§! §Gmake your economy great again!§!"

