l_russian:
 MINIMIZE_EVENT: "§GЩёлкните§!, чтобы свернуть. Событие будет размещено в разделе §H«События и решения»§! области событий."
 usa.1.t: "Республиканцы победили!"
 usa.1.desc: "Неделю назад прошли выборы в США, и победила Республиканская партия США, во главе с Джорд Бушом Старшим."
 usa.1.a: "Ура!"
 usa.2.t: "Демократы победили!"
 usa.2.desc: "Неделю назад прошли выборы в США, и победила Демократическая партия США, во главе с Майклом Дудакисом."
 usa.2.a: "Ура!"
 usa.3.t: "Предложение Горбачёва"
 usa.3.d: ""
 usa.3.a: "Пожалуй, мы согласимся"
 usa.4.t: "Помощь от США"
 usa.4.d: ""
 usa.4.a: "Это уникальная возможность."
 usa.4.a.tt: "Мы получим 43 американских эсминца.\nКанада получит 7 американских эсминцев."
 usa.4.b: "Это предложение явно более выгодно для США, поэтому для нас оно неприемлемо."
 usa.5.t: "[FROM.GetNameDef] согласились"
 usa.5.d: "Несмотря на всю нашу подготовку и благие намерения, Великобритания отказалась принять старые эсминцы в обмен на военно-морские базы."
 usa.5.a: "Мы выигрываем в холодной войне!"
 usa.6.t: "[FROM.GetNameDef] отказались."
 usa.6.d: ""
 usa.6.a: "Им же хуже."
 usa.7.t: "США предлагает нам участвовать в операции «Буря в пустыне»"
 usa.7.d: ""
 usa.7.a: "Мы должны принять участие против иракской агрессии."
 usa.7.b: "Нам ещё нужны наши солдаты."
 usa.8.t: "[FROM.GetNameDef] Согласилась на участие в операции"
 usa.8.d: ""
 usa.8.a: "Ура!"
 usa.9.t: "[FROM.GetNameDef] Отказалась на участие в операции"
 usa.9.d: ""
 usa.9.a: "Ладно."
 usa.9.b: "Дьюи побеждает Рузвельта."
 usa.10.t: "Операция «Буря в пустыне»."
 usa.10.d: ""
 usa.10.a: "Пойдём освобождать Кувейт!"
 usa.10.b: "Америка готова к новому «Новому курсу»."
 usa.11.t: "Мальтийский саммит"
 usa.11.d: ""
 usa.11.a: "Посмотрим, что будет."
 usa.12.t: "Экономический кризис настигает"
 usa.12.d: ""
 usa.12.a: "Это очень плохо.."
 usa.13.t: "Победа Билла Клинтона на выборах 1992 года"
 usa.13.desc: "Билл Клинтон, губернатор штата, который никто не воспринимал всерьёз, совершил невозможное. Он разгромил действующего президента Буша, превратив выборы в референдум о будущем Америки. Его кампания строилась на простой, как кирпич, истине: «Это экономика, идиот!». Страна устала от внешних войн и бюджетных дефицитов - люди хотят рабочих мест, доступной медицины и мира."
 usa.13.a: "Одна эра завершилась, началась другая."
 usa.14.t: "Разговор с СССР"
 usa.14.d: ""
 usa.14.a: "Слава Горбачёву!"
 usa.15.t: "Первая встреча с [From.GetNameDefCap]"
 usa.15.d: ""
 usa.15.a: "Ура!"
 usa.16.t: "CHB - I"
 usa.16.d: ""
 usa.16.a: "Очень хорошо."
 usa.17.t: "Утверждение Томаса Кларенсеном помощником судьи"
 usa.17.d: ""
 usa.17.a: "Это хорошо."
 usa.18.t: "Встреча с Ельцином"
 usa.18.d: ""
 usa.18.a: "Ура!"
 usa.19.t: "Запись благотворительного сингла «We Are the World» «USA for Africa»"
 usa.19.d: "28 января 1985 года. В студии A&M в Лос-Анджелесе, сразу после церемонии American Music Awards, собралось более 45 величайших музыкальных звёзд Америки. Майкл Джексон и Лайонел Ричи написали песню, а Куинси Джонс взялся продюсировать этот амбициозный проект. Цель - сбор средств для борьбы с голодом в Эфиопии, где свирепствует страшный голод."
 usa.19.a: "Мы - это мир."
 usa.20.t: "Убийство Энрике Камарена"
 usa.20.d: ""
 usa.20.a: "Печально."
 usa.21.t: "Авария авианосца USS Coral Sea"
 usa.21.d: "Авианосец ВМС США USS Coral Sea (CV-43), возвращаясь после масштабного ремонта стоимостью 200 миллионов долларов, столкнулся с эквадорским танкером «Напо» во время учений в Карибском море, недалеко от американской базы в Гуантанамо, Куба. Инцидент произошел в ясную погоду при видимости в 11 километров."
 usa.21.a: "Это была ошибка гражданского судна. Наш флот не виноват."
 usa.22.t: "41 Торнадо пронеслось над США"
 usa.22.d: ""
 usa.22.a: "О боже..."
 usa.23.t: "Лос‑Анджелес Лейкерс» выигрывают чемпионат NBA"
 usa.23.d: ""
 usa.23.a: "Ура!"
 usa.24.t: "В США выходит игровая приставка NES"
 usa.24.d: ""
 usa.24.a: "Ура!"
 usa.25.t: "Сенат США разрешает телевизионную трансляцию своих дебатов"
 usa.25.d: ""
 usa.25.a: "Хорошо."
 usa.26.t: ""
 usa.26.d: ""
 usa.26.a: ""
 usa.27.t: "Рональд Рейган проходит операцию на предстательной железе"
 usa.27.d: ""
 usa.27.a: "Надеемся, всё будет хорошо"
 usa.28.t: "Иракские «Экзосеты» поражают эсминец USS Stark"
 usa.28.d: ""
 usa.28.a: "Они за это поплатятся"
 usa.29.t: "«Черный понедельник»: мировой фондовый крах"
 usa.29.d: ""
 usa.29.a: "Только не это..."
 usa.30.t: "США предлагает торговый договор"
 usa.30.d: ""
 usa.30.a: "Мы соглашаемся"
 usa.30.b: "Мы пожалуй откажемся"
 usa.31.t: "[FROM.GetNameDef] согласилась"
 usa.31.d: ""
 usa.31.a: "Ура!"
 usa.32.t: "[FROM.GetNameDef] отказалась"
 usa.32.d: ""
 usa.32.a: "Им же хуже."
 usa.33.t: "[FROM.GetNameDef] предлагает нам экономическую помощь"
 usa.33.d: ""
 usa.33.a: "Мы соглашаемся"
 usa.33.b: "Мы пожалуй откажемся"
 usa.34.t: "[FROM.GetNameDef] согласился"
 usa.34.d: ""
 usa.34.a: "Да здравствует американско-советские отношения!"
 usa.35.t: "[FROM.GetNameDef] отказался"
 usa.35.d: ""
 usa.35.a: "Им же хуже."
 ddr.1.t: "XI съезд СЕПГ"
 ddr.1.desc: "В Берлине, в огромном зале Дворца Республики, собираются тысячи делегатов со всей Германии. XI съезд СЕПГ проходит под знаком исторических свершений. Партия подводит итоги десятилетки, отмечая небывалый рост промышленности и укрепление обороноспособности страны.\nЦентральный доклад, зачитанный Генеральным секретарем, утверждает, что Германская Демократическая Республика окончательно встала на путь построения развитого социалистического общества. В новой партийной программе подчеркивается необходимость дальнейшего ужесточения партийных рядов, борьбы с буржуазной идеологией и усиления роли государства в экономике. Съезд проходит в едином порыве, без единой оговорки."
 ddr.1.a: "Ура!"
 ddr.2.t: "Визит Хонеккера в Бонн"
 ddr.2.desc: "Впервые в истории председатель Государственного совета ГДР ступает на землю Западной Германии с официальным визитом. Эрих Хонеккер встречается с федеральным канцлером ФРГ в окружении журналистов и дипломатов со всего мира. Протокол соблюден до мелочей: военный оркестр, поднятие флагов, улыбки для прессы."
 ddr.2.a: "Да здравствует ФРГ!"
 ddr.3.t: "Объединение с несогласными"
 ddr.3.desc: "В огромном зале, где раньше звучали только одобрительные овации в адрес Политбюро, теперь сидят диссиденты, интеллигенция и партийные функционеры. Обсуждается будущее нации: многопартийность, рыночные элементы в экономике и судьба Штази. Это не капитуляция, это попытка спасти государство, дав ему глоток свежего воздуха. Немцы впервые за долгие годы говорят друг с другом не через колючую проволоку, а лицом к лицу."
 ddr.3.a: "Мы проведём широкие реформы"
 ddr.3.b: "Жесткое подавление - никаких уступок"
 ddr.4.t: "Фальсификация выборов"
 ddr.4.desc: "Местные выборы в округах ГДР прошли с «рекордной явкой» и подавляющим большинством голосов за кандидатов Национального фронта. Однако уже на следующий день по городу поползли слухи — независимые наблюдатели и западные СМИ заявляют о массовых вбросах, подтасовке протоколов и запугивании избирателей. Внутри самой СЕПГ разгорается скандал: несколько членов партии требуют пересчета голосов, а профсоюзы угрожают забастовками."
 ddr.4.a: "Во всём виноват запад!"
 ddr.5.t: "Заговор"
 ddr.5.desc: "В стенах старого здания ЦК СЕПГ пахнет серой. В последние недели Генеральный секретарь замечает, что его привычные указания исполняются с задержкой, а некоторые члены Политбюро слишком часто собираются на «неформальные обеды» без его ведома. Агенты Штази докладывают о тайных контактах между несколькими высокопоставленными партийцами и представителями военного командования."
 ddr.5.a: "Ясно."
 ddr.6.t: "Правительство Модрова"
 ddr.6.desc: "После отставки Хонеккера и короткого правления Кренца партия оказалась в глубочайшем кризисе. Улицы требуют перемен, экономика трещит по швам, а Москва под руководством Горбачёва отказывается от прежней поддержки. В этих условиях Политбюро выдвигает на пост премьер-министра Ханса Модрова — человека с репутацией прагматика и сторонника диалога."
 ddr.6.a: "Курс на объединение с ФРГ"
 ddr.7.t: "Свободные выборы в ГДР"
 ddr.7.desc: "Впервые за сорок лет жители Германской Демократической Республики идут на избирательные участки, чтобы сделать действительно свободный выбор. В предвыборной гонке участвуют десятки партий — от посткоммунистической ПДС до либералов и зелёных. Главная интрига: смогут ли реформированные социалисты удержать власть, или народ проголосует за немедленное объединение с ФРГ?"
 ddr.7.a: "Победу одержал альянс ХДС"
 ddr.8.t: "Приказ 101: Не стрелять"
 ddr.8.desc: "Ночь с 9 на 10 ноября 1989 года. Берлинская стена, олицетворяющая раскол Германии, становится эпицентром драмы. На КПП «Борнхольмер-штрассе» и других переходах собираются десятки тысяч людей, требующих свободного выезда. Пограничники растеряны — их инструкции предписывают открывать огонь при попытке прорыва, но политбюро только что передало по закрытым каналам неоднозначный «Приказ 101»."
 ddr.8.a: "Отменить приказ о стрельбе полностью."
 ddr.9.t: "Геронтократия в СЕПГ"
 ddr.9.desc: "Внутри СЕПГ уже несколько лет зреет тихое недовольство. Руководство партии состоит из людей, средний возраст которых перевалил за семьдесят. Они помнят ещё войну, сталинизм, возведение стены, но совершенно не понимают новых веяний — компьютеризации, экологических движений, запросов молодёжи. На последнем заседании Политбюро один из секретарей по идеологии, которому уже за восемьдесят, заснул прямо во время доклада о перестройке."
 ddr.9.a: "Сохраним статус-кво"
 ddr.9.b: "Омолодим нашу партию, вперед за СЕПГ!"
 ddr.10.t: "Отставка Эриха Хонеккера"
 ddr.10.desc: "Улицы восточногерманских городов гудят уже несколько недель - десятки тысяч людей требуют перемен, свободы слова и права на выезд. Эрих Хонеккер, бессменный лидер ГДР на протяжении почти двадцати лет, выглядит сломленным. Ему 77 лет, он болен, устал и потерял главного союзника — Михаила Горбачёва, который открыто заявил, что Москва не будет «защищать тех, кто против перестройки»."
 ddr.10.a: "Почётная отставка - передача власти Крензу"
 ddr.11.t: "Социализм на грани банкротства"
 ddr.11.desc: "Восточногерманская экономика трещит по швам. Внешний долг страны перевалил за 20 миллиардов западногерманских марок, а процентные выплаты съедают почти весь экспортный потенциал. Заводы работают на три четверти мощности, многие убыточные предприятия держатся только на государственных субсидиях. В магазинах пустые полки: масло, мясо, кофе и цитрусовые исчезли из свободной продажи."
 ddr.11.a: "Централизованное затягивание поясов - плановая автаркия"
 ddr.12.t: "Поставки МиГ-29"
 ddr.12.desc: "На военные аэродромы Восточной Германии начинают прибывать новейшие советские истребители МиГ-29 — машины четвёртого поколения, которые по своим лётным характеристикам превосходят большую часть парка НАТО. Национальная народная армия ГДР получает более двадцати единиц этих грозных машин — «ласточек», способных патрулировать воздушное пространство и участвовать в учениях на равных с любым западным противником."
 ddr.12.a: "Принять полную партию - укрепим наши ВВС!"
 ddr.13.t: "Независимая ГДР"
 ddr.13.desc: "Сентябрь 1990 года войдет в историю как момент окончательного краха восточного блока. В условиях стремительного объединения Германии и краха коммунистического режима руководство в Восточном Берлине официально объявило о выходе Германской Демократической Республики из Организации Варшавского договора. \nЭтот шаг, согласованный в рамках договоренностей «Два плюс четыре», знаменует собой фактическую ликвидацию восточногерманской армии (ННА) и конец четырех десятилетий военного присутствия Москвы в сердце Европы. Советские войска готовятся к эвакуации, а западногерманские структуры уже принимают контроль над границами. Знамена Восточного блока спущены - берега Эльбы больше не разделяют две непримиримые системы."
 ddr.13.a: "За независимую нашу Германию!"
 ddr.14.t: "ГДР вышла из Варшавского Договора"
 ddr.14.desc: "Сентябрь 1990 года войдет в историю как момент окончательного краха восточного блока. В условиях стремительного объединения Германии и краха коммунистического режима руководство в Восточном Берлине официально объявило о выходе Германской Демократической Республики из Организации Варшавского договора. \nЭтот шаг, согласованный в рамках договоренностей «Два плюс четыре», знаменует собой фактическую ликвидацию восточногерманской армии (ННА) и конец четырех десятилетий военного присутствия Москвы в сердце Европы. Советские войска готовятся к эвакуации, а западногерманские структуры уже принимают контроль над границами. Знамена Восточного блока спущены - берега Эльбы больше не разделяют две непримиримые системы."
 ddr.14.a: "Всё разрушилось..."
 wgr.1.t: "Курс ФРГ"
 wgr.1.desc: "1985 год стал для ФРГ годом переломных партийных решений, неожиданных триумфов и болезненных поражений. На сцене - три главные политические силы, каждая из которых переживала свою драму."
 wgr.1.a: "ХДС - наш выбор!"
 wgr.1.b: "СДПГ - за независимую Германию!"
 wgr.1.c: "СВДП - за свободу!"
 wgr.2.t: "Определение экономического курса"
 wgr.2.desc: "1985 год стал для ФРГ годом жесткого выбора экономической стратегии. Правительство Коля и Бундесбанк оказались перед дилеммой: продолжать ли политику бюджетной сдержанности, принесшую рекордный торговый профицит и низкую инфляцию, или же поддаться давлению союзников и запустить масштабные стимулы для внутреннего спроса?"
 wgr.2.a: "Предоставим мигрантам хоть что-нибудь."
 wgr.2.b: "Германия превыше всего!"
 wgr.3.t: "Эпоха напряжения"
 wgr.3.desc: "В 1985 году Западная Германия была не просто европейской страной, а главным полем битвы между блоками. Здесь, на линии разлома, каждый жест имел вес.\n\nПриход Горбачёва в Кремль в марте обещал перемены, но не снял старого напряжения. Москва по-прежнему считала Бонн агрессивным. А летом разразился дипломатический скандал — немецкие молодёжные делегации покинули фестиваль в Москве из-за унизительного обращения с Западным Берлином.\n\nНо настоящий шок случился 19 августа: глава контрразведки ФРГ перебежал в ГДР. Это был не просто предательство, а удар по всей системе безопасности Запада. И на этом фоне - каждодневная игра с Восточным Берлином: обмен шпионами, пропуск беженцев, политическое манипулирование.\n\nФРГ 1985 года жила под колпаком холодной войны. Союзники давили, Восток угрожал, а страна училась выживать в этом напряжении - и находить свой путь."
 wgr.3.a: "Мы обязаны выстоять."
 wgr.4.t: "Германия - европейский лидер"
 wgr.4.desc: "Цифры 1985 года говорили сами за себя. ФРГ обладала крупнейшими в мире валютными резервами — $44 млрд** на конец 1984 года. Страна демонстрировала здоровое положительное сальдо торгового баланса в **$30 млрд. Прогнозируемый рост ВВП в 3% был лучшим показателем с 1979 года и одним из самых высоких в Западной Европе. Экспортно-ориентированная экономика ФРГ была более тесно интегрирована с Западной Европой, чем с любой другой частью мира."
 wgr.4.a: "Мы сильны!"
