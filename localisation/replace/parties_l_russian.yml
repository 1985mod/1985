l_russian:

 communism: "Тоталитарный Социализм"
 communism_noun: "Тоталитарный Социализм"
 communism_desc: "Социалистическое Государство"
 marxism: "Маркисзм"
 marxism_desc: "Марксизм — это система философских, экономических и социально-политических взглядов, утверждающая, что история движется борьбой классов, а капитализм неизбежно сменится коммунизмом через освобождение рабочего класса и уничтожение частной собственности."
 leninism: "Ленинизм"
 leninism_desc: "Ленинизм — это основанная на марксизме идеология, основными постулатами которой являются построение социалистического государства под предводительством передовой партии и мировая революция с целью свержения капиталистического общества. В самой партии до принятия окончательных решений возможны борьба мнений и споры."
 chinese_socialism: "Китайский социализм"
 chinese_socialism_desc: "Социализм с китайской спецификой — это официально принятая в КНР социально-экономическая модель, сочетающая долгосрочное политическое господство Коммунистической партии (партии-авангарда) с использованием механизмов рыночной экономики и многоукладности собственности. Данная идеология постулирует приоритет национальной стабильности и технологической модернизации над классическим марксистским требованием немедленной отмены частной собственности, рассматривая текущий этап как «начальную стадию социализма», необходимую для построения мощного суверенного государства."
 communist_perestroika: "Коммунистическая перестройка"
 communist_perestroika_desc: "Коммунистическая перестройка — это идеологическая концепция масштабного реформирования советской системы, предполагавшая «очищение» марксизма-ленинизма от сталинских наслоений и переход к «социализму с человеческим лицом» через механизмы гласности и демократизации. В отличие от китайского пути, данная модель делала ставку на политические свободы и децентрализацию управления как необходимые условия для преодоления экономического застоя. Процесс основывался на убеждении, что в условиях открытости и честной дискуссии партия сможет сохранить лидерство, а социалистический строй обретет второе дыхание."
 authoritarian_socialism: "Авторитарный социализм"
 authoritarian_socialism_desc: "Авторитарный социализм — это политико-экономическая модель, постулирующая построение бесклассового общества через установление абсолютного государственного контроля над всеми сферами жизни и подавление любой оппозиции. В рамках данной системы централизованное планирование и государственная собственность на средства производства рассматриваются как инструменты достижения социальной справедливости, а интересы отдельной личности полностью подчиняются интересам коллектива или государства."
 democratic_socialism: "Демократический социализм"
 democratic_socialism_desc: "Демократический социализм — это политическая идеология, утверждающая, что социальная справедливость и экономическое равенство должны достигаться исключительно в рамках демократического многопартийного строя при соблюдении всех гражданских прав и свобод. В отличие от авторитарных моделей, данная концепция отрицает диктатуру и революционное насилие, полагая, что переход к социализму возможен только через парламентскую борьбу, народное волеизъявление и эволюционные реформы."
 
 socialism: "Социал-демократия"
 socialism_noun: "Социал-демократия"
 socialism_desc: "Социал-демократическое Государство"
 nordic_model: "Скандинавская модель"
 nordic_model_desc: "Скандинавская модель — это социально-экономическая система, сочетающая свободную рыночную экономику и высокий уровень личной свободы с развитым государством всеобщего благосостояния и коллективным регулированием рынка труда. Данная модель базируется на социальном партнерстве между работниками, работодателями и государством, обеспечивая высокую степень равенства и социальной защищенности при сохранении высокой конкурентоспособности капитала."
 the_third_way: "Третий путь"
 the_third_way_desc: "Третий путь — это политико-экономическая концепция, представляющая собой попытку синтеза правоцентристской экономической политики и левоцентристской социальной программы. В рамках данной модели отвергается как традиционный государственный социализм с его избыточным регулированием, так и радикальный неолиберализм с его невмешательством государства, предлагая вместо этого адаптацию социал-демократических ценностей к условиям глобализированного свободного рынка."
 classical_social_democracy: "Классическая социал-демократия"
 classical_social_democracy_desc: "Классическая социал-демократия — это политическое движение и идеология, возникшая в результате эволюции марксизма, которая ставит своей целью постепенное реформирование капиталистического общества в социалистическое через демократические институты. В отличие от революционного коммунизма, данная модель утверждает, что социальная справедливость, ликвидация эксплуатации и равенство возможностей достижимы путем парламентских реформ, активного государственного регулирования и укрепления прав профсоюзов."
 eco_social_democracy: "Эко-социал-демократия"
 eco_social_democracy_desc: "Эко-социал-демократия — это современная политическая концепция, объединяющая классические принципы социальной защиты с требованиями экологической устойчивости. В рамках данной модели борьба с неравенством рассматривается как неотъемлемая часть борьбы с климатическим кризисом, что предполагает радикальную трансформацию экономики через «зеленый» государственный контроль, отказ от приоритета безусловного роста ВВП в пользу экологического благополучия и перераспределение ресурсов для поддержки наиболее уязвимых слоев населения в процессе энергоперехода."
 liberal_social_democracy: "Либеральная социал-демократия"
 liberal_social_democracy_desc: "Либеральная социал-демократия — это идеологический синтез, делающий акцент на индивидуальных правах, рыночных свободах и социальной ответственности государства. В отличие от более радикальных левых течений, эта модель рассматривает рыночную экономику не как временный компромисс, а как наиболее эффективный инструмент производства благ, который нуждается в государственном вмешательстве лишь для исправления «провалов рынка», обеспечения равных стартовых возможностей и предотвращения чрезмерной концентрации капитала."
 
 liberalism: "Либерализм"
 liberalism_noun: "Либерализм"
 liberalism_desc: "Леберальное Государство"
 classic_liberalism: "Классический либерализм"
 classic_liberalism_desc: "Классический либерализм — это политическая и экономическая идеология, возводящая индивидуальную свободу в ранг высшей ценности и ограничивающая роль государства защитой частной собственности, обеспечением правопорядка и соблюдением конституционных прав. Сформировавшись в XVIII–XIX веках, данная доктрина постулирует, что спонтанный порядок, возникающий в результате свободного рыночного обмена и личной инициативы, является наиболее эффективным механизмом развития общества и обеспечения всеобщего благосостояния."
 neoliberalism: "Неолиберализм"
 neoliberalism_desc: "Неолиберализм — это современная интерпретация классического либерализма, направленная на децентрализацию экономики через приватизацию, дерегулирование и радикальное сокращение государственных расходов. В рамках данной модели свободный рынок рассматривается не только как наиболее эффективный экономический механизм, но и как универсальный способ организации человеческой деятельности, где конкуренция является главным двигателем инноваций, а государственное вмешательство признается основным препятствием для экономического роста и личной инициативы."
 social_liberalism: "Социальный либерализм"
 social_liberalism_desc: "Социальный либерализм — это политическая доктрина, утверждающая, что подлинная индивидуальная свобода невозможна без обеспечения государством определенного уровня материального благополучия и равных стартовых возможностей. В отличие от неолиберализма, данная концепция полагает, что государство должно активно корректировать рыночные механизмы для борьбы с бедностью, монополиями и социальной несправедливостью, поскольку только защищенный и образованный гражданин способен в полной мере реализовать свои либеральные права."
 
 conservatism: "Консерватизм"
 conservatism_noun: "Консерватизм"
 conservatism_desc: "Консервативное Государство"
 classic_conservatism: "Классический консерватизм"
 classic_conservatism_desc: "Классический консерватизм — это политическая философия, основанная на признании ценности исторической преемственности, иерархии и органического единства общества. В отличие от либерализма, данная модель рассматривает человека не как изолированного индивида, а как часть сложной системы традиций, религии и национальных институтов, утверждая, что радикальные перемены опасны, а реформы должны быть осторожными и опираться на опыт прошлых поколений."
 reactionism: "Реакционизм"
 reactionism_desc: "Реакционизм — это радикально-консервативная установка, направленная не просто на сохранение текущего порядка, а на полное возвращение к политическому и социальному устройству прошлого. Идеологически реакционизм отрицает итоги крупных революций и модернизационных сдвигов, считая их деградацией, и призывает к реставрации утраченных институтов, таких как абсолютная монархия, сословное деление или доминирующая роль церкви в государственных делах."
 liberal_conservatism: "Либеральный консерватизм"
 liberal_conservatism_desc: "Либеральный консерватизм — это умеренное течение, сочетающее приверженность традиционным институтам и правопорядку с защитой либеральных экономических принципов и индивидуальных свобод. В рамках этой модели консерватизм проявляется в защите конституционной стабильности и моральных устоев, в то время как в экономике поддерживаются свободный рынок, низкие налоги и минимальное вмешательство государства, что делает её близкой к классическому либерализму в вопросах бизнеса."
 social_conservatism: "Социальный консерватизм"
 social_conservatism_desc: "Социальный консерватизм — это идеологическое направление, акцентирующее внимание на защите традиционных моральных ценностей, семейных устоев и религиозных догм как основы стабильного общества. В отличие от чисто политических форм консерватизма, здесь основной упор делается на сохранение «нравственного климата»: противодействие секуляризации, защиту традиционного определения брака и ограничение абортов, часто при поддержке государственных программ, укрепляющих социальную сплоченность и общинные связи."
 national_conservatism: "Национальный консерватизм"
 national_conservatism_desc: "Национальный консерватизм — это вариант консерватизма, в котором защита национальной идентичности, государственного суверенитета и культурной самобытности ставится выше глобальных экономических или либеральных интересов. Данная идеология выступает за жесткий контроль над иммиграцией, протекционизм в экономике и сохранение традиционного уклада жизни титульной нации, часто проявляя скептицизм по отношению к международным организациям и процессам глобализации."
 
 neutrality: "Авторитаризм"
 neutrality_noun: "Авторитаризм"
 neutrality_desc: "Авторитарное Государство"
 authoritarian_democracy: "Авторитарная демократия"
 authoritarian_democracy_desc: "Авторитарная демократия — это политическая система, в которой формально сохраняются институты демократии (выборы, парламент, конституция), но реальная власть сконцентрирована в руках одного лидера или узкой группы, которые используют административный ресурс для подавления реальной оппозиции. В рамках данной модели волеизъявление народа часто используется для легитимации жесткого централизованного правления, при котором гражданские свободы ограничиваются ради обеспечения государственной стабильности и «национального единства»."
 autocracy: "Автократия"
 autocracy_desc: "Автократия — это форма правления, при которой верховная государственная власть неограниченно и бесконтрольно принадлежит одному лицу (монарху, диктатору). В отличие от авторитарной демократии, автократия может не имитировать демократические процессы, опираясь исключительно на силовой аппарат, личную преданность элит и идеологию вождизма, где закон является волей правителя, а не внешним ограничением его полномочий."
 oligarchism: "Олигархизм"
 oligarchism_desc: "Олигархизм — это политический режим, при котором реальная власть в государстве принадлежит небольшой группе наиболее богатых и влиятельных лиц, использующих государственные институты для защиты и приумножения частных экономических интересов. При олигархизме официальные лица часто являются лишь формальными исполнителями воли теневых групп влияния, а доступ к социальным лифтам и ресурсам закрыт для большинства населения, что ведет к сращиванию бизнеса и политики."
 military_regimes: "Военная диктатура"
 military_regimes_desc: "Военный диктатура — это форма государственного управления, при которой вся полнота политической власти сосредоточена в руках высшего командования вооруженных сил или специального органа («хунты»), пришедшего к власти, как правило, в результате государственного переворота. В рамках данной модели гражданское законодательство либо приостанавливается, либо подчиняется приказам военного руководства, а легитимность режима обосновывается необходимостью «восстановления порядка», борьбы с коррупцией или устранения внешней угрозы."

 fascism: "Национализм"
 fascism_noun: "Национализм"
 fascism_desc: "Националистическое Государство"
 baathism: "Баасизм"
 baathism_desc: "Баасизм идеология арабского национализма, которая ставит целью создание единого арабского государства"
 ethnic_nationalism: "Этнический национализм"
 ethnic_nationalism_desc: "Этнический национализм — это форма национальной идентичности, в которой принадлежность к нации определяется исключительно по признаку общего происхождения, «крови», языка и наследуемых культурных традиций. В рамках этой модели нация рассматривается как расширенная семья или биологическая общность, что делает невозможным полноценное вступление в неё представителей других этнических групп, независимо от их лояльности государству или знания языка."
 civil_nationalism: "Гражданский национализм"
 civil_nationalism_desc: "Гражданский национализм — это политическая концепция, определяющая нацию как сообщество граждан, объединенных преданностью общим политическим институтам, ценностям и правовым нормам (Конституции). Данная модель инклюзивна: она допускает, что любой индивид, независимо от этнического происхождения, может стать полноценным членом нации через принятие её гражданских обязательств и следование государственным законам."
 extreme_nationalism: "Экстремальный национализм"
 extreme_nationalism_desc: "Экстремальный национализм — это радикальная идеология, постулирующая абсолютное превосходство собственной нации над другими и оправдывающая агрессивные методы защиты её интересов, включая насилие, дискриминацию и экспансию. В этой системе национальный эгоизм возводится в культ, права личности полностью подавляются ради «величия нации», а международные нормы игнорируются в пользу доминирования и подавления мнимых или реальных врагов."

 islamism: "Исламизм"
 islamism_noun: "Исламизм"
 islamism_desc: "Исламское Государство"
 Salafism: "Салафизм"
 Salafism_desc: "Салафия - движение в суннитском исламе, объединяющее мусульманских религиозных деятелей, которые в разные периоды истории ислама выступали с призывами ориентироваться на образ жизни и веру ранней мусульманской общины, на праведных предков, квалифицируя как «бида» все позднейшие нововведения в указанных сферах, начиная с методов символико-аллегорической трактовки Корана и заканчивая всевозможными новшествами, привнесёнными в мусульманский мир его контактами с Западом"
 Political_Islam: "Салафизм"
 Political_Islam_desc: "Политический ислам — любая интерпретация ислама как источника политической идентичности и действия. Понятие «политический ислам» может относиться к широкому кругу людей и групп, которые выступают за преобразование государства и общества в соответствии с принципами ислама."

