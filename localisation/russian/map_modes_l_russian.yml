 gdp_per_capita_map_mode_tooltip_delayed:0 "§YЭкономический режим карты§!\nПоказывает уровень благосостояния граждан страны.(тыс. $) \n\n§RКрасный: §!1 - 2.5 (Бедность)\n§OОранжевый: §!2.5 - 5 (Низкий доход)\n§OПерсиковый: §!5 - 7.5 (Ниже среднего)\n§YЖелтый: §!7.5 - 10 (Средний доход)\n§GСветло-зеленый: §!10 - 15 (Выше среднего)\n§GЗеленый: §!15 - 25 (Развитые)\n§1Темно-зеленый: §!25 - 40 (Богатые)\n§BБирюзовый: §!Более 40 (Сверхбогатые)""