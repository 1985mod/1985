 RCP_protect_our_borders_and_only_our_borders_desc:0 ""
 RCP_national_supremacy:0 "Национальное превосходство"
 RCP_national_supremacy_desc:0 "Увеличить атаку и мораль на 5%."
 RCP_militarized_schooling:0 "Военизированное образование"
 RCP_militarized_schooling_desc:0 "Пополнить людские ресурсы и ускорить некоторые исследования"
 RCP_end_elections:0 "Завершить Выборы"
 RCP_end_elections_desc:0 ""
 RCP_guide_industries:0 "Руководить промышленностью"
 RCP_guide_industries_desc:0 ""
 RCP_imperial_army:0 "Императорская армия"
 RCP_imperial_army_desc:0 ""
 RCP_nationalisation:0 "Национализация"
 RCP_nationalisation_desc:0 "I'm sorry, but I can only help with translating text according to the guidelines you provided. Please provide the text you need translated in the specified format."
 RCP_ideological_fanaticism:0 "Идеологический фанатизм"
 RCP_ideological_fanaticism_desc:0 "Наши политически установленные ценности и цели столь же достойны жертвоприношения, как и любая древняя вера. Любой последователь должен быть готов столкнуться со смертью, а те, кто уклоняется, пусть будут готовы столкнуться со смертью."
 RCP_spread_freedom:0 "Распространить свободу"
 RCP_spread_freedom_desc:0 "Мы распространим свободу и демократию, нравится им это или нет."
 RCP_army_effort:0 "Армейские усилия"
 RCP_army_effort_desc:0 "Несмотря на растущие возможности воздушной и морской войны, наземный бой остаётся ключевым в завтрашних войнах. С подготовкой мы можем избежать повторения ада траншей."
 RCP_militarism:0 "Военщина"
 RCP_militarism_desc:0 "Те, кто воспринимает военное дело как необходимое зло, обречены колебаться перед лицом войны. Мы вдохновим милитаризм в нашу культуру, дабы стать народом воинов."
 RCP_world_police_force:0 "Мировая полицейская сила"
 RCP_world_police_force_desc:0 "Почему мы должны позволять людям развлекаться, когда можем просто обеспечить им это?"
 RCP_successful_economy:0 "Успешная экономика"
 RCP_successful_economy_desc:0 "Обменять идеи"
 RCP_technology_sharing:0 "Технологическое сотрудничество"
 RCP_technology_sharing_desc:0 "Разделяя технологические достижения с нашими союзниками, весь наш блок будет способен проводить военные исследования и разработки более эффективно."
 RCP_military_youth:0 "Военная молодежь"
 RCP_military_youth_desc:0 "Организации для продвижения дисциплины и политического образования молодёжи в нашей стране будут способствовать лояльности и самопожертвованию с раннего возраста."
 RCP_paramilitarism:0 "Парамилитаризм"
 RCP_paramilitarism_desc:0 "Военные принципы имеют применение за пределами военной сферы. С развитием полувоенных формирований для дополнения наших вооружённых сил, больше людей будет иметь военную подготовку."
 RCP_define_war_crimes:0 "Определить Военные Преступления"
 RCP_define_war_crimes_desc:0 ""
 RCP_political_commissars:0 "Политические комиссары"
 RCP_political_commissars_desc:0 "Для обеспечения соблюдения наших политик в военной практике мы будем вводить политических чиновников в военные ряды."
 RCP_peasant_militias:0 "Крестьянские ополчения"
 RCP_peasant_militias_desc:0 ""
 RCP_expand_state_holdings:0 "Расширить Государственные Владения"
 RCP_expand_state_holdings_desc:0 ""
 RCP_state_sponsored_crusades:0 "Государственные крестовые походы"
 RCP_state_sponsored_crusades_desc:0 ""
 RCP_why_we_fight:0 "Почему Мы Воюем"
 RCP_why_we_fight_desc:0 "Мир становится всё более небезопасным. Наш народ должен видеть зверства, совершаемые теми, кто жаждет власти. Пришло время мобилизовать людей на нашу сторону и обеспечить готовность каждого сражаться за нашу свободу."
 RCP_extra_research_slot_ii:0 "Дополнительный исследовательский слот II"
 RCP_extra_research_slot_ii_desc:0 "Быстрая индустриализация нашей страны открыла новые возможности в области НИОКР, которые следует развивать."
 RCP_bicycle_effort:0 "Велосипедный Усилие"
 RCP_bicycle_effort_desc:0 ""
 RCP_fighter_focus:0 "Самолётный фокус"
 RCP_fighter_focus_desc:0 "Мы не видели последних воздушных боёв в Великой войне. Обеспечение лидерства в развитии истребителей даст нам преимущество в будущем."
 RCP_construction_effort_iii:0 "Строительные усилия III"
 RCP_construction_effort_iii_desc:0 "Расширение нашей инфраструктурной сети значительно повысило наши возможности для строительства."
 RCP_civilian_industry:0 "Гражданская промышленность"
 RCP_civilian_industry_desc:0 ""
 RCP_secret_weapons:0 "Секретное оружие"
 RCP_secret_weapons_desc:0 "Искушение потратить все избыточные ресурсы на развитие танков и самолетов велико, но секрет победы в войнах кроется в совершенно новых областях науки: электроника, ракетная техника и ядерные исследования."
 RCP_synthetic_oil__rubber:0 "Синтетический нефть и резина"
 RCP_synthetic_oil__rubber_desc:0 ""
 RCP_police_state:0 "Полицейское государство"
 RCP_police_state_desc:0 "Усилить Полицейское Государство"
 RCP_bomber_focus:0 "Сосредоточиться на бомбардировщиках"
 RCP_bomber_focus_desc:0 "Когда люди будущего будут говорить о ужасах сегодняшних войн, огонь, льющийся с небес, будет занимать видное место. Мы приложим все усилия, чтобы эти истории рассказывали наши враги."
 RCP_for_the_king:0 "За Короля!"
 RCP_for_the_king_desc:0 "Мы должны сражаться за нашу страну любой ценой!"
 RCP_save_ethnic_minorities:0 "Спасти этнические меньшинства"
 RCP_save_ethnic_minorities_desc:0 ""
 RCP_racial_laws:0 "Расовые законы"
 RCP_racial_laws_desc:0 ""
 RCP_enforce_loyalty:0 "Навязать лояльность"
 RCP_enforce_loyalty_desc:0 ""
 RCP_indoctrination:0 "Идеологизация"
 RCP_indoctrination_desc:0 "Установив нашу идеологию как основанную на истине, её можно преподавать как истину. Образование и средства массовой информации должны отражать этот урок."
 RCP_the_marines:0 "Морская пехота"
 RCP_the_marines_desc:0 ""
 RCP_natural_oil:0 "Натуральная нефть"
 RCP_natural_oil_desc:0 "нефть/каучук"
 RCP_extra_research_slot:0 "Дополнительный исследовательский слот"
 RCP_extra_research_slot_desc:0 "Наш промышленный рост и другие недавние достижения могут позволить нам проводить больше НИОКР параллельно"
 RCP_nuclear_effort:0 "Ядерный усилие"
 RCP_nuclear_effort_desc:0 "Стоя на пороге открытия, способного изменить мир, мы не можем позволить другим зажечь огонь, который когда-нибудь может поглотить Землю."
 RCP_naval_invasions:0 "Морские вторжения"
 RCP_naval_invasions_desc:0 ""
 RCP_rocket_effort:0 "Ракета Усилия"
 RCP_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют достигать беспрецедентных скоростей как для беспилотных, так и для пилотируемых судов. Освоение этих технологий позволит нам застать врага врасплох."
 RCP_national_unity:0 "Национальное единство"
 RCP_national_unity_desc:0 "+ 10 стабильности"
 RCP_economy_for_the_army:0 "Экономика для армии"
 RCP_economy_for_the_army_desc:0 ""
 RCP_planned_economy:0 "Планируемая экономика"
 RCP_planned_economy_desc:0 ""
 RCP_political_correctness:0 "Политическая корректность"
 RCP_political_correctness_desc:0 "Люди, придерживающиеся умеренно спорных или иначе смущающих мнений, кажутся обеспокоенными тем, что существует всеобъемлющий заговор против них. Это кажется отличной идеей."
 RCP_empower_the_military:0 "Усилить Вооруженные Силы"
 RCP_empower_the_military_desc:0 ""
 RCP_divine_rulership:0 "Божественное правление"
 RCP_divine_rulership_desc:0 ""
 RCP_deterrence:0 "Сдерживание"
 RCP_deterrence_desc:0 "Стоя в одиночестве, мы редко выигрываем от войны. К счастью, мы знаем, что лучшая защита — такая, о которой все хорошо осведомлены и которую никогда не приходится применять на практике."
 RCP_volunteer_corps:0 "Добровольческий корпус"
 RCP_volunteer_corps_desc:0 "Принуждать наш народ умирать за идеалы свободы было бы иронией, но создание средств для тех, кто желает помогать людям за границей — нет"
 RCP_intensify_exctraction:0 "Усилить Добычу"
 RCP_intensify_exctraction_desc:0 "Буст для других"
 RCP_construction_effort_ii:0 "Строительные усилия II"
 RCP_construction_effort_ii_desc:0 "Продолжение расширения наших заводов позволит ускорить производство товаров для торговли и дальнейших строительных усилий."
 RCP_naval_effort_ii:0 "Морской Усилий II"
 RCP_naval_effort_ii_desc:0 "То же самое что и морской"
 RCP_aviation_effort_iii:0 "Авиационные усилия III"
 RCP_aviation_effort_iii_desc:0 ""
 RCP_armor_effort:0 "Броневой усилий"
 RCP_armor_effort_desc:0 "Применяя то что мы изучили механизируя нашу пехоту, мы можем улучшить наши бронетранспортеры так же"
 RCP_neutrality_focus:0 "Нейтральный фокус"
 RCP_neutrality_focus_desc:0 "Пока другие могут утверждать, что для принятия стороны в глобальном конфликте требуется отвага и мудрость, мы знаем, что для отказа требуется больше."
 RCP_interventionism_focus:0 "Интервенционистский фокус"
 RCP_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только наших граждан. Если предотвращение тирании означает войну, то пусть так и будет."
 RCP_special_forces:0 "Специальные силы"
 RCP_special_forces_desc:0 "Нам необходимы элитные силы; горнострелковые и парашютно-десантные войска должны быть нашим приоритетом."
 RCP_military_coup:0 "Военный переворот"
 RCP_military_coup_desc:0 ""
 RCP_monarchism:0 "Монархизм"
 RCP_monarchism_desc:0 "Мы должны восстановить монархию!"
 RCP_nationalism:0 "Национализм"
 RCP_nationalism_desc:0 ""
 RCP_fascism:0 "Фашизм"
 RCP_fascism_desc:0 ""
 RCP_socialism_in_one_country:0 "Социализм в одной стране"
 RCP_socialism_in_one_country_desc:0 ""
 RCP_internationalism:0 "Интернационализм"
 RCP_internationalism_desc:0 ""
 RCP_armament_effort_iii:0 "Военные усилия III"
 RCP_armament_effort_iii_desc:0 "Продолжение усилий по расширению наших военных заводов необходимо для удовлетворения потребностей в новом оборудовании."
 RCP_infrastructure_effort_ii:0 "Усилия по развитию инфраструктуры II"
 RCP_infrastructure_effort_ii_desc:0 "Расширение нашей инфраструктуры позволит обеспечить транспортировку и коммуникации, необходимые для высокотехнологичных тайных проектов."
 RCP_capital_ship_effort:0 "Усилия по строительству капитальных кораблей"
 RCP_capital_ship_effort_desc:0 "Нация с наибольшим количеством линкоров будет править океанами. Линкоры и авианосцы представляют собой старое и новое в морском превосходстве."
 RCP_rare_metals_excavation:0 "Разработка редких металлов"
 RCP_rare_metals_excavation_desc:0 ""
 RCP_destroyer_effort:0 "Усилия по строительству эсминцев"
 RCP_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое применение подводных лодок, мы также научились противодействовать этим стратегиям. Эскадренные миноносцы будут ключевыми для этого."
 RCP_nav_effort:0 "Морской усилий"
 RCP_nav_effort_desc:0 "Так же как и новая морская война ведется частично под водной поверхностью, часть её ведётся в воздухе над водами."
 RCP_cas_effort:0 "САС Усилия"
 RCP_cas_effort_desc:0 "Современная армия нуждается в поддержке с транспортных средств не только на суше, но и в воздухе."
 RCP_equipment_effort_iii:0 "Оборонные усилия III"
 RCP_equipment_effort_iii_desc:0 "Стремиться стать мировым лидером в области пехотного вооружения вместо подражания или приобретения иностранной техники"
 RCP_mechanization_effort:0 "Механизация усилий"
 RCP_mechanization_effort_desc:0 "Переосмысливая возможности моторизованной пехоты, мы можем расширить пределы того, что можно создать сегодня с использованием транспортных средств."
 RCP_rightwing_politics:0 "Правые политические взгляды"
 RCP_rightwing_politics_desc:0 "Наша держава уникальна, и наши политические достижения могли бы произойти только здесь. Мы должны бороться за неё любой ценой."
 RCP_leftwing_politics:0 "Левые политические течения"
 RCP_leftwing_politics_desc:0 "Идеология не знает границ. Другое государство может называть себя суверенным, но наши убеждения выше таких претензий."
 RCP_revanchism:0 "Реваншизм"
 RCP_revanchism_desc:0 ""
 RCP_democratic_focus:0 "Демократический фокус"
 RCP_democratic_focus_desc:0 ""
 RCP_war_propoganda:0 "Войенная пропаганда"
 RCP_war_propoganda_desc:0 ""
 RCP_armament_effort_ii:0 "Военные усилия II"
 RCP_armament_effort_ii_desc:0 "Попытка адаптировать гражданские заводы для производства военного оборудования неэффективно. Мы должны сосредоточиться на подготовке военной промышленности сейчас."
 RCP_metal_excavation:0 "Металлургическая добыча"
 RCP_metal_excavation_desc:0 "Добавить случайный штат к производству стали"
 RCP_construction_effort:0 "Строительные усилия"
 RCP_construction_effort_desc:0 "Гражданская промышленная мощь не должна быть недооценена даже когда война нависает над миром"
 RCP_cruiser_effort:0 "Крейсерский усилия"
 RCP_cruiser_effort_desc:0 "Перед тем как предпринимать вылазки в области исследований линейных кораблей, необходимо заменить меньшие крейсеры."
 RCP_submarine_effort:0 "Подводные силы"
 RCP_submarine_effort_desc:0 "Подводная война является наиболее захватывающим развитием морского флота с момента изобретения торпедного катера. Нам следует не только защищаться от подводных лодок, но и использовать их против вражеских судов."
 RCP_equipment_effort:0 "Усилия по оснащению"
 RCP_equipment_effort_desc:0 "Пределы того, какое снаряжение может быть перевезено пехотой, постоянно расширяются. Мы сосредоточимся на обеспечении наших войск лучшими доступными инструментами."
 RCP_aviation_effort_ii:0 "Авиационные усилия II"
 RCP_aviation_effort_ii_desc:0 "Далее следует развивать авиацию, дабы интегрировать нашу воздушную армию с прочими родами войск."
 RCP_doctrine_effort_ii:0 "Доктринальный Усилий II"
 RCP_doctrine_effort_ii_desc:0 "Поле боя изменилось не только в межвоенный период, но и в ходе недавних конфликтов. Мы должны постоянно пересматривать наши доктрины, чтобы отразить это."
 RCP_equipment_effort_ii:0 "Оборонное производство II"
 RCP_equipment_effort_ii_desc:0 "Мы продолжим наши усилия для обеспечения нашей пехоты и войск поддержки лучшим возможным вооружением нашего времени."
 RCP_motorization_effort:0 "Усилия по моторизации"
 RCP_motorization_effort_desc:0 "Мобильность и защита являются ключевыми для безопасного ввода пехоты на поле боя и её вывода с него. Сосредоточение усилий на этих разработках позволит нам действовать быстро."
 RCP_individualist_ethos:0 "Индивидуалистический Этос"
 RCP_individualist_ethos_desc:0 "Что за безумие ты делаешь с этим фокусом, идиот? Это предназначено для слабой ИИ/демократии."
 RCP_a_useful_puppet:0 "Полезный марионеточный режим"
 RCP_a_useful_puppet_desc:0 "Еженедельный бонус к людским ресурсам ЕСЛИ марионеточная"
 RCP_collectivist_ethos:0 "Коллективистский Дух"
 RCP_collectivist_ethos_desc:0 "Наши враги могут разделить и покорить меньшие народы, но наш народ будет стоять единым. Все за одного и один за всех."
 RCP_armament_effort:0 "Усилия по вооружению"
 RCP_armament_effort_desc:0 "Если вы можете строить тракторы, то сможете построить и танки! Мы не должны допустить отставания нашей военной производственной мощности."
 RCP_resource_excavation:0 "Ресурсоразработка"
 RCP_resource_excavation_desc:0 ""
 RCP_infrastructure_effort:0 "Инфраструктурные усилия"
 RCP_infrastructure_effort_desc:0 "Страна без надлежащей инфраструктуры не может осуществлять передовые проекты или строительство."
 RCP_large_navy:0 "Большой флот"
 RCP_large_navy_desc:0 "Приспособление наших морских доктрин для размещения крупных кораблей и обеспечение безопасности наших торговых конвоев научит нас много о том, какие корабли нам необходимы."
 RCP_flexible_navy:0 "Гибкий флот"
 RCP_flexible_navy_desc:0 "Переосмыслить морскую войну с учётом достижений в области подводной техники позволит нам эффективно наносить удары по вражеским конвоям."
 RCP_industrial_effort:0 "Промышленные усилия"
 RCP_industrial_effort_desc:0 "Сосредоточить все наши политические усилия на развитии гражданской промышленности в рамках великого скачка вперёд"
 RCP_political_change:0 "Политическое Изменение"
 RCP_political_change_desc:0 "Привести изменения в мире, нам нужно быть способными привести изменения в нашей собственной стране. Укрепление нашего политического положения должно стоять на первом месте."
 RCP_doctrine_effort:0 "Доктринальный Усилий"
 RCP_doctrine_effort_desc:0 "Военные доктрины, определившие сухопутное сражение в Великой войне, устарели. Мы должны применить наши лучшие умы для формирования военной мысли завтрашнего дня."
 RCP_naval_effort:0 "Морской усилие"
 RCP_naval_effort_desc:0 "Расширение нашего флота должно быть нашим первым приоритетом. Назначить все доступные ресурсы новым верфям и исследованиям легких надводных кораблей."
 RCP_aviation_effort:0 "Авиационные усилия"
 RCP_aviation_effort_desc:0 "Нигде прогресс в области технологических достижений не происходит быстрее, чем в воздушной войне. Авиация — это область, которую должна освоить любая современная держава."
