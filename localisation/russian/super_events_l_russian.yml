l_russian:
 sp_event_world_war_three: "Третья мировая война"
 sp_event_world_war_three_REMARK: "Началось..."
 sp_event_world_war_three_QUOTE: "«Я не знаю, каким оружием будет вестись третья мировая война, но четвёртая — палками и камнями».\n- Альберт Эйнштейн"
 sp_event_operation_desert_storm: "Операция «Буря в пустыне»"
 sp_event_operation_desert_storm_REMARK: "Демократия..."
 sp_event_operation_desert_storm_QUOTE: "«Началась мать всех войн!» \n- Саддам Хусейн"
 sp_super_reunification_of_germany_storm: "Объединение Германии"
 sp_super_reunification_of_germany_REMARK: "Ура!"
 sp_super_reunification_of_germany_QUOTE: "«Разделение Германии было противно природе вещей. Оно было противоестественным, искусственным и поэтому не могло существовать долго. Наша цель остается неизменной: единство нашей нации в условиях свободы».\n- Гельмут Коль"
 sp_super_event_formation_uss: "Формирование ССГ"
 sp_super_event_formation_uss_REMARK: "Ура!"
 sp_super_event_formation_uss_QUOTE: "Реформы должен завершать тот, кто их начал. А начал-то их я!\n- Михаил Горбачёв"
 sp_super_event_military_coup_detat: "Военный переворот в России"
 sp_super_event_military_coup_detat_REMARK: "Удивительно..."
 sp_super_event_military_coup_detat_QUOTE: "«Наше нормальное состояние — это ползти и выползать. Это уникальная способность России выползать из пропастей с перебитыми костями, иногда на зубах, если зубов нет — на дёснах».\n- Александр Лебедь"
 sp_super_event_first_chechen_war: "Первая чеченская война"
 sp_super_event_first_chechen_war_REMARK: "Интересно."
 sp_super_event_first_chechen_war_QUOTE: "«Грозный возьмём двумя десантными полками».\n- Павел Грачёв"
 sp_super_event_collapse_of_america: "Развал США"
 sp_super_event_collapse_of_america_REMARK: "О боже..."
 sp_super_event_collapse_of_america_QUOTE: "«Правительство как грудной младенец: чудовищный аппетит на одном конце и полная безответственность на другом».\n- Рональд Рейган"
 sp_super_event_two_korean_war: "Вторая Корейская война"
 sp_super_event_two_korean_war_REMARK: "Снова..."
 sp_super_event_two_korean_war_QUOTE: "«Долг революционера состоит в том, чтобы идти в гущу народных масс, осуществляющих революцию».\n- Ким Ир Сен"
 sp_event_start_sec: "Начало ГКЧП"
 sp_event_start_sec_REMARK: "Хаос в СССР - ничего необычного"
 sp_event_start_sec_QUOTE: "«Я не случайно говорю о необходимости восстановить былое могущество. Иначе выжить нам не дадут!» \n- Владимир Крючков"
 sp_civil_war_in_somalia: "Гражданская война в Сомали"
 sp_civil_war_in_somalia_REMARK: "Революция пожирает своих детей..."
 sp_civil_war_in_somalia_QUOTE: "«Короче говоря, кто такой учитель? Его по-настоящему можно считать отцом или матерью, точно так же, как мы называем матерью нашу родину. Нет ничего более уважаемого».\n- Мохаммед Сиад Барре"
 sp_sov_world_war_three_victory: "Победа СССР в Третьей мировой войне"
 sp_sov_world_war_three_victory_REMARK: "Коммунизм поборол Европу..."
 sp_sov_world_war_three_victory_flag_QUOTE: "«Победа коммунизма неизбежна. Победа будет за ним».\n- Владимир Ленин"
 sp_nato_world_war_three_victory: "Победа НАТО в Третьей мировой войне"
 sp_nato_world_war_three_victory_REMARK: "Капитализм теперь в СССР..."
 sp_nato_world_war_three_victory_QUOTE: "«Социалисты кричат «Власть людям!» и поднимают сжатый кулак. Все мы знаем, что это значит на самом деле: «Власть над людьми. Власть Государству».\n- Маргарет Тэтчер"
 sp_rus_black_october_october: "Чёрный октябрь"
 sp_rus_black_october_october_REMARK: "О боже..."
 sp_rus_black_october_october_QUOTE: "«Российское государство, выбравшее демократию и свободу, никогда не будет ни империей, ни старшим, ни младшим братом, оно будет равным среди равных».\n- Борис Ельцин"