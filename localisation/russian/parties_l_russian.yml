 baathism_desc: "Баасизм - арабская националистическая идеология, ставящая целью создание и развитие объединённого арабского государства под руководством партии-авангарда и прогрессивного революционного правительства. Идеология основана на идеях Заки аль-Арсузи, Мишеля Афляка и Салаха ад-Дин Битара"

