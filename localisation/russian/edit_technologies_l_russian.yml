 high_powered_weapon:0 "Орудие повышенной мощности"
 infantry_support_weapon:0 "Орудие поддержки пехоты"
 weapon_with_guided_weapons_system:0 "Орудие с комплексом управляемого вооружения"

 standardization_and_assembly_lines:0 "Стандартизация и конвейеры"
 standardization_and_assembly_lines_desc:0 "Внедрение единых стандартов и конвейерной сборки позволяет значительно ускорить выпуск военной продукции."

 cnc_machines:0 "Станки с ЧПУ"
 cnc_machines_desc:0 "Числовое программное управление позволяет автоматизировать обработку деталей, повышая их точность и скорость производства."

 high_precision_machining:0 "Высокоточная механообработка"
 high_precision_machining_desc:0 "Станки с ЧПУ позволяют вытачивать детали с микронной точностью. Вся выпускаемая техника становится надежнее."

 processing_refractory_alloys:0 "Обработка тугоплавких сплавов"
 processing_refractory_alloys_desc:0 "Освоение обработки вольфрама и титана позволяет делать более прочные стволы и броню, экономя при этом стратегические ресурсы."

 automatic_welding:0 "Автоматизированная сварка"
 automatic_welding_desc:0 "Роботы-манипуляторы сваривают корпуса танков и самолетов без человеческих ошибок, значительно повышая общий выпуск продукции."

 automatic_production_lines:0 "Автоматические поточные линии"
 automatic_production_lines_desc:0 "Автоматизация сборочных линий снижает затраты ручного труда и увеличивает объемы выпуска техники."

 container_shipping:0 "Контейнерные перевозки"
 container_shipping_desc:0 "Стандартизированные контейнеры значительно ускоряют погрузку и разгрузку, снижая потребности армии в снабжении."

 barcoding_and_palletizing:0 "Штрих-кодирование и паллетирование"
 barcoding_and_palletizing_desc:0 "Автоматизация учета грузов. Логисты точно знают, где находятся боеприпасы, а паллетирование позволяет перевозить больше топлива."

 digital_logistics_networks:0 "Цифровые логистические сети"
 digital_logistics_networks_desc:0 "Использование компьютерных сетей для отслеживания конвоев. Припасы доставляются с максимальной эффективностью."

 processing_centers:0 "Обрабатывающие центры"
 processing_centers_desc:0 "Многофункциональные станки, объединяющие несколько операций в одном цикле."

 flexible_production_systems:0 "Гибкие производственные системы"
 flexible_production_systems_desc:0 "Позволяют быстро переключать заводы с выпуска одной техники на другую без значительных потерь эффективности."

 warehouse_automation:0 "Автоматизация складов"
 warehouse_automation_desc:0 "Роботизированные склады ускоряют комплектацию заказов и сокращают время доставки на фронт."

 computer_aided_design:0 "Проектирование на ЭВМ"
 computer_aided_design_desc:0 "Использование компьютеров (CAD) для проектирования новой техники позволяет снизить стоимость ее производства."

 industrial_robots:0 "Промышленные роботы"
 industrial_robots_desc:0 "Массовое внедрение роботов на заводах дает огромный прирост к выпуску военной продукции."

 artificial_intelligence_in_manufacturing:0 "Искусственный интеллект в производстве"
 artificial_intelligence_in_manufacturing_desc:0 "Нейросети оптимизируют логистику и производственные цепочки, выжимая максимум из заводов."

 precast_reinforced_concrete:0 "Сборный железобетон"
 precast_reinforced_concrete_desc:0 "Использование готовых бетонных блоков значительно ускоряет строительство зданий и инфраструктуры."

 heavy_construction_equipment:0 "Тяжелая строительная техника"
 heavy_construction_equipment_desc:0 "Мощные бульдозеры и краны позволяют быстрее возводить объекты и прокладывать дороги."

 modular_design:0 "Модульное проектирование"
 modular_design_desc:0 "Сборка зданий из стандартных модулей позволяет строить объекты в рекордно короткие сроки."

 computer_aided_design_systems:0 "Системы автоматизированного проектирования"
 computer_aided_design_systems_desc:0 "Проектирование зданий на компьютерах (САПР/BIM) снижает стоимость и время строительства."

 underground_construction_and_tunnels:0 "Подземное строительство и тоннели"
 underground_construction_and_tunnels_desc:0 "Тоннелепроходческие щиты позволяют возводить мощные укрепления и подземные бункеры."

 global_logistics_hubs:0 "Глобальные логистические хабы"
 global_logistics_hubs_desc:0 "Крупные сортировочные центры и порты ускоряют переброску войск и снабжения."

 construction_with_3d_printers:0 "Строительство 3D-принтерами"
 construction_with_3d_printers_desc:0 "Аддитивные технологии позволяют возводить здания практически мгновенно, даже в полевых условиях."

 quarrying:0 "Разработка карьеров"
 quarrying_desc:0 "Механизация добычи открытым способом увеличивает поставки стали и алюминия на заводы."

 deepwater_drilling:0 "Глубоководное бурение"
 deepwater_drilling_desc:0 "Технологии бурения на шельфе открывают доступ к новым нефтяным месторождениям."

 chemical_synthesis:0 "Химический синтез"
 chemical_synthesis_desc:0 "Развитие химической промышленности позволяет производить больше синтетической резины и других материалов."

 deep_mines:0 "Глубокие шахты"
 deep_mines_desc:0 "Шахты большой глубины позволяют добывать стратегические ресурсы, недоступные ранее."

 hydraulic_fracturing:0 "Гидроразрыв пласта"
 hydraulic_fracturing_desc:0 "Технология фрекинга позволяет добывать нефть и газ из сланцевых пород, кардинально меняя энергетический баланс."

 fuel_storage_system:0 "Система хранения топлива"
 fuel_storage_system_desc:0 "Строительство крупных резервуаров позволяет накапливать больше топлива перед началом войны."

 petrochemical_synthesis:0 "Нефтехимический синтез"
 petrochemical_synthesis_desc:0 "Глубокая переработка нефти позволяет получать больше резины и топлива."

 coal_liquefaction:0 "Ожижение угля"
 coal_liquefaction_desc:0 "Процесс Фишера-Тропша позволяет производить жидкое топливо из угля, снижая зависимость от нефти."

 catalytic_cracking:0 "Каталитический крекинг"
 catalytic_cracking_desc:0 "Использование катализаторов для расщепления тяжелых фракций нефти увеличивает выход бензина."

 industrial_biofuel:0 "Промышленное биотопливо"
 industrial_biofuel_desc:0 "Производство топлива из сельскохозяйственных культур (этанол, биодизель) обеспечивает альтернативный источник энергии."

 hydrogen_energy:0 "Водородная энергетика"
 hydrogen_energy_desc:0 "Разработка топливных элементов на водороде открывает новые горизонты в энергетике."

 deep_raw_material_processing:0 "Глубокая переработка сырья"
 deep_raw_material_processing_desc:0 "Более эффективное использование ресурсов снижает затраты на производство."

 modular_nuclear_reactors:0 "Модульные ядерные реакторы"
 modular_nuclear_reactors_desc:0 "Компактные реакторы обеспечивают заводы огромным количеством дешевой энергии."

 gtl_technologies:0 "GTL-технологии"
 gtl_technologies_desc:0 "Превращение природного газа в жидкое топливо (Gas-to-Liquids). Полная независимость от нефтяных вышек."

 artillery1:0 "Базовая артиллерия"
 artillery1_desc:0 "Буксируемые гаубицы нового поколения, способные эффективно поддерживать пехоту."

 artillery2:0 "Дальнобойная артиллерия"
 artillery2_desc:0 "Более мощные орудия, позволяющие вести огонь на дистанции, недосягаемые для контрбатарейной борьбы."

 artillery_shells_1975:0 "Буксируемые снаряды"
 artillery_shells_1975_desc:0 "Внедрение активно-реактивных и кассетных боеприпасов увеличивает убойную силу артиллерии."

 artillery3:0 "Модернизированная артиллерия"
 artillery3_desc:0 "Современные буксируемые системы с улучшенной эргономикой и системами наведения."

 artillery4:0 "Улучшенные орудия"
 artillery4_desc:0 "Новые сплавы и материалы повышают надежность и срок службы артиллерийских стволов."

 artillery5:0 "Цифровая артиллерия"
 artillery5_desc:0 "Интеграция артиллерии в единые цифровые сети управления боем."

 rocket_artillery:0 "Старые РСЗО"
 rocket_artillery_desc:0 "Реактивные системы залпового огня первого поколения, обеспечивающие высокую плотность огня."

 rocket_artillery2:0 "Модернизация РСЗО"
 rocket_artillery2_desc:0 "Улучшенные реактивные снаряды и системы наведения."

 rocket_artillery3:0 "Корпусное РСЗО"
 rocket_artillery3_desc:0 "Тяжелые реактивные системы, способные накрывать целые квадраты на дальних дистанциях."

 rocket_artillery4:0 "Ракеты с самонаведением"
 rocket_artillery4_desc:0 "Внедрение высокоточных боеприпасов с лазерным и спутниковым наведением."

 rocket_artillery5:0 "Высокоточные РСЗО"
 rocket_artillery5_desc:0 "Современные тактические ракетные комплексы, способные уничтожать точечные цели на огромных расстояниях."

 antiair1:0 "Зенитные орудия"
 antiair1_desc:0 "Базовые зенитные установки для борьбы с низколетящими целями."

 antiair2:0 "Войсковые ЗРК"
 antiair2_desc:0 "Первые мобильные зенитно-ракетные комплексы."

 antiair3:0 "Пушечно-ракетные комплексы"
 antiair3_desc:0 "Гибридные системы, сочетающие в себе скорострельные пушки и зенитные ракеты."

 antiair4:0 "Тепловизоры и оптика для ПВО"
 antiair4_desc:0 "Новейшие системы обнаружения и наведения позволяют эффективнее сбивать самолеты противника."

 antiair5:0 "Тяжелые ЗРК"
 antiair5_desc:0 "Мощные зенитно-ракетные комплексы большой дальности."

 fire_control_automation_1975:0 "Автоматизация управления огнем"
 fire_control_automation_1975_desc:0 "Появление первых АСУ, позволяющих быстро наводить орудия и РСЗО на цель."

 targeting_systems_1980:0 "Целеуказание"
 targeting_systems_1980_desc:0 "Радары и разведывательные дроны позволяют вычислять точку выстрела и наносить упреждающие удары."

 digital_comms_1990:0 "Цифровые системы связи"
 digital_comms_1990_desc:0 "Передача координат цели от пехоты к артиллерии в цифровом виде без задержек."

 satellite_navigation_1995:0 "Спутниковая навигация"
 satellite_navigation_1995_desc:0 "Использование GPS/ГЛОНАСС для точного позиционирования орудий и наведения высокоточных боеприпасов."