l_russian:
 CZE_new_1985: "Новый 1985"
 CZE_new_1985_desc: "Наступил 1985 год. Чехословакия является витриной социализма и торгового изобилия в Европе. Мы не должны потерять этот статус!"
 CZE_west: "Запад"
 CZE_west_desc: "Внеочередной съезд партии пересматривает своё решение по поводу Словакии и Запада в целом. Теперь ЧССР должна двигаться на дружбу с Западной Европой."
 CZE_army_reform: "Новая доктрина ЧССР"
 CZE_army_reform_desc: "ВС ЧССР должны быть готовы нанести сокрушительный удар НАТО. Тем-самым, ЧССР меняет доктрину на молниеносный удар."
 CZE_East: "Восток"
 CZE_East_desc: "Гусак впервые заговорил о «специфике социализма в ЧССР», который не нуждается в реформах. В качестве аргумента он использовал утверждение, что экономика ЧССР работает лучше, чем Польская, а уровень жизни выше, чем в других социалистических странах."
 CZE_prepare_the_stasi: "Эхо 68 года"
 CZE_prepare_the_stasi_desc: "ЧССР не устраивают начавшиеся реформы в СССР. Из-за этого, принято решение о вмешательстве в дела КГБ на территории ЧССР. Руководству СГБ передан устный приказ об аресте агентов КГБ."
 CZE_change_of_courses_in_the_ussr: "Изменение курса в СССР"
 CZE_change_of_courses_in_the_ussr_desc: "ЧССР осуждает новое виденье СССР на мир. Руководство КПЧ недовольство изменениями, происходящими в Советском Союзе, такими как гласность и демократизация политической жизни."
 CZE_new_department_in_dresden: "Переговоры с бархатным движением"
 CZE_new_department_in_dresden_desc: "Правительство Чехословакии должно провести переговоры с демонстрантами. Это будет признак сотрудничества и обсуждения реформ в стране. Мы не должны повторить 1968 год."
 CZE_conflict_with_the_kgb: "Свобода Чехословакии?"
 CZE_conflict_with_the_kgb_desc: "Политическое напряжение между правительством ЧССР и руководством СССР возникло в основном в связи с процессами реформ и переменами, инициированными новым руководством страны. КПЧ обсуждает о полной независимости государства и выходе страны из Варшавского договора."
 CZE_german_reforms: "Полная рыночная социалистическая реформа"
 CZE_german_reforms_desc: "Из-за нестабильности в СССР, Восточная Германия стала переживать кризис. Советский Союз настаивает на проведении своих перестроичных реформ, но с другой стороны - бунтует народ. Мы должны закрутить гайки, но и пообещать СССР о демократии."
 CZE_the_hunt_for_the_kgb: "Президент Чехословакии"
 CZE_the_hunt_for_the_kgb_desc: "Правительство приняло решение о либерализации, дабы сохранить единую Чехословакию. В связи с этим, стране требуются свободные выборы. Первый шаг - президенство."
 CZE_honecker_resignation: "Отставка Густава Гусака"
 CZE_honecker_resignation_desc: "Причиной ухода с поста Президента Густава Гусака - стало резкое ухудшение внутренней ситуации в стране, и проблемы со здоровьем. Решение об отставке было принято на заседании политбюро партии."
 CZE_own_perestroika: "Федерализация Чехословакии"
 CZE_own_perestroika_desc: "Новое правительство ЧССР устраивают идеи перестройки в СССР. Но Словакия стремится к большой автономии, Москва одобряет этот шаг и мы вынуждены пойти на уступку, и создать Чешскую и Словацкую Федеративную Республику."
 CZE_new_shipyards: "Развитие ВПК"
 CZE_new_shipyards_desc: "Для отражении агрессии со стороны НАТО, ЧССР требуется большое количество оружия, по этому: принято решеине о строительстве новых заводов в Словакии."
 CZE_the_fleet_is_prepared: "Учения 'Дружба народов'"
 CZE_the_fleet_is_prepared_desc: "Чехословацкая народная армия проведёт ряд учений, по отражению воздушного десанта на территорию ЧССР."
 CZE_aviation: "ВВС ЧССР"
 CZE_aviation_desc: "Авиация Чехословакии должна быть подготовлена к боевым действиям. Тем-самым мы должны провести новые наборы в ряды пилотов, и развернуть масштабные авиационные учения."
 CZE_the_best_artillery: "Лучшая артиллерия"
 CZE_the_best_artillery_desc: "Артиллерия Чехословакии должна стать самым смертоносным припятствием для Запада."
 CZE_tanks: "Развитие танкограда"
 CZE_tanks_desc: "ЧССР требуется масштабное производство своих танков. Мы должны вложиться в эту отрасль по максимому."
 CZE_the_best_infantry: "Лучшая Пехота"
 CZE_the_best_infantry_desc: "Пехота Чехословакии должна стать самым смертносным припятствием для Запада."
 CZE_friendship_with_germany: "Мирная революция"
 CZE_friendship_with_germany_desc: "ЧССР пересматривает свои действия с соседями. В первую очередь мы должны решить вопрос с Словакией. Возможно, нам скоро придётся пойти на уступки и признать их независимость."
 CZE_invest_in_oil_refineries: "Инвестиции в НПЗ"
 CZE_invest_in_oil_refineries_desc: "Чехия должна вложиться в НПЗ. Из-за перемен в СССР, мы можем ожидать много-чего."
 CZE_new_oil_refineries: "Новые НПЗ"
 CZE_new_oil_refineries_desc: "Правительство вкладывается в строительство НПЗ в нескольких городах нашей страны."
 CZE_development_of_the_military_industrial_complex: "Развитие ВПК ЧССР"
 CZE_development_of_the_military_industrial_complex_desc: "ЧССР срочно нужно вложиться в Военно-промышленный комплекс пока не стало слишком поздно. Чехословакии требуется снаряжение и техника."
 CZE_investments_in_factories: "Инвестиции в фабрики"
 CZE_investments_in_factories_desc: "Партия приняла решение вложиться в социальное развитие товаров и услуг. Народу нужны новые рабочие места и товары."
 CZE_government_support: "Поддержка правительства ЧССР"
 CZE_government_support_desc: "Правительство поддерживает развитие фабричного производства."
 CZE_the_Industrial_fist: "Индустриальный кулак"
 CZE_the_Industrial_fist_desc: "ЧССР направляет все свои ресурсы на индустриализацию своей промышленности. ЧССР должна стать первой в мире коммунистической державой."
 CZE_exit_from_the_ats: "Выход Чехословакии из ОВД"
 CZE_exit_from_the_ats_desc: "В ЧССР происходят народные волнения. Народ требует прекращения сотрудничества с СССР, и переход к мирной жизни. Мы должны выйти из Варшавского договора, это воля народа!"
 CZE_demolish_the_berlin_wall: "Бархатная революция"
 CZE_demolish_the_berlin_wall_desc: "Народ недоволен нашей политикой. Массовые демонстрации, начавшиеся в Праге и распространившиеся по всей Чехословакии, демонстранты требуют открытия границ и суверинитет Словакии."
 CZE_changes_in_the_CZE: "Изменения в ЧСФР"
 CZE_changes_in_the_CZE_desc: "Несмотря на изменения внутри страны, мы остаёмся верны Советскому Союзу. Мы рассчитываем на сохранение дружеских отношений с Москвой."
 CZE_change_of_course: "Смена курса"
 CZE_change_of_course_desc: "Перед ЧССР стоят важные решения. Все 3 решения повлияют на судьбу нашей страны - глобально. Остаёмся ли мы верны социализму, распускаем ЧССР или же выходим из ОВД?"
 CZE_western_and_neutral_germany: "Нейтральная Чехия"
 CZE_western_and_neutral_germany_desc: "Чехия должна выйти из Варшавского договора и стать нейтральной страной. Но перед этим, парламент должен проголосовать за прекращения существования Чехословакии."
 CZE_accession_to_the_federal_republic_of_germany: "Чехия и Словакия?"
 CZE_accession_to_the_federal_republic_of_germany_desc: "Это событие ознаменует завершение длительного объединения двух народов, и восстановит демократическую справедливость."
 CZE_reunification_negotiations: "Переговоры с СССР"
 CZE_reunification_negotiations_desc: "До роспуска ЧССР, мы должны прояснить для себя несколько моментов..."
 CZE_demolition_of_the_wall: "Демонтаж социализма"
 CZE_demolition_of_the_wall_desc: "Для объединения с ФРГ и становлением нейтральной Германией - мы должны снести главный символ Холодной войны. А именно: Берлинскую стену."
 CZE_the_destruction_of_communism: "Федерализация - ЧСФР"
 CZE_the_destruction_of_communism_desc: "ЧССР начинает демонтаж социалистической системы управления страной. Мы должны провести демократические выборы, распустить штази. Но перед этим: уничтожить секретные документы."
 CZE_1: "Сотрудничество с ГДР и СССР"
 CZE_1_desc: "ЧехоСловакия начинает сотрудничество в военной и промышленной сфере с двумя братскими странами. Нашему государство необходимы технологии наших соседей.
 CZE_2: "Ужесточение законодательства"
 CZE_2_desc: "Руководство страны не может допустить повторение ошибок ГДР. В связи с этим, принято решение о массовой пропаганде социализма в стране. Бесплатные листовки с Лениным идут вход!"
 CZE_3: "Взгляды на соседей"
 CZE_3_desc: "Военное руководство страны видит опасность в НАТО. Руководство Восточной Германии не смогло удержать власть, мы не должны допустить этого и у нас."
 CZE_4: "Мы ждём перемен!"
 CZE_4_desc: "Наше государство стало стабильным. Нету никаких бунтарей, и врагов нации. Теперь наша страна движется вперёд, на пути к светлому будущему."
 CZE_5: "Поддержка новых союзников"
 CZE_5_desc: "США, Великобритания, Франция готовы оказать поддержку новому демократическому государству. Мы даём разрешение на покупку наших заводов Американцам."
 CZE_6: "Заявка в НАТО"
 CZE_6_desc: "Чехия за свою историю побывала в составах нескольких государств. Сейчас, когда Чехия обрела наконец то настоящую свободу - ей требуется защита. Мы подаём заявку в НАТО, и надеемся на её принятие."
 CZE_7: "Крах социализма"
 CZE_7_desc: "Социалистическая идея потерпела крах в нашем государстве. Теперь Чехия должна идти по пути новой демократии. Свобода, равенство, братство!"
 CZE_8: "Пропаганды, реформы и компьютеры"
 CZE_8_desc: "Ленин, Маркс - вот кому мы должны подражать! ЧСФР должна идти по пути к коммунизму! Новые реформы должны развить социальную сферу страны, и наконец начать развитие компьютерной промышленности." 
