l_russian:
 SOV_soviet_union.1.t: "Константин Черненко умер..."
 SOV_soviet_union.1.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза."
 SOV_soviet_union.1.a: "Нужно что-то делать!" # Горбачев
 SOV_soviet_union.2.t: "Выборы нового Генерального секретаря"
 SOV_soviet_union.2.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза. Перед нами стоит выбор между либеральным Горбачевым и сталинистом Романовым. Кому теперь суждено править СССР?"
 SOV_soviet_union.2.a: "Нам нужны либеральные реформы! За Горбачева!" # Горбачев
 SOV_soviet_union.2.b: "Нет Горбачёву! Нам нужен Романов!"
 SOV_soviet_union.7.t: "Встреча в Женеве"
 SOV_soviet_union.7.desc: "Ноябрьское утро над Женевским озером выдалось туманным. М.С. Горбачёв прибыл во Дворец Наций, чтобы встретиться с президентом США - впервые за многие годы мы сядем за стол переговоров без привычной риторики «холодной войны». За плечами - изнурительная гонка вооружений, которая истощает экономику, и «Звёздные войны» (СОИ), которые грозят сделать наш ядерный арсенал устаревшим."
 SOV_soviet_union.7.a: "Любые уступки ради мира."
 SOV_soviet_union.9.t: "Шеварднадзе - новый министр иностранных дел"
 SOV_soviet_union.9.desc: "Лето 1985 года. Вы сидите в своём кабинете в Кремле, перебирая досье кандидатов на пост министра иностранных дел. Андрей Андреевич Громыко - «Мистер Нет», легенда советской дипломатии, человек, который пережил восемь генсеков, - согласен уступить кресло в обмен на почётную должность председателя Президиума Верховного Совета. Но кого поставить на его место?Ваш взгляд падает на папку с пометкой «Тбилиси». Эдуард Шеварднадзе. Первый секретарь ЦК Компартии Грузии. Человек, с которым вы знакомы ещё с комсомольских времён - тогда вы вместе прогуливались по берегу Чёрного моря и говорили о том, что «так жить больше нельзя». Он не дипломат. Он не знает иностранных языков. Он ни разу не был за границей. Громыко в ужасе предлагает вам на замену опытнейшего посла в США Анатолия Добрынина."
 SOV_soviet_union.9.a: "Идеальная кандитатура"
 SOV_soviet_union.10.t: "Анти-алкогольная кампания"
 SOV_soviet_union.10.desc: "В 1985 году борьба с пьянством становится нашим приоритетом. Постановление ЦК КПСС «О преодолении пьянства и алкоголизма» предполагает радикальное сокращение производства и продажи спиртного, закрытие винных магазинов, перепрофилирование заводов и создание массовых обществ трезвости. Успех кампании укрепит здоровье нации, но ударит по бюджету (потеря акцизов) и вызовет рост недовольства среди населения, но это вынужденная мера. В долгосрочной перспективе - снижение смертности и рост рождаемости, но в краткосрочной - риск социальной напряжённости и расцвета самогоноварения."
 SOV_soviet_union.10.a: "Это была вынужденная мера"
 SOV_soviet_union.11.t: "Горбачёв - президент СССР"
 SOV_soviet_union.11.desc: "Март 1990 года. Наша страна задыхается в тисках экономического кризиса, националистические движения сотрясают союзные республики, а старая партийно-советская система управления даёт трещину. В этих условиях Внеочередной III Съезд народных депутатов СССР принимает судьбоносное решение - учредить пост Президента Советского Союза и избрать на него первого главу государства."
 SOV_soviet_union.11.a: "Поддержим Горбачёва. Пусть станет президентом!"
 SOV_soviet_union.12.t: "Беспорядки в союзных республиках"
 SOV_soviet_union.12.desc: "«1990 год входит в историю СССР как год «парада суверенитетов». Одна за другой союзные республики принимают Декларации о государственном суверенитете, заявляя о верховенстве своих законов над общесоюзными. Прибалтика требует немедленного вывода войск, Армения и Азербайджан уже несколько лет живут в состоянии замороженного конфликта вокруг Нагорного Карабаха, Грузия бойкотирует референдумы, а Молдавия балансирует на грани гражданской войны между молдаванами и гагаузами. \nПо всей стране прокатываются митинги и забастовки. В Тбилиси демонстранты требуют независимости, в Душанбе - отставки местного руководства, в Киеве - возрождения Украинской автокефальной церкви. Центральные власти теряют контроль над ситуацией, а экономика, и без того ослабленная кризисом, трещит по швам из-за разрыва хозяйственных связей между республиками."
 SOV_soviet_union.12.a: "Союз должен быть неделимым"
 SOV_soviet_union.13.t: "Декларация о гос. суверенитете РСФСР"
 SOV_soviet_union.13.desc: "12 июня 1990 года. В разгар «парада суверенитетов», когда прибалтийские республики уже заявили о выходе из Союза, а Украина готовила собственную Декларацию, Первый Съезд народных депутатов РСФСР принимает исторический документ - Декларацию о государственном суверенитете Российской Советской Федеративной Социалистической Республики."
 SOV_soviet_union.13.a: "Пусть Россия будет центром обновлённой федерации"
 SOV_soviet_union.14.t: "XXVII Съезд КПСС"
 SOV_soviet_union.14.desc: "25 февраля 1986 года в Кремлёвском Дворце съездов открывается XXVII Съезд Коммунистической партии Советского Союза. Это первый партийный форум после прихода к власти Михаила Горбачёва, и он сразу становится ареной острой политической борьбы между консерваторами и сторонниками реформ."
 SOV_soviet_union.14.a: "Дадим дорогу Перестройке!"
 SOV_soviet_union.15.t: "Визит в Венгрию"
 SOV_soviet_union.15.desc: "8 июня 1986 года. Самолёт Ил-62 с бортовым номером CCCP-86494 приземляется в будапештском аэропорту Ферихедь. Михаил Сергеевич Горбачёв, Генеральный секретарь ЦК КПСС, прибывает с первым зарубежным визитом в социалистическую страну после чернобыльской катастрофы - и выбирает для этого Венгрию, самую либеральную из стран Варшавского договора. Встреча с венгерским руководством продлится примерно четыре дня, включая участие в заседании Политического Консультативного комитета стран-участниц Варшавского договора."
 SOV_soviet_union.15.a: "Поддержим реформы в Венгрии"
 SOV_soviet_union.16.t: ""
 SOV_soviet_union.16.desc: ""
 SOV_soviet_union.16.a: ""
 SOV_soviet_union.17.t: ""
 SOV_soviet_union.17.desc: ""
 SOV_soviet_union.17.a: ""
 SOV_soviet_union.18.t: "«Песенные марши» в Прибалтике"
 SOV_soviet_union.18.desc: "Вторая половина 1980-х годов. Политика гласности открывает шлюзы для долго подавляемой исторической памяти. В Эстонии, Латвии и Литве одно за другим проходят массовые мероприятия, посвящённые жертвам сталинских репрессий и депортаций. То, что начиналось как культурные акции - песенные фестивали, концерты, патриотические вечера - стремительно приобретает политическое звучание. \nВ 1987 году в Таллинне и Риге проходят первые открытые митинги, приуроченные к годовщинам массовых депортаций 1941 и 1949 годов. Люди выходят на улицы с цветами и фотографиями родственников, погибших в лагерях. В Литве движение «Саюдис» организует многотысячные собрания, на которых звучат песни о депортациях и призывы к восстановлению справедливости. \nКульминацией этого процесса становится «Балтийский путь» 23 августа 1989 года - в день 50-летия подписания пакта Молотова-Риббентропа. Около двух миллионов человек, взявшись за руки, образуют живую цепь длиной почти 670 километров, соединяющую Таллин, Ригу и Вильнюс."
 SOV_soviet_union.18.a: "Ограничимся введением гарнизона для наблюдения"
 SOV_soviet_union.19.t: ""
 SOV_soviet_union.19.desc: ""
 SOV_soviet_union.19.a: ""

 SOV_chernobyl.1.t: "Авария на Чернобыльской АЭС"
 SOV_chernobyl.1.desc: "26 апреля 1986 года, в 1:23 ночи, на четвёртом энергоблоке Чернобыльской АЭС произошёл мощный взрыв во время проведения испытаний восьмого турбогенератора. Взрыв полностью разрушил реактор, вызвав один из крупнейших техногенных выбросов радиоактивных веществ в истории. В атмосферу попали изотопы урана, плутония, йода-131, цезия-134, цезия-137 и стронция-90. В ликвидации последствий приняли участие тысячи людей, многие из которых получили серьёзные дозы радиации. Эта катастрофа стала ударом по стабильности Советского Союза, усилив напряжённость в обществе и обострив политическую ситуацию в СССР."
 SOV_chernobyl.1.a: "Вечная память героям!"

 european_union.2.t: "Румынская революция"
 european_union.2.d: "Декабрь 1989 года. Жестокий режим Николае Чаушеску, десятилетиями державший Румынию в тисках нищеты и страха, рушится на глазах. Протесты, начавшиеся в Тимишоаре, перекинулись на Бухарест. Армия перешла на сторону народа, и после нескольких дней ожесточенных боев с преданными режиму частями Секуритате диктатор и его жена были пойманы и казнены.\n\nСтрана лежит в руинах, но народ празднует освобождение. Власть переходит к Фронту национального спасения во главе с Ионом Илиеску, который обещает построить новую, демократическую Румынию. Путь к свободе будет трудным, но первый шаг сделан."
 european_union.2.a: "Чаушеску пал! Да здравствует свободная Румыния!"

 DDR_unification.1.t: "Восточный блок пал"
 DDR_unification.1.desc: "Организации Варшавского Договора больше нет... В связи с этим в ФРГ и в ГДР встаёт вопрос об объединении Германии, а фактически, о ликвидации ГДР. Дадим Германии стать вновь единой или поборемся за свое право на сущестование?"
 DDR_unification.1.a: "Мы согласны! Время ГДР уже давно прошло."
 DDR_unification.1.b: "ФРГ покушается на нас. Постоим за коммунистический строй!"

 DDR_unification.2.t: "ГДР отказалась от объединения с нами"
 DDR_unification.2.desc: "В ГДР всё больше массовых демонстраций и требований об отставке правительства. Но они вцепились за власть зубами. Что будем делать?"
 DDR_unification.2.a: "Сейчас не время для объединения!"
 DDR_unification.2.b: "Если ГДР не идёт к нам, то мы идём к ним. С оружием."

 CZE_Czechoslovakia_kgb.1.t: "Память о Пражской весне"
 CZE_Czechoslovakia_kgb.1.desc: "Прошло семнадцать лет с тех пор, как танки Варшавского договора вошли в Прагу, и ЧССР не устраивают начавшиеся реформы в СССР. Из-за этого принято решение Руководству СГБ передан устный приказ об аресте агентов КГБ"
 CZE_Czechoslovakia_kgb.1.a: "Да, начать арест"
 CZE_Czechoslovakia_kgb.1.b: "Нет, не начать"

 CZE_Czechoslovakia_lenders.1.t: "Военное сотрудничество"
 CZE_Czechoslovakia_lenders.1.desc: "Мы договорились с СССР о том, что на нашей территории построят военные заводы в обмен на лояльность Москве"
 CZE_Czechoslovakia_lenders.1.a: "Отлично!"

 CZE_Czechoslovakia_perepro.1.t: "Переговоры"
 CZE_Czechoslovakia_perepro.1.desc: "Чтобы удержать контроль, руководство страны провело переговоры с демонстрантами, пообещав частичные реформы и больше свободы слова. Это решение дало правительству время, но одновременно подорвало его авторитет - народ уже почувствовал силу."
 CZE_Czechoslovakia_perepro.1.a: "Терпеть"
 CZE_Czechoslovakia_perepro.1.b: "Послать куда подальше"

 CZE_global_ralal.1.t: "Развал Чехословакия"
 CZE_global_ralal.1.desc: "Чехословакия больше не существует, после многолетнего кризиса правительство Чехословакии не выдержало"
 CZE_global_ralal.1.a: "Да!"
 CZE_global_ralal.1.b: "Ех"
 CZE_global_ralal.1.s: "Пофиг"

 CZE_Czechoslovakia_papy.1.t: "Отчет про 1985 году"
 CZE_Czechoslovakia_papy.1.desc: "Пришёл новый, 1985 год. 1. СССР слабеет от внутренних противоречий. 2. Оппозиция в стране становится всё сильнее. 3. Экономика переживает времена стагнации.\nОт вас, игрок, зависит судьба Чехословакии и её народа"
 CZE_Czechoslovakia_papy.1.a: "Понятно"

 usa.29.t: "Чёрный понедельник"
 usa.29.desc: "19 октября 1987 года мировые фондовые рынки обвалились с беспрецедентной скоростью. Волна продаж прокатилась от Азии и Европы до Уолл-стрит, а автоматизированные стратегии только усилили панику. Если правительство США и Федеральная резервная система не удержат доверие рынков, биржевой крах быстро ударит по промышленности, торговле и общественной стабильности."
 usa.29.a: "Рынки охватила паника."
 usa.31.t: "Тучи над Уолл-стрит"
 usa.31.desc: "Весной 1987 года американский фондовый рынок выглядит всё менее устойчивым. Акции заметно переоценены после нескольких лет роста, процентные ставки идут вверх, торговый и бюджетный дефициты давят на доверие к доллару, а автоматизированные стратегии продаж способны превратить обычную коррекцию в лавину. Пока биржи ещё держатся, у администрации Рейгана и Федеральной резервной системы есть несколько месяцев, чтобы снизить панику и подготовить финансовую систему к возможному обвалу."
 usa.31.a: "Начать подготовку к рыночному шторму."
 british_black_wednesday.1.t: "Тучи над фунтом"
 british_black_wednesday.1.desc: "Фунт стерлингов всё сильнее давит нижнюю границу европейского валютного механизма. Высокие немецкие ставки после объединения Германии, сомнения вокруг Маастрихта и уверенность валютных трейдеров в переоценённости фунта превращают защиту курса в политическую битву за престиж правительства Джона Мейджора. Банк Англии может тратить резервы и поднимать ставки, но рынок уже проверяет, хватит ли у Лондона решимости удержать стерлинг в ERM."
 british_black_wednesday.1.a: "Защитить фунт любой ценой."
 european_union.3.t: "«Нежная революция» в Болгарии"
 european_union.3.desc: "10 ноября 1989 года. Тодор Живков — человек, правивший Болгарией 35 лет, — смещён с поста генерального секретаря ЦК Болгарской коммунистической партии. Заговор созревал внутри самой партии: министр иностранных дел Пётр Младенов ещё в октябре направил открытое письмо в ЦК, обвинив Живкова в том, что тот изолировал страну от всего мира, включая СССР. Горбачёв давно считал Живкова тормозом реформ и поддерживал оппозицию внутри БКП.\n\nВ отличие от Румынии, болгарская революция прошла без крови — её называют «нежной». На улицах Софии звучат требования демократии и многопартийности. 7 декабря тринадцать оппозиционных организаций объединяются в Союз демократических сил. Болгария начинает медленный, но необратимый путь к свободным выборам."
 european_union.3.a: "Живков пал. Болгария идёт своим путём!"
 european_union.4.t: "Переговорная революция в Венгрии"
 european_union.4.desc: "Лето 1989 года. Венгрия идёт своим путём — без баррикад и крови. Правящая Венгерская социалистическая рабочая партия сама садится за стол переговоров с оппозицией. 13 июня в Будапеште открывается Национальный круглый стол: коммунисты, Венгерский демократический форум, Альянс свободных демократов, молодой Фидес и другие силы обсуждают мирный переход к демократии.\n\n23 октября 1989 года — в годовщину революции 1956-го — Венгерская Народная Республика официально переименована в Венгерскую Республику. ВСРП превращается в Венгерскую социалистическую партию и признаёт своё историческое поражение. В марте 1990 года проходят первые свободные выборы — победу одерживает правоцентристский Венгерский демократический форум во главе с Йожефом Анталлом. Железный занавес пал — Венгрия открыла границу с Австрией ещё в мае."
 european_union.4.a: "Венгрия доказала: свободу можно завоевать словом."
 european_union.4.t: "Переговорная революция в Венгрии"
 european_union.4.desc: "Лето 1989 года. Венгрия идёт своим путём — без баррикад и крови. Правящая Венгерская социалистическая рабочая партия сама садится за стол переговоров с оппозицией. 13 июня в Будапеште открывается Национальный круглый стол: коммунисты, Венгерский демократический форум, Альянс свободных демократов, молодой Фидес и другие силы обсуждают мирный переход к демократии.\n\n23 октября 1989 года — в годовщину революции 1956-го — Венгерская Народная Республика официально переименована в Венгерскую Республику. ВСРП самораспускается и превращается в социал-демократическую Венгерскую социалистическую партию. В марте 1990 года проходят первые свободные выборы — победу одерживает правоцентристский Венгерский демократический форум во главе с Йожефом Анталлом. Ещё в мае Венгрия открыла границу с Австрией, пробив первую брешь в Железном занавесе."
 european_union.4.a: "Венгрия доказала: свободу можно завоевать словом."
 european_union.5.t: "Революция «Солидарности» в Польше"
 european_union.5.desc: "6 февраля 1989 года. В Варшаве открывается легендарный Круглый стол — переговоры между правящей Польской объединённой рабочей партией и запрещённым профсоюзом «Солидарность» во главе с Лехом Валенсой. Экономика агонизирует, забастовки не утихают, и у ПОРП не осталось иного выхода, кроме диалога.\n\n4 апреля подписано соглашение: «Солидарность» легализована, учреждается пост президента и свободно избираемый Сенат. 4 июня на выборах «Солидарность» получает 99 из 100 мест в Сенате — разгром коммунистов полный. 24 августа премьером становится Тадеуш Мазовецкий — первый некоммунистический глава правительства в послевоенной истории Польши. В декабре из конституции убраны все упоминания социализма. Польша положила начало лавине перемен по всему Восточному блоку."
 european_union.5.a: "«Солидарность» победила. Польша свободна!"