 SOV_soviet_union.47.t: "Декабрьские события в Алма-Ате"
 SOV_soviet_union.47.desc: "17 декабря 1986 года на площади Брежнева в Алма-Ате начинаются массовые выступления студентов и молодёжи против назначения Геннадия Колбина первым секретарём ЦК Компартии Казахстана. Это становится первым крупным национальным протестом в СССР в годы перестройки, обнажившим острые противоречия между союзным центром и республиканскими элитами."
 SOV_soviet_union.47.a: "Лучше начнём расследование"
 SOV_soviet_union.47.b: "Жёстко подавим мятеж. Порядок любой ценой."
 SOV_soviet_union.48.t: "План «Метель-1986»"
 SOV_soviet_union.48.desc: "Сегодня в наши силовые органы СССР приступили к реализации специального оперативного плана под кодовым названием «Метель-1986». Разработанный МВД СССР ещё до начала протестов, этот план предусматривал подавление выступлений казахской молодёжи в Алма-Ате с привлечением трёх сводных отрядов, усиленных бронетранспортёрами и пожарными машинами. Первый разгон демонстрации был предпринят ещё 17 декабря около 18 часов с применением дубинок, однако основные силы были задействованы на следующий день. Курсанты пограничного училища и внутренние войска орудовали сапёрными лопатками, щитами и дубинками. На площади остались лежать десятки, а может, и сотни молодых людей, многие из которых были в крови. Впоследствии историки квалифицировали эту операцию как военно-политическую авантюру общегосударственного масштаба, а основополагающие документы плана были уничтожены."
 SOV_soviet_union.48.a: "Отлично."
 SOV_soviet_union.49.t: "События в Новом Узене"
 SOV_soviet_union.49.desc: "16 июня 1989 года на танцплощадке клуба «Строитель» в нефтедобывающем городе Новый Узень произошла драка между местными казахами и выходцами с Кавказа. Конфликт, возникший из бытовой ссоры, стремительно перерос в массовые межэтнические столкновения, охватившие весь город и прилегающие районы полуострова Мангышлак."
 SOV_soviet_union.49.a: "Лучше введём войска. Так будет лучше для всех"
 SOV_soviet_union.49.b: "Ничего не будем делать. Конфликт решится само собой."
 SOV_soviet_union.50.t: "Ввод Советских войск"
 SOV_soviet_union.50.desc: "20 июня 1989 года в нефтяной город Новый Узень (Мангышлакская область Казахской ССР) введены дополнительные подразделения внутренних войск МВД СССР и армейские части, расквартированные в Среднеазиатском военном округе. Решение принято на следующий день после начала массовых межэтнических столкновений между местными казахами и выходцами с Кавказа. В городе установлен комендантский час, запрещено передвижение граждан в ночное время, усилено патрулирование улиц с использованием бронетехники и автомобилей повышенной проходимости. Войска блокируют въезды и выезды из города, проводят проверки документов и изъятие оружия у населения."
 SOV_soviet_union.50.a: "Принято!"
 SOV_soviet_union.51.t: "Протесты усиливаются"
 SOV_soviet_union.51.desc: "Конфликт, который возник из бытовой ссоры, стремительно перерос в массовые межэтнические столкновения, охватившие весь город и прилегающие районы полуострова Мангышлак."
 SOV_soviet_union.51.a: "Нужно что-то делать!"
 SOV_soviet_union.52.t: "Протесты стихают"
 SOV_soviet_union.52.desc: "Конфликт, который возник из бытовой ссоры, стремительно перерос в массовые межэтнические столкновения, охватившие весь город и прилегающие районы полуострова Мангышлак, к нашему счастью, стихает."
 SOV_soviet_union.52.a: "Очень хорошо."
 SOV_soviet_union.53.t: "Ферганские погромы"
 SOV_soviet_union.53.desc: "Сегодня в городе Кувасай Ферганской области Узбекской ССР произошла драка между узбекской и турецко-месхетинской молодёжью, положившая начало крупнейшему межэтническому конфликту в СССР со времён депортаций. Поводом послужила бытовая ссора на базаре - покупатель-турок опрокинул тарелку клубники продавщицы-узбечки, после чего завязалась перепалка, переросшая в массовое столкновение."
 SOV_soviet_union.53.a: "Ё-моё..."
 SOV_soviet_union.54.t: "Ввод Милиции в Кувасай"
 SOV_soviet_union.54.desc: "23 мая 1989 года в город Кувасай Ферганской области Узбекской ССР для подавления возобновившихся массовых столкновений между узбекской и турецко-месхетинской молодёжью введены дополнительные силы милиции, свыше 300 человек, переброшенные из соседних районов. Ранее, 16–18 мая, в городе уже происходили драки между молодёжью двух национальностей, однако 23 мая конфликт вспыхнул с новой силой и перерос в крупные столкновения, продолжавшиеся два дня. Помимо милиции, в Ферганскую область направлено более 9 тысяч военнослужащих внутренних войск МВД СССР для нормализации обстановки и охраны общественного порядка. В ходе столкновений погибло 103 человека, более тысячи получили ранения, ранено 110 работников милиции, один из них скончался."
 SOV_soviet_union.54.a: "Принято."
 SOV_soviet_union.55.t: "Погромы усиливаются"
 SOV_soviet_union.55.desc: "Масштаб столкновений в Ферганской области Узбекской ССР достиг критической отметки. Вслед за Кувасаем погромы перекинулись на Фергану, Маргилан, Коканд и десятки пригородных посёлков, превратившись в неконтролируемые межэтнические чистки. Толпы, насчитывающие до нескольких тысяч человек, блокировали улицы, поджигали жилые кварталы, громили предприятия и учреждения. Милицейские наряды оказались не в состоянии сдержать разбушевавшуюся толпу - за 2 дня зарегистрировано более 300 нападений на дома турок-месхетинцев, 80 процентов жилого фонда в некоторых микрорайонах уничтожено огнём. Угроза расправы вынудила тысячи семей покидать свои дома в панике; многие укрывались на железнодорожных станциях и в воинских частях. В ответ на эскалацию 1 июня в область введён комендантский час, а дополнительные подразделения внутренних войск приступили к зачистке улиц с использованием бронетехники."
 SOV_soviet_union.55.a: "Тяжело..."
 SOV_soviet_union.56.t: "Массовые беспорядки в Душанбе"
 SOV_soviet_union.56.desc: "10 февраля 1990 года в Душанбе, столице Таджикской ССР, начались массовые беспорядки, продолжавшиеся четыре дня и ставшие одним из самых кровавых межэтнических конфликтов на территории СССР в период Перестройки. Поводом для выхода на улицы многотысячных толп послужили слухи о том, что властями республики нескольким тысячам армянских беженцев из Баку, бежавших от погромов, будут выделены квартиры в Душанбе без очереди - в то время как в городе ощущалась острая нехватка жилья. В действительности же в столицу Таджикистана прибыли всего около 50 человек. 11 февраля у здания ЦК Компартии Таджикистана собрались около 4 тысяч человек с лозунгами «Долой армян!», а после того как армянские семьи спешно покинули город, толпа стала требовать отставки руководства республики."
 SOV_soviet_union.56.a: "Да что-ж такое..."
 SOV_soviet_union.57.t: "Ошские события"
 SOV_soviet_union.57.desc: "В конце мая 1990 года на юге Киргизской ССР, в густонаселённой Ферганской долине, начался один из самых кровопролитных межнациональных конфликтов в истории СССР - Ошская резня. Поводом послужил земельный спор: малоимущие молодые киргизы потребовали предоставить им участки для жилищного строительства на землях колхоза имени Ленина вблизи Оша. Власти согласились удовлетворить это требование, однако узбекское население, составлявшее в городе большинство, восприняло это как ущемление своих прав."
 SOV_soviet_union.57.a: "Мда"
 SOV_chernobyl.1.t: "Авария на Чернобыльской АЭС"
 SOV_chernobyl.1.desc: "26 апреля 1986 года, в 1:23 ночи, на четвёртом энергоблоке Чернобыльской АЭС произошёл мощный взрыв во время проведения испытаний восьмого турбогенератора. Взрыв полностью разрушил реактор, вызвав один из крупнейших техногенных выбросов радиоактивных веществ в истории. В атмосферу попали изотопы урана, плутония, йода-131, цезия-134, цезия-137 и стронция-90. В ликвидации последствий приняли участие тысячи людей, многие из которых получили серьёзные дозы радиации. Эта катастрофа стала ударом по стабильности Советского Союза, усилив напряжённость в обществе и обострив политическую ситуацию в СССР."
 SOV_chernobyl.1.a: "Вечная память героям!"

 DDR_unification.1.t: "Восточный блок пал"
 DDR_unification.1.desc: "Организации Варшавского Договора больше нет... В связи с этим в ФРГ и в ГДР встаёт вопрос об объединении Германии, а фактически, о ликвидации ГДР. Дадим Германии стать вновь единой или поборемся за свое право на сущестование?"
 DDR_unification.1.a: "Мы согласны! Время ГДР уже давно прошло."
 DDR_unification.1.b: "ФРГ покушается на нас. Постоим за коммунистический строй!"

 DDR_unification.2.t: "ГДР отказалась от объединения с нами"
 DDR_unification.2.desc: "В ГДР всё больше массовых демонстраций и требований об отставке правительства. Но они вцепились за власть зубами. Что будем делать?"
 DDR_unification.2.a: "Сейчас не время для объединения!"
 DDR_unification.2.b: "Если ГДР не идёт к нам, то мы идём к ним. С оружием."

 CZE_Czechoslovakia_kgb.1.t: "Память о Пражской весне"
 CZE_Czechoslovakia_kgb.1.desc: "Прошло семнадцать лет с тех пор, как танки Варшавского договора вошли в Прагу, и ЧССР не устраивают начавшиеся реформы в СССР. Из-за этого принято решение Руководству СГБ передан устный приказ об аресте агентов КГБ"
 CZE_Czechoslovakia_kgb.1.a: "Да, начать арест"
 CZE_Czechoslovakia_kgb.1.b: "Нет, не начать"

 CZE_Czechoslovakia_lenders.1.t: "Военное сотрудничество"
 CZE_Czechoslovakia_lenders.1.desc: "Мы договорились с СССР о том, что на нашей территории построят военные заводы в обмен на лояльность Москве"
 CZE_Czechoslovakia_lenders.1.a: "Отлично!"

 CZE_Czechoslovakia_perepro.1.t: "Переговоры"
 CZE_Czechoslovakia_perepro.1.desc: "Чтобы удержать контроль, руководство страны провело переговоры с демонстрантами, пообещав частичные реформы и больше свободы слова. Это решение дало правительству время, но одновременно подорвало его авторитет - народ уже почувствовал силу."
 CZE_Czechoslovakia_perepro.1.a: "Терпеть"
 CZE_Czechoslovakia_perepro.1.b: "Послать куда подальше"

 CZE_global_ralal.1.t: "Развал Чехословакия"
 CZE_global_ralal.1.d: "Чехословакия больше не существует, после многолетнего кризиса правительство Чехословакии не выдержало"
 CZE_global_ralal.1.a: "Да!"
 CZE_global_ralal.1.b: "Ех"
 CZE_global_ralal.1.s: "Пофиг"

 CZE_Czechoslovakia_papy.1.t: "Отчет про 1985 году"
 CZE_Czechoslovakia_papy.1.desc: "Пришёл новый, 1985 год. 1. СССР слабеет от внутренних противоречий. 2. Оппозиция в стране становится всё сильнее. 3. Экономика переживает времена стагнации.\nОт вас, игрок, зависит"

 british_black_wednesday.1.t: "Тучи над фунтом"
 british_black_wednesday.1.desc: "Фунт стерлингов всё сильнее давит нижнюю границу европейского валютного механизма. Высокие немецкие ставки после объединения Германии, сомнения вокруг Маастрихта и уверенность валютных трейдеров в переоценённости фунта превращают защиту курса в политическую битву за престиж правительства Джона Мейджора. Банк Англии может тратить резервы и поднимать ставки, но рынок уже проверяет, хватит ли у Лондона решимости удержать стерлинг в ERM."
 british_black_wednesday.1.a: "Защитить фунт любой ценой."
 european_union.3.t: "«Нежная революция» в Болгарии"
 european_union.3.desc: "10 ноября 1989 года. Тодор Живков — человек, правивший Болгарией 35 лет, — смещён с поста генерального секретаря ЦК Болгарской коммунистической партии. Заговор созревал внутри самой партии: министр иностранных дел Пётр Младенов ещё в октябре направил открытое письмо в ЦК, обвинив Живкова в том, что тот изолировал страну от всего мира, включая СССР. Горбачёв давно считал Живкова тормозом реформ и поддерживал оппозицию внутри БКП.\n\nВ отличие от Румынии, болгарская революция прошла без крови — её называют «нежной». На улицах Софии звучат требования демократии и многопартийности. 7 декабря тринадцать оппозиционных организаций объединяются в Союз демократических сил. Болгария начинает медленный, но необратимый путь к свободным выборам."
 european_union.3.a: "Живков пал. Болгария идёт своим путём!"
 european_union.4.t: "Переговорная революция в Венгрии"
 european_union.4.desc: "Лето 1989 года. Венгрия идёт своим путём — без баррикад и крови. Правящая Венгерская социалистическая рабочая партия сама садится за стол переговоров с оппозицией. 13 июня в Будапеште открывается Национальный круглый стол: коммунисты, Венгерский демократический форум, Альянс свободных демократов, молодой Фидес и другие силы обсуждают мирный переход к демократии.\n\n23 октября 1989 года — в годовщину революции 1956-го — Венгерская Народная Республика официально переименована в Венгерскую Республику. ВСРП превращается в Венгерскую социалистическую партию и признаёт своё историческое поражение. В марте 1990 года проходят первые свободные выборы — победу одерживает правоцентристский Венгерский демократический форум во главе с Йожефом Анталлом. Железный занавес пал — Венгрия открыла границу с Австрией ещё в мае."
 european_union.4.a: "Венгрия доказала: свободу можно завоевать словом."
 european_union.4.t: "Переговорная революция в Венгрии"
 european_union.4.desc: "Лето 1989 года. Венгрия идёт своим путём — без баррикад и крови. Правящая Венгерская социалистическая рабочая партия сама садится за стол переговоров с оппозицией. 13 июня в Будапеште открывается Национальный круглый стол: коммунисты, Венгерский демократический форум, Альянс свободных демократов, молодой Фидес и другие силы обсуждают мирный переход к демократии.\n\n23 октября 1989 года — в годовщину революции 1956-го — Венгерская Народная Республика официально переименована в Венгерскую Республику. ВСРП самораспускается и превращается в социал-демократическую Венгерскую социалистическую партию. В марте 1990 года проходят первые свободные выборы — победу одерживает правоцентристский Венгерский демократический форум во главе с Йожефом Анталлом. Ещё в мае Венгрия открыла границу с Австрией, пробив первую брешь в Железном занавесе."
 european_union.4.a: "Венгрия доказала: свободу можно завоевать словом."
 european_union.5.t: "Революция «Солидарности» в Польше"
 european_union.5.desc: "6 февраля 1989 года. В Варшаве открывается легендарный Круглый стол — переговоры между правящей Польской объединённой рабочей партией и запрещённым профсоюзом «Солидарность» во главе с Лехом Валенсой. Экономика агонизирует, забастовки не утихают, и у ПОРП не осталось иного выхода, кроме диалога.\n\n4 апреля подписано соглашение: «Солидарность» легализована, учреждается пост президента и свободно избираемый Сенат. 4 июня на выборах «Солидарность» получает 99 из 100 мест в Сенате — разгром коммунистов полный. 24 августа премьером становится Тадеуш Мазовецкий — первый некоммунистический глава правительства в послевоенной истории Польши. В декабре из конституции убраны все упоминания социализма. Польша положила начало лавине перемен по всему Восточному блоку."
 european_union.5.a: "«Солидарность» победила. Польша свободна!"