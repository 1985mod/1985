l_russian:
 SOV_soviet_union.1.t: "Константин Черненко умер..."
 SOV_soviet_union.1.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза."
 SOV_soviet_union.1.a: "Нужно что-то делать!" # Горбачев
 SOV_soviet_union.2.t: "Выборы нового Генерального секретаря"
 SOV_soviet_union.2.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза. Перед нами стоит выбор между либеральным Горбачевым и сталинистом Романовым. Кому теперь суждено править СССР?"
 SOV_soviet_union.2.a: "Нам нужны либеральные реформы! За Горбачева!" # Горбачев
 SOV_soviet_union.2.b: "Нет Горбачёву! Нам нужен Романов!"
 SOV_soviet_union.3.t: "События в Вильнюсе"
 SOV_soviet_union.3.desc: "В ночь с 12 на 13 января 1991 года после трагических событий в Вильнюсе, где советские спецподразделения при поддержке бронетехники заняли телецентр, убив 14 человек, в Риге началось массовое движение протеста. 13 января около полумиллиона человек собрались на набережной Даугавы на митинг Народного фронта, после которого жители приступили к возведению баррикад в Старой Риге и других районах города. Строились защитные сооружения вокруг здания Верховного Совета, телевидения, мостов и других стратегических объектов. Кульминацией противостояния стало 20 января, когда рижский ОМОН, оставшийся верным союзной присяге, предпринял попытку штурма здания Министерства внутренних дел Латвии. В ходе перестрелки в центре Риги погибли пять человек: школьник Эдийс Риекстиньш, двое сотрудников органов внутренних дел - Владимир Гомонович и Сергей Кононенко, а также операторы Рижской киностудии Андрис Слапиньш и Гвидо Звайгзне. Баррикады простояли до 27 января, став символом сопротивления латвийского народа и важнейшим этапом на пути к восстановлению независимости республики."
 SOV_soviet_union.3.a: "Ясно."
 SOV_soviet_union.4.t: "Референдум о сохранении СССР"
 SOV_soviet_union.4.desc: "17 марта 1991 года в Советском Союзе прошёл Всесоюзный референдум о сохранении обновлённого Союза Советских Социалистических Республик как федерации равноправных республик. В бюллетень был вынесен единственный вопрос: «Считаете ли Вы необходимым сохранение Союза Советских Социалистических Республик как обновлённой федерации равноправных суверенных республик, в которой будут в полной мере гарантироваться права и свободы человека любой национальности?»."
 SOV_soviet_union.4.a: "Новый Союз - будет!"
 SOV_soviet_union.5.t: "III Съезд народных депутатов РСФСР"
 SOV_soviet_union.5.desc: "В самый разгар противостояния союзного центра и российской власти открывается Третий (внеочередной) Съезд народных депутатов РСФСР. Инициатором его созыва выступил Кремль - задача ставилась чёткая: используя противников Ельцина, которых в депутатском корпусе насчитывалось до 80%, снять его с должности Председателя Верховного Совета. Однако ещё до открытия съезда по всей стране развернулась массовая агитация в поддержку Ельцина.\n\nЗа несколько дней до начала работы наши власти попытались взять ситуацию под контроль. 25 марта Кабинет министров СССР запретил проведение любых митингов и демонстраций в Москве до 15 апреля. А 26 марта Михаил Горбачёв издал указ о выводе московской милиции из-под юрисдикции РСФСР, напрямую подчинив её союзному МВД. В день открытия съезда центр Москвы был наводнён военной техникой, милицией и ОМОНом.\n\nСъезд ответил мгновенно: принято постановление о приостановке действия обоих документов как нарушающих Конституцию СССР и Декларацию о государственном суверенитете России. Съезд прервал работу до 29 марта, а затем продолжил - с нарастающим давлением на Кремль."
 SOV_soviet_union.5.a: "Ура!"
 SOV_soviet_union.6.t: "Войска в Москве"
 SOV_soviet_union.6.desc: "Накануне открытия III внеочередного Съезда народных депутатов РСФСР союзное руководство предприняло беспрецедентные меры. 25 марта 1991 года Кабинет министров СССР запретил проведение любых митингов и демонстраций в Москве до 15 апреля. 26 марта Михаил Горбачёв издал указ о переподчинении московской милиции напрямую союзному МВД. А 27 марта, по настоянию КГБ, президент дал добро на ввод в Москву армейских подразделений. Это было сделано впервые за все годы перестройки."
 SOV_soviet_union.6.a: "О боже..."
 SOV_soviet_union.7.t: "Встреча в Женеве"
 SOV_soviet_union.7.desc: "Ноябрьское утро над Женевским озером выдалось туманным. М.С. Горбачёв прибыл во Дворец Наций, чтобы встретиться с президентом США - впервые за многие годы мы сядем за стол переговоров без привычной риторики «холодной войны». За плечами - изнурительная гонка вооружений, которая истощает экономику, и «Звёздные войны» (СОИ), которые грозят сделать наш ядерный арсенал устаревшим."
 SOV_soviet_union.7.a: "Любые уступки ради мира."
 SOV_soviet_union.8.t: "Авария на Чернобыльской АЭС"
 SOV_soviet_union.8.desc: "Сегодня, 26 апреля 1986 года, в 1:23 ночи, на четвёртом энергоблоке Чернобыльской АЭС произошёл мощный взрыв во время проведения испытаний восьмого турбогенератора. Взрыв полностью разрушил реактор, вызвав один из крупнейших техногенных выбросов радиоактивных веществ в истории. В атмосферу попали изотопы урана, плутония, йода-131, цезия-134, цезия-137 и стронция-90. В ликвидации последствий приняли участие тысячи людей, многие из которых получили серьёзные дозы радиации." 
 SOV_soviet_union.8.a: "Вечная память нашим героям!"
 SOV_soviet_union.9.t: "Шеварднадзе - новый министр иностранных дел"
 SOV_soviet_union.9.desc: "Лето 1985 года. Вы сидите в своём кабинете в Кремле, перебирая досье кандидатов на пост министра иностранных дел. Андрей Андреевич Громыко - «Мистер Нет», легенда советской дипломатии, человек, который пережил восемь генсеков, - согласен уступить кресло в обмен на почётную должность председателя Президиума Верховного Совета. Но кого поставить на его место?Ваш взгляд падает на папку с пометкой «Тбилиси». Эдуард Шеварднадзе. Первый секретарь ЦК Компартии Грузии. Человек, с которым вы знакомы ещё с комсомольских времён - тогда вы вместе прогуливались по берегу Чёрного моря и говорили о том, что «так жить больше нельзя». Он не дипломат. Он не знает иностранных языков. Он ни разу не был за границей. Громыко в ужасе предлагает вам на замену опытнейшего посла в США Анатолия Добрынина."
 SOV_soviet_union.9.a: "Идеальная кандитатура"
 SOV_soviet_union.10.t: "Анти-алкогольная кампания"
 SOV_soviet_union.10.desc: "В 1985 году борьба с пьянством становится нашим приоритетом. Постановление ЦК КПСС «О преодолении пьянства и алкоголизма» предполагает радикальное сокращение производства и продажи спиртного, закрытие винных магазинов, перепрофилирование заводов и создание массовых обществ трезвости. Успех кампании укрепит здоровье нации, но ударит по бюджету (потеря акцизов) и вызовет рост недовольства среди населения, но это вынужденная мера. В долгосрочной перспективе - снижение смертности и рост рождаемости, но в краткосрочной - риск социальной напряжённости и расцвета самогоноварения."
 SOV_soviet_union.10.a: "Это была вынужденная мера"
 SOV_soviet_union.11.t: "Горбачёв - президент СССР"
 SOV_soviet_union.11.desc: "Март 1990 года. Наша страна задыхается в тисках экономического кризиса, националистические движения сотрясают союзные республики, а старая партийно-советская система управления даёт трещину. В этих условиях Внеочередной III Съезд народных депутатов СССР принимает судьбоносное решение - учредить пост Президента Советского Союза и избрать на него первого главу государства."
 SOV_soviet_union.11.a: "Поддержим Горбачёва. Пусть станет президентом!"
 SOV_soviet_union.12.t: "Беспорядки в союзных республиках"
 SOV_soviet_union.12.desc: "«1990 год входит в историю СССР как год «парада суверенитетов». Одна за другой союзные республики принимают Декларации о государственном суверенитете, заявляя о верховенстве своих законов над общесоюзными. Прибалтика требует немедленного вывода войск, Армения и Азербайджан уже несколько лет живут в состоянии замороженного конфликта вокруг Нагорного Карабаха, Грузия бойкотирует референдумы, а Молдавия балансирует на грани гражданской войны между молдаванами и гагаузами. \nПо всей стране прокатываются митинги и забастовки. В Тбилиси демонстранты требуют независимости, в Душанбе - отставки местного руководства, в Киеве - возрождения Украинской автокефальной церкви. Центральные власти теряют контроль над ситуацией, а экономика, и без того ослабленная кризисом, трещит по швам из-за разрыва хозяйственных связей между республиками."
 SOV_soviet_union.12.a: "Союз должен быть неделимым"
 SOV_soviet_union.13.t: "Декларация о гос. суверенитете РСФСР"
 SOV_soviet_union.13.desc: "12 июня 1990 года. В разгар «парада суверенитетов», когда прибалтийские республики уже заявили о выходе из Союза, а Украина готовила собственную Декларацию, Первый Съезд народных депутатов РСФСР принимает исторический документ - Декларацию о государственном суверенитете Российской Советской Федеративной Социалистической Республики."
 SOV_soviet_union.13.a: "Пусть Россия будет центром обновлённой федерации"
 SOV_soviet_union.14.t: "XXVII Съезд КПСС"
 SOV_soviet_union.14.desc: "25 февраля 1986 года в Кремлёвском Дворце съездов открывается XXVII Съезд Коммунистической партии Советского Союза. Это первый партийный форум после прихода к власти Михаила Горбачёва, и он сразу становится ареной острой политической борьбы между консерваторами и сторонниками реформ."
 SOV_soviet_union.14.a: "Дадим дорогу Перестройке!"
 SOV_soviet_union.15.t: "Визит в Венгрию"
 SOV_soviet_union.15.desc: "8 июня 1986 года. Самолёт Ил-62 с бортовым номером CCCP-86494 приземляется в будапештском аэропорту Ферихедь. Михаил Сергеевич Горбачёв, Генеральный секретарь ЦК КПСС, прибывает с первым зарубежным визитом в социалистическую страну после чернобыльской катастрофы - и выбирает для этого Венгрию, самую либеральную из стран Варшавского договора. Встреча с венгерским руководством продлится примерно четыре дня, включая участие в заседании Политического Консультативного комитета стран-участниц Варшавского договора."
 SOV_soviet_union.15.a: "Поддержим реформы в Венгрии"
 SOV_soviet_union.16.t: "Крушение рейса Аэрофлот 2306 в Коми АССР"
 SOV_soviet_union.16.desc: "2 июля 1986 года в 75 километрах от Сыктывкара, в густых лесах Сысольского района, потерпел катастрофу Ту-134АК, выполнявший рейс №2306 по маршруту Воркута - Сыктывкар - Москва. Через 32 минуты после вылета из Сыктывкара на высоте 5600 метров сработала сигнализация «Дым в заднем багажнике». Бортмеханик подтвердил возгорание, и командир экипажа принял решение об экстренной посадке. Но до аэродрома лайнер не долетел - пожар стремительно уничтожал самолёт, и он рухнул на лесной массив в 9,5 километрах от посёлка Копса.\n\nИз 92 человек, находившихся на борту (86 пассажиров, в том числе 19 детей, и 6 членов экипажа), спастись удалось лишь 38. 54 человека погибли - одни сгорели заживо, другие задохнулись в дыму ещё до того, как самолёт коснулся земли. Выжившие ждали помощи часами: спасательный вертолёт прибыл только через три часа, а полноценная эвакуация началась спустя семь.\n\nРасследование установило, что причиной пожара, скорее всего, стала бензопила «Урал» в разобранном виде, которую двое граждан Болгарии провезли в ручной клади. Топливный бак с остатками горючего был обнаружен на месте крушения в районе заднего багажного отделения. Досмотр багажа в аэропорту Воркуты не проводился."
 SOV_soviet_union.16.a: "Покойтесь с миром..."
 SOV_soviet_union.17.t: "Крушение теплохода «Адмирал Нахимов» в Чёрном море"
 SOV_soviet_union.17.desc: "31 августа 1986 года, в 23 часа 12 минут, круизный пароход «Адмирал Нахимов», на борту которого находилось 1243 человека, столкнулся с сухогрузом «Петр Васев» в Цемесской бухте близ Новороссийска. Удар пришёлся в правый борт парохода, образовалась пробоина высотой 10 метров и длиной более 8 метров - около 90 квадратных метров. Вода хлынула в открытые иллюминаторы, и через семь-восемь минут судно затонуло в четырёх километрах от берега. Спасти удалось 836 человек, погиб 423 человека - 359 пассажиров и 64 члена экипажа. Крупнейшая катастрофа в истории отечественного пассажирского флота произошла в разгар перестройки, в прямой видимости берега, при ясной погоде и навигационном оборудовании. Оба капитана впоследствии были осуждены условно."
 SOV_soviet_union.17.a: "Покойтесь с миром..."
 SOV_soviet_union.18.t: "«Песенные марши» в Прибалтике"
 SOV_soviet_union.18.desc: "Вторая половина 1980-х годов. Политика гласности открывает шлюзы для долго подавляемой исторической памяти. В Эстонии, Латвии и Литве одно за другим проходят массовые мероприятия, посвящённые жертвам сталинских репрессий и депортаций. То, что начиналось как культурные акции - песенные фестивали, концерты, патриотические вечера - стремительно приобретает политическое звучание. \nВ 1987 году в Таллинне и Риге проходят первые открытые митинги, приуроченные к годовщинам массовых депортаций 1941 и 1949 годов. Люди выходят на улицы с цветами и фотографиями родственников, погибших в лагерях. В Литве движение «Саюдис» организует многотысячные собрания, на которых звучат песни о депортациях и призывы к восстановлению справедливости. \nКульминацией этого процесса становится «Балтийский путь» 23 августа 1989 года - в день 50-летия подписания пакта Молотова-Риббентропа. Около двух миллионов человек, взявшись за руки, образуют живую цепь длиной почти 670 километров, соединяющую Таллин, Ригу и Вильнюс."
 SOV_soviet_union.18.a: "Ограничимся введением гарнизона для наблюдения"
 SOV_soviet_union.19.t: "Указ «Об образовании Государственного комитета по охране природы»"
 SOV_soviet_union.19.desc: ""
 SOV_soviet_union.19.a: "Правильно!"
 SOV_soviet_union.20.t: "Визит Горбачёва в Чехословакию"
 SOV_soviet_union.20.desc: "Визит Горбачёва в Чехословакию"
 SOV_soviet_union.20.a: "Да здравствует Горбачёв!"
 SOV_soviet_union.21.t: "Избрание Дмитрия Язова"
 SOV_soviet_union.21.desc: "Избрание Дмитрия Язова"
 SOV_soviet_union.21.a: "Ура!"
 SOV_soviet_union.22.t: "Митинг «Демократической России» на Манежной площади в Москве"
 SOV_soviet_union.22.desc: "Начало 1990-х. Манежная площадь в Москве заполнена десятками тысяч людей. Над толпой — трехцветные флаги и транспаранты реформаторов. Ораторы сменяют друг друга, площадь гудит от аплодисментов и выкриков. Атмосфера наэлектризована: страна требует перемен, и этот митинг становится зримым доказательством того, что старая эпоха уходит. Это битва за новую историю."
 SOV_soviet_union.22.a: "За демократическую Россию!"
 SOV_soviet_union.23.t: "Авторитет Михаила Горбачёва падает"
 SOV_soviet_union.23.desc: "Конец 1980-х. Ещё вчера Михаил Горбачёв был кумиром миллионов - символом обновления и надежды. Но сегодня его рейтинг стремительно падает. Слишком медленные реформы разочаровывают либералов, слишком радикальные - пугают консерваторов. В очередях и на кухнях всё чаще звучит одно и то же: «Он не справляется».\n\nПресса, ещё недавно воспевавшая генсека, теперь пестрит критическими статьями. В регионах растёт недовольство, а в партийных верхах зреет заговор. Авторитет Горбачёва тает с каждым днём - страна устала ждать, а он мечется между двумя огнями, теряя контроль над ситуацией."
 SOV_soviet_union.23.a: "Долой Горбачёва!"
