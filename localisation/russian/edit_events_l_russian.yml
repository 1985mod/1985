l_russian:
 SOV_soviet_union.1.t: "Константин Черненко умер..."
 SOV_soviet_union.1.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза."
 SOV_soviet_union.1.a: "Нужно что-то делать!" # Горбачев
 
 SOV_soviet_union.2.t: "Выборы нового Генерального секретаря"
 SOV_soviet_union.2.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза. Перед нами стоит выбор между либеральным Горбачевым и сталинистом Романовым. Кому теперь суждено править СССР?"
 SOV_soviet_union.2.a: "Нам нужны либеральные реформы! За Горбачева!" # Горбачев
 SOV_soviet_union.2.b: "Нет Горбачёву! Нам нужен Романов!"

 SOV_chernobyl.1.t: "Авария на Чернобыльской АЭС"
 SOV_chernobyl.1.desc: "26 апреля 1986 года, в 1:23 ночи, на четвёртом энергоблоке Чернобыльской АЭС произошёл мощный взрыв во время проведения испытаний восьмого турбогенератора. Взрыв полностью разрушил реактор, вызвав один из крупнейших техногенных выбросов радиоактивных веществ в истории. В атмосферу попали изотопы урана, плутония, йода-131, цезия-134, цезия-137 и стронция-90. В ликвидации последствий приняли участие тысячи людей, многие из которых получили серьёзные дозы радиации. Эта катастрофа стала ударом по стабильности Советского Союза, усилив напряжённость в обществе и обострив политическую ситуацию в СССР."
 SOV_chernobyl.1.a: "Вечная память героям!"

 DDR_unification.1.t: "Восточный блок пал"
 DDR_unification.1.desc: "Организации Варшавского Договора больше нет... В связи с этим в ФРГ и в ГДР встаёт вопрос об объединении Германии, а фактически, о ликвидации ГДР. Дадим Германии стать вновь единой или поборемся за свое право на сущестование?"
 DDR_unification.1.a: "Мы согласны! Время ГДР уже давно прошло."
 DDR_unification.1.b: "ФРГ покушается на нас. Постоим за коммунистический строй!"

 DDR_unification.2.t: "ГДР отказалась от объединения с нами"
 DDR_unification.2.desc: "В ГДР всё больше массовых демонстраций и требований об отставке правительства. Но они вцепились за власть зубами. Что будем делать?"
 DDR_unification.2.a: "Сейчас не время для объединения!"
 DDR_unification.2.b: "Если ГДР не идёт к нам, то мы идём к ним. С оружием."

 CZE_Czechoslovakia_kgb.1.t: "Память о Пражской весне"
 CZE_Czechoslovakia_kgb.1.desc: "Прошло семнадцать лет с тех пор, как танки Варшавского договора вошли в Прагу, и ЧССР не устраивают начавшиеся реформы в СССР. Из-за этого принято решение Руководству СГБ передан устный приказ об аресте агентов КГБ"
 CZE_Czechoslovakia_kgb.1.a: "Да, начать арест"
 CZE_Czechoslovakia_kgb.1.b: "Нет, не начать"

 CZE_Czechoslovakia_lenders.1.t: "Военное сотрудничество"
 CZE_Czechoslovakia_lenders.1.desc: "Мы договорились с СССР о том, что на нашей территории построят военные заводы в обмен на лояльность Москве"
 CZE_Czechoslovakia_lenders.1.a: "Отлично!"

 CZE_Czechoslovakia_perepro.1.t: "Переговоры"
 CZE_Czechoslovakia_perepro.1.desc: "Чтобы удержать контроль, руководство страны провело переговоры с демонстрантами, пообещав частичные реформы и больше свободы слова. Это решение дало правительству время, но одновременно подорвало его авторитет — народ уже почувствовал силу."
 CZE_Czechoslovakia_perepro.1.a: "Терпеть"
 CZE_Czechoslovakia_perepro.1.b: "Послать куда подальше"

 CZE_global_ralal.1.t: "Развал Чехословакия"
 CZE_global_ralal.1.d: "Чехословакия больше не существует, после многолетнего кризиса правительство Чехословакии не выдержало"
 CZE_global_ralal.1.a: "Да!"
 CZE_global_ralal.1.b: "Ех"
 CZE_global_ralal.1.s: "Пофиг"

 CZE_Czechoslovakia_papy.1.t: "Отчет про 1985 году"
 CZE_Czechoslovakia_papy.1.desc: "Пришёл новый, 1985 год. 1. СССР слабеет от внутренних противоречий. 2. Оппозиция в стране становится всё сильнее. 3. Экономика переживает времена стагнации.\nОт вас, игрок, зависит"

 european_union.2.a: "Историческая справка ЕС"
 european_union.2.d: "После Второй мировой войны страны Европы стремились предотвратить новые конфликты и восстановить экономику через сотрудничество. В 1951 году шесть государств — Франция, ФРГ, Италия, Бельгия, Нидерланды и Люксембург — создали Европейское объединение угля и стали, положив начало европейской интеграции.\nВ 1957 году были подписаны Римские договоры, учредившие Европейское экономическое сообщество (ЕЭС) и Евратом. Главной целью стало формирование общего рынка, свободного движения товаров, услуг, капитала и рабочей силы.\nВ 1970-х годах сообщество расширилось: к нему присоединились Великобритания, Ирландия и Дания, позже — Греция. \n 1985 году ЕЭС стало важной силой в Европе. В этот период началась подготовка к созданию единого внутреннего рынка"
 european_union.2.c: "К будущему!"
 european_union.3.a: "Подписание единого европейского акта"
 european_union.3.d: "После долгих переговоров государства Европейского сообщества согласовали положения Единого европейского акта. Новый договор должен ускорить создание единого внутреннего рынка, укрепить экономическое сотрудничество и расширить полномочия общеевропейских институтов. Сторонники интеграции называют этот момент началом новой эпохи европейского единства, тогда как критики опасаются постепенной утраты национального суверенитета ради будущего объединённой Европы."
 european_union.3.c: "Отлично!"

 european_union.4.a: "Ганноверский саммит"
 european_union.4.d: "На саммите в Ганновере лидеры Европейского сообщества согласились, что дальнейшая интеграция Европы невозможна без более тесного валютного и экономического сотрудничества. По итогам переговоров комиссия Жака Делора получила поручение подготовить конкретный план создания Экономического и валютного союза."
 european_union.4.c: "Европа должна стать единым экономическим пространством!!"

 european_union.5.a: "Доклад Делора"
 european_union.5.d: "Этот отчет, подготовленный комитетом под председательством Делора, стал официальным планом создания единой европейской валюты - евро. \nТри этапа интеграции по Делору:\nЭтап 1 (1990–1993 гг.): Полная отмена ограничений на движение капитала внутри Европейского экономического сообщества (ЕЭС). \nЭтап 2 (1994–1998 гг.): Создание Европейского валютного института (предшественника современного ЕЦБ) и усиление координации национальных монетарных политик.\nЭтап 3 (с 1999 г.): Жесткая фиксация обменных курсов между странами-участницами, передача монетарных полномочий Европейскому центральному банку и физическое введение евро."
 european_union.5.c: "Посмотрим"
 european_union.6.a: "Мадридский саммит"
 european_union.6.d: "В ходе напряженных дискуссий был утвержден радикальный курс на создание Экономического и валютного союза. Принятые решения запускают беспрецедентный механизм 100% отмены любых ограничений на движение капитала внутри блока. Более того, утвержден исторический шаг: старая расчетная единица ЭКЮ уходит в прошлое. Ее заменит новая единая валюта - евро, стартовый курс которой зафиксирован в жесткой пропорции 1:1.\nВпереди государства ждет сложный 3-летний переходный период для адаптации национальных банковских систем, но финансовый фундамент уже заложен. "
 european_union.6.c: "Отлично"
 european_union.7.a: "Маастрихтских переговоров"
 european_union.7.d: "Многомесячные изнурительные дебаты в небольшом голландском городке Маастрихт наконец подошли к концу. То, что начиналось как чисто экономическое объединение по добыче угля и стали, сегодня превращается в беспрецедентный политический монолит. Подписанный договор официально учреждает Европейский союз — наднациональную структуру, которая навсегда изменит баланс сил на континенте.\n Соглашение базируется на трех фундаментальных столпах: полном экономическом объединении с перспективой введения единой валюты, координации общей внешней политики и тесном сотрудничестве министерств внутренних дел. Для еврооптимистов это день великого триумфа и шаг к «Соединенным Штатам Европы». Однако в кулуарах звучат и тревожные голоса: отныне национальные парламенты теряют значительную часть своего суверенитета, уступая власть бюрократическим кабинетам в Брюсселе. Выбор за нами — ратифицировать договор или прислушаться к евроскептикам."

 european_union.8.a: "Рождение Евро"
 european_union.8.d: "Сегодняшнее утро навсегда войдет в учебники истории. На всей территории Союза национальные валюты - франки, марки и лиры - уступают место евро. Это не просто смена денег, а триумф нашего политического и экономического единства. Логистическая операция по переходу на новую валюту стала беспрецедентной: в кратчайшие сроки по странам было распределено более 14.4 млрд банкнот и 52 млрд монет. Новая финансовая система объединила свыше 320 миллионов граждан, мгновенно сформировав единый рынок, генерирующий 18% мирового ВВП."
 european_union.8.c: "Отлично"
 
 european_union.9.a: "Дублинский совет"
 european_union.9.d: "Лидеры 12 стран ЕЭС в Дублине подвели итоги работы после доклада Делора и апрельской встречи. Главной темой стало создание Европейского союза и переход к экономическому и валютному союзу. Участники подтвердили курс на введение единой валюты и договорились начать подготовку межправительственных конференций по валютному и политическому союзу. Также обсуждались объединение Германии и изменения в Восточной Европе. Переговоры прошли успешно"
 european_union.9.c: "Неплохо"

 european_union.10.a: "Маастрихтский договор"
 european_union.10.d: "После месяцев напряжённых дискуссий представители государств Европейского сообщества достигли соглашения по ключевым вопросам будущей европейской интеграции. Несмотря на разногласия по поводу единой валюты, полномочий общеевропейских институтов и общей внешней политики, участникам переговоров удалось найти компромисс."
 european_union.10.c: "Европа готова к новому этапу интеграции"

 european_union.11.a: "Римский саммит"
 european_union.11.d: "В Риме лидеры Европейского сообщества официально закрепили курс на создание нового европейского порядка. После Маастрихтских переговоров государства готовы перейти от общих заявлений к подготовке договора, который объединит экономическую, валютную и политическую интеграцию в единую структуру."
 european_union.11.c: "Путь к Союзу открыт."