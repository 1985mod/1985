 EU_single_europ_evro_desc: "Мадридские соглашения запустили необратимый процесс интеграции. Отмена внутренних барьеров и подготовка к введению евро стимулируют мощный приток инвестиций и упрощают торговлю. Однако жесткие монетарные требования переходного периода ограничивают экономический суверенитет и связывают руки нашему правительству."
