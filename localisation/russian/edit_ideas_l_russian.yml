 CRO_struggle_for_independence_desc: "Когда рухнули скрепы югославской федерации, на карту была поставлена сама идея хорватской государственности. Вековое стремление к собственной стране, подавлявшееся десятилетиями унитарного централизма, вырвалось наружу в огне уличных баррикад Вуковара и осадах Дубровника. Эта война — не просто конфликт за территорию: это экзистенциальная битва народа, возродившего красно-белую шаховницу как символ своего права на жизнь."
