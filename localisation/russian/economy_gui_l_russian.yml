 Real_GDP_Tooltip:0 "§HРеальный ВВП§!\nОбщая стоимость всех товаров и услуг, произведенных в стране, скорректированная с учетом инфляции.\n\nНаш экономический выпуск напрямую привязан к промышленным мощностям. Каждая активная §Yгражданская фабрика§! приносит в экономику §G15.0 млрд $§!, в то время как каждый §Yвоенный завод§! и §Yверфь§! генерируют по §G10.0 млрд $§! соответственно.\n\n§HСтруктура ВВП:§!\nГражданское производство: [?civ_of_gdp|%0]\nВоенная промышленность: [?mil_of_gdp|%0]\nМорской сектор и верфи: [?naval_of_gdp|%0]"
 GDP_Per_Capita_Tooltip:0 "§HВВП на душу населения§!\nОпределяет §Yреальный экономический выпуск§! в пересчете на одного гражданина.\n\nБолее высокий §YВВП на душу населения§! расширяет налогооблагаемую базу и открывает доступ к более высоким §Gоптимальным налоговым ставкам§!, но при этом значительно увеличивает §Rрасходы на содержание госаппарата§! и другие государственные издержки.\n\nПо мере роста национального благосостояния §Yцелевой диапазон безработицы§! сужается и смещается вниз.\n\nПоддерживайте сбалансированную §Yденежно-кредитную политику§! и внимательно следите за экономическими показателями — иначе вы столкнетесь с массовыми §Rгражданскими беспорядками§!."
 Nominal_GDP_Tooltip:0 "§HНоминальный ВВП§!\nОбщая рыночная стоимость национальной экономики, измеряемая в текущих ценах.\n\n§HФормула расчета:§!\n§YНоминальный ВВП = Денежная масса × Скорость оборота денег§!\n\n§YДенежная масса:§! Общий объем валюты в обращении. Она §Gувеличивается за счет госрасходов§! и §Rсокращается за счет налогообложения§!.\n§YСкорость оборота денег:§! Скорость, с которой валюта переходит из рук в руки. Этот темп во многом диктуется §Yключевой процентной ставкой§!.\n\n§HМакроэкономическое влияние:§!\nНоминальный ВВП напрямую определяет §Yналоговую базу§! вашей страны.\n\nЕсли Номинальный ВВП поднимется слишком высоко относительно Реального ВВП, гарантирована §Rгиперинфляция§!.\nЕсли Номинальный ВВП упадет слишком низко относительно Реального ВВП, экономика скатится в §Rдефляцию§!.\n\n§WБалансируйте экономические весы: регулируйте процентные ставки, корректируйте расходы и меняйте налоги, когда это возможно.§!"
 GDP_Growth_Tooltip:0 "§HРост ВВП§!\nОтслеживает краткосрочную траекторию национальной экономики за последний квартал.\n\n§YЭкономическое здоровье:§! Чем быстрее растет ваша экономика, тем лучше... §HСпасибо, Капитан Очевидность!§!\n§YРиск перегрева:§! Слишком быстрый рост в сочетании с низкой §Yключевой процентной ставкой§! серьезно увеличивает опасность возникновения финансового пузыря.\n\n§RСледите за показателями, ужесточайте денежно-кредитную политику при необходимости и не допустите финансового краха, чтобы§! §Gmake your economy great again!§!"

