l_russian:
#решения
 IRA_conflict_category: "Ирландский кризис"
 IRA_conflict_category_desc: "Ирландская республиканская армия (ИРА) — военизированная группировка, добивающаяся выхода Северной Ирландии из состава Соединённого Королевства и присоединения к Ирландии. Эта организация угрожает территориальной целостности нашей страны и должна быть ликвидирована. Северная Ирландия была, есть и останется неотъемлемой частью нашего королевства."

 IRA_give_up_to_IRA: "Пойти на уступки ИРА"
 IRA_give_up_to_IRA_desc: "Затяжной конфликт истощил наши силы. Мы вынуждены признать, что военное решение невозможно. Единственный выход — убедить ирландское правительство повлиять на ИРА и предложить Северной Ирландии статус широкой автономии в составе королевства. Это трудный, но необходимый шаг к миру."

 IRA_military_operation: "Провести военную операцию в Ольстере"
 IRA_military_operation_desc: "Терпению британского правительства пришёл конец. Сепаратисты перешли все границы. Пришло время действовать жёстко и решительно. Мы бросим все силы на уничтожение террористической сети ИРА, где бы они ни прятались. Пусть нас осуждают — для нас важнее сохранить целостность королевства. Северная Ирландия — это навсегда часть Великобритании."

 IRA_peace_category: "Мирное урегулирование конфликта с ИРА"
 IRA_peace_category_desc: "Ирландия согласилась на мирное урегулирование конфликта в Северной Ирландии. Мы должны предложить им план действий для окончательного решения этой проблемы."

 IRA_offer_autonomy: "Предложить автономию Северной Ирландии"
 IRA_offer_autonomy_desc: "Мы предложим ирландскому правительству урегулировать конфликт с ИРА путём предоставления Северной Ирландии автономии в составе Соединённого Королевства. Это компромиссный шаг, который может удовлетворить обе стороны."

 IRA_demand_recognition: "Потребовать признания территориальной целостности"
 IRA_demand_recognition_desc: "Мы потребуем от ирландского правительства немедленно признать Северную Ирландию неотъемлемой частью нашего королевства. ИРА должна быть официально объявлена вне закона, а ирландские власти обязаны публично заявить, что Северная Ирландия — наша историческая земля."



 # Модификаторы
 northern_ireland_IRA_activity: "Деятельность ИРА"
 northern_ireland_autonomy: "Автономная Северная Ирландия"
 northern_ireland_IRA_activity_foreign: "Деятельность ИРА (оккупация)"
 
 # Глобальные флаги
 IRA_conflict_resolved: "Конфликт с ИРА урегулирован"

 # Фокусы
 IRA_end_of_IRA: "Конец ИРА"
 IRA_end_of_IRA_desc: "Фактически ИРА продолжает свою деятельность, но согласие ирландского правительства сотрудничать по этому вопросу гарантирует, что в скором времени организация прекратит своё существование."
 
 IRA_start_treaty: "Начать переговоры с Ирландией"
 IRA_start_treaty_desc: "ИРА и их террористическая организация — серьёзная угроза нашему контролю в регионе. Настало время действовать. У нас есть два пути: дипломатическое давление на Ирландию, чтобы она вынудила ИРА прекратить деятельность, либо полное военное подавление, даже если это противоречит нашим демократическим принципам."
 

 IRA_no_deal_was_reached: "Договор не достигнут"
 IRA_no_deal_was_reached_desc: "К сожалению, Ирландия отказалась сотрудничать в вопросе их же террористической организации. Что ж, если они не хотят решать проблему миром, мы уничтожим ИРА самостоятельно."
 
 IRA_war_with_ireland: "Война с Ирландией"
 IRA_war_with_ireland_desc: "Компромисс не был достигнут. Нам придётся полностью оккупировать Ирландию, чтобы интегрировать ирландский народ и окончательно подавить ИРА."
 
 IRA_British_triumph: "Британский триумф"
 IRA_British_triumph_desc: "Мы одержали полную победу в ирландском регионе. Это триумф нашей нации и нашего лидера — Маргарет Тэтчер. Солнце вновь воссияет над Британией, рано или поздно."
 
 IRA_British_shame: "Позор Британии"
 IRA_British_shame_desc: "Мы потерпели сокрушительное поражение в Ирландии. Это позор для всей нации и для нашего горе-лидера — Маргарет Тэтчер."
 
 IRA_we_losed_to_IRA: "Поражение от ИРА"
 IRA_we_losed_to_IRA_desc: "Позор. Мы проиграли каким-то террористам. Это унижение для всей нации."
 
 IRA_North_ireland_authonomy: "Североирландская автономия"
 IRA_North_ireland_authonomy_desc: "Нам удалось добиться автономии Северной Ирландии. Это не триумф, но достойная, умеренная победа для всей нации."
 
 IRA_inegrated_North_Ireland: "Интеграция Северной Ирландии"
 IRA_inegrated_North_Ireland_desc: "Ура! Нам удалось интегрировать Северную Ирландию. Это великая победа и достойное завершение этого непростого противостояния."

 # Эффекты
 IRA_conflict_decisions_unlocked: "Открывает блок решений по урегулированию конфликта в Северной Ирландии"
 IRA_peace_decisions_unlocked: "Открывает блок решений по интеграции Северной Ирландии"

#ивенты
 IRA_focus.1.t: "Великобритания предлагает сотрудничество по урегулированию конфликта с ИРА"
 IRA_focus.1.d: "Британское правительство направило нам официальное письмо с предложением прекратить противостояние с ИРА. Взамен они гарантируют безопасность и нерушимость наших текущих территориальных границ."
 IRA_focus.1.a: "Согласиться на сотрудничество"
 IRA_focus.1.b: "Отказаться от предложения"
 
 IRA_focus.2.t: "Великобритания просит предоставить автономию Северной Ирландии"
 IRA_focus.2.d: "Британское правительство морально разбито, но всё ещё держится. Теперь выбор за нами: помочь раненому тигру или оставить его умирать. Однако стоит помнить — если мы бросим его сейчас, позже это может обернуться против нас."
 IRA_focus.2.a: "Помогать хищнику — плохая идея"
 IRA_focus.2.b: "Поможем раненому тигру"
 
 ENG_North_ireland.1.t: "Ирландия согласилась на сотрудничество"
 ENG_North_ireland.1.d: "Ирландское правительство одобрило наше предложение о совместной работе по урегулированию деятельности ИРА."
 ENG_North_ireland.1.a: "Отлично!"
 
 ENG_North_ireland.2.t: "Ирландия отказалась от сотрудничества"
 ENG_North_ireland.2.d: "Ирландское правительство отклонило наше предложение о совместном урегулировании конфликта с ИРА. Будем действовать в одиночку."
 ENG_North_ireland.2.a: "Проклятье!"

