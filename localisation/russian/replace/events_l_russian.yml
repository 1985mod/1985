 soviet_union.66.desc: ""
 soviet_union.66.a: "Мы согласимся, сотрудничать - это хорошо."
 soviet_union.66.b: "Вежливо откажемся"
 soviet_union.67.t: "[FROM.GetNameDef] согласилась"
 soviet_union.67.desc: ""
 soviet_union.67.a: "Отлично!"
 soviet_union.68.t: "[FROM.GetNameDef] отказалась"
 soviet_union.68.desc: ""
 soviet_union.68.a: "Им же хуже."
