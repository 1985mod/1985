l_russian:
 MINIMIZE_EVENT: "§GЩёлкните§!, чтобы свернуть. Событие будет размещено в разделе §H«События и решения»§! области событий."
 usa.1.t: "Республиканцы победили!"
 usa.1.desc: "Неделю назад прошли выборы в США, и победила Республиканская партия США, во главе с Джорд Бушом Старшим."
 usa.1.a: "Ура!"
 usa.2.t: "Демократы победили!"
 usa.2.desc: "Неделю назад прошли выборы в США, и победила Демократическая партия США, во главе с Майклом Дудакисом."
 usa.2.a: "Ура!"
 usa.3.t: "Предложение Горбачёва"
 usa.3.d: ""
 usa.3.a: "Пожалуй, мы согласимся"
 usa.4.t: "Помощь от США"
 usa.4.d: ""
 usa.4.a: "Это уникальная возможность."
 usa.4.a.tt: "Мы получим 43 американских эсминца.\nКанада получит 7 американских эсминцев."
 usa.4.b: "Это предложение явно более выгодно для США, поэтому для нас оно неприемлемо."
 usa.5.t: "[FROM.GetNameDef] согласились"
 usa.5.d: "Несмотря на всю нашу подготовку и благие намерения, Великобритания отказалась принять старые эсминцы в обмен на военно-морские базы."
 usa.5.a: "Мы выигрываем в холодной войне!"
 usa.6.t: "[FROM.GetNameDef] отказались."
 usa.6.d: ""
 usa.6.a: "Им же хуже."
 usa.7.t: "США предлагает нам участвовать в операции «Буря в пустыне»"
 usa.7.d: ""
 usa.7.a: "Мы должны принять участие против иракской агрессии."
 usa.7.b: "Нам ещё нужны наши солдаты."
 usa.8.t: "[FROM.GetNameDef] Согласилась на участие в операции"
 usa.8.d: ""
 usa.8.a: "Ура!"
 usa.9.t: "[FROM.GetNameDef] Отказалась на участие в операции"
 usa.9.d: ""
 usa.9.a: "Ладно."
 usa.9.b: "Дьюи побеждает Рузвельта."
 usa.10.t: "Операция «Буря в пустыне»."
 usa.10.d: ""
 usa.10.a: "Пойдём освобождать Кувейт!"
 usa.10.b: "Америка готова к новому «Новому курсу»."
 usa.11.t: "Мальтийский саммит"
 usa.11.d: ""
 usa.11.a: "Посмотрим, что будет."
 usa.12.t: "Экономический кризис настигает"
 usa.12.d: ""
 usa.12.a: "Это очень плохо.."
 usa.13.t: "Победа Билла Клинтона на выборах 1992 года"
 usa.13.desc: "Билл Клинтон, губернатор штата, который никто не воспринимал всерьёз, совершил невозможное. Он разгромил действующего президента Буша, превратив выборы в референдум о будущем Америки. Его кампания строилась на простой, как кирпич, истине: «Это экономика, идиот!». Страна устала от внешних войн и бюджетных дефицитов - люди хотят рабочих мест, доступной медицины и мира."
 usa.13.a: "Одна эра завершилась, началась другая."
 usa.14.t: "Рональд Рейган предлагает провести встречу."
 usa.14.d: ""
 usa.14.a: "Мы согласимся."
 usa.14.b: "Никаких разговоров с капиталистами."
 usa.15.t: "Доктрина Рональда Рейгана"
 usa.15.d: ""
 usa.15.a: "Ура!"
 usa.16.t: "СССР согласен подписать CHB - I"
 usa.16.d: ""
 usa.16.a: "Очень хорошо."
 usa.17.t: "Утверждение Томаса Кларенсеном помощником судьи"
 usa.17.d: ""
 usa.17.a: "Это хорошо."
 usa.18.t: "Встреча с Ельцином"
 usa.18.d: ""
 usa.18.a: "Ура!"
 usa.19.t: "Запись благотворительного сингла «We Are the World» «USA for Africa»"
 usa.19.d: "28 января 1985 года. В студии A&M в Лос-Анджелесе, сразу после церемонии American Music Awards, собралось более 45 величайших музыкальных звёзд Америки. Майкл Джексон и Лайонел Ричи написали песню, а Куинси Джонс взялся продюсировать этот амбициозный проект. Цель - сбор средств для борьбы с голодом в Эфиопии, где свирепствует страшный голод."
 usa.19.a: "Мы - это мир."
 usa.20.t: "Убийство Энрике Камарена"
 usa.20.d: ""
 usa.20.a: "Печально."
 usa.21.t: "Авария авианосца USS Coral Sea"
 usa.21.d: "Авианосец ВМС США USS Coral Sea (CV-43), возвращаясь после масштабного ремонта стоимостью 200 миллионов долларов, столкнулся с эквадорским танкером «Напо» во время учений в Карибском море, недалеко от американской базы в Гуантанамо, Куба. Инцидент произошел в ясную погоду при видимости в 11 километров."
 usa.21.a: "Это была ошибка гражданского судна. Наш флот не виноват."
 usa.22.t: "41 Торнадо пронеслось над США"
 usa.22.d: ""
 usa.22.a: "О боже..."
 usa.23.t: "Лос‑Анджелес Лейкерс» выигрывают чемпионат NBA"
 usa.23.d: ""
 usa.23.a: "Ура!"
 usa.24.t: "В США выходит игровая приставка NES"
 usa.24.d: ""
 usa.24.a: "Ура!"
 usa.25.t: "Сенат США разрешает телевизионную трансляцию своих дебатов"
 usa.25.d: ""
 usa.25.a: "Хорошо."
 usa.26.t: ""
 usa.26.d: ""
 usa.26.a: ""
 usa.27.t: "Рональд Рейган проходит операцию на предстательной железе"
 usa.27.d: ""
 usa.27.a: "Надеемся, всё будет хорошо"
 usa.28.t: "Иракские «Экзосеты» поражают эсминец USS Stark"
 usa.28.d: ""
 usa.28.a: "Они за это поплатятся"
 usa.29.t: "«Черный понедельник»: мировой фондовый крах"
 usa.29.d: ""
 usa.29.a: "Только не это..."
 usa.30.t: "США предлагает торговый договор"
 usa.30.d: ""
 usa.30.a: "Мы соглашаемся"
 usa.30.b: "Мы пожалуй откажемся"
 usa.31.t: "[FROM.GetNameDef] согласилась"
 usa.31.d: ""
 usa.31.a: "Ура!"
 usa.32.t: "[FROM.GetNameDef] отказалась"
 usa.32.d: ""
 usa.32.a: "Им же хуже."
 usa.33.t: "[FROM.GetNameDef] предлагает нам экономическую помощь"
 usa.33.d: ""
 usa.33.a: "Мы соглашаемся"
 usa.33.b: "Мы пожалуй откажемся"
 usa.34.t: "[FROM.GetNameDef] согласился"
 usa.34.d: ""
 usa.34.a: "Да здравствует американско-советские отношения!"
 subtract_5_billion_to_treasury_tt: "У нас отнимется §G5 миллиардов долларов§! c §Y[Root.GetAdjective]ой§! казны"
 add_5_billion_to_treasury_tt: "Добавится §G5 миллиарда долларов§! в §Y[Root.GetAdjective]ую§! казну"
 usa.35.t: "[FROM.GetNameDef] отказался"
 usa.35.d: ""
 usa.35.a: "Им же хуже."
 usa.36.t: "На бюджетном саммите"
 usa.36.d: "Им же хуже."
 usa.36.a: "Очень хорошо."
 add_2_billion_to_treasury_tt: "Добавится §G2 миллиарда долларов§! в §Y[Root.GetAdjective]ую§! казну"
 usa.37.t: "США предлагает подписать CHB - I"
 usa.37.d: "Из Вашингтона прибыла правительственная делегация с неожиданным и амбициозным проектом соглашения, получившим кодовое обозначение CHB - I. Американская сторона предлагает зафиксировать текущий баланс сил и установить жесткие рамки для стратегического сотрудничества и контроля вооружений. \n\nВ Наркомате иностранных дел разгорелись бурные споры. Сторонники соглашения утверждают, что подписание договора CHB - I разрядит международную обстановку, даст передышку нашей промышленности и откроет доступ к ценным технологиям. Однако скептики предупреждают: это может оказаться хитрой дипломатической ловушкой капиталистов, призванной связать руки Советскому Союзу перед грядущей бурей. Окончательное решение остается за Кремлем."
 usa.37.a: "Хорошо, мы подпишем."
 usa.37.b: "Ни за что!"
 usa.38.t: "СССР отказался"
 usa.38.d: ""
 usa.38.a: "Им же хуже, новая гонка."
 usa.38.b: ""
 usa.39.t: "СССР согласился на встречу"
 usa.39.d: ""
 usa.39.a: "Здравствуйте, мистер Горбачёв."
 usa.40.t: "СССР официально отказался от встречи."
 usa.40.d: ""
 usa.40.a: "Это эскалация холодной войны!"
 usa.41.t: "Экономическая помощь от США"
 usa.41.d: "В рамках новой внешнеполитической доктрины Вашингтона наше правительство получило официальное предложение от Государственного департамента США. Американская администрация готова включить нашу страну в масштабную программу финансовой и технической помощи. Нам предлагают крупные долларовые гранты на развитие инфраструктуры, льготные кредиты для бизнеса и поставки передового оборудования. Оппозиция предупреждает о риске потери экономического суверенитета, но министерство финансов настаивает: эти деньги спасут наш бюджет."
 usa.41.a: "Спасибо, Америка!"
 usa.41.b: "Никаких связей с Америкой!"
 usa.42.t: "Предложение о взаимной помощи от США"
 usa.42.d: "В канцелярию главы нашего государства прибыла высокопоставленная делегация из Вашингтона с официальным предложением о заключении Договора о взаимной помощи. Американцы предлагают нам беспрецедентный пакет поддержки: прямые поставки тяжелого вооружения, гранты для модернизации портов и аэродромов, а также доступ к новейшим военным доктринам. Однако у этого пакта есть своя цена. Белый дом требует предоставить американским вооруженным силам права на транзит войск, дозаправку флота и организацию постоянных баз на нашей территории. Генералитет видит в этом уникальный шанс усилить армию, но дипломаты предупреждают - это окончательно привяжет наш внешнеполитический курс к воле Вашингтона."
 usa.42.a: "Мы определенно согласны."
 usa.42.b: "Ни за что! Америка отстой."
 usa.43.t: "Иран принял наше предложение"
 usa.43.d: ""
 usa.43.a: "Хорошо."
 usa.44.t: "Иран отказал"
 usa.44.d: ""
 usa.44.a: "Им же хуже."
 usa.45.t: "США проводит бомбардировки на нашей территории!"
 usa.45.d: ""
 usa.45.a: "Это незаконно! объявим дип. протест."
 usa.46.t: "США предлагает провести учения"
 usa.46.d: "Вашингтон официально запросил у нашего правительства разрешение и логистическую поддержку для проведения крупнейших военных маневров десятилетия - «Reforger-88». США планируют оперативно перебросить через океан стотысячную группировку войск для отработки сценария тотальной войны против Варшавского договора. Наш генеральный штаб поддерживает эту инициативу. Однако министерство иностранных дел предупреждает: танки на наших улицах спровоцируют жесткий ответ Москвы. В обществе нарастает паника, пацифисты уже выходят на марши протеста. Каково наше решение?"
 usa.46.a: "Мы согласны. в наше время это необходимо."
 usa.46.b: "Пожалуй, мы откажемся"
 usa.47.t: "США предлагает нам подписать РСМД"
 usa.47.d: "Из Вашингтона по официальным каналам связи поступил финальный проект Договора о РСМД. Администрация Рональда Рейгана предлагает беспрецедентный шаг: полностью ликвидировать целый класс ядерного оружия. Однако условия США крайне жесткие. Они требуют не просто паритетного сокращения, что заставит нас утилизировать почти в два раза больше ракет, чем уничтожат американцы. В Политбюро раскол. Экономисты настаивают, что это единственный шанс остановить гонку вооружений и спасти бюджет Перестройки. Военные во главе с Генштабом заявляют, что согласие на американские условия - это одностороннее разоружение и предательство национальных интересов. Наш ответ определит судьбу социалистического блока..."
 usa.47.a: "Мы определенно согласны."
 usa.47.b: "Никаких сделок с капиталистами!"
 usa.48.t: "СССР согласился на подписание РСМД"
 usa.48.d: "Невероятные новости из Кремля! Михаил Горбачёв официально принял наш «двойной нулевой вариант». Советский Союз соглашается полностью ликвидировать не только свои ракеты средней дальности СС-20, но и комплексы меньшей дальности, включая новейшую систему «Ока», которая формально даже не подпадала под ограничения. По условиям соглашения, СССР уничтожит почти в два раза больше ракетного арсенала, чем Соединенные Штаты. Это безоговорочный триумф нашей стратегии «Мир через силу»."
 usa.48.a: "Отлично, всё идет по плану!"
 usa.49.t: "СССР отказался от подписания РСМД"
 usa.49.d: "Худшие опасения Пентагона и ЦРУ подтвердились: Михаил Горбачёв в последний момент денонсировал проект соглашения и отказался подписывать Договор о РСМД. Советская делегация заявила, что требования США о ликвидации новейших комплексов «Ока» и тотальном инспекционном контроле ущемляют суверенитет и безопасность СССР. Процесс разрядки официально мертв. Советские «Пионеры» (СС-20) остаются на боевом дежурстве, нацеленные на столицы Западной Европы. Общественность НАТО в панике, а ястребы в Сенате требуют немедленного и жесткого ответа от президента Рейгана»."
 usa.49.a: "Ну и фиг с ними!"
 usa.50.t: "РСМД вступил в силу"
 usa.50.d: "Сегодня в Москве Михаил Горбачёв и Рональд Рейган обменялись ратификационными грамотами. Исторический договор официально вступил в силу. По всей стране, от Капустина Яра до Сарыозека, начинается контролируемое уничтожение ракет средней и меньшей дальности. Для Советского Союза это шаг к «Новому политическому мышлению» и разрядке, но часть генералитета в Ставке выражает глубокую озабоченность ослаблением ядерного щита в Европе..."
 usa.50.a: "Отлично!"
 usa.51.t: "Второй срок Буша"
 usa.51.desc: "Вопреки прогнозам социологов и сильному недовольству избирателей из-за экономического застоя, Джордж Буш-старший смог переломить ход предвыборной гонки в конце 1992 года.\n\nОпыт во внешней политике и образ надежного лидера помогли ему победить Билла Клинтона. Америка остается под управлением Республиканской партии.\n\nХолодная война завершена, но страну ждут старые проблемы. Безработица растет, бюджетный дефицит пугает конгресс, а мир вокруг продолжает меняться. Президенту придется принять сложные решения, чтобы сохранить статус США как мировой сверхдержавы."
 usa.51.a: "Республиканцы. Ещё четыре года!"
 usa.52.t: "Устанавливать ли демилитаризованную зону?"
 usa.52.desc: "После сокрушительного успеха операции «Буря в пустыне» режим Саддама Хусейна пошел на попятную, но угроза региональной стабильности на Ближнем Востоке сохраняется. В Белом доме разгорелись ожесточенные споры о том, как закрепить победу.\n\nСоветники предлагают учредить постоянную демилитаризованную зону (ДМЗ) вдоль границ Ирака, чтобы полностью лишить Багдад возможности атаковать соседей." 
 usa.52.a: "Это определённо нужно сделать, даже не обсуждается."
 usa.52.b: "Лучше не надо, это приведёт к эскалации конфликта."
 usa.53.t: "Вопрос бесполётной зоны"
 usa.53.desc: "Несмотря на завершение активных боевых действий, ситуация внутри Ирака остается критической. Режим Саддама Хусейна начал жестоко подавлять внутренние восстания, используя против мятежников штурмовую авиацию и боевые вертолеты.\n\nВ Совете национальной безопасности США мнения разделились. Гуманитарные организации и союзники требуют немедленно ввести режим бесполетной зоны, чтобы защитить гражданское население и ослабить диктатуру Багдада. С другой стороны, патрулирование иракского неба силами ВВС США на постоянной основе - это прямая угроза жизням американских пилотов и колоссальная нагрузка на оборонный бюджет." 
 usa.53.a: "Установим."
 usa.53.b: "Откажемся от этого."
 usa.54.t: "Признание поражения в Ираке"
 usa.54.desc: "То, что задумывалось как демонстрация американской военной мощи и утверждение Нового мирового порядка, обернулось геополитическим кошмаром. Затяжное патрулирование, постоянные стычки в воздухе и неэффективность санкций привели к истощению ресурсов. Финальной каплей стали скоординированные удары Ирака по базам союзников и несколько сбитых американских самолетов, на которые у нас не нашлось решительного ответа из-за жесткого давления конгресса и протестов внутри страны."
 usa.54.a: "Позор..."
 usa.55.t: "Обращение Джорджа Буша"
 usa.55.desc: "Сегодня президент Джордж Буш-старший выступил с обращением к нации, фактически признав, что США сворачивают свое военное присутствие в регионе и снимают блокаду. Саддам Хусейн празднует триумф, а наши союзники на Ближнем Востоке чувствуют себя преданными. Мы капитулировали перед обстоятельствами, и это колоссальный удар по престижу единственной сверхдержавы."
 usa.55.a: "Это катастрофа..."
 usa.56.t: "Массовые протесты"
 usa.56.desc: "Падение Бонна и Брюсселя, крах Западной Германии и позорное Копенгагское перемирие повергли американское общество в шок. Администрация [USA.GetLeader]а оказалось под шквалом уничтожающей критики: пока советские танки [SOV.GetLeader]а перекраивали карту Европы и брали реванш в Корее, Белый дом не решился применить ядерное оружие и фактически сдал союзников по НАТО.\n\nСегодня улицы Вашингтона, Нью-Йорка и Чикаго заполнили миллионы протестующих. Левые радикалы требуют немедленной демилитаризации и прекращения «империалистических авантюр», в то время как правые ястребы и националисты обвиняют наше правительство в национальном предательстве и трусости. Экономику лихорадит из-за потери европейских рынков, а в воздухе пахнет новой гражданской войной. Нация расколота, и статус США как сверхдержавы висит на волоске."
 usa.56.a: "Нужно что-то делать!"
 usa.57.t: "Коммунизм набирает популярность"
 usa.57.desc: "Успехи СССР в Третьей мировой войне разрушили миф о непобедимости капитализма. На фоне жесточайшего экономического кризиса и предательства европейских союзников, американское рабочее движение переживает беспрецедентный подъем. Коммунистическая партия США (CPUSA), годами находившаяся в подполье и маргинализации, внезапно стала главной силой на улицах.\nРабочие захватывают заводы в Детройте, докеры Окленда отказываются грузить военные корабли, а в Чикаго многотысячные марши проходят под красными знаменами и портретами Ленина. Лозунг протестующих прост: «СССР смог накормить и защитить своих, а [USA.GetLeader] защищает только банкиров!» Разочарованные ветераны Корейской войны массово вступают в отряды «Красной гвардии». Мы теряем контроль над целыми штатами."
 usa.57.a: "Только не это!"
 usa.58.t: "Забастовки среднего класса"
 usa.58.desc: "Если протесты пролетариата и радикалов в США были ожидаемы, то забастовка среднего класса нанесла нашей администрации сокрушительный удар в спину. Обесценивание доллара, заморозка банковских вкладов для нужд ВПК и потеря европейского рынка привели к массовому банкротству мелкого бизнеса. Офисные клерки, банковские служащие, инженеры, учителя и врачи внезапно осознали, что их «Американская мечта» мертва."
 usa.58.a: "Тяжело..."
 usa.59.t: "Недовольство народа растёт"
 usa.59.desc: "Ситуация в Соединенных Штатах полностью вышла из-под контроля нашего контроля. Ни жесткие полицейские меры, ни попытки заигрывания с профсоюзами и средним классом не смогли остановить лавину. Очереди за хлебом, пустые полки магазинов и похоронки из Кореи окончательно похоронили веру граждан в свое правительство. Протесты переросли в общенациональный бунт."
 usa.59.a: "Плохо."
 usa.60.t: "Отделение Калифорнии"
 usa.60.desc: "Официальное признание независимости Штата Калифорния запустило необратимый процесс распада Соединенных Штатов Америки. Глядя на то, как Сакраменто безнаказанно забирает себе тихоокеанское побережье, другие штаты поспешили последовать этому примеру. Федеральный центр в Вашингтоне больше не воспринимается как легитимная власть - для губернаторов и местных элит наступило время спасать собственные шкуры и капиталы."
 usa.60.a: "Нет!"
 usa.61.t: "Техас отделяется"
 usa.61.desc: "Последний и самый мощный бастион консервативной Америки пал под тяжестью хаоса. Увидев, что Вашингтон сдался левым радикалам, а Калифорния безнаказанно забрала себе западное побережье, губернатор и законодательное собрание Техаса пошли на крайний шаг. Ссылаясь на нарушение федеральным центром Конституции и неспособность защитить частную собственность, Остин официально провозгласил восстановление независимой Республики Техас.\n\nМестные нефтяные магнаты, правые политики и командование Нацгвардии мгновенно заблокировали границы штата. Все федеральные военные базы, включая Форт-Худ и важнейшие нефтеперерабатывающие заводы Хьюстона, перешли под контроль техасских властей. Хуже того, армейские части, бежавшие из зоны беспорядков на Севере, массово стекаются под знамя «Одинокой звезды». Техас не просто отделяется - он открыто заявляет, что станет базой для будущего крестового похода против «красной заразы» в Вашингтоне."
 usa.61.a: "Не будем вторгаться, это эскалирует обстановку в Америке."
 usa.62.t: "Отделение запада"
 usa.62.desc: "Цепная реакция, запущенная сецессией Калифорнии и Техаса, окончательно разорвала нас. Осознав, что Вашингтон больше не способен проецировать власть за пределами Миссисипи, а на Восточном побережье вот-вот утвердится коммунистическая диктатура, штаты Дикого Запада и Скалистых гор начали массово спасаться от неминуемой катастрофы. Центральное правительство потеряло контроль над миллионами квадратных километров территории.\n\nНа суровом Северо-Западе лесорубы, экологи и портовые рабочие Сиэтла и Портленда объединились с местными либеральными элитами, провозгласив независимую Республику Каскадия - оплот социал-демократии, стремящийся укрыться от мировой войны за канадской границей. Южнее, в Солт-Лейк-Сити, верхушка Церкви Иисуса Христа Святых последних дней взяла власть в свои руки: Невада и Юта объединились в теократическую Республику Юта, объявив о создании «земли порядка и веры среди красного хаоса».\n\nНа юге же, вдоль мексиканской границы, политический ландшафт оказался иным. В Федерации Аризоны и Нью-Мексико власть перешла в руки умеренных либералов и бежавших из Вашингтона классических демократов. Исторически верные идеалам свободы и конституционных прав, они отказались признавать как правый радикализм Техаса, так и наступающий с востока коммунизм. Местные либеральные элиты спешно формируют коалицию, пытаясь построить на Юго-Западе островок «истинной американской демократии и капитализма», однако им катастрофически не хватает тяжелого вооружения для защиты своих длинных и уязвимых границ. Защищать рубежи на Западе больше некому - федеральный фронт рухнул."
 usa.62.a: "Всё плохо..."
 usa.63.t: "Отделение юга"
 usa.63.desc: "Пока Западная Америка дробилась на изолированные республики, Диксиленд погрузился в собственный, глубокий хаос. Идеологический раскол и неспособность Белого дома сдержать коммунистический марш на Вашингтон окончательно разрушили южные штаты. Огромный и некогда монолитный регион раскололся на враждующие фракции, каждая из которых видит будущее Юга по-своему.\n\nВ Ричмонде правые ястребы, радикальные консерваторы и ветераны Вьетнама и Кореи подняли старое знамя конфедератов, провозгласив создание Конфедеративных Штатов Америки (КША). Во главе встал подполковник Оливер Норт - харизматичный офицер, известный своей жесткой антикоммунистической позицией, который сразу же объявил тотальную мобилизацию для «крестового похода против Вашингтона и советской угрозы». Однако южного единства не случилось. В Литл-Роке молодой и амбициозный губернатор Билл Клинтон объявил об отделении Штата Арканзас, осудив радикализм Норта и попытавшись сохранить центристскую, умеренно-либеральную платформу. Южнее, в Батон-Руже, харизматичный реформатор Бадди Рёмер провозгласил независимость Луизианы, заблокировав устье Миссисипи ради защиты местной экономики от разорения. Наконец, на самом юго-востоке губернатор Боб Мартинес вывел Флориду из состава Союза, объявив полуостров «зоной демократического порядка», и спешно стягивает силы Нацгвардии к Майами, чтобы спасти штат от анархии. Единый Юг мертв, и вместо него вспыхнул пороховой погреб."
 usa.63.a: "Терпимо..."
 usa.64.t: "Отделение севера"
 usa.64.desc: "Последний оплот старой Федеративной Республики прекратил свое существование. С потерей Юга и параличом власти в Вашингтоне, Северо-Восток США - финансовое, промышленное и историческое ядро нации - оказался в полной изоляции. На фоне непрекращающихся забастовок рабочих «Ржавого пояса» и паники на биржах, местные политические и финансовые элиты решили разорвать узы с тонущим Белым домом, чтобы спасти свои штаты от неминуемой анархии и надвигающейся волны коммунизма.\n\nВ Олбани мэр Нью-Йорка и губернатор штата, опираясь на поддержку Уолл-стрит и остатки лояльной полиции, провозгласили независимость Штата Нью-Йорк. Крупнейший финансовый центр планеты забаррикадировался, объявил чрезвычайное экономическое положение и спешно нанимает частные военные компании для охраны банковских хранилищ от голодных бунтов. Одновременно с этим шесть штатов к востоку от Гудзона - Мэн, Вермонт, Нью-Гэмпшир, Массачусетс, Коннектикут и Род-Айленд - объединились, провозгласив создание суверенной Республики Новой Англии. Возглавившие её умеренные либералы и консерваторы объявили Новую Англию «законным правопреемником американских идеалов свободы». Они уже открыли границы для канадских войск и запрашивают у Оттавы и уцелевших остатков НАТО статус протектората. Наша администрация окончательно теряет контроль над Атлантическим побережьем."
 usa.64.a: "Возможно, вынужденный союз будет стоить того..?"
 usa.65.t: "Появление Великих Озёр"
 usa.65.desc: "Территориальный коллапс нашей страны достиг своего апогея, разорвав центральную часть. Оставшиеся без связи с Вашингтоном внутренние штаты и мощное индустриальное ядро вокруг Великих Озёр выбрали диаметрально противоположные пути спасения. Америка окончательно перестала существовать как единый массив суши.\n\nНа бескрайних просторах Дикого Запада и Великих равнин - в штатах Колорадо, Монтана, Вайоминг, Северная Дакота, Южная Дакота, Небраска, Канзас и Оклахома - военные базы Космического командования (AFSPC) и Стратегической авиации ВВС объединились под жестким контролем Пентагона. Четырехзвездный генерал Джон Пиотровски объявил о создании хунты под названием «Северное Военное Командование». Заперев под замок сотни пусковых ядерных шахт Минитмен, Пиотровски ввел тотальную милитаризацию и жесткую цензуру, пообещав расстреливать любого забастовщика и дезертира.\n\nВ это же время в самом промышленном сердце Америки вспыхнуло пламя, которое так долго раздувал Кремль. Отрезанный от южной нефти и западного сырья рабочий класс Иллинойса, Мичигана, Миннесоты и Висконсина и также других штатов подняли общее восстание. Профсоюзы и ячейки CPUSA провозгласили создание Демократического Союза Великих Озёр. Во главе нового социалистического государства встал многолетний лидер американских коммунистов Гэс Холл. Под его руководством «Ржавый пояс» мгновенно превратился в «Красный пояс»: заводы Детройта и сталелитейные комбинаты Гэри переходят на выпуск бронетехники для пролетариата, а сам Холл уже координирует свои действия напрямую с главой СССР. Мы потеряли свои главные заводы и арсеналы."
 usa.65.a: "Коммунизм пришёл в Америку..."
 ddr.1.t: "XI съезд СЕПГ"
 ddr.1.desc: "В Берлине, в огромном зале Дворца Республики, собираются тысячи делегатов со всей Германии. XI съезд СЕПГ проходит под знаком исторических свершений. Партия подводит итоги десятилетки, отмечая небывалый рост промышленности и укрепление обороноспособности страны.\nЦентральный доклад, зачитанный Генеральным секретарем, утверждает, что Германская Демократическая Республика окончательно встала на путь построения развитого социалистического общества. В новой партийной программе подчеркивается необходимость дальнейшего ужесточения партийных рядов, борьбы с буржуазной идеологией и усиления роли государства в экономике. Съезд проходит в едином порыве, без единой оговорки."
 ddr.1.a: "Ура!"
 ddr.2.t: "Визит Хонеккера в Бонн"
 ddr.2.desc: "Впервые в истории председатель Государственного совета ГДР ступает на землю Западной Германии с официальным визитом. Эрих Хонеккер встречается с федеральным канцлером ФРГ в окружении журналистов и дипломатов со всего мира. Протокол соблюден до мелочей: военный оркестр, поднятие флагов, улыбки для прессы."
 ddr.2.a: "Да здравствует ФРГ!"
 ddr.3.t: "Объединение с несогласными"
 ddr.3.desc: "В огромном зале, где раньше звучали только одобрительные овации в адрес Политбюро, теперь сидят диссиденты, интеллигенция и партийные функционеры. Обсуждается будущее нации: многопартийность, рыночные элементы в экономике и судьба Штази. Это не капитуляция, это попытка спасти государство, дав ему глоток свежего воздуха. Немцы впервые за долгие годы говорят друг с другом не через колючую проволоку, а лицом к лицу."
 ddr.3.a: "Мы проведём широкие реформы"
 ddr.3.b: "Жесткое подавление - никаких уступок"
 ddr.4.t: "Фальсификация выборов"
 ddr.4.desc: "Местные выборы в округах ГДР прошли с «рекордной явкой» и подавляющим большинством голосов за кандидатов Национального фронта. Однако уже на следующий день по городу поползли слухи - независимые наблюдатели и западные СМИ заявляют о массовых вбросах, подтасовке протоколов и запугивании избирателей. Внутри самой СЕПГ разгорается скандал: несколько членов партии требуют пересчета голосов, а профсоюзы угрожают забастовками."
 ddr.4.a: "Во всём виноват запад!"
 ddr.5.t: "Заговор"
 ddr.5.desc: "В стенах старого здания ЦК СЕПГ пахнет серой. В последние недели Генеральный секретарь замечает, что его привычные указания исполняются с задержкой, а некоторые члены Политбюро слишком часто собираются на «неформальные обеды» без его ведома. Агенты Штази докладывают о тайных контактах между несколькими высокопоставленными партийцами и представителями военного командования."
 ddr.5.a: "Ясно."
 ddr.6.t: "Правительство Модрова"
 ddr.6.desc: "После отставки Хонеккера и короткого правления Кренца партия оказалась в глубочайшем кризисе. Улицы требуют перемен, экономика трещит по швам, а Москва под руководством Горбачёва отказывается от прежней поддержки. В этих условиях Политбюро выдвигает на пост премьер-министра Ханса Модрова - человека с репутацией прагматика и сторонника диалога."
 ddr.6.a: "Курс на объединение с ФРГ"
 ddr.7.t: "Свободные выборы в ГДР"
 ddr.7.desc: "Впервые за сорок лет жители Германской Демократической Республики идут на избирательные участки, чтобы сделать действительно свободный выбор. В предвыборной гонке участвуют десятки партий - от посткоммунистической ПДС до либералов и зелёных. Главная интрига: смогут ли реформированные социалисты удержать власть, или народ проголосует за немедленное объединение с ФРГ?"
 ddr.7.a: "Победу одержал альянс ХДС"
 ddr.8.t: "Приказ 101: Не стрелять"
 ddr.8.desc: "Ночь с 9 на 10 ноября 1989 года. Берлинская стена, олицетворяющая раскол Германии, становится эпицентром драмы. На КПП «Борнхольмер-штрассе» и других переходах собираются десятки тысяч людей, требующих свободного выезда. Пограничники растеряны - их инструкции предписывают открывать огонь при попытке прорыва, но политбюро только что передало по закрытым каналам неоднозначный «Приказ 101»."
 ddr.8.a: "Отменить приказ о стрельбе полностью."
 ddr.9.t: "Геронтократия в СЕПГ"
 ddr.9.desc: "Внутри СЕПГ уже несколько лет зреет тихое недовольство. Руководство партии состоит из людей, средний возраст которых перевалил за семьдесят. Они помнят ещё войну, сталинизм, возведение стены, но совершенно не понимают новых веяний - компьютеризации, экологических движений, запросов молодёжи. На последнем заседании Политбюро один из секретарей по идеологии, которому уже за восемьдесят, заснул прямо во время доклада о перестройке."
 ddr.9.a: "Сохраним статус-кво"
 ddr.9.b: "Омолодим нашу партию, вперед за СЕПГ!"
 ddr.10.t: "Отставка Эриха Хонеккера"
 ddr.10.desc: "Улицы восточногерманских городов гудят уже несколько недель - десятки тысяч людей требуют перемен, свободы слова и права на выезд. Эрих Хонеккер, бессменный лидер ГДР на протяжении почти двадцати лет, выглядит сломленным. Ему 77 лет, он болен, устал и потерял главного союзника - Михаила Горбачёва, который открыто заявил, что Москва не будет «защищать тех, кто против перестройки»."
 ddr.10.a: "Почётная отставка - передача власти Крензу"
 ddr.11.t: "Социализм на грани банкротства"
 ddr.11.desc: "Восточногерманская экономика трещит по швам. Внешний долг страны перевалил за 20 миллиардов западногерманских марок, а процентные выплаты съедают почти весь экспортный потенциал. Заводы работают на три четверти мощности, многие убыточные предприятия держатся только на государственных субсидиях. В магазинах пустые полки: масло, мясо, кофе и цитрусовые исчезли из свободной продажи."
 ddr.11.a: "Централизованное затягивание поясов - плановая автаркия"
 ddr.12.t: "Поставки МиГ-29"
 ddr.12.desc: "На военные аэродромы Восточной Германии начинают прибывать новейшие советские истребители МиГ-29 - машины четвёртого поколения, которые по своим лётным характеристикам превосходят большую часть парка НАТО. Национальная народная армия ГДР получает более двадцати единиц этих грозных машин - «ласточек», способных патрулировать воздушное пространство и участвовать в учениях на равных с любым западным противником."
 ddr.12.a: "Принять полную партию - укрепим наши ВВС!"
 ddr.13.t: "Независимая ГДР"
 ddr.13.desc: "Сентябрь 1990 года войдет в историю как момент окончательного краха восточного блока. В условиях стремительного объединения Германии и краха коммунистического режима руководство в Восточном Берлине официально объявило о выходе Германской Демократической Республики из Организации Варшавского договора. \nЭтот шаг, согласованный в рамках договоренностей «Два плюс четыре», знаменует собой фактическую ликвидацию восточногерманской армии (ННА) и конец четырех десятилетий военного присутствия Москвы в сердце Европы. Советские войска готовятся к эвакуации, а западногерманские структуры уже принимают контроль над границами. Знамена Восточного блока спущены - берега Эльбы больше не разделяют две непримиримые системы."
 ddr.13.a: "За независимую нашу Германию!"
 ddr.14.t: "ГДР вышла из Варшавского Договора"
 ddr.14.desc: "Сентябрь 1990 года войдет в историю как момент окончательного краха восточного блока. В условиях стремительного объединения Германии и краха коммунистического режима руководство в Восточном Берлине официально объявило о выходе Германской Демократической Республики из Организации Варшавского договора. \nЭтот шаг, согласованный в рамках договоренностей «Два плюс четыре», знаменует собой фактическую ликвидацию восточногерманской армии (ННА) и конец четырех десятилетий военного присутствия Москвы в сердце Европы. Советские войска готовятся к эвакуации, а западногерманские структуры уже принимают контроль над границами. Знамена Восточного блока спущены - берега Эльбы больше не разделяют две непримиримые системы."
 ddr.14.a: "Всё разрушилось..."
 wgr.1.t: "Курс ФРГ"
 wgr.1.desc: "1985 год стал для ФРГ годом переломных партийных решений, неожиданных триумфов и болезненных поражений. На сцене - три главные политические силы, каждая из которых переживала свою драму."
 wgr.1.a: "ХДС - наш выбор!"
 wgr.1.b: "СДПГ - за независимую Германию!"
 wgr.1.c: "СВДП - за свободу!"
 wgr.2.t: "Определение экономического курса"
 wgr.2.desc: "1985 год стал для ФРГ годом жесткого выбора экономической стратегии. Правительство Коля и Бундесбанк оказались перед дилеммой: продолжать ли политику бюджетной сдержанности, принесшую рекордный торговый профицит и низкую инфляцию, или же поддаться давлению союзников и запустить масштабные стимулы для внутреннего спроса?"
 wgr.2.a: "Предоставим мигрантам хоть что-нибудь."
 wgr.2.b: "Германия превыше всего!"
 wgr.3.t: "Эпоха напряжения"
 wgr.3.desc: "В 1985 году Западная Германия была не просто европейской страной, а главным полем битвы между блоками. Здесь, на линии разлома, каждый жест имел вес.\n\nПриход Горбачёва в Кремль в марте обещал перемены, но не снял старого напряжения. Москва по-прежнему считала Бонн агрессивным. А летом разразился дипломатический скандал - немецкие молодёжные делегации покинули фестиваль в Москве из-за унизительного обращения с Западным Берлином.\n\nНо настоящий шок случился 19 августа: глава контрразведки ФРГ перебежал в ГДР. Это был не просто предательство, а удар по всей системе безопасности Запада. И на этом фоне - каждодневная игра с Восточным Берлином: обмен шпионами, пропуск беженцев, политическое манипулирование.\n\nФРГ 1985 года жила под колпаком холодной войны. Союзники давили, Восток угрожал, а страна училась выживать в этом напряжении - и находить свой путь."
 wgr.3.a: "Мы обязаны выстоять."
 wgr.4.t: "Германия - европейский лидер"
 wgr.4.desc: "Цифры 1985 года говорили сами за себя. ФРГ обладала крупнейшими в мире валютными резервами - $44 млрд** на конец 1984 года. Страна демонстрировала здоровое положительное сальдо торгового баланса в **$30 млрд. Прогнозируемый рост ВВП в 3% был лучшим показателем с 1979 года и одним из самых высоких в Западной Европе. Экспортно-ориентированная экономика ФРГ была более тесно интегрирована с Западной Европой, чем с любой другой частью мира."
 wgr.4.a: "Мы сильны!"
 wgr.5.t: "Конец холодной войны"
