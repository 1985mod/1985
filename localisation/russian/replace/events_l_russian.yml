 soviet_union.38.t: "Беловежские Соглашения"
 soviet_union.38.desc: ""
 soviet_union.38.a: "Не дадим до конца развалиться СССР!"
 soviet_union.38.b: "СССР уже не спасти."
 soviet_union.39.t: "Государственный Комитет по Чрезвычайному Положению"
 soviet_union.39.desc: "Кризис в руководстве Союза достиг своего пика. В попытке остановить децентрализацию и развал государства силовики и консервативное крыло партии берут власть в свои руки. Объявлено чрезвычайное положение, в Москву вводятся войска. Члены ГКЧП заявляют, что политика Перестройки зашла в тупик, и берут на себя ответственность за будущее страны."
 soviet_union.39.a: "Не дадим развалиться СССР!"
 soviet_union.40.t: "Речь Ельцина на танке"
 soviet_union.40.desc: "Борис Ельцин возглавил сопротивление путчу в Москве. Поднявшись на танк перед Белым домом, он выступил с резким осуждением ГКЧП, назвав их действия незаконными. Этот шаг вызвал мощную волну гражданского протеста, деморализовал заговорщиков и заставил часть воинских подразделений перейти на сторону защитников Белого дома, резко изменив баланс сил в нашей стране."
 soviet_union.40.a: "Всё под контролем."
 soviet_union.41.t: "Лебединое Озеро на всех каналах..."
 soviet_union.41.desc: "Утро началось со странного затишья. Вместо привычных утренних новостей, бодрых передач и развлекательных шоу на экранах телевизоров по всей стране зациклено крутят трансляцию балета «Лебединое озеро». Попытки переключить канал ни к чему не приводят - везде танцуют маленькие лебеди. Радиостанции тоже молчат или передают классическую музыку.\n\nОпыт прошлых лет подсказывает гражданам, что балет на экранах никогда не появляется просто так - обычно это означает смерть генерального секретаря или глубочайший кризис в верхах власти. Телефоны работают с перебоями, а из столицы доходят тревожные слухи о колоннах бронетехники. Возможно, в нашей стране готовят переворот..?"
 soviet_union.41.a: "Что происходит..?"
 something_is_definitely_wrong: "§RЧто-то явно не так...§!"
 soviet_union.42.t: "Расформирование ГКЧП"
 soviet_union.42.desc: "Августовский путч потерпел сокрушительное поражение. Неспособность членов Комитета решиться на штурм Белого дома, массовые протесты граждан и переход ключевых армейских подразделений на сторону защитников демократии полностью деморализовали заговорщиков.\n\nПопытка силой сохранить старый порядок провалилась всего за несколько дней. Вице-президент Янаев подписал указ о роспуске Государственного Комитета по Чрезвычайному Положению, а все его участники были немедленно арестованы по обвинению в измене Родине. Власть окончательно переходит в руки триумфаторов, но судьба самого Союза теперь висит на волоске."
 soviet_union.42.a: "Нас не сломить!"
 soviet_union.43.t: "25 декабря 1991 года"
 soviet_union.43.desc: "«Дорогие соотечественники! Сограждане! В силу сложившейся ситуации с образованием Содружества Независимых Государств я прекращаю свою деятельность на посту Президента СССР. Принимаю это решение по принципиальным соображениям.\n\nЯ твердо выступал за суверенитет республик, но одновременно и за сохранение союзного государства. События пошли по другому руслу. Возобладала линия на расчленение страны, с чем я не могу согласиться. Сейчас главное — сделать все, чтобы этот процесс не вылился в братоубийственную войну.\n\nМы живем теперь в новом мире. Покончено с «холодной войной», остановлена безумная милитаризация страны. Угроза мировой войны снята. Мы открылись миру, и нам ответили доверием и уважением. Народы и нации получили реальную свободу выбора.\n\nОднако изменения проходили в острой борьбе. Старая система рухнула до того, как успела заработать новая, и кризис общества еще больше обострился. Я знаю, что из-за огромных трудностей меня подвергают суровой критике. Но то, что сделано, еще предстоит оценить.\n\nЯ покидаю свой пост с тревогой, но и с надеждой, с верой в вашу мудрость и силу духа. Наверное, не обошлось без ошибок. Но я уверен: рано или поздно наши общие усилия принесут плоды. Желаю всем вам всего самого доброго»."
 soviet_union.43.a: "Прощай навеки, последняя любовь..."
 soviet_union.44.t: "Компромисс с ельциным"
 soviet_union.44.desc: ""
 soviet_union.44.a: "Лучше оставим Янаева"
 soviet_union.44.b: "Останемся на стороне Ельцина"
 soviet_union.45.t: "Новый Союзный Договор"
 soviet_union.45.desc: "Многолетний кризис партийной структуры и нарастающее стремление республик к независимости привели нас к историческому перекрестку. Старая союзная модель изжила себя. В залах Кремля, после изнурительных дебатов и тяжелых компромиссов, был подписан новый Союзный договор. На смену жесткой централизации приходит Союз Суверенных Государств.\n\nОтныне суверенные республики добровольно делегируют нам лишь вопросы внешней политики, стратегической обороны и безопасности, сохраняя полную внутреннюю автономию и право на собственные экономические реформы. Старый советский монолит трансформируется в гибкую, но мощную конфедерацию. Сможем ли мы устоять перед лицом внешних угроз и внутренних противоречий, или этот шаг станет началом конца великой державы? Будущее покажет."
 soviet_union.45.a: "Да здравствует обновленный Союз!"
 soviet_union.46.t: "Смерть Бориса Ельцина"
 soviet_union.46.desc: ""
 soviet_union.46.a: ""
 soviet_union.47.t: "Декабрьские события в Алма-Ате"
 soviet_union.47.desc: "17 декабря 1986 года на площади Брежнева в Алма-Ате начинаются массовые выступления студентов и молодёжи против назначения Геннадия Колбина первым секретарём ЦК Компартии Казахстана. Это становится первым крупным национальным протестом в СССР в годы перестройки, обнажившим острые противоречия между союзным центром и республиканскими элитами."
 soviet_union.47.a: "Лучше начнём расследование"
 soviet_union.47.b: "Жёстко подавим мятеж. Порядок любой ценой."
 soviet_union.48.t: "План «Метель-1986»"
 soviet_union.48.desc: "Сегодня в наши силовые органы СССР приступили к реализации специального оперативного плана под кодовым названием «Метель-1986». Разработанный МВД СССР ещё до начала протестов, этот план предусматривал подавление выступлений казахской молодёжи в Алма-Ате с привлечением трёх сводных отрядов, усиленных бронетранспортёрами и пожарными машинами. Первый разгон демонстрации был предпринят ещё 17 декабря около 18 часов с применением дубинок, однако основные силы были задействованы на следующий день. Курсанты пограничного училища и внутренние войска орудовали сапёрными лопатками, щитами и дубинками. На площади остались лежать десятки, а может, и сотни молодых людей, многие из которых были в крови. Впоследствии историки квалифицировали эту операцию как военно-политическую авантюру общегосударственного масштаба, а основополагающие документы плана были уничтожены."
 soviet_union.48.a: "Отлично."
 soviet_union.49.t: "События в Новом Узене"
 soviet_union.49.desc: "16 июня 1989 года на танцплощадке клуба «Строитель» в нефтедобывающем городе Новый Узень произошла драка между местными казахами и выходцами с Кавказа. Конфликт, возникший из бытовой ссоры, стремительно перерос в массовые межэтнические столкновения, охватившие весь город и прилегающие районы полуострова Мангышлак."
 soviet_union.49.a: "Лучше введём войска. Так будет лучше для всех"
 soviet_union.49.b: "Ничего не будем делать. Конфликт решится само собой."
 soviet_union.50.t: "Ввод Советских войск"
 soviet_union.50.desc: "20 июня 1989 года в нефтяной город Новый Узень (Мангышлакская область Казахской ССР) введены дополнительные подразделения внутренних войск МВД СССР и армейские части, расквартированные в Среднеазиатском военном округе. Решение принято на следующий день после начала массовых межэтнических столкновений между местными казахами и выходцами с Кавказа. В городе установлен комендантский час, запрещено передвижение граждан в ночное время, усилено патрулирование улиц с использованием бронетехники и автомобилей повышенной проходимости. Войска блокируют въезды и выезды из города, проводят проверки документов и изъятие оружия у населения."
 soviet_union.50.a: "Принято!"
 soviet_union.51.t: "Протесты усиливаются"
 soviet_union.51.desc: "Конфликт, который возник из бытовой ссоры, стремительно перерос в массовые межэтнические столкновения, охватившие весь город и прилегающие районы полуострова Мангышлак."
 soviet_union.51.a: "Нужно что-то делать!"
 soviet_union.52.t: "Протесты стихают"
 soviet_union.52.desc: "Конфликт, который возник из бытовой ссоры, стремительно перерос в массовые межэтнические столкновения, охватившие весь город и прилегающие районы полуострова Мангышлак, к нашему счастью, стихает."
 soviet_union.52.a: "Очень хорошо."
 soviet_union.53.t: "Ферганские погромы"
 soviet_union.53.desc: "Сегодня в городе Кувасай Ферганской области Узбекской ССР произошла драка между узбекской и турецко-месхетинской молодёжью, положившая начало крупнейшему межэтническому конфликту в СССР со времён депортаций. Поводом послужила бытовая ссора на базаре - покупатель-турок опрокинул тарелку клубники продавщицы-узбечки, после чего завязалась перепалка, переросшая в массовое столкновение."
 soviet_union.53.a: "Ё-моё..."
 soviet_union.54.t: "Ввод Милиции в Кувасай"
 soviet_union.54.desc: "23 мая 1989 года в город Кувасай Ферганской области Узбекской ССР для подавления возобновившихся массовых столкновений между узбекской и турецко-месхетинской молодёжью введены дополнительные силы милиции, свыше 300 человек, переброшенные из соседних районов. Ранее, 16–18 мая, в городе уже происходили драки между молодёжью двух национальностей, однако 23 мая конфликт вспыхнул с новой силой и перерос в крупные столкновения, продолжавшиеся два дня. Помимо милиции, в Ферганскую область направлено более 9 тысяч военнослужащих внутренних войск МВД СССР для нормализации обстановки и охраны общественного порядка. В ходе столкновений погибло 103 человека, более тысячи получили ранения, ранено 110 работников милиции, один из них скончался."
 soviet_union.54.a: "Принято."
 soviet_union.55.t: "Погромы усиливаются"
 soviet_union.55.desc: "Масштаб столкновений в Ферганской области Узбекской ССР достиг критической отметки. Вслед за Кувасаем погромы перекинулись на Фергану, Маргилан, Коканд и десятки пригородных посёлков, превратившись в неконтролируемые межэтнические чистки. Толпы, насчитывающие до нескольких тысяч человек, блокировали улицы, поджигали жилые кварталы, громили предприятия и учреждения. Милицейские наряды оказались не в состоянии сдержать разбушевавшуюся толпу - за 2 дня зарегистрировано более 300 нападений на дома турок-месхетинцев, 80 процентов жилого фонда в некоторых микрорайонах уничтожено огнём. Угроза расправы вынудила тысячи семей покидать свои дома в панике; многие укрывались на железнодорожных станциях и в воинских частях. В ответ на эскалацию 1 июня в область введён комендантский час, а дополнительные подразделения внутренних войск приступили к зачистке улиц с использованием бронетехники."
 soviet_union.55.a: "Тяжело..."
 soviet_union.56.t: "Массовые беспорядки в Душанбе"
 soviet_union.56.desc: "10 февраля 1990 года в Душанбе, столице Таджикской ССР, начались массовые беспорядки, продолжавшиеся четыре дня и ставшие одним из самых кровавых межэтнических конфликтов на территории СССР в период Перестройки. Поводом для выхода на улицы многотысячных толп послужили слухи о том, что властями республики нескольким тысячам армянских беженцев из Баку, бежавших от погромов, будут выделены квартиры в Душанбе без очереди - в то время как в городе ощущалась острая нехватка жилья. В действительности же в столицу Таджикистана прибыли всего около 50 человек. 11 февраля у здания ЦК Компартии Таджикистана собрались около 4 тысяч человек с лозунгами «Долой армян!», а после того как армянские семьи спешно покинули город, толпа стала требовать отставки руководства республики."
 soviet_union.56.a: "Да что-ж такое..."
 soviet_union.57.t: "Ошские события"
 soviet_union.57.desc: "В конце мая 1990 года на юге Киргизской ССР, в густонаселённой Ферганской долине, начался один из самых кровопролитных межнациональных конфликтов в истории СССР - Ошская резня. Поводом послужил земельный спор: малоимущие молодые киргизы потребовали предоставить им участки для жилищного строительства на землях колхоза имени Ленина вблизи Оша. Власти согласились удовлетворить это требование, однако узбекское население, составлявшее в городе большинство, восприняло это как ущемление своих прав."
 soviet_union.57.a: "Мда"
 soviet_union.58.t: "Статус НКАо"
 soviet_union.58.desc: ""
 soviet_union.58.a: "НКАо - это Армения!"
 soviet_union.58.b: "НКАо - это исконно Азербайджанская территория!"
 soviet_union.59.t: "Дела союзных республик"
 soviet_union.59.desc: ""
 soviet_union.59.a: "Союз должен быть неделимым."
 soviet_union.60.t: "Замена старого Тихонова"
 soviet_union.60.desc: "1985 год. Николай Тихонову 80 лет, он безнадёжно болен и не справляется с обязанностями председателя Совета Министров. Григорий Романов, недавно ставший генеральным секретарём, понимает: оставлять Тихонова на посту премьера нельзя - экономика стагнирует, аппарат саботирует решения, а в Политбюро зреет недовольство. Нужен новый глава правительства, который будет проводить курс Романова и при этом устроит ключевые фракции в ЦК.\n\nНа рассмотрении три кандидата. Лев Зайков - ленинградский выдвиженец, человек Романова, сторонник жёсткой дисциплины и борьбы с коррупцией. Владимир Долгих - тяжеловес из тяжёлой промышленности, консерватор, пользующийся поддержкой старой гвардии, но не склонный к реформам. Олег Бакланов - секретарь ЦК по оборонной промышленности, жёсткий сторонник военных расходов и приоритета ВПК над всем остальным."
 soviet_union.60.a: "Лев Зайков - отличный кандидат."
 soviet_union.60.b: "Владимир Долгих - нам нужен сильный ВПК."
 soviet_union.60.c: "Олег Бакланов - машиностроение, всё для народа!"
 soviet_union.61.t: "Визит Романова в Волгоград"
 soviet_union.61.desc: "Григорий Романов, недавно ставший генеральным секретарём, совершает первую поездку по стране - в Волгоград. Город-герой, символ Сталинградской победы, но сейчас это крупный промышленный центр, где положение дел далеко от образцового. На Волгоградском тракторном заводе - срыв плана, на «Красном Октябре» - воровство и пьянство, а местный обком, по данным КГБ, погряз в коррупции. Романов посещает заводы, встречается с рабочими и партийным активом, и везде слышит одно: дисциплина развалилась, директора думают только о личном обогащении, а обком их покрывает."
 soviet_union.61.a: "Мы были о другом мнении..."
 soviet_union.62.t: "Вопрос Афганистана"
 soviet_union.62.desc: "Афганская война идёт шестой год. Политбюро в очередной раз обсуждает Афганистан: армия ДРА не держит страну сама, моджахеды получают оружие из Пакистана и США, а советские войска несут потери. Романов получает два доклада. Генштаб предлагает крупную спецоперацию: удары спецназа и ВДВ по базам и караванным маршрутам, ликвидация полевых командиров, блокада границы с Пакистаном. МИД и часть Политбюро настаивают на поэтапном выводе войск по женевским договорённостям, пока война не стала окончательно непопулярной."
 soviet_union.62.a: "Выведем войска, это гумманое решение."
 soviet_union.62.b: "Проведём спец. операцию, боремся с терроризмом!"
 soviet_union.63.t: "Партийная грызня"
 soviet_union.63.desc: "Март 1985 года. Константин Черненко умирает в ЦКБ, и Политбюро собирается на внеочередное заседание. Вопреки ожиданиям, генеральным секретарём становится не Михаил Горбачёв, а Григорий Романов - секретарь ЦК по оборонке, бывший ленинградский обкомовский, человек старой школы. Его выдвигают консервативная часть аппарата и военно-промышленный комплекс, опасающиеся, что молодой и напористый Горбачёв слишком быстро начнёт реформы. Романов избран большинством голосов, но с минимальным перевесом.\n\nС этого дня в партии начинается открытая грызня. Горбачёв сохраняет пост второго секретаря, но его сторонники - Громыко, Лигачёв, Рыжков - постепенно теряют позиции. Романов чистит аппарат, ставит своих людей в ЦК и региональные комитеты, сворачивает антиалкогольную кампанию и замораживает любые экономические эксперименты. Консерваторы празднуют победу, но страна замирает в ожидании: экономика стагнирует, гонка вооружений продолжается, а в Политбюро идёт тихая война между двумя лагерями, которая может закончиться только отставкой или смертью одного из них."
 soviet_union.63.a: "Тяжело, но мы должны разобраться с этим"
 soviet_union.64.t: "Визит Романова в Китай"
 soviet_union.64.desc: ""
 soviet_union.64.a: "Здравствуйте, Китайские товарищи."
