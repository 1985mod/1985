 soviet_union.35.t: "Смерть Виктора Цоя"
 soviet_union.35.desc: "Трагическая весть леденящим ветром пронеслась по всем 15 республикам: на 35-м километре трассы Слока — Талси в автокатастрофе погиб Виктор Цой. Для миллионов советских граждан, уставших от бесконечных очередей, партийной риторики и туманного будущего, его «Москвич» стал последней точкой эпохи надежд. Голос целого поколения умолк навсегда, оставив после себя лишь эхо на разбитых лестницах."
 soviet_union.35.a: "Покойся с миром, легенда..."
 soviet_union.36.t: "Выборы президента РСФСР"
 soviet_union.36.desc: ""
 soviet_union.36.a: "Выбираем Ельцина!"
