 wgr.23.t: "Победа ХДС!"
 wgr.23.desc: "Избиратели вновь доверили правящей коалиции ХДС/ХСС и СвДП формирование правительства. Несмотря на острую критику со стороны оппозиции и растущее влияние «зелёных», наш блок сохранил уверенное большинство в Бундестаге. Йоханнес Рау, наш главный соперник от СДПГ, признал поражение, хотя его партия смогла удержать свои позиции.\n\nОднако внутри нашей собственной коалиции результаты вызвали смешанные чувства. Мы потеряли часть голосов по сравнению с 1983 годом, и многие наши депутаты обеспокоены растущим запросом на социальные реформы и экологическую политику. Гельмут Коль, наш канцлер, назвал итоги «ясным мандатом» на продолжение курса, но предупредил, что предстоящие годы потребуют большей гибкости.\n\n"
 wgr.23.a: "Да здравствует ХДС!"
 wgr.24.t: "Победа СДПГ!"
 wgr.24.desc: "Федеральные выборы 1987 года принесли долгожданную победу Социал-демократической партии Германии.\n\nЙоханнес Рау, наш кандидат и министр-президент Северного Рейна-Вестфалии, сумел убедить немецкий электорат в необходимости перемен. Устав от долгого правления консервативной коалиции, избиратели поверили в нашу программу социальной справедливости, экологической модернизации и миролюбивой внешней политики.\n\nМы добились убедительного большинства, оставив позади ХДС/ХСС и их партнёров. «Зелёные», хотя и укрепили свои позиции, остались младшим партнёром в оппозиции. Теперь перед нами открываются широкие возможности для проведения реформ, которые так долго откладывались.\n\nОднако победа не означает лёгкой жизни. Экономика нуждается в стимулировании, безработица остаётся высокой, а напряжение между Востоком и Западом требует от нас взвешенной позиции. Кроме того, американские союзники с настороженностью смотрят на наш приход к власти - Вашингтон опасается, что мы слишком далеко отойдём от курса НАТО."
 wgr.24.a: "Да здравствует СДПГ!"
 wgr.25.t: "Начало предвыборной кампании 1987 года"
 wgr.25.desc: ""
 wgr.25.a: "Что-ж, начнём."
 election_campaign_in_germany_1987: "Предвыборная кампания 1987 года"
 wgr.26.t: "Формирование нового правительства"
 wgr.26.desc: ""
 wgr.26.a: "Отлично!"
 wgr.27.t: "Versöhnen statt spalten"
 wgr.27.desc: "Предвыборная кампания в Бундестаг набирает обороты, и позиции нашего правительства во главе с Гельмутом Колем подвергаются серьезному испытанию. Социал-демократы (СДПГ) под руководством Йоханнеса Рау развернули мощную агитацию под лозунгом «Versöhnen statt spalten» («Примирение вместо раскола»). На фоне экологических протестов и экономических реформ этот призыв к национальному согласию находит сильный отклик у уставшего от поляризации избирателя.\n\nЭта стратегия «примирения» бьет прямо по нашему центристскому электорату. СДПГ успешно выставляет политику ХДС как излишне жесткую и разделяющую общество. Опросы показывают тревожный рост популярности левоцентристов. Если мы не предпримем ответных шагов, баланс сил в Бонне может качнуться не в нашу пользу."
 wgr.27.a: "Вот чёрт!"
 wgr.28.t: "СДПГ привлекает рабочий класс"
 wgr.28.desc: "Предвыборная кампания Йоханнеса Рау наносит тяжелый удар по позициям нашего правительства в самом сердце немецкой индустрии. Промышленный спад, закрытие нерентабельных шахт и реструктуризация сталелитейных гигантов породили среди немецких рабочих глубокий страх перед безработицей и неопределенностью. Социал-демократы умело выставляют реформы кабинета Гельмута Коля как бездушный, разделяющий нацию капитализм, противопоставляя ему идею солидарности и социальной защиты.\n\nМощные профсоюзы, исторически близкие к левым, развернули беспрецедентную мобилизацию в Рурском бассейне, Сааре и портовых городах Севера. Рабочие, которые на прошлых выборах сомневались, теперь монолитной стеной встают за СДПГ. Для ХДС это критическая угроза: без голосов умеренного рабочего класса удержать правое большинство в Бундестаге будет невозможно. Нам нужно срочно решать, как реагировать на то, что промышленное сердце Германии стремительно окрашивается в красный цвет." 
 wgr.28.a: "Надо что-то делать!"
 news.1.t: "Саммит в Рейкьявике"
 news.1.d: "Произошла вторая личная встреча Генерального секретаря ЦК КПСС Михаила Горбачёва и президента США Рональда Рейгана, состоявшаяся 11—12 октября 1986 года в Рейкьявике, на полпути между Москвой и Вашингтоном. Несмотря на то, что встреча прервалась без подписания каких-либо документов, она считается важной вехой в советско-американском переговорном процессе по стратегическим наступательным вооружениям и первым шагом к завершению эпохи холодной войны."
 news.1.a: "Большой прорыв!"
 news.2.t: "Смерть Константина Черненко"
 news.2.desc: "10 марта 1985 года в 19:20 скончался Генеральный секретарь ЦК КПСС Константин Устинович Черненко. Ему было 73 года. Официальное медицинское заключение назвало причиной смерти остановку сердца на фоне эмфиземы лёгких, сердечной недостаточности и цирроза печени. Он пробыл у власти всего 13 месяцев — это самое короткое правление со времён Сталина."
 news.2.a: "Что-ж такое делается..."
 news.3.t: "Ирак вторгается на территорию Кувейта!"
 news.3.desc: "2 августа 1990 года в 2:00 ночи иракские войска пересекли границу Кувейта, начав полномасштабное вторжение. Три дивизии Республиканской гвардии, поддержанные танками и вертолётами, быстро подавили сопротивление кувейтской армии. Эмир Кувейта Джабер ас-Сабах бежал в Саудовскую Аравию, а его брат Фахд был убит при обороне дворца. К концу дня иракские войска полностью оккупировали Кувейт, установив контроль над нефтяными месторождениями и правительственными зданиями."
 news.3.a: "Стервятники, терзающие труп..."
 news.4.t: "Авария на Чернобыльской АЭС"
 news.4.desc: "26 апреля 1986 года, в 1:23 ночи, на четвёртом энергоблоке Чернобыльской АЭС произошёл мощный взрыв во время проведения испытаний восьмого турбогенератора. Взрыв полностью разрушил реактор, вызвав один из крупнейших техногенных выбросов радиоактивных веществ в истории. В атмосферу попали изотопы урана, плутония, йода-131, цезия-134, цезия-137 и стронция-90. В ликвидации последствий приняли участие тысячи людей, многие из которых получили серьёзные дозы радиации. Эта катастрофа стала ударом по стабильности Советского Союза, усилив напряжённость в обществе и обострив политическую ситуацию в СССР."
 news.4.a: "Вечная память героям!"
 news.5.t: "Югославские войны начались"
 news.5.desc: "Сегодня на югославских территориях началась война, которая в основном включала в себя ряд межнациональных конфликтов между сербами, с одной стороны, и словенцами, хорватами, боснийцами и албанцами с другой, а также хорватско-боснийский конфликт и конфликт между пользовавшейся поддержкой вначале хорватов, а затем сербов Республикой Западная Босния и центральными властями мусульман во главе с Алией Изетбеговичем в Республике Босния и Герцеговина и конфликт между албанцами и македонцами в Северной Македонии, вызванные религиозными и этническими противоречиями."
 news.5.a: "Очередная затяжная война..." 
 news.6.t: "Выборы в верховный совет РСФСР"
 news.6.desc: "Сегодня прошли безальтернативные выборы в Верховный Совет РСФСР XI-го созыва. \n\ \n\ Выборы в IX-й созыв ВС РСФСР проходили согласно Положению о выборах в Верховный Совет РСФСР, утвержденному указом президиума Верховного совета РСФСР от 8 августа 1978 года.В выборах приняло участие 101 058 205 человек (явка — 99,97 %). За кандидатов проголосовало 100 989 507 человек (99,93 %)."
 news..a: "Довольно интересно."
 news.7.t: "Визит Стива Джобса в Москву"
 news.7.desc: "Летом 1985-го один из основателей калифорнийской компьютерной компании Apple, Стив Джобс, вместе с юристом Альбертом Эйзенштатом (Albert Eisenstat) прибыли в советскую Москву. В их планах было наладить сотрудничество с советским руководством и открыть в стране производство своих компьютеров."
 news.7.a: "Надеемся, всё будет хорошо."
 news.8.t: "Операция «Буря в пустыне»"
 news.8.desc: "17 января 1991 года коалиция из 35 стран под руководством США начала операцию «Буря в пустыне» против Ирака, оккупировавшего Кувейт. Авиаударам предшествовал залп из более чем 100 крылатых ракет «Томагавк» с кораблей в Персидском заливе и Красном море. В течение 42 дней авиация коалиции наносила удары по иракским командным пунктам, системам ПВО, позициям Scud-ракет и нефтяной инфраструктуре."
 news.8.a: "Пойдём освобождать Кувейт!"
 news.9.t: "Победа Республиканцев в США"
 news.9.desc: "8 ноября 1988 года действующий вице-президент Джордж Буш-старший одержал убедительную победу на президентских выборах, набрав 426 голосов выборщиков против 111 у демократа Майкла Дукакиса. Буш получил 53,4% голосов избирателей — лучший результат для республиканцев с 1924 года. Кампания Буша строилась на обещании продолжить политику Рейгана и знаменитой фразе: «Читайте по губам: никаких новых налогов»."
 news.9.a: "Будем надеяться, это послужит делу мира."
 news.10.t: "Победа демократов в США"
 news.10.desc: "8 ноября 1988 года кандидат от Демократической партии Майкл Дукакис одержал сенсационную победу на президентских выборах, набрав 370 голосов выборщиков против 168 у действующего вице-президента Джорджа Буша-старшего. Дукакис получил 52,3% голосов избирателей, уверенно победив в ключевых штатах Среднего Запада и Восточного побережья."
 news.10.a: "Любопытно."
 news.11.t: "Ирак победил в ирано-иракской войне"
 news.11.desc: "Сегодня ирано-иракская война завершилась победой Ирака. Иракские войска не только освободили оккупированные территории, но и захватили иранскую провинцию Хузестан с богатыми нефтяными месторождениями. Иран, истощённый войной и изоляцией, запросил мир на условиях Багдада. Аятолла Хомейни назвал это «величайшим унижением в истории революции». По мирному договору Иран признаёт поражение, выплачивает репарации и отказывается от территориальных претензий. Саддам Хусейн объявил себя «мечом арабской нации». Ирак стал региональной сверхдержавой, но цена победы огромна: сотни тысяч погибших и использование химического оружия."
 news.11.a: "Любопытно."
 news.12.t: "Иран победил в ирано-иракской войне"
 news.12.desc: ""
 news.12.a: "Любопытно."
 news.13.t: "Авария авианосца USS Coral Sea"
 news.13.desc: "Авианосец ВМС США USS Coral Sea (CV-43), возвращаясь после масштабного ремонта стоимостью 200 миллионов долларов, столкнулся с эквадорским танкером «Напо» во время учений в Карибском море, недалеко от американской базы в Гуантанамо, Куба. Инцидент произошел в ясную погоду при видимости в 11 километров."
 news.13.a: "Любопытно."
 news.14.t: "Женевская встреча"
 news.14.desc: "19–21 ноября 1985 года в Женеве состоялась первая за шесть лет встреча лидеров СССР и США — Михаила Горбачёва и Рональда Рейгана. К середине 1980-х отношения двух сверхдержав оказались на рекордно низком уровне: Рейган назвал СССР «империей зла», США разместили ракеты «Першинг-2» в Европе, а советские войска продолжали воевать в Афганистане.\nНикаких конкретных договорённостей достичь не удалось - Горбачёв требовал отказаться от программы СОИ в обмен на сокращение ракет, Рейган стоял на своём. Однако сам факт диалога стал прорывом. Лидеры подписали совместное заявление о том, что «ядерная война не может быть выиграна и никогда не должна быть развязана». Встреча заложила основы для будущих соглашений."
 news.14.a: "Очень хорошо!"
 news.15.t: "Майкл Дукакис поддерживает политику Перестройки"
 news.15.desc: "Дукакис выступил с программным заявлением, объявив о полной поддержке перестройки и гласности в Советском Союзе. Президент заявил: «Мы приветствуем перемены в СССР. Перестройка — это шанс для всего мира покончить с десятилетиями конфронтации». Администрация Дукакиса объявила о готовности к пересмотру внешнеполитического курса: предложено сокращение ядерных арсеналов, совместные космические программы и расширение экономических связей с Советским Союзом."
 news.15.a: "Очень хорошо!"
 news.16.t: "Майкл Дукакис призывает к ратификации РСМД"
 news.16.desc: "Сегодня Майкл Дукакис сказал, что ратификация РСМД должна состояться до встречи Рейгана с Горбачёвым в Москве в конце мая 1988 года. Президент не должен ехать в СССР «с пустыми руками» — одобрение Сената станет мощным сигналом о единстве американской политики и готовности к дальнейшим шагам по сокращению стратегических вооружений."
 news.16.a: "Любопытно."
 news.17.t: "Катастрофа шаттла «Челленджер»"
 news.17.desc: "28 января 1986 года шаттл «Челленджер» взорвался через 73 секунды после старта с мыса Канаверал. На борту погибли семь астронавтов, включая учительницу Кристу МакОлифф — миллионы школьников смотрели трансляцию в прямом эфире.\nРасследование показало, что причиной стало разрушение резиновых уплотнительных колец (O-rings) из-за низких температур. Инженеры Morton Thiokol предупреждали об опасности, но руководство NASA проигнорировало их. Комиссия Роджерса выявила системные проблемы в культуре безопасности агентства. Программа «Спейс шаттл» приостановлена на 32 месяца. Трагедия поставила под вопрос целесообразность пилотируемых полётов."
 news.17.a: "О, человечество!"
 news.18.t: "Комета Галлея"
 news.18.desc: "Весь мир готовился к небесному спектаклю. Газеты пестрели заголовками о «хвосте длиной в полнеба», астрономы наводили телескопы, а обыватели ждали конца света или чуда. Однако Вселенная решила пошутить. В феврале 1986 года Земля и комета Галлея оказались по разные стороны от Солнца, и момент наивысшей яркости прошел мимо наблюдателей — комета попросту «спряталась» за светилом. К тому же, за прошедшие 76 лет города разрослись так сильно, что световое загрязнение превратило ночное небо в мутную пелену. В итоге 99% жителей планеты так и не увидели легендарную комету. Триумф астрономии обернулся фарсом."
 news.18.a: "Любопытно."
 news.19.t: "Дело «Иран-контрас»"
 news.19.desc: "В мае 1985 года при посредничестве Израиля разработан механизм поставок американского оружия в Иран. С израильской стороны участие приняли премьер Шимон Перес, глава МИДа Давид Кимхи, торговцы оружием Швиммер и Нимроди. От США операцию курировали Майкл Ледин и Оливер Норт. Израиль получил гарантию «компенсации» за каждый транш. 20 августа 1985 года в Лондоне Ледин передал Кимхи секретный код для связи.\nСегодня данные неизвестны."
 news.19.a: "Очень интересно..."
 news.20.t: "Убийство Улофа Пальме"
 news.20.desc: "28 февраля 1986 года в 23:21 в центре Стокгольма, на перекрёстке Свеавеген и Туннельгатан, был смертельно ранен премьер-министр Швеции Улоф Пальме. Он возвращался из кинотеатра «Гранд» с супругой Лисбет без охраны - Пальме принципиально не пользовался телохранителями. Киллер дважды выстрелил из револьвера .357 Magnum: первая пуля попала в спину премьеру, вторая ранила его жену. Пальме скончался по пути в больницу."
 news.20.a: "Что-ж такое делается..."
 news.21.t: "Инцидент на площади Тяньаньмэнь"
 news.21.desc: "Многодневные протесты студентов и рабочих в Пекине достигли критической точки. Митингующие, требовавшие демократических реформ и борьбы с коррупцией, полностью парализовали центр столицы. После острых дебатов в руководстве партии было принято радикальное решение.\nВвод армейских подразделений и бронетехники превратил площадь в зону боевых действий. Несмотря на баррикады и сопротивление, «контрреволюционный мятеж» был жестко подавлен силами армии. Пока правительство заявляет о восстановлении порядка, мировое сообщество пребывает в шоке. Этот день навсегда изменит внутренний и внешний курс государства."
 news.21.a: "Это ужасная трагедия..."
 news.21.b: "Но там же ведь ничего не произошло..?"
 news.22.t: "Провозглашение Великого Ирака"
 news.22.desc: "Вскоре после падения Кувейта и подавления сопротивления в Курдистане и Хузестане Багдад объявил о создании Великого Ирака, перекроив британские границы. Саддам Хусейн провозглашен «Хранителем Арабского Тигра», а включение новых территорий дало Ираку контроль над пятой частью мировых запасов нефти. Теперь режим сталкивается с задачей удержания разнородных областей, объединив их ресурсы для обеспечения экономического и военного роста."
 news.22.a: "Мир изменился навсегда..."
 news.22.b: "Аллаху Акбар! Слава Ираку и самому Саддаму Хусейну!"
 news.23.t: "Воссоединение Йемена"
 news.23.desc: "Йеменская Арабская Республика (Северный Йемен) и Народная Демократическая Республика Йемен (Южный Йемен) официально объединились в единую Йеменскую Республику. Два государства с совершенно разными политическими системами - исламский Север и марксистский Юг - после десятилетий приграничных войн и расколов, продолжавшихся более 250 лет, наконец пошли на мирное слияние.\n\nЭтот процесс стал возможен благодаря долгим переговорам, которые длились около 25 лет и завершились подписанием Аденского договора 30 ноября 1989 года. За год до этого, в мае 1988 года, стороны создали вдоль границы демилитаризованную зону, а теперь пришли к финальному соглашению."
 news.23.a: "Всё будет хорошо... правда ведь..?"
 news.23.b: "Теперь мы - единое государство!"
 news.24.t: "Восстание Хезболлы"
 news.24.desc: "16 февраля 1985 года ливанская шиитская группировка, до этого действовавшая в подполье, официально объявила о своём существовании.\n\nВ мечети аль-Узаи в западном Бейруте представитель организации шейх Ибрагим аль-Амин зачитал манифест под названием «Программа „Хезболлы“ — открытое письмо всем угнетённым в Ливане и во всём мире». Текст манифеста был одновременно опубликован в крупнейшей ливанской газете «ас-Сафир»."
 news.24.a: "Пожелаем Ливану удачи."
 news.25.t: "Моджахеды выиграли в Афганской войне"
 news.25.desc: "Афганская война, ставшая одной из самых длительных и кровопролитных в новейшей истории, формально завершилась выводом советских войск 15 февраля 1989 года. Однако борьба продолжалась: ещё три года правительство Мохаммада Наджибуллы при поддержке СССР удерживало власть. С распадом Советского Союза военная и экономическая помощь полностью прекратилась. Месяц назад отряды моджахедов вошли в Кабул и свергли последнее прокоммунистическое правительство. Итогом десятилетнего противостояния стала победа афганских моджахедов."
 news.25.a: "Интересно..."
 news.25.b: "Наконец-то."
 news.26.t: "Афганистан выиграл в Афганской войне"
 news.26.desc: "Операция «Магистраль» поставила точку в затяжном противостоянии. Блокада пакистанских перевалов, удары по лагерям боевиков и политика примирения раскололи оппозицию. Кабул надёжно удержан, полевые командиры либо перешли на сторону правительства, либо отброшены в горы.\nГенштаб докладывает: организованное сопротивление в ДРА прекращено. Афганистан становится дружественным буфером, прикрывающим среднеазиатские границы от экстремизма и наркотрафика. Свыше 15 тысяч военнослужащих награждены, боевая техника получила бесценный опыт для модернизации.\nЮжный фланг надёжно защищён. Союз выходит из войны укрепившим свои позиции."
 news.26.a: "Очень интересно..."
 news.26.b: "Ура!"
 news.27.t: "Вывод советских войск из Афганистана"
 news.27.desc: "15 февраля 1989 года, 10:00, последняя колонна 40-й армии пересекла мост Дружбы, завершив 9-летнюю кампанию, в которой участвовало 620 000 советских военнослужащих. Потери: 15 052 убитых, 53 753 раненых, 417 пропавших без вести. Израсходовано 800 000 тонн боеприпасов, уничтожено 118 самолётов, 333 вертолёта, 147 танков.\nЭто было первым крупным свёртыванием советского присутствия за пределами ОВД. Операция обнажила экономическое истощение, усилила критику перестройки и дала толчок нацдвижениям в Средней Азии. Мир увидел, что СССР не может более диктовать условия на южных рубежах, а внутри страны росло разочарование."
 news.27.a: "Мы все этого так давно ждали!"
 news.27.b: "Прощайте, горы!"
 news.28.t: "Объединение Германии"
 news.28.desc: "3 октября 1990 года, в полночь, ГДР прекратила существование. Пять земель и Берлин вошли в состав ФРГ - объединение путём поглощения восточного соседа, без создания нового государства.\nПереговорный марафон: Договор об объединении, Договор «2+4». Четыре державы подтвердили суверенитет Германии, обязавшись вывести советские войска к концу 1994 года, а бундесвер сократить с 500 до 370 тысяч.\nОбъединение стало геополитическим землетрясением: обнажило экономическую пропасть между Востоком и Западом, усилило миграцию, поставило крест на социалистическом эксперименте в Европе и изменило баланс сил. Москва, согласившись на условия Запада, уступила позиции, открыв дорогу расширению НАТО на восток."
 news.28.a: "Немецкий народ снова един."
 news.28.b: "Мы снова едины, как в старые добрые!"
 news.29.t: "Агашерская война"
 news.29.desc: "25 декабря, в день католического Рождества, малийская армия начала наступление в Агашерской полосе. Армия Буркина-Фасо перебросила солдат в регион и начала контратаки. Однако малийские войска оказались более подготовленными и провели несколько успешных атак, захватив ряд деревень. Солдаты Буркина-Фасо контратаковали, но понесли большие потери. Правительство Ливии уже заявило о попытке договориться со сторонами о прекращении огня 26 декабря."
 news.29.a: "Любопытно."
 news.30.t: "Операция «Каньон Эльдорадо»"
 news.30.desc: "Чаша терпения Вашингтона переполнена. После недавнего кровавого теракта на дискотеке в Западном Берлине, унесшего жизни американских солдат, Белый дом указывает пальцем прямо на Триполи. Президент Рейган публично назвал Муаммара Каддафи «бешеным псом Ближнего Востока» и отдал приказ о немедленном возмездии.\n\nБомбардировщики F-111 совместно с палубной авиацией шестого флота нанесли сокрушительный удар по военным объектам и тренировочным лагерям в Триполи и Бенгази. Небо над Ливией озарилось разрывами зенитных снарядов. Воздушная операция завершена."
 news.30.a: "Любопытно."
 news.31.t: "Первая палестинская интифада"
 news.31.desc: "В Израиле произошло восстание палестинцев целью которого была провозглашена «борьба против израильской оккупации». События разворачиваются очень стремительно, возможно это перерастёт в гражданскую войну.\nВ течение нескольких месяцев, предшествовавших началу первой интифады, произошло множество событий, усиливавших враждебность между палестинцами и израильтянами. В сентябре были убиты четверо израильтян. Эти инциденты приводили к враждебности между израильтянами и палестинцами и волнениям на всех территориях, которые усиливались с каждым днём и достигли особенно широкого размаха в секторе Газа."
 news.31.a: "Любопытно."
 news.32.t: "Беловежские Соглашения"
 news.32.desc: "Беловежские соглашения, подписанные 8 декабря главами Республики Беларусь, РСФСР и Украины, стали переломным моментом в истории СССР. В Соглашении констатировалось прекращение существования СССР как «субъекта международного права и геополитической реальности» и заявлялось о создании Содружества Независимых Государств. Соглашение подписали высшие должностные лица и главы правительств трёх союзных республик: Станислав Шушкевич и Вячеслав Кебич — от Республики Беларусь, Борис Ельцин и Геннадий Бурбулис — от РСФСР, Леонид Кравчук и Витольд Фокин — от Украины."
 news.32.a: "Мир изменился навсегда..."
 news.33.t: "Война «Тойот»"
 news.33.desc: "Чадско-ливийский конфликт перешёл в активную фазу боевых действий. К началу 1987 года, ливийский экспедиционный корпус всё ещё представлял собой внушительную силу, насчитывавшую 8000 солдат, 300 танков, реактивные системы залпового огня и обычную артиллерию, вертолёты Ми-24 и шестьдесят боевых самолётов. Эти силы не имели единого командования, а были разделены на Южную оперативную группу, действовавшую в районе Тибести и насчитывавшую 2500 человек, и Восточную оперативную группу с центром в Фая-Ларжо. Ливийцы готовились к войне, в которой они должны были обеспечивать своим чадским союзникам поддержку с земли и воздуха."
 news.33.a: "Довольно интересно."
 news.34.t: "Жёлтая революция на Филиппинах"
 news.34.desc: "Многолетний авторитарный режим Фердинанда Маркоса на Филиппинах пал под натиском мирного протеста. Миллионы граждан с жёлтыми лентами вышли на улицы столицы после массовых фальсификаций на выборах. Когда армия отказалась выполнять приказы диктатора и перешла на сторону народа, судьба режима была решена. Маркос бежал из страны, а к власти пришла Корасон Акино, пообещавшая вернуть Филиппинам свободу и демократию."
 news.34.a: "Свободу Филиппинам!"
 news.35.t: "Победа ХДС на выборах 1987 года"
 news.35.desc: "25 января 1987 года в Западной Германии прошли выборы в Бундестаг. Несмотря на острую критику со стороны оппозиции и рост популярности «Зеленых», правоцентристский блок ХДС/ХСС под руководством действующего канцлера Гельмута Коля одержал уверенную победу, набрав 44,3% голосов.\n\nВместе со своими давними партнерами из СвДП консерваторы сформировали стабильное коалиционное правительство. Этот триумф укрепляет позиции Коля на международной арене и гарантирует продолжение жесткого прозападного курса ФРГ в Холодной войне. Похоже, политический ландшафт Западной Германии останется неизменным в ближайшие годы."
 news.35.a: "Понятно."
 news.36.t: "Победа СДПГ на выборах 1987 года"
 news.36.desc: "25 января 1987 года политический ландшафт Западной Германии содрогнулся. Вопреки всем прогнозам, Социал-демократическая партия (СДПГ) под руководством харизматичного Йоханнеса Рау одержала триумфальную победу на выборах в Бундестаг. Избиратели, уставшие от консервативного курса Коля и напуганные эскалацией Холодной войны, массово проголосовали за левоцентристов.\n\nРау уже заявил о формировании коалиции с набравшими силу «Зелеными». Новое правительство берет курс на деэскалацию отношений с Восточным блоком."
 news.36.a: "Понятно."
 european_union.2.a: "Историческая справка ЕС"
 european_union.2.d: "После Второй мировой войны страны Европы стремились предотвратить новые конфликты и восстановить экономику через сотрудничество. В 1951 году шесть государств — Франция, ФРГ, Италия, Бельгия, Нидерланды и Люксембург — создали Европейское объединение угля и стали, положив начало европейской интеграции.\nВ 1957 году были подписаны Римские договоры, учредившие Европейское экономическое сообщество (ЕЭС) и Евратом. Главной целью стало формирование общего рынка, свободного движения товаров, услуг, капитала и рабочей силы.\nВ 1970-х годах сообщество расширилось: к нему присоединились Великобритания, Ирландия и Дания, позже — Греция. \n 1985 году ЕЭС стало важной силой в Европе. В этот период началась подготовка к созданию единого внутреннего рынка"
 european_union.2.c: "К будущему!"
 european_union.3.a: "Подписание единого европейского акта"
 european_union.3.d: "После долгих переговоров государства Европейского сообщества согласовали положения Единого европейского акта. Новый договор должен ускорить создание единого внутреннего рынка, укрепить экономическое сотрудничество и расширить полномочия общеевропейских институтов. Сторонники интеграции называют этот момент началом новой эпохи европейского единства, тогда как критики опасаются постепенной утраты национального суверенитета ради будущего объединённой Европы."
 european_union.3.c: "Отлично!"

 european_union.4.a: "Ганноверский саммит"
 european_union.4.d: "На саммите в Ганновере лидеры Европейского сообщества согласились, что дальнейшая интеграция Европы невозможна без более тесного валютного и экономического сотрудничества. По итогам переговоров комиссия Жака Делора получила поручение подготовить конкретный план создания Экономического и валютного союза."
 european_union.4.c: "Европа должна стать единым экономическим пространством!!"

 nuke_dropped.1.t: "[From.From.GetName] подвергается атомной бомбардировке"
 nuke_dropped.1.d: "В первый и, хочется верить, последний раз в истории ядерная бомба была взорвана в ходе военных действий. Ее применило государство [?global.nukecountry.GetNameDef], а объектом бомбардировки является [From.From.GetName]. Огромный масштаб разрушений говорит о мощи нового оружия, которое вызывает страх не только тем, на что оно способно, но и тем, какие последствия это несет и для тех, кто его использует, и для всего человечества.\n\nМир затаил дыхание в ожидании развития событий. Согласится ли [From.From.Owner.GetNameDef] капитулировать, чтобы избежать дальнейшей агрессии, или это лишь укрепит боевой дух и желание нанести ответный удар?"
 nuke_dropped.1.a: "Атомная эра началась по-настоящему."
 nuke_dropped.1.b: "Мы сделаем все, что в наших силах, для защиты [Root.GetAdjective]ого народа."
 nuke_dropped.2.t: "Атомная бомбардировка Хиросимы"
 nuke_dropped.2.d: "«На улицах творится ад».\n — Куниёси Аикава\n\nСегодня над Хиросимой на высоте 580 метров взорвалась ядерная бомба, сброшенная с самолета [?global.nukecountry.GetNameRuGen]. Более двух третей города были мгновенно уничтожены. Хотя здания здесь строились с учетом частых землетрясений, уцелело лишь несколько строений.\n\nОбщественное сознание склонно преувеличивать мощь атомной бомбы и принижать ее цену — цену в человеческих жизнях. Ни одна из сторон не желает задумываться об ужасах атомной бомбардировки, но в историю это событие войдет тысячами и миллионами жизней, испарившихся в мгновение ока или угасших на отравленной земле."
 nuke_dropped.2.a: "Сколько же еще людей должно умереть, пока война наконец не закончится?"
 nuke_dropped.2.b: "Мы должны действовать быстро, чтобы помочь жертвам."
 nuke_dropped.3.t: "Атомная бомбардировка Нагасаки"
 nuke_dropped.3.d: "Ядерная бомба, первоначально предназначавшаяся для Кокуры, взорвалась сегодня над Нагасаки. Погодные условия вынудили самолеты отклониться от курса, и сочетание дыма, облаков и технических неполадок стало тем фактором, который, возможно, изменил ход истории.\n\nВ связи с тем, что город расположен в долине, действие бомбы оказалось ограничено ее территорией, но разрушительный эффект всё равно огромен. Пострадало несколько военных объектов, но это ничто в сравнении с человеческими жертвами. Пройдут десятилетия, прежде чем мы полностью осознаем долгосрочный эффект воздействия этого оружия. Угроза со стороны [?global.nukecountry.GetNameRuGen] не знает границ."
 nuke_dropped.3.a: "Приведет ли это к капитуляции [From.From.Owner.GetAdjective]ого лидера?"
 nuke_dropped.3.b: "Мы надеялись, что Нагасаки это не затронет."
 nuke_dropped.4.t: "Атомная бомбардировка Берлина"
 nuke_dropped.4.d: "Сегодня в [GetDateText] вооруженные силы [?global.nukecountry.GetNameRuGen] нанесли ядерный удар по столице Германии Берлину. Город пережил несколько бомбардировок и в эту войну, и в прошлую, но это не идет ни в какое сравнение с тем, что произошло сейчас. Со времен Тридцатилетней войны Берлин не знал таких глобальных разрушений — с учетом размеров города это считалось невозможным.\n\nБункер фюрера, как утверждается, пережил взрыв, по крайней мере частично, поскольку бомба сдетонировала вдали от запланированного эпицентра, и утверждается, что [From.From.Owner.GetLeader] всё еще жив и находится в ярости. Каким образом эвакуировать [From.From.Owner.GetAdjective]их лидеров и можно ли защитить их от радиации — это уже другой вопрос."
 nuke_dropped.4.a: "Сегодня хочется порадоваться, что ты не житель Берлина."
 nuke_dropped.4.b: "Наши враги нанесли удар в самое сердце нации!"
 nuke_dropped.5.t: "Атомная бомбардировка Лондона"
 nuke_dropped.5.d: "Сегодня ядерным взрывом был уничтожен Лондон. Несмотря на мощную систему ПВО, страна [From.From.Owner.GetNameDef] не смогла предотвратить удар, нанесенный вооруженными силами [?global.nukecountry.GetNameRuGen]. В [GetDateText] Биг-Бен отзвонил время в последний раз и растаял от жара взрыва. По первым донесениям, Букингемский дворец был полностью уничтожен, местонахождение королевской семьи неизвестно.\n\nПодтверждается, что [From.From.Owner.GetLeader] выжил и намерен выступить по радио с речью. Британцам, совершенно павшим духом, жизненно необходимо вернуть волю к сопротивлению — или убедительно призвать к капитуляции."
 nuke_dropped.5.a: "Трудно сохранять аристократическое спокойствие перед взрывной волной."
 nuke_dropped.5.b: "Боже, спаси короля!"
 nuke_dropped.6.t: "Атомная бомбардировка Киото"
 nuke_dropped.6.d: "Город Киото, ведущий [From.From.Owner.GetAdjective]ий промышленный центр Японии, подвергся сегодня ядерному удару со стороны [?global.nukecountry.GetNameRuGen]. Есть подозрения, что город был выбран в качестве мишени еще и потому, что является интеллектуальным центром страны.\n\nКрасота и историческая значимость Киото заставляла многих думать, что он уцелеет, но, вероятно, враг посчитал, что разрушение именно такого места окажет дополнительное психологическое воздействие. Город расположен в низине, поэтому воздействие взрыва оказалось ограничено территориально, но старый императорский дворец и многие промышленные здания оказались полностью разрушены."
 nuke_dropped.6.a: "История и красота ничего не стоят в войне."
 nuke_dropped.6.b: "Пусть уничтожают старое, мы построим новое."
 nuke_dropped.7.t: "Атомная бомбардировка Токио"
 nuke_dropped.7.d: "Сегодня вооруженные силы [?global.nukecountry.GetNameRuGen] нанесли ядерный удар в сердце Японской империи. Хотя в штабе допускали возможность обычных бомбардировок Токио, никому не могло прийти в голову, что столица станет основной мишенью для нового смертоносного оружия. Однако в итоге из-за политической значимости новой столицы и близости императорского дворца, который был разрушен до основания, всепожирающий огонь все-таки обрушился с неба.\n\nХотя утверждается, что [From.From.Owner.GetLeader] жив, возникает вопрос, как далеко готовы зайти враги Японии. Если война не завершится сейчас, какие цели еще остались? Что еще им может угрожать?"
 nuke_dropped.7.a: "Неужели это конец Японской империи?"
 nuke_dropped.7.b: "Пока жив [From.From.Owner.GetLeader], жива и Империя."
 nuke_dropped.8.t: "Атомная бомбардировка Вашингтона"
 nuke_dropped.8.d: "Ядерная бомба была взорвана сегодня над столицей Соединенных Штатов. Этот удар был нанесен одновременно и по политическому центру, и по историческому наследию США. Белый дом, Капитолий и ряд других значимых зданий и памятников оказались стерты с лица земли сокрушительным ударом враждебного [?global.nukecountry.GetNameRuGen]. Даже вашингтонский пожар столетней давности не может по разрушительной силе сравниться с тем, что сотворило с городом это новое оружие.\n\nХотя президент [From.From.Owner.GetLeader] находился в безопасности, случившееся глубоко потрясло нацию. Без сомнения, США надеялись оставаться первой и единственной страной, владеющей таким оружием. Эти мечты были разбиты вдребезги самым трагическим образом."
 nuke_dropped.8.a: "Одна нация, неделимая, против одного атома — делимого."
 nuke_dropped.8.b: "Орлан воспрянет из пепла, как феникс."
 nuke_dropped.9.t: "Атомная бомбардировка Рима"
 nuke_dropped.9.d: "В ходе сегодняшней беспрецедентной атаки, устроенной государством [?global.nukecountry.GetNameDef], ядерный взрыв прогремел над древним городом Римом. Многие полагали, что благодаря историческому и культурному наследию этот древний город никогда не станет мишенью для столь разрушительного оружия. Ватикан также частично уничтожен, местонахождение Папы Римского остается неизвестным, так что этот взрыв привел в ужас не только всех итальянцев, но и всех католиков.\n\nВ последние десять лет Рим стремительно развивался, и какое-то время еще казалось, что город способен помочь нации возродиться после окончания войны. Увы, эти мечты обратились в прах вместе с тысячами людей."
 nuke_dropped.9.a: "Бомба брошена!"
 nuke_dropped.9.b: "Рим за один день не возродится..."
 nuke_dropped.10.t: "Атомная бомбардировка Парижа"
 nuke_dropped.10.d: "Сегодня ядерная бомба, сброшенная с самолета, принадлежащего государству [?global.nukecountry.GetNameDef], взорвалась над Парижем, вызвав бесчисленные жертвы и разрушения. Франция пребывает в шоке после того, как ее столица подверглась самой масштабной атаке за всю свою историю, в которой были и войны, и революции. Парижане еще могли ожидать, что город будет захвачен, но никто не верил, что его настолько решительно и беспощадно уничтожат.\n\nБольше не будет парадов победы на Елисейских полях у Триумфальной арки. Возможно, в грядущие десятилетия возродится новый Париж, однако города, который был всем нам так дорог, теперь не существует."
 nuke_dropped.10.a: "Город света сгорел дотла."
 nuke_dropped.10.b: "Еще вчера могло показаться, что Париж вечен."
 nuke_dropped.11.t: "Атомная бомбардировка Москвы"
 nuke_dropped.11.d: "Москва, город, который многие тщетно пытались завоевать, сегодня стала целью ядерного удара со стороны [?global.nukecountry.GetNameRuGen]. Взрыв был нацелен на Кремль, где заседает [From.From.Owner.GetAdjective]ое правительство, и сердце города было почти полностью уничтожено.\n\n[From.From.Owner.GetLeader] успел вовремя эвакуироваться и уцелел благодаря тому, что в последнее время был готов к любой угрозе, с любой возможной и невозможной стороны. Но от такого беспощадного врага нелегко будет укрыться даже на бескрайних просторах. Если всё так пойдет и дальше, вскоре вся страна будет представлять собой лишь два вида пустошей: те, что были тут и прежде, и те, что созданы взрывами."
 nuke_dropped.11.a: "А разве ядерная зима не сделает Москву еще более неприступной целью?"
 nuke_dropped.11.b: "Пусть сожгут все наши города до единого, но взять их они не смогут."