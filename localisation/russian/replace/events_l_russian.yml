 soviet_union.70.t: "Победа Ельцина в ССГ"
 soviet_union.70.desc: ""
 soviet_union.70.a: "Здравствуйте, Борис Николаевич."
 soviet_union.71.t: "Победа Назарбаева в ССГ"
 soviet_union.71.desc: ""
 soviet_union.71.a: "Здравствуйте, товарищ Назарбаев"
