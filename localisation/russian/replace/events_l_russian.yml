 soviet_union.72.desc: ""
 soviet_union.72.a: "Ура!"
 soviet_union.73.t: "В Пекине"
 soviet_union.73.desc: "В просторном зале Дома народных собраний в Пекине повисла редкая для дипломатических встреч тишина. За длинным столом друг напротив друга сидели люди, в руках которых находилась судьба социалистического лагеря. Председатель Высшего Совета СССР Геннадий Янаев, удержавший страну на краю пропасти после бурных событий начала девяностых, внимательно всматривался в лицо Дэн Сяопина. Архитектор китайских реформ выглядел спокойным, но его проницательный взгляд выдавал напряженную работу мысли. Старые обиды времен Хрущева и Брежнева, пограничный конфликт на Даманском и идеологические споры слишком долго разделяли две великие державы.\n\nЯнаев заговорил первым, подчеркнув, что обновленный Союз извлек уроки из прошлых ошибок и готов уважать особый путь Китая, сочетающий социализм с рыночной экономикой. Дэн Сяопин медленно кивнул, сделав паузу. Пекину был нужен стабильный, предсказуемый северный сосед, а не хаос у границ, равно как и надежный партнер в противостоянии с гегемонией Запада. Прагматизм победил прежние догмы.\n\nКогда лидеры встали для финального рукопожатия, стало ясно: советско-китайскому расколу положен конец. Два гиганта Евразии решительно шагнули навстречу друг другу, готовые переписать баланс сил на мировой арене."
 soviet_union.73.a: "Товарищ Дэн Сяопин."
 soviet_union.74.t: "XXX Съезд КПСС"
 soviet_union.74.desc: "Огромный зал Кремлевского дворца съездов утопал в аплодисментах. Поднявшись на трибуну, Генеральный секретарь ЦК КПСС Геннадий Янаев окинул взглядом тысячи делегатов, прибывших со всех уголков устоявшего перед бурями Советского Союза. Позади остались хаос начала девяностых, экономическая неопределенность и угроза распада. Этот съезд, получивший тридцатый, юбилейный номер, должен был официально закрепить контуры «обновленного социализма».\n\nВ своем докладе Янаев подчеркнул, что партия смогла очистить свои ряды и извлечь уроки из прошлых ошибок перестройки. Новая программа провозглашала прагматичный баланс: сохранение жесткой государственной вертикали и планового контроля над стратегическими отраслями при одновременной легализации регулируемых рыночных элементов в легкой промышленности.\n\nПеред делегатами стояла задача не просто проголосовать за дежурные пятилетние планы, а утвердить новую идеологическую доктрину. Коммунистическая партия окончательно трансформировалась из неповоротливой бюрократической машины в авангард суверенной модернизации Евразии. Вспышки фотокамер запечатлели этот момент для истории: партия, которую мир уже успел похоронить, начинает свой новый отсчет." 
 soviet_union.74.a: "Ура! СССР еще жив!"
 soviet_union.75.t: "СССР предлагает перемирие"
 soviet_union.75.desc: "Красный шторм, ведомый фанатичной волей генерального секретаря Григория Романова, временно утих, оставив Западную Европу в руинах. Натиск обновлённой, безжалостной Красной Армии оказался неостановим для сил НАТО: советские танковые клинья замерли, лишь достигнув Ла-Манша и полностью заперев Балтийское море.\n\nПрезидент и Объединённый комитет начальников штабов, шокированные стремительным падением наших ключевых европейских союзников, были вынуждены пойти на унизительную сделку в Копенгагене, чтобы спасти остатки свободного мира от тотального уничтожения на континенте.\n\nУсловия советского ультиматума звучат как приговор американской геополитике: Красная Армия официально занимает и включает в свою сферу территории ФРГ, Бенилюкса и Дании. Взамен Соединённые Штаты получают 120 дней прекращения огня. По всему Вашингтону открыто признают - это не мир. Это лишь передышка перед неизбежным финалом.\n\nПока советские комиссары устанавливают свои порядки на берегах Рейна, у Пентагона есть ровно четыре месяца, чтобы перегруппировать флот, мобилизовать промышленность и подготовить миллионы новобранцев. Время пошло. Перемирие истечёт, и мир захлебнётся в финальной фазе Третьей мировой войны..."
 soviet_union.75.a: "Да, нам сейчас необходимо перемирие."
 soviet_union.75.b: "Ни за что!"
 soviet_union.76.t: "США согласились на мир"
 soviet_union.76.desc: "Американский империализм отступил перед сокрушительной мощью советского оружия! Из Вашингтона пришли новости, которых ждал весь социалистический блок: Белый дом официально принял условия нашего ультиматума. Красный шторм, запущенный стальной волей товарища Григория Романова, взломал оборону НАТО, а доблестная Красная Армия сокрушила капиталистические режимы, дойдя до берегов Ла-Манша.\n\nСогласно Копенгагенскому протоколу, вся территория ФРГ, Бенилюкса и Дании переходит под полный контроль Советского Союза. Хвалёный блок НАТО фактически перестал существовать в континентальной Европе, а Балтийское море превратилось во внутреннее озеро СССР. Взамен Соединённые Штаты получили 120 дней прекращения огня.\n\nВ Кремле и на улицах Москвы царит ликование, но Генеральный секретарь и Ставка понимают: это не окончательный мир. Капиталисты лишь пытаются выиграть время, чтобы перегруппировать силы за океаном. У Красной Армии есть ровно четыре месяца, чтобы закрепиться на новых рубежах, перестроить европейскую промышленность под нужды фронта и подготовить финальный удар по оплоту капитализма!"
 soviet_union.76.a: "Отлично, американские товарищи."
 soviet_union.77.t: "США отказались на наши условия"
 soviet_union.77.desc: "Империалистические хищники в Вашингтоне сделали свой выбор - они выбрали полное уничтожение. Из Белого дома пришёл официальный отказ на мирные условия Копенгагенского протокола. Американское руководство слепо верит, что сможет удержать континент, и отказалось признать переход ФРГ, Бенилюкса и Дании под наш контроль.\n\nРеакция Генерального секретаря Григория Романова была мгновенной и беспощадной. Никакого перемирия не будет. У Красной Армии больше нет причин сдерживать свой натиск. По всей линии фронта — от балтийских проливов до берегов Рейна — взревели тысячи орудий. Развёрнутые танковые дивизии и мотострелковые корпуса получили лаконичный приказ Ставки: сокрушить любые остатки сил НАТО в Западной Европе и сбросить американские войска в Атлантику.\n\nМаски сброшены. Война не остановится ни на день. Мы дойдём до конца, даже если ради этого придётся превратить Вашингтон в радиоактивный пепел!"
 soviet_union.77.a: "Мы так и знали! Чёртовы капиталисты!"
 soviet_union.78.t: "Расформирование Варшавского Договора"
 soviet_union.78.desc: "В Пражском Чернинском дворце представители СССР, Болгарии, Венгрии, Польши, Румынии и Чехословакии поставили свои подписи под протоколом о полном прекращении действия Варшавского договора. Михаил Горбачёв назвал это решение «шагом к общеевропейской безопасности», однако за кулисами кремлёвских кабинетов ясно ощущается тяжесть утраты. Красный щит над Восточной Европой окончательно опущен. Буферная зона потеряна, а вчерашние союзники смотрят на запад в поисках новых гарантий."
 soviet_union.78.a: "Значит так нужно."
 SOV_chernobyl.1.t: "Авария на Чернобыльской АЭС"
 SOV_chernobyl.1.desc: "26 апреля 1986 года, в 1:23 ночи, на четвёртом энергоблоке Чернобыльской АЭС произошёл мощный взрыв во время проведения испытаний восьмого турбогенератора. Взрыв полностью разрушил реактор, вызвав один из крупнейших техногенных выбросов радиоактивных веществ в истории. В атмосферу попали изотопы урана, плутония, йода-131, цезия-134, цезия-137 и стронция-90. В ликвидации последствий приняли участие тысячи людей, многие из которых получили серьёзные дозы радиации. Эта катастрофа стала ударом по стабильности Советского Союза, усилив напряжённость в обществе и обострив политическую ситуацию в СССР."
 SOV_chernobyl.1.a: "Вечная память героям!"
 dra.1.t: "Победа в Афганистане"
 dra.1.desc: "Товарищ Генеральный секретарь, это победа. Последний крупный оплот мятежников на границе разгромлен, а каналы снабжения из Пакистана окончательно перерезаны. Спустя годы тяжелейших боев в ущельях Гиндукуша, контингент советских войск совместно с правительственной армией ДРА установил полный контроль над всей территорией страны.\n\nИзощренная тактика ночных рейдов спецназа ГРУ, массированное применение штурмовой авиации и беспощадные удары «Крокодилов» Ми-24 сломали хребет сопротивлению душманов. Западные военные аналитики, предрекавшие Москве «второй Вьетнам», посрамлены. Президент США Рональд Рейган в ярости — операция ЦРУ «Циклон» потерпела крах, миллиарды долларов американских налогоплательщиков превратились в пепел.\n\nСегодня по улицам Кабула и Москвы маршируют колонны победителей под красными знаменами. Демократическая Республика Афганистан прочно закрепилась в социалистическом лагере. Перед нами открыты прямые дороги на Ближний Восток и к Индийскому океану. Весь мир увидел: мы никогда не отступаем."
 dra.1.a: "Ура! Слава ВС СССР!"
 dra.2.t: "Замена Бабрака Кармаля"
 dra.2.desc: "4 мая 1986 года вошло в историю Демократической Республики Афганистан как день коренного политического перелома. На 18-м пленуме ЦК НДПА Бабрак Кармаль, руководивший страной с момента ввода советских войск, официально освобожден от обязанностей Генерального секретаря. Официальная формулировка — «по состоянию здоровья», однако истинные причины кроются в кулуарах Кремля.\n\nНесмотря на решительную военную победу над моджахедами, Кармаль не смог сплотить расколотую партию и преодолеть вражду между фракциями «Хальк» и «Парчам». В условиях наступившего мира Москве нужен сильный прагматик, способный перевести Афганистан на рельсы мирного социалистического строительства.\n\nНовым лидером ДРА стал 39-летний доктор Мохаммад Наджибулла, до этого возглавлявший грозную службу государственной безопасности ХАД. Наджибулла — молодой, энергичный и жесткий руководитель, пользующийся абсолютным доверием КГБ СССР и нового советского лидера Михаила Горбачёва. Заручившись поддержкой победоносной Красной армии, новый Генсек провозглашает курс на консолидацию афганского общества. Время фракционной борьбы и слабости прошло. Начинается эпоха доктора Наджиба."
 dra.2.a: "Хорошо."

 DDR_unification.1.t: "Восточный блок пал"
 DDR_unification.1.desc: "Организации Варшавского Договора больше нет... В связи с этим в ФРГ и в ГДР встаёт вопрос об объединении Германии, а фактически, о ликвидации ГДР. Дадим Германии стать вновь единой или поборемся за свое право на сущестование?"
 DDR_unification.1.a: "Мы согласны! Время ГДР уже давно прошло."
 DDR_unification.1.b: "ФРГ покушается на нас. Постоим за коммунистический строй!"

 DDR_unification.2.t: "ГДР отказалась от объединения с нами"
 DDR_unification.2.desc: "В ГДР всё больше массовых демонстраций и требований об отставке правительства. Но они вцепились за власть зубами. Что будем делать?"
 DDR_unification.2.a: "Сейчас не время для объединения!"
 DDR_unification.2.b: "Если ГДР не идёт к нам, то мы идём к ним. С оружием."

 CZE_Czechoslovakia_kgb.1.t: "Память о Пражской весне"
 CZE_Czechoslovakia_kgb.1.desc: "Прошло семнадцать лет с тех пор, как танки Варшавского договора вошли в Прагу, и ЧССР не устраивают начавшиеся реформы в СССР. Из-за этого принято решение Руководству СГБ передан устный приказ об аресте агентов КГБ"
 CZE_Czechoslovakia_kgb.1.a: "Да, начать арест"
 CZE_Czechoslovakia_kgb.1.b: "Нет, не начать"

 CZE_Czechoslovakia_lenders.1.t: "Военное сотрудничество"
 CZE_Czechoslovakia_lenders.1.desc: "Мы договорились с СССР о том, что на нашей территории построят военные заводы в обмен на лояльность Москве"
 CZE_Czechoslovakia_lenders.1.a: "Отлично!"

 CZE_Czechoslovakia_perepro.1.t: "Переговоры"
 CZE_Czechoslovakia_perepro.1.desc: "Чтобы удержать контроль, руководство страны провело переговоры с демонстрантами, пообещав частичные реформы и больше свободы слова. Это решение дало правительству время, но одновременно подорвало его авторитет - народ уже почувствовал силу."
 CZE_Czechoslovakia_perepro.1.a: "Терпеть"
 CZE_Czechoslovakia_perepro.1.b: "Послать куда подальше"

 CZE_global_ralal.1.t: "Развал Чехословакия"
 CZE_global_ralal.1.d: "Чехословакия больше не существует, после многолетнего кризиса правительство Чехословакии не выдержало"
 CZE_global_ralal.1.a: "Да!"
 CZE_global_ralal.1.b: "Ех"
 CZE_global_ralal.1.s: "Пофиг"

 CZE_Czechoslovakia_papy.1.t: "Отчет про 1985 году"
 CZE_Czechoslovakia_papy.1.desc: "Пришёл новый, 1985 год. 1. СССР слабеет от внутренних противоречий. 2. Оппозиция в стране становится всё сильнее. 3. Экономика переживает времена стагнации.\nОт вас, игрок, зависит"

 british_black_wednesday.1.t: "Тучи над фунтом"
 british_black_wednesday.1.desc: "Фунт стерлингов всё сильнее давит нижнюю границу европейского валютного механизма. Высокие немецкие ставки после объединения Германии, сомнения вокруг Маастрихта и уверенность валютных трейдеров в переоценённости фунта превращают защиту курса в политическую битву за престиж правительства Джона Мейджора. Банк Англии может тратить резервы и поднимать ставки, но рынок уже проверяет, хватит ли у Лондона решимости удержать стерлинг в ERM."
 british_black_wednesday.1.a: "Защитить фунт любой ценой."
 european_union.3.t: "«Нежная революция» в Болгарии"
 european_union.3.desc: "10 ноября 1989 года. Тодор Живков — человек, правивший Болгарией 35 лет, — смещён с поста генерального секретаря ЦК Болгарской коммунистической партии. Заговор созревал внутри самой партии: министр иностранных дел Пётр Младенов ещё в октябре направил открытое письмо в ЦК, обвинив Живкова в том, что тот изолировал страну от всего мира, включая СССР. Горбачёв давно считал Живкова тормозом реформ и поддерживал оппозицию внутри БКП.\n\nВ отличие от Румынии, болгарская революция прошла без крови — её называют «нежной». На улицах Софии звучат требования демократии и многопартийности. 7 декабря тринадцать оппозиционных организаций объединяются в Союз демократических сил. Болгария начинает медленный, но необратимый путь к свободным выборам."
 european_union.3.a: "Живков пал. Болгария идёт своим путём!"
 european_union.4.t: "Переговорная революция в Венгрии"
 european_union.4.desc: "Лето 1989 года. Венгрия идёт своим путём — без баррикад и крови. Правящая Венгерская социалистическая рабочая партия сама садится за стол переговоров с оппозицией. 13 июня в Будапеште открывается Национальный круглый стол: коммунисты, Венгерский демократический форум, Альянс свободных демократов, молодой Фидес и другие силы обсуждают мирный переход к демократии.\n\n23 октября 1989 года — в годовщину революции 1956-го — Венгерская Народная Республика официально переименована в Венгерскую Республику. ВСРП превращается в Венгерскую социалистическую партию и признаёт своё историческое поражение. В марте 1990 года проходят первые свободные выборы — победу одерживает правоцентристский Венгерский демократический форум во главе с Йожефом Анталлом. Железный занавес пал — Венгрия открыла границу с Австрией ещё в мае."
 european_union.4.a: "Венгрия доказала: свободу можно завоевать словом."
 european_union.4.t: "Переговорная революция в Венгрии"
 european_union.4.desc: "Лето 1989 года. Венгрия идёт своим путём — без баррикад и крови. Правящая Венгерская социалистическая рабочая партия сама садится за стол переговоров с оппозицией. 13 июня в Будапеште открывается Национальный круглый стол: коммунисты, Венгерский демократический форум, Альянс свободных демократов, молодой Фидес и другие силы обсуждают мирный переход к демократии.\n\n23 октября 1989 года — в годовщину революции 1956-го — Венгерская Народная Республика официально переименована в Венгерскую Республику. ВСРП самораспускается и превращается в социал-демократическую Венгерскую социалистическую партию. В марте 1990 года проходят первые свободные выборы — победу одерживает правоцентристский Венгерский демократический форум во главе с Йожефом Анталлом. Ещё в мае Венгрия открыла границу с Австрией, пробив первую брешь в Железном занавесе."
 european_union.4.a: "Венгрия доказала: свободу можно завоевать словом."
 european_union.5.t: "Революция «Солидарности» в Польше"
 european_union.5.desc: "6 февраля 1989 года. В Варшаве открывается легендарный Круглый стол — переговоры между правящей Польской объединённой рабочей партией и запрещённым профсоюзом «Солидарность» во главе с Лехом Валенсой. Экономика агонизирует, забастовки не утихают, и у ПОРП не осталось иного выхода, кроме диалога.\n\n4 апреля подписано соглашение: «Солидарность» легализована, учреждается пост президента и свободно избираемый Сенат. 4 июня на выборах «Солидарность» получает 99 из 100 мест в Сенате — разгром коммунистов полный. 24 августа премьером становится Тадеуш Мазовецкий — первый некоммунистический глава правительства в послевоенной истории Польши. В декабре из конституции убраны все упоминания социализма. Польша положила начало лавине перемен по всему Восточному блоку."
 european_union.5.a: "«Солидарность» победила. Польша свободна!"

