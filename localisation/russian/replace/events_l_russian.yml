 soviet_union.32.t: "IV Съезд народных депутатов СССР"
 soviet_union.32.desc: "В декабре состоялся IV Съезд народных депутатов СССР, одним из основных вопросов которого стало сохранение СССР как союзного государства. Президентский совет СССР был упразднён. Кабинет министров подчинялся Президенту. Была принята конституционная реформа Горбачёва, а также решениями съезда было сохранено его название, объявлено о проведении референдума о сохранении самого государства как «обновлённой федерации равноправных суверенных республик». С этой целью был принят закон о всенародном голосовании в СССР. Съезд учредил пост вице-президента, на который был избран Геннадий Янаев. Вениамин Яковлев избран председателем Высшего арбитражного суда, Николай Трубин утверждён Генеральным прокурором СССР."
 soviet_union.32.a: "ОК"
