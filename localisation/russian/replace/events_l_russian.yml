 mali.1.t: "Агашерская война"
 mali.1.desc: ""
 mali.1.a: "За дело!"
 north_korea.1.t: ""
 north_korea.1.desc: "Пока советские дивизии Романова рвутся к Рейну, а ФРГ на грани капитуляции, Пхеньян присылает ультиматум. КНДР требует немедленного воссоединения Кореи под красным знаменем - не переговоров, не федерации, а полного подчинения Сеула. В случае отказа Пхеньян грозит вторжением и заявляет, что «братья на Севере» ждут только приказа.\n\nДля нас это худший момент. Американские войска в Корее не получат подкреплений: Вашингтон занят Европой и не может открыть второй фронт. Япония в панике, Китай молчит, а советский Дальний Восток уже приведён в повышенную готовность. У Сеула есть считанные часы, чтобы решить: сдаться, драться или искать третью силу."
 north_korea.1.a: "Мы примем этот ультиматум."
 north_korea.1.b: "Будем сражаться до конца!"
 norway.1.t: "Выборы 1985 года"
 norway.1.desc: "8 и 9 сентября 1985 года в Норвегии прошли очередные выборы в стортинг. Правящая трёхпартийная коалиция во главе с премьер-министром Коре Виллоком потеряла большинство, но сумела сохранить власть благодаря поддержке Fremskrittspartiet. Høyre получила 30,4% и 50 мест, потеряв три мандата, в то время как Arbeiderpartiet под руководством Гро Харлем Брунтланд набрала 40,8% и 71 место. Несмотря на это, левые не смогли сформировать правительство из-за раскола с SV. Главной сенсацией стало исчезновение Venstre из стортинга впервые за сто лет - партия не преодолела барьер."
 norway.1.a: "Гру Харлем Брунтланн!"
 norway.1.b: "Эрлинг Норвик!"
 norway.2.t: "Выборы 1989 года"
 norway.2.desc: "10 и 11 сентября 1989 года в Норвегии прошли очередные выборы в стортинг. На фоне падения мировых цен на нефть и экономических трудностей избиратели отвернулись от мейнстримных партий - как левых, так и правых. Главной сенсацией стал Партия прогресса во главе с харизматичным Карлом И. Хагеном, которая набрала 13,0% голосов и увеличила своё представительство на 20 мандатов, став третьей по величине силой в парламенте. Социалистическая левая партия также добилась успеха, получив 10,1% и 17 мест. Правящая Рабочая партия, возглавляемая Гро Харлем Брунтланд, хоть и осталась крупнейшей с 34,3% голосов, но потерпела худшее поражение за 40 лет, потеряв 8 мест. Консервативная партия также пережила серьёзный спад, потеряв 13 мандатов и опустившись до 22,2%."
 norway.2.a: "Ян Пер Сюсе!"
 norway.2.b: "Гру Харлем Брунтланн!"
 philippines.1.t: "Жёлтая революция"
 philippines.1.desc: "Февраль 1986 года. После фальсифицированных досрочных выборов, на которых Маркос был объявлен победителем, миллионы филиппинцев вышли на улицы. 22 февраля министр обороны Хуан Понсе Энриле и заместитель начальника штаба Фидель Рамос объявили о разрыве с режимом и укрылись в лагерях Кэмп-Крэйм и Кэмп-Агинальдо. Кардинал Хайме Син выступил по Radio Veritas, призвав народ выйти на EDSA и встать между танками и мятежными военными. Толпа из более чем миллиона человек, вооружённая едой, цветами и розариями, заблокировала правительственные войска, которые отказались стрелять в гражданских. 24 февраля мятежники захватили государственную телестанцию, а вертолёты ВВС перешли на сторону оппозиции. В Вашингтоне Белый дом заявил, что дальнейшее пребывание Маркоса у власти «бесполезно», и предложил ему убежище. В ночь на 25 февраля Маркос с семьёй и окружением покинул Малаканьянг на американских вертолётах и отправился в из exile на Гавайи. В тот же день Корасон Акино была приведена к присяге как новый президент Филиппин."
 philippines.1.a: "Ура! Свобода!"
 portugal.1.t: "Выборы 1985 года"
 portugal.1.desc: "Выборы были назначены досрочно после того, как правящая коалиция «Центральный блок» развалилась. Новый лидер СДП Анибал Каваку Силва, избранный в мае 1985-го, был категорическим противником этого союза и в июне вывел свою партию из правительства, что привело к отставке кабинета и роспуску парламента.\n\nГлавной сенсацией стало появление «Партии демократического обновления» (PRD), созданной при поддержке президента Рамалью Эанеша. Новая партия с ходу набрала 17,9% голосов и провела 45 депутатов, став третьей силой в Ассамблее. Социалисты во главе с Алмейдой Сантушем потерпели сокрушительное поражение, потеряв 44 мандата (с 101 до 57), в то время как СДП Каваку Силвы одержала победу, получив 88 мест, но без абсолютного большинства.\n\nКаваку Силва сформировал правительство меньшинства, которое зависело от ситуативной поддержки PRD. Этот союз оказался хрупким и продержался до 1987 года, когда партия Эанеша отозвала свою поддержку, что привело к новому правительственному кризису."
 portugal.1.a: "Консерваторы!"
 ren.1.t: "Провозглашение Республики Мозамбик"
 ren.1.desc: "Война закончена. ФРЕЛИМО пал. После шестнадцати лет гражданской войны, после того как РЕНАМО взяло Мапуту при поддержке ЮАР и Родезии, президент Шиссано бежал или убит - точно никто не знает. Африка Секулярная, последний оплот марксизма в Южной Африке, рухнула. РЕНАМО объявляет о создании Республики Мозамбик - без «народной», без социализма, без однопартийной системы.\n\nДля нас это победа. Мы воевали против ФРЕЛИМО с самого начала, помогали РЕНАМО оружием, деньгами и людьми. Теперь Мапуту наш. Но радоваться рано: страна в руинах, экономика разрушена, миллионы беженцев, голод. РЕНАМО - это партизаны, а не правительство, и они не умеют управлять. ЮАР требует долю в нефти и портах, Родезия - свои условия, Запад ждёт, что мы станем их союзником. А ФРЕЛИМО не исчезло - его сторонники ушли в подполье и в северные провинции.!"
 uni.1.a: "Ура!"
 somalia.1.t: "Мир с Эфиопией"
 somalia.1.desc: "Апрель 1988 года. После десяти лет войны и взаимной поддержки повстанцев мы садимся за стол с Менгисту. Эфиопия и Сомали подписывают соглашение: прекращение огня, отвод войск от границы, отказ от поддержки мятежников. Для нас это шанс развязать руки на севере, где SNM уже захватывает города, и прекратить бессмысленную войну за Огаден, которую мы проиграли ещё в 1978-м.\n\nНо мир с Эфиопией - это не только передышка. Это признание, что Огаден остаётся за Аддис-Абебой, а мы отказываемся от мечты о Великом Сомали. Армия, кланы и ветераны этого не простят. Зато Менгисту обещает закрыть базы SNM на своей территории, и это даёт нам шанс удержать север, пока не поздно."
 somalia.1.a: "Наконец-то."
 somalia.2.t: "Гражданская война"
 somalia.2.desc: "Апрель 1989 года. После мира с Эфиопией мы бросили армию на север против SNM, но это лишь усилило сопротивление. Сомалийское национальное движение захватывает города в Исааке, правительственные войска отвечают артиллерией и авиацией, но толку мало. На юге Объединённый сомалийский конгресс и Сомалийское патриотическое движение поднимают кланы Хавийе и Дарод. Экономика рухнула, армия разваливается, США сокращают помощь из-за нарушений прав человека. Барре цепляется за власть, но кланы вооружаются, и страна расползается."
 somalia.2.a: "Введём чрезвычайное положение."
 somalia.3.t: "Восстание Патриотического фронта Сомали"
 somalia.3.desc: "Юг поднимается. Патриотический фронт Сомали, созданный офицерами-огadenцами, объявляет войну режиму Барре. Его отряды уже действуют в Гедo и Нижней Джуббе, захватывают города, перерезают дороги на Кисмайо. К ним присоединяются дезертиры из армии, кланы Дарод и Раханвейн. Это не просто очередной мятеж - это фронт, который может дойти до Могадишо."
 somalia.3.a: "Всё ужасно..."
 spla.1.t: "Провозглашение Республики Судан"
 spla.1.desc: "Режим Нимейри вводит шариат на всей территории страны, включая христианский и анимистский Юг. В ответ на восстание в Бору полковник Джон Гаранг дезертирует из армии и 31 июля публикует манифест нового движения - Суданского народно-освободительного движения и его военного крыла СПЛА. Манифест призывает не к отделению Юга, а к построению «Нового Судана» - единого, демократического и секулярного государства, где все граждане равны независимо от религии и происхождения."
 spla.1.a: "Ура!" 
 sudan.1.t: "Военный переворот" 
 sudan.1.desc: "Апрель 1985 года. Режим Джафара Нимейри рушится у него на глазах. После того как он по требованию МВФ отменил субсидии на хлеб и топливо, Хартум охватили демонстрации и всеобщая забастовка. Профсоюзы, врачи и юристы объединились против президента, которого уже не спасают ни чрезвычайное положение, ни обещания. Нимейри в этот момент не в стране - он уехал в Вашингтон за кредитами и возвращается только в Каир, где Мубарак предлагает ему убежище.\n\nПока президент в пути, армия действует. 6 апреля группа высших офицеров во главе с министром обороны Абдель Рахманом Свар эль-Дахабом - человеком, которого Нимейри сам поставил на этот пост, - совершает бескровный переворот. Конституция приостановлена, аэропорт закрыт, границы перекрыты, министры арестованы. Свар эль-Дахаб объявляет по радио, что армия «встала на сторону народа, чтобы избежать кровопролития». Создан Переходный военный совет из 15 генералов, обещано вернуть власть гражданским через год." 
 sudan.1.a: "Удержим власть военных." 
 sudan.2.t: "Возобновление гражданской войны" 
 sudan.2.desc: После двух лет правления Садыка аль-Махди мирные переговоры с СПЛА зашли в тупик. Правительство отказывается заморозить шариат, Гаранг отказывается сложить оружие. Вместо компромисса — наступление. СПЛА переходит в атаку на юге, захватывает Торит, Капоэту, перерезает дороги к Джубе. Правительственные гарнизоны бегут или сдаются, армия деморализована, ополчения кланов переходят на сторону мятежников. Джуба в осаде, юг фактически потерян.\n\nДля Хартума это катастрофа. Исламисты требуют продолжать войну до конца, армия требует денег и оружия, южане в правительстве требуют отмены шариата. США и Египет давят, требуя переговоров. Эфиопия открыто поддерживает СПЛА. Вопрос в том, что делать: бросить последние силы на юг, начать переговоры с Гарангом или искать внешней помощи." 
 sudan.2.a: "В контрнаступление!"
 sweden.1.t: "Выборы 1985 года"
 sweden.1.desc: "Сегодня в Швеции прошли очередные выборы в риксдаг. Улоф Пальме и социал-демократы шли на третий срок подряд, но экономика пробуксовывала, росла безработица, а на повестке впервые громко зазвучали экологические вопросы. Главной сенсацией кампании стал Бенгт Вестерберг и его Народная партия: либералы удвоили поддержку, отобрав голоса у Умеренных и Партии центра. Ульф Адельсон и Турбьёрн Фельдин теряли позиции, а левые коммунисты во главе с Ларсом Вернером сохраняли скромное, но устойчивое представительство. Явка превысила 89%. В итоге победил..."
 sweden.1.a: "Улоф Пальме!"
 sweden.1.b: "Ульф Адельсон!"
 sweden.1.c: "Бенгт Вестерберг!"
 sweden.2.t: "Выборы 1988 года"
 sweden.2.desc: "Сегодня в Швеции прошли очередные выборы в риксдаг. Кампания начиналась на фоне экономического подъёма - безработица всего 2,3%, бюджет сбалансирован. Но в июне разразился скандал вокруг дела Эббе Карлссона, связанного с расследованием убийства Улофа Пальме: министр юстиции Анна-Грета Лейон подала в отставку, и правительство потеряло часть доверия. Ближе к осени на первый план вышли экологические вопросы - цветение водорослей в Балтике, массовая гибель тюленей, закрытые пляжи. Это сыграло на руку Партии зелёных, которая впервые преодолела четырёхпроцентный барьер и вошла в риксдаг. Умеренные Карла Бильдта и Народная партия Бенгта Вестерберга теряли позиции, а Партия центра Улофа Юханссона, наоборот, усилилась. Победил кандидат..."
 sweden.2.a: "Ингвар Карлссон!"
 sweden.2.b: "Карл Бильдт!"
 sweden.2.c: "Бенгт Вестерберг!"
 sweden.3.t: "Выборы 1991 года"
 sweden.3.desc: "Сегодня в Швеции прошли очередные выборы в риксдаг. Кампания проходила на фоне глубокого экономического кризиса: безработица росла, дефицит бюджета достиг рекордных отметок, а банковский кризис только начинался. Социал-демократы Ингвара Карлссона, у власти с 1982 года, шли на выборы с обещанием защитить «шведскую модель», но избиратели устали от высоких налогов и растущих расходов. Главной сенсацией кампании стало появление двух новых партий: Христианские демократы впервые преодолели четырёхпроцентный барьер, а популистская «Новая демократия» Иана Вахтмайстера, созданная всего за семь месяцев до выборов, с ходу получила места в парламенте. Партия зелёных, наоборот, потеряла всё, не сумев преодолеть барьер. Умеренные Карла Бильдта и либералы Бенгта Вестерберга обещали «новый старт» - снижение налогов, приватизацию и сокращение госрасходов. Победил..."
 sweden.3.a: "Карл Бильдт!"
 sweden.3.b: "Ингвар Карлссон!"
 sweden.3.c: "Бенгт Вестерберг!"
 taiwan.1.t: "Смерть Цзяна Цзинго"
 taiwan.1.desc: "Сердечный приступ оборвал жизнь человека, который почти десятилетие стоял у руля острова. Скончался последний прямой продолжатель династии Цан. Еще год назад по его инициативе было отменено многолетнее военное положение, легализована оппозиция и открыты двери для диалога с внешним миром. Но вместе с тем его уход оставляет Тайвань на перепутье: старая гвардия Гоминьдана цепляется за былые порядки, общество требует полной демократизации, а по ту сторону Тайваньского пролива внимательно следят за любыми признаками слабости."
 taiwan.1.a: "Это трагедия..."
 turkey.1.t: "Уход Эврена"
 turkey.1.desc: "Кенан Эврен покидает пост президента Турции, завершив семилетний срок, который начался после переворота 12 сентября 1980 года. Бывший начальник Генштаба, возглавивший военную хунту, он правил страной сначала как глава государства, а с 1982 года - как избранный президент. Его правление запомнилось массовыми репрессиями: уголовные дела были возбуждены против 230 тысяч человек, сотни умерли под пытками, десятки были казнены. Демократия вернулась в 1983 году, но с ограничениями - к выборам допускались только партии, одобренные военными. Эврен уходит в тень, оставив после себя расколотое общество и армию, которая ещё долго будет считать себя гарантом стабильности"
 turkey.1.a: "Прощай!"
 uni.1.t: "Провозглашение Республики Ангола"
 uni.1.desc: "Война закончена. МПЛА пал. После шестнадцати лет гражданской войны, после того как УНИТА взяло Луанду при поддержке ЮАР и США, президент Жозе Эдуарду душ Сантуш бежал или убит - точно никто не знает. Кубинские войска выведены, советские советники эвакуированы, нефтяные вышки стоят. Жонас Савимби объявляет о создании Республики Ангола - без социализма, без однопартийной системы, без советских друзей.\n\nДля нас это победа. Мы воевали против МПЛА с 1975 года, помогали УНИТА оружием, деньгами и людьми. Теперь Луанда наша. Но радоваться рано: страна в руинах, экономика разрушена, миллионы беженцев, голод. УНИТА - это партизаны, а не правительство, и они не умеют управлять. ЮАР требует долю в алмазах, США - нефть, Запад ждёт, что мы станем их союзником. А МПЛА не исчезло - его сторонники ушли в подполье и в северные провинции."
 yemen.1.t: "Провозглашение Республики Ангола"
 yemen.1.desc: "Южный Йемен в глубоком кризисе: экономика рушится, коммунистический режим теряет контроль, в Адене идёт борьба за власть между Али Насером Мухаммедом и Абд аль-Фаттахом Исмаилом. Северный Йемен во главе с Али Абдаллой Салехом наблюдает за этим с растущим интересом. В Сане уже давно говорят о «воссоединении родины», но на каких условиях - вопрос открытый. Южане предлагают равноправный союз двух государств, северяне готовы принять Юг в состав ЙАР на своих условиях. В ноябре 1989 года переговоры в Адене заходят в тупик. Салех отдаёт приказ армии готовиться к двум сценариям: либо мирная аннексия через договор, либо поддержка антикоммунистических сил в Южном Йемене, чтобы те взяли власть и попросили о вхождении в состав ЙАР."
 yemen.1.a: "Аннексируем южный."
 yemen.1.b: "Начнём вторую гражданскую войну!"
