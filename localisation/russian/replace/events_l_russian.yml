 nuke_dropped.1.t: "[From.From.GetName] подвергается атомной бомбардировке"
 nuke_dropped.1.d: "В первый и, хочется верить, последний раз в истории ядерная бомба была взорвана в ходе военных действий. Ее применило государство [?global.nukecountry.GetNameDef], а объектом бомбардировки является [From.From.GetName]. Огромный масштаб разрушений говорит о мощи нового оружия, которое вызывает страх не только тем, на что оно способно, но и тем, какие последствия это несет и для тех, кто его использует, и для всего человечества.\n\nМир затаил дыхание в ожидании развития событий. Согласится ли [From.From.Owner.GetNameDef] капитулировать, чтобы избежать дальнейшей агрессии, или это лишь укрепит боевой дух и желание нанести ответный удар?"
 nuke_dropped.1.a: "Атомная эра началась по-настоящему."
 nuke_dropped.1.b: "Мы сделаем все, что в наших силах, для защиты [Root.GetAdjective]ого народа."
 nuke_dropped.2.t: "Атомная бомбардировка Хиросимы"
 nuke_dropped.2.d: "«На улицах творится ад».\n - Куниёси Аикава\n\nСегодня над Хиросимой на высоте 580 метров взорвалась ядерная бомба, сброшенная с самолета [?global.nukecountry.GetNameRuGen]. Более двух третей города были мгновенно уничтожены. Хотя здания здесь строились с учетом частых землетрясений, уцелело лишь несколько строений.\n\nОбщественное сознание склонно преувеличивать мощь атомной бомбы и принижать ее цену - цену в человеческих жизнях. Ни одна из сторон не желает задумываться об ужасах атомной бомбардировки, но в историю это событие войдет тысячами и миллионами жизней, испарившихся в мгновение ока или угасших на отравленной земле."
 nuke_dropped.2.a: "Сколько же еще людей должно умереть, пока война наконец не закончится?"
 nuke_dropped.2.b: "Мы должны действовать быстро, чтобы помочь жертвам."
 nuke_dropped.3.t: "Атомная бомбардировка Нагасаки"
 nuke_dropped.3.d: "Ядерная бомба, первоначально предназначавшаяся для Кокуры, взорвалась сегодня над Нагасаки. Погодные условия вынудили самолеты отклониться от курса, и сочетание дыма, облаков и технических неполадок стало тем фактором, который, возможно, изменил ход истории.\n\nВ связи с тем, что город расположен в долине, действие бомбы оказалось ограничено ее территорией, но разрушительный эффект всё равно огромен. Пострадало несколько военных объектов, но это ничто в сравнении с человеческими жертвами. Пройдут десятилетия, прежде чем мы полностью осознаем долгосрочный эффект воздействия этого оружия. Угроза со стороны [?global.nukecountry.GetNameRuGen] не знает границ."
 nuke_dropped.3.a: "Приведет ли это к капитуляции [From.From.Owner.GetAdjective]ого лидера?"
 nuke_dropped.3.b: "Мы надеялись, что Нагасаки это не затронет."
 nuke_dropped.4.t: "Атомная бомбардировка Берлина"
 nuke_dropped.4.d: "Сегодня в [GetDateText] вооруженные силы [?global.nukecountry.GetNameRuGen] нанесли ядерный удар по столице Германии Берлину. Город пережил несколько бомбардировок и в эту войну, и в прошлую, но это не идет ни в какое сравнение с тем, что произошло сейчас. Со времен Тридцатилетней войны Берлин не знал таких глобальных разрушений - с учетом размеров города это считалось невозможным.\n\nБункер фюрера, как утверждается, пережил взрыв, по крайней мере частично, поскольку бомба сдетонировала вдали от запланированного эпицентра, и утверждается, что [From.From.Owner.GetLeader] всё еще жив и находится в ярости. Каким образом эвакуировать [From.From.Owner.GetAdjective]их лидеров и можно ли защитить их от радиации - это уже другой вопрос."
 nuke_dropped.4.a: "Сегодня хочется порадоваться, что ты не житель Берлина."
 nuke_dropped.4.b: "Наши враги нанесли удар в самое сердце нации!"
 nuke_dropped.5.t: "Атомная бомбардировка Лондона"
 nuke_dropped.5.d: "Сегодня ядерным взрывом был уничтожен Лондон. Несмотря на мощную систему ПВО, страна [From.From.Owner.GetNameDef] не смогла предотвратить удар, нанесенный вооруженными силами [?global.nukecountry.GetNameRuGen]. В [GetDateText] Биг-Бен отзвонил время в последний раз и растаял от жара взрыва. По первым донесениям, Букингемский дворец был полностью уничтожен, местонахождение королевской семьи неизвестно.\n\nПодтверждается, что [From.From.Owner.GetLeader] выжил и намерен выступить по радио с речью. Британцам, совершенно павшим духом, жизненно необходимо вернуть волю к сопротивлению - или убедительно призвать к капитуляции."
 nuke_dropped.5.a: "Трудно сохранять аристократическое спокойствие перед взрывной волной."
 nuke_dropped.5.b: "Боже, спаси короля!"
 nuke_dropped.6.t: "Атомная бомбардировка Киото"
 nuke_dropped.6.d: "Город Киото, ведущий [From.From.Owner.GetAdjective]ий промышленный центр Японии, подвергся сегодня ядерному удару со стороны [?global.nukecountry.GetNameRuGen]. Есть подозрения, что город был выбран в качестве мишени еще и потому, что является интеллектуальным центром страны.\n\nКрасота и историческая значимость Киото заставляла многих думать, что он уцелеет, но, вероятно, враг посчитал, что разрушение именно такого места окажет дополнительное психологическое воздействие. Город расположен в низине, поэтому воздействие взрыва оказалось ограничено территориально, но старый императорский дворец и многие промышленные здания оказались полностью разрушены."
 nuke_dropped.6.a: "История и красота ничего не стоят в войне."
 nuke_dropped.6.b: "Пусть уничтожают старое, мы построим новое."
 nuke_dropped.7.t: "Атомная бомбардировка Токио"
 nuke_dropped.7.d: "Сегодня вооруженные силы [?global.nukecountry.GetNameRuGen] нанесли ядерный удар в сердце Японской империи. Хотя в штабе допускали возможность обычных бомбардировок Токио, никому не могло прийти в голову, что столица станет основной мишенью для нового смертоносного оружия. Однако в итоге из-за политической значимости новой столицы и близости императорского дворца, который был разрушен до основания, всепожирающий огонь все-таки обрушился с неба.\n\nХотя утверждается, что [From.From.Owner.GetLeader] жив, возникает вопрос, как далеко готовы зайти враги Японии. Если война не завершится сейчас, какие цели еще остались? Что еще им может угрожать?"
 nuke_dropped.7.a: "Неужели это конец Японской империи?"
 nuke_dropped.7.b: "Пока жив [From.From.Owner.GetLeader], жива и Империя."
 nuke_dropped.8.t: "Атомная бомбардировка Вашингтона"
 nuke_dropped.8.d: "Ядерная бомба была взорвана сегодня над столицей Соединенных Штатов. Этот удар был нанесен одновременно и по политическому центру, и по историческому наследию США. Белый дом, Капитолий и ряд других значимых зданий и памятников оказались стерты с лица земли сокрушительным ударом враждебного [?global.nukecountry.GetNameRuGen]. Даже вашингтонский пожар столетней давности не может по разрушительной силе сравниться с тем, что сотворило с городом это новое оружие.\n\nХотя президент [From.From.Owner.GetLeader] находился в безопасности, случившееся глубоко потрясло нацию. Без сомнения, США надеялись оставаться первой и единственной страной, владеющей таким оружием. Эти мечты были разбиты вдребезги самым трагическим образом."
 nuke_dropped.8.a: "Одна нация, неделимая, против одного атома - делимого."
 nuke_dropped.8.b: "Орлан воспрянет из пепла, как феникс."
 nuke_dropped.9.t: "Атомная бомбардировка Рима"
 nuke_dropped.9.d: "В ходе сегодняшней беспрецедентной атаки, устроенной государством [?global.nukecountry.GetNameDef], ядерный взрыв прогремел над древним городом Римом. Многие полагали, что благодаря историческому и культурному наследию этот древний город никогда не станет мишенью для столь разрушительного оружия. Ватикан также частично уничтожен, местонахождение Папы Римского остается неизвестным, так что этот взрыв привел в ужас не только всех итальянцев, но и всех католиков.\n\nВ последние десять лет Рим стремительно развивался, и какое-то время еще казалось, что город способен помочь нации возродиться после окончания войны. Увы, эти мечты обратились в прах вместе с тысячами людей."
 nuke_dropped.9.a: "Бомба брошена!"
 nuke_dropped.9.b: "Рим за один день не возродится..."
 nuke_dropped.10.t: "Атомная бомбардировка Парижа"
 nuke_dropped.10.d: "Сегодня ядерная бомба, сброшенная с самолета, принадлежащего государству [?global.nukecountry.GetNameDef], взорвалась над Парижем, вызвав бесчисленные жертвы и разрушения. Франция пребывает в шоке после того, как ее столица подверглась самой масштабной атаке за всю свою историю, в которой были и войны, и революции. Парижане еще могли ожидать, что город будет захвачен, но никто не верил, что его настолько решительно и беспощадно уничтожат.\n\nБольше не будет парадов победы на Елисейских полях у Триумфальной арки. Возможно, в грядущие десятилетия возродится новый Париж, однако города, который был всем нам так дорог, теперь не существует."
 nuke_dropped.10.a: "Город света сгорел дотла."
 nuke_dropped.10.b: "Еще вчера могло показаться, что Париж вечен."
 nuke_dropped.11.t: "Атомная бомбардировка Москвы"
 nuke_dropped.11.d: "Москва, город, который многие тщетно пытались завоевать, сегодня стала целью ядерного удара со стороны [?global.nukecountry.GetNameRuGen]. Взрыв был нацелен на Кремль, где заседает [From.From.Owner.GetAdjective]ое правительство, и сердце города было почти полностью уничтожено.\n\n[From.From.Owner.GetLeader] успел вовремя эвакуироваться и уцелел благодаря тому, что в последнее время был готов к любой угрозе, с любой возможной и невозможной стороны. Но от такого беспощадного врага нелегко будет укрыться даже на бескрайних просторах. Если всё так пойдет и дальше, вскоре вся страна будет представлять собой лишь два вида пустошей: те, что были тут и прежде, и те, что созданы взрывами."
 nuke_dropped.11.a: "А разве ядерная зима не сделает Москву еще более неприступной целью?"
 nuke_dropped.11.b: "Пусть сожгут все наши города до единого, но взять их они не смогут."

 yugoslavia.2.t: "Независимость Хорватии"
 yugoslavia.2.desc: "Сегодня Хорватия вслед за Словенией объявляет о выходе из Югославии. Сабор принимает декларацию о независимости, Франьо Туджман заявляет, что Хорватия больше не будет частью «коммунистической тюрьмы народов». В Загребе ликуют, в мы молчим. Федеральная армия (ЯНА) получает приказ не вмешиваться - пока.\n\nНо на территории Хорватии живут 600 тысяч сербов, и они не собираются оставаться в независимом государстве, где их называют меньшинством. В Книнской краине местные сербы уже перекрыли дороги и объявили о создании «Сербской автономной области». Оружия у обеих сторон хватает: в 1990-м ЯНА раздала часть арсеналов местным сербским отрядам, хорваты скупали оружие в Венгрии и на чёрном рынке.\n\nВойна ещё не началась, но уже неизбежна. Вопрос только в том, кто первый выстрелит и кто кого поддержит."
 yugoslavia.2.a: "Это незаконно!"
 yugoslavia.2.b: "Отстоим честь Хорватии!"
 yugoslavia.5.t: "Босния объявляет о независимости"
 yugoslavia.5.desc: "Сегодня в Сараево объявлены итоги референдума: 99,4% проголосовали за независимость при явке 63,4%. Сербы референдум бойкотировали - для них это было голосование о выходе из Югославии, в которой они хотят остаться. Алия Изетбегович говорит о суверенной Боснии и Герцеговине, Радован Караджич уже заявляет, что сербы не признают результат и создадут своё государство. В Белграде молчат, но ЯНА по-прежнему контролирует казармы по всей республике.\n\nБосния - не Словения и не Хорватия. Здесь нет моноэтничного большинства: мусульмане, сербы и хорваты живут вперемешку, и у каждой общины есть свои вооружённые отряды. Словения и Хорватия уже получили признание Запада, Македония на очереди. Босния - следующая, и это означает войну на три стороны."
 yugoslavia.5.a: "За оружие!"
 yugoslavia.5.b: "За независимую Боснию!"
 yugoslavia.10.t: "Предложить ли нам перемирие с Хорватией?"
 yugoslavia.10.desc: "Конец 1991 года. Война в Хорватии идёт шестой месяц. Вуковар пал в ноябре, но наша армия увязла в городских боях и потеряла темп. На юге продолжается осада Дубровника - формально на территории Боснии, что уже вызвало международный скандал. Под контролем сербских сил около трети Хорватии, но фронт растянут, а резервы истощены.\n\nГлавная угроза - Босния. Если война перекинется туда, мы получим второй фронт, а Загреб - новых союзников. Вэнс, посланник ООН, уже неделю курсирует между Белградом и Загребом, требуя прекращения огня как условия для ввода миротворцев. Без перемирия не будет ни миротворцев, ни снятия санкций, ни международного признания. Соглашение, подписанное в Женеве 23 ноября, уже провалилось - четырнадцатое по счёту. Обе стороны обвиняют друг друга в нарушениях. Но Вэнс не уходит."
 yugoslavia.10.a: "Подпишем соглашение. За дело!"
 yugoslavia.10.b: "Никаких сделок с сепаратистами!"
 yugoslavia.11.t: "Югославия предлагает перемирие"
 yugoslavia.11.desc: "Конец 1991 года. Вуковар пал, Дубровник под обстрелом, под контролем сербских сил около трети Хорватии. ЯНА предлагает перемирие при посредничестве ООН - план Вэнса. Условия: прекращение огня, ввод миротворцев, вывод Югославской народной армии из Хорватии. Для Загреба это шанс остановить войну и зафиксировать границы. Но перемирие означает заморозку фронта, а значит - сохранение Краины под сербским контролем. Миротворцы не вернут территории, а лишь закрепят раздел. Отказ означает продолжение войны, новые разрушения и риск потерять ещё больше. Но и подписание выглядит как признание, что силой вернуть Краину не удалось. Вопрос не в том, выгодно ли перемирие. Вопрос в том, что будет, если его не подписать. Продолжение войны означает дальнейший износ армии, новые жертвы и риск потерять всё. Перемирие означает паузу, сохранение того, что осталось, и время для перегруппировки. Но оно же - признание, что быстрой победы не будет, и первый шаг к тому, что Краина останется вне Хорватии."
 yugoslavia.11.a: "Давайте подпишем соглашение. Терять нечего."
 yugoslavia.11.b: "Ни за что!"
 yugoslavia.12.t: "Хорватия согласилась"
 yugoslavia.12.desc: "Загреб принял план Вэнса. Сегодня в Сараево подписано перемирие. Условия: прекращение огня, ввод миротворцев ООН, вывод Югославской народной армии из Хорватии. Для Белграда это пауза, а не мир: Краина остаётся под сербским контролем, фронт заморожен. Санкции не сняты, Босния по-прежнему главная угроза. Хорватия получает передышку и путь к международному признанию."
 yugoslavia.12.a: "Для нас это хороший шанс."
 yugoslavia.13.t: "Хорватия отказалась от перемирия"
 yugoslavia.13.desc: "Загреб отверг план Вэнса. Туджман заявил, что не подпишет перемирие, которое закрепляет сербский контроль над Краиной. Хорватия рассчитывает на признание Запада, помощь из Германии и Австрии и на то, что время работает против Белграда. Война продолжается. Фронт под Вуковаром и Дубровником нестабилен, но наша армия не может наступать без пополнений. Санкции ООН остаются, Босния на грани. Для нас это означает: быстрой победы не будет, а каждый новый месяц войны усиливает изоляцию."
 yugoslavia.13.a: "Они сами это сделали."
 yugoslavia.14.t: "Нападать ли нам на Словению?"
 yugoslavia.14.desc: "Война с Хорватией закончена. Краина под контролем, армия выведена, перемирие держится. Теперь на повестке - Словения. Она вышла из Югославии ещё в июне 1991-го, и тогда всё ограничилось десятидневной войной: федеральные силы пытались удержать границы и аэропорт Любляны, но после нескольких стычек и десятков убитых с обеих сторон был подписан Брионский договор, и армия ушла. С тех пор Словения независима, признана Западом и живёт спокойно.\n\nС военной точки зрения нападение бессмысленно. В Словении нет сербского меньшинства, которое нужно «защищать». Она этнически однородна - почти 90% словенцев. Территориальных претензий к ней нет. Она далеко от Белграда, на границе с Австрией и Италией, и любое вторжение означает прямой конфликт с Западом.\n\nС политической точки зрения - тоже. Словения не мешает. Она не угрожает сербам в Краине и не поддерживает Хорватию. Возвращение её силой не даст ни ресурсов, ни стратегических выгод - только новые санкции и новый фронт. Армия и так истощена после Хорватии, экономика в руинах, Босния на грани."
 yugoslavia.14.a: "Мы должны восстановить Югославию!"
 yugoslavia.14.b: "Сейчас точно не время."
 yugoslavia.15.t: "Нападать ли нам на Македонию?"
 yugoslavia.15.desc: "После Хорватии и Словении Македония объявила независимость в сентябре 1991 года. Тогда обошлось без войны: наша армия вышла из республики спокойно, без боёв и потерь. Президент Киро Глигоров выбрал мирный путь и не дал повода для конфликта. С тех пор Македония независима, тоже признана Западом и живёт тихо."
 yugoslavia.15.a: "Нам необходимо восстановить Югославию до конца!"
 yugoslavia.15.b: "Сейчас точно не время."
 finland.1.t: "Выборы 1988 года"
 finland.1.desc: "31 января и 1 февраля 1988 года в Финляндии впервые прошли президентские выборы по новой двухтуровой системе: избиратели голосовали напрямую за кандидата и одновременно выбирали 301 члена коллегии выборщиков. Президент Мауно Койвисто, у власти с 1982 года, шёл на второй срок на фоне экономического подъёма и репутации архитектора «финляндского чуда» - осторожного баланса между Востоком и Западом.\n\nОпросы обещали ему 60–70%, но реальность оказалась иной. Койвисто получил лишь 47,9% - не хватило нескольких процентов до прямого переизбрания. Его соперники усилились в последние недели: Пааво Вяюрюнен от Центра - 20,1%, премьер Харри Холькери от Национальной коалиции - 18,1%, Кaлеви Кивистё от «Движения 88» - 10,4%. Теперь всё решала коллегия выборщиков.\n\n15 февраля выборщики собрались. У Койвисто было 144 голоса - на семь меньше большинства. Холькери, чьи 63 выборщика оказались решающими, призвал их поддержать президента. Во втором туре Койвисто получил 189 голосов и был переизбран. Вяюрюнен довольствовался 68, Кивистё - 26. Холькери вышел из игры, но его союз с Койвисто изменил расклад: «красно-синяя» коалиция премьера и президента удержала власть."
 finland.1.a: "Мауно Койвисто!"
 finland.1.b: "Харри Холкери!"
 finland.1.c: "Пааво Вяюрюнен!"
 greece.1.t: "Выборы 1989 года"
 greece.1.desc: "Греция голосует на фоне самого громкого политического скандала десятилетия - дела банкира Косkотаса. Премьер-министр Андреас Папандреу, возглавляющий ПАСОК с 1981 года, обвиняется в коррупции и получении взяток. Страна устала от социалистов, и опросы предсказывают победу правой партии «Новая Демократия» (НД) под руководством Константина Мицотакиса. Однако незадолго до выборов ПАСОК меняет избирательный закон, вводя усиленную пропорциональную систему. Этот шаг должен не дать победителю получить абсолютное большинство и сохранить влияние социалистов в парламенте.\n\nРезультаты подтверждают прогнозы. НД получает 44,28% голосов и 145 мест, ПАСОК - 39,13% и 125 мест. Левый «Синаспизмос» (коалиция коммунистов и левых) набирает 13,13% и 28 мандатов. Ни одна партия не имеет 151 места, необходимого для формирования правительства. Страна входит в период политического тупика. Чтобы выйти из кризиса, НД и «Синаспизмос» договариваются о создании временного коалиционного правительства «катарсиса» (очищения). Его задача - расследовать коррупционные скандалы ушедшего правительства ПАСОК. Премьер-министром становится компромиссный кандидат Дзаннис Дзаннетакис.\n\nЭто правительство недолговечно: оно должно уйти в отставку после завершения расследований. Однако его создание уже изменило политический ландшафт Греции. Впервые в истории страны коммунисты вошли в правительство, а Папандреу готовится предстать перед специальным судом. Греция стоит на пороге нового политического кризиса: если временное правительство не справится, страну ждут досрочные выборы уже в ноябре."
 greece.1.a: "Поддержим коалицию «катарсиса»."
 greece.2.t: ""
 greece.2.desc: "1992 год. Правительство Мицотакиса, едва удерживающее власть, сталкивается с двумя проблемами, которые могут его обрушить. Первая - экономическая. Жёсткая политика austerity, введённая для сокращения дефицита бюджета, вызывает рост безработицы и массовое недовольство. Страна на грани социального взрыва. Вторая - внешнеполитическая. Развал Югославии ставит Грецию перед сложным выбором. Мицотакис занял жёсткую позицию по вопросу о признании соседней Македонии, настаивая на том, чтобы она сменила своё название, так как «Македония» - историческая греческая область. Эта линия находит поддержку в обществе, но изолирует Грецию на международной арене и грозит конфликтом с Европейским сообществом.Поводом для кризиса становится дополнительный выбор в Афинах (округ B), назначенный после лишения мандата бывшего министра-социалиста. Оппозиция превращает его в референдум о доверии правительству. «Новая Демократия» решает бойкотировать голосование, чтобы избежать унизительного поражения. Но это лишь подтверждает слабость власти. Социалисты ПАСОК побеждают с огромным перевесом, что усиливает давление на Мицотакиса и ставит вопрос о вотуме недоверия в парламенте."
 greece.2.a: "Новая эпоха."
 iceland.1.t: "Выборы 1987 года"
 iceland.1.desc: "Исландия голосует на фоне растущей инфляции и огромного государственного долга. Правящая коалиция Независимой партии и Прогрессивной партии теряет большинство: вместе они получают 31 место из 63 вместо 37. Независимая партия во главе с Торстейдном Паульссоном, министром финансов, терпит худшее поражение в своей истории - 27,2% и 18 мест. Причина - раскол: исключённый из партии Альберт Гудмундссон создаёт популистскую Партию граждан, которая забирает 10,9% и 7 мест.\n\nГлавный сюрприз - Женский альянс, удвоивший представительство до 6 мест с 10,1% голосов. Социал-демократы усиливаются до 10 мест, Народный альянс теряет два. Традиционная четырёхпартийная система трещит по швам, и начинаются долгие коалиционные торги. Только 8 июля Торстейдн Паульссон становится премьер-министром во главе трёхпартийной коалиции - Независимой партии, Прогрессивной и Социал-демократической."
 iceland.1.a: "Формировать трёхпартийную коалицию с социал-демократами."
 iceland.2.t: "Выборы 1988 года"
 iceland.2.desc: "Коалиция Торстейнна Паульссона развалилась. Экономика в тяжёлом состоянии - инфляция, растущий долг, а главное, спор о расширении алюминиевого завода в Страумсвике, который расколол правительство и общество. Стейнгримюр Херманнссон, лидер Прогрессивной партии, проявляет хладнокровие и инициирует переговоры, чтобы сформировать новый кабинет. Он ведёт переговоры с левыми и добивается согласия на строительство завода, что решает ключевой спор.\nНовое правительство приведено к присяге. В него вошли Прогрессивная партия, Социал-демократическая партия и Народный альянс - впервые коммунисты получили министерские портфели, включая Ólafur Ragnar Grímsson в качестве министра финансов. Херманнссон снова становится премьер-министром, а его кабинет обещает экономическую стабилизацию и продолжение расширения алюминиевой промышленности."
 iceland.2.a: "Поддержим коалицию."
 iceland.3.t: "Выборы 1991"
 iceland.3.desc: "20 апреля 1991 года. Исландия голосует после трёх лет нестабильных коалиций. Независимая партия во главе с новым лидером Давидом Оддссоном, мэром Рейкьявика, возвращает утраченные позиции: 38,6% голосов и 26 мест из 63 - её лучший результат за десятилетие. Прогрессисты получают 13 мест, социал-демократы - 10, Народный альянс - 9, Женский список - 5, Партия граждан теряет всё. Явка - 87,6%.\n\nОддссон, приведённый к присяге 30 апреля, формирует коалицию с социал-демократами - 36 мест в парламенте. Его цель ясна: либерализация экономики, приватизация убыточных предприятий, снижение налогов и использование вырученных средств на погашение государственного долга. Он сохраняет систему квот на вылов рыбы и укрепляет пенсионную систему. Экономика, ещё недавно страдавшая от инфляции и austerity, начинает расти."
 iceland.3.a: "Поддержать коалицию с социал-демократами."
 soviet_union.1.t: "Константин Черненко умер..."
 soviet_union.1.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза."
 soviet_union.1.a: "Нужно что-то делать!" # Горбачев
 soviet_union.2.t: "Выборы нового Генерального секретаря"
 soviet_union.2.desc: "Леонид Брежнев символизировал застой и игнорирование насущных проблем, которые только накапливались все эти десятилетия. Брежнев умер, за ним и Андропов, теперь - Черненко. Нам предстоит решить дальнейшую судьбу Советского Союза. Перед нами стоит выбор между либеральным Горбачевым и сталинистом Романовым. Кому теперь суждено править СССР?"
 soviet_union.2.a: "Нам нужны либеральные реформы! За Горбачева!" # Горбачев
 soviet_union.2.b: "Нет Горбачёву! Нам нужен Романов!"
 soviet_union.3.t: "События в Вильнюсе"
 soviet_union.3.desc: "В ночь с 12 на 13 января 1991 года после трагических событий в Вильнюсе, где советские спецподразделения при поддержке бронетехники заняли телецентр, убив 14 человек, в Риге началось массовое движение протеста. 13 января около полумиллиона человек собрались на набережной Даугавы на митинг Народного фронта, после которого жители приступили к возведению баррикад в Старой Риге и других районах города. Строились защитные сооружения вокруг здания Верховного Совета, телевидения, мостов и других стратегических объектов. Кульминацией противостояния стало 20 января, когда рижский ОМОН, оставшийся верным союзной присяге, предпринял попытку штурма здания Министерства внутренних дел Латвии. В ходе перестрелки в центре Риги погибли пять человек: школьник Эдийс Риекстиньш, двое сотрудников органов внутренних дел - Владимир Гомонович и Сергей Кононенко, а также операторы Рижской киностудии Андрис Слапиньш и Гвидо Звайгзне. Баррикады простояли до 27 января, став символом сопротивления латвийского народа и важнейшим этапом на пути к восстановлению независимости республики."
 soviet_union.3.a: "Ясно."
 soviet_union.4.t: "Референдум о сохранении СССР"
 soviet_union.4.desc: "17 марта 1991 года в Советском Союзе прошёл Всесоюзный референдум о сохранении обновлённого Союза Советских Социалистических Республик как федерации равноправных республик. В бюллетень был вынесен единственный вопрос: «Считаете ли Вы необходимым сохранение Союза Советских Социалистических Республик как обновлённой федерации равноправных суверенных республик, в которой будут в полной мере гарантироваться права и свободы человека любой национальности?»."
 soviet_union.4.a: "Новый Союз - будет!"
 soviet_union.5.t: "III Съезд народных депутатов РСФСР"
 soviet_union.5.desc: "В самый разгар противостояния союзного центра и российской власти открывается Третий (внеочередной) Съезд народных депутатов РСФСР. Инициатором его созыва выступил Кремль - задача ставилась чёткая: используя противников Ельцина, которых в депутатском корпусе насчитывалось до 80%, снять его с должности Председателя Верховного Совета. Однако ещё до открытия съезда по всей стране развернулась массовая агитация в поддержку Ельцина.\n\nЗа несколько дней до начала работы наши власти попытались взять ситуацию под контроль. 25 марта Кабинет министров СССР запретил проведение любых митингов и демонстраций в Москве до 15 апреля. А 26 марта Михаил Горбачёв издал указ о выводе московской милиции из-под юрисдикции РСФСР, напрямую подчинив её союзному МВД. В день открытия съезда центр Москвы был наводнён военной техникой, милицией и ОМОНом.\n\nСъезд ответил мгновенно: принято постановление о приостановке действия обоих документов как нарушающих Конституцию СССР и Декларацию о государственном суверенитете России. Съезд прервал работу до 29 марта, а затем продолжил - с нарастающим давлением на Кремль."
 soviet_union.5.a: "Ура!"
 soviet_union.6.t: "Войска в Москве"
 soviet_union.6.desc: "Накануне открытия III внеочередного Съезда народных депутатов РСФСР союзное руководство предприняло беспрецедентные меры. 25 марта 1991 года Кабинет министров СССР запретил проведение любых митингов и демонстраций в Москве до 15 апреля. 26 марта Михаил Горбачёв издал указ о переподчинении московской милиции напрямую союзному МВД. А 27 марта, по настоянию КГБ, президент дал добро на ввод в Москву армейских подразделений. Это было сделано впервые за все годы перестройки."
 soviet_union.6.a: "О боже..."
 soviet_union.7.t: "Встреча в Женеве"
 soviet_union.7.desc: "Ноябрьское утро над Женевским озером выдалось туманным. М.С. Горбачёв прибыл во Дворец Наций, чтобы встретиться с президентом США - впервые за многие годы мы сядем за стол переговоров без привычной риторики «холодной войны». За плечами - изнурительная гонка вооружений, которая истощает экономику, и «Звёздные войны» (СОИ), которые грозят сделать наш ядерный арсенал устаревшим."
 soviet_union.7.a: "Любые уступки ради мира."
 soviet_union.8.t: "Авария на Чернобыльской АЭС"
 soviet_union.8.desc: "Сегодня, 26 апреля 1986 года, в 1:23 ночи, на четвёртом энергоблоке Чернобыльской АЭС произошёл мощный взрыв во время проведения испытаний восьмого турбогенератора. Взрыв полностью разрушил реактор, вызвав один из крупнейших техногенных выбросов радиоактивных веществ в истории. В атмосферу попали изотопы урана, плутония, йода-131, цезия-134, цезия-137 и стронция-90. В ликвидации последствий приняли участие тысячи людей, многие из которых получили серьёзные дозы радиации." 
 soviet_union.8.a: "Вечная память нашим героям!"
 soviet_union.9.t: "Шеварднадзе - новый министр иностранных дел"
 soviet_union.9.desc: "Лето 1985 года. Вы сидите в своём кабинете в Кремле, перебирая досье кандидатов на пост министра иностранных дел. Андрей Андреевич Громыко - «Мистер Нет», легенда советской дипломатии, человек, который пережил восемь генсеков, - согласен уступить кресло в обмен на почётную должность председателя Президиума Верховного Совета. Но кого поставить на его место?Ваш взгляд падает на папку с пометкой «Тбилиси». Эдуард Шеварднадзе. Первый секретарь ЦК Компартии Грузии. Человек, с которым вы знакомы ещё с комсомольских времён - тогда вы вместе прогуливались по берегу Чёрного моря и говорили о том, что «так жить больше нельзя». Он не дипломат. Он не знает иностранных языков. Он ни разу не был за границей. Громыко в ужасе предлагает вам на замену опытнейшего посла в США Анатолия Добрынина."
 soviet_union.9.a: "Идеальная кандитатура"
 soviet_union.10.t: "Антиалкогольная кампания"
 soviet_union.10.desc: "В 1985 году борьба с пьянством становится нашим приоритетом. Постановление ЦК КПСС «О преодолении пьянства и алкоголизма» предполагает радикальное сокращение производства и продажи спиртного, закрытие винных магазинов, перепрофилирование заводов и создание массовых обществ трезвости. Успех кампании укрепит здоровье нации, но ударит по бюджету (потеря акцизов) и вызовет рост недовольства среди населения, но это вынужденная мера. В долгосрочной перспективе - снижение смертности и рост рождаемости, но в краткосрочной - риск социальной напряжённости и расцвета самогоноварения."
 soviet_union.10.a: "Это была вынужденная мера"
 soviet_union.11.t: "Горбачёв - президент СССР"
 soviet_union.11.desc: "Март 1990 года. Наша страна задыхается в тисках экономического кризиса, националистические движения сотрясают союзные республики, а старая партийно-советская система управления даёт трещину. В этих условиях Внеочередной III Съезд народных депутатов СССР принимает судьбоносное решение - учредить пост Президента Советского Союза и избрать на него первого главу государства."
 soviet_union.11.a: "Поддержим Горбачёва. Пусть станет президентом!"
 soviet_union.12.t: "Беспорядки в союзных республиках"
 soviet_union.12.desc: "«1990 год входит в историю СССР как год «парада суверенитетов». Одна за другой союзные республики принимают Декларации о государственном суверенитете, заявляя о верховенстве своих законов над общесоюзными. Прибалтика требует немедленного вывода войск, Армения и Азербайджан уже несколько лет живут в состоянии замороженного конфликта вокруг Нагорного Карабаха, Грузия бойкотирует референдумы, а Молдавия балансирует на грани гражданской войны между молдаванами и гагаузами. \nПо всей стране прокатываются митинги и забастовки. В Тбилиси демонстранты требуют независимости, в Душанбе - отставки местного руководства, в Киеве - возрождения Украинской автокефальной церкви. Центральные власти теряют контроль над ситуацией, а экономика, и без того ослабленная кризисом, трещит по швам из-за разрыва хозяйственных связей между республиками."
 soviet_union.12.a: "Союз должен быть неделимым"
 soviet_union.13.t: "Декларация о гос. суверенитете РСФСР"
 soviet_union.13.desc: "12 июня 1990 года. В разгар «парада суверенитетов», когда прибалтийские республики уже заявили о выходе из Союза, а Украина готовила собственную Декларацию, Первый Съезд народных депутатов РСФСР принимает исторический документ - Декларацию о государственном суверенитете Российской Советской Федеративной Социалистической Республики."
 soviet_union.13.a: "Пусть Россия будет центром обновлённой федерации"
 soviet_union.14.t: "XXVII Съезд КПСС"
 soviet_union.14.desc: "25 февраля 1986 года в Кремлёвском Дворце съездов открывается XXVII Съезд Коммунистической партии Советского Союза. Это первый партийный форум после прихода к власти Михаила Горбачёва, и он сразу становится ареной острой политической борьбы между консерваторами и сторонниками реформ."
 soviet_union.14.a: "Дадим дорогу Перестройке!"
 soviet_union.15.t: "Визит в Венгрию"
 soviet_union.15.desc: "8 июня 1986 года. Самолёт Ил-62 с бортовым номером CCCP-86494 приземляется в будапештском аэропорту Ферихедь. Михаил Сергеевич Горбачёв, Генеральный секретарь ЦК КПСС, прибывает с первым зарубежным визитом в социалистическую страну после чернобыльской катастрофы - и выбирает для этого Венгрию, самую либеральную из стран Варшавского договора. Встреча с венгерским руководством продлится примерно четыре дня, включая участие в заседании Политического Консультативного комитета стран-участниц Варшавского договора."
 soviet_union.15.a: "Поддержим реформы в Венгрии"
 soviet_union.16.t: "Крушение рейса Аэрофлот 2306 в Коми АССР"
 soviet_union.16.desc: "2 июля 1986 года в 75 километрах от Сыктывкара, в густых лесах Сысольского района, потерпел катастрофу Ту-134АК, выполнявший рейс №2306 по маршруту Воркута - Сыктывкар - Москва. Через 32 минуты после вылета из Сыктывкара на высоте 5600 метров сработала сигнализация «Дым в заднем багажнике». Бортмеханик подтвердил возгорание, и командир экипажа принял решение об экстренной посадке. Но до аэродрома лайнер не долетел - пожар стремительно уничтожал самолёт, и он рухнул на лесной массив в 9,5 километрах от посёлка Копса.\n\nИз 92 человек, находившихся на борту (86 пассажиров, в том числе 19 детей, и 6 членов экипажа), спастись удалось лишь 38. 54 человека погибли - одни сгорели заживо, другие задохнулись в дыму ещё до того, как самолёт коснулся земли. Выжившие ждали помощи часами: спасательный вертолёт прибыл только через три часа, а полноценная эвакуация началась спустя семь.\n\nРасследование установило, что причиной пожара, скорее всего, стала бензопила «Урал» в разобранном виде, которую двое граждан Болгарии провезли в ручной клади. Топливный бак с остатками горючего был обнаружен на месте крушения в районе заднего багажного отделения. Досмотр багажа в аэропорту Воркуты не проводился."
 soviet_union.16.a: "Покойтесь с миром..."
 soviet_union.17.t: "Крушение теплохода «Адмирал Нахимов» в Чёрном море"
 soviet_union.17.desc: "31 августа 1986 года, в 23 часа 12 минут, круизный пароход «Адмирал Нахимов», на борту которого находилось 1243 человека, столкнулся с сухогрузом «Петр Васев» в Цемесской бухте близ Новороссийска. Удар пришёлся в правый борт парохода, образовалась пробоина высотой 10 метров и длиной более 8 метров - около 90 квадратных метров. Вода хлынула в открытые иллюминаторы, и через семь-восемь минут судно затонуло в четырёх километрах от берега. Спасти удалось 836 человек, погиб 423 человека - 359 пассажиров и 64 члена экипажа. Крупнейшая катастрофа в истории отечественного пассажирского флота произошла в разгар перестройки, в прямой видимости берега, при ясной погоде и навигационном оборудовании. Оба капитана впоследствии были осуждены условно."
 soviet_union.17.a: "Покойтесь с миром..."
 soviet_union.18.t: "«Песенные марши» в Прибалтике"
 soviet_union.18.desc: "Вторая половина 1980-х годов. Политика гласности открывает шлюзы для долго подавляемой исторической памяти. В Эстонии, Латвии и Литве одно за другим проходят массовые мероприятия, посвящённые жертвам сталинских репрессий и депортаций. То, что начиналось как культурные акции - песенные фестивали, концерты, патриотические вечера - стремительно приобретает политическое звучание. \nВ 1987 году в Таллинне и Риге проходят первые открытые митинги, приуроченные к годовщинам массовых депортаций 1941 и 1949 годов. Люди выходят на улицы с цветами и фотографиями родственников, погибших в лагерях. В Литве движение «Саюдис» организует многотысячные собрания, на которых звучат песни о депортациях и призывы к восстановлению справедливости. \nКульминацией этого процесса становится «Балтийский путь» 23 августа 1989 года - в день 50-летия подписания пакта Молотова-Риббентропа. Около двух миллионов человек, взявшись за руки, образуют живую цепь длиной почти 670 километров, соединяющую Таллин, Ригу и Вильнюс."
 soviet_union.18.a: "Ограничимся введением гарнизона для наблюдения"
 soviet_union.19.t: "Указ «Об образовании Государственного комитета по охране природы»"
 soviet_union.19.desc: ""
 soviet_union.19.a: "Правильно!"
 soviet_union.20.t: "Визит Горбачёва в Чехословакию"
 soviet_union.20.desc: "Визит Горбачёва в Чехословакию"
 soviet_union.20.a: "Да здравствует Горбачёв!"
 soviet_union.21.t: "Избрание Дмитрия Язова"
 soviet_union.21.desc: "Избрание Дмитрия Язова"
 soviet_union.21.a: "Ура!"
 soviet_union.22.t: "Митинг «Демократической России» на Манежной площади в Москве"
 soviet_union.22.desc: "Начало 1990-х. Манежная площадь в Москве заполнена десятками тысяч людей. Над толпой — трехцветные флаги и транспаранты реформаторов. Ораторы сменяют друг друга, площадь гудит от аплодисментов и выкриков. Атмосфера наэлектризована: страна требует перемен, и этот митинг становится зримым доказательством того, что старая эпоха уходит. Это битва за новую историю."
 soviet_union.22.a: "За демократическую Россию!"
 soviet_union.23.t: "Авторитет Михаила Горбачёва падает"
 soviet_union.23.desc: "Конец 1980-х. Ещё вчера Михаил Горбачёв был кумиром миллионов - символом обновления и надежды. Но сегодня его рейтинг стремительно падает. Слишком медленные реформы разочаровывают либералов, слишком радикальные - пугают консерваторов. В очередях и на кухнях всё чаще звучит одно и то же: «Он не справляется».\n\nПресса, ещё недавно воспевавшая генсека, теперь пестрит критическими статьями. В регионах растёт недовольство, а в партийных верхах зреет заговор. Авторитет Горбачёва тает с каждым днём - страна устала ждать, а он мечется между двумя огнями, теряя контроль над ситуацией."
 soviet_union.23.a: "Долой Горбачёва!"
 soviet_union.24.t: "XIX Всесоюзная конференция КПСС"
 soviet_union.24.desc: "В Москве началась XIX Всесоюзная конференция КПСС, ставшая важнейшей вехой в истории Перестройки. Делегаты, собравшиеся в Кремлевском дворце съездов, столкнулись с беспрецедентным для советской эпохи уровнем открытости и остроты дискуссий. Главной темой повестки дня стала коренная реформа политической системы СССР, направленная на то, чтобы вдохнуть новую жизнь в стагнирующие государственные институты и разграничить функции партийных органов и Советов. С трибуны конференции Михаил Горбачёв провозгласил курс на передачу власти от партийных комитетов выборным Советам народных депутатов, создание нового Съезда народных депутатов и введение альтернативных выборов. В ходе бурных дебатов делегаты открыто обсуждали нарастающий кризис межнациональных отношений в республиках, проблемы гласности, борьбу с бюрократизмом и необходимость подготовки нового Союзного договора. Главным событием конференции стало жесткое политическое столкновение, когда Борис Ельцин подверг резкой критике медленные темпы реформ и партийные привилегии, а лидер консервативного крыла Егор Лигачёв бросил ему в ответ историческое «Борис, ты не прав!», защищая основы советского строя."
 soviet_union.24.a: "ОК"
 soviet_union.25.t: "Визит Горбачёва в Китай"
 soviet_union.25.desc: ""
 soviet_union.25.a: "Ура!"
