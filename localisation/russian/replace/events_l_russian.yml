 russia.15.t: "Выборы о суверенитете Татарстана"
 russia.15.desc: "Федеральный центр так и не подписал договор с Казанью до наступления осени. На фоне политического тупика в республике прошел референдум. Большинство населения проголосовало «ЗА» полную государственную независимость. Что мы будем делать?"
 russia.15.a: "Мы вынуждены признать их независимость..."
 russia.15.b: "Это незаконно! Мы наведем там порядок силой!"
 russia.16.t: "Кризис на Северном Кавказе"
 russia.16.desc: "Пока внимание всей страны приковано к событиям в Татарстане, южные рубежи России оказались на грани катастрофы. Пользуясь слабостью федерального центра и отвлечением основных сил армии на Поволжье, чеченское руководство во главе с Джохаром Дудаевым резко активизировало свои действия.\n\nРазведка докладывает о массовой переброске оружия и радикально настроенных добровольцев в соседние республики — Дагестан, Северную Осетию и Кабардино-Балкарию. На дорогах гремят взрывы, совершаются налеты на военные склады, а местная милиция деморализована и не контролирует ситуацию. Сепаратисты открыто готовят вооруженный переворот на всем Северном Кавказе. Если мы не предпримем срочных мер, юг страны будет полностью потерян."
 russia.16.a: "Нужно срочно что-то делать."
 russia.17.t: "Россия предлагает территориальные уступки"
 russia.17.desc: "Оказавшись на грани сокрушительной войны на два фронта, российское руководство пошло на беспрецедентные и унизительные уступки. В Грозный экстренно прибыла официальная правительственная делегация из Москвы с конфиденциальным предложением.\n\nРади сохранения мира на своих южных рубежах Кремль готов полностью вывести федеральные войска и без единого выстрела передать под контроль Чеченской Республики Ичкерия всю территорию Северной Осетии. Взамен российская сторона требует немедленного прекращения приграничных террористических стычек, разоружения диверсионных отрядов в Дагестане и подписания долгосрочного пакта о ненападении.\n\nПеред нами стоит судьбоносный выбор: забрать стратегически важный регион мирным путем и зафиксировать геополитическую победу, либо отвергнуть компромисс и поднять весь Северный Кавказ на тотальную войну против ослабленной России.
 russia.17.a: "Нас это устраивает. Мир."
 russia.17.b: "Нет! нам этого недостаточно. Нам нужен ещё Дагестан."
 russia.18.t: "Чечня согласилась на наши условия"
 russia.18.desc: "Из Грозного пришли официальные известия: Джохар Дудаев принял наше предложение и согласился ограничить свои притязания. Понимая, что прямая война с Россией может обернуться катастрофой для Ичкерии.\n\nВ соответствии с договоренностями, российские регулярные части и внутренние войска покидают территорию Северной Осетии, передавая контроль местным чеченским формированиям. Взамен Грозный официально прекратил поддержку диверсионных групп на Кавказе, отозвал боевиков из Дагестана и подписал с нами долгосрочный пакт о ненападении.\n\nВ Москве и армии это решение многие называют позорным отступлением и слабостью. Однако стратегически Кремль добился главного: южные рубежи временно стабилизированы, а угроза войны на два фронта ликвидирована. Теперь вся мощь нашей армии может быть брошена на подавление мятежа в Поволжье."
 russia.18.a: "Отлично."
 russia.19.t: "Чечня требует еще и Дагестан"
 russia.19.desc: "Аппетиты Грозного выросли до предела. Почувствовав слабость федерального центра, скованного тяжелыми боями в Поволжье, Джохар Дудаев решил пойти ва-банк. В Москву пришел официальный и бескомпромиссный ультиматум со стороны Чеченской Республики Ичкерия.\n\nЧеченское руководство заявляет, что ради «обеспечения безопасности и стабильности на Кавказе» под контроль Грозного должны быть немедленно и полностью переданы не только Северная Осетия, но и стратегически важный Дагестан с его выходом к Каспийскому морю. Дипломаты Дудаева открыто заявляют: либо российские войска добровольно и без боя покидают оба региона в течение сорока восьми часов, либо армия ЧРИ и тысячи кавказских добровольцев переходят в полномасштабное наступление по всему южному фронту.\n\nПеред нами стоит катастрофический выбор: пойти на колоссальное территориальное унижение и фактически отдать Кавказ без боя, либо отвергнуть наглый ультиматум и ввязаться в затяжную, кровопролитную войну на два фронта."
 russia.19.a: "Нет. Мы не можем сейчас воевать на два фронта. Отдаем территории."
 russia.19.b: "Они что, совсем охренели? Фиг им!"
 russia.20.t: "Россия согласилась на наши условия"
 russia.20.desc: "Невероятно, но наш смелый дипломатический блеф увенчался абсолютным историческим успехом. Оказавшись в тисках тяжелейшего кризиса в Поволжье и панически боясь открытия полноценного южного фронта, правительство в Москве полностью капитулировало перед нашими требованиями.\n\nИз Кремля пришел официальный ответ за подписью российского руководства: Россия соглашается на мир на всех условиях Грозного. Федеральные войска, милиция и внутренние войска РФ в спешном порядке, бросая тяжелую технику и склады с оружием, покидают территории Северной Осетии и Дагестана. Передовые отряды Вооруженных сил Ичкерии уже входят в Махачкалу и Владикавказ под ликование местных сторонников.\n\nДжохар Дудаев вписал свое имя в историю: без единого крупного сражения Чечня не просто отстояла свободу, но и расширилась до Каспийского моря, став главной силой на всем Северном Кавказе. Вся кавказская геополитика изменилась навсегда."
 russia.20.a: "Аллах акбар!"
 russia.21.t: "Россия отказалась."
 russia.21.desc: "Наш расчет на панику в Москве не оправдался. Российское руководство наотрез отказалось подписывать капитуляцию и отдавать Дагестан с Северной Осетией. Вместо приказа о выводе войск из Кремля пришел жесткий и бескомпромиссный ответ: федеральный центр не уступит сепаратистам ни единого метра земли и готов защищать целостность государства силой оружия.\n\nПо всем каналам связи приходят экстренные новости - российская авиация поднята в воздух, а бронетанковые колонны федеральных сил начали выдвижение к границам Ичкерии. В приграничных районах Дагестана и Осетии наши диверсионные группы уже вступили в первые тяжелые бои с регулярными частями армии РФ.\n\nМаски сброшены. Россия выбрала войну на два фронта, а значит, у нас больше нет пути назад. Джохару Дудаеву пора отдать приказ о начале генерального наступления и поднять весь Кавказ на священную войну за свободу."
 russia.21.a: "Аллаху акбар! Постоим за наши интересы!"
 russia.22.t: "Парад суверенитетов: Отделение Якутии"
 russia.22.desc: "Экономический хаос и затяжная война на Волге нанесли смертельный удар по нашему авторитету. Видя, что мы теряем контроль над страной, Верховный Совет Республики Саха (Якутия) объявил о полной государственной независимости.\n\nМестные власти в Якутске переподчинили себе все алмазодобывающие и золотодобывающие предприятия, прекратив отчисления в федеральный бюджет. Наши попытки связаться с регионом провалились - Якутия официально уходит в свободное плавание. Наша стабильность подорвана, а казна пустеет."
 russia.22.a: "Мы теряем контроль над Сибирью..."
 russia.23.t: "Эффект домино: Полный распад"
 russia.23.desc: "Катастрофа нарастает как снежный ком. Примеру Якутии последовала целая череда регионов, окончательно разорвавших связи с разваливающейся метрополией.\n\nВ Петрозаводске объявили о суверенитете Карелии и начале переговоров с Хельсинки. На юге Сибири Тува провозгласила восстановление независимой Танну-Тывы. Если кавказский фронт еще не поглотил Дагестан, то местные элиты в Махачкале, спасаясь от хаоса, также объявили об отделении от России. Государство буквально тает на глазах, а армия деморализована."
 russia.23.a: "Россия рассыпается на куски..."
 russia.24.t: "Переворот «Памяти» в Москве"
 russia.24.desc: "Москва, осень 1993 года. Страна разваливается на глазах. Татарстан объявил о независимости ещё в 1992-м, за ним потянулись Чечня, Тува и Карелия. В Чечне уже нет российской власти - Дудаев выгнал всех, кто представлял Москву. В Казани, Кызыле и Петрозаводске сидят свои правительства, которые не отчитываются ни перед Кремлём, ни перед кем-либо ещё. Армия развалена, офицеры месяцами не получают жалованья, солдаты дезертируют.\n\nЭкономика в руинах, рубль падает, регионы вводят талоны и закрывают границы. Ельцин мечется между уступками и угрозами, но никто уже не верит, что он способен удержать страну.В этот момент на сцену выходит Александр Лебедь. Генерал-лейтенант, прошедший Афганистан и Приднестровье, командовавший 14-й армией. Его знают как человека, который не боится говорить правду и не раздаёт обещаний, которые не может выполнить. За ним - офицерский корпус, уставший от унижений, и часть армии, которая ещё способна воевать. Ходят слухи, что Лебедь готовит «сводную роту» из тех, кто «ещё не навоевался», и что в его окружении обсуждают силовое решение кризиса.\n\nСитуация взрывается за одну ночь. Танковые части, верные Лебедю, блокируют центр Москвы. Ключевые здания заняты без выстрелов. Ельцин отрезан на даче, связь с ним нестабильна. Лебедь выступает по телевидению: он говорит о «спасении страны», о «наведении порядка» и о том, что «дальше так жить нельзя». Он не называет себя диктатором, но и не скрывает, что берёт власть в свои руки. Первым делом он обещает вернуть Чечню, Татарстан, Туву и Карелию - силой, если придётся."
 russia.24.a: "Смерть сепаратистам!"
 russia.25.t: "Появление антидудаевской оппозиции"
 russia.25.desc: "В Чечне зреет раскол. С 1992 года Дудаев правит без парламента и без закона: оппозиция разогнана, митинги разогнаны, несогласных выдавливают из Грозного. Но недовольных становится больше. Бывшие сторонники - полевые командиры, вчерашние союзники, главы районов - всё чаще говорят, что Дудаев ведёт республику в тупик. Экономика развалена, нефть уходит непонятно куда, оружия на руках больше, чем работы. В Надтеречном районе уже открыто собирают отряды, которые не подчиняются Грозному. Во главе - Лабазанов, бывший офицер, и Умаров, человек с репутацией, но без большой силы.\n\nМы смотрим на это с интересом. Антидудаевская оппозиция - это шанс вернуть Чечню под контроль без большой войны. Но если её поддержать, она может стать проблемой: эти люди воевали против России и не собираются сдавать оружие. Если не поддержать, Дудаев задавит их сам, и тогда в республике не останется никого, кроме него. В Грозном уже говорят, что оппозиция - ставленники Кремля, и это недалеко от правды."
 russia.25.a: "Об этом никто не должен узнать."
 russia.26.t: "Провал Штурма Грозного оппозицией"
 russia.26.desc: "Сегодня оппозиция пошла на Грозный. Колонны танков и бронетранспортёров двинулись к центру города, рассчитывая на быстрый захват - по данным разведки, у Дудаева мало сил и он не удержится. Расчёт не оправдался. На улицах колонны попали в засады, танки горели один за другим, связи между отрядами не было, командиры действовали сами по себе. К вечеру от штурма остались десятки сожжённой техники и пленные. Дудаев объявил это победой и доказательством того, что Москва воюет против Чечни чужими руками.\n\nДля России это провал, который трудно скрыть. Официально Москва ни при чём, но пленные признаются, что служили в российской армии, а техника - армейская. Дудаев получил повод говорить о российской агрессии, а оппозиция потеряла почти всё, что имела. В Грозном теперь никто не верит, что Москва способна решить чеченский вопрос чужими руками. Остаётся либо признать провал и отступить, либо идти на прямую интервенцию."
 russia.26.a: "Плохо. Придётся вводить войска."
 russia.27.t: "Первая чеченская война"
 russia.27.desc: "11 декабря 1994 года. Колонны российской армии пересекли административную границу Чечни с трёх направлений - с Дагестана, Ингушетии и Северной Осетии. Официально это называется «восстановлением конституционного порядка». Фактически - начало полномасштабной войны. В операции задействованы армейские части, внутренние войска, спецназ, авиация. Командование обещает быструю и победоносную кампанию: Грозный возьмут за несколько дней, Дудаева отстранят, порядок восстановят.\n\nРеальность оказалась другой с первых же суток. Колонны растянулись на десятки километров, связь между частями нестабильна, разведка дала неверные данные о силах противника. Уже под Кизляром и Моздоком начались первые стычки. В Грозном ждали штурма, но к нему никто толком не готовился. В тылу - недовольство: в Ингушетии и Дагестане местное население встречает колонны без энтузиазма, а местами враждебно. На Западе уже готовят заявления с осуждением. Внутри России никто не объяснил, зачем это нужно и надолго ли."
 russia.27.a: "Грозный возьмём двумя десантными полками за два часа."
 tatarstan.1.t: "Кризис власти в Казани"
 tatarstan.1.desc: "Начало войны с Россией раскололо республику. Умеренное правительство потеряло контроль над ситуацией. На улицах Казани решается судьба государства: к власти рвутся радикальные националисты и сплоченные отряды ветеранов."
 tatarstan.1.a: "Передать власть Фаузии Байрамовой! Мобилизовать национальную гвардию!"
 tatarstan.1.b: "Формировать Военный Совет! Ветераны Афганистана берут командование!"
 iraq.1.t: "Ирак предлагает мир на своих условиях"
 iraq.1.d: "Прошло пять лет с начала войны. Ирак, захватив несколько наших городов, предложил мир - но на своих условиях. Требования Саддама просты: Хузестан отходит Ираку, а все ресурсы региона переходят под его полный контроль. Фактически это капитуляция, замаскированная под мирный договор.\n\nДля нас это означает потерю богатейшей провинции, нефтяных месторождений и выхода к Персидскому заливу. Принять такие условия - значит признать поражение и отдать то, за что мы воевали пять лет. Отказаться - значит продолжать войну, которая уже истощила нашу армию и экономику."
 iraq.1.a: "Мы согласны, капитуляция"
 iraq.1.b: "Ни за что!"
 iraq.2.t: "Вторгаться ли нам в Кувейт?"
 iraq.2.d: "Август 1990 года. Восемь лет войны с Ираном оставили нас в долгах - десятки миллиардов, половина Западу, половина арабским монархиям Залива. Экономика не восстановилась, нефтяные цены низкие, а Кувейт и ОАЭ добывают сверх квот ОПЕК, обваливая рынок. Мы обвиняем Кувейт в экономической войне: он качает нефть из пограничного месторождения Румайла, используя наклонное бурение, и отказывается списать долги. Дипломатия не работает.\n\nВ Багдаде всё громче говорят, что Кувейт слаб, его армия небоеспособна, а Запад занят падением Берлинской стены и вряд ли ввяжется. Арабский мир, возможно, ограничится осуждением. Захват Кувейта решил бы финансовые проблемы одним ударом: нефть, порты, выход к Заливу. Но это открытая агрессия против соседа, и реакция США неизвестна. Американские дипломаты намекали, что у Вашингтона нет обязательств по защите Кувейта, но полагаться на это рискованно.\n\nНам нужно вторгнуться и аннексировать Кувейт, или ограничиться давлением и дипломатией или занять спорные пограничные районы и нефтяные поля, не идя на полную оккупацию. Вторжение будет быстрым, но последствия могут оказаться катастрофическими. Дипломатия безопаснее, но Кувейт не уступает. Ограниченная операция даёт рычаг, но может перерасти в большую войну."
 iraq.2.a: "Да, возвращайся, 19-ая провинция!"
 iraq.2.b: "Нет, лучше отложим вторжение."
 iraq.3.t: "Наша капитуляция"
 iraq.3.d: "Операция «Буря в пустыне» длилась сорок три дня. Авиация коалиции уничтожила инфраструктуру, мосты, электростанции и связь. Наземная фаза коалиции увенчалась успехом: наша армия в Кувейте разгромлена, дивизии Республиканской гвардии разбиты, тысячи танков брошены в пустыне. Отступление из Кувейта превратилось в бойню на шоссе близ Басры.\n\nУсловия тяжелые. Мы выводим войска из Кувейта, признаём его суверенитет и платим репарации. Вокруг нашей территории - бесполётные зоны на севере и юге, куда наша авиация не имеет доступа. Экономические санкции сохраняются, нефть продавать почти нельзя. Республиканская гвардия сохранилась, но потеряла технику и репутацию. На юге шииты поднимают восстание, на севере курды берутся за оружие. Армия деморализована, но ещё держит Багдад.\n\nВнутри страны зреет недовольство: кто-то обвиняет режим в авантюре, кто-то - в предательстве. Офицеры шепчутся о перевороте. Соседи наблюдают. США дают понять, что добивать нас не собираются, если мы удержим власть и не тронем курдов и шиитов."
 iraq.3.a: "Да, так будет лучше для всех."
 iraq.4.t: "Иран соглашается"
 iraq.4.d: "Тегеран сдался. После пяти лет войны, после того как наши дивизии удержали города Ирана и вышли к Ахвазу, иранская делегация в Вене подписала мир на наших условиях. Хомейни назвал это горькой чашей, но выбора у него не осталось: армия разбита, экономика в руинах, на фронте не хватает людей. Иран признаёт наш суверенитет над Хузестаном и передаёт нам контроль над нефтяными месторождениями региона. Шатт-эль-Араб переходит под наш контроль.\n\nДля нас это победа, о которой год назад никто не смел мечтать. Но победа не отменяет проблем. Хузестан нужно удержать: арабы там не все нас ждали, а шиитское население может поднять восстание. Армия на пике, но устала. Экономика держится на нефти, но война стоила десятки миллиардов. В Багдаде уже спорят: закрепить мир и заняться восстановлением или потребовать большего, пока Иран слаб."
 iraq.4.a: "Аллах акбар!"
 iraq.5.t: "Иран отказывается"
 iraq.5.d: "Тегеран отверг наши условия. Хомейни назвал их капитуляцией и заявил, что будет воевать до последнего. Иранская делегация покинула Вену, не подписав ничего. На фронте снова тихо, но это затишье перед боем: обе стороны используют паузу, чтобы подтянуть резервы. Наши дивизии стоят в Хузестане, но удержать провинцию без мира сложнее - местное население враждебно, а снабжение растянуто. Иранцы уже готовят новое наступление, на этот раз с упором на человеческие волны и удары по нашим нефтяным терминалам.\n\nВ Багдаде растёт раздражение. Кто-то требует наступать дальше, пока Иран не оправился, кто-то предлагает снова сесть за стол и снять часть требований. Экономика трещит: война стоит миллиарды, нефть продаётся плохо, долги давят. Армия устала, но пока держится. Иран тоже истощён, но отказывается признавать реальность."
 iraq.5.a: "Плохо, очень плохо..."
 iraq.6.t: "Великий Ирак"
 iraq.6.d: "Дым от парадных расчетов смешивался со знойным маревом багдадского полудня. Стоя на высокой трибуне в своем безупречном военном френче, Саддам Хусейн лениво затянулся дорогой сигарой, провожая взглядом пролетающие над площадью советские «МиГи». Его лицо оставалось непроницаемым, но в глазах горел триумф. Всего несколько месяцев назад весь мир предрекал Ираку крах, а сегодня его генералы рапортуют о полном успехе.\n\nСаддам перевел взгляд на карту, мысленно ожившую в его голове. Кувейт - эта девятнадцатая провинция, искусственно оторванная британскими колонизаторами, - наконец-то вернулся в родную гавань вместе со своими портами. Хузестан - многовековая рана на теле арабской нации, томившаяся под персидским гнетом, - теперь полностью очищен и дает Багдаду контроль над колоссальными запасами нефти Абадана. Весь Персидский залив замер в страхе и почтении перед мощью иракского оружия.\n\nОткинув окурок, Саддам подошел к микрофону. Шум сотен тысяч голосов мгновенно стих. Он вспомнил Навуходоносора, вспомнил славу древнего Вавилона. История выбрала именно его, чтобы исправить ошибки прошлого и объединить расколотый арабский мир. Набрав в легкие горячий воздух, он твердым голосом произнес слова, которые навсегда изменят геополитическую карту мира. Великий Ирак рожден сегодня, и никто больше не посмеет встать на его пути."
 iraq.6.a: "Аллах Акбар! Слава Саддаму Хуссейну!"
 iran.1.t: "Прекращение огня с Ираком"
 iran.1.d: "20 августа 1988 года. Восемь лет войны закончились. Не миром, не победой - просто прекращением огня. Иракские войска остановились на границе, наши тоже. Резолюция 598 Совета Безопасности ООН, которую мы отвергали год назад, теперь принята. Хомейни назвал это «питьём отравленной чаши» - и не преувеличил. На фронте - усталость, в тылу - горечь. Сотни тысяч убитых, миллионы раненых, города в руинах, экономика на дне. Мы не добились ни свержения Саддама, ни репараций, ни наказания агрессора.\n\nПочему сейчас? Потому что наступление иракцев в июле-августе было не остановить. Они применили химическое оружие под Басрой и на островах, наши человеческие волны разбились о их оборону. Революционная гвардия потеряла лучших, добровольцы кончились, оружия не хватало. Москва, которая нас поддерживала, давила на принятие резолюции, а Запад грозил новыми санкциями. Выбора не осталось."
 iran.1.a: "Наконец-то эта война закончилась"
 iran.2.t: "Победа"
 iran.2.d: "Басра пала. После месяцев боёв, после того как наши человеческие волны раз за разом разбивались о иракскую оборону, мы нашли слабое место - на юге, у Шатт-эль-Араба. Иракцы не выдержали. Дивизии Республиканской гвардии отступили на север, оставив город. В наших руках весь юг Ирака: Басра, порты, нефтяные месторождения, выход к Персидскому заливу. Саддам потерял свою вторую столицу и главный морской порт. Его армия деморализована, его союзники в панике, Кувейт и Саудовская Аравия молчат.\n\nЭто победа, о которой год назад никто не смел мечтать. Мы не просто остановили агрессора - мы взяли то, что он хотел взять у нас. Хузестан освобождён, Басра под нашим контролем, граница отодвинута. Но война ещё не закончена. Саддам сидит в Багдаде и не собирается сдаваться. Он грозит новыми наступлениями, применяет химическое оружие, ищет поддержку у Москвы и Парижа. Наши потери огромны, экономика разрушена, но армия на подъёме. Сейчас или никогда."
 iran.2.a: "Ура!"
 iran.3.t: "Ирак отказался от наших требований"
 iran.3.d: "Багдад отверг всё. Мы требовали признания Басры и юга Ирака частью нашей зоны контроля, репараций на десятки миллиардов, наказания Саддама как военного преступника. Саддам ответил, что не отдаст ни пяди земли, а Басра «вернётся в лоно Ирака» - силой или нет. Его пропаганда кричит о «персидской оккупации», Кувейт и Саудовская Аравия тайно финансируют его армию, Москва и Париж продолжают поставлять оружие. Наши дивизии стоят в Басре, но удержать её без мира сложно: город в руинах, население враждебно, снабжение растянуто, а иракцы уже готовят контрнаступление.\n\nВ Тегеране растёт раздражение. Военные говорят, что нужно идти на Багдад, пока Саддам не оправился. Политики предлагают снять часть требований и снова сесть за стол - но это будет выглядеть как отступление после победы. Хомейни колеблется: он не хочет ни отдавать завоёванное, ни ввязываться в новую войну. Экономика не выдержит ещё год боёв, а добровольцы кончились ещё в 1984-м."
 iran.3.a: "Дожмём диктатора!"
 iran.4.t: "Иран предлагает мир на своих условиях"
 iran.4.d: "Тегеран прислал условия. Мы признаём Басру и южные регионы иранской территорией, платим репарации, гарантируем безопасность Хузестана. Фактически — капитуляция под видом мира. Саддам в ярости, но генералы молчат: армия обескровлена, Республиканская гвардия потеряла половину техники, экономика держится только на кредитах Кувейта и Саудовской Аравии."
 iran.4.a: "Мы согласны."
 iran.4.b: "Не согласимся ни за что!"
 iran.5.t: "Смена правительства в Ираке"
 iran.5.d: "Багдад пал. Саддам бежал или убит - точно никто не знает, но его больше нет. Власть в Ираке перешла к Мухаммаду Бакиру аль-Хакиму, лидеру Высшего совета исламской революции в Ираке, который двадцать лет провёл в Тегеране. Новая власть объявляет Ирак Исламской Республикой. Партия Баас распущена, её лидеры арестованы или казнены. Ирак становится вторым шиитским исламским государством после Ирана - и первым, кто обязан своим существованием нашей победе.\n\nДля нас это триумф. Саддам, который восемь лет бомбил наши города, применял химическое оружие и вторгся в Хузестан, - исчез. На его месте - союзник, обязанный нам всем. Радоваться рано: Ирак - это не только шииты. Сунниты, курды и бывшие баасисты не собираются молча смотреть, как мы ставим своего человека в Багдаде."
 iran.5.a: "Поддержать аль-Хакима, так и надо!"
 iran.6.t: "Саддам Хусейн найден"
 iran.6.d: "Его нашли в подвале дома под Тикритом. Через неделю после падения Багдада, когда новая власть уже объявила Исламскую Республику Ирак, а мы праздновали победу. Саддам скрывался с двумя телохранителями, без связи, без охраны, с чемоданом денег и документами. Теперь он в наших руках.\n\nСаддам Хусейн - не просто военный преступник. Он предатель ислама. Он напал на мусульманскую страну, развязал восьмилетнюю войну против Ирана, применял химическое оружие против мусульман, убивал шиитов в Кербеле и Неджефе, травил курдов в Халабдже. Он называл себя защитником арабов, а служил только собственной власти. Он получал оружие от неверных, деньги от монархий Залива и убивал мусульман руками мусульман. Такому нет прощения.\n\nЕго казнь должна быть публичной. Не тайной, не в тюремной камере, не под покровом ночи. Весь мир должен увидеть, что бывает с теми, кто идёт против воли Аллаха и проливает кровь правоверных. Пусть сунниты, шииты и курды увидят: справедливость свершилась. Пусть Кувейт, Саудовская Аравия и Запад запомнят: Иран не прощает врагов ислама. Пусть его смерть станет уроком для всех тиранов.\n\nМы казним его на площади в Басре или перед мечетью в Кербеле. Публично, при стечении народа, с трансляцией по телевидению. Это не месть - это приговор уммы. Саддам умрёт не как солдат, а как предатель. И его имя будет проклято в истории, а не воспето в легендах."
 iran.6.a: "Ислам таких не прощает."
 amn.1.t: "Пешаварские соглашения"
 amn.1.desc: ""
 amn.1.a: "Аллах Акбар! Мы всё таки прогнали коммунистов!"
 amn.2.t: "Замена нашего лидера"
 amn.2.desc: ""
 amn.2.a: "Хорошо."
 amn.3.t: "Усама бен Ладен предоставил нам оружие"
 amn.3.desc: "Этой ночью в Пешавар прибыл караван. Не обычный караван с продовольствием или медикаментами - это был груз оружия. Усама бен Ладен, саудовский шейх, который уже давно помогает нашему делу, лично организовал эту поставку. Ящики с винтовками, пулемётами и даже несколько ПЗРК были разгружены под покровом темноты. Его люди говорят, что это только начало. Бен Ладен верит в нашу борьбу и готов помогать дальше."
 amn.3.a: "Отлично!"
 amn.4.t: "У Усамы бен Ладена не оказалось оружия"
 amn.4.desc: "Мы ждали караван с оружием. Люди бен Ладена обещали винтовки, патроны и даже несколько пулеметов. Но караван так и не пришёл. Посланники вернулись с пустыми руками: у шейха не оказалось оружия. Его склады пусты, а деньги, которые он собирал в Саудовской Аравии, ушли на другие нужды. Бен Ладен извиняется и обещает помочь позже, но сейчас мы остались ни с чем. Моджахеды ропщут. Что будем делать?" 
 amn.4.a: "Мы отнесёмся к этому с пониманием."
 amn.4.b: "Это недопустимо!"
 albania.1.t: "Смерть Энвера Ходжи"
 albania.1.desc: "11 апреля 1985 года. Энвер Ходжа умер. Человек, правивший нашей страной сорок лет, ушёл. Он пережил Сталина, Мао, Брежнева и Черненко, разорвал с Москвой, потом с Пекином, построил сотни тысяч бункеров и оставил страну в полной изоляции. Теперь его нет.\n\nВ Тиране тишина. Партия молчит, армия ждёт, народ смотрит. Ходжа оставил после себя не только бункеры, но и систему, где всё держалось на нём одном. Его имя было везде: в школах, на заводах, в казармах. Теперь это имя - прошлое. Кто возьмёт власть? Рамиз Алия, верный ученик, уже много лет считавшийся наследником."
 albania.1.a: "Трагедия..."
 albania.2.t: "Падение коммунистического строя"
 albania.2.desc: "Декабрь 1990 года. Албания больше не может держаться в изоляции. Пять лет назад умер Ходжа, и Рамиз Алия пытался осторожно реформировать систему, но время уже ушло. В соседних странах коммунизм рухнул: в Бухаресте расстреляли Чаушеску, в Польше и Венгрии к власти пришли некоммунисты. В Тиране это видят по телевизору - кто успел его купить.\n\nНаша экономика в руинах. Заводы стоят, продукты по талонам, бензина нет. В декабре студенты Тираны выходят на улицы - сначала за лучшие условия в общежитиях, потом с требованием свободных выборов и отмены монополии партии. К ним присоединяются рабочие и интеллигенция. Полиция сначала разгоняет, но силы уже не те. Алия колеблется между силой и уступками.\n\nПартия пытается выиграть время: объявляет о «демократизации», разрешает создание независимых организаций. В декабре 1990-го появляется Демократическая партия - первая оппозиционная сила за сорок лет. Алия соглашается на свободные выборы. Они пройдут в марте 1991-го, и коммунисты даже выиграют благодаря сельскому электорату, но это уже ничего не решает. Режим пал. Албания вступает в новую эпоху - без Ходжи, без монополии, без стен. Что будет дальше, не знает никто."
 albania.2.a: "Сали Бериша!"
 angola.1.t: "Провозглашение Народной Республики Ангола"
 angola.1.desc: "Война закончена. УНИТА разбита - Савимби ушёл в подполье, его отряды рассеяны по саванне, внешняя поддержка иссякла после падения режима апартеида в ЮАР. Правительственные силы контролируют всю территорию. В Луанде готовятся к торжествам.\n\nНародная Республика Ангола была провозглашена ещё в 1975 году, но тогда это была декларация в осаждённом городе: страну делили на части, война шла с первого дня. Теперь это реальность. МПЛА - единственная партия, государство - социалистическое, курс - на строительство социализма.\n\nНо мир не наступает сам. Экономика разрушена шестнадцатью годами войны: нефть качают, но доходы уходят на армию и долги. Молодёжь выросла с оружием в руках и не знает другой жизни. В провинциях власть держится на военных комитетах, а не на партийных органах. Кубинцы ушли, советские советники тоже сворачиваются - страна остаётся одна со своей победой."
 angola.1.a: "Слава Анголе!"
 austria.1.t: "Результаты досрочных выборов 1986 года"
 austria.1.desc: "23 ноября 1986 года в Австрии прошли досрочные парламентские выборы. Канцлер Фред Зиновиц ушёл в отставку, его сменил Франц Враницкий, который разорвал коалицию с FPO после прихода Йорга Хайдера. Это привело к роспуску парламента."
 austria.1.a: "Франц Враницкий!"
 belgian.1.t: "Выборы 1987 года"
 belgian.1.desc: "Сегодня Бельгия голосует досрочно - правительство Вилфрида Мартенса пало в октябре из-за кризиса вокруг коммуны Вурен, где фламандские и валлонские требования столкнулись в открытом конфликте. Парламент распущен, выборы назначены на два года раньше срока.\nПравительственная коалиция христианских демократов и либералов теряет большинство. Мартенс подаёт в отставку. Король поручает Жан-Люку Дехане роль информатора. Дехане просит сто дней. Переговоры затягиваются на 106 дней - дольше, чем длилось само правительство. В итоге Мартенс возвращается в восьмой раз, но уже во главе левоцентристской коалиции: христианские демократы, социалисты и «Фольксюни».\nСтрана расколота по языковой линии, и выборы это только подтверждают. Фландрия голосует за CVP и PVV, Валлония - за PS. Крайне правые впервые в парламенте. Бельгия входит в новую эпоху - без стабильного большинства, с растущим национализмом и правительством, которое держится на трёх партиях вместо двух."
 belgian.1.a: "Вилфрид Мартенс!"
 belgian.2.t: "Парламентские выборы 1991 года"
 belgian.2.desc: "24 ноября 1991 года. Бельгия голосует досрочно - правительство Вилфрида Мартенса пало в октябре из-за конфликта между фламандскими и валлонскими партиями. Мартенс у власти почти непрерывно с 1979 года, и страна устала от его коалиций.\nКоалиция Мартенса рушится. Король Бодуэн поручает формирование правительства трём политикам по очереди - два либерала и христианский демократ не справляются. Кризис длится 103 дня. Только 6 марта 1992 года Жан-Люк Дехане, фламандский христианский демократ по прозвищу «Бульдозер», соглашается возглавить коалицию. 7 марта он приведён к присяге. В правительстве — те же четыре партии, что и раньше: CVP, PS, SP и PSC. У них 120 мест из 212 - минимальное большинство.\nДехане достаётся тяжёлое наследство. Бюджетный дефицит, госдолг, реформа государственного устройства, проблема Брюсселя, иммиграция. И парламент, где впервые сидят крайне правые. Бельгия входит в новую эпоху - без Мартенса, с хрупким большинством и вопросом, сколько протянет эта коалиция."
 belgian.2.a: "Новая эпоха."
 bosnia.1.t: "Обретение независимости"
 bosnia.1.desc: "1 марта 1992 года. В Сараево объявлены итоги референдума: 99,4% при явке 63,4% проголосовали за независимость. Сербы референдум бойкотировали - для них это было голосование о выходе из Югославии, в которой они хотят остаться. Алия Изетбегович говорит о суверенной Боснии и Герцеговине. Радован Караджич уже заявляет, что сербы не признают результат и создадут своё государство.\n\nМы - не Словения и не Хорватия. У нас нет моноэтничного большинства: мусульмане, сербы и хорваты живут вперемешку, и у каждой общины есть свои вооружённые отряды. Словения и Хорватия уже получили признание Запада, Македония на очереди. Мы - следующие, и это означает войну на три стороны.\nБелград молчит, но армия по-прежнему контролирует казармы по всей республике. В Сараево готовятся к худшему: на улицах баррикады, в городе стреляют. Независимость провозглашена, но мира она не принесла."
 bosnia.1.a: "Мобилизировать войска!"
 burkina_faso.1.t: "Государственный переворот"
 burkina_faso.1.desc: "15 октября 1987 года. Четыре года назад мы взяли власть, чтобы построить новое общество - без колониального наследия, без коррупции, без зависимости от Запада. Мы переименовали страну в Буркина-Фасо, «землю честных людей». Мы хотели, чтобы крестьянин и рабочий стали хозяевами своей судьбы.\n\nНо революция пожирает своих детей. Внутри Национального совета зреет раскол. Одни требуют продолжать курс - национализацию, аскезу, разрыв с Парижем. Другие устали от изоляции и бедности, хотят открыться миру и договориться с Западом. Во главе недовольных - Блез Компаорэ, наш старый товарищ, человек, который был рядом с самого начала.\n\nСегодня ночью он сделал выбор. Верные ему части вошли в Уагадугу. Тома Санкара убит вместе с двенадцатью сторонниками. Национальный совет распущен, власть переходит к Народному фронту. Компаорэ объявляет, что революция продолжается, но «без ошибок и эксцессов». Что это значит - пока неясно.\n\nМы получили власть, которую не просили. Вопрос в том, что с ней делать: сохранить революционный курс, но без Санкары, или свернуть его и попробовать выжить иначе. Обратной дороги нет - кровь уже пролита."
 burkina_faso.1.a: "Тяжело..."
 burma.1.t: "Государственный переворот"
 burma.1.desc: "Август 1988 года не закончился. Протесты «8888» разогнали, но улицы не успокоились. Правительство Маунг Маунга не контролирует страну, партия распадается, в армии растёт раздражение. 18 сентября наши генералы во главе с Со Маунгом берут власть в свои руки. Конституция отменена, парламент распущен, введено военное положение. Создан Государственный совет восстановления законности и порядка.\n\nМы обещаем порядок и выборы, но сначала - порядок. Войска выходят на улицы, комендантский час, аресты. Аун Сан Су Чжи уже произносит речи перед толпами. Страна замирает и ждёт, что будет дальше."
 burma.1.a: "Это незаконно!"
 burma.2.t: "Союз Мьянма"
 burma.2.desc: "18 июня 1989 года. Год назад мы взяли власть, чтобы остановить хаос. Теперь пришло время переименовать страну. Государственный совет по восстановлению законности и порядка объявляет: Бирма становится Союзом Мьянма. Рангун - Янгоном. Старые названия - колониальное наследие, говорят генералы. Новые - общие для всех народов, живущих в Союзе.\n\nДля внешнего мира это символ. Запад видит попытку уйти от санкций и забыть о разогнанных демонстрациях 1988 года. Оппозиция внутри страны - попытку сменить вывеску, не меняя сути. Для нас это вопрос идентичности: Бирма - колония, Мьянма - независимое государство. Так мы отделяем себя от прошлого.\n\nНо имя не решает проблем. Экономика в руинах, санкции давят, оппозиция разогнана, а в горах неспокойно. Вопрос не в том, как назвать страну. Вопрос в том, что за этим названием будет стоять."
 burma.2.a: "Союз Мьянма..."
 chad.1.t: "Война Тойот"
 chad.1.desc: "Наши войска впервые за годы конфликта пересекли 16-ю параллель и двинулись на север. Ливийцы сидят на базах, у них танки, авиация и артиллерия. У нас ничего этого нет. Зато есть четыреста пикапов Toyota Hilux, переданных французами, и противотанковые ракеты «Милан» на кузовах.\n\nРасчёт простой: не вступать в бой там, где противник силён, а бить там, где его нет. Пустыня огромная, ливийские гарнизоны разбросаны, между ними — сотни километров. Наши отряды на пикапах могут пройти эти километры за день, ударить и уйти до подхода подкреплений. В декабре мы уже взяли Фаду, уничтожив гарнизон. Теперь цель — база Уади-Дум на севере, где сидят пять тысяч ливийцев.\n\nФранцузы прикрывают нас с воздуха, но в наземные бои не лезут. Соседи по региону смотрят молча. Каддафи объявил, что Чад — его территория, и просто так уйти не собирается.\n\nВопрос в том, продолжать ли наступление на север или закрепиться на достигнутом. Дальше — Ливия, и там может начаться совсем другая война."
 chad.1.a: "За дело!"
 communist_china.1.t: "Интеграция Тибета"
 communist_china.1.desc: "Длинные тени над Лхасой окончательно сменяются красными знамёнами. Товарищ Дэн Сяопин ясно дал понять: КНР больше не может позволить себе иметь «буферную зону» на юго-западных рубежах. Тибет должен перестать быть просто автономным придатком и стать настоящей «коркой» - твёрдым, монолитным щитом республики, её ресурсной базой и военной крепостью, намертво вплавленной в тело Китая.\nТрадиционный уклад уступает место форсированной модернизации, строительству дорог через горные хребты и жёсткому административному контролю. Далай-лама в изгнании, а здесь, на высоте четырёх тысяч метров, железная воля Пекина заковывает регион в бетон и сталь. Мы интегрируем Тибет безвозвратно. Это вызовет ярость на Западе, но обеспечит нам стратегическое господство в Азии навсегда."
 communist_china.1.a: "Добро пожаловать."
 communist_china.2.t: "Восстание Тибета"
 communist_china.2.desc: "Попытка форсированной интеграции и превращения Тибета в неотъемлимую территорию КНР привела к неизбежному взрыву. Недовольные уничтожением векового уклада, изъятием монастырских земель и засильем партийных чиновников, тибетцы взялись за оружие. Отряды повстанцев «Чуши Гандруг» парализовали движение на стратегических высокогорных шоссе, а улицы Лхасы превратились в баррикады.\nЗападная пресса уже трубит о «борьбе за свободу», а индийские пограничники закрывают глаза на переброску оружия через перевалы. Для Дэна Сяопина это личный вызов: если проявить слабость сейчас, поползет по швам вся КНР. Усмирять регион отправлены элитные части НОАК. Нам предстоит решить, насколько далеко мы готовы зайти, чтобы удержать этот щит республики."
 communist_china.2.a: "Подавим их за 3 дня."
 croatia.1.t: "Обретение независимости"
 croatia.1.d: "Сегодня у нашей страны праздник, мы объявили о выходе из Югославии. Сабор принимает декларацию о независимости, Франьо Туджман заявляет, что Хорватия больше не будет частью «коммунистической тюрьмы народов». В Загребе ликуют люди.\n\nНо на территории Хорватии живут 600 тысяч сербов, и они не собираются оставаться в независимом государстве, где их называют меньшинством. В Книнской краине местные сербы уже перекрыли дороги и объявили о создании «Сербской автономной области». Оружия у обеих сторон хватает: мы скупали оружие в Венгрии и на чёрном рынке.\n\nВойна ещё не началась, но уже неизбежна. Вопрос только в том, кто первый выстрелит и кто кого поддержит."
 croatia.1.a: "За наше бравое дело!"
 cyprus.1.t: "Президентские выборы 1988 года"
 cyprus.1.desc: "14 февраля 1988 года. Кипр голосует. Президент Спирос Киприану идёт на третий срок, но страна устала от его жёсткой линии на переговорах с турками-киприотами. Переговоры мертвы больше двух лет, а Киприану отказывается возобновлять их, пока турецкие войска не уйдут с севера.\n\nПервый тур даёт неожиданный результат. Главный оппозиционер, лидер правой партии ДИСИ Главкос Клиридис, набирает 33,3%. Независимый бизнесмен Йоргос Василиу, которого поддерживает компартия АКЭЛ, - 30,1%. Киприану с треском проигрывает, получив лишь 27,3%. Социалист Лиссаридис - 9,2%.\n\nКиприану отказывается от дальнейшей борьбы. Во второй тур выходят Клиридис и Василиу. Оба обещают гибкость в переговорах, чего не было у Киприану. Клиридис зовёт в правительство всех, включая партию Киприану. Василиу говорит, что народ устал от партий и хочет независимого лидера. Оба готовы к диалогу с Денкташем без предварительных условий.\n\n21 февраля Василиу побеждает с 51,6% против 48,4% у Клиридиса - отрыв в десять тысяч голосов. Киприану уходит после одиннадцати лет у власти, а вместе с ним - эпоха Макариоса. Новый президент - человек без партии, но с мандатом на перемены. Начинается эра Василиу."
 cyprus.1.a: "Воистину новая эпоха."
 Czechoslovakia.1.t: "Отставка Гусака"
 Czechoslovakia.1.desc: "Гусаку 76, он болен и почти не появляется на людях. Партия уже отменила монополию, по стране забастовки и митинги, Гражданский форум требует свободных выборов. Гусак подаёт в отставку с поста президента, не дожидаясь, пока его отстранят."
 Czechoslovakia.1.a: "Примем отставку. Свободные выборы!"
 Czechoslovakia.2.t: "Бархатная революция"
 Czechoslovakia.2.desc: "Студенческая демонстрация в Праге на Национальной улице разогнана, есть избитые. К вечеру слухи о погибшем студенте поднимают город. На следующий день бастуют театры, к ним присоединяются заводы. В Словакии - своя волна, «Общественность против насилия». Партия пытается объяснить, что всё под контролем, но ей уже не верят.К концу ноября забастовка всеобщая.\nГражданский форум Вацлава Гавела и город Братислава требуют отмены монополии партии и свободных выборов. 24 ноября уходит Политбюро во главе с Якешем. 27-го страна останавливается на два часа - рабочие, врачи, актёры. 29-го Федеральное собрание вычёркивает из конституции статью о руководящей роли КПЧ. Режим ещё у власти, но уже без опоры."
 Czechoslovakia.2.a: "Что происходит?"
 Czechoslovakia.3.t: "Федерализация Чехословакии"
 Czechoslovakia.3.desc: "1968 год. Пражская весна ещё дышит, но Москва давит. Александр Дубчек ищет компромисс: сохранить реформы и не потерять контроль. Один из шагов - превратить унитарную Чехословакию в федерацию двух равных республик: Чешской и Словацкой. Словаки давно требуют равноправия, и это шанс удержать их в общей стране. 28 октября Национальное собрание принимает конституционный закон о федерации, вступающий в силу с 1 января 1969 года.\n\nДля Праги это уступка Братиславе. Для Москвы - способ показать, что социализм может быть разным. Для словаков - конец двадцати лет централизма, когда всё решалось в Праге. Но федерация - это не только права, это и ответственность: две республики, два парламента, два правительства, и всё это в одной стране, которая уже трещит по швам."
 Czechoslovakia.3.a: "Настоящая федерация"
 Czechoslovakia.4.t: "Распад Чехославкии"
 Czechoslovakia.4.desc: "17 июля 1992 года. Словацкий парламент принимает декларацию о суверенитете. Мечьяр и Клаус уже месяц спорят о том, быть ли общей стране, и не находят ответа. Чехи хотят быстрых реформ и федерации с сильным центром, словаки - конфедерации, где у Братиславы свои налоги, армия и внешняя политика. Ни то, ни другое несовместимо. 25 ноября Федеральное собрание голосует за роспуск. С 1 января 1993 года Чехословакии не будет.\n\nДля Праги это конец иллюзий о том, что реформы можно провести вместе. Для Братиславы - шанс на свою дорогу. Для мира - спокойный, «бархатный» развод, без единого выстрела. Но это и конец страны, которая просуществовала семьдесят четыре года. Делить предстоит всё: армию, золото, долги, даже архивы и коллекции. Спор о золоте затянется на годы."
 Czechoslovakia.4.a: "Примем раздел."
 ethiopia.1.t: "Провозглашение НДРЕ"
 ethiopia.1.desc: "Сентябрь 1987 года. Тринадцать лет мы правили как Временный военно-административный совет - Дерг. Революция победила, но враги не исчезли: Эритрея воюет, Тигре воюет, голод убивает сотни тысяч. Теперь мы меняем вывеску. Новая конституция принята, Дерг распущен, создана Рабочая партия Эфиопии. Страна становится Народно-Демократической Республикой. Менгисту остаётся у власти, но теперь не как генерал, а как лидер партии и президент.\n\nДля мира это попытка показать: Эфиопия не военная хунта, а социалистическое государство с парламентом и конституцией. Для нас - способ удержать власть, когда армия устала, а экономика в руинах. Для повстанцев - не имеет значения: они воюют не с Дергом, а с Менгисту.\n\nТеперь вопрос в том, что делать с этой новой республикой. Можно править жёстко, как раньше, только под другим именем. Можно попробовать реформы и мирные переговоры с Эритреей. Можно искать поддержку у Москвы, которая уже сомневается, стоит ли кормить нас дальше."
 ethiopia.1.a: "Ура!"
 ireland.1.t: "Предновогодние выборы"
 ireland.1.desc: "Правительство Фине Гэл и Лейбористской партии трещит по швам. Лейбористы отказываются поддержать жёсткий бюджет, предложенный министром финансов Джоном Брутоном: сокращение расходов на здравоохранение и социальные выплаты для них неприемлемо. Четыре министра-лейбориста подают в отставку, и премьер-министр Гаррет Фицджеральд объявляет о роспуске Дойла. Выборы назначены на 17 февраля."
 ireland.1.a: "Чарльз Хоги!"
 ireland.2.t: "Выборы 1992 года"
 ireland.2.desc: "Ирландия голосует досрочно после краха коалиции «Фианна Файл» и Прогрессивных демократов - правительство Альберта Рейнольдса пало из-за скандала вокруг «Beef Tribunal». Главная тема кампании - безработица: каждый пятый ирландец без работы, 300 тысяч человек. Лидер «Фине Гэл» Джон Брутон называет Рейнольдса «главным хулиганом на школьном дворе» и требует ответа за рекордную безработицу и высокие ставки по кредитам."
 ireland.2.a: "Альберт Рейнольдс!"
