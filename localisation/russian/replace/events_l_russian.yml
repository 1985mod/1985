 soviet_union.26.desc: ""
 soviet_union.26.a: "ОК"
 soviet_union.27.t: "III Съезд народных депутатов СССР"
 soviet_union.27.desc: "12 марта в Москве состоялся III Съезд народных депутатов СССР. Основными вопросами стали: Введение поста Президента СССР и его избрание, выборы Председателя Верховного Совета СССР, внесение поправок в Конституцию, отменивших однопартийную систему в СССР и направляющую роль КПСС. Из 6 статьи Конституции СССР официально было исключено упоминание о руководящей роли КПСС. Согласно принятым в Конституцию изменений и дополнений Президент СССР избирается гражданами СССР на основе всеобщего, равного и прямого избирательного права при тайном голосовании сроком на 5 лет. 14 марта состоялся пленум ЦК КПСС, выдвинувший кандидатом в президенты Горбачёва. Также были выдвинуты кандидатуры премьера Николая Рыжкова и министра внутренних дел Вадима Бакатина, которые отказались от своей кандидатуры и выборы оказались безальтернативными. 15 марта 1990 года М. С. Горбачёв безальтернативным голосованием на Съезде был избран первым Президентом СССР. Из 2245 депутатов (пять мест из которых были вакантными) в съезде участвовали 2000. За Горбачёва были поданы 1329 голосов (59,2%), а против 495. 54 бюллетеня оказались испорченными. А 122 депутата отказались от голосования."
 soviet_union.27.a: "Ура!"
