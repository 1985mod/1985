l_russian:

  communism: "Социализм"
  communism_noun: "Социализм"
  communism_desc: "Социалистическое государство"
  marxism_leninism: "Марксизм-ленинизм"
  marxism_leninism_desc: "Марксизм-ленинизм — левая политическая идеология и официальная доктрина коммунистического движения, объединяющая экономическую теорию Карла Маркса о классовой борьбе и концепцию Владимира Ленина о революционной партии нового типа. В рамках этой модели капиталистическая система признаётся несправедливой и подлежащей ликвидации путём социалистической революции, после которой устанавливается диктатура пролетариата, ликвидируется частная собственность на средства производства, а экономика переходит под жесткий централизованный контроль государства ради последующего построения бесклассового коммунистического общества."
  stalinism: "Сталинизм"
  stalinism_desc: "Сталинизм — политическая система, идеология и форма тоталитарного правления, сложившаяся в СССР в период руководства Иосифа Сталина. В рамках этой модели марксизм-ленинизм был трансформирован в жесткую государственную догму, предполагающую форсированную модернизацию («строительство социализма в одной отдельной стране») через сверхцентрализацию экономики, ликвидацию рыночных институтов и принудительную коллективизацию, а вся полнота власти была сосредоточена в руках партийного аппарата и вождя, опиравшихся на культ личности, массовые политические репрессии и тотальный идеологический контроль над обществом."
  chinese_socialism: "Социализм с китайской спецификой"
  chinese_socialism_desc: "Социализм с китайской спецификой — социально-экономическая модель, официально принятая в КНР, сочетающая долгосрочное политическое доминирование Коммунистической партии (авангардной партии) с механизмами рыночной экономики и смешанной собственностью. Эта идеология ставит национальную стабильность и технологическую модернизацию выше классического марксистского требования немедленной отмены частной собственности, рассматривая текущий этап как «начальную стадию социализма», необходимую для построения мощного суверенного государства."
  communist_perestroika: "Коммунистическая перестройка"
  communist_perestroika_desc: "Коммунистическая перестройка — идейная концепция масштабного реформирования советской системы, предполагающая «очищение» марксизма-ленинизма от сталинских наслоений и переход к «социализму с человеческим лицом» через механизмы гласности и демократизации. В отличие от китайского пути, эта модель опиралась на политические свободы и децентрализацию управления как необходимые условия преодоления экономического застоя. Процесс основывался на вере в то, что в условиях открытости и честной дискуссии партия сохранит руководящую роль, а социалистическая система обретёт второе дыхание."
  authoritarian_socialism: "Авторитарный социализм"
  authoritarian_socialism_desc: "Авторитарный социализм — политико-экономическая модель, постулирующая построение бесклассового общества через установление абсолютного государственного контроля над всеми сферами жизни и подавление любой оппозиции. В рамках этой системы централизованное планирование и государственная собственность на средства производства рассматриваются как инструменты достижения социальной справедливости, а интересы личности полностью подчиняются интересам коллектива или государства."
  democratic_socialism: "Демократический социализм"
  democratic_socialism_desc: "Демократический социализм — политическая идеология, утверждающая, что социальная справедливость и экономическое равенство должны достигаться исключительно в рамках демократической многопартийной системы при полном соблюдении всех гражданских прав и свобод. В отличие от авторитарных моделей, эта концепция отвергает диктатуру и революционное насилие, считая, что переход к социализму возможен только через парламентскую борьбу, народную волю и эволюционные реформы."
  left_wing_nationalism: "Левый национализм"
  left_wing_nationalism_desc: "Левый национализм — политическая идеология, совмещающая принципы левой политики с идеей национального самоопределения и суверенитета. В рамках этой модели нация понимается не как изолированная этническая группа, а как органическое и культурно-политическое единство трудящихся, борющихся против внешнего угнетения, колониализма или глобального капитализма. Выражение народной воли здесь направлено на защиту национальных богатств и внутреннего рынка от иностранного влияния, а гражданская солидарность выстраивается вокруг идеи общего блага, где патриотизм служит инструментом социальной мобилизации и построения справедливого общества."

  socialism: "Социал-демократия"
  socialism_noun: "Социал-демократия"
  socialism_desc: "Социал-демократическое государство"
  nordic_model: "Скандинавская модель"
  nordic_model_desc: "Скандинавская модель — социально-экономическая система, сочетающая свободную рыночную экономику и высокий уровень личной свободы с развитым государством всеобщего благосостояния и коллективным регулированием рынка труда. Эта модель основывается на социальном партнёрстве между работниками, работодателями и государством, обеспечивая высокую степень равенства и социальной защищённости при сохранении высокой конкурентоспособности капитала."
  the_third_way: "Третий путь"
  the_third_way_desc: "Третий путь — политико-экономическая концепция, представляющая собой попытку синтеза правоцентристской экономической политики и левоцентристской социальной программы. В рамках этой модели отвергаются как традиционный государственный социализм с его чрезмерным регулированием, так и радикальный неолиберализм с его невмешательством; вместо этого предлагается адаптация социал-демократических ценностей к условиям глобализированного свободного рынка."
  classical_social_democracy: "Классическая социал-демократия"
  classical_social_democracy_desc: "Классическая социал-демократия — политическое движение и идеология, возникшие из эволюции марксизма и ставящие целью постепенное преобразование капиталистического общества в социалистическое через демократические институты. В отличие от революционного коммунизма, эта модель утверждает, что социальная справедливость, устранение эксплуатации и равенство возможностей достижимы через парламентские реформы, активное государственное регулирование и укрепление прав профсоюзов."
  eco_social_democracy: "Экосоциал-демократия"
  eco_social_democracy_desc: "Экосоциал-демократия — современная политическая концепция, сочетающая классические принципы социальной защиты с требованиями экологической устойчивости. В этих рамках борьба с неравенством рассматривается как неотъемлемая часть борьбы с климатическим кризисом, что предполагает радикальную трансформацию экономики через «зелёный» государственный контроль, отказ от приоритета безусловного роста ВВП в пользу экологического благополучия и перераспределение ресурсов для поддержки наиболее уязвимых слоёв населения в период энергетического перехода."
  liberal_social_democracy: "Либеральная социал-демократия"
  liberal_social_democracy_desc: "Либеральная социал-демократия — идейный синтез, подчёркивающий права личности, рыночные свободы и социальную ответственность государства. В отличие от более радикальных левых течений, эта модель рассматривает рыночную экономику не как временный компромисс, а как наиболее эффективный инструмент производства благ, требующий государственного вмешательства лишь для исправления «провалов рынка», обеспечения равных возможностей и предотвращения чрезмерной концентрации капитала."
 
  liberalism: "Либерализм"
  liberalism_noun: "Либерализм"
  liberalism_desc: "Либеральное государство"
  classic_liberalism: "Классический либерализм"
  classic_liberalism_desc: "Классический либерализм — политическая и экономическая идеология, возводящая индивидуальную свободу в высшую ценность и ограничивающая роль государства защитой частной собственности, поддержанием правопорядка и соблюдением конституционных прав. Сформировавшееся в XVIII–XIX веках, это учение утверждает, что спонтанный порядок, возникающий из свободного рыночного обмена и личной инициативы, является наиболее эффективным механизмом общественного развития и всеобщего благосостояния."
  neoliberalism: "Неолиберализм"
  neoliberalism_desc: "Неолиберализм — современная интерпретация классического либерализма, направленная на децентрализацию экономики через приватизацию, дерегулирование и радикальное сокращение государственных расходов. В рамках этой модели свободный рынок рассматривается не только как наиболее эффективный экономический механизм, но и как универсальный способ организации человеческой деятельности, где конкуренция является главной движущей силой инноваций, а государственное вмешательство признаётся главным препятствием для экономического роста и личной инициативы."
  social_liberalism: "Социальный либерализм"
  social_liberalism_desc: "Социальный либерализм — политическая доктрина, утверждающая, что истинная свобода личности невозможна без обеспечения государством определённого уровня материального благосостояния и равных возможностей. В отличие от неолиберализма, эта концепция считает, что государство должно активно корректировать рыночные механизмы для борьбы с бедностью, монополиями и социальной несправедливостью, поскольку только защищённый и образованный гражданин может в полной мере реализовать свои либеральные права."
 
  conservatism: "Консерватизм"
  conservatism_noun: "Консерватизм"
  conservatism_desc: "Консервативное государство"
  classic_conservatism: "Классический консерватизм"
  classic_conservatism_desc: "Классический консерватизм — политическая философия, основанная на признании ценности исторической преемственности, иерархии и органического единства общества. В отличие от либерализма, эта модель рассматривает человека не как изолированного индивида, а как часть сложной системы традиций, религии и национальных институтов, утверждая, что радикальные перемены опасны, а реформы должны быть осторожными и опираться на опыт прошлых поколений."
  reactionism: "Реакционизм"
  reactionism_desc: "Реакционизм — радикально-консервативная позиция, направленная не просто на сохранение текущего порядка, а на полное возвращение к политической и социальной структуре прошлого. Идеологически реакционизм отвергает итоги крупных революций и модернизационных сдвигов, считая их деградацией, и призывает к восстановлению утраченных институтов, таких как абсолютная монархия, сословное деление или господствующая роль церкви в государственных делах."
  liberal_conservatism: "Либеральный консерватизм"
  liberal_conservatism_desc: "Либеральный консерватизм — умеренное течение, сочетающее приверженность традиционным институтам и верховенству права с защитой либеральных экономических принципов и индивидуальных свобод. В рамках этой модели консерватизм проявляется в защите конституционной стабильности и моральных устоев, а в экономике поддерживаются свободные рынки, низкие налоги и минимальное государственное вмешательство, что делает его близким к классическому либерализму в деловых вопросах."
  social_conservatism: "Социальный консерватизм"
  social_conservatism_desc: "Социальный консерватизм — идейное направление, подчёркивающее защиту традиционных моральных ценностей, семейных устоев и религиозных догм как основы стабильного общества. В отличие от чисто политических форм консерватизма, главный акцент здесь делается на сохранении «морального климата»: противодействии секуляризации, защите традиционного определения брака и ограничении абортов, часто с помощью государственных программ, укрепляющих социальную сплочённость и общинные связи."
  national_conservatism: "Национальный консерватизм"
  national_conservatism_desc: "Национальный консерватизм — вариант консерватизма, в котором защита национальной идентичности, государственного суверенитета и культурной самобытности ставится выше глобальных экономических или либеральных интересов. Эта идеология выступает за строгий иммиграционный контроль, экономический протекционизм и сохранение традиционного уклада жизни титульной нации, часто проявляя скептицизм по отношению к международным организациям и процессам глобализации."

  neutrality: "Авторитаризм"
  neutrality_noun: "Авторитаризм"
  neutrality_desc: "Авторитарное государство"
  authoritarian_democracy: "Авторитарная демократия"
  authoritarian_democracy_desc: "Авторитарная демократия — политическая система, в которой демократические институты (выборы, парламент, конституция) формально сохраняются, но реальная власть сосредоточена в руках одного лидера или узкой группы, использующей административные ресурсы для подавления подлинной оппозиции. В рамках этой модели выражение народной воли часто используется для легитимации жёсткого централизованного правления, при котором гражданские свободы ограничиваются ради обеспечения государственной стабильности и «национального единства."
  autocracy: "Автократия"
  autocracy_desc: "Автократия — форма правления, при которой верховная государственная власть безраздельно и бесконтрольно принадлежит одному лицу (монарху, диктатору). В отличие от авторитарной демократии, автократия может не имитировать демократические процессы, опираясь исключительно на силовой аппарат, личную преданность элит и культ руководства, где закон является волей правителя, а не внешним ограничением его полномочий."
  oligarchism: "Олигархизм"
  oligarchism_desc: "Олигархизм — политический режим, при котором реальная власть в государстве принадлежит небольшой группе самых богатых и влиятельных лиц, использующих государственные институты для защиты и приумножения частных экономических интересов. При олигархизме чиновники часто являются лишь формальными исполнителями воли теневых групп интересов, а доступ к социальной мобильности и ресурсам закрыт для большинства населения, что ведёт к сращиванию бизнеса и политики."
  military_regimes: "Военная диктатура"
  military_regimes_desc: "Военная диктатура — форма правления, при которой вся политическая власть сосредоточена в руках высшего командования вооружённых сил или особого органа («хунты»), обычно приходящего к власти в результате государственного переворота. В рамках этой модели гражданское законодательство либо приостанавливается, либо подчиняется приказам военного руководства, а легитимность режима обосновывается необходимостью «восстановления порядка», борьбы с коррупцией или устранения внешних угроз."
  absolute_monarchy: "Абсолютная монархия"
  absolute_monarchy_desc: "Абсолютная монархия — форма правления, при которой вся полнота государственной, законодательной, исполнительной и судебной власти безраздельно принадлежит одному человеку — монарху. В рамках этой модели воля правителя признаётся высшим законом, исключающим существование любых независимых от него органов управления, конституционных ограничений или легальной оппозиции, а стабильность режима опирается на принцип божественного происхождения власти монарха и его личный контроль над государственным аппаратом и армией."
  constitutional_monarchy: "Конституционная монархия"
  constitutional_monarchy_desc: "форма правления, при которой власть монарха формально или фактически ограничивается основным законом государства и высшим законодательным органом — парламентом. В рамках этой модели правитель выступает в роли символа национального единства и исторической преемственности, в то время как реальные функции управления государством, формирование правительства и принятие законов переходят к выборным институтам, что позволяет сочетать монархические традиции с демократическими принципами и верховенством права."
  Salafism: "Салафизм"
  Salafism_desc: "Салафизм — фундаменталистское направление в суннитском исламе, призывающее к очищению религии от любых исторических новшеств и возвращению к образу жизни и вере «праведных предков» — первых поколений мусульман. В рамках этой модели отвергаются любые философские и культурные наслоения, возникшие после эпохи Пророка Мухаммеда, а главным источником истины признается исключительно буквальное понимание Корана и Сунны. В политическом контексте салафизм неоднороден: он варьируется от аполитичного пуританства до активного участия в парламентской борьбе и радикального «джихадизма», стремящегося переустроить общество и создать глобальный халифат насильственным путем."
  Political_Islam: "Политический ислам"
  Political_Islam_desc: "Политический ислам (исламизм) — политическая идеология и движение, в которых религиозные нормы ислама (шариат) используются как основа для государственного устройства, правовой системы и регулирования общественной жизни. В рамках этой модели религиозная идентичность преобладает над национальной, а государственные институты перестраиваются для подчинения всех сфер человеческой деятельности божественному закону, что часто приводит к ограничению светских свобод и плюрализма ради достижения духовного и социального единства."

  fascism: "Национализм"
  fascism_noun: "Национализм"
  fascism_desc: "Националистическое государство"
  baathism: "Баасизм"
  baathism_desc: "Баасизм — идеология арабского национализма, целью которой является создание единого арабского государства."
  ethnic_nationalism: "Этнический национализм"
  ethnic_nationalism_desc: "Этнический национализм — форма национальной идентичности, при которой принадлежность к нации определяется исключительно общим происхождением, «кровью», языком и унаследованными культурными традициями. В рамках этой модели нация рассматривается как расширенная семья или биологическое сообщество, что делает невозможным полноценное присоединение к ней представителей других этнических групп, независимо от их лояльности государству или знания языка."
  civil_nationalism: "Гражданский национализм"
  civil_nationalism_desc: "Гражданский национализм — политическая концепция, определяющая нацию как сообщество граждан, объединённых лояльностью к общим политическим институтам, ценностям и правовым нормам (Конституции). Эта модель инклюзивна: она позволяет любому человеку, независимо от этнического происхождения, стать полноправным членом нации, приняв её гражданские обязанности и соблюдая государственные законы."
  extreme_nationalism: "Крайний национализм"
  extreme_nationalism_desc: "Крайний национализм — радикальная идеология, постулирующая абсолютное превосходство собственной нации над другими и оправдывающая агрессивные методы защиты её интересов, включая насилие, дискриминацию и экспансию. В этой системе национальный эгоизм возводится в культ, права личности полностью подавляются ради «национального величия», а международные нормы игнорируются в пользу господства и подавления мнимых или реальных врагов."

  socialism_drift: "Ежедневная поддержка социал-демократов"
