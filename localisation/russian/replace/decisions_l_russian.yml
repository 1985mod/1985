 SOV_discontent_of_the_republics_desc: "Создание Союза Суверенных Государств спасло страну от немедленного краха, но этот триумф дипломатии оказался хрупким. Наш Союз до сих пор крайне нестабилен. Местные элиты и национальные движения в республиках ежеминутно проверяют прочность центральной власти. Чтобы не допустить масштабного восстания и окончательного парада суверенитетов, мы вынуждены постоянно маневрировать. Нам необходимо удовлетворять экономические и политические требования республик, идя на тяжелые компромиссы. Любая ошибка или чрезмерная жесткость нас может стать искрой, которая уничтожит ССГ раз и навсегда.\n\nНедовольство республик: [GetDiscontentRepublicName]"
