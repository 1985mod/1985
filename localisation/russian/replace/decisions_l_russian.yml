 USA_stabilization_of_the_regime_in_iraq: "Стабилизация нового иракского правительства"
 USA_stabilization_of_the_regime_in_iraq_desc: "Военные действия завершены, но борьба за будущее Ирака только начинается. Мы свергли режим Саддама, однако оставили после себя разрушенную инфраструктуру и вакуум власти. В стране, где десятилетиями царил страх, демократия не возникнет сама собой.\n\nПромедление играет на руку повстанцам. Бывшие баасисты, радикальные исламисты и преступные группировки пытаются заполнить вакуум власти, нападая на наши конвои и запугивая местное население. Чтобы новое иракское правительство выстояло, необходимо действовать быстро и последовательно.\n\nНужно работать по трём направлениям. Во-первых, восстановить электроснабжение, водоснабжение и рабочие места, чтобы заручиться поддержкой населения. Во-вторых, укрепить безопасность и подготовить местную полицию и армию. В-третьих, наладить политический диалог между шиитами, суннитами, курдами и другими группами, иначе страна рискует распасться.\n\nКаждое решение потребует денег и политических усилий. Мы обещали помочь Ираку построить демократическое государство — теперь необходимо выполнить это обещание.\n\n§RСопротивление в§! §YИраке§!: §R[?USA.resistance_baathist]%§!"
