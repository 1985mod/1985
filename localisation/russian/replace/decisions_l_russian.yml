 USA_preparation_for_invasion_in_iraq_desc: "Режим Саддама Хусейна давно стал не просто региональной угрозой. Это режим, ответственный за уничтожение собственного народа. Доклады разведки и правозащитных организаций описывают применение химического оружия против курдов в Халабдже, массовые казни шиитов на юге страны и пытки в тюрьме Абу-Грейб.\n\nИрак — колыбель древней цивилизации, страна с богатой культурой и трудолюбивым народом, которую диктатор погрузил в нищету и страх. Мы не можем закрывать на это глаза. Наш долг — положить конец тирании и помочь иракцам построить светское демократическое государство, в котором права человека будут защищены законом.\n\nОднако мы не должны действовать в одиночку или повторять ошибки прошлого. Для успеха этой миссии необходимо заручиться поддержкой международного сообщества, получить одобрение Конгресса и подготовить почву для военной операции. Весь мир смотрит на нас.\n\nПоддержка ООН: §Y[?USA.un_support]%§!"
