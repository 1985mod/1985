l_russian:
 LOADING_TIP_0: "«Лучше работать завтра, чем сегодня!»\n- Михаил Горбачев"
 LOADING_TIP_1: "«Рецессия — это когда без работы остается ваш сосед. Депрессия — это когда вы сами остаетесь без работы. Восстановление — когда без работы останется Джимми Картер.»\n- Рональд Рейган (В те годы Джимми Картер был президентом)"
 LOADING_TIP_2: "«Анекдотов куча пошло на тему, что Россия — родина слонов, а она на самом деле родина.»\n- Михаил Горбачев"
 LOADING_TIP_3: "«Говорят, что политика — вторая древнейшая профессия. Но я пришел к выводу, что у нее гораздо больше общего с первой.»\n- Рональд Рейган"
 LOADING_TIP_4: "«Вы бы слышали, как Громыко как-то сказал про этого человека: «Да, я сделал ошибку, предложил Горбачева на пост руководителя КПСС. Он оказался предателем.»\n- Дмитрий Язов"
 LOADING_TIP_5: "«Мои соотечественники американцы, я рад сообщить вам сегодня, что подписал указ об объявлении России вне закона на вечные времена. Бомбардировка начнется через пять минут.»\n- Рональд Рейган"
 LOADING_TIP_6: "«Кризис был, пожалуй, самым острым и опасным эпизодом холодной войны, когда советско-американские взаимоотношения достигли критической черты. Стороны стояли на грани всеобщей ракетно-ядерной войны, а Куба оказалась в самом эпицентре тех событий.»\n- Дмитрий Язов"
 LOADING_TIP_7: "«Маркс и Спенсер» победили Карла Маркса и Энгельса.»\n- Маргарет Тетчер"
 LOADING_TIP_8: "«Генеральный секретарь Горбачев, если вы ищете мира, если вы ищете процветания для Советского Союза и Восточной Европы, если вы ищете либерализации, приезжайте сюда к этим воротам, господин Горбачев, откройте эти ворота. Господин Горбачев, снесите эту стену!»\n- Рональд Рейган"
 LOADING_TIP_9: "«Проблема социализма в том, что в конце концов у вас заканчиваются чужие деньги.»\n- Маргарет Тетчер"
 LOADING_TIP_10: "«Это умнейший человек, африканский Карл Маркс, ливийский Гарибальди, и у него было огромное количество денег.»\n- Владимир Жириновский (О Муаммаре Каддафи)"
 LOADING_TIP_11: "«Вера, захватившая разум и душу — сильнее научной мысли.»\n- Франсуа Миттеран"
 LOADING_TIP_12: "«И Бог иногда ошибался. Я — нет.»\n- Франсуа Миттеран"
 LOADING_TIP_13: "«Битва против несправедливости — это одна из самых прекрасных битв. Она определила мой политический выбор, и я по-прежнему считаю, что поступил правильно…»\n- Франсуа Миттеран"
 LOADING_TIP_14: "«Ни бык, ни осёл не могут остановить прогресс социализма.»\n- Эрих Хонеккер"
 LOADING_TIP_15: "«Стена будет стоять ещё 50 и даже 100 лет, если не будут устранены причины для этого.»\n- Эрих Хонеккер"
 LOADING_TIP_16: "«У меня всего лишь два недостатка. Плохая память и ещё что-то.»\n- Дэн Сяопин"
 LOADING_TIP_17: "«Даже самый густой лес состоит из отдельных деревьев.»\n- Ким Ир Сен"
 LOADING_TIP_18: "«Чтобы стать революционером, влияние родителей важно, но ещё важнее собственные субъективные усилия.»\n- Ким Ир Сен"
 LOADING_TIP_19: "«Если вы хотите контролировать мир, вы должны контролировать нефть, а для этого одно из главных условий – сломить Ирак.»\n- Саддам Хусейн"
 LOADING_TIP_20: "«Вы, американцы, вы обращаетесь с Третьим миром приблизительно как иракский крестьянин со своей невестой: три дня медовый месяц, а потом – марш в поле.»\n- Саддам Хусейн"
 LOADING_TIP_21: "«Мы должны попытаться изменить промышленную структуру Японии таким образом, чтобы она не причиняла вреда другим странам. В противном случае Япония может в одночасье исчезнуть с лица земли, как Карфаген . Сможем ли мы и дальше жить с избытком в 30-40 миллиардов долларов в год? Это как играть в маджонг – если ты постоянно выигрываешь, с тобой больше никто не играет.»\n- Ясухиро Накасонэ"
 LOADING_TIP_22: "«Это совсем немного! Если бы Горбачев сказал: дайте нам сотню миллиардов, и получите ГДР, — мы так бы и сделали. Что такое сто миллиардов за Восточные земли при их годовом бюджете в пятьсот миллиардов? Да ГДР нам досталась по цене бутерброда!»\n- Гельмут Коль"
 LOADING_TIP_23: "« Германия — наше отечество, объединенная Евро­па — наше будущее.»\n- Гельмут Коль"
 LOADING_TIP_24: "«У Ирака нет оружия массового поражения, никакого. Такое оружие – не таблетки, которые можно спрятать. Понять, есть оно в Ираке или нет, легко»\n- Саддам Хусейн"
 LOADING_TIP_25: "«Берите суверенитета столько, сколько вы его сможете проглотить.»\n- Борис Ельцин"
 LOADING_TIP_26: "«Если цены станут неуправляемы, превысят более чем в три-четыре раза, я сам лягу на рельсы.»\n- Борис Ельцин"
 LOADING_TIP_27: "«Девальвации не будет. Это я заявляю твердо и четко.»\n- Борис Ельцин"
 LOADING_TIP_28: "«Я ухожу. Я сделал все, что мог...»\n- Борис Ельцин"
 LOADING_TIP_29: "«К катастрофе идет не народ, к ней идут отдельные личности.»\n- Янош Кадар"
 LOADING_TIP_30: "«Неправда, что власть развращает; на самом деле есть политики, которые развращают власть.»\n- Фелипе Гонсалес"
 LOADING_TIP_31: "«Я занимался своего рода «улучшением» структуры Японии. На протяжении 110 лет, со времен реставрации Мэйдзи, Япония стремилась догнать Америку и Великобританию. В 1970-х годах мы это сделали. Но после этого [государственное] регулирование лишь препятствует росту экономики. Если у государственных чиновников слишком много власти, частный сектор экономики не будет развиваться. Нам нужно было изменить систему.»\n- Ясухиро Накасонэ"
 LOADING_TIP_32: "«Моя мечта — это сильная Европа и развивающийся Азиатско-Тихоокеанский регион, объединенные взаимным процветанием и работающие вместе на общее благо всех народов.»\n- Ясухиро Накасонэ"
 LOADING_TIP_33: "«Как бы ни была хороша система, она бесполезна, если народ её не принимает. Я считаю, что внутренняя функция политики заключается в том, чтобы реализовывать волю народа — хотя бы на временной основе — и обеспечивать её эффективную работу.»\n- Чон Ду Хван"
 LOADING_TIP_34: "«У Пакистана есть ядерное оружие, но нет безопасности. С другой стороны, у нас нет ядерного оружия, но мы безопасная страна, мы можою безопасность. Посему производство ядерного оружия признаётся харамом на основании фетвы аятоллы Хаменеи и не подлежит пересмотру.»\n- Али Хаменеи"
 LOADING_TIP_35: "«Должна вестись бескомпромиссная борьба с преступностью, правонарушениями невзирая на лица, ранги…»\n- Борис Пуго"
 LOADING_TIP_36: "«Равноудаленность во внешней политике России, следование своим национальным интересам — оптимальный путь для внешней политики Российского государства.»\n- Владимир Крючков"
 LOADING_TIP_37: "«С фальсификаторами истории надо бороться.»\n- Дмитрий Язов"
 LOADING_TIP_38: "«Это большое счастье — родиться в Индии и быть наследником ее великой цивилизации. У нас есть многое, что нужно сохранить для нашего народа, и мы многое можем дать миру.»\n- Раджив Ганди"
 LOADING_TIP_39: "«Демократия в самой себе несет зерно собственного разрушения, демократию необходимо время от времени купать в крови, чтобы она оставалась демократией.»\n- Аугусто Пиночет"
 LOADING_TIP_40: "«Я не диктатор. У меня просто сердитое лицо.»\n- Аугусто Пиночет"